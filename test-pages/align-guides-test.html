<!doctype html>
<meta charset="utf-8">
<title>ALIGNGUIDES …</title>
<style>
  body { margin:0; background:#0d1116; color:#cfd8dc; font:13px/1.5 sans-serif; padding:14px; }
  h1 { font-size:15px; margin:0 0 10px; }
  #summary { font-size:14px; font-weight:bold; margin:10px 0; padding:8px 10px; border-radius:5px; }
  .okbg { background:#12331f; color:#69f0ae; } .badbg { background:#3a1414; color:#ff8a80; }
  .row { display:flex; justify-content:space-between; gap:10px; padding:2px 0; border-bottom:1px solid #1c2530; }
  .pass { color:#69f0ae; } .fail { color:#ff5252; }
  .name { color:#90caf9; } .extra { color:#ffd54f; font-size:11px; }
  h2 { font-size:12px; color:#80cbc4; margin:14px 0 4px; }
  #stage { position:fixed; left:0; top:0; width:900px; height:700px; opacity:0; pointer-events:none; }
</style>
<h1>Universal cross-category alignment guides — pool, precedence, painter</h1>
<div id="summary">Running…</div>
<div id="rows"></div>
<canvas id="stage" width="900" height="700"></canvas>

<!-- Drives the REAL Planner + the REAL canvas-interact drag flows (bundled)
     over an in-page fake HaApi (the wall-edit-test / undo-test seam). Build:
       T=$(mktemp -d); cp -r src/* "$T"/
       cp test-pages/fake-avatar-store.ts "$T"/avatar-store.ts
       printf "export { Planner } from './planner.js';\nexport * from './canvas-interact.js';\nexport { drawAll, furnRotateHandlePx, FURN_ROTATE_OFFSET_PX } from './canvas-render.js';\nexport { nearestAlign, bestAlignShift, ALIGN_DRAG_KINDS, ALIGN_POLY_DRAG_KINDS, resolveFurnitureWallCollision } from './geometry.js';\n" > "$T"/align-entry.ts
       npx esbuild "$T"/align-entry.ts --bundle --format=esm --outfile=<harness>/align.mod.js
     Run headless (serve over http — Chrome blocks dynamic module imports on file://):
       (cd <harness> && python3 -m http.server <port> &)
       google-chrome --headless=new --disable-gpu --use-angle=swiftshader \
         --enable-unsafe-swiftshader --run-all-compositor-stages-before-draw \
         --window-size=1200,900 --virtual-time-budget=30000 --dump-dom \
         "http://localhost:<port>/align-guides-test.html" | grep -o "<title>[^<]*" -->
<script type="module">
  const V = '?v=' + Date.now();
  const M = await import('./align.mod.js' + V);
  const {
    Planner, drawAll, furnRotateHandlePx, FURN_ROTATE_OFFSET_PX,
    onCanvasMouseDown, onCanvasMouseMove, onCanvasMouseUp, onCanvasClick,
    nearestAlign, bestAlignShift, ALIGN_DRAG_KINDS, ALIGN_POLY_DRAG_KINDS,
    resolveFurnitureWallCollision,
  } = M;

  const results = [];
  const ok = (name, cond, extra = '') => results.push({ name, pass: !!cond, extra: String(extra) });
  const near = (a, b, eps = 1e-6) => Math.abs(a - b) <= eps;
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  async function waitFor(cond, tries = 600) {
    for (let i = 0; i < tries; i++) { if (cond()) return true; await sleep(4); }
    return !!cond();
  }
  const clone = x => JSON.parse(JSON.stringify(x));

  class FakeHa {
    constructor(seed) {
      this.map = new Map();
      for (const [k, v] of Object.entries(seed || {})) this.map.set(k, clone(v));
      this.states = {}; this._stateCbs = []; this._connCbs = [];
    }
    connect() { for (const cb of this._connCbs) cb('connected'); for (const cb of this._stateCbs) cb(this.states, undefined); }
    onState(fn) { this._stateCbs.push(fn); }
    onConn(fn) { this._connCbs.push(fn); }
    callService() { return Promise.resolve(); }
    async getHistory() { return {}; } async getWeatherForecasts() { return null; }
    async getDevices() { return []; } async getEntityRegistry() { return []; }
    async updateEntityRegistry() { return true; }
    async getUserData(k) { return this.map.has(k) ? clone(this.map.get(k)) : null; }
    async setUserData(k, v) { this.map.set(k, clone(v)); return true; }
    async refreshStates() {} async subscribeMqtt() { return () => {}; } async publishMqtt() {}
  }

  function floor(id, name, extra = {}) {
    return {
      id, name, w: 20000, d: 16000,
      walls: [], furniture: [], lights: [], switches: [], sensors: [], motionSensors: [],
      roamers: [], envSensors: [], doors: [], windows: [], bg: null, rooms: [], bleProxies: [],
      alarmPanels: [], calendarPanels: [], thermostats: [], safetySensors: [], alertBeacons: [],
      robots: [], presenceZones: [], cameras: [], projectors: [], valves: [], plugs: [],
      sprinklerZones: [], flagpoles: [], infoCards: [], actionButtons: [], rulers: [],
      groundAreas: [], voidAreas: [], pools: [], ...extra,
    };
  }
  const makeStore = (floors, extra = {}) => ({
    v: 2, floors, currentFloorId: floors[0].id, activeSensorId: null,
    coverage: true, imperial: false, showDetails: false, useRawTargets: false, ...extra,
  });
  const LEGACY = 'diorama';
  async function freshPlanner(store) {
    localStorage.removeItem('diorama:store:v1');
    localStorage.removeItem('diorama:configs');
    for (const k of ['diorama:wall:angleSnap', 'diorama:wall:gridSnap', 'diorama:wall:weld']) localStorage.removeItem(k);
    const p = new Planner();
    p.connectWith(new FakeHa({ [LEGACY]: store }));
    await waitFor(() => p.configIndex !== null && p.store.floors[0].id === store.floors[0].id);
    return p;
  }

  // ── Canvas / view plumbing (wall-edit-test recipe) ─────────────────────────
  const canvas = document.getElementById('stage');
  const view = { ox: 40, oy: 620, scale: 0.05 };  // 1 mm = 0.05 px ⇒ 8 px tol = 160 mm
  const TOL_MM = 8 / view.scale;
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const evAt = (mx, my, opts = {}) => ({
    clientX: rect.left + (mx * view.scale + view.ox) / dpr,
    clientY: rect.top + (view.oy - my * view.scale) / dpr,
    altKey: !!opts.alt, shiftKey: false, ctrlKey: false, metaKey: false,
    button: opts.button ?? 0, buttons: 1,
    preventDefault() {}, stopPropagation() {},
  });
  // Press at `from`, move to `to`, optionally release. Returns the planner.
  function drag(p, from, to, opts = {}) {
    onCanvasMouseDown(p, canvas, view, evAt(from.x, from.y, opts));
    onCanvasMouseMove(p, canvas, view, evAt(to.x, to.y, opts));
    if (opts.release !== false) onCanvasMouseUp(p, canvas, evAt(to.x, to.y, opts));
    return p;
  }
  const guideX = p => p.alignGuides.filter(g => g.axis === 'x').map(g => g.mm);
  const guideY = p => p.alignGuides.filter(g => g.axis === 'y').map(g => g.mm);

  const mkWall = (id, pts, extra = {}) => ({ id, points: pts.map(q => ({ ...q })), kind: 'full', ...extra });
  const mkFurn = (id, x, y, extra = {}) =>
    ({ id, kind: 'table', x, y, w: 1200, h: 800, rotation: 0, elevation: 0, ...extra });

  try {
    // ── (1) Pure helpers ────────────────────────────────────────────────────
    ok('1: nearestAlign picks the nearest in tol', nearestAlign(1005, [1000, 1004], 8) === 1004);
    ok('1: nearestAlign outside tol → null', nearestAlign(1005, [1000], 3) === null);
    {
      const s = bestAlignShift([1000, 5000], [4980, 900], 60);
      ok('1: bestAlignShift takes the SMALLEST magnitude shift', s && s.mm === 4980 && near(s.delta, -20), JSON.stringify(s));
      ok('1: bestAlignShift outside tol → null', bestAlignShift([1000], [1200], 60) === null);
      ok('1: bestAlignShift empty values → null', bestAlignShift([], [1000], 60) === null);
      const t = bestAlignShift([1000], [1000], 60);
      ok('1: bestAlignShift exact hit → delta 0', t && t.delta === 0, JSON.stringify(t));
    }

    // ── (2) The shared kind set (snapper + painter can't diverge) ───────────
    for (const k of ['sensor', 'motion', 'env', 'ble', 'safety', 'alert', 'robot', 'camera',
                     'projector', 'fixture', 'furnMove', 'info', 'wallv', 'wallMove',
                     'roomAnchor', 'groundVert', 'pzoneVert', 'voidVert', 'poolVert',
                     'pathVert', 'groundMove', 'pzoneMove', 'poolMove', 'voidMove'])
      ok(`2: ALIGN_DRAG_KINDS has '${k}'`, ALIGN_DRAG_KINDS.has(k));
    for (const k of ['doorMove', 'windowMove', 'vert', 'zonemove', 'rulerEnd', 'bgCorner',
                     'bgMove', 'alarm', 'calendar', 'thermostat', 'action', 'furnCorner'])
      ok(`2: ALIGN_DRAG_KINDS excludes '${k}'`, !ALIGN_DRAG_KINDS.has(k));
    ok('2: poly subset ⊆ align set', [...ALIGN_POLY_DRAG_KINDS].every(k => ALIGN_DRAG_KINDS.has(k)));
    ok('2: a fixture kind is NOT in the poly subset', !ALIGN_POLY_DRAG_KINDS.has('furnMove'));

    // ── (3) Cross-category: furniture centre aligns to a WALL VERTEX x ──────
    {
      const p = await freshPlanner(makeStore([floor('f1', 'Home', {
        walls: [mkWall('w1', [{ x: 6000, y: 2000 }, { x: 6000, y: 9000 }])],
        furniture: [mkFurn('fu1', 3000, 3000)],
      })]));
      drag(p, { x: 3000, y: 3000 }, { x: 6000 - 100, y: 3000 }, { release: false });
      const fu = p.floor().furniture[0];
      ok('3: furniture snapped to the wall vertex x', near(fu.x, 6000), fu.x);
      ok('3: guide recorded on x=6000', guideX(p).includes(6000), JSON.stringify(p.alignGuides));
      ok('3: y untouched (no candidate near)', near(fu.y, 3000), fu.y);
      onCanvasMouseUp(p, canvas, evAt(6000, 3000));
      ok('3: guides cleared on release', p.alignGuides.length === 0);
      ok('3: pool dropped on release', p.alignPool === null);
    }

    // ── (4) Tolerance boundary: 7 px yes, 9 px no ──────────────────────────
    for (const [px, want] of [[7, true], [9, false]]) {
      const off = px / view.scale;             // px → mm at this view scale
      const p = await freshPlanner(makeStore([floor('f1', 'Home', {
        walls: [mkWall('w1', [{ x: 6000, y: 2000 }, { x: 6000, y: 9000 }])],
        furniture: [mkFurn('fu1', 3000, 3000)],
      })]));
      drag(p, { x: 3000, y: 3000 }, { x: 6000 - off, y: 3000 }, { release: false });
      const fu = p.floor().furniture[0];
      ok(`4: ${px} px offset ⇒ ${want ? 'snaps' : 'no snap'}`, near(fu.x, want ? 6000 : 6000 - off, 1e-6), fu.x);
      onCanvasMouseUp(p, canvas, evAt(0, 0));
    }
    ok('4: harness tol matches the 8 px rule', near(TOL_MM, 160));

    // ── (5) Self-exclusion ─────────────────────────────────────────────────
    {
      // Furniture alone on the floor: nothing to align to (its own centre is out).
      const p = await freshPlanner(makeStore([floor('f1', 'Home', {
        furniture: [mkFurn('fu1', 3000, 3000)],
      })]));
      drag(p, { x: 3000, y: 3000 }, { x: 3050, y: 3020 }, { release: false });
      ok('5: dragged item is excluded from its own pool', p.alignGuides.length === 0, JSON.stringify(p.alignGuides));
      ok('5: pool is empty on a bare floor', p.alignPool.xs.length === 0, p.alignPool.xs.length);
      onCanvasMouseUp(p, canvas, evAt(0, 0));
    }
    {
      // Wall vertex drag: the wall's OWN other vertex must not attract it.
      const p = await freshPlanner(makeStore([floor('f1', 'Home', {
        walls: [mkWall('w1', [{ x: 4000, y: 2000 }, { x: 9000, y: 2000 }, { x: 9000, y: 7000 }])],
      })]));
      p.setWallAngleSnap(false);
      drag(p, { x: 4000, y: 2000 }, { x: 9000 - 60, y: 5000 }, { release: false });
      const w = p.floor().walls[0];
      ok('5: own wall vertices excluded (no x snap to 9000)', !near(w.points[0].x, 9000), w.points[0].x);
      onCanvasMouseUp(p, canvas, evAt(0, 0));
    }

    // ── (6) Wall vertex aligns to a ROOM ANCHOR, overriding the angle lock ──
    {
      const p = await freshPlanner(makeStore([floor('f1', 'Home', {
        walls: [mkWall('w1', [{ x: 2000, y: 2000 }, { x: 6000, y: 2000 }])],
        rooms: [{ id: 'rm1', name: 'Kitchen', anchor: { x: 12000, y: 9000 } }],
      })]));
      // Drag the FAR endpoint toward (12000-60, 9000-60): the 15° lock off
      // (2000,2000) would place it elsewhere; alignment must win on both axes.
      drag(p, { x: 6000, y: 2000 }, { x: 12000 - 60, y: 9000 - 60 }, { release: false });
      const v = p.floor().walls[0].points[1];
      ok('6: wall vertex snapped to the room anchor x', near(v.x, 12000), v.x);
      ok('6: wall vertex snapped to the room anchor y', near(v.y, 9000), v.y);
      ok('6: guides on both axes', guideX(p).includes(12000) && guideY(p).includes(9000), JSON.stringify(p.alignGuides));
      ok('6: alignment overrode the 15° angle snap', p.wallAngleSnap === true);
      onCanvasMouseUp(p, canvas, evAt(0, 0));
    }

    // ── (7) Alt suspends alignment (wall vertex AND furniture) ─────────────
    {
      const p = await freshPlanner(makeStore([floor('f1', 'Home', {
        walls: [mkWall('w1', [{ x: 2000, y: 2000 }, { x: 6000, y: 2000 }])],
        rooms: [{ id: 'rm1', name: 'Kitchen', anchor: { x: 12000, y: 9000 } }],
      })]));
      drag(p, { x: 6000, y: 2000 }, { x: 12000 - 60, y: 9000 - 60 }, { release: false, alt: true });
      const v = p.floor().walls[0].points[1];
      ok('7: Alt → no align snap on a wall vertex', !near(v.x, 12000) && !near(v.y, 9000), `${v.x},${v.y}`);
      ok('7: Alt → raw mm preserved (no grid either)', near(v.x, 11940) && near(v.y, 8940), `${v.x},${v.y}`);
      ok('7: Alt → no guides drawn', p.alignGuides.length === 0);
      onCanvasMouseUp(p, canvas, evAt(0, 0));
    }
    {
      const p = await freshPlanner(makeStore([floor('f1', 'Home', {
        walls: [mkWall('w1', [{ x: 6000, y: 2000 }, { x: 6000, y: 9000 }])],
        furniture: [mkFurn('fu1', 3000, 3000)],
      })]));
      drag(p, { x: 3000, y: 3000 }, { x: 6000 - 100, y: 3000 }, { release: false, alt: true });
      ok('7: Alt → no align snap on furniture', near(p.floor().furniture[0].x, 5900), p.floor().furniture[0].x);
      onCanvasMouseUp(p, canvas, evAt(0, 0));
    }

    // ── (8) Weld still wins at release, inside weld range ──────────────────
    {
      // w2's free end is dragged near w1's endpoint; a room anchor 120 mm off
      // pulls the align snap, but the release weld must land it ON w1's corner.
      const p = await freshPlanner(makeStore([floor('f1', 'Home', {
        walls: [
          mkWall('w1', [{ x: 8000, y: 3000 }, { x: 8000, y: 9000 }]),
          mkWall('w2', [{ x: 2000, y: 3000 }, { x: 5000, y: 3000 }]),
        ],
        rooms: [{ id: 'rm1', name: 'Kitchen', anchor: { x: 7880, y: 3000 } }],
      })]));
      p.setWallAngleSnap(false);
      onCanvasMouseDown(p, canvas, view, evAt(5000, 3000));
      onCanvasMouseMove(p, canvas, view, evAt(7900, 3000));
      const midX = p.floor().walls[1].points[1].x;
      ok('8: mid-drag the align guide won (room anchor)', near(midX, 7880), midX);
      onCanvasMouseUp(p, canvas, evAt(7900, 3000));
      const end = p.floor().walls[1].points[1];
      ok('8: release WELD wins over the aligned position', near(end.x, 8000) && near(end.y, 3000), `${end.x},${end.y}`);
    }

    // ── (9) roomAnchor drag aligns to a fixture centre ─────────────────────
    {
      const p = await freshPlanner(makeStore([floor('f1', 'Home', {
        rooms: [{ id: 'rm1', name: 'Kitchen', anchor: { x: 3000, y: 3000 } }],
        motionSensors: [{ id: 'mo1', x: 9000, y: 5000, heading: 0, fov: 90, range: 5000, label: 'M' }],
      })]));
      // The room label hit map is published by drawAll, so paint one frame first.
      drawAll(canvas.getContext('2d'), p, view);
      onCanvasMouseDown(p, canvas, view, evAt(3000, 3000));
      const started = p.drag && p.drag.kind === 'roomAnchor';
      ok('9: pressing the room label starts a roomAnchor drag', started, p.drag && p.drag.kind);
      if (started) {
        onCanvasMouseMove(p, canvas, view, evAt(9000 - 80, 5000 - 80));
        const a = p.floor().rooms[0].anchor;
        ok('9: anchor snapped to the motion sensor centre', near(a.x, 9000) && near(a.y, 5000), `${a.x},${a.y}`);
        onCanvasMouseUp(p, canvas, evAt(0, 0));
      } else { ok('9: anchor snapped to the motion sensor centre', false, 'no drag'); }
    }

    // ── (10) Polygon vertex drag aligns to ANOTHER shape's vertex ──────────
    {
      const p = await freshPlanner(makeStore([floor('f1', 'Home', {
        groundAreas: [
          { id: 'g1', name: 'Lawn', kind: 'grass', points: [{ x: 1000, y: 1000 }, { x: 4000, y: 1000 }, { x: 4000, y: 4000 }] },
          { id: 'g2', name: 'Patio', kind: 'concrete', points: [{ x: 9000, y: 6000 }, { x: 12000, y: 6000 }, { x: 12000, y: 9000 }] },
        ],
      })]));
      p.activeGroundAreaId = 'g1';
      drawAll(canvas.getContext('2d'), p, view);
      onCanvasMouseDown(p, canvas, view, evAt(4000, 4000));
      const kind = p.drag && p.drag.kind;
      ok('10: pressing a vertex handle starts groundVert', kind === 'groundVert', kind);
      onCanvasMouseMove(p, canvas, view, evAt(9000 - 90, 6000 - 90));
      const v = p.floor().groundAreas[0].points[2];
      ok('10: vertex snapped to the OTHER area\'s vertex', near(v.x, 9000) && near(v.y, 6000), `${v.x},${v.y}`);
      ok('10: pool included other-shape vertices', p.alignPool.xs.includes(12000), p.alignPool.xs.length);
      onCanvasMouseUp(p, canvas, evAt(0, 0));
    }

    // ── (11) Body move aligns its BBOX CENTRE ─────────────────────────────
    {
      const p = await freshPlanner(makeStore([floor('f1', 'Home', {
        groundAreas: [
          { id: 'g1', name: 'Lawn', kind: 'grass', points: [{ x: 1000, y: 1000 }, { x: 3000, y: 1000 }, { x: 3000, y: 3000 }, { x: 1000, y: 3000 }] },
        ],
        motionSensors: [{ id: 'mo1', x: 9000, y: 5000, heading: 0, fov: 90, range: 5000, label: 'M' }],
      })]));
      p.activeGroundAreaId = 'g1';       // already selected ⇒ body press = move
      drawAll(canvas.getContext('2d'), p, view);
      // bbox centre starts at (2000,2000); aim it 70 mm short of (9000,5000).
      onCanvasMouseDown(p, canvas, view, evAt(2000, 2000));
      ok('11: press on a SELECTED area body starts groundMove', p.drag && p.drag.kind === 'groundMove', p.drag && p.drag.kind);
      onCanvasMouseMove(p, canvas, view, evAt(2000 + 7000 - 70, 2000 + 3000 - 70));
      const pts = p.floor().groundAreas[0].points;
      const cx = (Math.min(...pts.map(q => q.x)) + Math.max(...pts.map(q => q.x))) / 2;
      const cy = (Math.min(...pts.map(q => q.y)) + Math.max(...pts.map(q => q.y))) / 2;
      ok('11: bbox centre landed on the fixture centre', near(cx, 9000) && near(cy, 5000), `${cx},${cy}`);
      const w = Math.max(...pts.map(q => q.x)) - Math.min(...pts.map(q => q.x));
      ok('11: shape stayed rigid (width unchanged)', near(w, 2000), w);
      ok('11: guides on both axes', guideX(p).includes(9000) && guideY(p).includes(5000), JSON.stringify(p.alignGuides));
      onCanvasMouseUp(p, canvas, evAt(0, 0));
    }

    // ── (12) Whole-wall move aligns on one of ITS OWN points ──────────────
    {
      const p = await freshPlanner(makeStore([floor('f1', 'Home', {
        walls: [
          mkWall('w1', [{ x: 2000, y: 2000 }, { x: 5000, y: 2000 }]),
          mkWall('w2', [{ x: 14000, y: 11000 }, { x: 14000, y: 13000 }]),
        ],
      })]));
      // Press OFF the segment midpoint — that is the vertex-INSERT ghost.
      onCanvasMouseDown(p, canvas, view, evAt(2600, 2000));
      ok('12: press on a wall body starts wallMove', p.drag && p.drag.kind === 'wallMove', p.drag && p.drag.kind);
      onCanvasMouseMove(p, canvas, view, evAt(2600 + 8940, 2000 + 8940));
      const w1 = p.floor().walls[0];
      ok('12: an endpoint landed on the other wall\'s x', near(w1.points[1].x, 14000), w1.points[1].x);
      ok('12: an endpoint landed on the other wall\'s y', near(w1.points[0].y, 11000) || near(w1.points[1].y, 11000),
         `${w1.points[0].y},${w1.points[1].y}`);
      const len = Math.hypot(w1.points[1].x - w1.points[0].x, w1.points[1].y - w1.points[0].y);
      ok('12: wall stayed rigid (length unchanged)', near(len, 3000, 1e-6), len);
      onCanvasMouseUp(p, canvas, evAt(0, 0));
    }

    // ── (13) Pool composition: one of EVERY documented source ─────────────
    {
      const f = floor('f1', 'Home', {
        walls: [mkWall('w1', [{ x: 100, y: 110 }, { x: 120, y: 130 }])],
        rooms: [{ id: 'rm1', name: 'K', anchor: { x: 200, y: 210 } }],
        lights: [{ id: 'l1', x: 300, y: 310, entity_id: null }],
        switches: [{ id: 'sw1', x: 400, y: 410, entity_id: null }],
        sensors: [{ id: 's1', x: 500, y: 510, heading: 0, fov: 60, range: 6000, label: 'S', deviceSlug: null }],
        motionSensors: [{ id: 'mo1', x: 600, y: 610, heading: 0, fov: 90, range: 5000, label: 'M' }],
        envSensors: [{ id: 'e1', x: 700, y: 710 }],
        bleProxies: [{ id: 'b1', name: 'B', x: 800, y: 810 }],
        alarmPanels: [{ id: 'al1', x: 900, y: 910 }],
        calendarPanels: [{ id: 'ca1', x: 1000, y: 1010 }],
        thermostats: [{ id: 'th1', x: 1100, y: 1110 }],
        safetySensors: [{ id: 'sa1', kind: 'smoke', x: 1200, y: 1210 }],
        alertBeacons: [{ id: 'ab1', x: 1300, y: 1310 }],
        robots: [{ id: 'ro1', kind: 'vacuum', x: 1400, y: 1410 }],
        cameras: [{ id: 'cm1', x: 1500, y: 1510 }],
        projectors: [{ id: 'pj1', x: 1600, y: 1610 }],
        valves: [{ id: 'vl1', x: 1700, y: 1710 }],
        plugs: [{ id: 'pl1', x: 1800, y: 1810 }],
        sprinklerZones: [{ id: 'sp1', x: 1900, y: 1910 }],
        flagpoles: [{ id: 'fp1', x: 2000, y: 2010 }],
        infoCards: [{ id: 'ic1', x: 2100, y: 2110 }],
        actionButtons: [{ id: 'ac1', x: 2200, y: 2210 }],
        furniture: [mkFurn('fu1', 2300, 2310), mkFurn('fuDrag', 9000, 9000)],
        groundAreas: [{ id: 'g1', name: 'L', kind: 'grass', points: [{ x: 2400, y: 2410 }, { x: 2500, y: 2410 }, { x: 2500, y: 2510 }] }],
        pools: [{ id: 'po1', name: 'P', kind: 'pool', points: [{ x: 2600, y: 2610 }, { x: 2700, y: 2610 }, { x: 2700, y: 2710 }] }],
        voidAreas: [{ id: 'vo1', points: [{ x: 2800, y: 2810 }, { x: 2900, y: 2810 }, { x: 2900, y: 2910 }] }],
        presenceZones: [{ id: 'pz1', name: 'Z', points: [{ x: 3000, y: 3010 }, { x: 3100, y: 3010 }, { x: 3100, y: 3110 }] }],
      });
      const p = await freshPlanner(makeStore([f]));
      // FIXTURE-style drag (furniture): corners + anchors + centres, no poly verts.
      drag(p, { x: 9000, y: 9000 }, { x: 9500, y: 9500 }, { release: false });
      const xs = p.alignPool.xs;
      const want = [100, 120, 200, 300, 400, 500, 600, 700, 800, 900, 1000, 1100, 1200,
                    1300, 1400, 1500, 1600, 1700, 1800, 1900, 2000, 2100, 2200, 2300];
      for (const v of want) ok(`13: pool has x=${v}`, xs.includes(v), xs.length);
      ok('13: fixture drag pool EXCLUDES polygon vertices', !xs.includes(2400) && !xs.includes(2600) && !xs.includes(2800) && !xs.includes(3000), xs.length);
      ok('13: fixture drag pool excludes the dragged piece', !xs.includes(9000), xs.length);
      ok('13: fixture-drag pool size', xs.length === want.length, `${xs.length} candidates`);
      onCanvasMouseUp(p, canvas, evAt(0, 0));

      // POLY drag on the SAME floor: the same pool PLUS other shapes' vertices.
      p.activeGroundAreaId = 'g1';
      drawAll(canvas.getContext('2d'), p, view);
      onCanvasMouseDown(p, canvas, view, evAt(2400, 2410));
      onCanvasMouseMove(p, canvas, view, evAt(2405, 2415));
      const pxs = p.alignPool.xs;
      ok('13: poly drag pool ADDS other shapes\' vertices', pxs.includes(2600) && pxs.includes(2800) && pxs.includes(3000), pxs.length);
      ok('13: poly drag pool excludes the dragged shape', !pxs.includes(2500), pxs.length);
      ok('13: poly-drag pool size', pxs.length === want.length + 9 + 1, `${pxs.length} candidates`);
      onCanvasMouseUp(p, canvas, evAt(0, 0));
    }

    // ── (14) Snapshot discipline + big-floor cost ─────────────────────────
    {
      // 400 furniture pieces + 60 walls ⇒ a "big demo floor" order of magnitude.
      const furniture = [];
      // Sparse 20x20 grid — dense placement would put a neighbour's RESIZE
      // corner handle under the press, which starts furnCorner (not an align kind).
      for (let i = 0; i < 400; i++)
        furniture.push(mkFurn('fu' + i, 500 + (i % 20) * 900, 400 + Math.floor(i / 20) * 700));
      const walls = [];
      for (let i = 0; i < 60; i++) walls.push(mkWall('w' + i, [{ x: i * 300, y: 12000 }, { x: i * 300, y: 15000 }, { x: 1 + i * 300, y: 15000 }]));
      const p = await freshPlanner(makeStore([floor('f1', 'Home', { furniture, walls })]));
      const t0 = performance.now();
      drag(p, { x: 500, y: 400 }, { x: 520, y: 420 }, { release: false });
      const t1 = performance.now();
      ok('14: big-floor pool built once', p.alignPool !== null && p.alignPool.xs.length === 399 + 180,
         `${p.alignPool.xs.length} candidates in ${(t1 - t0).toFixed(2)} ms`);
      const poolRef = p.alignPool;
      for (let i = 0; i < 20; i++) onCanvasMouseMove(p, canvas, view, evAt(600 + i, 500 + i));
      ok('14: pool NOT rebuilt per frame (same object)', p.alignPool === poolRef);
      const t2 = performance.now();
      for (let i = 0; i < 60; i++) onCanvasMouseMove(p, canvas, view, evAt(700 + i, 600 + i));
      const t3 = performance.now();
      ok('14: 60 aligned frames stay cheap', (t3 - t2) / 60 < 5, `${((t3 - t2) / 60).toFixed(3)} ms/frame`);
      onCanvasMouseUp(p, canvas, evAt(0, 0));
      ok('14: pool cleared on release', p.alignPool === null);
    }

    // ── (15) Locked items never move (align must not bypass the lock) ──────
    {
      const p = await freshPlanner(makeStore([floor('f1', 'Home', {
        walls: [mkWall('w1', [{ x: 6000, y: 2000 }, { x: 6000, y: 9000 }])],
        furniture: [mkFurn('fu1', 3000, 3000, { locked: true })],
      })]));
      drag(p, { x: 3000, y: 3000 }, { x: 6000 - 100, y: 3000 }, { release: false });
      ok('15: locked furniture did not move', near(p.floor().furniture[0].x, 3000), p.floor().furniture[0].x);
      ok('15: locked drag drew no guides', p.alignGuides.length === 0);
      onCanvasMouseUp(p, canvas, evAt(0, 0));
    }

    // ── (16) Painter gate: guides only paint for an in-flight align drag ───
    {
      const p = await freshPlanner(makeStore([floor('f1', 'Home', {
        walls: [mkWall('w1', [{ x: 6000, y: 2000 }, { x: 6000, y: 9000 }])],
        furniture: [mkFurn('fu1', 3000, 3000)],
      })]));
      const ctx = canvas.getContext('2d');
      drag(p, { x: 3000, y: 3000 }, { x: 6000 - 100, y: 3000 }, { release: false });
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawAll(ctx, p, view);
      // The guide is a dashed vertical line at x=6000 → px column.
      const gx = Math.round(6000 * view.scale + view.ox);
      const col = ctx.getImageData(gx, 0, 1, canvas.height).data;
      let lit = 0;
      for (let i = 3; i < col.length; i += 4) if (col[i] > 0) lit++;
      ok('16: guide column painted while dragging', lit > 40, `${lit} lit px`);
      onCanvasMouseUp(p, canvas, evAt(0, 0));
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawAll(ctx, p, view);
      const col2 = ctx.getImageData(gx, 0, 1, canvas.height).data;
      let lit2 = 0;
      for (let i = 3; i < col2.length; i += 4) if (col2[i] > 0) lit2++;
      ok('16: guide gone after release', lit2 < lit, `${lit2} lit px`);
    }
    // ── (17) PLACEMENT vs walls: push-out-only, never a magnet ─────────────
    // User report: "when placing a bed, it is getting sucked into the wall
    // instead of being placed near it". resolveFurnitureWallCollision used to
    // act over a 150 mm magnet reach BEYOND the wall face, teleporting any
    // deliberately-gapped drop flush. It now acts ONLY inside the keep-out band.
    // Driven through the REAL drop path (onCanvasClick with a pending kind).
    {
      // 1 mm = 0.5 px ⇒ ≤2 mm of client-px rounding, well inside the 10 mm
      // drop grid, so every target below lands on its exact intended cell.
      const pview = { ox: 20, oy: 660, scale: 0.5 };
      const pEvAt = (mx, my) => ({
        clientX: rect.left + (mx * pview.scale + pview.ox) / dpr,
        clientY: rect.top + (pview.oy - my * pview.scale) / dpr,
        altKey: false, shiftKey: false, ctrlKey: false, metaKey: false,
        button: 0, buttons: 0, preventDefault() {}, stopPropagation() {},
      });
      // Vertical wall on the x = 6000 axis; its LEFT face sits at x = 5950,
      // and a piece rests FLUSH when its near edge is 55 mm off the axis.
      const WALL_X = 6000, FLUSH = 55;
      const KIND = 'table';                        // 1500 × 900 ⇒ half-width 750
      const mkPlan = () => makeStore([floor('f1', 'Home', {
        walls: [mkWall('w1', [{ x: WALL_X, y: 1000 }, { x: WALL_X, y: 11000 }])],
      })]);
      const drop = async (mx, my) => {
        const p = await freshPlanner(mkPlan());
        p.setTool('furniture');
        p.pendingFurnitureKind = KIND;
        p.pendingCustomObjectId = null; p.pendingVehicleModelId = null;
        onCanvasClick(p, canvas, pview, pEvAt(mx, my));
        return p.floor().furniture[0];
      };
      const halfW = 750;
      const flushCx = WALL_X - FLUSH - halfW;      // 5195: the flush resting centre

      // (a) A deliberate 120 mm gap from the FACE is respected verbatim.
      const gapCx = WALL_X - 50 - 120 - halfW;     // 5080 — near edge 170 mm off axis
      {
        const piece = await drop(gapCx, 6000);
        ok('17a: a piece dropped 120 mm off the wall face STAYS put (no magnet)',
          piece && piece.x === gapCx, `x=${piece && piece.x} want=${gapCx}`);
        ok('17a: …and is NOT sitting flush', piece && piece.x !== flushCx,
          `x=${piece && piece.x} flush=${flushCx}`);
      }

      // (b) An overlapping drop is still pushed out to EXACTLY flush.
      {
        const piece = await drop(5500, 6000);      // near edge 250 mm THROUGH the axis
        ok('17b: an overlapping drop is pushed out to exactly flush',
          piece && piece.x === flushCx, `x=${piece && piece.x} want=${flushCx}`);
        ok('17b: …near edge lands 55 mm off the wall axis',
          piece && Math.abs((WALL_X - (piece.x + halfW)) - FLUSH) < 1e-6,
          `edge=${piece && (WALL_X - (piece.x + halfW))}`);
      }

      // (c) Dropped ON the centerline → flush on the side the centre resolves to,
      //     so "flush" is still exactly ONE gesture away.
      {
        const piece = await drop(WALL_X, 6000);
        ok('17c: a drop ON the wall centerline lands flush',
          piece && piece.x === flushCx, `x=${piece && piece.x} want=${flushCx}`);
      }

      // (d) Just INSIDE the keep-out band still settles out; just outside does not.
      {
        const inside = await drop(WALL_X - 40 - halfW, 6000);   // near edge 40 mm off axis
        ok('17d: inside the 55 mm keep-out band → pushed out to flush',
          inside && inside.x === flushCx, `x=${inside && inside.x}`);
        const outside = await drop(WALL_X - 60 - halfW, 6000);  // near edge 60 mm off axis
        ok('17d: just outside the band → untouched',
          outside && outside.x === WALL_X - 60 - halfW, `x=${outside && outside.x}`);
      }

      // (e) The pure resolver agrees (the drop path is not the only consumer —
      //     the drag-release hook calls it too).
      {
        const walls = [{ id: 'w1', kind: 'full', points: [{ x: WALL_X, y: 1000 }, { x: WALL_X, y: 11000 }] }];
        const gapped = { x: gapCx, y: 6000, w: 1500, h: 900, rotation: 0 };
        ok('17e: resolver reports NO move for a gapped piece',
          resolveFurnitureWallCollision(gapped, walls) === false && gapped.x === gapCx,
          `x=${gapped.x}`);
        const sunk = { x: 5500, y: 6000, w: 1500, h: 900, rotation: 0 };
        ok('17e: resolver pushes an overlapping piece out to flush',
          resolveFurnitureWallCollision(sunk, walls) === true && sunk.x === flushCx,
          `x=${sunk.x}`);
      }

      // (f) STAIRS are exempt from the wall push-out (2026-08-09, user-reported
      //     "I need to extend the lower stairway under this room and it will
      //     not allow me even while holding alt"): a flight legitimately runs
      //     under walls/rooms into its shaft — physical.mjs `wallCollidable`
      //     always exempted stairs, and the editor now agrees. Dropped straight
      //     onto the wall band, a stairs piece STAYS where it was dropped.
      {
        const p = await freshPlanner(mkPlan());
        p.setTool('furniture');
        p.pendingFurnitureKind = 'stairs';
        p.pendingCustomObjectId = null; p.pendingVehicleModelId = null;
        onCanvasClick(p, canvas, pview, pEvAt(5900, 6000));   // straddles the wall
        const st = p.floor().furniture[0];
        ok('17f: a stairs piece dropped over the wall band stays put',
          st && st.x === 5900, `x=${st && st.x} kind=${st && st.kind}`);
      }

      // (g) Alt drop = free placement for ANY kind: the table from (b) that a
      //     plain drop pushes to flush stays at the drop point under Alt.
      {
        const p = await freshPlanner(mkPlan());
        p.setTool('furniture');
        p.pendingFurnitureKind = KIND;
        p.pendingCustomObjectId = null; p.pendingVehicleModelId = null;
        onCanvasClick(p, canvas, pview, { ...pEvAt(5500, 6000), altKey: true });
        const piece = p.floor().furniture[0];
        ok('17g: an Alt drop overlapping the wall is NOT pushed out',
          piece && piece.x === 5500, `x=${piece && piece.x}`);
      }

      // (h) The drag-RELEASE hook honors both too: a moved furnMove release
      //     without Alt pushes out; with Alt (or a stairs piece) it sticks.
      //     Driven through the REAL onCanvasMouseUp with a hand-armed drag.
      {
        const release = async (kind, x, alt) => {
          const p = await freshPlanner(mkPlan());
          const fu = { id: 'fu1', x, y: 6000, w: 1500, h: 900, kind, label: '' };
          p.floor().furniture.push(fu);
          // A genuinely-moved drag (start ≠ current) so no click-vs-drag branch
          // (stove/bin/sink) and no Alt-identify (that gate needs an UN-moved
          // release) can swallow the resolver path.
          p.drag = { kind: 'furnMove', idx: 0, start: { x: x - 800, y: 6000 } };
          onCanvasMouseUp(p, canvas, {
            altKey: alt, clientX: 0, clientY: 0,
            preventDefault() {}, stopPropagation() {},
          });
          return fu;
        };
        const plain = await release(KIND, 5500, false);
        ok('17h: plain release overlapping the wall pushes out to flush',
          plain.x === flushCx, `x=${plain.x} want=${flushCx}`);
        const alt = await release(KIND, 5500, true);
        ok('17h: Alt release overlapping the wall STICKS',
          alt.x === 5500, `x=${alt.x}`);
        const stairs = await release('stairs_half', 5500, false);
        ok('17h: a stairs_half release under the wall STICKS without Alt',
          stairs.x === 5500, `x=${stairs.x}`);
      }
    }
    // ── (18) Furniture ROTATE handle ───────────────────────────────────────
    // The only canvas rotation furniture has ever had (the sidebar number field
    // was it). The chip is a pure SCREEN anchor published by the painter, so
    // every case here paints a frame first, exactly like the room-label /
    // vertex-handle sections above.
    {
      const ctx = canvas.getContext('2d');
      const paint = p => { drawAll(ctx, p, view); };
      // px → world mm (the inverse of the harness's evAt mapping).
      const handleMm = id => {
        const h = furnRotateHandlePx.get(id);
        return h ? { x: (h.x - view.ox) / view.scale, y: (view.oy - h.y) / view.scale } : null;
      };
      // A world point at `deg` (screen-CW, 0 = +Y) and `r` mm from the centre.
      const atBearing = (c, deg, r) => ({
        x: c.x + Math.sin(deg * Math.PI / 180) * r,
        y: c.y + Math.cos(deg * Math.PI / 180) * r,
      });
      const bearing = (c, q) => Math.atan2(q.x - c.x, q.y - c.y) * 180 / Math.PI;
      const mkFloor = (extra = {}) => floor('f1', 'Home', {
        furniture: [mkFurn('fu1', 6000, 6000, extra)],
      });
      const C = { x: 6000, y: 6000 };

      // (a) Publication gating: selected + unlocked + edit + select only.
      {
        const p = await freshPlanner(makeStore([mkFloor()]));
        paint(p);
        ok('18a: no handle without a selection', !furnRotateHandlePx.get('fu1'));
        p.activeFurnitureId = 'fu1';
        paint(p);
        const h = furnRotateHandlePx.get('fu1');
        ok('18a: the selected piece publishes a handle', !!h, h && `${Math.round(h.x)},${Math.round(h.y)}`);
        // It floats OUTSIDE the rotated top-right corner (world +X / +Y at rot 0).
        const mm = handleMm('fu1');
        ok('18a: it sits beyond the +X/+Y corner',
          mm && mm.x > C.x + 600 && mm.y > C.y + 400, mm && `${Math.round(mm.x)},${Math.round(mm.y)}`);
        // Tool / mode gates (a kiosk view must not offer an editing affordance).
        p.tool = 'wall'; paint(p);
        ok('18a: no handle outside the Select tool', !furnRotateHandlePx.get('fu1'));
        p.tool = 'select'; p.uiMode = 'kiosk'; paint(p);
        ok('18a: no handle outside edit mode', !furnRotateHandlePx.get('fu1'));
        p.uiMode = 'edit';
      }

      // (b) Locked pieces expose nothing (the handle-refuses-locked rule).
      {
        const p = await freshPlanner(makeStore([mkFloor({ locked: true })]));
        p.activeFurnitureId = 'fu1';
        paint(p);
        ok('18b: a locked piece publishes no handle', !furnRotateHandlePx.get('fu1'));
        onCanvasMouseDown(p, canvas, view, evAt(C.x + 1000, C.y + 800));
        ok('18b: …and pressing there starts no furnRotate drag',
          !p.drag || p.drag.kind !== 'furnRotate', p.drag && p.drag.kind);
        onCanvasMouseUp(p, canvas, evAt(0, 0));
      }

      // (c) Grab → drag 90° → snapped rotation, no jump on grab.
      {
        const p = await freshPlanner(makeStore([mkFloor()]));
        p.activeFurnitureId = 'fu1';
        paint(p);
        const grab = handleMm('fu1');
        const b0 = bearing(C, grab);
        onCanvasMouseDown(p, canvas, view, evAt(grab.x, grab.y));
        ok('18c: pressing the handle starts furnRotate',
          p.drag && p.drag.kind === 'furnRotate', p.drag && p.drag.kind);
        ok('18c: the grab offset is the handle bearing (no jump)',
          p.drag && near(p.drag.grabOffsetDeg, b0, 1e-6), p.drag && p.drag.grabOffsetDeg);
        // Moving to the SAME bearing must leave the piece exactly where it was.
        onCanvasMouseMove(p, canvas, view, evAt(grab.x, grab.y));
        ok('18c: no rotation before the pointer moves', p.floor().furniture[0].rotation === 0,
          p.floor().furniture[0].rotation);
        // …then a quarter turn.
        const q = atBearing(C, b0 + 90, 2000);
        onCanvasMouseMove(p, canvas, view, evAt(q.x, q.y));
        ok('18c: a quarter turn gives rotation 90', near(p.floor().furniture[0].rotation, 90, 1e-6),
          p.floor().furniture[0].rotation);
        ok('18c: the centre never moves',
          p.floor().furniture[0].x === C.x && p.floor().furniture[0].y === C.y,
          `${p.floor().furniture[0].x},${p.floor().furniture[0].y}`);
        // 15° snap: 82° of pointer travel lands on 75, not 82.
        const s = atBearing(C, b0 + 82, 2000);
        onCanvasMouseMove(p, canvas, view, evAt(s.x, s.y));
        ok('18c: rotation snaps to 15° steps', near(p.floor().furniture[0].rotation, 75, 1e-6),
          p.floor().furniture[0].rotation);
        // Wrapping stays in [0, 360).
        const w = atBearing(C, b0 - 90, 2000);
        onCanvasMouseMove(p, canvas, view, evAt(w.x, w.y));
        ok('18c: negative angles wrap to [0,360)', near(p.floor().furniture[0].rotation, 270, 1e-6),
          p.floor().furniture[0].rotation);
        onCanvasMouseUp(p, canvas, evAt(w.x, w.y));
      }

      // (d) Alt = free angle (the wall-edit Alt convention).
      {
        const p = await freshPlanner(makeStore([mkFloor()]));
        p.activeFurnitureId = 'fu1';
        paint(p);
        const grab = handleMm('fu1');
        const b0 = bearing(C, grab);
        onCanvasMouseDown(p, canvas, view, evAt(grab.x, grab.y, { alt: true }));
        const t = atBearing(C, b0 + 37, 2000);
        onCanvasMouseMove(p, canvas, view, evAt(t.x, t.y, { alt: true }));
        const rot = p.floor().furniture[0].rotation;
        ok('18d: Alt gives the free angle', near(rot, 37, 0.05), rot);
        ok('18d: …which is NOT on a 15° step', Math.abs(rot % 15) > 0.5, rot % 15);
        // Release WITHOUT Alt so the drop isn't read as an Alt-identify gesture.
        onCanvasMouseUp(p, canvas, evAt(t.x, t.y));
        ok('18d: the free angle survives release', near(p.floor().furniture[0].rotation, 37, 0.05),
          p.floor().furniture[0].rotation);
      }

      // (e) One gesture = one undo step.
      {
        const p = await freshPlanner(makeStore([mkFloor()]));
        p.activeFurnitureId = 'fu1';
        paint(p);
        ok('18e: clean undo history before the drag', p.canUndo === false, p.canUndo);
        const grab = handleMm('fu1');
        const b0 = bearing(C, grab);
        onCanvasMouseDown(p, canvas, view, evAt(grab.x, grab.y));
        // Several intermediate frames — they must NOT each record a snapshot.
        for (const d of [20, 45, 90]) {
          const q = atBearing(C, b0 + d, 2000);
          onCanvasMouseMove(p, canvas, view, evAt(q.x, q.y));
        }
        const end = atBearing(C, b0 + 90, 2000);
        onCanvasMouseUp(p, canvas, evAt(end.x, end.y));
        ok('18e: rotation committed', near(p.floor().furniture[0].rotation, 90, 1e-6),
          p.floor().furniture[0].rotation);
        ok('18e: the gesture is undoable', p.canUndo === true, p.canUndo);
        p.undo();
        ok('18e: ONE undo restores the original rotation',
          p.floor().furniture[0].rotation === 0, p.floor().furniture[0].rotation);
        ok('18e: …and nothing is left to undo', p.canUndo === false, p.canUndo);
        p.redo();
        ok('18e: redo re-applies it', near(p.floor().furniture[0].rotation, 90, 1e-6),
          p.floor().furniture[0].rotation);
      }

      // (f) Precedence: the handle only wins where it is drawn.
      {
        const p = await freshPlanner(makeStore([mkFloor()]));
        p.activeFurnitureId = 'fu1';
        paint(p);
        onCanvasMouseDown(p, canvas, view, evAt(C.x, C.y));
        ok('18f: pressing the BODY still starts furnMove',
          p.drag && p.drag.kind === 'furnMove', p.drag && p.drag.kind);
        onCanvasMouseUp(p, canvas, evAt(C.x, C.y));
        paint(p);
        // The +X/+Y corner itself (600, 400 from the centre for a 1200×800).
        onCanvasMouseDown(p, canvas, view, evAt(C.x + 600, C.y + 400));
        ok('18f: pressing the CORNER still starts furnCorner',
          p.drag && p.drag.kind === 'furnCorner', p.drag && p.drag.kind);
        onCanvasMouseUp(p, canvas, evAt(C.x + 600, C.y + 400));
      }

      // (g) A hidden furniture layer publishes nothing (the flightHitPx rule).
      {
        const p = await freshPlanner(makeStore([mkFloor()], { layers2d: { furniture: false, appliances: false } }));
        p.activeFurnitureId = 'fu1';
        paint(p);
        ok('18g: a hidden furniture layer is un-rotatable', !furnRotateHandlePx.get('fu1'));
      }

      // (h) Rotation is not translation — it must stay OUT of the align system.
      ok('18h: furnRotate is not an alignment drag', !ALIGN_DRAG_KINDS.has('furnRotate'));
      ok('18h: …nor a polygon drag', !ALIGN_POLY_DRAG_KINDS.has('furnRotate'));
      {
        const p = await freshPlanner(makeStore([floor('f1', 'Home', {
          furniture: [mkFurn('fu1', 6000, 6000)],
          walls: [mkWall('w1', [{ x: 6100, y: 2000 }, { x: 6100, y: 9000 }])],
        })]));
        p.activeFurnitureId = 'fu1';
        paint(p);
        const grab = handleMm('fu1');
        const b0 = bearing(C, grab);
        onCanvasMouseDown(p, canvas, view, evAt(grab.x, grab.y));
        const q = atBearing(C, b0 + 45, 2000);
        onCanvasMouseMove(p, canvas, view, evAt(q.x, q.y));
        ok('18h: a rotate drag draws no guides', p.alignGuides.length === 0,
          JSON.stringify(p.alignGuides));
        ok('18h: …and never nudges the centre toward one',
          p.floor().furniture[0].x === 6000, p.floor().furniture[0].x);
        onCanvasMouseUp(p, canvas, evAt(q.x, q.y));
      }

      // (i) The chip ORBITS with the piece (it hangs off the ROTATED corner).
      {
        const p = await freshPlanner(makeStore([mkFloor()]));
        p.activeFurnitureId = 'fu1';
        paint(p);
        const a = handleMm('fu1');
        p.floor().furniture[0].rotation = 180;
        paint(p);
        const b = handleMm('fu1');
        ok('18i: a 180° piece puts the handle on the opposite side',
          b && b.x < C.x && b.y < C.y && near(b.x - C.x, -(a.x - C.x), 1e-6),
          a && b && `${Math.round(a.x - C.x)},${Math.round(a.y - C.y)} → ${Math.round(b.x - C.x)},${Math.round(b.y - C.y)}`);
        ok('18i: the offset constant is exported for the harness',
          FURN_ROTATE_OFFSET_PX > 0, FURN_ROTATE_OFFSET_PX);
      }
    }
  } catch (err) {
    ok('harness: no exception', false, (err && err.stack) || String(err));
  }

  // ── Report ────────────────────────────────────────────────────────────────
  const passed = results.filter(r => r.pass).length;
  const total = results.length;
  document.getElementById('rows').innerHTML = results.map(r =>
    `<div class="row"><span class="name">${r.name}</span>
     <span class="${r.pass ? 'pass' : 'fail'}">${r.pass ? 'PASS' : 'FAIL'}
     <span class="extra">${r.extra}</span></span></div>`).join('');
  const sum = document.getElementById('summary');
  sum.textContent = `${passed}/${total} passed`;
  sum.className = passed === total ? 'okbg' : 'badbg';
  document.title = `ALIGNGUIDES ${passed === total ? 'PASS' : 'FAIL'} ${passed}/${total}`;
</script>
