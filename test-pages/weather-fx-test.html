<!doctype html>
<meta charset="utf-8">
<title>WFX …</title>
<style>
  html,body{margin:0;background:#0b0f14;color:#cfd8dc;font:13px/1.4 sans-serif}
  #c{width:1000px;height:640px}
  #log{position:fixed;right:8px;top:8px;width:360px;max-height:96vh;overflow:auto;
       background:#111820;border:1px solid #263340;border-radius:6px;padding:8px 10px;font-size:11px}
  .pass{color:#69f0ae}.fail{color:#ff5252}.hd{font-weight:bold;margin:2px 0 6px}
</style>
<div id="c"></div>
<div id="log"></div>
<script type="module">
  // Renderer-harness weather test (W2). Drives ThreeDRenderer.updateWeather then
  // steps the renderer's own per-frame _advanceWeather with a synthesized clock,
  // so particle motion / fog easing / lightning flashes are deterministic. The
  // background _animate RAF cannot interleave — this whole body is synchronous
  // (no awaits after updateWeather), so every read reflects only manual steps.
  const q = new URLSearchParams(location.search);
  const scene = q.get('c') || 'pouring';
  const mod = await import('./assets/three-renderer.js?v=' + Date.now());
  const r = new mod.ThreeDRenderer(document.getElementById('c'));
  await r.load();

  // Minimal floor so _fw/_fd (spawn box) are realistic.
  const floor = {
    id: 'f1', name: 'T', w: 10000, d: 8000,
    walls: [{ id: 'w', points: [{x:200,y:200},{x:9800,y:200},{x:9800,y:7800},{x:200,y:7800},{x:200,y:200}] }],
    furniture: [], lights: [], switches: [], sensors: [], motionSensors: [],
    envSensors: [], doors: [], windows: [], bg: null, model3d: null, look3d: null,
  };
  r.updateFloor(floor, { preset: 'day', floorColor: '#8a7860', floorTex: 'wood', wallColor: '#cfd2d6' });
  r.applyViewPreset('iso');

  const tests = [];
  const ok = (name, cond, detail) => tests.push({ name, ok: !!cond, detail: detail ?? '' });

  const fx = (over) => Object.assign(
    { condition: 'sunny', intensity01: 0, windKmh: 0, windBearingPlanRad: null, isDay: true }, over);

  // Step the renderer's per-frame weather advance N times at dt seconds.
  let clk = 1000;
  const step = (n, dt = 1 / 60) => {
    for (let i = 0; i < n; i++) { clk += dt; r._advanceWeather(dt, clk); }
  };

  if (scene === 'pouring') {
    r.updateWeather(fx({ condition: 'pouring', intensity01: 1.0, windKmh: 20, windBearingPlanRad: 0.3, isDay: true }));
    const cl = r._weatherClouds[0];
    ok('one rain cloud', r._weatherClouds.length === 1 && cl && cl.kind === 'rain', `clouds=${r._weatherClouds.length}`);
    ok('count in [1500,2500]', cl && cl.count >= 1500 && cl.count <= 2500, `count=${cl?.count}`);
    // Snapshot a few Y before / after → assert movement.
    const before = [cl.pos[1], cl.pos[4], cl.pos[7], cl.pos[10]];
    step(20);
    const after = [cl.pos[1], cl.pos[4], cl.pos[7], cl.pos[10]];
    const moved = before.some((y, i) => Math.abs(y - after[i]) > 1e-3);
    ok('particles move between frames', moved, `dy0=${(before[0] - after[0]).toFixed(1)}`);
    // All Y within the 0..4000 recycle band after stepping.
    let inBand = true, worst = 0;
    for (let i = 0; i < cl.count; i++) { const y = cl.pos[i * 3 + 1]; if (y < -1 || y > 4001) { inBand = false; worst = y; } }
    ok('all Y within 0..4000 band', inBand, inBand ? 'ok' : `worst=${worst.toFixed(0)}`);
    step(600);   // long run — must stay bounded (wrap wind drift + recycle)
    let stillBand = true;
    for (let i = 0; i < cl.count; i++) { const y = cl.pos[i * 3 + 1]; if (y < -1 || y > 4001) stillBand = false; }
    ok('band stable after 10 s', stillBand);
    ok('no scene fog', r._scene.fog == null, `fog=${r._scene.fog}`);

  } else if (scene === 'fog') {
    // Zoom-compensation contract (see _advanceWeather): the APPLIED FogExp2.density
    // is the eased authored density scaled by clamp(REF_DIST/camDist, 0.15, 1), so
    // pulling the camera back reads as constant-strength atmosphere over the model
    // rather than a grey wash. REF_DIST matches applyViewPreset's max(fw,fd)*1.35,
    // floored at 8000 mm. camDist = camera.position.distanceTo(controls.target).
    const REF_DIST = Math.max(Math.max(r._fw, r._fd) * 1.35, 8000);   // 13500 here
    // Set camDist directly (bypass setCameraView so OrbitControls' maxDistance
    // clamp can't cap the extreme-zoom cases); only the distance matters.
    const setCamDist = (dist) => { r._camera.position.set(0, dist, 0); r._controls.target.set(0, 0, 0); };

    r.updateWeather(fx({ condition: 'fog', intensity01: 0.5, isDay: true }));
    ok('scene.fog is FogExp2', !!r._scene.fog && r._scene.fog.isFogExp2, `fog=${r._scene.fog?.constructor?.name}`);
    ok('two ground planes', r._weatherFogPlanes.length === 2, `planes=${r._weatherFogPlanes.length}`);
    // Ease-in reads at authored strength: camera at REF_DIST ⇒ factor 1.
    setCamDist(REF_DIST);
    step(30);                                   // ~0.5 s in
    const mid = r._scene.fog.density;
    step(330);                                  // ~6 s total → near target
    const late = r._scene.fog.density;
    const TARGET = 0.00018;
    ok('density eases in (mid < late)', mid < late, `mid=${mid.toExponential(2)} late=${late.toExponential(2)}`);
    ok('mid density below target', mid < TARGET * 0.6, `mid=${mid.toExponential(2)}`);
    ok('late density near target', late > TARGET * 0.75, `late=${late.toExponential(2)} tgt=${TARGET}`);

    // ── Zoom compensation ── applied density = _fogEased × factor, evaluated in
    // the SAME step, so fog.density / _fogEased == the clamp factor exactly.
    setCamDist(REF_DIST); step(1);
    const fRef = r._scene.fog.density / r._fogEased;
    ok('factor ~1 at REF_DIST', Math.abs(fRef - 1) < 0.01, `factor=${fRef.toFixed(4)}`);
    setCamDist(REF_DIST * 4); step(1);
    const f4 = r._scene.fog.density / r._fogEased;
    ok('factor ~0.25 at 4×REF_DIST', Math.abs(f4 - 0.25) < 0.01, `factor=${f4.toFixed(4)}`);
    setCamDist(REF_DIST * 100); step(1);
    const f100 = r._scene.fog.density / r._fogEased;
    ok('factor floored at exactly 0.15 far out', Math.abs(f100 - 0.15) < 1e-6, `factor=${f100.toFixed(6)}`);
    ok('applied density stays a fraction (no grey wash zoomed out)',
      r._scene.fog.density < r._fogEased * 0.2,
      `applied=${r._scene.fog.density.toExponential(2)} eased=${r._fogEased.toExponential(2)}`);
    // Zooming IN never intensifies past authored strength (factor capped at 1).
    setCamDist(REF_DIST * 0.1); step(1);
    const fIn = r._scene.fog.density / r._fogEased;
    ok('factor capped at 1 zoomed in', Math.abs(fIn - 1) < 1e-6, `factor=${fIn.toFixed(6)}`);

    // Leaving fog: sunny → target 0, eases out and nulls scene.fog.
    r.updateWeather(fx({ condition: 'sunny' }));
    step(600);                                  // ~10 s ease-out
    ok('fog cleared on leave', r._scene.fog == null, `fog=${r._scene.fog}`);
    // Zoom compensation must NEVER revive a torn-down fog: the teardown gates on
    // the EASED value, not the zoom-scaled applied value — pulling the camera in
    // close (large factor) after teardown keeps scene.fog null.
    setCamDist(REF_DIST * 0.2); step(10);
    ok('zoom-in does not revive torn-down fog', r._scene.fog == null, `fog=${r._scene.fog}`);

  } else if (scene === 'lightning') {
    r.updateWeather(fx({ condition: 'lightning', intensity01: 0.6, isDay: false }));
    ok('flash light built', !!r._weatherFlash, `flash=${!!r._weatherFlash}`);
    ok('flash idle at rest', r._weatherFlash.intensity === 0, `i=${r._weatherFlash.intensity}`);
    // Simulate 30 s. Track a flash pulse over threshold, then a return to ~0.
    let peak = 0, sawFlash = false, sawReturn = false;
    for (let i = 0; i < 1800; i++) {
      step(1);
      const inten = r._weatherFlash.intensity;
      if (inten > peak) peak = inten;
      if (inten > 2) sawFlash = true;
      else if (sawFlash && inten < 0.05) sawReturn = true;
    }
    ok('>=1 flash pulse in 30 s', sawFlash, `peak=${peak.toFixed(2)}`);
    ok('flash returns to ~0', sawReturn, `final=${r._weatherFlash.intensity.toFixed(3)}`);
    ok('no particles (dry lightning)', r._weatherClouds.length === 0, `clouds=${r._weatherClouds.length}`);

  } else if (scene === 'sunny') {
    r.updateWeather(fx({ condition: 'sunny', isDay: true }));
    step(60);
    ok('no clouds', r._weatherClouds.length === 0, `clouds=${r._weatherClouds.length}`);
    ok('weather group empty', r._weatherGroup.children.length === 0, `children=${r._weatherGroup.children.length}`);
    ok('no scene fog', r._scene.fog == null, `fog=${r._scene.fog}`);
    ok('no flash light', !r._weatherFlash, `flash=${!!r._weatherFlash}`);

  } else if (scene === 'w3') {
    // Cloud coverage + visibility + gust + frost + puddles + sun-position, all on.
    const allOn = { precip:true, fog:true, lightning:true, wind:true, clouds:true,
      sunPosition:true, sunDisc:true, frost:true, puddles:true, precipForecast:true };
    r.updateWeather(fx({ condition:'rainy', intensity01:0.55, windKmh:20, windBearingPlanRad:0.3,
      isDay:true, effects:allOn, cloudCoverage:90, visibilityKm:1, windGustKmh:45,
      apparentC:-5, sunAzimuthDeg:120, sunElevationDeg:30, rainSoon:true }));
    ok('rain cloud built (precip)', r._weatherClouds.some(c => c.kind === 'rain'), `clouds=${r._weatherClouds.length}`);
    ok('cloud shadows built (90%)', r._weatherCloudShadows.length >= 3, `shadows=${r._weatherCloudShadows.length}`);
    ok('puddles built', r._weatherPuddles.length >= 4, `puddles=${r._weatherPuddles.length}`);
    ok('frost icicles built (feels −5)', r._weatherIcicles.length > 0, `icicles=${r._weatherIcicles.length}`);
    ok('sun target set (elev 30)', !!r._weatherSunTarget, `t=${!!r._weatherSunTarget}`);
    ok('visibility fog (1 km)', !!r._scene.fog && r._scene.fog.isFogExp2, `fog=${r._scene.fog?.constructor?.name}`);
    // Visibility 1 km ⇒ target 4.2e-4 (well above the condition-fog 1.8e-4 floor).
    step(360);   // ~6 s → fog + puddle fade ease up
    ok('visibility fog denser than fog-floor', r._scene.fog.density > 0.0002, `d=${r._scene.fog.density.toExponential(2)}`);
    ok('puddle fade eased in', (r._puddleFade['f1'] ?? 0) > 0.1, `fade=${(r._puddleFade['f1'] ?? 0).toFixed(3)}`);
    ok('cloud shadows drift', (() => {
      const s0 = r._weatherCloudShadows[0].mesh.position.x; step(30);
      return Math.abs(r._weatherCloudShadows[0].mesh.position.x - s0) > 1e-3;
    })());
    // ── Cloud shadows must read as SHADE, not as pale blobs ──
    // The decal is a NormalBlending quad: dst·(1−a) + src·a. Its texture rgb is
    // pure black so that reduces to an exact multiply by (1−a) — it darkens
    // every surface and can never lighten one. A dark-but-nonzero src (the old
    // rgb(20,24,32), lifted to mid-grey by the linear→sRGB output step) read as
    // WHITE circles over dark ground. Sample the shared canvas directly.
    {
      const tex = r._cloudShadowTexture();
      const cv = tex.image, g2 = cv.getContext('2d');
      const at = (fx01) => g2.getImageData(Math.round(cv.width * fx01), cv.height >> 1, 1, 1).data;
      const centre = at(0.5), mid = at(0.75), rim = at(0.99);
      const lum = (d) => 0.3 * d[0] + 0.59 * d[1] + 0.11 * d[2];
      ok('shadow texture centre is dark', lum(centre) < 24,
         `L=${lum(centre).toFixed(0)} rgb=${centre[0]},${centre[1]},${centre[2]}`);
      ok('shadow texture rgb is pure black (exact multiply)',
         centre[0] === 0 && centre[1] === 0 && centre[2] === 0 && mid[0] === 0,
         `centre=${centre[0]},${centre[1]},${centre[2]} mid=${mid[0]},${mid[1]},${mid[2]}`);
      ok('shadow alpha is a soft ramp (opaque core → 0 rim)',
         centre[3] > 120 && mid[3] > 8 && mid[3] < centre[3] && rim[3] < 8,
         `a=${centre[3]}/${mid[3]}/${rim[3]}`);
      const m0 = r._weatherCloudShadows[0].mesh;
      const mm = m0.material;
      // blending: 1 = THREE.NormalBlending, 2 = AdditiveBlending. Additive would
      // turn the shade back into a bright patch.
      ok('shadow material normal-blended + translucent',
         mm.transparent === true && mm.blending === 1 && mm.depthWrite === false,
         `t=${mm.transparent} blend=${mm.blending} dw=${mm.depthWrite}`);
      ok('shadow material untinted (map carries it)', mm.color.getHex() === 0xffffff,
         `hex=${mm.color.getHex().toString(16)}`);
      ok('shadow stays subtle (never a hole)', mm.opacity > 0.05 && mm.opacity < 0.4,
         `op=${mm.opacity.toFixed(3)}`);
      ok('shadow decal above the floor decals', m0.position.y >= 10 && m0.renderOrder === 1,
         `y=${m0.position.y} ro=${m0.renderOrder}`);
    }
    // Darkness scales with coverage: heavier overcast ⇒ more opaque shade.
    r.updateWeather(fx({ condition:'cloudy', effects:allOn, cloudCoverage:40, isDay:true }));
    const lightOp = r._weatherCloudShadows[0]?.mesh.material.opacity ?? 0;
    r.updateWeather(fx({ condition:'cloudy', effects:allOn, cloudCoverage:100, isDay:true }));
    const heavyOp = r._weatherCloudShadows[0]?.mesh.material.opacity ?? 0;
    ok('shade scales with cloud coverage', heavyOp > lightOp + 0.05,
       `40%=${lightOp.toFixed(3)} 100%=${heavyOp.toFixed(3)}`);
    // Low coverage ⇒ no cloud shadows.
    r.updateWeather(fx({ condition:'cloudy', effects:allOn, cloudCoverage:15, isDay:true }));
    ok('low coverage → no shadows', r._weatherCloudShadows.length === 0, `shadows=${r._weatherCloudShadows.length}`);
    // Per-effect gating: clouds off ⇒ no shadows even at 90%.
    r.updateWeather(fx({ condition:'cloudy', effects:{ ...allOn, clouds:false }, cloudCoverage:90, isDay:true }));
    ok('clouds key off → no shadows', r._weatherCloudShadows.length === 0, `shadows=${r._weatherCloudShadows.length}`);
    // Puddles linger after rain stops (fade > 0 keeps them built).
    r.updateWeather(fx({ condition:'sunny', effects:allOn, isDay:true }));
    ok('puddles linger after rain', r._weatherPuddles.length >= 4, `puddles=${r._weatherPuddles.length}`);

  } else if (scene === 'alert') {
    // DC-D alert beacon: a severity sets up a colored pulse light whose intensity
    // varies across advanced frames; no severity → the beacon eases dark.
    r.updateWeather(fx({ condition: 'sunny', isDay: true, alertSeverity: 'warning' }));
    ok('beacon light built', !!r._alertPulseLight, `light=${!!r._alertPulseLight}`);
    ok('beacon color red', r._alertPulseLight && r._alertPulseLight.color.getHex() === 0xe6291a,
       `hex=${r._alertPulseLight?.color.getHex().toString(16)}`);
    // Sample intensity across full pulse periods → must vary (pulsing, not static).
    let lo = Infinity, hi = -Infinity, sawOn = false;
    for (let i = 0; i < 300; i++) {
      step(1, 1 / 30);
      const inten = r._alertPulseLight.intensity;
      if (inten < lo) lo = inten;
      if (inten > hi) hi = inten;
      if (inten > 0.5) sawOn = true;
    }
    ok('beacon pulses (varies)', hi - lo > 0.3, `lo=${lo.toFixed(2)} hi=${hi.toFixed(2)}`);
    ok('beacon reaches urgent peak', sawOn && hi > 1.0, `hi=${hi.toFixed(2)}`);
    // Advisory is gentler (lower peak) + amber.
    r.updateWeather(fx({ condition: 'sunny', isDay: true, alertSeverity: 'advisory' }));
    let advHi = 0;
    for (let i = 0; i < 300; i++) { step(1, 1 / 30); advHi = Math.max(advHi, r._alertPulseLight.intensity); }
    ok('advisory dimmer than warning', advHi < hi, `adv=${advHi.toFixed(2)} warn=${hi.toFixed(2)}`);
    ok('advisory color amber', r._alertPulseLight.color.getHex() === 0xf5c400,
       `hex=${r._alertPulseLight.color.getHex().toString(16)}`);
    // No severity → beacon eases dark (~1.5 s τ; give it ~8 s to fully decay).
    r.updateWeather(fx({ condition: 'sunny', isDay: true }));
    for (let i = 0; i < 240; i++) step(1, 1 / 30);
    ok('beacon dark when cleared', r._alertPulseLight.intensity < 0.02, `i=${r._alertPulseLight.intensity.toFixed(4)}`);

  } else if (scene === 'sky') {
    // ── Phase 3: sky backdrop, sun & moon props ──
    // Independent recompute of _sunTargetFromSky(az, elev, R) so the sun disc
    // position is verified, not just trusted.
    const sunVec = (azDeg, elevDeg, R) => {
      const az = azDeg * Math.PI / 180, el = Math.max(0, Math.min(90, elevDeg)) * Math.PI / 180;
      const horiz = Math.cos(el) * R, y = Math.sin(el) * R + 600;
      return { x: -Math.sin(az) * horiz, y, z: Math.cos(az) * horiz };
    };
    const centerPx = (tex) => {
      const cv = tex.image; const g = cv.getContext('2d');
      return g.getImageData(cv.width >> 1, cv.height >> 1, 1, 1).data;
    };
    const rowPx = (tex, fx01) => {
      const cv = tex.image; const g = cv.getContext('2d');
      return g.getImageData(Math.round(cv.width * fx01), cv.height >> 1, 1, 1).data;
    };
    const lum = (d) => 0.3 * d[0] + 0.59 * d[1] + 0.11 * d[2];

    // DAY: sun disc up + positioned; moon hidden; stars faded out.
    r.applyScenePreset('day');
    r.updateWeather(fx({ condition: 'sunny', isDay: true, skyBackdrop: true,
      sunAzimuthDeg: 120, sunElevationDeg: 35, cloudCoverage: 5 }));
    ok('sky group built + visible', r._skyGroup.visible && r._skyDome, `vis=${r._skyGroup.visible}`);
    const want = sunVec(120, 35, 26000);
    ok('sun target at expected az/elev', !!r._skySunTarget &&
       Math.hypot(r._skySunTarget.x - want.x, r._skySunTarget.y - want.y, r._skySunTarget.z - want.z) < 1,
       `got=(${r._skySunTarget.x.toFixed(0)},${r._skySunTarget.y.toFixed(0)},${r._skySunTarget.z.toFixed(0)})`);
    ok('sun above horizon (+y)', r._skySunTarget.y > 600, `y=${r._skySunTarget.y.toFixed(0)}`);
    step(240);   // ~4 s ease
    ok('sun disc visible by day', r._sunSprite.visible && r._sunSprite.material.opacity > 0.5,
       `op=${r._sunSprite.material.opacity.toFixed(2)}`);
    ok('moon hidden by day', !r._moonSprite.visible, `mvis=${r._moonSprite.visible}`);
    ok('stars faded out by day', r._starField.material.opacity < 0.15, `s=${r._starField.material.opacity.toFixed(2)}`);
    ok('starfield hidden outright by day', !r._starField.visible, `vis=${r._starField.visible}`);
    const dayTop = r._skyTopTarget.getHex(), dayBot = r._skyBotTarget.getHex();

    // ── The sun must read as a warm GLOW, not a flat white ball ──
    // A small hot core + a long soft warm tail, additively blended so it adds
    // light to the sky rather than pasting a hard-edged disc over it.
    {
      const tex = r._sunGlowTexture();
      const cv = tex.image, g2 = cv.getContext('2d');
      // radius fraction f (0 = centre, 1 = rim) → x pixel along the mid row.
      const atR = (f) => g2.getImageData(
        Math.min(cv.width - 1, Math.round(cv.width * (0.5 + f / 2))), cv.height >> 1, 1, 1).data;
      const c = atR(0), r10 = atR(0.10), r30 = atR(0.30), r55 = atR(0.55), rim = atR(0.98);
      ok('sun texture centre warm (r>g>b)', c[0] > c[1] && c[1] > c[2],
         `rgb=${c[0]},${c[1]},${c[2]}`);
      ok('sun texture centre bright', lum(c) > 200, `L=${lum(c).toFixed(0)}`);
      ok('sun stays warm across the halo', r30[0] > r30[2] + 40 && r55[0] > r55[2] + 40,
         `r30=${r30[0]},${r30[1]},${r30[2]} r55=${r55[0]},${r55[1]},${r55[2]}`);
      ok('sun core is SMALL (falls off fast)', r10[3] > 180 && r30[3] < 90,
         `a10=${r10[3]} a30=${r30[3]}`);
      ok('sun halo is wide + soft (no hard edge)', r55[3] > 4 && r55[3] < 60 && rim[3] < 6,
         `a55=${r55[3]} arim=${rim[3]}`);
      // 2 = THREE.AdditiveBlending.
      ok('sun sprite additively blended', r._sunSprite.material.blending === 2,
         `blend=${r._sunSprite.material.blending}`);
      ok('sun tint warm at altitude (r>g>b)', (() => {
        const col = r._sunSprite.material.color;
        return col.r > col.g && col.g > col.b;
      })(), `tint=${r._sunSprite.material.color.getHexString()}`);
    }
    // Midday glare: the PEAK opacity eases back as the sun climbs (a high sun is
    // brightness, not a hard bright ball). Same clear sky, two elevations.
    r.updateWeather(fx({ condition: 'sunny', isDay: true, skyBackdrop: true,
      sunAzimuthDeg: 120, sunElevationDeg: 20, cloudCoverage: 0 }));
    const lowPeak = r._sunWantOpacity;
    r.updateWeather(fx({ condition: 'sunny', isDay: true, skyBackdrop: true,
      sunAzimuthDeg: 120, sunElevationDeg: 80, cloudCoverage: 0 }));
    const highPeak = r._sunWantOpacity;
    ok('high sun dims below low sun', highPeak < lowPeak - 0.05 && highPeak > 0.5,
       `low=${lowPeak.toFixed(2)} high=${highPeak.toFixed(2)}`);
    r.updateWeather(fx({ condition: 'sunny', isDay: true, skyBackdrop: true,
      sunAzimuthDeg: 120, sunElevationDeg: 35, cloudCoverage: 5 }));
    step(120);

    // NIGHT: sun hidden even with elev>0; moon shown; stars faded in.
    r.applyScenePreset('night');
    r.updateWeather(fx({ condition: 'clear-night', isDay: false, skyBackdrop: true,
      sunAzimuthDeg: 120, sunElevationDeg: 20, moonPhase: 'waxing_crescent' }));
    step(720);   // day→night sun disc fade-out (τ≈2 s) settles below the visibility floor
    ok('sun hidden at night', !r._sunSprite.visible, `svis=${r._sunSprite.visible} op=${r._sunSprite.material.opacity.toFixed(3)}`);
    ok('moon shown at night', r._moonSprite.visible && r._moonSprite.material.opacity > 0.5,
       `op=${r._moonSprite.material.opacity.toFixed(2)}`);
    // Daylight rule: a LIVE sun above the horizon suppresses the stars even when
    // the preset says night (an overcast day is preset-downgraded to dusk, which
    // used to paint a full star sky over a bright daytime dome). This fixture
    // still carries sunElevationDeg 20 from the sun-disc checks above.
    ok('sun-up suppresses stars regardless of preset',
       r._starField.material.opacity < 0.05 && !r._starField.visible,
       `s=${r._starField.material.opacity.toFixed(3)} vis=${r._starField.visible}`);
    // Sun actually below the horizon → the night sky comes back.
    r.updateWeather(fx({ condition: 'clear-night', isDay: false, skyBackdrop: true,
      sunAzimuthDeg: 120, sunElevationDeg: -25, moonPhase: 'waxing_crescent' }));
    step(720);
    ok('stars faded in at night', r._starField.material.opacity > 0.7, `s=${r._starField.material.opacity.toFixed(2)}`);
    ok('starfield visible at night', r._starField.visible, `vis=${r._starField.visible}`);
    // Moon positioned opposite the sun azimuth (300 vs 120), high in the sky.
    // (Decorative moon elevation = clamp(−sunElev, 22, 58); sunElev is −25 here.)
    const moonWant = sunVec(300, Math.min(58, Math.max(22, 25)), 24000);
    ok('moon opposite sun azimuth', Math.hypot(
       r._skyMoonTarget.x - moonWant.x, r._skyMoonTarget.z - moonWant.z) < 2,
       `mt=(${r._skyMoonTarget.x.toFixed(0)},${r._skyMoonTarget.z.toFixed(0)})`);
    const nightTop = r._skyTopTarget.getHex();
    ok('night dome differs from day dome', nightTop !== dayTop, `night=${nightTop.toString(16)} day=${dayTop.toString(16)}`);

    // Moon phase texture varies by state: center pixel lit for full, dark for new.
    const fullC = centerPx(r._moonTexture('full_moon'));
    const newC  = centerPx(r._moonTexture('new_moon'));
    ok('full moon center lit', lum(fullC) > 180, `L=${lum(fullC).toFixed(0)}`);
    ok('new moon center dark', lum(newC) < 90, `L=${lum(newC).toFixed(0)}`);
    ok('full != new texture', r._moonTexture('full_moon') !== r._moonTexture('new_moon'));
    // Waxing crescent lit on the RIGHT; waning crescent lit on the LEFT.
    const waxTex = r._moonTexture('waxing_crescent');
    const wanTex = r._moonTexture('waning_crescent');
    ok('waxing crescent lit on right', lum(rowPx(waxTex, 0.82)) > lum(rowPx(waxTex, 0.18)),
       `R=${lum(rowPx(waxTex,0.82)).toFixed(0)} L=${lum(rowPx(waxTex,0.18)).toFixed(0)}`);
    ok('waning crescent lit on left', lum(rowPx(wanTex, 0.18)) > lum(rowPx(wanTex, 0.82)),
       `L=${lum(rowPx(wanTex,0.18)).toFixed(0)} R=${lum(rowPx(wanTex,0.82)).toFixed(0)}`);

    // OVERCAST dome differs from clear (greyed/darkened) at the same preset.
    r.applyScenePreset('day');
    r.updateWeather(fx({ condition: 'sunny', isDay: true, skyBackdrop: true, cloudCoverage: 0 }));
    const clearBot = r._skyBotTarget.getHex();
    r.updateWeather(fx({ condition: 'cloudy', isDay: true, skyBackdrop: true, cloudCoverage: 95 }));
    const overBot = r._skyBotTarget.getHex();
    ok('overcast dome differs from clear', overBot !== clearBot,
       `over=${overBot.toString(16)} clear=${clearBot.toString(16)}`);

    // Transition EASES: colors mid-transition differ across advanced frames and
    // haven't snapped to target yet.
    r.applyScenePreset('night');
    r.updateWeather(fx({ condition: 'clear-night', isDay: false, skyBackdrop: true }));
    // Force a big jump: retarget to day mid-flight.
    r.applyScenePreset('day');
    r.updateWeather(fx({ condition: 'sunny', isDay: true, skyBackdrop: true, cloudCoverage: 0 }));
    const c0 = r._skyTopCur.getHex();
    step(6);   // ~0.1 s
    const c1 = r._skyTopCur.getHex();
    step(6);
    const c2 = r._skyTopCur.getHex();
    ok('sky color eases (frames differ)', c0 !== c1 && c1 !== c2, `c0=${c0.toString(16)} c1=${c1.toString(16)} c2=${c2.toString(16)}`);
    ok('not snapped to target early', c1 !== r._skyTopTarget.getHex(), `cur=${c1.toString(16)} tgt=${r._skyTopTarget.getHex().toString(16)}`);

    // rainSoon darkens the UPWIND horizon: uStormAmt eases up + uStormDir set to
    // the upwind (opposite wind blow-toward) direction.
    r.updateWeather(fx({ condition: 'cloudy', isDay: true, skyBackdrop: true,
      windKmh: 20, windBearingPlanRad: 0, rainSoon: true, cloudCoverage: 60 }));
    step(240);   // let _stormDarkAmt ease in (~2.5 s τ)
    ok('storm horizon darkening on (uStormAmt>0)', r._skyMat.uniforms.uStormAmt.value > 0.2,
       `amt=${r._skyMat.uniforms.uStormAmt.value.toFixed(2)}`);
    // wind toward planRad 0 → scene drift wdx=-cos(0)*v=-v, wdz=0 → upwind=(+1,0).
    const sd = r._skyMat.uniforms.uStormDir.value;
    ok('storm dir points upwind (+x)', sd.x > 0.9 && Math.abs(sd.y) < 0.2, `dir=(${sd.x.toFixed(2)},${sd.y.toFixed(2)})`);
    // Clearing (dry, no rainSoon) → darkening eases back out.
    r.updateWeather(fx({ condition: 'sunny', isDay: true, skyBackdrop: true }));
    step(650);
    ok('storm darkening clears', r._skyMat.uniforms.uStormAmt.value < 0.05, `amt=${r._skyMat.uniforms.uStormAmt.value.toFixed(3)}`);

    // ── sunDisc key (W3 per-effect toggle): the sun sprite alone toggles off ──
    // sunDisc is a SKY behavior, not a _weatherGroup member — three-view folds
    // neither the effects3d master nor the weatherFx layer into it, so the key
    // is its only gate. It zeroes the opacity TARGET, so the disc EASES out.
    r.applyScenePreset('day');
    const allOnSun = { precip:true, fog:true, lightning:true, wind:true, clouds:true,
      sunPosition:true, sunDisc:true, frost:true, puddles:true, precipForecast:true };
    const sunSky = (eff) => fx(Object.assign(
      { condition:'sunny', isDay:true, skyBackdrop:true,
        sunAzimuthDeg:120, sunElevationDeg:35, cloudCoverage:5 },
      eff ? { effects: eff } : {}));

    // (a) No effects map at all (a stale three-view chunk) → disc still shown.
    r.updateWeather(sunSky(null));
    step(360);
    ok('sun disc shown when effects map absent',
       r._sunSprite.visible && r._sunSprite.material.opacity > 0.5,
       `vis=${r._sunSprite.visible} op=${r._sunSprite.material.opacity.toFixed(2)}`);

    // (b) sunDisc explicitly ON → shown.
    r.updateWeather(sunSky(allOnSun));
    step(360);
    ok('sun disc shown when sunDisc true',
       r._sunSprite.visible && r._sunSprite.material.opacity > 0.5,
       `op=${r._sunSprite.material.opacity.toFixed(2)}`);
    const starsVisOn = r._starField.visible, starsOpOn = r._starField.material.opacity;
    const moonVisOn = r._moonSprite.visible, moonWantOn = r._moonWantOpacity;
    const domeTopOn = r._skyTopTarget.getHex();

    // (c) sunDisc OFF → target zeroed at once, sprite eases out (never a pop).
    r.updateWeather(sunSky(Object.assign({}, allOnSun, { sunDisc:false })));
    ok('sunDisc off zeroes the opacity target', r._sunWantOpacity === 0, `want=${r._sunWantOpacity}`);
    step(6);   // ~0.1 s — mid-fade, still on screen
    ok('sun disc fades out rather than popping',
       r._sunSprite.visible && r._sunSprite.material.opacity > 0.05,
       `op=${r._sunSprite.material.opacity.toFixed(3)}`);
    step(720);
    ok('sun disc hidden when sunDisc false',
       !r._sunSprite.visible && r._sunSprite.material.opacity < 0.02,
       `vis=${r._sunSprite.visible} op=${r._sunSprite.material.opacity.toFixed(3)}`);

    // The key touches the DISC only — dome / stars / moon / sun-light untouched.
    ok('sunDisc off keeps the dome built + visible',
       r._skyGroup.visible && !!r._skyDome && r._skyDome.visible, `vis=${r._skyGroup.visible}`);
    ok('sunDisc off leaves the dome color alone', r._skyTopTarget.getHex() === domeTopOn,
       `now=${r._skyTopTarget.getHex().toString(16)} was=${domeTopOn.toString(16)}`);
    // (star opacity is itself an eased ramp, so compare with a tolerance —
    // the contract is "the key doesn't move it", not "frozen to the ULP".)
    ok('sunDisc off leaves the starfield alone',
       r._starField.visible === starsVisOn
       && Math.abs(r._starField.material.opacity - starsOpOn) < 0.01,
       `vis=${r._starField.visible}/${starsVisOn} op=${r._starField.material.opacity.toFixed(4)} was=${starsOpOn.toFixed(4)}`);
    ok('sunDisc off leaves the moon alone',
       r._moonSprite.visible === moonVisOn && r._moonWantOpacity === moonWantOn,
       `vis=${r._moonSprite.visible}/${moonVisOn} want=${r._moonWantOpacity}`);
    ok('sunDisc off leaves sunPosition (the sun LIGHT) targeting',
       !!r._weatherSunTarget, `t=${!!r._weatherSunTarget}`);

    // (d) Re-enabled → the disc eases back in.
    r.updateWeather(sunSky(allOnSun));
    step(720);
    ok('sun disc returns when re-enabled',
       r._sunSprite.visible && r._sunSprite.material.opacity > 0.5,
       `op=${r._sunSprite.material.opacity.toFixed(2)}`);

    // skyBackdrop off → the whole group hides.
    r.updateWeather(fx({ condition: 'sunny', isDay: true, skyBackdrop: false }));
    ok('skyBackdrop off hides group', !r._skyGroup.visible, `vis=${r._skyGroup.visible}`);
  }

  // ── report ──────────────────────────────────────────────────────────────
  const pass = tests.filter(t => t.ok).length, total = tests.length;
  const allPass = pass === total;
  const fails = tests.filter(t => !t.ok).map(t => t.name);
  const title = allPass ? `WFX PASS ${scene} ${pass}/${total}` : `WFX FAIL ${scene} ${pass}/${total} [${fails.join(',')}]`;
  document.title = title;
  const log = document.getElementById('log');
  log.innerHTML = `<div class="hd ${allPass ? 'pass' : 'fail'}">${title}</div>` +
    tests.map(t => `<div><span class="${t.ok ? 'pass' : 'fail'}">${t.ok ? 'PASS' : 'FAIL'}</span> ${t.name} <span style="color:#78909c">${t.detail}</span></div>`).join('');
</script>
