<!doctype html>
<meta charset="utf-8">
<title>windows</title>
<style>html,body{margin:0;background:#111}#c{width:1280px;height:880px}</style>
<div id="c"></div>
<!-- Window glazing kinds + BAY windows (projecting three-pane assembly, and
     `bay_bench`'s window-seat SitSpot). Renderer from the built chunk; the pure
     bay plan / sill / projection-side helpers from geometry.mod.js:
       npm run build
       H=<harness>; rm -rf "$H"; mkdir -p "$H"; cp -r dist/* "$H"/
       cp test-pages/window-test.html "$H"/
       npx esbuild src/geometry.ts --bundle --format=esm --outfile="$H"/geometry.mod.js
       T=$(mktemp -d); cp -r src/* "$T"/; cp test-pages/fake-avatar-store.ts "$T"/avatar-store.ts
       printf "export * from './canvas-render.js';\nexport * from './canvas-hit.js';\n" > "$T"/canvas2d-entry.ts
       npx esbuild "$T"/planner.ts        --bundle --format=esm --outfile="$H"/planner.mod.js
       npx esbuild "$T"/canvas2d-entry.ts --bundle --format=esm --outfile="$H"/canvas-render.mod.js -->
<script type="module">
 try {
  const q = new URLSearchParams(location.search);
  const mod = await import('./assets/three-renderer.js?v=' + Date.now());
  const r = new mod.ThreeDRenderer(document.getElementById('c'));
  await r.load();
  const scene3d = { preset: 'day', floorColor: '#8a7860', floorTex: 'none', wallColor: '#cfd2d6' };
  const wallY = 2500;
  const mkFloor = (windows) => ({
    id: 'f1', name: 'T', w: 12000, d: 5000,
    walls: [{ id: 'w1', points: [{x:500,y:wallY},{x:11500,y:wallY}] }],
    furniture: [], lights: [], switches: [], sensors: [], motionSensors: [], envSensors: [],
    doors: [], windows, bg: null, model3d: null, look3d: null, rooms: [],
  });

  const KINDS = ['single', 'double_hung', 'casement_pair', 'sliding', 'picture', 'bay', 'bay_bench'];
  // Glass-pane count expected per kind (frame bars/mullions excluded).
  // A bay is a three-pane assembly: centre + two angled returns.
  const EXPECT_PANES = { single: 1, double_hung: 2, casement_pair: 2, sliding: 2, picture: 1,
                         bay: 3, bay_bench: 3 };

  // --- Helpers reading BoxGeometry params directly (Y-rotation doesn't move Y).
  const isTransparentGlass = m => m.material && m.material.transparent === true;
  const paneMeshes = grp => { const out = []; grp.traverse(o => { if (o.isMesh && isTransparentGlass(o)) out.push(o); }); return out; };
  const worldY = o => { let y = 0, n = o; while (n) { y += (n.position ? n.position.y : 0); n = n.parent; } return y; };
  const paneTop = m => worldY(m) + m.geometry.parameters.height / 2;
  const paneBot = m => worldY(m) - m.geometry.parameters.height / 2;

  const results = [];
  const ok = (name, cond, detail = '') => results.push(`${cond ? 'ok' : 'FAIL'}:${name}${detail ? '(' + detail + ')' : ''}`);

  // === 1. Closed: pane counts per kind =====================================
  const closedWindows = KINDS.map((k, i) => ({
    id: 'wc' + i, x: 1100 + i * 1500, y: wallY, w: 1400, rotation: 0,
    entity_id: null, kind: k,
  }));
  r.updateFloor(mkFloor(closedWindows), scene3d);
  r.updateDoorsWindows([], closedWindows, () => null);
  KINDS.forEach((k, i) => {
    const grp = r._doorGroup.children[i];
    const n = paneMeshes(grp).length;
    ok('panes_' + k, n === EXPECT_PANES[k], `${n}/${EXPECT_PANES[k]}`);
  });

  // === 2. Open behaviour per kind ==========================================
  const openWindows = KINDS.map((k, i) => ({
    id: 'wo' + i, x: 1100 + i * 1500, y: wallY, w: 1400, rotation: 0,
    entity_id: 'binary_sensor.o' + i, kind: k,
  }));
  const openStates = {}; openWindows.forEach(w => openStates[w.entity_id] = { state: 'on', attributes: {} });
  r.updateDoorsWindows([], openWindows, id => openStates[id] || null);
  const g = i => r._doorGroup.children[i];
  // single: pane tilts (rotation.x != 0)
  { const p = paneMeshes(g(0))[0]; ok('single_tilts', Math.abs(p.rotation.x) > 0.1, p.rotation.x.toFixed(2)); }
  // double_hung: lower sash raised to the upper sash's Y
  { const ps = paneMeshes(g(1)).sort((a, b) => a.position.y - b.position.y);
    ok('dh_slides_up', Math.abs(ps[0].position.y - ps[1].position.y) < 1, `${ps[0].position.y.toFixed(0)},${ps[1].position.y.toFixed(0)}`); }
  // casement_pair: both hinge groups rotated about Y, opposite signs
  { const hinges = g(2).children.filter(c => c.isGroup);
    const rots = hinges.map(h => h.rotation.y);
    ok('casement_swings', hinges.length === 2 && Math.abs(rots[0]) > 0.1 && Math.abs(rots[1]) > 0.1 && Math.sign(rots[0]) !== Math.sign(rots[1]), rots.map(x => x.toFixed(2)).join(',')); }
  // sliding: the two sashes share the same X when open
  { const ps = paneMeshes(g(3));
    ok('sliding_overlaps', Math.abs(ps[0].position.x - ps[1].position.x) < 1, `${ps[0].position.x.toFixed(0)},${ps[1].position.x.toFixed(0)}`); }
  // picture: no movement (rotation.x == 0, z == 0) even when "open"
  { const p = paneMeshes(g(4))[0]; ok('picture_static', Math.abs(p.rotation.x) < 1e-6 && Math.abs(p.position.z) < 1e-6, `rx=${p.rotation.x} z=${p.position.z}`); }

  // === 3. Custom sill/height moves glass + wall cut boxes ===================
  const custom = [{ id: 'cust', x: 4000, y: wallY, w: 1600, rotation: 0, entity_id: null, kind: 'single', sill: 400, height: 1400 }];
  r.updateFloor(mkFloor(custom), scene3d);
  r.updateDoorsWindows([], custom, () => null);
  // Glass pane bottom ≈ sill(400), top ≈ sill+height(1800)
  { const p = paneMeshes(r._doorGroup.children[0])[0];
    ok('glass_bottom', Math.abs(paneBot(p) - 400) < 5, paneBot(p).toFixed(0));
    ok('glass_top', Math.abs(paneTop(p) - 1800) < 5, paneTop(p).toFixed(0)); }
  // Single-mesh wall (rewrite): each wall SEGMENT is now ONE watertight
  // ExtrudeGeometry prism with the opening punched as a hole — NOT separate
  // sub-sill/header boxes. Verify (a) the windowed segment produced exactly one
  // solid wall mesh, and (b) the window hole's y-edges land at sill(400) and
  // sill+height(1800) — read from the extrude geometry's vertices (Y unaffected
  // by the segment's Y-rotation; mesh y-position is the floor at 0).
  { const walls = [];
    r._floorGroup.traverse(o => { if (o.isMesh && o.geometry.type === 'ExtrudeGeometry') walls.push(o); });
    ok('wall_single_mesh', walls.length === 1, String(walls.length));
    const ys = new Set();
    for (const w of walls) {
      const pos = w.geometry.attributes.position;
      for (let i = 0; i < pos.count; i++) ys.add(Math.round(pos.getY(i)));
    }
    const near = t => [...ys].some(v => Math.abs(v - t) < 5);
    ok('subsill_top', near(400), [...ys].sort((a, b) => a - b).join(','));
    ok('header_bottom', near(1800), ''); }

  // === 4. Bay windows: three panes PROJECTING outside the wall face =========
  // Plan (window-local XZ, wall plane at z = 0):
  //   (−W/2,0) ─return─ (−Wc/2, s·D) ─centre─ (Wc/2, s·D) ─return─ (W/2,0)
  // `s` = bayProjectSign: the wall normal OUTSIDE every closed loop, falling
  // back to local −Z (the side opposite the interior face where curtains hang).
  const geo = await import('./geometry.mod.js?v=' + Date.now());
  {
    const W = 1800;
    const plan = geo.bayPlan(W);
    ok('bay_plan_angle', plan.angleDeg > 28 && plan.angleDeg <= 45.001, plan.angleDeg.toFixed(1));
    ok('bay_plan_centre', plan.centerW > 200 && plan.centerW < W, plan.centerW.toFixed(0));
    // Default sill/height differ from a punched opening (bench height / tall glass).
    ok('bay_sill_default', geo.windowSillMm({ kind: 'bay' }) === 450, String(geo.windowSillMm({ kind: 'bay' })));
    ok('bay_height_default', geo.windowGlassHMm({ kind: 'bay' }) === 1500, String(geo.windowGlassHMm({ kind: 'bay' })));
    ok('nonbay_defaults_unchanged',
       geo.windowSillMm({ kind: 'single' }) === 900 && geo.windowGlassHMm({}) === 800);
    ok('bay_default_width', geo.windowDefaultWidth('bay_bench') === 1800 && geo.windowDefaultWidth('single') === 1000);

    // NO loops (a lone wall) → the fallback side: local −Z.
    const bay = [{ id: 'by', x: 4000, y: wallY, w: W, rotation: 0, entity_id: null, kind: 'bay' }];
    r.updateFloor(mkFloor(bay), scene3d);
    r.updateDoorsWindows([], bay, () => null);
    const bg0 = r._doorGroup.children[0];
    const panes = paneMeshes(bg0);
    // Every pane sits on the SAME side of the wall plane, offset out to the bay.
    const zs = panes.map(pn => pn.position.z);
    ok('bay_projects_one_side', zs.every(z => z < -1), zs.map(z => z.toFixed(0)).join(','));
    const centre = panes.find(pn => Math.abs(pn.position.x) < 1);
    ok('bay_centre_at_depth', centre && Math.abs(Math.abs(centre.position.z) - plan.depth) < 1,
       centre ? centre.position.z.toFixed(0) : 'none');
    const returns = panes.filter(pn => pn !== centre);
    // The returns splay MIRROR-symmetrically: each is rotated off the wall
    // plane, and (a box being symmetric under a π flip) their yaws are
    // supplementary — 45° and 135° for the 45° splay this width resolves to.
    ok('bay_two_returns_angled', returns.length === 2 &&
       returns.every(pn => Math.abs(pn.rotation.y) > 0.3) &&
       Math.abs(Math.abs(returns[0].rotation.y) + Math.abs(returns[1].rotation.y) - Math.PI) < 0.01,
       returns.map(pn => pn.rotation.y.toFixed(2)).join(','));
    ok('bay_returns_mirrored_x',
       Math.abs(returns[0].position.x + returns[1].position.x) < 1,
       returns.map(pn => pn.position.x.toFixed(0)).join(','));
    ok('bay_returns_mid_depth', returns.every(pn => Math.abs(Math.abs(pn.position.z) - plan.depth / 2) < 1));
    // Glass spans the bay sill/height defaults.
    ok('bay_glass_band', Math.abs(paneBot(centre) - 470) < 30 && Math.abs(paneTop(centre) - 1930) < 30,
       `${paneBot(centre).toFixed(0)}..${paneTop(centre).toFixed(0)}`);
    // Casework: knee wall below + head board above + an overhanging roof, all
    // OPAQUE and thicker than the glass (coincident-face gotcha).
    const opaque = [];
    bg0.traverse(o => { if (o.isMesh && !(o.material && o.material.transparent) && !o.userData?.outline) opaque.push(o); });
    ok('bay_has_casework', opaque.length >= 8, String(opaque.length));
    const kneeTop = opaque.filter(o => o.geometry.parameters &&
      Math.abs(worldY(o) + o.geometry.parameters.height / 2 - 450) < 2);
    ok('bay_knee_wall_to_sill', kneeTop.length >= 3, String(kneeTop.length));

    // Open: the CENTRE pane is the operable awning sash, the returns are fixed.
    const bayOpen = [{ ...bay[0], entity_id: 'binary_sensor.bay' }];
    r.updateDoorsWindows([], bayOpen, () => ({ state: 'on', attributes: {} }));
    const op = paneMeshes(r._doorGroup.children[0]);
    const oc = op.find(pn => Math.abs(pn.position.x) < 1);
    const orets = op.filter(pn => pn !== oc);
    ok('bay_centre_tilts_open', Math.abs(oc.rotation.x) > 0.1, oc.rotation.x.toFixed(2));
    ok('bay_returns_fixed', orets.every(pn => Math.abs(pn.rotation.x) < 1e-6));

    // Curtains are N/A in a bay — gated off, and no crash.
    const bayCurtain = [{ ...bay[0], curtain: { style: 'split' }, curtainPos: 0 }];
    r.updateDoorsWindows([], bayCurtain, () => null);
    let curtainParts = 0;
    r._doorGroup.children[0].traverse(o => { if (o.userData?.kind === 'curtain' || o.userData?.kind === 'curtainRod') curtainParts++; });
    ok('bay_no_curtains', curtainParts === 0, String(curtainParts));
    // …and a CLOSED curtain must not opacify a bay's glass (0.16 closed).
    { const pn = paneMeshes(r._doorGroup.children[0])[0];
      ok('bay_glass_opacity_plain', Math.abs(pn.material.opacity - 0.16) < 1e-6, pn.material.opacity.toFixed(3)); }

    // Wall cut: the bay is punched at ITS sill/height (450 → 1950), not 900/1700.
    { const walls = [];
      r.updateFloor(mkFloor(bay), scene3d);
      r._floorGroup.traverse(o => { if (o.isMesh && o.geometry.type === 'ExtrudeGeometry') walls.push(o); });
      const ys = new Set();
      for (const wm of walls) { const pos = wm.geometry.attributes.position;
        for (let i = 0; i < pos.count; i++) ys.add(Math.round(pos.getY(i))); }
      const near = t => [...ys].some(v => Math.abs(v - t) < 5);
      ok('bay_wall_cut_sill', near(450), [...ys].sort((a, b) => a - b).join(','));
      ok('bay_wall_cut_head', near(1950)); }
  }

  // === 5. bay_bench: a real SitSpot a rig can claim =========================
  // Closed rectangular room so the loops decide the exterior side honestly: the
  // bay must project AWAY from the room and the bench must face back into it.
  {
    const RX0 = 2000, RY0 = 1500, RX1 = 8000, RY1 = 6000;
    const roomWalls = [{ id: 'rw', points: [
      { x: RX0, y: RY0 }, { x: RX1, y: RY0 }, { x: RX1, y: RY1 }, { x: RX0, y: RY1 }, { x: RX0, y: RY0 }] }];
    const win = { id: 'bw', x: 5000, y: RY0, w: 1800, rotation: 0, entity_id: null, kind: 'bay_bench' };
    const floor = {
      id: 'f2', name: 'R', w: 12000, d: 8000, walls: roomWalls,
      furniture: [], lights: [], switches: [], sensors: [], motionSensors: [], envSensors: [],
      doors: [], windows: [win], bg: null, model3d: null, look3d: null, rooms: [],
    };
    r.clearTransientGroups();
    r.updateFloor(floor, scene3d);
    r.updateDoorsWindows([], [win], () => null);
    // Loops present → the exterior is the side OUTSIDE the room (world −Y here).
    ok('bay_sign_from_loops', geo.bayProjectSign(win, geo.closedWallLoops(roomWalls)) === -1);
    const plan = geo.bayPlan(win.w);
    const spot = r._sitSpots.find(s => s.id === 'win:bw:0');
    ok('bench_sitspot_exists', !!spot, String(r._sitSpots.length));
    ok('bench_seat_y', spot && Math.abs(spot.seatY - 450) < 1, spot ? spot.seatY.toFixed(0) : '-');
    // Scene +Z is world +Y here; the bay sits at −depth/2, the front normal and
    // the approach staging point both point back INTO the room.
    const wp = r._w(win.x, win.y, 0);
    ok('bench_seat_in_bay', spot && Math.abs((spot.z - wp.z) + plan.depth / 2) < 1,
       spot ? (spot.z - wp.z).toFixed(0) : '-');
    ok('bench_faces_room', spot && spot.frontNz > 0.99 && Math.abs(spot.frontNx) < 0.01,
       spot ? `${spot.frontNx.toFixed(2)},${spot.frontNz.toFixed(2)}` : '-');
    ok('bench_approach_inside', spot && spot.approachZ > spot.z + 400);
    // The visible cushion's TOP lands exactly at the SitSpot's seatY.
    let cushionTop = null;
    r._doorGroup.children[0].traverse(o => {
      if (o.userData?.bayBench) cushionTop = worldY(o) + o.geometry.parameters.height / 2;
    });
    ok('bench_cushion_matches_seat', cushionTop != null && Math.abs(cushionTop - 450) < 2,
       cushionTop == null ? 'none' : cushionTop.toFixed(0));
    // A dwelling rig CLAIMS the bench spot and settles onto it.
    const realNow = performance.now.bind(performance);
    let fakeNow = realNow();
    performance.now = () => fakeNow;
    for (let i = 0; i < 480; i++) {
      fakeNow += 16.7;
      r.updateTargets([{ key: 'S0', x: 5000, y: RY0 + 300, color: 0x4fc3f7 }]);
    }
    const h = r._humanoids['S0'];
    ok('bench_rig_claims_spot', h && h.sitSpotId === 'win:bw:0', h ? String(h.sitSpotId) : 'no rig');
    ok('bench_rig_sits', h && h.sit > 0.9, h ? h.sit.toFixed(2) : '-');
    // Seated root: the hip pivot rests ON the cushion, so the root drops to
    // seatY − hipY. A bay_bench must NOT also register a standing gaze anchor
    // (that branch precedes the seat in the position blend).
    ok('bench_no_gaze_anchor', !r._activityAnchors.some(a => a.furnitureId === 'win_bw'));
    ok('bench_rig_not_standing', h && h.act < 0.02, h ? h.act.toFixed(2) : '-');
    ok('bench_rig_hip_at_seat', h && Math.abs(h.group.position.y - (450 - h.hipY)) < 30,
       h ? `${h.group.position.y.toFixed(0)} vs ${450 - h.hipY}` : '-');
    ok('bench_rig_on_cushion', h && Math.hypot(h.group.position.x - spot.x, h.group.position.z - spot.z) < 60,
       h ? `${h.group.position.x.toFixed(0)},${h.group.position.z.toFixed(0)}` : '-');
    performance.now = realNow;
  }

  // === 6. 2D: the bay paints a protruding notch on the EXTERIOR side ========
  {
    const { Planner } = await import('./planner.mod.js?v=' + Date.now());
    const C2D = await import('./canvas-render.mod.js?v=' + Date.now());
    const { drawAll, computeView, mmToPx } = C2D;
    const sleep = ms => new Promise(res => setTimeout(res, ms));
    const waitFor = async (cond, tries = 600) => {
      for (let i = 0; i < tries; i++) { if (cond()) return true; await sleep(4); } return false;
    };
    class FakeHa {
      constructor(seed) { this.map = new Map(Object.entries(seed || {})); this.states = {}; this._s = []; this._c = []; }
      connect() { for (const cb of this._c) cb('connected'); for (const cb of this._s) cb(this.states, undefined); }
      onState(fn) { this._s.push(fn); } onConn(fn) { this._c.push(fn); }
      callService() { return Promise.resolve(); }
      async getHistory() { return {}; } async getWeatherForecasts() { return null; }
      async getDevices() { return []; } async getEntityRegistry() { return []; } async updateEntityRegistry() { return true; }
      async getUserData(k) { return this.map.has(k) ? JSON.parse(JSON.stringify(this.map.get(k))) : null; }
      async setUserData(k, v) { this.map.set(k, JSON.parse(JSON.stringify(v))); return true; }
      async refreshStates() {} async subscribeMqtt() { return () => {}; } async publishMqtt() {}
    }
    localStorage.removeItem('diorama:store:v1'); localStorage.removeItem('diorama:configs');
    const RY0 = 1500;
    const f2d = { id: 'f1', name: 'Home', w: 12000, d: 8000,
      walls: [{ id: 'w1', points: [{ x: 2000, y: RY0 }, { x: 8000, y: RY0 },
                                   { x: 8000, y: 6000 }, { x: 2000, y: 6000 }, { x: 2000, y: RY0 }] }],
      furniture: [], lights: [], switches: [], sensors: [], motionSensors: [],
      envSensors: [], bleProxies: [], doors: [], windows: [], rooms: [], bg: null };
    const P = new Planner();
    P.connectWith(new FakeHa({ diorama: { v: 2, floors: [f2d], currentFloorId: 'f1',
      activeSensorId: null, coverage: false, imperial: false, showDetails: false, useRawTargets: false } }));
    await waitFor(() => P.configIndex !== null);
    const cvs = document.createElement('canvas'); cvs.width = 900; cvs.height = 600;
    const c2 = cvs.getContext('2d', { willReadFrequently: true });
    const view2 = computeView(cvs, 12000, 8000, null, 1);
    const paint = (kind) => {
      P.floor().windows = kind
        ? [{ id: 'bw', x: 5000, y: RY0, w: 1800, rotation: 0, entity_id: null, kind, label: '' }]
        : [];
      drawAll(c2, P, view2, null);
      return c2.getImageData(0, 0, cvs.width, cvs.height).data.slice();
    };
    const plan = geo.bayPlan(1800);
    // Band across the middle of the projection, on each side of the wall line.
    const bandPainted = (a, b, worldY) => {
      const p0 = mmToPx(view2, 4600, worldY), p1 = mmToPx(view2, 5400, worldY);
      let nDiff = 0;
      for (let yy = Math.round(p0.y) - 2; yy <= Math.round(p0.y) + 2; yy++)
        for (let xx = Math.round(p0.x); xx <= Math.round(p1.x); xx++) {
          const i = (yy * cvs.width + xx) * 4;
          if (a[i] !== b[i] || a[i + 1] !== b[i + 1] || a[i + 2] !== b[i + 2]) nDiff++;
        }
      return nDiff;
    };
    const none = paint(null);
    const single = paint('single');
    const bay = paint('bay_bench');
    const OUT_Y = RY0 - plan.depth / 2;      // inside the projection (exterior side)
    const IN_Y = RY0 + plan.depth / 2;       // mirror band, room side
    // Compare BAY against a plain SINGLE window in the identical scene: that
    // isolates the bay's own notch from the shared window symbol (pane line,
    // handles, caption) which both kinds paint.
    ok('bay2d_notch_outside', bandPainted(bay, single, OUT_Y) > 20,
       String(bandPainted(bay, single, OUT_Y)));
    ok('bay2d_nothing_inside', bandPainted(bay, single, IN_Y) === 0,
       String(bandPainted(bay, single, IN_Y)));
    ok('bay2d_single_paints_no_notch', bandPainted(single, none, OUT_Y) === 0,
       String(bandPainted(single, none, OUT_Y)));
  }

  const pass = results.every(x => x.startsWith('ok'));
  const n = results.length, p = results.filter(x => x.startsWith('ok')).length;
  document.title = `WINDOW ${pass ? 'PASS' : 'FAIL'} ${p}/${n} ${results.join(' ')}`;
  r.applyViewPreset('iso');
 } catch (e) { document.title = 'ERR: ' + (e && e.stack ? e.stack.split('\n').slice(0,3).join(' | ') : e); }
</script>
