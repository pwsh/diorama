<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>ROBOT …</title>
  <style>
    body { margin:0; background:#0d1116; color:#cfd8dc; font:13px/1.4 sans-serif; padding:14px; }
    h1 { font-size:15px; margin:0 0 10px; }
    .grid { display:flex; flex-wrap:wrap; gap:10px; }
    .card { background:#141b22; border:1px solid #26323d; border-radius:6px; padding:8px 10px; width:360px; }
    .row { display:flex; justify-content:space-between; font-size:11px; gap:8px; }
    .pass { color:#69f0ae; } .fail { color:#ff5252; }
    #summary { font-size:14px; font-weight:bold; margin:10px 0; padding:8px 10px; border-radius:5px; }
    .okbg { background:#12331f; color:#69f0ae; } .badbg { background:#3a1414; color:#ff8a80; }
    code { color:#ffd54f; }
  </style>
</head>
<body>
  <h1>Robot vacuum / mower — wall-avoidance, dock return, outdoor sweep, GPS projection, rig redesign</h1>
  <div id="summary">Running…</div>
  <div class="grid" id="grid"></div>
  <!-- Renderer canvas (rig geometry + progress) + a hidden 2D canvas (drawAll). -->
  <div id="rc" style="width:900px;height:600px;position:absolute;left:-9999px;top:0"></div>
  <canvas id="c2d" width="800" height="600" style="position:absolute;left:-9999px;top:620px"></canvas>

  <!-- Pure-logic test: geometry.ts + geo.ts imported as standalone transpiles
       (NOT code-split chunks). Generate them into the harness dir next to this
       html before serving:
         npx esbuild src/geometry.ts --bundle --format=esm --outfile=<harness>/geometry.mod.js
         npx esbuild src/geo.ts       --bundle --format=esm --outfile=<harness>/geo.mod.js
       These exercise the SAME pure helpers the Planner robot controller uses
       (segCrossesSolidWall / mowerSweepWaypoints) plus the geo projection. -->
  <script type="module">
    import {
      segCrossesSolidWall, mowerSweepWaypoints, segmentsIntersect,
      pointInPolygon, closedWallLoops, robotLedColor, robotProgress, ROBOT_DEFAULTS,
      MOWER_KINEMATICS, MOWER_ROW_MM, stepBicycle, mowerWaypointReached, wrapAngle,
      parseVacuumPosition, vacuumRawToWorld, vacuumRawHeadingRad, solveVacuumDockOffset,
      hexToInt,
    } from './geometry.mod.js';
    import { fitGeoTransform, latLonToPlan, clampToBoundary } from './geo.mod.js';

    const tests = [];
    const ok = (name, cond, detail) => tests.push({ name, ok: !!cond, detail });
    const near = (a, b, e = 1) => Math.abs(a - b) <= e;

    // ── Fixtures: two rooms split by a wall with a DOORWAY gap ────────────────
    // Left room 0..3000, right room 3000..6000; divider wall at x=3000 with a
    // door opening centered at y=2000 (width 900).
    const walls = [
      { points: [{x:0,y:0},{x:6000,y:0}] },        // south
      { points: [{x:0,y:4000},{x:6000,y:4000}] },  // north
      { points: [{x:0,y:0},{x:0,y:4000}] },        // west
      { points: [{x:6000,y:0},{x:6000,y:4000}] },  // east
      { points: [{x:3000,y:0},{x:3000,y:4000}] },  // interior divider
    ];
    const doors = [{ x: 3000, y: 2000, w: 900, rotation: 90 }]; // opening in the divider
    const windows = [];

    // ── segCrossesSolidWall: blocks a wall, passes a door gap + open floor ────
    ok('crosses solid divider (blocked)',
       segCrossesSolidWall(walls, doors, windows, 1500, 1000, 4500, 1000) === true);
    ok('passes through the doorway gap',
       segCrossesSolidWall(walls, doors, windows, 1500, 2000, 4500, 2000) === false);
    ok('open floor within a room (clear)',
       segCrossesSolidWall(walls, doors, windows, 500, 500, 2500, 3500) === false);
    ok('invisible wall is passable',
       segCrossesSolidWall(
         [{ points:[{x:1000,y:0},{x:1000,y:4000}], kind:'invisible' }], [], [],
         500, 2000, 1500, 2000) === false);
    ok('segmentsIntersect crossing X = true',
       segmentsIntersect({x:0,y:0},{x:10,y:10},{x:0,y:10},{x:10,y:0}) === true);
    ok('segmentsIntersect parallel = false',
       segmentsIntersect({x:0,y:0},{x:10,y:0},{x:0,y:5},{x:10,y:5}) === false);

    // ── Vacuum roam invariant: over N seconds the vacuum never crosses a solid
    // wall run. Faithfully mirrors Planner._stepVacuum: pick LOS-validated goals,
    // walk straight in speed·dt steps, re-pick on arrival. Assert 0 crossings. ─
    const spd = ROBOT_DEFAULTS.vacuum.speed;   // mm/s
    const dt = 0.05, seconds = 120;            // simulate 2 minutes @ 20 Hz
    let rng = 12345;                           // deterministic LCG
    const rand = () => (rng = (rng * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
    const pickGoal = (x, y) => {
      const m = 250;
      for (let k = 0; k < 14; k++) {
        const gx = m + rand() * (6000 - 2*m), gy = m + rand() * (4000 - 2*m);
        if (!segCrossesSolidWall(walls, doors, windows, x, y, gx, gy)) return { gx, gy };
      }
      return { gx: 500, gy: 500 };   // dock fallback
    };
    let rx = 500, ry = 500;          // start in the left room
    let g = pickGoal(rx, ry);
    let crossings = 0, steps = 0, reachedRight = false;
    for (let t = 0; t < seconds / dt; t++) {
      const dgoal = Math.hypot(g.gx - rx, g.gy - ry);
      if (dgoal < 200) g = pickGoal(rx, ry);
      const dx = g.gx - rx, dy = g.gy - ry, d = Math.hypot(dx, dy);
      if (d > 1) {
        const step = Math.min(spd * dt, d);
        const nx = rx + dx/d*step, ny = ry + dy/d*step;
        if (segCrossesSolidWall(walls, doors, windows, rx, ry, nx, ny)) {
          crossings++; g = pickGoal(rx, ry);   // (should never happen — LOS validated)
        } else {
          rx = nx; ry = ny; steps++;
          if (rx > 3050) reachedRight = true;   // reached the far room via the door
        }
      }
    }
    ok('vacuum roam: 0 wall crossings over 120 s', crossings === 0, `crossings=${crossings} steps=${steps}`);
    ok('vacuum reaches the far room via the doorway', reachedRight, `x=${Math.round(rx)}`);

    // ── Vacuum dock return: straight walk to the dock converges within 150 mm ─
    let bx = 5500, by = 3500; const dockX = 500, dockY = 500;
    for (let t = 0; t < 400; t++) {
      const dx = dockX - bx, dy = dockY - by, d = Math.hypot(dx, dy);
      if (d < 1) break;
      const step = Math.min(spd * dt, d);
      bx += dx/d*step; by += dy/d*step;
    }
    ok('vacuum returns to dock (<150 mm)', Math.hypot(dockX - bx, dockY - by) < 150,
       `dist=${Math.round(Math.hypot(dockX - bx, dockY - by))}`);

    // ── Mower sweep waypoints: house loop inside a bigger yard ────────────────
    // Outer rect 12000×9000; a closed house loop 4000..8000 × 3000..6000 in the
    // middle. Waypoints must all be OUTSIDE the house loop and inside the rect.
    const yardW = 12000, yardD = 9000;
    const houseWalls = [
      { points: [{x:4000,y:3000},{x:8000,y:3000},{x:8000,y:6000},{x:4000,y:6000},{x:4000,y:3000}] },
    ];
    const loops = closedWallLoops(houseWalls);
    ok('house forms ≥1 closed loop', loops.length >= 1, `loops=${loops.length}`);
    const wps = mowerSweepWaypoints(houseWalls, yardW, yardD);
    ok('mower has outdoor waypoints', wps.length > 10, `n=${wps.length}`);
    let insideHouse = 0, outOfRect = 0;
    for (const w of wps) {
      for (const lp of loops) if (pointInPolygon(w.x, w.y, lp)) { insideHouse++; break; }
      if (w.x < 0 || w.y < 0 || w.x > yardW || w.y > yardD) outOfRect++;
    }
    ok('no waypoint inside the house loop', insideHouse === 0, `insideHouse=${insideHouse}`);
    ok('all waypoints inside the yard rect', outOfRect === 0, `outOfRect=${outOfRect}`);

    // Loop that fills the whole rect → no outdoor cells → ellipse fallback.
    const fullWalls = [
      { points: [{x:0,y:0},{x:6000,y:0},{x:6000,y:4000},{x:0,y:4000},{x:0,y:0}] },
    ];
    const wpsFull = mowerSweepWaypoints(fullWalls, 6000, 4000);
    ok('loop fills rect → 0 waypoints (ellipse fallback)', wpsFull.length === 0, `n=${wpsFull.length}`);

    // ── GPS-mode mower: project a lat/lon to the calibrated plan point ────────
    // Two landmarks calibrate the geo→plan transform, then a THIRD known lat/lon
    // must project to its expected plan position (round-trip through the fit).
    // Scale is FIXED at 1 in the fit, so the geo ground distance L1→L2 must equal
    // the plan distance (hypot(5000,4000)=6403.1 mm = 6.4031 m). Place L2 that far
    // due NORTH of L1 (Δlat = 6.4031 m / earthR / deg); the fit rotates to align.
    const L1 = { x: 0,    y: 0,    lat: 40.00000000, lon: -105.00000 };
    const L2 = { x: 5000, y: 4000, lat: 40.00005758, lon: -105.00000 };
    const fit = fitGeoTransform([L1, L2]);
    ok('geo fit quality full', fit.quality === 'full', fit.quality);
    ok('geo fit RMS small (<50 mm)', fit.rmsMm < 50, `rms=${fit.rmsMm.toFixed(1)}`);
    // Round-trip: L1 and L2 land back on their plan coords.
    const p1 = latLonToPlan(fit, L1.lat, L1.lon);
    const p2 = latLonToPlan(fit, L2.lat, L2.lon);
    ok('L1 projects to (0,0)', p1 && near(p1.x, 0, 30) && near(p1.y, 0, 30), p1 && `(${p1.x.toFixed(0)},${p1.y.toFixed(0)})`);
    ok('L2 projects to (5000,4000)', p2 && near(p2.x, 5000, 30) && near(p2.y, 4000, 30), p2 && `(${p2.x.toFixed(0)},${p2.y.toFixed(0)})`);
    // A midpoint lat/lon lands near the plan midpoint.
    const mid = latLonToPlan(fit, (L1.lat+L2.lat)/2, (L1.lon+L2.lon)/2);
    ok('midpoint lat/lon → plan midpoint', mid && near(mid.x, 2500, 60) && near(mid.y, 2000, 60),
       mid && `(${mid.x.toFixed(0)},${mid.y.toFixed(0)})`);
    // Beyond-boundary point clamps onto the inflated rect edge (true bearing).
    const boundaryMm = 30000;
    const far = clampToBoundary(5000, 4000, boundaryMm, 90000, 2000);  // way east
    ok('beyond-boundary clamps onto ring edge', near(far.x, 5000 + boundaryMm, 1),
       `(${far.x.toFixed(0)},${far.y.toFixed(0)})`);

    // ── Roborock live vacuum position (#6): parsing ──────────────────────────
    // Object, array, and JSON-string forms of vacuum_position + fallback attrs.
    ok('parse object {x,y,a}', (() => {
      const p = parseVacuumPosition({ vacuum_position: { x: 25000, y: -12000, a: 90 } });
      return p && p.x === 25000 && p.y === -12000 && p.a === 90;
    })());
    ok('parse array [x,y,a]', (() => {
      const p = parseVacuumPosition({ vacuum_position: [1000, 2000, 45] });
      return p && p.x === 1000 && p.y === 2000 && p.a === 45;
    })());
    ok('parse array [x,y] (no angle)', (() => {
      const p = parseVacuumPosition({ vacuum_position: [1000, 2000] });
      return p && p.x === 1000 && p.y === 2000 && p.a === undefined;
    })());
    ok('parse JSON-string object', (() => {
      const p = parseVacuumPosition({ vacuum_position: '{"x":300,"y":-400,"angle":180}' });
      return p && p.x === 300 && p.y === -400 && p.a === 180;   // `angle` alias
    })());
    ok('parse JSON-string array', (() => {
      const p = parseVacuumPosition({ vacuum_position: '[7,8]' });
      return p && p.x === 7 && p.y === 8;
    })());
    ok('fallback to robot_position', (() => {
      const p = parseVacuumPosition({ robot_position: { x: 5, y: 6 } });
      return p && p.x === 5 && p.y === 6;
    })());
    ok('fallback to position', (() => {
      const p = parseVacuumPosition({ position: [9, 10] });
      return p && p.x === 9 && p.y === 10;
    })());
    ok('garbage → null', parseVacuumPosition({ vacuum_position: 'not json' }) === null);
    ok('missing attr → null', parseVacuumPosition({ foo: 1 }) === null);
    ok('null attrs → null', parseVacuumPosition(null) === null);
    ok('non-finite coords → null', parseVacuumPosition({ vacuum_position: { x: 'a', y: 2 } }) === null);

    // ── Calibration transform: raw map units → plan world mm ─────────────────
    // world = R(rot)·S(scale, flipY)·raw + offset.
    const idn = vacuumRawToWorld({ x: 100, y: 200 }, {});
    ok('identity transform', near(idn.x, 100) && near(idn.y, 200), `(${idn.x},${idn.y})`);
    const scl = vacuumRawToWorld({ x: 100, y: 200 }, { posScale: 10 });
    ok('scale 10 mm/unit', near(scl.x, 1000) && near(scl.y, 2000), `(${scl.x},${scl.y})`);
    const flp = vacuumRawToWorld({ x: 100, y: 200 }, { posScale: 10, posFlipY: true });
    ok('flipY mirrors Y', near(flp.x, 1000) && near(flp.y, -2000), `(${flp.x},${flp.y})`);
    const rot = vacuumRawToWorld({ x: 100, y: 0 }, { posScale: 1, posRotDeg: 90 });
    ok('rotate 90° maps +x→+y', near(rot.x, 0) && near(rot.y, 100), `(${rot.x},${rot.y})`);
    const off = vacuumRawToWorld({ x: 10, y: 20 }, { posScale: 1, posOffsetX: 500, posOffsetY: -300 });
    ok('offset added last', near(off.x, 510) && near(off.y, -280), `(${off.x},${off.y})`);
    const combo = vacuumRawToWorld({ x: 100, y: 200 },
      { posScale: 10, posFlipY: true, posRotDeg: 90, posOffsetX: 1000, posOffsetY: 2000 });
    // S: (1000,-2000); R90: (2000,1000); +offset: (3000,3000).
    ok('combined scale+flip+rot+offset', near(combo.x, 3000) && near(combo.y, 3000), `(${combo.x},${combo.y})`);

    // Heading transform: map angle → plan heading (radians).
    ok('heading rot only', near(vacuumRawHeadingRad(0, { posRotDeg: 90 }), Math.PI / 2, 1e-6));
    ok('heading flip negates', near(vacuumRawHeadingRad(90, { posFlipY: true }), -Math.PI / 2, 1e-6));

    // ── Dock-reference one-click solve ───────────────────────────────────────
    // Park raw at (250,-120) map units; dock world = (1500,900); scale 10, rot 0.
    // Solve offset so the transform lands the raw point on the dock.
    const cal = { posScale: 10, posRotDeg: 0, posFlipY: false };
    const rawDock = { x: 250, y: -120 };
    const dock = { x: 1500, y: 900 };
    const sol = solveVacuumDockOffset(rawDock, dock, cal);
    const back = vacuumRawToWorld(rawDock, { ...cal, ...sol });
    ok('dock-solve maps raw onto dock', near(back.x, dock.x) && near(back.y, dock.y),
       `off=(${sol.posOffsetX.toFixed(0)},${sol.posOffsetY.toFixed(0)}) back=(${back.x.toFixed(0)},${back.y.toFixed(0)})`);
    // With rotation + flip the solve still lands exactly on the dock.
    const cal2 = { posScale: 5, posRotDeg: 90, posFlipY: true };
    const sol2 = solveVacuumDockOffset({ x: 300, y: 200 }, { x: -800, y: 640 }, cal2);
    const back2 = vacuumRawToWorld({ x: 300, y: 200 }, { ...cal2, ...sol2 });
    ok('dock-solve with rot+flip lands on dock', near(back2.x, -800) && near(back2.y, 640),
       `back=(${back2.x.toFixed(0)},${back2.y.toFixed(0)})`);

    // ── LIVE mode overrides simulation + fallback on parse failure ───────────
    // Mirror Planner._vacuumLive + the LIVE branch of _stepVacuum: given a bound
    // posEntity whose vacuum_position parses, the puck eases toward the live world
    // point (spd·3 catch-up) regardless of simulated goals; a parse failure yields
    // no live fix → the controller falls back to the sim roam.
    const calL = { posScale: 10, posOffsetX: 0, posOffsetY: 0, posRotDeg: 0 };
    const vacuumLive = (attrs) => {
      const raw = parseVacuumPosition(attrs);
      if (!raw) return null;
      const w = vacuumRawToWorld(raw, calL);
      return { x: w.x, y: w.y, headingRad: raw.a != null ? vacuumRawHeadingRad(raw.a, calL) : null };
    };
    ok('parse failure → no live fix (sim fallback)', vacuumLive({ foo: 1 }) === null);
    // Ease toward a fixed live target from a wrong start; must converge, ignoring
    // any random sim goal-picking (there is none in LIVE mode).
    const live = vacuumLive({ vacuum_position: { x: 400, y: 250 } });   // → world (4000,2500)
    ok('live fix projects to world mm', live && near(live.x, 4000) && near(live.y, 2500),
       live && `(${live.x},${live.y})`);
    let lx = 0, ly = 0; const spdL = ROBOT_DEFAULTS.vacuum.speed;
    for (let t = 0; t < 400; t++) {
      const dx = live.x - lx, dy = live.y - ly, dd = Math.hypot(dx, dy);
      if (dd < 1) break;
      const step = Math.min(spdL * 3 * dt, dd);   // LIVE catch-up factor
      lx += dx / dd * step; ly += dy / dd * step;
    }
    ok('LIVE easing converges to the live position', Math.hypot(live.x - lx, live.y - ly) < 5,
       `dist=${Math.hypot(live.x - lx, live.y - ly).toFixed(1)}`);

    // ── LED color mapping (visual state) ─────────────────────────────────────
    ok('LED cleaning = green', robotLedColor('cleaning') === '#43a047');
    ok('LED returning = blue', robotLedColor('returning') === '#2196f3');
    ok('LED error = red', robotLedColor('error') === '#e53935');
    ok('LED docked = amber', robotLedColor('docked') === '#ffca28');

    // ── Progress source resolution (pure robotProgress) ──────────────────────
    const so = (map) => (id) => map[id] ?? null;
    ok('progress: entity state parses + clamps',
       robotProgress({ progressEntity: 'sensor.p' }, so({ 'sensor.p': { state: '42' } })) === 42);
    ok('progress: entity clamps >100',
       robotProgress({ progressEntity: 'sensor.p' }, so({ 'sensor.p': { state: '140' } })) === 100);
    ok('progress: attribute fallback (cleaned_area_percent)',
       robotProgress({ entity_id: 'vacuum.v' }, so({ 'vacuum.v': { state: 'cleaning', attributes: { cleaned_area_percent: 73 } } })) === 73);
    ok('progress: entity field WINS over attribute',
       robotProgress({ progressEntity: 'sensor.p', entity_id: 'vacuum.v' },
         so({ 'sensor.p': { state: '20' }, 'vacuum.v': { state: 'x', attributes: { progress: 90 } } })) === 20);
    ok('progress: no source → null',
       robotProgress({ entity_id: 'vacuum.v' }, so({ 'vacuum.v': { state: 'cleaning', attributes: {} } })) === null);
    ok('progress: non-numeric entity state → null (no attrs)',
       robotProgress({ progressEntity: 'sensor.p' }, so({ 'sensor.p': { state: 'unavailable' } })) === null);

    // ── Renderer: rig geometry + progress strip/ring (built chunk) ────────────
    try {
      const rmod = await import('./assets/three-renderer.js?v=' + Date.now());
      const R = new rmod.ThreeDRenderer(document.getElementById('rc'));
      await R.load();
      const scene3d = { preset: 'day', floorColor: '#223344', floorTex: 'none', wallColor: '#bbbbbb' };
      const mkFloor = (robots) => ({
        id: 'f1', name: 'R', w: 8000, d: 6000, walls: [], furniture: [],
        lights: [], switches: [], sensors: [], motionSensors: [], envSensors: [],
        doors: [], windows: [], bg: null, model3d: null, look3d: null, rooms: [], robots,
      });
      const mowerFx = { id: 'm1', kind: 'mower', x: 3000, y: 3000, entity_id: 'lawn_mower.m', progressEntity: 'sensor.mow' };
      const vacFx   = { id: 'v1', kind: 'vacuum', x: 5000, y: 3000, entity_id: 'vacuum.v', progressEntity: 'sensor.vac' };
      const noSrcFx = { id: 'n1', kind: 'mower', x: 6500, y: 3000, entity_id: null };
      const stOf = (led) => ({ x: 0, y: 0, heading: 0, phase: 0, activity: 'mowing', led });
      R.updateFloor(mkFloor([mowerFx, vacFx, noSrcFx]), scene3d);

      const rigM = () => R._robotRigs['m1'];
      const rigV = () => R._robotRigs['v1'];
      const rigN = () => R._robotRigs['n1'];
      const countUD = (rig, flag) => { let n = 0; rig.group.traverse(o => { if (o.userData && o.userData[flag]) n++; }); return n; };
      const litCount = (rig) => rig.progressMats.filter(m => m.emissiveIntensity > 0.5).length;

      // Build rigs (returning-blue state → lamp color check).
      R.updateRobotRigs([mowerFx, vacFx, noSrcFx],
        { m1: { ...stOf('#2196f3'), x: 3000, y: 3000 }, v1: { ...stOf('#2196f3'), x: 5000, y: 3000 }, n1: { ...stOf('#78909c'), x: 6500, y: 3000 } },
        { m1: 42, v1: 50, n1: null });

      ok('rig: mower + vacuum + no-source rigs built', !!rigM() && !!rigV() && !!rigN());
      ok('rig: mower has ≥4 wheels', countUD(rigM(), 'robotWheel') >= 4, 'wheels=' + countUD(rigM(), 'robotWheel'));
      ok('rig: mower status lamp exists', countUD(rigM(), 'robotLamp') >= 1, 'lamps=' + countUD(rigM(), 'robotLamp'));
      ok('rig: vacuum status lamp exists', countUD(rigV(), 'robotLamp') >= 1, 'lamps=' + countUD(rigV(), 'robotLamp'));
      ok('rig: mower lamp takes state color (returning=blue)', rigM().ledMat.color.getHex() === 0x2196f3, '0x' + rigM().ledMat.color.getHex().toString(16));

      ok('rig: mower progress strip has 10 segments', rigM().progressMats.length === 10, 'n=' + rigM().progressMats.length);
      ok('rig: vacuum progress ring has 12 segments', rigV().progressMats.length === 12, 'n=' + rigV().progressMats.length);
      ok('rig: mower 4-of-10 lit at 42%', rigM().progressGroup.visible && litCount(rigM()) === 4, 'lit=' + litCount(rigM()));
      ok('rig: vacuum 6-of-12 lit at 50%', rigV().progressGroup.visible && litCount(rigV()) === 6, 'lit=' + litCount(rigV()));
      ok('rig: no-source robot hides its progress strip', rigN().progressGroup.visible === false);

      // Vacuum ring wraps the puck axis: all segments at a fixed radius, angles span a full circle.
      {
        const segs = rigV().progressGroup.children;
        const radii = segs.map(s => Math.hypot(s.position.x, s.position.z));
        const rMean = radii.reduce((a, b) => a + b, 0) / radii.length;
        const constR = radii.every(r => Math.abs(r - rMean) < 1);
        const angs = segs.map(s => Math.atan2(s.position.x, s.position.z));
        const span = Math.max(...angs) - Math.min(...angs);
        ok('rig: vacuum ring circles the puck axis (constant radius)', constR && rMean > 100, 'rMean=' + rMean.toFixed(0));
        ok('rig: vacuum ring wraps > 5 rad around the axis', span > 5, 'span=' + span.toFixed(2));
      }

      // Re-drive with a new percentage → segments re-fill without rebuild (same rig object).
      const rigMref = rigM();
      R.updateRobotRigs([mowerFx, vacFx, noSrcFx],
        { m1: { ...stOf('#43a047'), x: 3000, y: 3000 }, v1: { ...stOf('#43a047'), x: 5000, y: 3000 }, n1: { ...stOf('#78909c'), x: 6500, y: 3000 } },
        { m1: 100, v1: 0, n1: null });
      ok('rig: progress re-fills in place (no rebuild)', rigM() === rigMref && litCount(rigM()) === 10, 'lit=' + litCount(rigM()));
      ok('rig: vacuum 0% → no segments lit', litCount(rigV()) === 0, 'lit=' + litCount(rigV()));
    } catch (e) {
      ok('renderer rig tests threw', false, String(e && e.message || e));
    }

    // ── Real Planner: progressEntity is config-path (_isSlowEntity) + 2D no-throw ─
    try {
      const { Planner } = await import('./planner.mod.js?v=' + Date.now());
      const p = new Planner();
      const f = p.floor();
      const robot = { id: 'pr1', kind: 'vacuum', x: 1000, y: 1000, entity_id: 'vacuum.v', progressEntity: 'sensor.prog' };
      f.robots = [robot];
      ok('planner: progressEntity is config-path', p._isSlowEntity('sensor.prog') === true);
      ok('planner: unrelated id is NOT config-path', p._isSlowEntity('sensor.random_unbound') === false);

      // 2D drawAll no-throw with a robot + live progress sensor state.
      const { drawAll, computeView } = await import('./canvas-render.mod.js?v=' + Date.now());
      p.hass = { states: { 'sensor.prog': { state: '55', attributes: {} }, 'vacuum.v': { state: 'cleaning', attributes: {} } } };
      p.robotStates = { pr1: { x: 1200, y: 1100, heading: 0.4, phase: 1, activity: 'cleaning', led: '#43a047' } };
      const cv = document.getElementById('c2d');
      const ctx = cv.getContext('2d');
      const view = computeView(cv, f.w, f.d, p.viewCenter, p.zoom);
      let threw = false;
      try { drawAll(ctx, p, view, null); } catch (e) { threw = true; ok('drawAll threw', false, String(e && e.message || e)); }
      ok('2D drawAll with robot + progress does not throw', !threw);
    } catch (e) {
      ok('planner/2D tests threw', false, String(e && e.message || e));
    }

    // ── Mower CAR KINEMATICS (bicycle model) ─────────────────────────────────
    // The mower is a wheeled vehicle, not a puck: position advances STRICTLY
    // along its own heading, and the heading turns at a bounded rate (min
    // turning circle MOWER_KINEMATICS.turnRadiusMm). Asserted first on the pure
    // integrator, then end-to-end on the REAL Planner._stepMower.
    {
      const K = MOWER_KINEMATICS;
      ok('MOWER_ROW_MM ≥ 2 · turnRadiusMm (a row-end U-turn fits one arc)',
         MOWER_ROW_MM >= 2 * K.turnRadiusMm, `row=${MOWER_ROW_MM} 2R=${2 * K.turnRadiusMm}`);
      ok('wrapAngle normalizes into (−π, π]',
         Math.abs(wrapAngle(3 * Math.PI) - Math.PI) < 1e-9 &&
         Math.abs(wrapAngle(-3 * Math.PI) - Math.PI) < 1e-9 &&
         Math.abs(wrapAngle(0.4) - 0.4) < 1e-12);

      // Pure integrator: 400 steps chasing a target that is deliberately BEHIND
      // and off to the side, so the whole envelope (max steer, speed shaping,
      // the unreachable-inside-the-circle escape) is exercised.
      const st = { x: 0, y: 0, heading: 0, speed: 0 };
      let maxLat = 0, omegaViol = 0, maxDTheta = 0, overSpeed = 0;
      const dtK = 0.05;
      for (let i = 0; i < 400; i++) {
        const tx = 3000 * Math.cos(i * 0.017) - 1500, ty = 2500 * Math.sin(i * 0.017);
        const px = st.x, py = st.y, ph = st.heading;
        const { omega } = stepBicycle(st, tx, ty, dtK);
        // Displacement must be parallel to the POST-step heading (no strafing):
        // the perpendicular component is identically zero by construction.
        const dx = st.x - px, dy = st.y - py;
        const lat = Math.abs(dx * -Math.sin(st.heading) + dy * Math.cos(st.heading));
        if (lat > maxLat) maxLat = lat;
        // Bounded yaw rate ⇒ |ω| ≤ v / R_MIN.
        if (Math.abs(omega) > st.speed / K.turnRadiusMm + 1e-9) omegaViol++;
        const dth = Math.abs(wrapAngle(st.heading - ph));
        if (dth > maxDTheta) maxDTheta = dth;
        if (st.speed > K.maxSpeedMm + 1e-9) overSpeed++;
      }
      ok('pure: displacement is parallel to heading (|lateral| < 1 mm/step)',
         maxLat < 1, `maxLat=${maxLat.toExponential(2)} mm`);
      ok('pure: |ω| ≤ v / turnRadiusMm every step', omegaViol === 0, `violations=${omegaViol}`);
      ok('pure: speed never exceeds maxSpeedMm', overSpeed === 0, `violations=${overSpeed}`);
      ok('pure: per-step heading change stays bounded (no instant flips)',
         maxDTheta <= (K.maxSpeedMm / K.turnRadiusMm) * dtK + 1e-9,
         `maxΔθ=${maxDTheta.toFixed(4)} cap=${((K.maxSpeedMm / K.turnRadiusMm) * dtK).toFixed(4)}`);
      // Speed shaping: slow into a big heading error, cruise when aligned.
      const sTurn = { x: 0, y: 0, heading: 0, speed: K.maxSpeedMm };
      for (let i = 0; i < 20; i++) stepBicycle(sTurn, -4000, 0, 0.05);   // target dead astern
      const sStraight = { x: 0, y: 0, heading: 0, speed: 0 };
      for (let i = 0; i < 40; i++) stepBicycle(sStraight, 40000, 0, 0.05);
      ok('pure: aligned run reaches (near) full speed',
         sStraight.speed > K.maxSpeedMm * 0.95, `v=${sStraight.speed.toFixed(0)}`);
      ok('pure: a hard turn slows the mower but never stalls it',
         sTurn.speed < K.maxSpeedMm * 0.9 && sTurn.speed >= K.minSpeedMm - 1e-6,
         `v=${sTurn.speed.toFixed(0)} floor=${K.minSpeedMm}`);
      // Turning circle: full-lock from rest never curls tighter than turnRadiusMm.
      const sArc = { x: 0, y: 0, heading: 0, speed: K.maxSpeedMm };
      let tightest = Infinity;
      for (let i = 0; i < 300; i++) {
        const v0 = sArc.speed;
        const { omega } = stepBicycle(sArc, sArc.x - 10, sArc.y + 1, 0.05);  // permanent hard-left demand
        if (Math.abs(omega) > 1e-6) tightest = Math.min(tightest, v0 / Math.abs(omega));
      }
      ok('pure: tightest achieved radius ≥ turnRadiusMm',
         tightest >= K.turnRadiusMm - 1, `r=${isFinite(tightest) ? tightest.toFixed(1) : 'n/a'}`);
      // Waypoint advance: captured inside arriveMm, and passed-by behind us.
      ok('mowerWaypointReached: inside the capture radius',
         mowerWaypointReached({ x: 0, y: 0, heading: 0 }, K.arriveMm * 0.5, 0) === true);
      ok('mowerWaypointReached: ahead + far = not reached',
         mowerWaypointReached({ x: 0, y: 0, heading: 0 }, 3000, 0) === false);
      ok('mowerWaypointReached: passed by (behind, inside the turning circle)',
         mowerWaypointReached({ x: 0, y: 0, heading: 0 }, -600, 0) === true);
      ok('mowerWaypointReached: behind but FAR = still chase it (wide loop)',
         mowerWaypointReached({ x: 0, y: 0, heading: 0 }, -4000, 0) === false);
      // Row pitch plumbed into the sweep generator (default call unchanged).
      const wpsDefault = mowerSweepWaypoints([], 6000, 6000);
      const wpsRow = mowerSweepWaypoints([], 6000, 6000, 800, 300, MOWER_ROW_MM);
      const rowYs = (w) => [...new Set(w.map(p => p.y))].sort((a, b) => a - b);
      const yD = rowYs(wpsDefault), yR = rowYs(wpsRow);
      ok('sweep: default rowCell keeps the legacy 800 mm pitch',
         yD.length > 1 && yD[1] - yD[0] === 800, `pitch=${yD[1] - yD[0]}`);
      ok('sweep: explicit rowCell widens the row pitch to MOWER_ROW_MM',
         yR.length > 1 && yR[1] - yR[0] === MOWER_ROW_MM, `pitch=${yR[1] - yR[0]}`);
      ok('sweep: along-row cell pitch is untouched by rowCell',
         [...new Set(wpsRow.filter(p => p.y === yR[0]).map(p => p.x))].length ===
         [...new Set(wpsDefault.filter(p => p.y === yD[0]).map(p => p.x))].length);
    }

    // ── Real Planner: mower drives car-like; vacuum branch byte-identical ─────
    try {
      const { Planner } = await import('./planner.mod.js?v=' + Date.now());
      const K = MOWER_KINEMATICS;
      // Mower: 40 s of simulated mowing over an empty yard.
      const pm = new Planner();
      const fm = pm.floor();
      fm.w = 12000; fm.d = 9000; fm.walls = [];
      fm.robots = [{ id: 'm1', kind: 'mower', x: 800, y: 800 }];
      pm.stepRobots(0.05);
      const rm = pm.robotStates.m1;
      rm.demoPhase = 'run'; rm.demoTimer = 99999;
      let mLat = 0, mOmegaViol = 0, mMaxD = 0, travelled = 0;
      const seenRows = new Set();
      for (let i = 0; i < 800; i++) {
        const px = rm.x, py = rm.y, ph = rm.heading, pv = rm.speed;
        pm.stepRobots(0.05);
        const dx = rm.x - px, dy = rm.y - py;
        travelled += Math.hypot(dx, dy);
        mLat = Math.max(mLat, Math.abs(dx * -Math.sin(rm.heading) + dy * Math.cos(rm.heading)));
        const dth = Math.abs(wrapAngle(rm.heading - ph));
        mMaxD = Math.max(mMaxD, dth);
        if (dth > (Math.max(rm.speed, pv) / K.turnRadiusMm) * 0.05 + 1e-6) mOmegaViol++;
        seenRows.add(Math.round(rm.y / MOWER_ROW_MM));
      }
      ok('planner mower: motion is parallel to heading (|lateral| < 1 mm/step)',
         mLat < 1, `maxLat=${mLat.toExponential(2)} mm`);
      ok('planner mower: yaw rate never exceeds v / turnRadiusMm',
         mOmegaViol === 0, `violations=${mOmegaViol}`);
      ok('planner mower: heading is continuous across row ends (no instant flips)',
         mMaxD <= (K.maxSpeedMm / K.turnRadiusMm) * 0.05 + 1e-6,
         `maxΔθ=${mMaxD.toFixed(4)} rad/step`);
      ok('planner mower: actually covers ground over 40 s',
         travelled > 8000, `travelled=${Math.round(travelled)} mm`);
      ok('planner mower: sweeps more than one row', seenRows.size >= 2, `rows=${seenRows.size}`);
      ok('planner mower: cruises near max speed while mowing',
         rm.speed > K.minSpeedMm, `v=${rm.speed.toFixed(0)}`);
      // Dock return converges + parks (speed → 0 inside the capture radius).
      // 900 steps = 45 s: comfortably past the ~30 s drive home, and short of the
      // ≥60 s docked dwell after which the unbound demo cycle sets off again.
      rm.demoPhase = 'return'; rm.demoTimer = 99999;
      for (let i = 0; i < 900; i++) pm.stepRobots(0.05);
      const dDock = Math.hypot(rm.x - 800, rm.y - 800);
      ok('planner mower: returns to the dock and parks',
         dDock < K.arriveMm + 50 && rm.speed < 5,
         `dist=${Math.round(dDock)} v=${rm.speed.toFixed(1)}`);

      // Vacuum branch pin: the point-chasing controller is UNTOUCHED by the
      // mower rewrite. Two probe positions captured from the pre-change build
      // (deterministic LCG seeded over Math.random) must reproduce EXACTLY.
      const rngSave = Math.random;
      let rngS = 987654321;
      Math.random = () => ((rngS = (rngS * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff);
      const pv2 = new Planner();
      const fv = pv2.floor();
      fv.w = 8000; fv.d = 6000; fv.walls = [];
      fv.robots = [{ id: 'v1', kind: 'vacuum', x: 900, y: 900 }];
      pv2.stepRobots(0.05);
      const rv = pv2.robotStates.v1;
      rv.demoPhase = 'run'; rv.demoTimer = 9999; rv.goalTimer = 0;
      const probes = [];
      for (let i = 0; i < 900; i++) {
        pv2.stepRobots(0.05);
        if (i === 299 || i === 899) probes.push(`${rv.x.toFixed(3)},${rv.y.toFixed(3)},${rv.heading.toFixed(5)}`);
      }
      Math.random = rngSave;
      ok('vacuum branch unchanged: probe @15 s matches the baseline capture',
         probes[0] === '4052.987,3121.044,0.86032', probes[0]);
      ok('vacuum branch unchanged: probe @45 s matches the baseline capture',
         probes[1] === '4403.483,4189.805,0.97709', probes[1]);
    } catch (e) {
      ok('planner mower/vacuum kinematics tests threw', false, String(e && e.message || e));
    }

    // ── run + report ─────────────────────────────────────────────────────────
    const grid = document.getElementById('grid');
    let pass = 0; const fails = [];
    for (const t of tests) {
      if (t.ok) pass++; else fails.push(t.name);
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `<div class="row">
        <span>${t.ok ? '<span class=pass>PASS</span>' : '<span class=fail>FAIL</span>'} ${t.name}</span>
        <span>${t.detail ?? ''}</span></div>`;
      grid.appendChild(card);
    }
    const total = tests.length;
    const allPass = pass === total;
    const title = allPass ? `ROBOT PASS ${pass}/${total}` : `ROBOT FAIL ${pass}/${total} [${fails.join(',')}]`;
    document.title = title;
    const sum = document.getElementById('summary');
    sum.textContent = title;
    sum.className = allPass ? 'okbg' : 'badbg';
  </script>
</body>
</html>
