<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>ROBOT …</title>
  <style>
    body { margin:0; background:#0d1116; color:#cfd8dc; font:13px/1.4 sans-serif; padding:14px; }
    h1 { font-size:15px; margin:0 0 10px; }
    .grid { display:flex; flex-wrap:wrap; gap:10px; }
    .card { background:#141b22; border:1px solid #26323d; border-radius:6px; padding:8px 10px; width:360px; }
    .row { display:flex; justify-content:space-between; font-size:11px; gap:8px; }
    .pass { color:#69f0ae; } .fail { color:#ff5252; }
    #summary { font-size:14px; font-weight:bold; margin:10px 0; padding:8px 10px; border-radius:5px; }
    .okbg { background:#12331f; color:#69f0ae; } .badbg { background:#3a1414; color:#ff8a80; }
    code { color:#ffd54f; }
  </style>
</head>
<body>
  <h1>Robot vacuum / mower — wall-avoidance, dock return, outdoor sweep, GPS projection, rig redesign</h1>
  <div id="summary">Running…</div>
  <div class="grid" id="grid"></div>
  <!-- Renderer canvas (rig geometry + progress) + a hidden 2D canvas (drawAll). -->
  <div id="rc" style="width:900px;height:600px;position:absolute;left:-9999px;top:0"></div>
  <div id="rc2" style="width:600px;height:400px;position:absolute;left:-9999px;top:1300px"></div>
  <canvas id="c2d" width="800" height="600" style="position:absolute;left:-9999px;top:620px"></canvas>

  <!-- Harness build (from the repo root; NEVER reuse stale bundles). The pure
       modules are standalone transpiles (NOT code-split chunks); the Planner +
       2D canvas come in as bundles, and `./assets/three-renderer.js` is the REAL
       built chunk, so a fresh `npm run build` must be copied in too:
         npm run build
         H=/tmp/diorama-harness-robot
         rm -rf "$H"; mkdir -p "$H"; cp -r dist/* "$H"/
         cp test-pages/robot-test.html "$H"/
         T=$(mktemp -d); cp -r src/* "$T"/; cp tsconfig.json "$T"/
         cp test-pages/fake-avatar-store.ts "$T"/avatar-store.ts
         printf "export * from './canvas-render.js';\nexport * from './canvas-hit.js';\nexport * from './layer-defs.js';\n" > "$T"/canvas2d-entry.ts
         npx esbuild "$T"/geometry.ts       --bundle --format=esm --outfile="$H"/geometry.mod.js
         npx esbuild "$T"/geo.ts            --bundle --format=esm --outfile="$H"/geo.mod.js
         npx esbuild "$T"/planner.ts        --bundle --format=esm --outfile="$H"/planner.mod.js
         npx esbuild "$T"/canvas2d-entry.ts --bundle --format=esm --outfile="$H"/canvas-render.mod.js
       canvas-render + canvas-hit + layer-defs share ONE bundle (the flightHitPx
       single-module-instance reasoning: separate bundles would each get their own
       module state, and the hit tests read what the draw pass published).
       Run headless (serve over http — Chrome blocks module imports on file://):
         (cd "$H" && python3 -m http.server 8977 &)
         google-chrome --headless=new --disable-gpu --use-angle=swiftshader \
           --enable-unsafe-swiftshader --window-size=1200,900 \
           --virtual-time-budget=40000 --dump-dom \
           "http://localhost:8977/robot-test.html" | grep -o "<title>[^<]*" -->
  <script type="module">
    import {
      segCrossesSolidWall, mowerSweepWaypoints, segmentsIntersect,
      pointInPolygon, closedWallLoops, robotLedColor, robotProgress, ROBOT_DEFAULTS,
      MOWER_KINEMATICS, MOWER_ROW_MM, stepBicycle, mowerWaypointReached, wrapAngle,
      parseVacuumPosition, vacuumRawToWorld, vacuumRawHeadingRad, solveVacuumDockOffset,
      dockParkedHeading, frontVectorPlan, furnitureWorldToLocal,
      hexToInt,
    } from './geometry.mod.js';
    import { fitGeoTransform, latLonToPlan, clampToBoundary } from './geo.mod.js';

    const tests = [];
    const ok = (name, cond, detail) => tests.push({ name, ok: !!cond, detail });
    const near = (a, b, e = 1) => Math.abs(a - b) <= e;

    // ── Fixtures: two rooms split by a wall with a DOORWAY gap ────────────────
    // Left room 0..3000, right room 3000..6000; divider wall at x=3000 with a
    // door opening centered at y=2000 (width 900).
    const walls = [
      { points: [{x:0,y:0},{x:6000,y:0}] },        // south
      { points: [{x:0,y:4000},{x:6000,y:4000}] },  // north
      { points: [{x:0,y:0},{x:0,y:4000}] },        // west
      { points: [{x:6000,y:0},{x:6000,y:4000}] },  // east
      { points: [{x:3000,y:0},{x:3000,y:4000}] },  // interior divider
    ];
    const doors = [{ x: 3000, y: 2000, w: 900, rotation: 90 }]; // opening in the divider
    const windows = [];

    // ── segCrossesSolidWall: blocks a wall, passes a door gap + open floor ────
    ok('crosses solid divider (blocked)',
       segCrossesSolidWall(walls, doors, windows, 1500, 1000, 4500, 1000) === true);
    ok('passes through the doorway gap',
       segCrossesSolidWall(walls, doors, windows, 1500, 2000, 4500, 2000) === false);
    ok('open floor within a room (clear)',
       segCrossesSolidWall(walls, doors, windows, 500, 500, 2500, 3500) === false);
    ok('invisible wall is passable',
       segCrossesSolidWall(
         [{ points:[{x:1000,y:0},{x:1000,y:4000}], kind:'invisible' }], [], [],
         500, 2000, 1500, 2000) === false);
    ok('segmentsIntersect crossing X = true',
       segmentsIntersect({x:0,y:0},{x:10,y:10},{x:0,y:10},{x:10,y:0}) === true);
    ok('segmentsIntersect parallel = false',
       segmentsIntersect({x:0,y:0},{x:10,y:0},{x:0,y:5},{x:10,y:5}) === false);

    // ── Vacuum roam invariant: over N seconds the vacuum never crosses a solid
    // wall run. Faithfully mirrors Planner._stepVacuum: pick LOS-validated goals,
    // walk straight in speed·dt steps, re-pick on arrival. Assert 0 crossings. ─
    const spd = ROBOT_DEFAULTS.vacuum.speed;   // mm/s
    const dt = 0.05, seconds = 120;            // simulate 2 minutes @ 20 Hz
    let rng = 12345;                           // deterministic LCG
    const rand = () => (rng = (rng * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
    const pickGoal = (x, y) => {
      const m = 250;
      for (let k = 0; k < 14; k++) {
        const gx = m + rand() * (6000 - 2*m), gy = m + rand() * (4000 - 2*m);
        if (!segCrossesSolidWall(walls, doors, windows, x, y, gx, gy)) return { gx, gy };
      }
      return { gx: 500, gy: 500 };   // dock fallback
    };
    let rx = 500, ry = 500;          // start in the left room
    let g = pickGoal(rx, ry);
    let crossings = 0, steps = 0, reachedRight = false;
    for (let t = 0; t < seconds / dt; t++) {
      const dgoal = Math.hypot(g.gx - rx, g.gy - ry);
      if (dgoal < 200) g = pickGoal(rx, ry);
      const dx = g.gx - rx, dy = g.gy - ry, d = Math.hypot(dx, dy);
      if (d > 1) {
        const step = Math.min(spd * dt, d);
        const nx = rx + dx/d*step, ny = ry + dy/d*step;
        if (segCrossesSolidWall(walls, doors, windows, rx, ry, nx, ny)) {
          crossings++; g = pickGoal(rx, ry);   // (should never happen — LOS validated)
        } else {
          rx = nx; ry = ny; steps++;
          if (rx > 3050) reachedRight = true;   // reached the far room via the door
        }
      }
    }
    ok('vacuum roam: 0 wall crossings over 120 s', crossings === 0, `crossings=${crossings} steps=${steps}`);
    ok('vacuum reaches the far room via the doorway', reachedRight, `x=${Math.round(rx)}`);

    // ── Vacuum dock return: straight walk to the dock converges within 150 mm ─
    let bx = 5500, by = 3500; const dockX = 500, dockY = 500;
    for (let t = 0; t < 400; t++) {
      const dx = dockX - bx, dy = dockY - by, d = Math.hypot(dx, dy);
      if (d < 1) break;
      const step = Math.min(spd * dt, d);
      bx += dx/d*step; by += dy/d*step;
    }
    ok('vacuum returns to dock (<150 mm)', Math.hypot(dockX - bx, dockY - by) < 150,
       `dist=${Math.round(Math.hypot(dockX - bx, dockY - by))}`);

    // ── Mower sweep waypoints: house loop inside a bigger yard ────────────────
    // Outer rect 12000×9000; a closed house loop 4000..8000 × 3000..6000 in the
    // middle. Waypoints must all be OUTSIDE the house loop and inside the rect.
    const yardW = 12000, yardD = 9000;
    const houseWalls = [
      { points: [{x:4000,y:3000},{x:8000,y:3000},{x:8000,y:6000},{x:4000,y:6000},{x:4000,y:3000}] },
    ];
    const loops = closedWallLoops(houseWalls);
    ok('house forms ≥1 closed loop', loops.length >= 1, `loops=${loops.length}`);
    const wps = mowerSweepWaypoints(houseWalls, yardW, yardD);
    ok('mower has outdoor waypoints', wps.length > 10, `n=${wps.length}`);
    let insideHouse = 0, outOfRect = 0;
    for (const w of wps) {
      for (const lp of loops) if (pointInPolygon(w.x, w.y, lp)) { insideHouse++; break; }
      if (w.x < 0 || w.y < 0 || w.x > yardW || w.y > yardD) outOfRect++;
    }
    ok('no waypoint inside the house loop', insideHouse === 0, `insideHouse=${insideHouse}`);
    ok('all waypoints inside the yard rect', outOfRect === 0, `outOfRect=${outOfRect}`);

    // Loop that fills the whole rect → no outdoor cells → ellipse fallback.
    const fullWalls = [
      { points: [{x:0,y:0},{x:6000,y:0},{x:6000,y:4000},{x:0,y:4000},{x:0,y:0}] },
    ];
    const wpsFull = mowerSweepWaypoints(fullWalls, 6000, 4000);
    ok('loop fills rect → 0 waypoints (ellipse fallback)', wpsFull.length === 0, `n=${wpsFull.length}`);

    // ── GPS-mode mower: project a lat/lon to the calibrated plan point ────────
    // Two landmarks calibrate the geo→plan transform, then a THIRD known lat/lon
    // must project to its expected plan position (round-trip through the fit).
    // Scale is FIXED at 1 in the fit, so the geo ground distance L1→L2 must equal
    // the plan distance (hypot(5000,4000)=6403.1 mm = 6.4031 m). Place L2 that far
    // due NORTH of L1 (Δlat = 6.4031 m / earthR / deg); the fit rotates to align.
    const L1 = { x: 0,    y: 0,    lat: 40.00000000, lon: -105.00000 };
    const L2 = { x: 5000, y: 4000, lat: 40.00005758, lon: -105.00000 };
    const fit = fitGeoTransform([L1, L2]);
    ok('geo fit quality full', fit.quality === 'full', fit.quality);
    ok('geo fit RMS small (<50 mm)', fit.rmsMm < 50, `rms=${fit.rmsMm.toFixed(1)}`);
    // Round-trip: L1 and L2 land back on their plan coords.
    const p1 = latLonToPlan(fit, L1.lat, L1.lon);
    const p2 = latLonToPlan(fit, L2.lat, L2.lon);
    ok('L1 projects to (0,0)', p1 && near(p1.x, 0, 30) && near(p1.y, 0, 30), p1 && `(${p1.x.toFixed(0)},${p1.y.toFixed(0)})`);
    ok('L2 projects to (5000,4000)', p2 && near(p2.x, 5000, 30) && near(p2.y, 4000, 30), p2 && `(${p2.x.toFixed(0)},${p2.y.toFixed(0)})`);
    // A midpoint lat/lon lands near the plan midpoint.
    const mid = latLonToPlan(fit, (L1.lat+L2.lat)/2, (L1.lon+L2.lon)/2);
    ok('midpoint lat/lon → plan midpoint', mid && near(mid.x, 2500, 60) && near(mid.y, 2000, 60),
       mid && `(${mid.x.toFixed(0)},${mid.y.toFixed(0)})`);
    // Beyond-boundary point clamps onto the inflated rect edge (true bearing).
    const boundaryMm = 30000;
    const far = clampToBoundary(5000, 4000, boundaryMm, 90000, 2000);  // way east
    ok('beyond-boundary clamps onto ring edge', near(far.x, 5000 + boundaryMm, 1),
       `(${far.x.toFixed(0)},${far.y.toFixed(0)})`);

    // ── Roborock live vacuum position (#6): parsing ──────────────────────────
    // Object, array, and JSON-string forms of vacuum_position + fallback attrs.
    ok('parse object {x,y,a}', (() => {
      const p = parseVacuumPosition({ vacuum_position: { x: 25000, y: -12000, a: 90 } });
      return p && p.x === 25000 && p.y === -12000 && p.a === 90;
    })());
    ok('parse array [x,y,a]', (() => {
      const p = parseVacuumPosition({ vacuum_position: [1000, 2000, 45] });
      return p && p.x === 1000 && p.y === 2000 && p.a === 45;
    })());
    ok('parse array [x,y] (no angle)', (() => {
      const p = parseVacuumPosition({ vacuum_position: [1000, 2000] });
      return p && p.x === 1000 && p.y === 2000 && p.a === undefined;
    })());
    ok('parse JSON-string object', (() => {
      const p = parseVacuumPosition({ vacuum_position: '{"x":300,"y":-400,"angle":180}' });
      return p && p.x === 300 && p.y === -400 && p.a === 180;   // `angle` alias
    })());
    ok('parse JSON-string array', (() => {
      const p = parseVacuumPosition({ vacuum_position: '[7,8]' });
      return p && p.x === 7 && p.y === 8;
    })());
    ok('fallback to robot_position', (() => {
      const p = parseVacuumPosition({ robot_position: { x: 5, y: 6 } });
      return p && p.x === 5 && p.y === 6;
    })());
    ok('fallback to position', (() => {
      const p = parseVacuumPosition({ position: [9, 10] });
      return p && p.x === 9 && p.y === 10;
    })());
    ok('garbage → null', parseVacuumPosition({ vacuum_position: 'not json' }) === null);
    ok('missing attr → null', parseVacuumPosition({ foo: 1 }) === null);
    ok('null attrs → null', parseVacuumPosition(null) === null);
    ok('non-finite coords → null', parseVacuumPosition({ vacuum_position: { x: 'a', y: 2 } }) === null);

    // ── Calibration transform: raw map units → plan world mm ─────────────────
    // world = R(rot)·S(scale, flipY)·raw + offset.
    const idn = vacuumRawToWorld({ x: 100, y: 200 }, {});
    ok('identity transform', near(idn.x, 100) && near(idn.y, 200), `(${idn.x},${idn.y})`);
    const scl = vacuumRawToWorld({ x: 100, y: 200 }, { posScale: 10 });
    ok('scale 10 mm/unit', near(scl.x, 1000) && near(scl.y, 2000), `(${scl.x},${scl.y})`);
    const flp = vacuumRawToWorld({ x: 100, y: 200 }, { posScale: 10, posFlipY: true });
    ok('flipY mirrors Y', near(flp.x, 1000) && near(flp.y, -2000), `(${flp.x},${flp.y})`);
    const rot = vacuumRawToWorld({ x: 100, y: 0 }, { posScale: 1, posRotDeg: 90 });
    ok('rotate 90° maps +x→+y', near(rot.x, 0) && near(rot.y, 100), `(${rot.x},${rot.y})`);
    const off = vacuumRawToWorld({ x: 10, y: 20 }, { posScale: 1, posOffsetX: 500, posOffsetY: -300 });
    ok('offset added last', near(off.x, 510) && near(off.y, -280), `(${off.x},${off.y})`);
    const combo = vacuumRawToWorld({ x: 100, y: 200 },
      { posScale: 10, posFlipY: true, posRotDeg: 90, posOffsetX: 1000, posOffsetY: 2000 });
    // S: (1000,-2000); R90: (2000,1000); +offset: (3000,3000).
    ok('combined scale+flip+rot+offset', near(combo.x, 3000) && near(combo.y, 3000), `(${combo.x},${combo.y})`);

    // Heading transform: map angle → plan heading (radians).
    ok('heading rot only', near(vacuumRawHeadingRad(0, { posRotDeg: 90 }), Math.PI / 2, 1e-6));
    ok('heading flip negates', near(vacuumRawHeadingRad(90, { posFlipY: true }), -Math.PI / 2, 1e-6));

    // ── Dock-reference one-click solve ───────────────────────────────────────
    // Park raw at (250,-120) map units; dock world = (1500,900); scale 10, rot 0.
    // Solve offset so the transform lands the raw point on the dock.
    const cal = { posScale: 10, posRotDeg: 0, posFlipY: false };
    const rawDock = { x: 250, y: -120 };
    const dock = { x: 1500, y: 900 };
    const sol = solveVacuumDockOffset(rawDock, dock, cal);
    const back = vacuumRawToWorld(rawDock, { ...cal, ...sol });
    ok('dock-solve maps raw onto dock', near(back.x, dock.x) && near(back.y, dock.y),
       `off=(${sol.posOffsetX.toFixed(0)},${sol.posOffsetY.toFixed(0)}) back=(${back.x.toFixed(0)},${back.y.toFixed(0)})`);
    // With rotation + flip the solve still lands exactly on the dock.
    const cal2 = { posScale: 5, posRotDeg: 90, posFlipY: true };
    const sol2 = solveVacuumDockOffset({ x: 300, y: 200 }, { x: -800, y: 640 }, cal2);
    const back2 = vacuumRawToWorld({ x: 300, y: 200 }, { ...cal2, ...sol2 });
    ok('dock-solve with rot+flip lands on dock', near(back2.x, -800) && near(back2.y, 640),
       `back=(${back2.x.toFixed(0)},${back2.y.toFixed(0)})`);

    // ── LIVE mode overrides simulation + fallback on parse failure ───────────
    // Mirror Planner._vacuumLive + the LIVE branch of _stepVacuum: given a bound
    // posEntity whose vacuum_position parses, the puck eases toward the live world
    // point (spd·3 catch-up) regardless of simulated goals; a parse failure yields
    // no live fix → the controller falls back to the sim roam.
    const calL = { posScale: 10, posOffsetX: 0, posOffsetY: 0, posRotDeg: 0 };
    const vacuumLive = (attrs) => {
      const raw = parseVacuumPosition(attrs);
      if (!raw) return null;
      const w = vacuumRawToWorld(raw, calL);
      return { x: w.x, y: w.y, headingRad: raw.a != null ? vacuumRawHeadingRad(raw.a, calL) : null };
    };
    ok('parse failure → no live fix (sim fallback)', vacuumLive({ foo: 1 }) === null);
    // Ease toward a fixed live target from a wrong start; must converge, ignoring
    // any random sim goal-picking (there is none in LIVE mode).
    const live = vacuumLive({ vacuum_position: { x: 400, y: 250 } });   // → world (4000,2500)
    ok('live fix projects to world mm', live && near(live.x, 4000) && near(live.y, 2500),
       live && `(${live.x},${live.y})`);
    let lx = 0, ly = 0; const spdL = ROBOT_DEFAULTS.vacuum.speed;
    for (let t = 0; t < 400; t++) {
      const dx = live.x - lx, dy = live.y - ly, dd = Math.hypot(dx, dy);
      if (dd < 1) break;
      const step = Math.min(spdL * 3 * dt, dd);   // LIVE catch-up factor
      lx += dx / dd * step; ly += dy / dd * step;
    }
    ok('LIVE easing converges to the live position', Math.hypot(live.x - lx, live.y - ly) < 5,
       `dist=${Math.hypot(live.x - lx, live.y - ly).toFixed(1)}`);

    // ── LED color mapping (visual state) ─────────────────────────────────────
    ok('LED cleaning = green', robotLedColor('cleaning') === '#43a047');
    ok('LED returning = blue', robotLedColor('returning') === '#2196f3');
    ok('LED error = red', robotLedColor('error') === '#e53935');
    ok('LED docked = amber', robotLedColor('docked') === '#ffca28');

    // ── Progress source resolution (pure robotProgress) ──────────────────────
    const so = (map) => (id) => map[id] ?? null;
    ok('progress: entity state parses + clamps',
       robotProgress({ progressEntity: 'sensor.p' }, so({ 'sensor.p': { state: '42' } })) === 42);
    ok('progress: entity clamps >100',
       robotProgress({ progressEntity: 'sensor.p' }, so({ 'sensor.p': { state: '140' } })) === 100);
    ok('progress: attribute fallback (cleaned_area_percent)',
       robotProgress({ entity_id: 'vacuum.v' }, so({ 'vacuum.v': { state: 'cleaning', attributes: { cleaned_area_percent: 73 } } })) === 73);
    ok('progress: entity field WINS over attribute',
       robotProgress({ progressEntity: 'sensor.p', entity_id: 'vacuum.v' },
         so({ 'sensor.p': { state: '20' }, 'vacuum.v': { state: 'x', attributes: { progress: 90 } } })) === 20);
    ok('progress: no source → null',
       robotProgress({ entity_id: 'vacuum.v' }, so({ 'vacuum.v': { state: 'cleaning', attributes: {} } })) === null);
    ok('progress: non-numeric entity state → null (no attrs)',
       robotProgress({ progressEntity: 'sensor.p' }, so({ 'sensor.p': { state: 'unavailable' } })) === null);

    // ── Renderer: rig geometry + progress strip/ring (built chunk) ────────────
    try {
      const rmod = await import('./assets/three-renderer.js?v=' + Date.now());
      const R = new rmod.ThreeDRenderer(document.getElementById('rc'));
      await R.load();
      const scene3d = { preset: 'day', floorColor: '#223344', floorTex: 'none', wallColor: '#bbbbbb' };
      const mkFloor = (robots) => ({
        id: 'f1', name: 'R', w: 8000, d: 6000, walls: [], furniture: [],
        lights: [], switches: [], sensors: [], motionSensors: [], envSensors: [],
        doors: [], windows: [], bg: null, model3d: null, look3d: null, rooms: [], robots,
      });
      const mowerFx = { id: 'm1', kind: 'mower', x: 3000, y: 3000, entity_id: 'lawn_mower.m', progressEntity: 'sensor.mow' };
      const vacFx   = { id: 'v1', kind: 'vacuum', x: 5000, y: 3000, entity_id: 'vacuum.v', progressEntity: 'sensor.vac' };
      const noSrcFx = { id: 'n1', kind: 'mower', x: 6500, y: 3000, entity_id: null };
      const stOf = (led) => ({ x: 0, y: 0, heading: 0, phase: 0, activity: 'mowing', led });
      R.updateFloor(mkFloor([mowerFx, vacFx, noSrcFx]), scene3d);

      const rigM = () => R._robotRigs['m1'];
      const rigV = () => R._robotRigs['v1'];
      const rigN = () => R._robotRigs['n1'];
      const countUD = (rig, flag) => { let n = 0; rig.group.traverse(o => { if (o.userData && o.userData[flag]) n++; }); return n; };
      const litCount = (rig) => rig.progressMats.filter(m => m.emissiveIntensity > 0.5).length;

      // Build rigs (returning-blue state → lamp color check).
      R.updateRobotRigs([mowerFx, vacFx, noSrcFx],
        { m1: { ...stOf('#2196f3'), x: 3000, y: 3000 }, v1: { ...stOf('#2196f3'), x: 5000, y: 3000 }, n1: { ...stOf('#78909c'), x: 6500, y: 3000 } },
        { m1: 42, v1: 50, n1: null });

      ok('rig: mower + vacuum + no-source rigs built', !!rigM() && !!rigV() && !!rigN());
      ok('rig: mower has ≥4 wheels', countUD(rigM(), 'robotWheel') >= 4, 'wheels=' + countUD(rigM(), 'robotWheel'));
      ok('rig: mower status lamp exists', countUD(rigM(), 'robotLamp') >= 1, 'lamps=' + countUD(rigM(), 'robotLamp'));
      ok('rig: vacuum status lamp exists', countUD(rigV(), 'robotLamp') >= 1, 'lamps=' + countUD(rigV(), 'robotLamp'));
      ok('rig: mower lamp takes state color (returning=blue)', rigM().ledMat.color.getHex() === 0x2196f3, '0x' + rigM().ledMat.color.getHex().toString(16));

      ok('rig: mower progress strip has 10 segments', rigM().progressMats.length === 10, 'n=' + rigM().progressMats.length);
      ok('rig: vacuum progress ring has 12 segments', rigV().progressMats.length === 12, 'n=' + rigV().progressMats.length);
      ok('rig: mower 4-of-10 lit at 42%', rigM().progressGroup.visible && litCount(rigM()) === 4, 'lit=' + litCount(rigM()));
      ok('rig: vacuum 6-of-12 lit at 50%', rigV().progressGroup.visible && litCount(rigV()) === 6, 'lit=' + litCount(rigV()));
      ok('rig: no-source robot hides its progress strip', rigN().progressGroup.visible === false);

      // Vacuum ring wraps the puck axis: all segments at a fixed radius, angles span a full circle.
      {
        const segs = rigV().progressGroup.children;
        const radii = segs.map(s => Math.hypot(s.position.x, s.position.z));
        const rMean = radii.reduce((a, b) => a + b, 0) / radii.length;
        const constR = radii.every(r => Math.abs(r - rMean) < 1);
        const angs = segs.map(s => Math.atan2(s.position.x, s.position.z));
        const span = Math.max(...angs) - Math.min(...angs);
        ok('rig: vacuum ring circles the puck axis (constant radius)', constR && rMean > 100, 'rMean=' + rMean.toFixed(0));
        ok('rig: vacuum ring wraps > 5 rad around the axis', span > 5, 'span=' + span.toFixed(2));
      }

      // Re-drive with a new percentage → segments re-fill without rebuild (same rig object).
      const rigMref = rigM();
      R.updateRobotRigs([mowerFx, vacFx, noSrcFx],
        { m1: { ...stOf('#43a047'), x: 3000, y: 3000 }, v1: { ...stOf('#43a047'), x: 5000, y: 3000 }, n1: { ...stOf('#78909c'), x: 6500, y: 3000 } },
        { m1: 100, v1: 0, n1: null });
      ok('rig: progress re-fills in place (no rebuild)', rigM() === rigMref && litCount(rigM()) === 10, 'lit=' + litCount(rigM()));
      ok('rig: vacuum 0% → no segments lit', litCount(rigV()) === 0, 'lit=' + litCount(rigV()));
    } catch (e) {
      ok('renderer rig tests threw', false, String(e && e.message || e));
    }

    // ── Real Planner: progressEntity is config-path (_isSlowEntity) + 2D no-throw ─
    try {
      const { Planner } = await import('./planner.mod.js?v=' + Date.now());
      const p = new Planner();
      const f = p.floor();
      const robot = { id: 'pr1', kind: 'vacuum', x: 1000, y: 1000, entity_id: 'vacuum.v', progressEntity: 'sensor.prog' };
      f.robots = [robot];
      ok('planner: progressEntity is config-path', p._isSlowEntity('sensor.prog') === true);
      ok('planner: unrelated id is NOT config-path', p._isSlowEntity('sensor.random_unbound') === false);

      // 2D drawAll no-throw with a robot + live progress sensor state.
      const { drawAll, computeView } = await import('./canvas-render.mod.js?v=' + Date.now());
      p.hass = { states: { 'sensor.prog': { state: '55', attributes: {} }, 'vacuum.v': { state: 'cleaning', attributes: {} } } };
      p.robotStates = { pr1: { x: 1200, y: 1100, heading: 0.4, phase: 1, activity: 'cleaning', led: '#43a047' } };
      const cv = document.getElementById('c2d');
      const ctx = cv.getContext('2d');
      const view = computeView(cv, f.w, f.d, p.viewCenter, p.zoom);
      let threw = false;
      try { drawAll(ctx, p, view, null); } catch (e) { threw = true; ok('drawAll threw', false, String(e && e.message || e)); }
      ok('2D drawAll with robot + progress does not throw', !threw);
    } catch (e) {
      ok('planner/2D tests threw', false, String(e && e.message || e));
    }

    // ── Mower CAR KINEMATICS (bicycle model) ─────────────────────────────────
    // The mower is a wheeled vehicle, not a puck: position advances STRICTLY
    // along its own heading, and the heading turns at a bounded rate (min
    // turning circle MOWER_KINEMATICS.turnRadiusMm). Asserted first on the pure
    // integrator, then end-to-end on the REAL Planner._stepMower.
    {
      const K = MOWER_KINEMATICS;
      ok('MOWER_ROW_MM ≥ 2 · turnRadiusMm (a row-end U-turn fits one arc)',
         MOWER_ROW_MM >= 2 * K.turnRadiusMm, `row=${MOWER_ROW_MM} 2R=${2 * K.turnRadiusMm}`);
      ok('wrapAngle normalizes into (−π, π]',
         Math.abs(wrapAngle(3 * Math.PI) - Math.PI) < 1e-9 &&
         Math.abs(wrapAngle(-3 * Math.PI) - Math.PI) < 1e-9 &&
         Math.abs(wrapAngle(0.4) - 0.4) < 1e-12);

      // Pure integrator: 400 steps chasing a target that is deliberately BEHIND
      // and off to the side, so the whole envelope (max steer, speed shaping,
      // the unreachable-inside-the-circle escape) is exercised.
      const st = { x: 0, y: 0, heading: 0, speed: 0 };
      let maxLat = 0, omegaViol = 0, maxDTheta = 0, overSpeed = 0;
      const dtK = 0.05;
      for (let i = 0; i < 400; i++) {
        const tx = 3000 * Math.cos(i * 0.017) - 1500, ty = 2500 * Math.sin(i * 0.017);
        const px = st.x, py = st.y, ph = st.heading;
        const { omega } = stepBicycle(st, tx, ty, dtK);
        // Displacement must be parallel to the POST-step heading (no strafing):
        // the perpendicular component is identically zero by construction.
        const dx = st.x - px, dy = st.y - py;
        const lat = Math.abs(dx * -Math.sin(st.heading) + dy * Math.cos(st.heading));
        if (lat > maxLat) maxLat = lat;
        // Bounded yaw rate ⇒ |ω| ≤ v / R_MIN.
        if (Math.abs(omega) > st.speed / K.turnRadiusMm + 1e-9) omegaViol++;
        const dth = Math.abs(wrapAngle(st.heading - ph));
        if (dth > maxDTheta) maxDTheta = dth;
        if (st.speed > K.maxSpeedMm + 1e-9) overSpeed++;
      }
      ok('pure: displacement is parallel to heading (|lateral| < 1 mm/step)',
         maxLat < 1, `maxLat=${maxLat.toExponential(2)} mm`);
      ok('pure: |ω| ≤ v / turnRadiusMm every step', omegaViol === 0, `violations=${omegaViol}`);
      ok('pure: speed never exceeds maxSpeedMm', overSpeed === 0, `violations=${overSpeed}`);
      ok('pure: per-step heading change stays bounded (no instant flips)',
         maxDTheta <= (K.maxSpeedMm / K.turnRadiusMm) * dtK + 1e-9,
         `maxΔθ=${maxDTheta.toFixed(4)} cap=${((K.maxSpeedMm / K.turnRadiusMm) * dtK).toFixed(4)}`);
      // Speed shaping: slow into a big heading error, cruise when aligned.
      const sTurn = { x: 0, y: 0, heading: 0, speed: K.maxSpeedMm };
      for (let i = 0; i < 20; i++) stepBicycle(sTurn, -4000, 0, 0.05);   // target dead astern
      const sStraight = { x: 0, y: 0, heading: 0, speed: 0 };
      for (let i = 0; i < 40; i++) stepBicycle(sStraight, 40000, 0, 0.05);
      ok('pure: aligned run reaches (near) full speed',
         sStraight.speed > K.maxSpeedMm * 0.95, `v=${sStraight.speed.toFixed(0)}`);
      ok('pure: a hard turn slows the mower but never stalls it',
         sTurn.speed < K.maxSpeedMm * 0.9 && sTurn.speed >= K.minSpeedMm - 1e-6,
         `v=${sTurn.speed.toFixed(0)} floor=${K.minSpeedMm}`);
      // Turning circle: full-lock from rest never curls tighter than turnRadiusMm.
      const sArc = { x: 0, y: 0, heading: 0, speed: K.maxSpeedMm };
      let tightest = Infinity;
      for (let i = 0; i < 300; i++) {
        const v0 = sArc.speed;
        const { omega } = stepBicycle(sArc, sArc.x - 10, sArc.y + 1, 0.05);  // permanent hard-left demand
        if (Math.abs(omega) > 1e-6) tightest = Math.min(tightest, v0 / Math.abs(omega));
      }
      ok('pure: tightest achieved radius ≥ turnRadiusMm',
         tightest >= K.turnRadiusMm - 1, `r=${isFinite(tightest) ? tightest.toFixed(1) : 'n/a'}`);
      // Waypoint advance: captured inside arriveMm, and passed-by behind us.
      ok('mowerWaypointReached: inside the capture radius',
         mowerWaypointReached({ x: 0, y: 0, heading: 0 }, K.arriveMm * 0.5, 0) === true);
      ok('mowerWaypointReached: ahead + far = not reached',
         mowerWaypointReached({ x: 0, y: 0, heading: 0 }, 3000, 0) === false);
      ok('mowerWaypointReached: passed by (behind, inside the turning circle)',
         mowerWaypointReached({ x: 0, y: 0, heading: 0 }, -600, 0) === true);
      ok('mowerWaypointReached: behind but FAR = still chase it (wide loop)',
         mowerWaypointReached({ x: 0, y: 0, heading: 0 }, -4000, 0) === false);
      // Row pitch plumbed into the sweep generator (default call unchanged).
      const wpsDefault = mowerSweepWaypoints([], 6000, 6000);
      const wpsRow = mowerSweepWaypoints([], 6000, 6000, 800, 300, MOWER_ROW_MM);
      const rowYs = (w) => [...new Set(w.map(p => p.y))].sort((a, b) => a - b);
      const yD = rowYs(wpsDefault), yR = rowYs(wpsRow);
      ok('sweep: default rowCell keeps the legacy 800 mm pitch',
         yD.length > 1 && yD[1] - yD[0] === 800, `pitch=${yD[1] - yD[0]}`);
      ok('sweep: explicit rowCell widens the row pitch to MOWER_ROW_MM',
         yR.length > 1 && yR[1] - yR[0] === MOWER_ROW_MM, `pitch=${yR[1] - yR[0]}`);
      ok('sweep: along-row cell pitch is untouched by rowCell',
         [...new Set(wpsRow.filter(p => p.y === yR[0]).map(p => p.x))].length ===
         [...new Set(wpsDefault.filter(p => p.y === yD[0]).map(p => p.x))].length);
    }

    // ── Real Planner: mower drives car-like; vacuum branch byte-identical ─────
    try {
      const { Planner } = await import('./planner.mod.js?v=' + Date.now());
      const K = MOWER_KINEMATICS;
      // Mower: 40 s of simulated mowing over an empty yard.
      const pm = new Planner();
      const fm = pm.floor();
      fm.w = 12000; fm.d = 9000; fm.walls = [];
      fm.robots = [{ id: 'm1', kind: 'mower', x: 800, y: 800 }];
      pm.stepRobots(0.05);
      const rm = pm.robotStates.m1;
      rm.demoPhase = 'run'; rm.demoTimer = 99999;
      let mLat = 0, mOmegaViol = 0, mMaxD = 0, travelled = 0;
      const seenRows = new Set();
      for (let i = 0; i < 800; i++) {
        const px = rm.x, py = rm.y, ph = rm.heading, pv = rm.speed;
        pm.stepRobots(0.05);
        const dx = rm.x - px, dy = rm.y - py;
        travelled += Math.hypot(dx, dy);
        mLat = Math.max(mLat, Math.abs(dx * -Math.sin(rm.heading) + dy * Math.cos(rm.heading)));
        const dth = Math.abs(wrapAngle(rm.heading - ph));
        mMaxD = Math.max(mMaxD, dth);
        if (dth > (Math.max(rm.speed, pv) / K.turnRadiusMm) * 0.05 + 1e-6) mOmegaViol++;
        seenRows.add(Math.round(rm.y / MOWER_ROW_MM));
      }
      ok('planner mower: motion is parallel to heading (|lateral| < 1 mm/step)',
         mLat < 1, `maxLat=${mLat.toExponential(2)} mm`);
      ok('planner mower: yaw rate never exceeds v / turnRadiusMm',
         mOmegaViol === 0, `violations=${mOmegaViol}`);
      ok('planner mower: heading is continuous across row ends (no instant flips)',
         mMaxD <= (K.maxSpeedMm / K.turnRadiusMm) * 0.05 + 1e-6,
         `maxΔθ=${mMaxD.toFixed(4)} rad/step`);
      ok('planner mower: actually covers ground over 40 s',
         travelled > 8000, `travelled=${Math.round(travelled)} mm`);
      ok('planner mower: sweeps more than one row', seenRows.size >= 2, `rows=${seenRows.size}`);
      ok('planner mower: cruises near max speed while mowing',
         rm.speed > K.minSpeedMm, `v=${rm.speed.toFixed(0)}`);
      // Dock return converges + parks (speed → 0 inside the capture radius).
      // 900 steps = 45 s: comfortably past the ~30 s drive home, and short of the
      // ≥60 s docked dwell after which the unbound demo cycle sets off again.
      rm.demoPhase = 'return'; rm.demoTimer = 99999;
      for (let i = 0; i < 900; i++) pm.stepRobots(0.05);
      const dDock = Math.hypot(rm.x - 800, rm.y - 800);
      ok('planner mower: returns to the dock and parks',
         dDock < K.arriveMm + 50 && rm.speed < 5,
         `dist=${Math.round(dDock)} v=${rm.speed.toFixed(1)}`);

      // Vacuum branch pin: the point-chasing controller is UNTOUCHED by the
      // mower rewrite. Two probe positions captured from the pre-change build
      // (deterministic LCG seeded over Math.random) must reproduce EXACTLY.
      const rngSave = Math.random;
      let rngS = 987654321;
      Math.random = () => ((rngS = (rngS * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff);
      const pv2 = new Planner();
      const fv = pv2.floor();
      fv.w = 8000; fv.d = 6000; fv.walls = [];
      fv.robots = [{ id: 'v1', kind: 'vacuum', x: 900, y: 900 }];
      pv2.stepRobots(0.05);
      const rv = pv2.robotStates.v1;
      rv.demoPhase = 'run'; rv.demoTimer = 9999; rv.goalTimer = 0;
      const probes = [];
      for (let i = 0; i < 900; i++) {
        pv2.stepRobots(0.05);
        if (i === 299 || i === 899) probes.push(`${rv.x.toFixed(3)},${rv.y.toFixed(3)},${rv.heading.toFixed(5)}`);
      }
      Math.random = rngSave;
      ok('vacuum branch unchanged: probe @15 s matches the baseline capture',
         probes[0] === '4052.987,3121.044,0.86032', probes[0]);
      ok('vacuum branch unchanged: probe @45 s matches the baseline capture',
         probes[1] === '4403.483,4189.805,0.97709', probes[1]);
    } catch (e) {
      ok('planner mower/vacuum kinematics tests threw', false, String(e && e.message || e));
    }

    // ══ Window LOS + mower outdoor containment ═══════════════════════════════
    // Two related fixes:
    //  (1) segCrossesSolidWall now takes `wallCutsForSegment(...).navSolids` (the
    //      DOOR-only complement) instead of `solids`, so a WINDOW is solid to a
    //      driving robot exactly as it is to the avatar nav rasterizer.
    //  (2) the MOWER is contained to outdoor space: no step may end inside a
    //      building loop or cross a nav-solid run.

    // ── Pure: a window blocks, its door twin does not ────────────────────────
    {
      const divider = [{ points: [{x:3000,y:0},{x:3000,y:4000}] }];
      const win = [{ x: 3000, y: 2000, w: 900 }];
      const dr  = [{ x: 3000, y: 2000, w: 900, rotation: 90 }];
      ok('LOS: a WINDOW span is solid to a robot (sill, not a doorway)',
         segCrossesSolidWall(divider, [], win, 1500, 2000, 4500, 2000) === true);
      ok('LOS: the DOOR twin of the same span is passable',
         segCrossesSolidWall(divider, dr, [], 1500, 2000, 4500, 2000) === false);
      ok('LOS: a window elsewhere on the wall still blocks off-span crossings',
         segCrossesSolidWall(divider, [], win, 1500, 500, 4500, 500) === true);
      ok('LOS: a window-free wall is byte-identical (door gap still open)',
         segCrossesSolidWall(divider, dr, [], 1500, 3500, 4500, 3500) === true &&
         segCrossesSolidWall(divider, dr, [], 1500, 2000, 4500, 2000) === false);
    }

    // ── Pure: building loops vs yard boundary runs ───────────────────────────
    {
      const { buildingWallLoops, pointInAnyLoop, nearestPointOutsideLoops,
              isBoundaryWallKind, BOUNDARY_WALL_KINDS } = await import('./geometry.mod.js');
      const fenceRing = [{ kind: 'fence_picket', points: [
        {x:2000,y:2000},{x:12000,y:2000},{x:12000,y:8000},{x:2000,y:8000},{x:2000,y:2000}] }];
      const houseRing = [{ points: [
        {x:5000,y:4000},{x:9000,y:4000},{x:9000,y:7000},{x:5000,y:7000},{x:5000,y:4000}] }];
      ok('boundary kinds: the 4 fences + hedge + railing, nothing else',
         BOUNDARY_WALL_KINDS.size === 5 &&
         ['fence_picket','fence_privacy','fence_chainlink','hedge','railing'].every(isBoundaryWallKind) &&
         !isBoundaryWallKind('full') && !isBoundaryWallKind('half') &&
         !isBoundaryWallKind('invisible') && !isBoundaryWallKind(null),
         'n=' + BOUNDARY_WALL_KINDS.size);
      ok('buildingWallLoops: a FENCE ring is not a building (yard stays mowable)',
         buildingWallLoops(fenceRing).length === 0 &&
         closedWallLoops(fenceRing).length >= 1,
         `building=${buildingWallLoops(fenceRing).length} all=${closedWallLoops(fenceRing).length}`);
      ok('buildingWallLoops: a solid ring IS a building',
         buildingWallLoops(houseRing).length === 1);
      ok('buildingWallLoops: a house inside a fence keeps exactly the house',
         buildingWallLoops([...fenceRing, ...houseRing]).length === 1);
      const bl = buildingWallLoops(houseRing);
      ok('pointInAnyLoop: inside / outside the house',
         pointInAnyLoop(bl, 7000, 5500) === true && pointInAnyLoop(bl, 1000, 1000) === false);
      // Clamp: an indoor point is pushed out past the nearest boundary edge.
      const outp = nearestPointOutsideLoops(bl, 5300, 5500, 400);
      ok('nearestPointOutsideLoops: an indoor point lands OUTSIDE, near the wall',
         !pointInAnyLoop(bl, outp.x, outp.y) && near(outp.x, 4600, 1) && near(outp.y, 5500, 1),
         `(${outp.x.toFixed(0)},${outp.y.toFixed(0)})`);
      const keep = nearestPointOutsideLoops(bl, 1000, 1000, 400);
      ok('nearestPointOutsideLoops: an outdoor point is returned UNCHANGED',
         keep.x === 1000 && keep.y === 1000);
      // Fenced yard: the sweep now finds lawn there (it used to see the fence
      // ring as "indoors" and fall through to the ellipse orbit).
      const fw = mowerSweepWaypoints([...fenceRing, ...houseRing], 14000, 10000, 800, 300, MOWER_ROW_MM);
      let inHouse = 0;
      for (const w of fw) if (pointInAnyLoop(bl, w.x, w.y)) inHouse++;
      ok('sweep: a fenced yard yields lawn waypoints', fw.length > 20, `n=${fw.length}`);
      ok('sweep: none of them are inside the house', inHouse === 0, `inHouse=${inHouse}`);
    }

    // ── (a) Vacuum: a window is not an exit; its door twin is ────────────────
    // A closed room whose ONLY gap in the east wall is a WINDOW must contain the
    // vacuum; swapping that window for a door of the same span must let it out.
    // (The nav-parity fixture-H idiom, applied to the robot controller.)
    try {
      const { Planner } = await import('./planner.mod.js?v=' + Date.now());
      const roomWalls = () => ([
        { points: [{x:0,y:0},{x:4000,y:0}] },
        { points: [{x:0,y:4000},{x:4000,y:4000}] },
        { points: [{x:0,y:0},{x:0,y:4000}] },
        { points: [{x:4000,y:0},{x:4000,y:4000}] },
      ]);
      const roam = (openings) => {
        const rngSave = Math.random;
        let s = 24680;
        Math.random = () => ((s = (s * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff);
        try {
          const p = new Planner();
          const f = p.floor();
          f.w = 9000; f.d = 6000; f.walls = roomWalls();
          f.doors = openings.doors ?? []; f.windows = openings.windows ?? [];
          f.robots = [{ id: 'vw', kind: 'vacuum', x: 2000, y: 2000 }];
          p.stepRobots(0.05);
          const rs = p.robotStates.vw;
          rs.demoPhase = 'run'; rs.demoTimer = 999999; rs.goalTimer = 0;
          let maxX = rs.x, escaped = false;
          for (let i = 0; i < 6000; i++) {          // 300 s @ 20 Hz
            p.stepRobots(0.05);
            maxX = Math.max(maxX, rs.x);
            if (rs.x > 4200) escaped = true;
          }
          return { maxX, escaped };
        } finally { Math.random = rngSave; }
      };
      const thruWin = roam({ windows: [{ x: 4000, y: 2000, w: 900 }] });
      ok('vacuum: a WINDOW is not an exit — stays in the room over 300 s',
         !thruWin.escaped && thruWin.maxX < 4000, `maxX=${Math.round(thruWin.maxX)}`);
      const thruDoor = roam({ doors: [{ x: 4000, y: 2000, w: 900, rotation: 90 }] });
      ok('vacuum: the DOOR twin of the same span lets it out',
         thruDoor.escaped, `maxX=${Math.round(thruDoor.maxX)}`);
    } catch (e) {
      ok('vacuum window-LOS containment tests threw', false, String(e && e.message || e));
    }

    // ── (b) Mower: never inside the house, over a long simulated sweep ───────
    try {
      const { Planner } = await import('./planner.mod.js?v=' + Date.now());
      const { buildingWallLoops, pointInAnyLoop, nearestPointOutsideLoops } =
        await import('./geometry.mod.js');
      const K = MOWER_KINEMATICS;
      const house = [{ points: [
        {x:5000,y:4000},{x:9000,y:4000},{x:9000,y:7000},{x:5000,y:7000},{x:5000,y:4000}] }];
      const pmc = new Planner();
      const fmc = pmc.floor();
      fmc.w = 14000; fmc.d = 10000; fmc.walls = house;
      // A window in the south house wall: solid to the mower like every other run.
      fmc.windows = [{ x: 7000, y: 4000, w: 1200 }];
      fmc.robots = [{ id: 'mc', kind: 'mower', x: 1000, y: 1000 }];
      pmc.stepRobots(0.05);
      const rmc = pmc.robotStates.mc;
      rmc.demoPhase = 'run'; rmc.demoTimer = 999999;
      const loopsC = buildingWallLoops(fmc.walls);
      let insideSteps = 0, crossSteps = 0, travel = 0, maxDth = 0, worstX = 0, worstY = 0;
      for (let i = 0; i < 4000; i++) {                       // 200 s @ 20 Hz
        const px = rmc.x, py = rmc.y, ph = rmc.heading;
        pmc.stepRobots(0.05);
        travel += Math.hypot(rmc.x - px, rmc.y - py);
        maxDth = Math.max(maxDth, Math.abs(wrapAngle(rmc.heading - ph)));
        if (pointInAnyLoop(loopsC, rmc.x, rmc.y)) { if (!insideSteps) { worstX = rmc.x; worstY = rmc.y; } insideSteps++; }
        if (segCrossesSolidWall(fmc.walls, [], fmc.windows, px, py, rmc.x, rmc.y)) crossSteps++;
      }
      ok('mower: NEVER inside the house — every one of 4000 steps',
         insideSteps === 0, `insideSteps=${insideSteps}${insideSteps ? ` first@(${worstX.toFixed(0)},${worstY.toFixed(0)})` : ''}`);
      ok('mower: never crosses a wall run (windows included)',
         crossSteps === 0, `crossings=${crossSteps}`);
      ok('mower: containment does not freeze it — still covers ground',
         travel > 20000, `travelled=${Math.round(travel)} mm`);
      // The deflection is KINEMATIC: it re-steers, never teleports. Position is
      // pinned by the crossing test above; heading stays inside the shipped
      // per-step ceiling (the stalled-escape branch turns at the MIN-speed rate,
      // the same discipline the GPS station-keeping / dock-parking branches use,
      // which is strictly below the max-speed ceiling asserted here).
      ok('mower: heading stays continuous while deflecting (no instant flips)',
         maxDth <= (K.maxSpeedMm / K.turnRadiusMm) * 0.05 + 1e-6,
         `maxΔθ=${maxDth.toFixed(4)} rad/step`);

      // Dock placed INSIDE the house (user error): the mower parks at the nearest
      // outdoor point and never drives in. Reported by mowerDockIndoors.
      const pdi = new Planner();
      const fdi = pdi.floor();
      fdi.w = 14000; fdi.d = 10000; fdi.walls = house;
      const rdi = { id: 'md', kind: 'mower', x: 7000, y: 5500 };
      fdi.robots = [rdi];
      ok('mower: an indoor dock is reported (sidebar warning)', pdi.mowerDockIndoors(rdi) === true);
      pdi.stepRobots(0.05);
      const rsdi = pdi.robotStates.md;
      rsdi.x = 3000; rsdi.y = 5500; rsdi.heading = 0; rsdi.speed = 0;   // outdoors, aimed at the dock
      rsdi.demoPhase = 'return'; rsdi.demoTimer = 999999;
      let enteredDock = 0;
      for (let i = 0; i < 2000; i++) {
        pdi.stepRobots(0.05);
        if (pointInAnyLoop(loopsC, rsdi.x, rsdi.y)) enteredDock++;
      }
      ok('mower: an indoor dock is never entered', enteredDock === 0, `steps inside=${enteredDock}`);
      // It parks at the CLAMPED home point — the nearest point outside the house
      // to the indoor dock — having driven AROUND the building to reach it.
      const homeDi = nearestPointOutsideLoops(loopsC, 7000, 5500, 400);
      ok('mower: it settles just outside the house, at the clamped home point',
         !pointInAnyLoop(loopsC, rsdi.x, rsdi.y) && rsdi.speed < 20 &&
         Math.hypot(rsdi.x - homeDi.x, rsdi.y - homeDi.y) < K.arriveMm + 50,
         `(${rsdi.x.toFixed(0)},${rsdi.y.toFixed(0)}) home=(${homeDi.x.toFixed(0)},${homeDi.y.toFixed(0)}) v=${rsdi.speed.toFixed(1)}`);
      const rout = { id: 'mo', kind: 'mower', x: 1000, y: 1000 };
      fdi.robots.push(rout);
      ok('mower: an outdoor dock raises no warning', pdi.mowerDockIndoors(rout) === false);
      ok('mowerDockIndoors: a vacuum never warns',
         pdi.mowerDockIndoors({ id: 'x', kind: 'vacuum', x: 7000, y: 5500 }) === false);
    } catch (e) {
      ok('mower containment tests threw', false, String(e && e.message || e));
    }

    // ── (c) Mower GPS: an indoor fix clamps the CARROT, not the readout ──────
    try {
      const { Planner } = await import('./planner.mod.js?v=' + Date.now());
      const { buildingWallLoops, pointInAnyLoop } = await import('./geometry.mod.js');
      // Calibrate with the same two landmarks the GPS section uses, then place a
      // house so the plan MIDPOINT (2500, 2000) — where the fix projects — is
      // INDOORS. A real mower cannot be in the living room: that is GPS error.
      const pg = new Planner();
      const fg = pg.floor();
      fg.w = 5000; fg.d = 4000;
      fg.walls = [{ points: [
        {x:1500,y:1000},{x:3500,y:1000},{x:3500,y:3000},{x:1500,y:3000},{x:1500,y:1000}] }];
      pg.store.geo = { landmarks: [
        { id: 'l1', name: 'L1', x: L1.x, y: L1.y, lat: L1.lat, lon: L1.lon },
        { id: 'l2', name: 'L2', x: L2.x, y: L2.y, lat: L2.lat, lon: L2.lon },
      ] };
      const midLat = (L1.lat + L2.lat) / 2, midLon = (L1.lon + L2.lon) / 2;
      const rg = { id: 'mg', kind: 'mower', x: 400, y: 400, trackerEntity: 'device_tracker.mow' };
      fg.robots = [rg];
      pg.hass = { states: { 'device_tracker.mow': {
        state: 'home', attributes: { latitude: midLat, longitude: midLon } } } };
      const loopsG = buildingWallLoops(fg.walls);
      const info = pg.robotPosInfo(rg);
      ok('gps: the fixture fix genuinely projects INDOORS',
         info && info.mode === 'gps' && pointInAnyLoop(loopsG, info.worldX, info.worldY),
         info && `(${info.worldX.toFixed(0)},${info.worldY.toFixed(0)})`);
      // HONESTY: robotPosInfo still reports the RAW lat/lon + the projected
      // point, so the 2D overlay's crosshair-vs-body delta shows the error.
      ok('gps: robotPosInfo still reports the raw fix (clamp is carrot-side only)',
         info && info.rawText === `${midLat.toFixed(5)}, ${midLon.toFixed(5)}`, info && info.rawText);
      pg.stepRobots(0.05);
      const rsg = pg.robotStates.mg;
      rsg.demoPhase = 'run'; rsg.demoTimer = 999999;
      let insideG = 0;
      for (let i = 0; i < 2000; i++) {                       // 100 s chasing it
        pg.stepRobots(0.05);
        if (pointInAnyLoop(loopsG, rsg.x, rsg.y)) insideG++;
      }
      ok('gps: the mower never drives to an indoor fix', insideG === 0, `steps inside=${insideG}`);
      ok('gps: it holds just outside, near the clamped carrot',
         !pointInAnyLoop(loopsG, rsg.x, rsg.y) &&
         Math.hypot(rsg.x - info.worldX, rsg.y - info.worldY) < 1800,
         `(${rsg.x.toFixed(0)},${rsg.y.toFixed(0)}) d=${Math.hypot(rsg.x - info.worldX, rsg.y - info.worldY).toFixed(0)}`);
      // An OUTDOOR fix is untouched: the carrot clamp is a no-op there.
      const pg2 = new Planner();
      const fg2 = pg2.floor();
      fg2.w = 5000; fg2.d = 4000; fg2.walls = [];
      pg2.store.geo = pg.store.geo;
      const rg2 = { id: 'mg2', kind: 'mower', x: 400, y: 400, trackerEntity: 'device_tracker.mow' };
      fg2.robots = [rg2];
      pg2.hass = pg.hass;
      pg2.stepRobots(0.05);
      const rsg2 = pg2.robotStates.mg2;
      rsg2.demoPhase = 'run'; rsg2.demoTimer = 999999;
      for (let i = 0; i < 2000; i++) pg2.stepRobots(0.05);
      ok('gps: with no house the mower still converges ON the fix',
         Math.hypot(rsg2.x - 2500, rsg2.y - 2000) < MOWER_KINEMATICS.arriveMm + 50,
         `(${rsg2.x.toFixed(0)},${rsg2.y.toFixed(0)})`);
    } catch (e) {
      ok('mower GPS containment tests threw', false, String(e && e.message || e));
    }

    // ── (d) Gate passability: a fenced yard contains, a GATE lets through ────
    try {
      const { Planner } = await import('./planner.mod.js?v=' + Date.now());
      const { buildingWallLoops, pointInAnyLoop } = await import('./geometry.mod.js');
      // Fence ring 2000..12000 × 2000..8000 with ONE gate span in the east run.
      const fence = [
        { kind: 'fence_picket', points: [{x:2000,y:2000},{x:12000,y:2000}] },
        { kind: 'fence_picket', points: [{x:12000,y:2000},{x:12000,y:8000}] },
        { kind: 'fence_picket', points: [{x:12000,y:8000},{x:2000,y:8000}] },
        { kind: 'fence_picket', points: [{x:2000,y:8000},{x:2000,y:2000}] },
      ];
      // A door's (x, y) is its HINGE: doorSpanCenter offsets by w/2 along the
      // rotation, so this hinge at y=5500 / rotation 90 opens the span y 4500..5500
      // in the vertical east run.
      const gate = [{ x: 12000, y: 5500, w: 1000, rotation: 90, kind: 'gate' }];
      ok('gate: the fence run BLOCKS away from the gate',
         segCrossesSolidWall(fence, gate, [], 11000, 3000, 13000, 3000) === true);
      ok('gate: the GATE span is passable',
         segCrossesSolidWall(fence, gate, [], 11000, 5000, 13000, 5000) === false);
      ok('gate: without a gate the same crossing is blocked',
         segCrossesSolidWall(fence, [], [], 11000, 5000, 13000, 5000) === true);
      // The mower inside a fully-closed fence stays inside it; with the gate it
      // may cross, and only ever on the gate span.
      const run = (doors) => {
        const p = new Planner();
        const f = p.floor();
        f.w = 16000; f.d = 11000; f.walls = fence; f.doors = doors;
        f.robots = [{ id: 'mf', kind: 'mower', x: 3000, y: 3000 }];
        p.stepRobots(0.05);
        const rs = p.robotStates.mf;
        rs.demoPhase = 'run'; rs.demoTimer = 999999;
        let outside = 0, crossOffGate = 0;
        for (let i = 0; i < 6000; i++) {                     // 300 s @ 20 Hz
          const px = rs.x, py = rs.y;
          p.stepRobots(0.05);
          if (rs.x > 12100 || rs.x < 1900 || rs.y > 8100 || rs.y < 1900) outside++;
          if (segCrossesSolidWall(fence, doors, [], px, py, rs.x, rs.y)) crossOffGate++;
        }
        return { outside, crossOffGate, rs };
      };
      const closed = run([]);
      ok('gate: a fully-fenced yard CONTAINS the mower for 300 s',
         closed.outside === 0 && closed.crossOffGate === 0,
         `outside=${closed.outside} crossings=${closed.crossOffGate}`);
      ok('gate: containment does not stall it inside the fence',
         pointInAnyLoop([[{x:2000,y:2000},{x:12000,y:2000},{x:12000,y:8000},{x:2000,y:8000}]],
                        closed.rs.x, closed.rs.y),
         `(${closed.rs.x.toFixed(0)},${closed.rs.y.toFixed(0)})`);
      const gated = run(gate);
      ok('gate: with a gate it never crosses the SOLID fence either',
         gated.crossOffGate === 0, `crossings=${gated.crossOffGate}`);
      ok('gate: a fence ring never counts as a building interior',
         buildingWallLoops(fence).length === 0);
    } catch (e) {
      ok('gate passability tests threw', false, String(e && e.message || e));
    }

    // ── Robots view LAYER + position readout + manual alignment nudges ───────
    // Three related surfaces: `Layers2D.robots` (split off `sensors`, absent =
    // ON), the `RobotFixture.showPosInfo` calibration readout resolved by
    // Planner.robotPosInfo, and the mower GPS trim (posOffsetX/Y) the sidebar's
    // "Align position" nudges write.
    try {
      const { Planner } = await import('./planner.mod.js?v=' + Date.now());
      const C2 = await import('./canvas-render.mod.js?v=' + Date.now());
      const { LAYER_DEFS, SIMPLE_LAYERS, layerIsOn, hitRobot, drawAll, computeView } = C2;

      // Layer catalog: one entry, in Devices, opt-OUT everywhere except the
      // Simple preset (robots used to ride `sensors`, which that preset hides —
      // leaving the key absent there would have CHANGED the simple floorplan).
      const rdef = LAYER_DEFS.find(d => d.key === 'robots');
      ok('layer: LAYER_DEFS carries `robots` in the devices cat',
         !!rdef && rdef.cat === 'devices' && rdef.label === 'Robots',
         rdef && `${rdef.label}/${rdef.cat}`);
      ok('layer: robots is opt-out (absent = on, false = off)',
         layerIsOn({}, 'robots') === true && layerIsOn({ robots: true }, 'robots') === true
         && layerIsOn({ robots: false }, 'robots') === false);
      ok('layer: SIMPLE_LAYERS pins robots off (byte-identical simple floorplan)',
         SIMPLE_LAYERS.robots === false, String(SIMPLE_LAYERS.robots));

      // hitRobot obeys the layer (hidden = untappable, the openings rule).
      const pl = new Planner();
      const fl = pl.floor();
      fl.w = 8000; fl.d = 6000; fl.walls = [];
      const rob = { id: 'hr1', kind: 'vacuum', x: 2000, y: 2000 };
      fl.robots = [rob];
      const cvH = document.getElementById('c2d');
      const vH = computeView(cvH, fl.w, fl.d, pl.viewCenter, pl.zoom);
      ok('hit: robot hittable with the layer absent', hitRobot(pl, vH, { x: 2000, y: 2000 }) === rob);
      pl.store.layers2d = { robots: true };
      ok('hit: robot hittable with robots:true', hitRobot(pl, vH, { x: 2000, y: 2000 }) === rob);
      pl.store.layers2d = { robots: false };
      ok('hit: hidden robots layer → untappable', hitRobot(pl, vH, { x: 2000, y: 2000 }) === null);
      // …and the sensors layer no longer governs them.
      pl.store.layers2d = { sensors: false };
      ok('hit: hiding `sensors` no longer hides robots', hitRobot(pl, vH, { x: 2000, y: 2000 }) === rob);

      // drawAll gating: the dock/puck ink disappears when the layer is off.
      // (drawAll carries canvas state between calls — paint twice per probe.)
      const ctxH = cvH.getContext('2d');
      const snap = () => {
        ctxH.clearRect(0, 0, cvH.width, cvH.height);
        drawAll(ctxH, pl, vH, null); drawAll(ctxH, pl, vH, null);
        return ctxH.getImageData(0, 0, cvH.width, cvH.height).data;
      };
      const diff = (a, b) => {
        let n = 0;
        for (let i = 0; i < a.length; i += 4) if (a[i] !== b[i] || a[i + 1] !== b[i + 1] || a[i + 2] !== b[i + 2]) n++;
        return n;
      };
      pl.store.layers2d = { robots: true };
      const snapOn = snap();
      pl.store.layers2d = { robots: false };
      const snapOff = snap();
      pl.store.layers2d = { robots: true };
      const snapOn2 = snap();
      ok('2D: hiding the robots layer changes the painted plan', diff(snapOn, snapOff) > 100,
         `${diff(snapOn, snapOff)} px`);
      ok('2D: re-enabling repaints identically', diff(snapOn, snapOn2) === 0,
         `${diff(snapOn, snapOn2)} px`);
      pl.store.layers2d = {};

      // ── robotPosInfo: vacuum LIVE MAP ────────────────────────────────────
      const pv3 = new Planner();
      const fv3 = pv3.floor();
      const rv3 = { id: 'v1', kind: 'vacuum', x: 500, y: 500, posEntity: 'camera.map',
                    posScale: 10, posOffsetX: 0, posOffsetY: 0, posRotDeg: 0 };
      fv3.robots = [rv3];
      pv3.hass = { states: { 'camera.map': { state: 'idle', attributes: { vacuum_position: { x: 400, y: 250, a: 90 } } } } };
      const iv = pv3.robotPosInfo(rv3);
      const expW = vacuumRawToWorld({ x: 400, y: 250, a: 90 }, rv3);
      ok('posInfo vacuum: mode live-map', iv && iv.mode === 'live-map', iv && iv.mode);
      ok('posInfo vacuum: world == vacuumRawToWorld',
         iv && near(iv.worldX, expW.x, 1e-6) && near(iv.worldY, expW.y, 1e-6),
         iv && `(${iv.worldX},${iv.worldY}) vs (${expW.x},${expW.y})`);
      ok('posInfo vacuum: rawText mirrors the sidebar Raw format',
         iv && iv.rawText === 'x=400 y=250 a=90°', iv && iv.rawText);
      ok('posInfo vacuum: headingDeg = vacuumRawHeadingRad in degrees',
         iv && near(iv.headingDeg, vacuumRawHeadingRad(90, rv3) * 180 / Math.PI, 1e-9),
         iv && String(iv.headingDeg));
      // No angle in the fix → no heading (and the rawText drops the a= term).
      pv3.hass.states['camera.map'] = { state: 'idle', attributes: { vacuum_position: { x: 400, y: 250 } } };
      const ivNoA = pv3.robotPosInfo(rv3);
      ok('posInfo vacuum: no map angle → headingDeg null', ivNoA && ivNoA.headingDeg === null);
      ok('posInfo vacuum: rawText omits a= when absent', ivNoA && ivNoA.rawText === 'x=400 y=250', ivNoA && ivNoA.rawText);

      // ── robotPosInfo: sim fallbacks (garbage / unbound) ──────────────────
      pv3.hass.states['camera.map'] = { state: 'idle', attributes: { vacuum_position: 'nonsense' } };
      const ig = pv3.robotPosInfo(rv3);
      ok('posInfo: garbage attrs → sim (never throws)', ig && ig.mode === 'sim' && ig.rawText === '—',
         ig && `${ig.mode}/${ig.rawText}`);
      ok('posInfo sim: no controller state → the dock position',
         ig && ig.worldX === 500 && ig.worldY === 500, ig && `(${ig.worldX},${ig.worldY})`);
      pv3.robotStates.v1 = { x: 1234, y: 2345, heading: 0, phase: 0, activity: 'cleaning', led: '#43a047' };
      const ig2 = pv3.robotPosInfo(rv3);
      ok('posInfo sim: reads the live controller pose once spawned',
         ig2 && ig2.worldX === 1234 && ig2.worldY === 2345 && ig2.headingDeg === null,
         ig2 && `(${ig2.worldX},${ig2.worldY})`);
      const unbound = { id: 'v2', kind: 'vacuum', x: 900, y: 800 };
      fv3.robots.push(unbound);
      const iu = pv3.robotPosInfo(unbound);
      ok('posInfo: unbound vacuum → sim at the dock',
         iu && iu.mode === 'sim' && iu.worldX === 900 && iu.worldY === 800, iu && iu.mode);

      // ── robotPosInfo: mower GPS + the manual trim ────────────────────────
      const pm3 = new Planner();
      const fm3 = pm3.floor();
      fm3.w = 5000; fm3.d = 4000; fm3.walls = [];
      pm3.store.geo = { landmarks: [
        { id: 'l1', name: 'L1', x: L1.x, y: L1.y, lat: L1.lat, lon: L1.lon },
        { id: 'l2', name: 'L2', x: L2.x, y: L2.y, lat: L2.lat, lon: L2.lon },
      ] };
      const midLat = (L1.lat + L2.lat) / 2, midLon = (L1.lon + L2.lon) / 2;
      const rmw = { id: 'mw1', kind: 'mower', x: 100, y: 100, trackerEntity: 'device_tracker.mow' };
      fm3.robots = [rmw];
      pm3.hass = { states: { 'device_tracker.mow': {
        state: 'home', attributes: { latitude: midLat, longitude: midLon, direction: 90 } } } };
      const im = pm3.robotPosInfo(rmw);
      ok('posInfo mower: mode gps', im && im.mode === 'gps', im && im.mode);
      ok('posInfo mower: rawText is lat, lon at 5 dp',
         im && im.rawText === `${midLat.toFixed(5)}, ${midLon.toFixed(5)}`, im && im.rawText);
      ok('posInfo mower: projects onto the plan midpoint',
         im && near(im.worldX, 2500, 80) && near(im.worldY, 2000, 80),
         im && `(${im.worldX.toFixed(0)},${im.worldY.toFixed(0)})`);
      ok('posInfo mower: tracker direction → headingDeg',
         im && im.headingDeg != null && isFinite(im.headingDeg), im && String(im.headingDeg));
      // Trim: posOffsetX/Y shift the projected point by EXACTLY that delta.
      rmw.posOffsetX = 300; rmw.posOffsetY = -200;
      const imT = pm3.robotPosInfo(rmw);
      ok('mower trim: offsets shift the projected point by exactly the delta',
         imT && near(imT.worldX - im.worldX, 300, 1e-6) && near(imT.worldY - im.worldY, -200, 1e-6),
         imT && `(${(imT.worldX - im.worldX).toFixed(3)},${(imT.worldY - im.worldY).toFixed(3)})`);
      ok('mower trim: heading is untouched by a position trim',
         imT && im && near(imT.headingDeg, im.headingDeg, 1e-9));
      // …and the TRIMMED point is what the yard test + boundary clamp see: a
      // trim big enough to leave the yard clamps onto the ring, it does not
      // escape it. Boundary = geo.boundaryM (30 m default) around 5000×4000.
      rmw.posOffsetX = 200000; rmw.posOffsetY = 0;
      const imC = pm3.robotPosInfo(rmw);
      ok('mower trim: a trim past the boundary clamps onto the ring',
         imC && near(imC.worldX, 5000 + 30000, 2), imC && `x=${imC.worldX.toFixed(0)}`);
      rmw.posOffsetX = undefined; rmw.posOffsetY = undefined;
      const imR = pm3.robotPosInfo(rmw);
      ok('mower trim: cleared offsets restore the untrimmed projection',
         imR && near(imR.worldX, im.worldX, 1e-9) && near(imR.worldY, im.worldY, 1e-9));
      // No fit → no GPS mode (the sim fallback owns it).
      pm3.store.geo = { landmarks: [] };
      const imNo = pm3.robotPosInfo(rmw);
      ok('posInfo mower: no geo calibration → sim', imNo && imNo.mode === 'sim', imNo && imNo.mode);

      // ── Nudge semantics: one save (= one undo step) per click ────────────
      // Mirrors the sidebar's nudge closure exactly (mutate then save+emitConfig).
      const pn = new Planner();
      const fn = pn.floor();
      const rn = { id: 'n1', kind: 'mower', x: 100, y: 100, trackerEntity: 'device_tracker.mow' };
      fn.robots = [rn];
      pn.save();                                   // baseline snapshot
      const depth0 = pn._undoStack.length;
      const nudge = (dx, dy) => {
        rn.posOffsetX = (rn.posOffsetX ?? 0) + dx;
        rn.posOffsetY = (rn.posOffsetY ?? 0) + dy;
        pn.save(); pn.emitConfig();
      };
      nudge(0, 100);
      ok('nudge: one undo step per click', pn._undoStack.length === depth0 + 1,
         `${pn._undoStack.length} vs ${depth0 + 1}`);
      nudge(-100, 0);
      ok('nudge: offsets accumulate in the store',
         rn.posOffsetX === -100 && rn.posOffsetY === 100, `${rn.posOffsetX},${rn.posOffsetY}`);
      ok('nudge: two clicks = two undo steps', pn._undoStack.length === depth0 + 2,
         String(pn._undoStack.length));
      // Reset clears both (and the vacuum rotation) back to undefined.
      rn.posOffsetX = undefined; rn.posOffsetY = undefined; pn.save();
      ok('nudge: reset clears the offsets',
         rn.posOffsetX === undefined && rn.posOffsetY === undefined);

      // showPosInfo is item-level and purely a draw flag — drawAll must not
      // throw with it on for a live-map vacuum (crosshair + readout path).
      pv3.hass.states['camera.map'] = { state: 'idle', attributes: { vacuum_position: { x: 400, y: 250, a: 90 } } };
      rv3.showPosInfo = true;
      const vv = computeView(cvH, fv3.w, fv3.d, pv3.viewCenter, pv3.zoom);
      let threwPI = false;
      try { drawAll(ctxH, pv3, vv, null); } catch (e) { threwPI = true; ok('posInfo draw threw', false, String(e && e.message || e)); }
      ok('2D: drawAll with showPosInfo does not throw', !threwPI);
    } catch (e) {
      ok('robots layer / posInfo / nudge tests threw', false, String(e && e.message || e));
    }

    // ── Dock orientation, parked heading, dock calibration, rotated hits ─────
    // `RobotFixture.rotation` (screen-CW degrees, 0 = local +Y along world +Y —
    // the furniture convention) turns the dock in BOTH views; the dock's FRONT
    // (the opening) is local −Y, so frontVectorPlan(rotation) is the outward
    // direction and dockParkedHeading is the opposite (nose into the dock).
    {
      ok('dockParkedHeading: absent rotation → +Y (π/2)',
         near(dockParkedHeading(undefined), Math.PI / 2, 1e-12), String(dockParkedHeading(undefined)));
      ok('dockParkedHeading: 0° → π/2 (+Y)', near(dockParkedHeading(0), Math.PI / 2, 1e-12));
      ok('dockParkedHeading: 90° → 0 (+X)', near(dockParkedHeading(90), 0, 1e-12),
         String(dockParkedHeading(90)));
      ok('dockParkedHeading: 180° → −π/2 (−Y)', near(dockParkedHeading(180), -Math.PI / 2, 1e-12),
         String(dockParkedHeading(180)));
      ok('dockParkedHeading: 270° → π (−X)',
         near(Math.abs(dockParkedHeading(270)), Math.PI, 1e-12), String(dockParkedHeading(270)));
      // The parked nose is EXACTLY opposite the dock opening, at every angle.
      let opp = true;
      for (const deg of [0, 30, 45, 90, 137, 180, 250, 315]) {
        const h = dockParkedHeading(deg), fv = frontVectorPlan(deg);
        if (!near(Math.cos(h), -fv.x, 1e-9) || !near(Math.sin(h), -fv.y, 1e-9)) opp = false;
      }
      ok('dockParkedHeading: nose is exactly −frontVectorPlan at every angle', opp);
    }

    try {
      const { Planner } = await import('./planner.mod.js?v=' + Date.now());
      const C3 = await import('./canvas-render.mod.js?v=' + Date.now());
      const { hitRobot, hitPx, computeView } = C3;

      // ── "Calibrate to dock": solve the GPS trim from a docked fix ──────────
      const mkGeoPlanner = () => {
        const p = new Planner();
        const f = p.floor();
        f.w = 5000; f.d = 4000; f.walls = [];
        p.store.geo = { landmarks: [
          { id: 'l1', name: 'L1', x: L1.x, y: L1.y, lat: L1.lat, lon: L1.lon },
          { id: 'l2', name: 'L2', x: L2.x, y: L2.y, lat: L2.lat, lon: L2.lon },
        ] };
        return { p, f };
      };
      const midLat2 = (L1.lat + L2.lat) / 2, midLon2 = (L1.lon + L2.lon) / 2;
      const fixStates = (lat, lon) => ({ 'device_tracker.mow': {
        state: 'home', attributes: { latitude: lat, longitude: lon } } });

      {
        const { p, f } = mkGeoPlanner();
        // Dock deliberately NOT where the raw fix projects (≈ the plan midpoint).
        const r = { id: 'cal1', kind: 'mower', x: 1500, y: 1200, trackerEntity: 'device_tracker.mow' };
        f.robots = [r];
        p.hass = { states: fixStates(midLat2, midLon2) };
        const before = p.robotPosInfo(r);
        ok('calibrate: the uncalibrated fix does NOT land on the dock',
           before && before.mode === 'gps' && Math.hypot(before.worldX - r.x, before.worldY - r.y) > 500,
           before && `(${before.worldX.toFixed(0)},${before.worldY.toFixed(0)})`);
        p.save();
        const depth0 = p._undoStack.length;
        const okc = p.calibrateMowerToDock(r);
        const after = p.robotPosInfo(r);
        ok('calibrate: returns true with a fit + a fix', okc === true);
        ok('calibrate: the trimmed fix now lands EXACTLY on the dock',
           after && near(after.worldX, r.x, 1e-6) && near(after.worldY, r.y, 1e-6),
           after && `(${after.worldX},${after.worldY})`);
        ok('calibrate: writes a non-zero trim',
           Math.hypot(r.posOffsetX ?? 0, r.posOffsetY ?? 0) > 500,
           `${Math.round(r.posOffsetX)},${Math.round(r.posOffsetY)}`);
        ok('calibrate: one undo step', p._undoStack.length === depth0 + 1,
           `${p._undoStack.length} vs ${depth0 + 1}`);
        // Re-running on the same fix is idempotent (already solved → same trim).
        const ox = r.posOffsetX, oy = r.posOffsetY;
        p.calibrateMowerToDock(r);
        ok('calibrate: idempotent on an unchanged fix',
           near(r.posOffsetX, ox, 1e-9) && near(r.posOffsetY, oy, 1e-9));
        // A PRIOR trim must not bias the solve (the raw lat/lon is re-projected).
        r.posOffsetX = 99999; r.posOffsetY = -77777;
        p.calibrateMowerToDock(r);
        ok('calibrate: an existing trim (even one past the clamp) does not bias the solve',
           near(r.posOffsetX, ox, 1e-9) && near(r.posOffsetY, oy, 1e-9),
           `${Math.round(r.posOffsetX)},${Math.round(r.posOffsetY)}`);
      }
      // Refuse matrix — every branch leaves the store untouched.
      {
        const { p, f } = mkGeoPlanner();
        const v = { id: 'cv', kind: 'vacuum', x: 500, y: 500, trackerEntity: 'device_tracker.mow' };
        f.robots = [v];
        p.hass = { states: fixStates(midLat2, midLon2) };
        ok('calibrate: refuses for a vacuum',
           p.calibrateMowerToDock(v) === false && v.posOffsetX === undefined);
      }
      {
        const { p, f } = mkGeoPlanner();
        p.store.geo = { landmarks: [] };                       // no fit
        const r = { id: 'cnf', kind: 'mower', x: 500, y: 500, trackerEntity: 'device_tracker.mow' };
        f.robots = [r];
        p.hass = { states: fixStates(midLat2, midLon2) };
        ok('calibrate: refuses with no geo fit',
           p.calibrateMowerToDock(r) === false && r.posOffsetX === undefined);
      }
      {
        const { p, f } = mkGeoPlanner();
        const r = { id: 'cnx', kind: 'mower', x: 500, y: 500, trackerEntity: 'device_tracker.mow' };
        f.robots = [r];
        p.hass = { states: { 'device_tracker.mow': { state: 'home', attributes: {} } } };   // no fix
        ok('calibrate: refuses with no numeric fix',
           p.calibrateMowerToDock(r) === false && r.posOffsetX === undefined);
        r.trackerEntity = null;
        ok('calibrate: refuses with no GPS source at all',
           p.calibrateMowerToDock(r) === false && r.posOffsetX === undefined);
      }
      {
        const { p, f } = mkGeoPlanner();
        const r = { id: 'cvm', kind: 'mower', x: 500, y: 500, trackerEntity: 'device_tracker.mow' };
        f.robots = [r];
        p.hass = { states: fixStates(midLat2, midLon2) };
        p.uiMode = 'view';
        ok('calibrate: refuses in view mode',
           p.calibrateMowerToDock(r) === false && r.posOffsetX === undefined);
      }

      // ── rotateFloorContent bumps the dock rotation ─────────────────────────
      {
        const p = new Planner();
        const f = p.floor();
        f.w = 6000; f.d = 4000; f.walls = [];
        const a = { id: 'ra', kind: 'mower', x: 1000, y: 1000, rotation: 10 };
        const b = { id: 'rb', kind: 'vacuum', x: 2000, y: 1000 };        // rotation absent
        f.robots = [a, b];
        p.rotateFloorContent(45);
        ok('rotate: dock rotation bumps by φ', a.rotation === 55, String(a.rotation));
        ok('rotate: an absent rotation becomes φ (furniture semantics)',
           b.rotation === 45, String(b.rotation));
        p.rotateFloorContent(330);
        ok('rotate: rotation normalizes into 0..360',
           a.rotation === 25 && b.rotation === 15, `${a.rotation},${b.rotation}`);
      }

      // ── Rotation-aware hit tests (dock rect + mower body rect) ─────────────
      {
        const p = new Planner();
        const f = p.floor();
        f.w = 4000; f.d = 3000; f.walls = [];
        const dock = { id: 'hd', kind: 'mower', x: 2000, y: 2000, rotation: 45 };
        f.robots = [dock];
        const cv = document.getElementById('c2d');
        const view = computeView(cv, f.w, f.d, p.viewCenter, p.zoom);
        const tol = hitPx(view) * 1.6;
        // Both probe points sit 430 mm from the centre; the legacy tolerance
        // circle must not reach them or neither assertion discriminates.
        ok('hit precondition: the grab-tolerance circle is smaller than the probes',
           tol < 420, `tol=${Math.round(tol)} mm`);
        // Dock is 720 × 520 → local (350, 250) is inside the rect, and at 45°
        // its world offset (424, −71) is OUTSIDE the axis-aligned footprint.
        const inRot = { x: 2000 + 424.26, y: 2000 - 70.71 };
        const inAabb = { x: 2000 + 350, y: 2000 + 250 };
        ok('hit: a point inside the ROTATED dock rect hits', hitRobot(p, view, inRot) === dock);
        ok('hit: a point inside the AABB but outside the rotated rect misses',
           hitRobot(p, view, inAabb) === null);
        dock.rotation = 0;
        ok('hit: at rotation 0 the same pair swaps (AABB hits, rotated-probe misses)',
           hitRobot(p, view, inAabb) === dock && hitRobot(p, view, inRot) === null);

        // Mower BODY: bodyD (450) along travel, bodyW (600) across, aimed at the
        // live heading. Probe 290 mm out — inside across, outside along.
        // Dock parked well away from the probe cluster — its own 720 × 520
        // footprint would otherwise swallow these hits.
        f.robots = [{ id: 'hb', kind: 'mower', x: 3400, y: 2500 }];
        const hb = f.robots[0];
        p.robotStates = { hb: { x: 1000, y: 1000, heading: 0, phase: 0, activity: 'mowing', led: '#43a047' } };
        const pPlusX = { x: 1290, y: 1000 }, pPlusY = { x: 1000, y: 1290 };
        ok('hit: heading +X → the across probe (+Y) hits', hitRobot(p, view, pPlusY) === hb);
        ok('hit: heading +X → the along probe (+X, past bodyD/2) misses',
           hitRobot(p, view, pPlusX) === null);
        p.robotStates.hb.heading = Math.PI / 2;
        ok('hit: heading +Y → the pair swaps (+X hits, +Y misses)',
           hitRobot(p, view, pPlusX) === hb && hitRobot(p, view, pPlusY) === null);
        // Vacuum keeps the plain centre circle (no rect widening).
        f.robots = [{ id: 'hv', kind: 'vacuum', x: 3400, y: 2500 }];
        const hv = f.robots[0];
        p.robotStates = { hv: { x: 1000, y: 1000, heading: 0, phase: 0, activity: 'cleaning', led: '#43a047' } };
        ok('hit: vacuum body is unchanged (circle of the grab tolerance)',
           hitRobot(p, view, { x: 1000 + tol * 0.5, y: 1000 }) === hv
           && hitRobot(p, view, { x: 1000, y: 1000 + tol * 0.5 }) === hv
           && hitRobot(p, view, { x: 1000 + 290, y: 1000 }) === null);
      }

      // ── A docked mower parks aligned with its (rotated) dock ───────────────
      {
        const p = new Planner();
        const f = p.floor();
        f.w = 8000; f.d = 6000; f.walls = [];
        const r = { id: 'pk', kind: 'mower', x: 2000, y: 2000, rotation: 90 };
        f.robots = [r];
        p.stepRobots(0.05);
        ok('parked: a fresh mower spawns nose-into its dock',
           near(p.robotStates.pk.heading, dockParkedHeading(90), 1e-9),
           String(p.robotStates.pk.heading));
        // Turn the dock under a settled mower → the nose eases onto the new pose
        // (bounded yaw rate — a car never spins on the spot).
        r.rotation = 180;
        for (let i = 0; i < 600; i++) p.stepRobots(0.05);
        ok('parked: it eases onto a re-aimed dock',
           near(p.robotStates.pk.heading, dockParkedHeading(180), 1e-3),
           String(p.robotStates.pk.heading));
        // A vacuum's seed heading is UNCHANGED (its golden probes depend on it).
        const pv = new Planner();
        pv.floor().robots = [{ id: 'sv', kind: 'vacuum', x: 900, y: 900, rotation: 90 }];
        pv.stepRobots(0.05);
        ok('parked: the vacuum spawn heading stays 0', pv.robotStates.sv.heading === 0,
           String(pv.robotStates.sv.heading));
      }
    } catch (e) {
      ok('dock rotation / calibrate / hit tests threw', false, String(e && e.message || e));
    }

    // ── Renderer: dock orientation + the emissive front strip ────────────────
    try {
      const rmod = await import('./assets/three-renderer.js?v=' + Date.now());
      const R2 = new rmod.ThreeDRenderer(document.getElementById('rc2'));
      await R2.load();
      const docks = [
        { id: 'd0', kind: 'mower',  x: 1000, y: 1000, entity_id: null },                 // rotation absent
        { id: 'd1', kind: 'mower',  x: 3000, y: 1000, entity_id: null, rotation: 90 },
        { id: 'd2', kind: 'vacuum', x: 5000, y: 1000, entity_id: null, rotation: 210 },
      ];
      R2.updateRobotDocks(docks);
      const g = R2._robotGroup.children;
      ok('dock3d: one group per dock', g.length === 3, 'n=' + g.length);
      ok('dock3d: rotation 0 / absent leaves the yaw untouched', g[0].rotation.y === 0,
         String(g[0].rotation.y));
      ok('dock3d: yaw uses the furniture sign (−deg·π/180)',
         near(g[1].rotation.y, -Math.PI / 2, 1e-12) && near(g[2].rotation.y, -210 * Math.PI / 180, 1e-12),
         `${g[1].rotation.y} / ${g[2].rotation.y}`);
      const strips = g.map(grp => {
        let s = null; grp.traverse(o => { if (o.userData && o.userData.robotDockFront) s = o; }); return s;
      });
      ok('dock3d: every dock (both kinds) gains exactly one front strip',
         strips.every(s => !!s));
      ok('dock3d: the strip sits on the dock FRONT (local −Z)',
         strips.every(s => s.position.z < 0), strips.map(s => s && s.position.z).join(','));
      ok('dock3d: the strip is outline-skipped (emissive marker, not a body)',
         strips.every(s => s.userData.outlineSkip === true));
      // The strip's WORLD-plan direction must equal frontVectorPlan(rotation).
      // scene = (fw/2 − wx, h, wy − fd/2) ⇒ Δworld = (−Δscene.x, Δscene.z).
      let dirOk = true, dirDetail = '';
      for (let i = 0; i < docks.length; i++) {
        const a = g[i].rotation.y, pz = strips[i].position.z, px = strips[i].position.x;
        const sx = px * Math.cos(a) + pz * Math.sin(a);
        const sz = -px * Math.sin(a) + pz * Math.cos(a);
        const n = Math.hypot(sx, sz) || 1;
        const wdx = -sx / n, wdy = sz / n;
        const fv = frontVectorPlan(docks[i].rotation);
        if (!near(wdx, fv.x, 1e-9) || !near(wdy, fv.y, 1e-9)) dirOk = false;
        dirDetail += `${(docks[i].rotation ?? 0)}:(${wdx.toFixed(3)},${wdy.toFixed(3)}) `;
      }
      ok('dock3d: the front strip points along frontVectorPlan(rotation)', dirOk, dirDetail.trim());
      R2.destroy();
    } catch (e) {
      ok('renderer dock rotation tests threw', false, String(e && e.message || e));
    }

    // ── run + report ─────────────────────────────────────────────────────────
    const grid = document.getElementById('grid');
    let pass = 0; const fails = [];
    for (const t of tests) {
      if (t.ok) pass++; else fails.push(t.name);
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `<div class="row">
        <span>${t.ok ? '<span class=pass>PASS</span>' : '<span class=fail>FAIL</span>'} ${t.name}</span>
        <span>${t.detail ?? ''}</span></div>`;
      grid.appendChild(card);
    }
    const total = tests.length;
    const allPass = pass === total;
    const title = allPass ? `ROBOT PASS ${pass}/${total}` : `ROBOT FAIL ${pass}/${total} [${fails.join(',')}]`;
    document.title = title;
    const sum = document.getElementById('summary');
    sum.textContent = title;
    sum.className = allPass ? 'okbg' : 'badbg';
  </script>
</body>
</html>
