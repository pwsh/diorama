<!doctype html>
<meta charset="utf-8">
<title>FLOORSVIEW …</title>
<style>
  body { margin:0; background:#0d1116; color:#cfd8dc; font:13px/1.5 sans-serif; padding:14px; }
  h1 { font-size:15px; margin:0 0 10px; }
  #summary { font-size:14px; font-weight:bold; margin:10px 0; padding:8px 10px; border-radius:5px; }
  .okbg { background:#12331f; color:#69f0ae; } .badbg { background:#3a1414; color:#ff8a80; }
  .row { display:flex; justify-content:space-between; gap:10px; padding:2px 0; border-bottom:1px solid #1c2530; }
  .pass { color:#69f0ae; } .fail { color:#ff5252; }
  .name { color:#90caf9; } .extra { color:#ffd54f; font-size:11px; }
  h2 { font-size:12px; color:#80cbc4; margin:14px 0 4px; }
</style>
<h1>Floor list order + plan nudge + tri-state visibility + floor-switch viewport retention — pure helpers + real Planner</h1>
<div id="summary">Running…</div>
<div id="rows"></div>

<!-- Harness build (from the repo root; NEVER reuse stale bundles). This page
     imports ONLY the two esbuild bundles below — no built dist/ required:
       H=/tmp/diorama-harness-floorsview
       rm -rf "$H"; mkdir -p "$H"
       cp test-pages/floors-view-test.html "$H"/
       npx esbuild src/geometry.ts --bundle --format=esm --outfile="$H"/geometry.mod.js
       T=$(mktemp -d); cp -r src/* "$T"/
       cp test-pages/fake-avatar-store.ts "$T"/avatar-store.ts
       npx esbuild "$T"/planner.ts --bundle --format=esm --outfile="$H"/planner.mod.js
     Run headless (serve over http — Chrome blocks dynamic module imports on file://):
       (cd "$H" && python3 -m http.server 8797 &)
       google-chrome --headless=new --disable-gpu --use-angle=swiftshader \
         --virtual-time-budget=30000 --dump-dom \
         "http://localhost:8797/floors-view-test.html" | grep -o "<title>[^<]*"  -->
<script type="module">
  const V = '?v=' + Date.now();
  const G = await import('./geometry.mod.js' + V);
  const { floorsDisplayOrder, peekFloors } = G;
  const { Planner, viewCenterFitsFloor, floorSwitchCameraDelta, VIEW_RETAIN_MARGIN_FRAC } =
    await import('./planner.mod.js' + V);

  const results = [];
  const ok = (name, cond, extra = '') => results.push({ name, pass: !!cond, extra: String(extra) });
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  async function waitFor(cond, tries = 600) {
    for (let i = 0; i < tries; i++) { if (cond()) return true; await sleep(4); }
    return !!cond();
  }
  const ids = arr => arr.map(f => f.id).join(',');

  // ── Fake HaApi over a Map (LocalApi seam) ──────────────────────────────────
  class FakeHa {
    constructor(seed) { this.map = new Map(); for (const [k, v] of Object.entries(seed || {})) this.map.set(k, JSON.parse(JSON.stringify(v))); this.states = {}; this._s = []; this._c = []; }
    connect() { for (const cb of this._c) cb('connected'); for (const cb of this._s) cb(this.states, undefined); }
    onState(fn) { this._s.push(fn); } onConn(fn) { this._c.push(fn); }
    callService() { return Promise.resolve(); }
    async getHistory() { return {}; } async getWeatherForecasts() { return null; }
    async getDevices() { return []; } async getEntityRegistry() { return []; } async updateEntityRegistry() { return true; }
    async getUserData(k) { return this.map.has(k) ? JSON.parse(JSON.stringify(this.map.get(k))) : null; }
    async setUserData(k, v) { this.map.set(k, JSON.parse(JSON.stringify(v))); return true; }
    async refreshStates() {} async subscribeMqtt() { return () => {}; } async publishMqtt() {}
  }
  const mkFloor = (id, name, over = {}) => Object.assign({
    id, name, w: 12000, d: 12000,
    walls: [], furniture: [], lights: [], switches: [], sensors: [], motionSensors: [],
    envSensors: [], bleProxies: [], doors: [], windows: [], rooms: [], bg: null,
  }, over);
  async function mkPlanner(floors, extra = {}) {
    localStorage.removeItem('diorama:store:v1'); localStorage.removeItem('diorama:configs');
    const seed = Object.assign({ v: 2, floors, currentFloorId: floors[0].id, activeSensorId: null,
      coverage: true, imperial: false, showDetails: false, useRawTargets: false }, extra);
    const p = new Planner(); p.connectWith(new FakeHa({ diorama: seed }));
    await waitFor(() => p.configIndex !== null);
    return p;
  }

  try {
    // ═══ 1. floorsDisplayOrder — reverse, no mutation ═══
    document.getElementById('rows').insertAdjacentHTML('beforeend', '<h2>1. floorsDisplayOrder</h2>');
    {
      const arr = [{ id: 'A' }, { id: 'B' }, { id: 'C' }];
      const disp = floorsDisplayOrder(arr);
      ok('1a reversed (C,B,A)', ids(disp) === 'C,B,A', ids(disp));
      ok('1b input NOT mutated (A,B,C)', ids(arr) === 'A,B,C', ids(arr));
      ok('1c returns a fresh array', disp !== arr, '');
      const one = [{ id: 'X' }];
      ok('1d single floor trivial', ids(floorsDisplayOrder(one)) === 'X', '');
      ok('1e empty → empty', floorsDisplayOrder([]).length === 0, '');
    }

    // ═══ 2. moveFloor + display mapping (▲ on displayed-top-minus-one) ═══
    document.getElementById('rows').insertAdjacentHTML('beforeend', '<h2>2. moveFloor + display mapping</h2>');
    {
      // Array order [A,B,C] (A lowest story). Displayed reversed → [C,B,A].
      const p = await mkPlanner([mkFloor('A', 'A'), mkFloor('B', 'B'), mkFloor('C', 'C')]);
      const disp0 = floorsDisplayOrder(p.store.floors);
      ok('2a initial display order C,B,A', ids(disp0) === 'C,B,A', ids(disp0));
      // The displayed-top-minus-one row is index 1 in the displayed list = 'B'.
      const rowFloor = disp0[1];
      ok('2b that row is B', rowFloor.id === 'B', rowFloor.id);
      // ▲ = "move up the displayed list" = HIGHER story = moveFloor(id, +1).
      p.moveFloor(rowFloor.id, +1);
      ok('2c store.floors now A,C,B (canonical)', ids(p.store.floors) === 'A,C,B', ids(p.store.floors));
      const disp1 = floorsDisplayOrder(p.store.floors);
      ok('2d B moved UP in displayed list → B,C,A', ids(disp1) === 'B,C,A', ids(disp1));
      ok('2e B is now displayed-top', disp1[0].id === 'B', disp1[0].id);
      // ▼ on B (now displayed-top) = moveFloor(id, -1) → back to A,B,C.
      p.moveFloor('B', -1);
      ok('2f ▼ returns store to A,B,C', ids(p.store.floors) === 'A,B,C', ids(p.store.floors));
    }

    // ═══ 3. Plan nudge = translateFloorContent + save (one undo step) ═══
    document.getElementById('rows').insertAdjacentHTML('beforeend', '<h2>3. plan nudge (translate + undo)</h2>');
    {
      const wall = { id: 'w1', points: [{ x: 1000, y: 2000 }, { x: 3000, y: 2000 }] };
      const furn = { id: 'fu1', x: 5000, y: 6000, w: 800, h: 800, rotation: 0, kind: 'block' };
      const p = await mkPlanner([mkFloor('f1', 'Home', { walls: [wall], furniture: [furn] })]);
      const f0 = p.store.floors[0];
      const w0 = f0.w, d0 = f0.d;
      const wy0 = f0.walls[0].points[0].y, fy0 = f0.furniture[0].y;
      // Mirror the sidebar ↑ button exactly: +Y (screen-up), then save + emitConfig.
      p.translateFloorContent(0, 100); p.save(); p.emitConfig();
      const f1 = p.store.floors[0];
      ok('3a wall point moved +100 world-Y', f1.walls[0].points[0].y === wy0 + 100, f1.walls[0].points[0].y);
      ok('3b furniture moved +100 world-Y', f1.furniture[0].y === fy0 + 100, f1.furniture[0].y);
      ok('3c furniture X unchanged', f1.furniture[0].x === 5000, f1.furniture[0].x);
      ok('3d floor rect NOT changed', f1.w === w0 && f1.d === d0, `${f1.w}x${f1.d}`);
      ok('3e canUndo after one nudge', p.canUndo === true, p.canUndo);
      p.undo();
      const f2 = p.store.floors[0];
      ok('3f undo restores wall y', f2.walls[0].points[0].y === wy0, f2.walls[0].points[0].y);
      ok('3g undo restores furniture y', f2.furniture[0].y === fy0, f2.furniture[0].y);
      // ← button = -X.
      const fx0 = p.store.floors[0].furniture[0].x;
      p.translateFloorContent(-100, 0); p.save(); p.emitConfig();
      ok('3h ← moves -100 world-X', p.store.floors[0].furniture[0].x === fx0 - 100, p.store.floors[0].furniture[0].x);
    }

    // ═══ 4. Tri-state cycle: show → peek → hide → show ═══
    document.getElementById('rows').insertAdjacentHTML('beforeend', '<h2>4. cycleFloorVisibility</h2>');
    {
      const p = await mkPlanner([mkFloor('a', 'A'), mkFloor('b', 'B')]);
      const f = () => p.store.floors[0];
      ok('4a initial show (neither flag)', !f().disabled && !f().peek2d, `d=${f().disabled} p=${f().peek2d}`);
      p.cycleFloorVisibility('a');   // show → peek
      ok('4b peek: peek2d set, disabled clear', f().peek2d === true && !f().disabled, `d=${f().disabled} p=${f().peek2d}`);
      p.cycleFloorVisibility('a');   // peek → hide
      ok('4c hide: disabled set, peek2d clear', f().disabled === true && !f().peek2d, `d=${f().disabled} p=${f().peek2d}`);
      p.cycleFloorVisibility('a');   // hide → show
      ok('4d show: both clear', !f().disabled && !f().peek2d, `d=${f().disabled} p=${f().peek2d}`);
      // Invariant across a full extra loop: never both set.
      let bothEver = false;
      for (let i = 0; i < 6; i++) { p.cycleFloorVisibility('a'); if (f().disabled && f().peek2d) bothEver = true; }
      ok('4e invariant: never both set', bothEver === false, '');
    }

    // ═══ 5. enabledFloors — peek in, hidden out ═══
    document.getElementById('rows').insertAdjacentHTML('beforeend', '<h2>5. enabledFloors</h2>');
    {
      const p = await mkPlanner([
        mkFloor('shown', 'Shown'),
        mkFloor('peek', 'Peek', { peek2d: true }),
        mkFloor('hidden', 'Hidden', { disabled: true }),
      ]);
      const en = p.enabledFloors();
      ok('5a includes shown', en.some(f => f.id === 'shown'), '');
      ok('5b includes peek (enabled)', en.some(f => f.id === 'peek'), '');
      ok('5c excludes hidden', !en.some(f => f.id === 'hidden'), ids(en));
    }

    // ═══ 6. peek2d survives save/load through repairFloor/_loadFromHa ═══
    document.getElementById('rows').insertAdjacentHTML('beforeend', '<h2>6. peek2d round-trip</h2>');
    {
      // Seed with peek2d already set — _loadFromHa reconstructs floors through
      // repairFloor's explicit field list, so if peek2d were missing there it
      // would silently reset on load (the per-floor-field gotcha).
      const p = await mkPlanner([mkFloor('r', 'Round', { peek2d: true })]);
      ok('6a peek2d preserved on load', p.store.floors[0].peek2d === true, `${p.store.floors[0].peek2d}`);
      // Set it via the API, then reload a SECOND planner off the same persisted map.
      const ha = new FakeHa({ diorama: { v: 2, floors: [mkFloor('r2', 'R2')], currentFloorId: 'r2' } });
      const p2 = new Planner(); p2.connectWith(ha);
      await waitFor(() => p2.configIndex !== null);
      p2.cycleFloorVisibility('r2');   // → peek, persisted through save()
      await sleep(700);                // let the 600 ms debounced save flush
      const p3 = new Planner(); p3.connectWith(ha);
      await waitFor(() => p3.configIndex !== null);
      ok('6b peek2d persisted then reloaded', p3.store.floors[0].peek2d === true, `${p3.store.floors[0].peek2d}`);
    }

    // ═══ 7. peekFloors selection helper ═══
    document.getElementById('rows').insertAdjacentHTML('beforeend', '<h2>7. peekFloors</h2>');
    {
      const floors = [
        { id: 'cur', peek2d: true },       // current — excluded even though peek
        { id: 'p1', peek2d: true },         // peek → included
        { id: 'p2', peek2d: true, disabled: true }, // peek but hidden → excluded
        { id: 'plain' },                    // no peek → excluded
      ];
      const pk = peekFloors(floors, 'cur');
      ok('7a only p1 (current + hidden + plain excluded)', ids(pk) === 'p1', ids(pk));
      ok('7b none when current is the only peek', peekFloors([{ id: 'cur', peek2d: true }], 'cur').length === 0, '');
      ok('7c empty floors → empty', peekFloors([], 'x').length === 0, '');
    }

    // ═══ 8. viewCenterFitsFloor — the 2D retention safety guard ═══
    document.getElementById('rows').insertAdjacentHTML('beforeend', '<h2>8. viewCenterFitsFloor guard</h2>');
    {
      // 12000 × 8000 → margin = 0.5 · max(w,d) = 6000 on EVERY side.
      // Accepted band: x ∈ [-6000, 18000], y ∈ [-6000, 14000].
      ok('8a margin frac is 0.5', VIEW_RETAIN_MARGIN_FRAC === 0.5, VIEW_RETAIN_MARGIN_FRAC);
      ok('8b centre inside rect', viewCenterFitsFloor(12000, 8000, 6000, 4000) === true, '');
      ok('8c exactly on the rect corner', viewCenterFitsFloor(12000, 8000, 0, 0) === true, '');
      ok('8d just inside +x margin (17999)', viewCenterFitsFloor(12000, 8000, 17999, 4000) === true, '');
      ok('8e exactly on +x margin (18000)', viewCenterFitsFloor(12000, 8000, 18000, 4000) === true, '');
      ok('8f past +x margin (18001)', viewCenterFitsFloor(12000, 8000, 18001, 4000) === false, '');
      ok('8g exactly on -x margin (-6000)', viewCenterFitsFloor(12000, 8000, -6000, 4000) === true, '');
      ok('8h past -x margin (-6001)', viewCenterFitsFloor(12000, 8000, -6001, 4000) === false, '');
      ok('8i exactly on +y margin (14000)', viewCenterFitsFloor(12000, 8000, 6000, 14000) === true, '');
      ok('8j past +y margin (14001)', viewCenterFitsFloor(12000, 8000, 6000, 14001) === false, '');
      // Margin keys off the LARGER dimension in both axes (12000 here, not 8000).
      ok('8k y margin uses max(w,d)', viewCenterFitsFloor(12000, 8000, 6000, -6000) === true, '');
      ok('8l NaN centre rejected', viewCenterFitsFloor(12000, 8000, NaN, 0) === false, '');
    }

    // ═══ 9. floorSwitchCameraDelta — 3D scene-frame compensation ═══
    document.getElementById('rows').insertAdjacentHTML('beforeend', '<h2>9. floorSwitchCameraDelta</h2>');
    {
      // The renderer maps world→scene as _w(wx, wy, h) = (fw/2 − wx, h, wy − fd/2).
      // A world point must keep its scene position ⇒ dx = (fw′−fw)/2, dz = −(fd′−fd)/2.
      const eq = (d, dx, dz) => d.dx === dx && d.dz === dz;
      const d0 = floorSwitchCameraDelta(12000, 8000, 12000, 8000);
      ok('9a equal dims → exact {0,0} no-op', eq(d0, 0, 0), `${d0.dx},${d0.dz}`);
      const dg = floorSwitchCameraDelta(12000, 8000, 16000, 10000);
      ok('9b growing floor → dx +2000', dg.dx === 2000, dg.dx);
      ok('9c growing floor → dz -1000 (negated)', dg.dz === -1000, dg.dz);
      const ds = floorSwitchCameraDelta(16000, 10000, 12000, 8000);
      ok('9d shrinking floor → dx -2000, dz +1000', eq(ds, -2000, 1000), `${ds.dx},${ds.dz}`);
      ok('9e round-trip cancels', dg.dx + ds.dx === 0 && dg.dz + ds.dz === 0, '');
      // Sign convention asserted directly against _w's mirror math for a real point.
      const wx = 3000, wy = 2000, fw = 12000, fd = 8000, fw2 = 16000, fd2 = 10000;
      const sx = fw / 2 - wx,  sz = wy - fd / 2;
      const sx2 = fw2 / 2 - wx, sz2 = wy - fd2 / 2;
      const dd = floorSwitchCameraDelta(fw, fd, fw2, fd2);
      ok('9f delta == _w(new) − _w(old) in x', sx + dd.dx === sx2, `${sx + dd.dx} vs ${sx2}`);
      ok('9g delta == _w(new) − _w(old) in z', sz + dd.dz === sz2, `${sz + dd.dz} vs ${sz2}`);
      ok('9h non-finite input → {0,0}', eq(floorSwitchCameraDelta(NaN, 8000, 12000, 8000), 0, 0), '');
      // ── Y term: the world GROUND PLANE is fixed and the active slab always
      // builds at scene y=0, so switching from a floor at elevation E to one at
      // E′ slides the ground (and the neighborhood, and the glass-house stack)
      // by E′ − E. dy = E − E′ keeps the camera at the same height ABOVE GROUND,
      // which is what makes the fixed plane actually read as fixed.
      ok('9i elevation args omitted → dy 0 (pre-ground-plane callers unchanged)',
         d0.dy === 0 && dg.dy === 0, `${d0.dy},${dg.dy}`);
      const du = floorSwitchCameraDelta(12000, 8000, 12000, 8000, 0, 3000);
      ok('9j going UP one story → dy −3000 (camera drops with the ground)', du.dy === -3000, du.dy);
      const dd2 = floorSwitchCameraDelta(12000, 8000, 12000, 8000, 3000, 0);
      ok('9k coming DOWN one story → dy +3000', dd2.dy === 3000, dd2.dy);
      ok('9l up/down round-trip cancels in y', du.dy + dd2.dy === 0, '');
      ok('9m dy is independent of the rect delta',
         floorSwitchCameraDelta(12000, 8000, 16000, 10000, 0, 2400).dy === -2400 &&
         floorSwitchCameraDelta(12000, 8000, 16000, 10000, 0, 2400).dx === 2000, '');
      ok('9n basement (−2800) → dy +2800 going down to it',
         floorSwitchCameraDelta(12000, 8000, 12000, 8000, 0, -2800).dy === 2800, '');
      ok('9o equal elevations → exact dy 0 no-op',
         floorSwitchCameraDelta(12000, 8000, 12000, 8000, 5400, 5400).dy === 0, '');
      ok('9p non-finite elevation → dy 0 (never NaN into the camera)',
         floorSwitchCameraDelta(12000, 8000, 12000, 8000, NaN, 3000).dy === 0 &&
         floorSwitchCameraDelta(12000, 8000, 12000, 8000, 0, Infinity).dy === 0, '');
      ok('9q non-finite rect still zeroes everything incl. dy',
         floorSwitchCameraDelta(NaN, 8000, 12000, 8000, 0, 3000).dy === 0, '');
    }

    // ═══ 9b. floorElevationMm — per-floor height above the fixed ground plane ═══
    document.getElementById('rows').insertAdjacentHTML('beforeend', '<h2>9b. floorElevationMm (fixed ground plane)</h2>');
    {
      const { floorElevationMm, STORY_H_MM } = G;
      const fl = (id, elevationMm) => ({ id, elevationMm });
      const auto = [fl('a'), fl('b'), fl('c')];
      ok('9b1 STORY_H_MM = 3000', STORY_H_MM === 3000, STORY_H_MM);
      ok('9b2 AUTO = index × STORY_H_MM; floors[0] sits ON the ground plane',
         floorElevationMm(auto, 'a') === 0 && floorElevationMm(auto, 'b') === 3000 &&
         floorElevationMm(auto, 'c') === 6000, '');
      ok('9b3 explicit elevationMm wins (incl. negative)',
         floorElevationMm([fl('x', 2400)], 'x') === 2400 &&
         floorElevationMm([fl('y', -1300)], 'y') === -1300, '');
      ok('9b4 unknown id → 0', floorElevationMm(auto, 'zz') === 0, '');
      ok('9b5 empty / null / undefined list → 0',
         floorElevationMm([], 'a') === 0 && floorElevationMm(null, 'a') === 0 &&
         floorElevationMm(undefined, 'a') === 0, '');
      ok('9b6 garbage elevationMm falls back to AUTO',
         floorElevationMm([fl('a'), { id: 'b', elevationMm: NaN }], 'b') === 3000, '');
      ok('9b7 reordering changes AUTO elevations (array order is canonical)',
         floorElevationMm([fl('a'), fl('b')], 'b') === 3000 &&
         floorElevationMm([fl('b'), fl('a')], 'b') === 0, '');
      ok('9b8 a filtered list would re-stack autos — hence resolve on store.floors',
         floorElevationMm(auto, 'c') === 6000 &&
         floorElevationMm(auto.filter(f => f.id !== 'b'), 'c') === 3000, '');
      // Composition rule three-view applies (documented here so the pure side
      // pins it even though the injection itself lives in the view layer).
      const eff = (user, floors, id) => G.resolveGroundLevelMm(user) - floorElevationMm(floors, id);
      ok('9b9 effective ground = clamped user offset − active elevation',
         eff(0, auto, 'a') === 0 && eff(0, auto, 'b') === -3000 &&
         eff(-600, auto, 'b') === -3600, '');
      ok('9b10 user offset clamps at ±10000, effective value does not',
         G.resolveGroundLevelMm(-99999) === -10000 &&
         eff(-10000, [fl('a'), fl('b'), fl('c'), fl('d')], 'd') === -19000, '');
    }

    // ═══ 10. switchFloor RETAINS pan/zoom (real Planner) ═══
    document.getElementById('rows').insertAdjacentHTML('beforeend', '<h2>10. switchFloor retains viewCenter/zoom</h2>');
    {
      // Same dims on both floors — the common stacked-story case.
      const p = await mkPlanner([mkFloor('A', 'A'), mkFloor('B', 'B')]);
      ok('10a fresh load starts unpanned', p.viewCenter === null && p.zoom === 1, `${p.viewCenter},${p.zoom}`);
      // Never-panned view stays null across a switch (fit-to-canvas self-adapts).
      p.switchFloor('B');
      ok('10b null centre stays null', p.viewCenter === null, `${p.viewCenter}`);
      ok('10c zoom untouched at 1', p.zoom === 1, p.zoom);
      // Now pan + zoom, then switch back: both retained EXACTLY.
      p.viewCenter = { x: 5000, y: 4000 }; p.zoom = 2.75;
      p.switchFloor('A');
      ok('10d same-dims switch retains centre', p.viewCenter && p.viewCenter.x === 5000 && p.viewCenter.y === 4000,
         JSON.stringify(p.viewCenter));
      ok('10e same-dims switch retains zoom', p.zoom === 2.75, p.zoom);
      // Retention survives repeated switches (no drift).
      p.switchFloor('B'); p.switchFloor('A');
      ok('10f retained over repeated switches', p.viewCenter.x === 5000 && p.zoom === 2.75, `${p.viewCenter.x},${p.zoom}`);
    }
    {
      // Different-dims floors: retain while the centre is inside the inflated
      // rect, fall back to the fit when it's far outside.
      const p = await mkPlanner([mkFloor('big', 'Big', { w: 40000, d: 40000 }), mkFloor('sm', 'Small', { w: 6000, d: 6000 })]);
      // Small floor guard band: 0..6000 inflated by 3000 → [-3000, 9000].
      p.viewCenter = { x: 8000, y: 5000 }; p.zoom = 3;
      p.switchFloor('sm');
      ok('10g different dims, centre in band → retained', p.viewCenter && p.viewCenter.x === 8000, JSON.stringify(p.viewCenter));
      ok('10h zoom retained with the centre', p.zoom === 3, p.zoom);
      // Way outside the small floor's band → reset to fit.
      p.switchFloor('big');
      p.viewCenter = { x: 35000, y: 35000 }; p.zoom = 3;
      p.switchFloor('sm');
      ok('10i far-outside centre resets to null', p.viewCenter === null, JSON.stringify(p.viewCenter));
      ok('10j reset also restores zoom 1', p.zoom === 1, p.zoom);
      // Unknown floor id → treated as stale (defensive).
      p.viewCenter = { x: 1000, y: 1000 }; p.zoom = 2;
      p.switchFloor('nope');
      ok('10k unknown floor id resets', p.viewCenter === null && p.zoom === 1, `${p.viewCenter},${p.zoom}`);
    }
    {
      // The OTHER reset paths must still reset — a different CONFIG genuinely
      // is a different plan, and resetView is the explicit user action.
      const p = await mkPlanner([mkFloor('A', 'A'), mkFloor('B', 'B')]);
      p.viewCenter = { x: 5000, y: 5000 }; p.zoom = 2;
      p.resetView();
      ok('10l resetView() still resets', p.viewCenter === null && p.zoom === 1, `${p.viewCenter},${p.zoom}`);
      p.viewCenter = { x: 5000, y: 5000 }; p.zoom = 2;
      await p.newConfig('Second plan');
      ok('10m newConfig resets (different plan)', p.viewCenter === null && p.zoom === 1, `${p.viewCenter},${p.zoom}`);
      // switchConfig back to the original also resets.
      const first = p.configIndex.configs.find(c => c.name !== 'Second plan');
      p.viewCenter = { x: 4000, y: 4000 }; p.zoom = 1.5;
      await p.switchConfig(first.id);
      ok('10n switchConfig resets', p.viewCenter === null && p.zoom === 1, `${p.viewCenter},${p.zoom}`);
      // A fresh Planner load (the _applyLoadedStore path) starts unpanned.
      const p2 = new Planner(); p2.connectWith(new FakeHa({ diorama: { v: 2, floors: [mkFloor('A', 'A')], currentFloorId: 'A' } }));
      await waitFor(() => p2.configIndex !== null);
      ok('10o fresh load starts unpanned', p2.viewCenter === null && p2.zoom === 1, `${p2.viewCenter},${p2.zoom}`);
    }
  } catch (err) {
    ok('unhandled error', false, (err && (err.stack || err.message)) || String(err));
  }

  const passN = results.filter(r => r.pass).length;
  const failN = results.length - passN;
  const rows = document.getElementById('rows');
  for (const r of results) {
    rows.insertAdjacentHTML('beforeend',
      `<div class="row"><span class="name">${r.name}</span>` +
      `<span class="${r.pass ? 'pass' : 'fail'}">${r.pass ? 'PASS' : 'FAIL'}` +
      `${r.extra ? ` <span class="extra">${r.extra}</span>` : ''}</span></div>`);
  }
  const sum = document.getElementById('summary');
  sum.textContent = `FLOORSVIEW ${failN === 0 ? 'PASS' : 'FAIL'} ${passN}/${results.length}`;
  sum.className = failN === 0 ? 'okbg' : 'badbg';
  document.title = `FLOORSVIEW ${failN === 0 ? 'PASS' : 'FAIL'} ${passN}/${results.length}` +
    (failN ? ' | ' + results.filter(r => !r.pass).map(r => r.name).join(' · ') : '');
</script>
