<!doctype html>
<meta charset="utf-8">
<title>SOLAR …</title>
<style>html,body{margin:0;background:#111;color:#cfd8dc;font:12px monospace}#c{width:1280px;height:880px}#log{padding:8px;white-space:pre-wrap}</style>
<div id="c"></div>
<div id="log"></div>
<!-- Motorized sun-tracking solar panel fixture. Seams:
       (1) pure sun/tracking math (solar.mod.js — ZERO imports, plain transpile):
             npx esbuild src/solar.ts --format=esm --outfile=<H>/solar.mod.js
       (2) storage repairFloor/defaultFloor backfill (storage.mod.js):
             npx esbuild src/storage.ts --bundle --format=esm --outfile=<H>/storage.mod.js
       (3) 2D draw (canvas-render.mod.js, pure/no-three) — no-throw + tilt foreshortening:
             npx esbuild src/canvas-render.ts --bundle --format=esm --outfile=<H>/canvas-render.mod.js
       (4) 3D build (pedestal / aim / UV tint / power glow / grade) via the built
           three-renderer chunk (./assets/three-renderer.js).
       (5) planner CRUD + translate/rotate + deleteSelection + LIVE-path powerEntity
           via the REAL Planner (planner.mod.js, same fake-HaApi/fake-avatar-store
           build as config-test):
             T=$(mktemp -d); cp -r src/* "$T"/; cp test-pages/fake-avatar-store.ts "$T"/avatar-store.ts
             npx esbuild "$T"/planner.ts --bundle --format=esm --outfile=<H>/planner.mod.js
     Asserts machine-checkable in document.title. -->
<script type="module">
  const V = '?v=' + Date.now();
  const sol   = await import('./solar.mod.js' + V);
  const store = await import('./storage.mod.js' + V);
  const cr    = await import('./canvas-render.mod.js' + V);
  const mod   = await import('./assets/three-renderer.js' + V);
  const { Planner } = await import('./planner.mod.js' + V);
  // (6) demo weather source — the authored-sun override helper (section 9):
  //       npx esbuild src/weather.ts --bundle --format=esm --outfile=<H>/weather.mod.js
  const { demoSunAltAz } = await import('./weather.mod.js' + V);

  const results = [];
  const assert = (name, cond, detail = '') => results.push({ name, ok: !!cond, detail: String(detail) });
  const near = (a, b, t = 1e-6) => Math.abs(a - b) <= t;
  const {
    compassToPlanDeg, sunAzimuthPlanDeg, sunElevationDeg, sunPlanFromClock, resolveSunPlan,
    solarAim, solarTrackOpts, solarRotation, solarPowerValue, solarPowerColor, solarPowerText,
    SOLAR_CLOCK, SOLAR_DEFAULTS, SOLAR_TILT_MIN, SOLAR_TILT_MAX, SOLAR_PARK_TILT,
    SOLAR_FIXED_AZIMUTH_DEG, SOLAR_FIXED_TILT_DEG,
    SOLAR_GEN_COLOR, SOLAR_DRAW_COLOR,
  } = sol;
  const stOf = (id, s, attrs) => ({ state: s, attributes: attrs || {}, entity_id: id });
  // Local-time helper: build an epoch ms at a given LOCAL hour (the clock
  // fallback reads local getHours, exactly like time-of-day.ts's fallback).
  const atHour = (h, m = 0) => { const d = new Date(2026, 6, 15, 0, 0, 0, 0); d.setHours(h, m, 0, 0); return d.getTime(); };

  // ── (1) compass → plan mapping (the SHARED sun-resolution seam) ──────────
  // Golden re-implementation of the formula three-view's `_weatherFxState` used
  // to inline: if these ever diverge, the scene's sun LIGHT and the panel would
  // disagree about where the sun is. That site now calls sunAzimuthPlanDeg.
  const goldenPlanDeg = (az, theta) => {
    const a = az * Math.PI / 180, c = Math.cos(theta), s = Math.sin(theta);
    const east = Math.sin(a), north = Math.cos(a);
    return Math.atan2(c * east - s * north, s * east + c * north) * 180 / Math.PI;
  };
  {
    let worst = 0;
    for (const az of [0, 37, 90, 123.4, 180, 271, 359]) {
      for (const th of [0, 0.3, -0.7, Math.PI / 2, Math.PI]) {
        worst = Math.max(worst, Math.abs(compassToPlanDeg(az, th) - goldenPlanDeg(az, th)));
      }
    }
    assert('compassToPlanDeg matches the three-view golden formula', worst < 1e-9, `maxΔ=${worst}`);
  }
  assert('θ=0: compass 0 → plan 0 (+Y is north)', near(compassToPlanDeg(0, 0), 0, 1e-9));
  assert('θ=0: compass 90 → plan 90 (+X is east)', near(compassToPlanDeg(90, 0), 90, 1e-9));
  assert('θ=0: compass 180 → plan 180', near(Math.abs(compassToPlanDeg(180, 0)), 180, 1e-9));
  assert('θ=π/2 rotates the frame by −90°', near(compassToPlanDeg(0, Math.PI / 2), -90, 1e-9),
    `${compassToPlanDeg(0, Math.PI / 2)}`);

  assert('sunAzimuthPlanDeg parses a numeric attr', near(sunAzimuthPlanDeg('123.4', 0), 123.4, 1e-9));
  assert('sunAzimuthPlanDeg(undefined) → null', sunAzimuthPlanDeg(undefined, 0) === null);
  assert('sunAzimuthPlanDeg(garbage) → null', sunAzimuthPlanDeg('above', 0) === null);
  assert('sunElevationDeg parses a numeric attr', sunElevationDeg('-3.5') === -3.5);
  assert('sunElevationDeg(null) → null', sunElevationDeg(null) === null);
  assert('elevation reader is INDEPENDENT of azimuth (half-populated entity)',
    sunAzimuthPlanDeg(undefined, 0) === null && sunElevationDeg('12') === 12);

  // ── (2) resolveSunPlan: entity wins, else the deterministic clock arc ─────
  {
    const withSun = resolveSunPlan(stOf('sun.sun', 'above_horizon', { azimuth: 200, elevation: 42 }), 0, atHour(3));
    assert('entity sun → source entity', withSun.source === 'entity');
    assert('entity sun az passes through θ', near(withSun.sun.azDeg, 200 - 360, 1e-9) || near(withSun.sun.azDeg, 200, 1e-9),
      `${withSun.sun.azDeg}`);
    assert('entity sun elevation passes through raw', withSun.sun.elevDeg === 42);
    const rot = resolveSunPlan(stOf('sun.sun', 'x', { azimuth: 0, elevation: 10 }), Math.PI / 2, atHour(3));
    assert('entity sun az is mapped through geo θ', near(rot.sun.azDeg, -90, 1e-9), `${rot.sun.azDeg}`);

    assert('no sun entity → clock source', resolveSunPlan(null, 0, atHour(12)).source === 'clock');
    assert('half-populated sun entity → clock source',
      resolveSunPlan(stOf('sun.sun', 'x', { azimuth: 100 }), 0, atHour(12)).source === 'clock');
    assert('unparseable attrs → clock source',
      resolveSunPlan(stOf('sun.sun', 'x', { azimuth: 'up', elevation: 'high' }), 0, atHour(12)).source === 'clock');
  }

  // Clock arc: deterministic, peaks at solar noon, negative at night, sweeps E→W.
  {
    const a1 = sunPlanFromClock(atHour(9, 30), 0), a2 = sunPlanFromClock(atHour(9, 30), 0);
    assert('clock arc is deterministic for the same nowMs',
      a1.azDeg === a2.azDeg && a1.elevDeg === a2.elevDeg, `${a1.azDeg}/${a1.elevDeg}`);
    const noon = sunPlanFromClock(atHour(12), 0);
    assert('clock noon elevation = peak', near(noon.elevDeg, SOLAR_CLOCK.peakElevDeg, 1e-9), `${noon.elevDeg}`);
    assert('clock noon azimuth = due south (180)', near(noon.azDeg, 180, 1e-9) || near(noon.azDeg, -180, 1e-9), `${noon.azDeg}`);
    const rise = sunPlanFromClock(atHour(SOLAR_CLOCK.sunriseH), 0);
    const set  = sunPlanFromClock(atHour(SOLAR_CLOCK.sunsetH), 0);
    assert('clock sunrise elevation ≈ 0', Math.abs(rise.elevDeg) < 1e-9, `${rise.elevDeg}`);
    assert('clock sunset elevation ≈ 0', Math.abs(set.elevDeg) < 1e-9, `${set.elevDeg}`);
    assert('clock sunrise azimuth = east (90)', near(rise.azDeg, SOLAR_CLOCK.riseAzDeg, 1e-9), `${rise.azDeg}`);
    assert('clock sunset azimuth = west (270 → plan −90)', near(set.azDeg, -90, 1e-9), `${set.azDeg}`);
    assert('clock midnight elevation is negative (parks)', sunPlanFromClock(atHour(0), 0).elevDeg < 0);
    assert('clock 22:00 elevation is negative', sunPlanFromClock(atHour(22), 0).elevDeg < 0);
    // Elevation rises to noon then falls; azimuth sweeps monotonically E→W.
    let elevUp = true, elevDown = true, azMono = true, prevAz = -Infinity;
    for (let h = 6; h <= 12; h += 0.5) if (sunPlanFromClock(atHour(Math.floor(h), (h % 1) * 60), 0).elevDeg
        < sunPlanFromClock(atHour(Math.floor(h - 0.5), ((h - 0.5) % 1) * 60), 0).elevDeg) elevUp = false;
    for (let h = 12.5; h <= 18; h += 0.5) if (sunPlanFromClock(atHour(Math.floor(h), (h % 1) * 60), 0).elevDeg
        > sunPlanFromClock(atHour(Math.floor(h - 0.5), ((h - 0.5) % 1) * 60), 0).elevDeg) elevDown = false;
    for (let h = 6; h <= 18; h += 1) {
      const az = sunPlanFromClock(atHour(h), 0).azDeg;
      const unwrapped = az < 0 ? az + 360 : az;   // 180→270 crosses the atan2 seam
      if (unwrapped < prevAz - 1e-9) azMono = false;
      prevAz = unwrapped;
    }
    assert('clock elevation climbs to noon', elevUp);
    assert('clock elevation falls after noon', elevDown);
    assert('clock azimuth sweeps monotonically east→west', azMono);
  }

  // ── (3) tracking geometry: yaw composition + tilt clamp + night park ──────
  {
    const a = solarAim(90, 30, 0);
    assert('aim yaw = sun azimuth (no base offset)', near(a.yawDeg, 90, 1e-9));
    assert('aim tilt = 90 − elevation', near(a.tiltDeg, 60, 1e-9));
    assert('aim not parked with the sun up', a.parked === false);
    assert('face normal elevation == sun elevation', near(90 - a.tiltDeg, 30, 1e-9));

    assert('base rotation composes onto the tracked yaw', near(solarAim(90, 30, 45).yawDeg, 135, 1e-9));
    assert('yaw wraps past 360', near(solarAim(350, 30, 30).yawDeg, 20, 1e-9));
    assert('negative base normalizes into 0..360', near(solarAim(10, 30, -30).yawDeg, 340, 1e-9));

    assert(`high sun clamps tilt to SOLAR_TILT_MIN (${SOLAR_TILT_MIN})`, solarAim(180, 85, 0).tiltDeg === SOLAR_TILT_MIN);
    assert(`low sun clamps tilt to SOLAR_TILT_MAX (${SOLAR_TILT_MAX})`, solarAim(180, 5, 0).tiltDeg === SOLAR_TILT_MAX);
    assert('mid sun is inside the mechanical range',
      solarAim(180, 45, 0).tiltDeg > SOLAR_TILT_MIN && solarAim(180, 45, 0).tiltDeg < SOLAR_TILT_MAX);

    const night = solarAim(270, -8, 33);
    assert('sun below horizon → parked', night.parked === true);
    assert('parked tilt = SOLAR_PARK_TILT (near-horizontal)', night.tiltDeg === SOLAR_PARK_TILT);
    assert('parked yaw = the BASE rotation', near(night.yawDeg, 33, 1e-9));
    assert('elevation exactly 0 parks (horizon)', solarAim(180, 0, 0).parked === true);
    assert('null sun parks', solarAim(null, null, 12).parked === true && solarAim(null, null, 12).yawDeg === 12);
    assert('NaN sun parks', solarAim(NaN, NaN, 0).parked === true);
    assert('non-finite base rotation falls back to 0', solarAim(90, 30, NaN).yawDeg === 90);

    // Tracking is CONTINUOUS while the sun is UP: sweeping the clock arc gives a
    // smooth tilt fall to noon and rise again, never a jump through the clamp.
    let maxStep = 0, prev = null;
    for (let h = 6.5; h <= 17.5; h += 0.25) {
      const s = sunPlanFromClock(atHour(Math.floor(h), Math.round((h % 1) * 60)), 0);
      const t = solarAim(s.azDeg, s.elevDeg, 0).tiltDeg;
      if (prev != null) maxStep = Math.max(maxStep, Math.abs(t - prev));
      prev = t;
    }
    assert('tilt is continuous while the sun is up', maxStep < 8, `maxStep=${maxStep.toFixed(2)}°`);
    // The park itself IS a discontinuity — a stow move, not a tracking step:
    // at the horizon the array snaps from its steepest tilt to flat.
    const lastUp = solarAim(...(() => { const s = sunPlanFromClock(atHour(6, 15), 0); return [s.azDeg, s.elevDeg, 0]; })());
    const stowed = solarAim(...(() => { const s = sunPlanFromClock(atHour(5, 45), 0); return [s.azDeg, s.elevDeg, 0]; })());
    assert('just after sunrise the array is at its steepest tracking tilt',
      lastUp.parked === false && lastUp.tiltDeg === SOLAR_TILT_MAX, `${lastUp.tiltDeg}`);
    assert('just before sunrise the array is stowed flat',
      stowed.parked === true && stowed.tiltDeg === SOLAR_PARK_TILT, `${stowed.tiltDeg}`);
  }

  // ── (3b) per-axis tracking switches ──────────────────────────────────────
  // A frozen axis holds a user value instead of following the sun. PARK RULE
  // (the one implemented in solar.ts): parked = !sunUp && (trackAz || trackTilt)
  // — a fully FIXED mount never parks (it never moves, so nothing stows), any
  // panel with a live axis parks at night so both renderers dim + drop the arrow.
  {
    // (a) opts undefined is BIT-IDENTICAL to the original two-axis tracker.
    const nd = d => { const m = d % 360; return m < 0 ? m + 360 : m; };
    const legacyAim = (az, el, base) => {
      const bRaw = Number(base), b = isFinite(bRaw) ? bRaw : 0;
      const A = Number(az), E = Number(el);
      if (!isFinite(A) || !isFinite(E) || E <= 0) return { yawDeg: nd(b), tiltDeg: SOLAR_PARK_TILT, parked: true };
      return { yawDeg: nd(A + b), tiltDeg: Math.max(SOLAR_TILT_MIN, Math.min(SOLAR_TILT_MAX, 90 - E)), parked: false };
    };
    let sameUndef = true, sameOpts = true, n = 0;
    for (const az of [0, 47, 120, 200, 355, NaN]) {
      for (const el of [-20, 0, 5, 35, 88, NaN]) {
        for (const base of [0, 30, -75, NaN]) {
          const want = legacyAim(az, el, base);
          const gotU = solarAim(az, el, base);                          // no 4th arg
          const gotO = solarAim(az, el, base, solarTrackOpts({}, 0));   // opts resolves to undefined
          n++;
          const eq = (a, b) => a.yawDeg === b.yawDeg && a.tiltDeg === b.tiltDeg && a.parked === b.parked;
          if (!eq(gotU, want)) sameUndef = false;
          if (!eq(gotO, want)) sameOpts = false;
        }
      }
    }
    assert(`no-opts solarAim is bit-identical to the pre-switch golden (${n} cases)`, sameUndef);
    assert('both-axes-tracking opts take the same identical path', sameOpts);

    // (b) solarTrackOpts: the ONE compass→plan mapping every call site shares.
    assert('solarTrackOpts({}) → undefined (the fast path)', solarTrackOpts({}, 0) === undefined);
    assert('solarTrackOpts(both true) → undefined',
      solarTrackOpts({ trackAzimuth: true, trackTilt: true }, 0) === undefined);
    assert('solarTrackOpts(azimuth off) → opts', !!solarTrackOpts({ trackAzimuth: false }, 0));
    assert('solarTrackOpts(tilt off) → opts', !!solarTrackOpts({ trackTilt: false }, 0));
    {
      const o = solarTrackOpts({ trackAzimuth: false }, 0);
      assert('default frozen azimuth is due SOUTH (compass 180)', near(o.fixedAzimuthPlanDeg, 180, 1e-9)
        || near(o.fixedAzimuthPlanDeg, -180, 1e-9), `${o.fixedAzimuthPlanDeg}`);
      assert('default frozen tilt is 35°', o.fixedTiltDeg === 35);
      assert('the other axis stays tracking', o.trackTilt === true && o.trackAzimuth === false);
      // The stored bearing is COMPASS, so it maps through the SAME θ the sun does.
      const th = 30 * Math.PI / 180;
      const oT = solarTrackOpts({ trackAzimuth: false, fixedAzimuthDeg: 180 }, th);
      assert('frozen azimuth maps through geo θ exactly like the sun',
        near(oT.fixedAzimuthPlanDeg, compassToPlanDeg(180, th), 1e-9)
        && near(oT.fixedAzimuthPlanDeg, 150, 1e-9), `${oT.fixedAzimuthPlanDeg}`);
      assert('garbage frozen values fall back to the shared defaults', (() => {
        const g = solarTrackOpts({ trackTilt: false, fixedTiltDeg: NaN, fixedAzimuthDeg: 'x' }, 0);
        return g.fixedTiltDeg === 35 && near(Math.abs(g.fixedAzimuthPlanDeg), 180, 1e-9);
      })());
      // `null` means UNSET, never 0 — Number(null) === 0 would pitch a frozen
      // array flat at the mechanical minimum and swing a frozen bearing north.
      assert('null frozen values fall back to the defaults, not 0', (() => {
        const g = solarTrackOpts({ trackTilt: false, trackAzimuth: false,
          fixedTiltDeg: null, fixedAzimuthDeg: null }, 0);
        const a = solarAim(90, 30, 0, g);
        return g.fixedTiltDeg === SOLAR_FIXED_TILT_DEG && a.tiltDeg === SOLAR_FIXED_TILT_DEG
          && near(Math.abs(a.yawDeg), 180, 1e-9);
      })());
    }

    // (c) frozen AZIMUTH: yaw ignores the sun, tilt still tracks.
    {
      const o = { trackAzimuth: false, trackTilt: true, fixedAzimuthPlanDeg: 150, fixedTiltDeg: 35 };
      const a = solarAim(90, 30, 0, o);
      assert('frozen azimuth holds its fixed plan bearing', near(a.yawDeg, 150, 1e-9), `${a.yawDeg}`);
      assert('frozen azimuth still tracks TILT', near(a.tiltDeg, 60, 1e-9), `${a.tiltDeg}`);
      assert('frozen azimuth is not parked with the sun up', a.parked === false);
      assert('base rotation composes onto a frozen azimuth', near(solarAim(90, 30, 20, o).yawDeg, 170, 1e-9));
      const night = solarAim(270, -8, 0, o);
      assert('at night a frozen azimuth HOLDS (does not go home)', near(night.yawDeg, 150, 1e-9), `${night.yawDeg}`);
      assert('at night the live tilt axis stows', night.tiltDeg === SOLAR_PARK_TILT);
      assert('one live axis + sun down → parked', night.parked === true);
    }

    // (d) frozen TILT: pitch ignores the sun, azimuth still tracks.
    {
      const o = { trackAzimuth: true, trackTilt: false, fixedAzimuthPlanDeg: 150, fixedTiltDeg: 35 };
      const a = solarAim(90, 30, 0, o);
      assert('frozen tilt holds its fixed pitch', a.tiltDeg === 35);
      assert('frozen tilt still tracks AZIMUTH', near(a.yawDeg, 90, 1e-9), `${a.yawDeg}`);
      assert('a frozen tilt is clamped to the mechanical range (90 → MAX)',
        solarAim(90, 30, 0, { ...o, fixedTiltDeg: 90 }).tiltDeg === SOLAR_TILT_MAX);
      assert('a frozen tilt is clamped to the mechanical range (0 → MIN)',
        solarAim(90, 30, 0, { ...o, fixedTiltDeg: 0 }).tiltDeg === SOLAR_TILT_MIN);
      const night = solarAim(270, -8, 33, o);
      assert('at night a frozen tilt HOLDS (never stows flat)', night.tiltDeg === 35);
      assert('at night the live azimuth axis goes home to the base', near(night.yawDeg, 33, 1e-9), `${night.yawDeg}`);
      assert('one live axis (tilt frozen) + sun down → parked', night.parked === true);
    }

    // (e) BOTH frozen = an ordinary fixed array: same pose day and night, NEVER parks.
    {
      const o = { trackAzimuth: false, trackTilt: false, fixedAzimuthPlanDeg: 150, fixedTiltDeg: 40 };
      const day = solarAim(90, 30, 0, o);
      const night = solarAim(270, -10, 0, o);
      const nul = solarAim(null, null, 0, o);
      assert('a fixed array holds its authored pose in daylight',
        near(day.yawDeg, 150, 1e-9) && day.tiltDeg === 40, `${day.yawDeg}/${day.tiltDeg}`);
      assert('a fixed array holds the SAME pose at night',
        night.yawDeg === day.yawDeg && night.tiltDeg === day.tiltDeg, `${night.yawDeg}/${night.tiltDeg}`);
      assert('PARK RULE: a fully fixed array NEVER parks (sun down)', night.parked === false);
      assert('PARK RULE: a fully fixed array never parks (unresolved sun)',
        nul.parked === false && near(nul.yawDeg, 150, 1e-9) && nul.tiltDeg === 40);
      assert('a fixed array is insensitive to the sun sweeping the whole sky', (() => {
        for (let az = 0; az < 360; az += 17) for (const el of [-30, 5, 45, 89]) {
          const a = solarAim(az, el, 0, o);
          if (a.yawDeg !== day.yawDeg || a.tiltDeg !== day.tiltDeg || a.parked !== false) return false;
        }
        return true;
      })());
    }

    // (f) degenerate opts never produce a NaN pose.
    {
      const a = solarAim(90, 30, 25, { trackAzimuth: false, fixedAzimuthPlanDeg: NaN });
      assert('non-finite frozen azimuth falls back to the base rotation alone',
        near(a.yawDeg, 25, 1e-9) && isFinite(a.tiltDeg), `${a.yawDeg}`);
      const b = solarAim(90, 30, 0, { trackTilt: false, fixedTiltDeg: null });
      assert('non-finite frozen tilt falls back to the 35° default', b.tiltDeg === 35);
    }
  }

  assert('solarRotation defaults to 0', solarRotation({}) === 0);
  assert('solarRotation reads the field', solarRotation({ rotation: 42 }) === 42);
  assert('solarRotation rejects garbage', solarRotation({ rotation: NaN }) === 0);

  // ── (4) power readouts (signed: negative = grid draw) ────────────────────
  assert('solarPowerValue(null) → null', solarPowerValue(null) === null);
  assert('solarPowerValue parses watts', solarPowerValue(stOf('sensor.pv', '812.5')) === 812.5);
  assert('solarPowerValue keeps the sign', solarPowerValue(stOf('sensor.pv', '-300')) === -300);
  assert('solarPowerValue(unavailable) → null', solarPowerValue(stOf('sensor.pv', 'unavailable')) === null);
  assert('positive watts read GREEN', solarPowerColor(900) === SOLAR_GEN_COLOR);
  assert('negative watts read AMBER (grid draw)', solarPowerColor(-40) === SOLAR_DRAW_COLOR);
  assert('null watts fall back to the generating color', solarPowerColor(null) === SOLAR_GEN_COLOR);
  assert('W text under 1 kW', solarPowerText(812.4) === '812 W');
  assert('kW text at/over 1 kW', solarPowerText(3450) === '3.5 kW');
  assert('negative W text keeps the sign', solarPowerText(-450) === '-450 W');
  assert('null W text is empty', solarPowerText(null) === '');

  // ── (5) storage backfill ─────────────────────────────────────────────────
  {
    const f = store.repairFloor({ id: 'z', name: 'Z', w: 4000, d: 4000 });
    assert('repairFloor backfills solarPanels []', Array.isArray(f.solarPanels) && f.solarPanels.length === 0);
  }

  // ── (6) renderer: pedestal + aim + UV tint + power glow + grade + layer ──
  const r = new mod.ThreeDRenderer(document.getElementById('c'));
  await r.load();
  const scene3d = { preset: 'day', floorColor: '#8a7860', floorTex: 'none', wallColor: '#cfd2d6' };
  const mkFloor = (extra) => Object.assign({
    id: 'f1', name: 'T', w: 8000, d: 6000,
    walls: [], furniture: [], lights: [], switches: [], sensors: [], motionSensors: [], envSensors: [],
    doors: [], windows: [], bg: null, model3d: null, look3d: null, rooms: [],
  }, extra || {});
  const countGeo = (g, ctor) => {
    let n = 0;
    g.traverse(o => { if (o.isMesh && o.geometry && o.geometry.type === ctor && !o.userData.outline) n++; });
    return n;
  };
  const headOf = (idx = 0) => {
    const grp = r._solarGroup.children[idx];
    let h = null; grp.traverse(o => { if (o.userData && o.userData.solarHead) h = o; });
    return { grp, head: h };
  };
  // Panel face normal in WORLD space = the head's local +Y basis vector (column 2
  // of its world matrix) — the group carries no rotation or scale of its own.
  const normalOf = (head) => {
    head.updateWorldMatrix(true, false);
    const e = head.matrixWorld.elements;
    return { x: e[4], y: e[5], z: e[6] };
  };

  const spA = { id: 'sp1', x: 2000, y: 3000, label: 'Array A' };
  r.updateFloor(mkFloor({ solarPanels: [spA] }), scene3d);
  r.updateSolarPanels([spA], () => null, 120, 35, null);
  assert('one solar rig built', r._solarGroup.children.length === 1, `n=${r._solarGroup.children.length}`);
  {
    const { grp, head } = headOf();
    assert('pedestal = ≥2 cylinders (footing pad + post)', countGeo(grp, 'CylinderGeometry') >= 2);
    assert('array has a head group tagged solarHead', !!head);
    assert('head carries the resolved aim as a test hook',
      head && near(head.userData.tiltDeg, 55, 1e-9) && near(head.userData.yawDeg, 120, 1e-9),
      head && `${head.userData.yawDeg}/${head.userData.tiltDeg}`);
    assert('array builds PV boxes + a flat face plane',
      countGeo(grp, 'BoxGeometry') >= 5 && countGeo(grp, 'PlaneGeometry') >= 1);
    // WORLD-geometry check: the face normal's elevation IS the sun's elevation,
    // and its horizontal direction is the plan azimuth mapped into scene coords
    // (_w mirrors X, so plan (sin az, cos az) → scene (−sin az, 0, cos az)).
    const n = normalOf(head);
    const elev = Math.asin(Math.max(-1, Math.min(1, n.y))) * 180 / Math.PI;
    assert('face normal elevation == sun elevation (35°)', near(elev, 35, 1e-4), `elev=${elev.toFixed(4)}`);
    const az = 120 * Math.PI / 180;
    const hx = -Math.sin(az), hz = Math.cos(az);
    const hlen = Math.hypot(n.x, n.z);
    assert('face normal aims at the sun azimuth in scene coords',
      near(n.x / hlen, hx, 1e-4) && near(n.z / hlen, hz, 1e-4),
      `n=(${n.x.toFixed(3)},${n.z.toFixed(3)}) want=(${hx.toFixed(3)},${hz.toFixed(3)})`);
    assert('array sits on the slab with no terrain', near(grp.position.y, 0, 1e-6), `y=${grp.position.y}`);
  }

  // Base rotation composes in the built mesh too.
  {
    const spR = { id: 'spR', x: 2000, y: 3000, rotation: 40 };
    r.updateSolarPanels([spR], () => null, 120, 35, null);
    const { head } = headOf();
    assert('built head yaw includes the base rotation', near(head.userData.yawDeg, 160, 1e-9), `${head.userData.yawDeg}`);
    const n = normalOf(head);
    const az = 160 * Math.PI / 180;
    const hlen = Math.hypot(n.x, n.z);
    assert('rotated array normal follows the composed yaw',
      near(n.x / hlen, -Math.sin(az), 1e-4) && near(n.z / hlen, Math.cos(az), 1e-4));
  }

  // Night: parked flat at the base yaw.
  {
    const spN = { id: 'spN', x: 2000, y: 3000, rotation: 25 };
    r.updateSolarPanels([spN], () => null, 270, -6, null);
    const { head } = headOf();
    assert('night build is parked', head.userData.parked === true);
    assert('night tilt = SOLAR_PARK_TILT', head.userData.tiltDeg === SOLAR_PARK_TILT);
    assert('night yaw = the base rotation', near(head.userData.yawDeg, 25, 1e-9));
    const n = normalOf(head);
    const elev = Math.asin(Math.max(-1, Math.min(1, n.y))) * 180 / Math.PI;
    assert('parked array is near-horizontal (normal near straight up)',
      near(elev, 90 - SOLAR_PARK_TILT, 1e-4), `elev=${elev.toFixed(3)}`);
  }

  // UV band tint on the frame rails (same WHO ladder as the weather chip).
  // The BUILT material color is intentionally not the authored hex (_mat pushes
  // saturation through _simsColor), so the frame rails carry the authored band
  // color as a userData test hook — same idiom as the projector beam's userData.dir.
  const frameRails = (grp) => {
    const out = [];
    grp.traverse(o => {
      if (o.isMesh && !o.userData.outline && o.userData.solarUvColor !== undefined) out.push(o);
    });
    return out;
  };
  const emissiveRails = (grp) => frameRails(grp).filter(o =>
    o.material && o.material.emissive && o.material.emissive.getHex() !== 0 && o.material.emissiveIntensity > 0);
  {
    const sp = { id: 'spUV', x: 2000, y: 3000 };
    r.updateSolarPanels([sp], () => null, 120, 35, null);
    const rails = frameRails(r._solarGroup.children[0]);
    assert('array builds 4 frame rails', rails.length === 4, `n=${rails.length}`);
    assert('no live UV → neutral frame (no band color)', rails.every(o => o.userData.solarUvColor === null));
    assert('no live UV → no emissive frame accent', emissiveRails(r._solarGroup.children[0]).length === 0);

    r.updateSolarPanels([sp], () => null, 120, 35, 9);   // UV 9 = "very high" = red
    const hi = frameRails(r._solarGroup.children[0]);
    assert('UV 9 lights an emissive frame accent', emissiveRails(r._solarGroup.children[0]).length === 4);
    const hex = hi[0].userData.solarUvColor;
    assert('UV 9 frame is the WHO "very high" band red', hex === '#e53935', hex);

    r.updateSolarPanels([sp], () => null, 120, 35, 1);   // UV 1 = "low" = green
    const loHex = frameRails(r._solarGroup.children[0])[0].userData.solarUvColor;
    assert('UV 1 frame is the WHO "low" band green', loHex === '#7cb342', loHex);
    assert('a UV band change actually re-tints the frame', loHex !== hex);
    // Same WHO ladder as the weather chip's UV row — spot-check the boundaries.
    r.updateSolarPanels([sp], () => null, 120, 35, 5);
    assert('UV 5 is still the moderate band', frameRails(r._solarGroup.children[0])[0].userData.solarUvColor === '#fdd835');
    r.updateSolarPanels([sp], () => null, 120, 35, 12);
    assert('UV 12 is the extreme band violet', frameRails(r._solarGroup.children[0])[0].userData.solarUvColor === '#8e24aa');
  }

  // Power glow: emissive bead scaled by |watts|, amber on a NEGATIVE reading.
  const beadOf = (grp) => {
    let bead = null;
    grp.traverse(o => { if (o.isMesh && !o.userData.outline && o.userData.solarBead) bead = o; });
    return bead;
  };
  {
    const sp = { id: 'spP', x: 2000, y: 3000, powerEntity: 'sensor.pv' };
    const states = {};
    const prov = id => states[id] || null;
    r.updateSolarPanels([sp], prov, 120, 35, null);
    assert('unbound / no reading → bead is dark',
      beadOf(r._solarGroup.children[0]).material.emissiveIntensity === 0
      && beadOf(r._solarGroup.children[0]).userData.solarPowerColor === null);

    states['sensor.pv'] = stOf('sensor.pv', '900');
    r.updateSolarPanels([sp], prov, 120, 35, null);
    const genBead = beadOf(r._solarGroup.children[0]);
    assert('generating → bead glows', genBead.material.emissiveIntensity > 0, `${genBead.material.emissiveIntensity}`);
    assert('generating bead is green', genBead.userData.solarPowerColor === SOLAR_GEN_COLOR, genBead.userData.solarPowerColor);
    const gen900 = genBead.material.emissiveIntensity;

    states['sensor.pv'] = stOf('sensor.pv', '80');
    r.updateSolarPanels([sp], prov, 120, 35, null);
    const gen80 = beadOf(r._solarGroup.children[0]).material.emissiveIntensity;
    assert('glow scales with power (900 W brighter than 80 W)', gen900 > gen80, `${gen900} vs ${gen80}`);

    states['sensor.pv'] = stOf('sensor.pv', '-450');
    r.updateSolarPanels([sp], prov, 120, 35, null);
    const drawBead = beadOf(r._solarGroup.children[0]);
    assert('NEGATIVE reading still glows', drawBead.material.emissiveIntensity > 0);
    assert('negative reading reads AMBER, not green',
      drawBead.userData.solarPowerColor === SOLAR_DRAW_COLOR, drawBead.userData.solarPowerColor);
  }

  // Grade following: a raised terrace under the panel lifts the whole assembly.
  {
    const sp = { id: 'spT', x: 2000, y: 3000 };
    const terrace = {
      id: 'gt', kind: 'concrete', elevationMm: 800,
      points: [{ x: 1000, y: 2000 }, { x: 3200, y: 2000 }, { x: 3200, y: 4200 }, { x: 1000, y: 4200 }],
    };
    r.updateFloor(mkFloor({ solarPanels: [sp], groundAreas: [terrace] }), scene3d);
    r.updateSolarPanels([sp], () => null, 120, 35, null);
    assert('panel on a terrace rides its elevation', near(r._solarGroup.children[0].position.y, 800, 1e-6),
      `y=${r._solarGroup.children[0].position.y}`);
    // A panel OUTSIDE the terrace stays on the slab.
    const off = { id: 'spOff', x: 6500, y: 1000 };
    r.updateSolarPanels([sp, off], () => null, 120, 35, null);
    assert('panel off the terrace stays at grade', near(r._solarGroup.children[1].position.y, 0, 1e-6),
      `y=${r._solarGroup.children[1].position.y}`);
    r.updateFloor(mkFloor({ solarPanels: [sp] }), scene3d);   // reset terrain
  }

  // Hidden panels build nothing; the group rides the `sensors` layer.
  {
    r.updateSolarPanels([{ id: 'h1', x: 2000, y: 3000, hidden: true }], () => null, 120, 35, null);
    assert('hidden panel builds no rig', r._solarGroup.children.length === 0, `n=${r._solarGroup.children.length}`);
    r.updateSolarPanels([{ id: 'v1', x: 2000, y: 3000 }], () => null, 120, 35, null);
    r.setLayerVisibility({ sensors: false });
    assert('sensors layer OFF hides the solar group', r._solarGroup.visible === false);
    r.setLayerVisibility({ sensors: true });
    assert('sensors layer ON shows the solar group', r._solarGroup.visible === true);
    r.setLayerVisibility({});
    assert('absent sensors flag = layer on', r._solarGroup.visible === true);
  }

  // Determinism: no Math.random in the builder — two identical builds match.
  {
    const sp = { id: 'spD', x: 2500, y: 2500, rotation: 15, powerEntity: 'sensor.pv' };
    const states = { 'sensor.pv': stOf('sensor.pv', '640') };
    const sig = () => {
      const out = [];
      r._solarGroup.traverse(o => {
        if (o.isMesh) out.push(`${o.geometry.type}@${o.position.x.toFixed(3)},${o.position.y.toFixed(3)},${o.position.z.toFixed(3)}`);
      });
      return out.join('|');
    };
    r.updateSolarPanels([sp], id => states[id] || null, 120, 35, 6);
    const s1 = sig();
    r.updateSolarPanels([sp], id => states[id] || null, 120, 35, 6);
    const s2 = sig();
    assert('rebuild is byte-identical (no Math.random in the builder)', s1 === s2 && s1.length > 0, `len=${s1.length}`);
  }

  // ── (6b) tracking switches + the sun-position beam in the BUILT mesh ─────
  const rayOf = (grp) => {
    let ray = null;
    grp.traverse(o => { if (o.userData && o.userData.solarSunRay) ray = o; });
    return ray;
  };
  {
    // Frozen AZIMUTH: the head yaws to the fixed COMPASS bearing (mapped
    // through θ), not to the sun — while the tilt keeps tracking.
    const spFa = { id: 'spFa', x: 2000, y: 3000, trackAzimuth: false, fixedAzimuthDeg: 180 };
    r.updateSolarPanels([spFa], () => null, 120, 35, null, 0);
    {
      const { head } = headOf();
      assert('frozen azimuth builds at the fixed bearing, not the sun',
        near(head.userData.yawDeg, 180, 1e-9), `${head.userData.yawDeg}`);
      assert('frozen azimuth still builds the TRACKED tilt', near(head.userData.tiltDeg, 55, 1e-9));
      const n = normalOf(head);
      const az = 180 * Math.PI / 180, hlen = Math.hypot(n.x, n.z);
      assert('frozen-azimuth face normal points at the fixed bearing in WORLD space',
        near(n.x / hlen, -Math.sin(az), 1e-4) && near(n.z / hlen, Math.cos(az), 1e-4),
        `n=(${n.x.toFixed(3)},${n.z.toFixed(3)})`);
    }
    // θ reaches the fixed bearing: compass 180 under θ=+30° is plan 150.
    r.updateSolarPanels([spFa], () => null, 120, 35, null, 30 * Math.PI / 180);
    assert('updateSolarPanels θ param maps the frozen COMPASS bearing',
      near(headOf().head.userData.yawDeg, 150, 1e-9), `${headOf().head.userData.yawDeg}`);
    // Stale caller (no θ arg) still resolves — defaults to 0.
    r.updateSolarPanels([spFa], () => null, 120, 35, null);
    assert('θ defaults to 0 for a stale caller', near(headOf().head.userData.yawDeg, 180, 1e-9));

    // Frozen TILT: pitch is the authored value, azimuth keeps tracking.
    const spFt = { id: 'spFt', x: 2000, y: 3000, trackTilt: false, fixedTiltDeg: 45 };
    r.updateSolarPanels([spFt], () => null, 120, 35, null, 0);
    {
      const { head } = headOf();
      assert('frozen tilt builds at the fixed pitch', head.userData.tiltDeg === 45);
      assert('frozen tilt still builds the TRACKED yaw', near(head.userData.yawDeg, 120, 1e-9));
      const n = normalOf(head);
      const elev = Math.asin(Math.max(-1, Math.min(1, n.y))) * 180 / Math.PI;
      assert('frozen-tilt face normal sits at 90 − fixedTilt', near(elev, 45, 1e-4), `elev=${elev.toFixed(4)}`);
    }

    // A fully FIXED array holds its pose at night and never takes the parked look.
    const spFix = { id: 'spFix', x: 2000, y: 3000, trackAzimuth: false, trackTilt: false,
                    fixedAzimuthDeg: 180, fixedTiltDeg: 40 };
    r.updateSolarPanels([spFix], () => null, 120, 35, null, 0);
    const fixDay = { ...headOf().head.userData };
    r.updateSolarPanels([spFix], () => null, 270, -12, null, 0);
    {
      const { head } = headOf();
      assert('a fixed array does NOT park at night in 3D', head.userData.parked === false);
      assert('a fixed array builds the identical pose day and night',
        head.userData.yawDeg === fixDay.yawDeg && head.userData.tiltDeg === fixDay.tiltDeg,
        `${head.userData.yawDeg}/${head.userData.tiltDeg}`);
    }

    // Sun-position beam (`showSun`): aimed at the TRUE sun, independent of the
    // panel's own pose — that gap is the whole diagnostic.
    r.updateSolarPanels([{ id: 'spS0', x: 2000, y: 3000 }], () => null, 120, 35, null, 0);
    assert('no showSun → no sun beam (negative control)', rayOf(r._solarGroup.children[0]) === null);
    const spSun = { id: 'spS', x: 2000, y: 3000, showSun: true,
                    trackAzimuth: false, trackTilt: false, fixedAzimuthDeg: 0, fixedTiltDeg: 20 };
    r.updateSolarPanels([spSun], () => null, 120, 35, null, 0);
    {
      const grp = r._solarGroup.children[0];
      const ray = rayOf(grp);
      assert('showSun builds a sun beam', !!ray);
      assert('beam carries the authored sun as a test hook',
        ray && near(ray.userData.solarSunRay.azDeg, 120, 1e-9)
        && near(ray.userData.solarSunRay.elevDeg, 35, 1e-9));
      // The beam's WORLD +Y basis IS its direction (same read as the face normal).
      const d = normalOf(ray);
      const azR = 120 * Math.PI / 180, elR = 35 * Math.PI / 180;
      const want = { x: -Math.sin(azR) * Math.cos(elR), y: Math.sin(elR), z: Math.cos(azR) * Math.cos(elR) };
      const dot = d.x * want.x + d.y * want.y + d.z * want.z;
      assert('sun beam aims at the true sun direction (dot ≈ 1)', near(dot, 1, 1e-4), `dot=${dot.toFixed(6)}`);
      // The panel is frozen facing plan-north at 20° tilt — the beam must NOT
      // follow it (this is exactly what makes a mis-aim visible).
      const n = normalOf(headOf().head);
      const faceDot = n.x * d.x + n.y * d.y + n.z * d.z;
      assert('sun beam is independent of the frozen panel pose', faceDot < 0.9, `faceDot=${faceDot.toFixed(4)}`);
      assert('beam carries a bead at its far end',
        (() => { let b = null; grp.traverse(o => { if (o.userData && o.userData.solarSunBead) b = o; }); return !!b; })());
      // Flat unlit indicator (documented _mat() exemption) + no outline shells.
      let flat = true, skipped = true;
      ray.traverse(o => {
        if (!o.isMesh) return;
        if (o.material && o.material.type !== 'MeshBasicMaterial') flat = false;
        if (!o.userData.outlineSkip) skipped = false;
      });
      assert('sun beam is flat MeshBasicMaterial (documented _mat exemption)', flat);
      assert('sun beam parts are outline-skipped', skipped);
    }
    // A fully-tracking panel with showSun: the beam and the face agree.
    r.updateSolarPanels([{ id: 'spS2', x: 2000, y: 3000, showSun: true }], () => null, 120, 35, null, 0);
    {
      const d = normalOf(rayOf(r._solarGroup.children[0]));
      const n = normalOf(headOf().head);
      const dot = d.x * n.x + d.y * n.y + d.z * n.z;
      assert('with both axes tracking the beam and the face coincide', near(dot, 1, 1e-4), `dot=${dot.toFixed(6)}`);
    }
    // Sun down → nothing to point at.
    r.updateSolarPanels([{ id: 'spS3', x: 2000, y: 3000, showSun: true }], () => null, 270, -6, null, 0);
    assert('sun below the horizon builds no beam', rayOf(r._solarGroup.children[0]) === null);
  }

  // ── (7) real Planner: CRUD, delete, translate/rotate, LIVE-path power ────
  class FakeHa {
    constructor() { this.states = {}; this._s = []; this._c = []; }
    connect() { for (const c of this._c) c('connected'); for (const s of this._s) s(this.states, undefined); }
    onState(f) { this._s.push(f); } onConn(f) { this._c.push(f); }
    callService() { return Promise.resolve(); }
    async getHistory() { return {}; } async getWeatherForecasts() { return null; }
    async getDevices() { return []; } async getEntityRegistry() { return []; }
    async updateEntityRegistry() { return true; }
    async getUserData() { return null; } async setUserData() { return true; }
    async refreshStates() {}
  }
  localStorage.removeItem('diorama:store:v1'); localStorage.removeItem('diorama:configs');
  const p = new Planner();
  p.connectWith(new FakeHa());
  const sleep = ms => new Promise(res => setTimeout(res, ms));
  for (let i = 0; i < 300 && !p.floor(); i++) await sleep(4);
  assert('defaultFloor backfills solarPanels []', Array.isArray(p.floor().solarPanels));

  p.uiMode = 'edit';
  const f0 = p.floor();
  f0.solarPanels = [{ id: 'sp1', x: 1000, y: 2000, rotation: 30, powerEntity: 'sensor.pv_now' }];

  // powerEntity is LIVE-path (chatty) — it must NOT be config-path.
  assert('solar powerEntity is NOT config-path (LIVE)', p._isSlowEntity('sensor.pv_now') === false);
  assert('an unrelated entity is not config-path either', p._isSlowEntity('sensor.random_thing') === false);

  // translateFloorContent moves the pedestal.
  p.translateFloorContent(300, -150);
  assert('translateFloorContent moves solar panels',
    p.floor().solarPanels[0].x === 1300 && p.floor().solarPanels[0].y === 1850,
    `${p.floor().solarPanels[0].x},${p.floor().solarPanels[0].y}`);

  // rotateFloorContent rotates the point AND bumps the base yaw by φ.
  {
    const f = p.floor();
    f.solarPanels[0].x = f.w / 2 + 1000; f.solarPanels[0].y = f.d / 2; f.solarPanels[0].rotation = 30;
    p.rotateFloorContent(90);
    const sp = p.floor().solarPanels[0];
    assert('rotateFloorContent bumps the base yaw by φ', near(sp.rotation, 120, 1e-9), `${sp.rotation}`);
    // Screen-CW 90° about the floor centre: (+1000, 0) → (0, −1000).
    assert('rotateFloorContent rotates the position about the floor centre',
      near(sp.x - f.w / 2, 0, 1e-6) && near(sp.y - f.d / 2, -1000, 1e-6),
      `${(sp.x - f.w / 2).toFixed(3)},${(sp.y - f.d / 2).toFixed(3)}`);
  }

  // deleteSelection: locked refuses, unlocked removes + clears the selection.
  {
    p.floor().solarPanels[0].locked = true;
    p.activeSolarId = 'sp1';
    assert('deleteSelection refuses a LOCKED solar panel',
      p.deleteSelection() === false && (p.floor().solarPanels || []).length === 1);
    p.floor().solarPanels[0].locked = false;
    p.activeSolarId = 'sp1';
    assert('deleteSelection removes the active solar panel',
      p.deleteSelection() === true && (p.floor().solarPanels || []).length === 0);
    assert('deleteSelection clears activeSolarId', p.activeSolarId === null);
  }

  // setActiveSolar toggles like every other fixture selector.
  {
    p.floor().solarPanels = [{ id: 'spX', x: 1000, y: 1000 }];
    p.setActiveSolar('spX');
    assert('setActiveSolar selects', p.activeSolarId === 'spX');
    p.setActiveSolar('spX');
    assert('setActiveSolar toggles off on a repeat', p.activeSolarId === null);
  }

  // Alt+click identify resolves the fixture (kind → collection + label + anchor).
  {
    p.floor().solarPanels = [{ id: 'spI', x: 1500, y: 2500, label: 'Roof array', locked: true }];
    const okId = p.identifyItem('solar', 'spI');
    assert('identifyItem resolves a solar panel', okId === true && p.identifyFx && p.identifyFx.kind === 'solar');
    assert('identify label + lock + anchor are reported',
      p.identifyFx.label === 'Roof array' && p.identifyFx.locked === true
      && p.identifyFx.x === 1500 && p.identifyFx.y === 2500);
    assert('identify selects the panel', p.activeSolarId === 'spI');
    assert('identifyItem on a missing id fails soft', p.identifyItem('solar', 'nope') === false);
  }

  // ── (8) 2D: no-throw + tilt foreshortening ───────────────────────────────
  // Drop the identify latch from section 7 — its callout plate is painted LAST,
  // over everything, and would sit across the panel in the pixel measurements.
  p.identifyFx = null; p.drag = null; p.activeSolarId = null;
  const view = { ox: 60, oy: 400, scale: 0.05 };
  const drawTo = (elevDeg) => {
    p.hass.states['sun.sun'] = stOf('sun.sun', 'above_horizon', { azimuth: 0, elevation: elevDeg });
    const cv = document.createElement('canvas'); cv.width = 640; cv.height = 480;
    const ctx = cv.getContext('2d');
    cr.drawAll(ctx, p, view, null);
    return ctx.getImageData(0, 0, cv.width, cv.height);
  };
  // PV fill is rgba(24,52,84,0.95) over the floor — measure its painted bbox.
  const pvBox = (img) => {
    let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9, n = 0;
    for (let y = 0; y < img.height; y++) {
      for (let x = 0; x < img.width; x++) {
        const i = (y * img.width + x) * 4;
        const R = img.data[i], G = img.data[i + 1], B = img.data[i + 2];
        if (Math.abs(R - 24) < 12 && Math.abs(G - 51) < 14 && Math.abs(B - 81) < 16) {
          n++;
          if (x < minX) minX = x; if (x > maxX) maxX = x;
          if (y < minY) minY = y; if (y > maxY) maxY = y;
        }
      }
    }
    return { n, w: maxX - minX + 1, h: maxY - minY + 1, minX, maxX, minY, maxY };
  };
  {
    p.floor().solarPanels = [{ id: 'd1', x: 2000, y: 3000, label: 'Draw' }];
    let threw = null;
    let hi = null, lo = null, night = null;
    try {
      hi = pvBox(drawTo(80));     // high sun → tilt clamps to 10° → nearly full depth
      lo = pvBox(drawTo(20));     // low sun  → tilt 70° → strongly foreshortened
      night = pvBox(drawTo(-10)); // parked
    } catch (e) { threw = e; }
    assert('2D drawAll (with a solar panel) does not throw', threw === null, threw && threw.message);
    assert('PV face is painted', hi && hi.n > 50, hi && `n=${hi.n}`);
    // Sun azimuth 0 (θ=0) → plan az 0 → the array is axis-aligned, so width is
    // the panel width and height is panelH·cos(tilt) — pure foreshortening.
    assert('foreshortening: a low sun (steep tilt) shrinks the plan DEPTH',
      hi && lo && lo.h < hi.h * 0.6, hi && lo && `hi=${hi.h} lo=${lo.h}`);
    assert('foreshortening leaves the panel WIDTH unchanged',
      hi && lo && Math.abs(hi.w - lo.w) <= 2, hi && lo && `hi=${hi.w} lo=${lo.w}`);
    // Ratio matches cos(tilt) within a couple of px of rasterization slop.
    const want = Math.cos(70 * Math.PI / 180) / Math.cos(10 * Math.PI / 180);
    const got = lo && hi ? lo.h / hi.h : 0;
    assert('depth ratio ≈ cos(tiltLow)/cos(tiltHigh)', Math.abs(got - want) < 0.12,
      `got=${got.toFixed(3)} want=${want.toFixed(3)}`);
    // The parked look: no sun arrow (there is nothing to aim at) + a dimmer face.
    const arrowPx = (img) => {
      let n = 0;
      for (let i = 0; i < img.data.length; i += 4) {
        if (img.data[i] > 150 && img.data[i + 1] > 110 && img.data[i + 2] < 120) n++;
      }
      return n;
    };
    const trackArrow = arrowPx(drawTo(80));
    const parkArrow = arrowPx(drawTo(-10));
    assert('a tracking panel draws the sun arrow', trackArrow > 4, `n=${trackArrow}`);
    assert('a parked panel draws NO sun arrow', parkArrow === 0, `n=${parkArrow}`);
    assert('the parked face is dimmed (different fill than tracking)', night && night.n === 0,
      night && `n=${night.n}`);
    // ARROW DIRECTION pin (2026-08-07 — a user aim report exposed that only the
    // arrow's PRESENCE was pinned; direction was the one unverified surface in
    // the 2D/3D aim parity story). Sun az 117.67 (the incident's numbers, θ=0):
    // the amber arrow's pixel centroid must sit 117.67° screen-CW from up
    // (screen-up = plan +Y = north; canvas y is down, hence atan2(dx, −dy)).
    {
      p.hass.states['sun.sun'] = stOf('sun.sun', 'above_horizon', { azimuth: 117.67, elevation: 49.33 });
      const cv = document.createElement('canvas'); cv.width = 640; cv.height = 480;
      const ctx = cv.getContext('2d');
      cr.drawAll(ctx, p, view, null);
      const img = ctx.getImageData(0, 0, 640, 480);
      const cx = view.ox + 2000 * view.scale, cy = view.oy - 3000 * view.scale;
      let sx = 0, sy = 0, an = 0;
      for (let y = 0; y < 480; y++) for (let x = 0; x < 640; x++) {
        const i = (y * 640 + x) * 4;
        if (img.data[i] > 200 && img.data[i + 1] > 160 && img.data[i + 1] < 230 && img.data[i + 2] < 130) {
          sx += x; sy += y; an++;
        }
      }
      const azScreen = an ? ((Math.atan2(sx / an - cx, -(sy / an - cy)) * 180 / Math.PI) + 360) % 360 : NaN;
      assert('2D sun arrow POINTS at the plan azimuth (az 117.67 → 117.67° screen-CW from up)',
        an > 4 && Math.abs(azScreen - 117.67) < 6, `azScreen=${azScreen.toFixed(1)} n=${an}`);
    }
  }
  // ── (8b) 2D: the sun-position ray + a frozen-axis panel arrow ────────────
  // Amber-pixel angular probes about the pedestal. The sun ray + glyph reach far
  // past the array (halfW·2 + margin) while the panel's own aim arrow dies just
  // outside the foreshortened face — so a radius split isolates the two.
  {
    const dpr = window.devicePixelRatio || 1;
    const cx = view.ox + 2000 * view.scale, cy = view.oy - 3000 * view.scale;
    const halfW = Math.max(6, SOLAR_DEFAULTS.panelW * 0.5 * view.scale);
    const FAR = halfW * 1.6;
    // Amber-pixel scan about the pedestal. `far` splits by radius (only the sun
    // ray + glyph reach past FAR); `sector` counts by BEARING, which is how the
    // two rays are told apart when both are on screen at once.
    const amberPx = (img) => {
      const out = [];
      for (let y = 0; y < img.height; y++) for (let x = 0; x < img.width; x++) {
        const i = (y * img.width + x) * 4;
        if (!(img.data[i] > 200 && img.data[i + 1] > 160 && img.data[i + 1] < 235 && img.data[i + 2] < 140)) continue;
        out.push({ x, y, d: Math.hypot(x - cx, y - cy),
          az: ((Math.atan2(x - cx, -(y - cy)) * 180 / Math.PI) + 360) % 360 });
      }
      return out;
    };
    const amber = (img, far) => {
      const px = amberPx(img).filter(q => far ? q.d > FAR : q.d <= FAR);
      let sx = 0, sy = 0;
      for (const q of px) { sx += q.x; sy += q.y; }
      const n = px.length;
      const az = n ? ((Math.atan2(sx / n - cx, -(sy / n - cy)) * 180 / Math.PI) + 360) % 360 : NaN;
      return { n, az };
    };
    // Shortest angular distance (deg) between two bearings.
    const azDist = (a, b) => Math.abs(((a - b + 540) % 360) - 180);
    const sector = (img, targetAz, half) =>
      amberPx(img).filter(q => azDist(q.az, targetAz) <= half).length;
    const drawAt = (azDeg, elDeg) => {
      p.hass.states['sun.sun'] = stOf('sun.sun', 'above_horizon', { azimuth: azDeg, elevation: elDeg });
      const cv = document.createElement('canvas'); cv.width = 640; cv.height = 480;
      const ctx = cv.getContext('2d');
      cr.drawAll(ctx, p, view, null);
      return ctx.getImageData(0, 0, 640, 480);
    };
    p.store.layers2d = {};

    // Negative control first: no showSun → nothing amber out past the array.
    p.floor().solarPanels = [{ id: 's2a', x: 2000, y: 3000 }];
    assert('no showSun → no far-field sun ray in 2D', amber(drawAt(117.67, 49.33), true).n === 0);

    // showSun on a FULLY FIXED panel: the panel points plan-north (compass 0,
    // θ = 0 with no geo fit) while the sun sits at 117.67° — two distinct rays.
    p.floor().solarPanels = [{ id: 's2b', x: 2000, y: 3000, showSun: true,
      trackAzimuth: false, trackTilt: false, fixedAzimuthDeg: 0, fixedTiltDeg: 30 }];
    {
      const img = drawAt(117.67, 49.33);
      const far = amber(img, true);
      assert('showSun paints a far-field sun ray', far.n > 4, `n=${far.n}`);
      assert('2D sun ray POINTS at the sun azimuth (117.67° screen-CW from up)',
        Math.abs(far.az - 117.67) < 8, `az=${far.az.toFixed(1)} n=${far.n}`);
      // Both rays on screen at once, told apart by BEARING sector: the panel's
      // own aim arrow sits at the frozen 0°, the sun ray at 117.67°.
      const panelSec = sector(img, 0, 25), sunSec = sector(img, 117.67, 25);
      assert('the PANEL arrow follows the FROZEN azimuth (0°), not the sun',
        panelSec > 4, `n=${panelSec}`);
      assert('the sun ray occupies its OWN bearing sector (frozen aim is visible)',
        sunSec > 4 && sector(img, 60, 20) === 0, `sun=${sunSec} between=${sector(img, 60, 20)}`);
    }
    // The ray tracks the sun: a different bearing moves it.
    assert('2D sun ray follows a moved sun', (() => {
      const a = amber(drawAt(250, 30), true);
      return a.n > 4 && Math.abs(a.az - 250) < 8;
    })());
    // A fully fixed array keeps its FULL-strength look at night (never parked),
    // and the sun ray disappears because there is no sun to point at.
    {
      const img = drawAt(200, -10);
      assert('a fixed array still paints its face at night (never parks)', pvBox(img).n > 50, `n=${pvBox(img).n}`);
      assert('sun below the horizon paints no 2D sun ray', amber(img, true).n === 0);
    }
    p.floor().solarPanels = [];
  }

  // Hidden panels + the sensors layer gate the painter.
  {
    p.floor().solarPanels = [{ id: 'd2', x: 2000, y: 3000, hidden: true }];
    assert('hidden panel paints nothing', pvBox(drawTo(80)).n === 0);
    p.floor().solarPanels = [{ id: 'd3', x: 2000, y: 3000 }];
    p.store.layers2d = { sensors: false };
    assert('sensors layer OFF paints nothing', pvBox(drawTo(80)).n === 0);
    p.store.layers2d = {};
    assert('sensors layer back ON paints again', pvBox(drawTo(80)).n > 50);
  }

  // ── (9) DEMO weather source: the authored sun reaches the array ───────────
  // The demo source (Settings ▸ Weather) lets the user place the sun by hand.
  // weather.ts `demoSunAltAz` is the ONE override helper; every consumer
  // (three-view's WeatherFxState stamp + its solar key, canvas-render's 2D
  // draw, the sidebar readout) hands it to resolveSunPlan, which maps the
  // authored COMPASS bearing through the SAME compassToPlanDeg as sun.sun's own
  // azimuth — so 2D / 3D / sidebar can never aim differently.
  {
    const now = atHour(12);
    const sunEnt = stOf('sun.sun', 'above_horizon', { azimuth: 200, elevation: 42 });
    const demoCfg = (demo) => ({ source: 'demo', demo });
    // Pure override contract.
    const ov = demoSunAltAz(demoCfg({ sunElevationDeg: 20, sunAzimuthDeg: 305 }));
    const rd = resolveSunPlan(sunEnt, 0, now, ov);
    assert('demo sun overrides a live sun.sun', rd.source === 'demo', rd.source);
    assert('demo elevation reaches resolveSunPlan', near(rd.sun.elevDeg, 20, 1e-9), `${rd.sun.elevDeg}`);
    assert('demo azimuth maps through compassToPlanDeg',
      near(rd.sun.azDeg, compassToPlanDeg(305, 0), 1e-9), `${rd.sun.azDeg}`);
    const th = -0.9;
    assert('demo azimuth honors geo θ',
      near(resolveSunPlan(sunEnt, th, now, ov).sun.azDeg, compassToPlanDeg(305, th), 1e-9));
    assert('no override → the untouched entity ladder',
      resolveSunPlan(sunEnt, 0, now, null).source === 'entity');
    assert('a half-filled demo sun falls back to the real one',
      resolveSunPlan(sunEnt, 0, now, demoSunAltAz(demoCfg({ sunElevationDeg: 20 }))).source === 'entity');
    assert('a non-demo source never overrides',
      demoSunAltAz({ source: 'openmeteo', demo: { sunElevationDeg: 20, sunAzimuthDeg: 305 } }) === null);

    // 3D: the demo-resolved aim builds into the mesh exactly like a real sun.
    const spD = { id: 'spD', x: 2000, y: 3000 };
    r.updateSolarPanels([spD], () => null, rd.sun.azDeg, rd.sun.elevDeg, null);
    {
      const { head } = headOf();
      assert('3D array tilts to the demo sun (90 − 20)',
        head && near(head.userData.tiltDeg, 70, 1e-9), head && `${head.userData.tiltDeg}`);
      assert('3D array is not parked under a demo day sun', head && head.userData.parked === false);
      const n = normalOf(head);
      const elev = Math.asin(Math.max(-1, Math.min(1, n.y))) * 180 / Math.PI;
      assert('3D face normal elevation == the demo sun elevation', near(elev, 20, 1e-4), `elev=${elev.toFixed(4)}`);
    }
    const rNight = resolveSunPlan(sunEnt, 0, now, demoSunAltAz(demoCfg({ sunElevationDeg: -14, sunAzimuthDeg: 10 })));
    r.updateSolarPanels([spD], () => null, rNight.sun.azDeg, rNight.sun.elevDeg, null);
    {
      const { head } = headOf();
      assert('3D array parks under a demo night sun', head && head.userData.parked === true);
      assert('3D array parks at the stow tilt',
        head && near(head.userData.tiltDeg, SOLAR_PARK_TILT, 1e-9), head && `${head.userData.tiltDeg}`);
    }

    // 2D: END-TO-END through the real Planner store — sun.sun says 80° (nearly
    // flat), the demo source says 20° (steeply tilted). The painted plan DEPTH
    // proves which one the 2D draw actually used.
    p.floor().solarPanels = [{ id: 'demo1', x: 2000, y: 3000, label: 'Demo' }];
    p.store.layers2d = {};
    const savedWeather = p.store.weather;
    p.store.weather = undefined;
    const realHi = pvBox(drawTo(80));                   // no demo → follows sun.sun
    p.store.weather = { source: 'demo', demo: { sunElevationDeg: 20, sunAzimuthDeg: 0 } };
    const demoLo = pvBox(drawTo(80));                   // sun.sun still 80°, demo says 20°
    assert('2D follows the demo sun, not sun.sun',
      demoLo.n > 50 && demoLo.h < realHi.h * 0.6, `real=${realHi.h} demo=${demoLo.h}`);
    assert('2D demo aim leaves the panel WIDTH unchanged',
      Math.abs(realHi.w - demoLo.w) <= 2, `real=${realHi.w} demo=${demoLo.w}`);
    // A demo night parks the 2D array even while sun.sun is high overhead.
    const arrowPx2 = (img) => {
      let n = 0;
      for (let i = 0; i < img.data.length; i += 4) {
        if (img.data[i] > 150 && img.data[i + 1] > 110 && img.data[i + 2] < 120) n++;
      }
      return n;
    };
    p.store.weather = { source: 'demo', demo: { sunElevationDeg: -14, sunAzimuthDeg: 10 } };
    assert('2D parks under a demo night sun (no sun arrow)', arrowPx2(drawTo(80)) === 0);
    assert('2D parked face is dimmed under a demo night sun', pvBox(drawTo(80)).n === 0);
    // A demo source with NO authored sun leaves the real one alone.
    p.store.weather = { source: 'demo', demo: { condition: 'rainy' } };
    const noSun = pvBox(drawTo(80));
    assert('a demo source without a sun keeps following sun.sun',
      noSun.n > 50 && Math.abs(noSun.h - realHi.h) <= 2, `no-sun=${noSun.h} real=${realHi.h}`);
    p.store.weather = savedWeather;
  }

  // ── render ────────────────────────────────────────────────────────────────
  const pass = results.filter(x => x.ok).length;
  const total = results.length;
  const fails = results.filter(x => !x.ok).map(x => x.name);
  document.getElementById('log').textContent = results.map(t => `${t.ok ? 'PASS' : 'FAIL'} ${t.name} — ${t.detail}`).join('\n');
  document.title = fails.length === 0 ? `SOLAR PASS ${pass}/${total}` : `SOLAR FAIL ${pass}/${total} [${fails.join(',')}]`;
</script>
