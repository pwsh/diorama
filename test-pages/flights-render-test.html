<!doctype html>
<meta charset="utf-8">
<title>FLIGHTSRENDER …</title>
<style>
  html,body{margin:0;background:#0b0f14;color:#cfd8dc;font:13px/1.4 sans-serif}
  #c{width:1000px;height:640px}
  #log{position:fixed;right:8px;top:8px;width:430px;max-height:96vh;overflow:auto;
       background:#111820;border:1px solid #263340;border-radius:6px;padding:8px 10px;font-size:11px}
  .pass{color:#69f0ae}.fail{color:#ff5252}.hd{font-weight:bold;margin:2px 0 6px}
</style>
<div id="c"></div>
<div id="log"></div>
<script type="module">
  // Renderer harness: live aircraft (ADS-B) + ISS sky overlay — roadmap P4 wave 2.
  // The whole body is SYNCHRONOUS after the imports + load()/updateFloor, so the
  // renderer's own _animate RAF never interleaves — every read reflects only the
  // manual updateFlights / updateIss / _advanceFlights calls below. Imports the
  // BUILT renderer chunk (which bundles THREE); the page itself never imports
  // THREE (Vector3s are obtained by cloning renderer-owned ones).
  //
  // Build (flights.ts is genuinely zero-import → plain transpile; sky-astro.ts
  // pulls in sky-catalog.ts → bundle):
  //   npm run build
  //   npx esbuild src/flights.ts --format=esm --outfile=<harness>/flights.mod.js
  //   npx esbuild src/aircraft-types.ts --format=esm --outfile=<harness>/aircraft-types.mod.js
  //   npx esbuild src/sky-astro.ts --bundle --format=esm --outfile=<harness>/sky-astro.mod.js
  //   mkdir -p /tmp/h && cp -r dist/* test-pages/* /tmp/h/ && cd /tmp/h && python3 -m http.server 8931
  //   google-chrome --headless=new --virtual-time-budget=9000 --dump-dom \
  //     "http://localhost:8931/flights-render-test.html?b=$RANDOM" | grep -o "<title>[^<]*</title>"
  const V = '?v=' + Date.now();
  const mod = await import('./assets/three-renderer.js' + V);
  const F = await import('./flights.mod.js' + V);
  const SA = await import('./sky-astro.mod.js' + V);
  const AT = await import('./aircraft-types.mod.js' + V);

  const r = new mod.ThreeDRenderer(document.getElementById('c'));
  await r.load();

  const AFW = 10000, AFD = 8000;
  r.updateFloor({
    id: 'f1', name: 'T', w: AFW, d: AFD,
    walls: [{ id: 'w', points: [{x:200,y:200},{x:9800,y:200},{x:9800,y:7800},{x:200,y:7800},{x:200,y:200}] }],
    furniture: [], lights: [], switches: [], sensors: [], motionSensors: [],
    envSensors: [], doors: [], windows: [], bg: null, model3d: null, look3d: null,
  }, { preset: 'night', floorColor: '#8a7860', floorTex: 'wood', wallColor: '#cfd2d6' });

  const tests = [];
  const ok = (name, cond, detail) => tests.push({ name, ok: !!cond, detail: detail ?? '' });
  const near = (name, got, want, tol, detail) =>
    ok(name, Math.abs(got - want) <= tol, detail ?? `got ${got}, want ${want}±${tol}`);

  // ── fixtures ───────────────────────────────────────────────────────────────
  const OLAT = 40, OLON = -75;                 // home origin
  const ORIGIN = { lat: OLAT, lon: OLON };
  const RAD_NM = 30;
  const ANCHOR = { x: 1500, z: -900 };         // deliberately NOT the floor centre
  const FP = o => ({
    hex: 'aaa001', callsign: null, lat: OLAT + 0.2, lon: OLON + 0.2, altFt: 10000,
    gsKt: null, trackDeg: null, vertRateFpm: null, category: null, seenPosS: null,
    military: false,
    // wave-2 fields (registry enrichment + status + dbFlags bits)
    reg: null, typeCode: null, typeDesc: null, operator: null,
    emergency: null, squawk: null, interesting: false, pia: false, ladd: false,
    ...o,
  });
  const upd = (list, opts = {}) => r.updateFlights(
    list,
    'origin' in opts ? opts.origin : ORIGIN,
    opts.theta ?? 0, opts.radiusNm ?? RAD_NM,
    opts.showLabels !== false,
    opts.anchor ?? ANCHOR,
    opts.opts);
  const step = (dt, n = 1) => { for (let i = 0; i < n; i++) r._advanceFlights(dt); };
  const rig = hex => r._flightRigs.get(hex);
  // Expected scene-RELATIVE offset for a fix: relative plan → scene flips dx,
  // keeps dy (the _w mirror); y = the compressed display altitude.
  // The display shell's radius is USER-DEFINABLE (FlightsConfig.shellRadiusM →
  // updateFlights opts.shellMm). With no opts the renderer resolves the SAME
  // default the pure module does, so `expectPos` may omit it; section 4d drives
  // a non-default shell explicitly and threads it through everywhere.
  const SHELL0 = F.flightShellMm();                    // the 300 m default, in mm
  const SFAC = shellMm => shellMm / F.FLIGHT_SHELL_BASE_MM;   // similarity factor
  const expectPos = (fp, theta = 0, radiusNm = RAD_NM, shellMm = SHELL0) => {
    const d = F.flightDisplayPos(fp, OLAT, OLON, theta, radiusNm, shellMm);
    return { x: -d.planX, y: d.dispY, z: d.planY };
  };
  const descendants = (o) => { const out = []; o.traverse(c => out.push(c)); return out; };
  const withUD = (o, key, val) => descendants(o).filter(c =>
    c.userData && c.userData[key] !== undefined && (val === undefined || c.userData[key] === val));
  const geoTypes = (o, t) => descendants(o).filter(c => c.geometry && c.geometry.type === t).length;
  const findUD = (o, key) => descendants(o).some(c => c.userData && c.userData[key]);
  const sprites = o => descendants(o).filter(c => c.isSprite);
  // Nose direction (local −Z) in world space, without importing THREE.
  const noseDir = (asm) => {
    const v = asm.position.clone();
    asm.getWorldDirection(v);        // world +Z
    return { x: -v.x, y: -v.y, z: -v.z };
  };

  // ── 1. rig lifecycle ───────────────────────────────────────────────────────
  const A = FP({ hex: 'a1', category: 'A1', callsign: 'N123AB', trackDeg: 0, gsKt: 120 });
  const B = FP({ hex: 'b2', category: 'A3', callsign: 'DAL42', lon: OLON + 0.3, trackDeg: 90, gsKt: 420 });
  const C = FP({ hex: 'c3', category: 'A7', callsign: 'LIFE1', lat: OLAT + 0.1, trackDeg: 200, gsKt: 110 });
  upd([A, B, C]);
  ok('3 aircraft → 3 rigs', r._flightRigs.size === 3, `n=${r._flightRigs.size}`);
  ok('3 rigs parented under _flightsGroup', r._flightsGroup.children.length === 3,
     `n=${r._flightsGroup.children.length}`);
  ok('_flightsGroup anchored at the home point',
     r._flightsGroup.position.x === ANCHOR.x && r._flightsGroup.position.z === ANCHOR.z,
     `${r._flightsGroup.position.x},${r._flightsGroup.position.z}`);

  // Track the jet's per-rig label texture so disposal is provable.
  const jetRig = rig('b2');
  const jetTex = jetRig.label && jetRig.label.material.map;
  let jetTexDisposals = 0;
  if (jetTex) {
    const orig = jetTex.dispose.bind(jetTex);
    jetTex.dispose = () => { jetTexDisposals++; orig(); };
  }
  const jetAsm = jetRig.asm;

  upd([A, C]);                                     // b2 vanished
  ok('vanished hex marked dying, not yet removed',
     r._flightRigs.size === 3 && rig('b2') && rig('b2').dying === true);
  step(0.1, 3);
  ok('mid-fade rig still present + shrinking',
     r._flightRigs.size === 3 && rig('b2').fade < 1 && rig('b2').fade > 0,
     `fade=${rig('b2') && rig('b2').fade}`);
  step(0.1, 9);                                    // total > FLIGHT_FADE_S (0.8 s)
  ok('faded rig disposed after >1 s', r._flightRigs.size === 2 && !rig('b2'),
     `n=${r._flightRigs.size}`);
  ok('faded rig detached from _flightsGroup',
     r._flightsGroup.children.length === 2 && jetAsm.parent === null);
  ok('per-rig label CanvasTexture freed on dispose', jetTexDisposals >= 1,
     `disposals=${jetTexDisposals}`);

  // Re-acquire mid-fade keeps the SAME rig (no rebuild).
  upd([A, C]);
  const cRigRef = rig('c3');
  upd([A]);                                        // c3 vanishes
  step(0.1, 2);
  upd([A, C]);                                     // …and comes back
  ok('re-acquired mid-fade revives the same rig',
     rig('c3') === cRigRef && rig('c3').dying === false);
  step(0.5, 3);
  ok('revived rig ramps back to full scale', rig('c3').fade === 1, `fade=${rig('c3').fade}`);

  // ── 2. model kinds ─────────────────────────────────────────────────────────
  upd([]); step(1, 2);                              // clear the board
  ok('empty list → all rigs disposed', r._flightRigs.size === 0);

  upd([A, B, C]);
  const rp = rig('a1'), rj = rig('b2'), rh = rig('c3');
  ok('A1 → prop model', rp.kind === 'prop');
  ok('A3 → jet model', rj.kind === 'jet');
  ok('A7 → heli model', rh.kind === 'heli');
  ok('no category → jet fallback',
     mod.ThreeDRenderer && (() => { upd([A, B, C, FP({ hex: 'z9' })]);
       const k = rig('z9').kind; upd([A, B, C]); step(1, 2); return k === 'jet'; })());
  ok('prop rig has a spinning prop group', !!rp.prop && rp.propRate > 0);
  ok('jet rig has NO prop', rj.prop === null && rj.propRate === 0);
  ok('jet carries underwing engine pods (cylinders)', geoTypes(rj.asm, 'CylinderGeometry') >= 2,
     `n=${geoTypes(rj.asm, 'CylinderGeometry')}`);
  ok('prop carries no engine pods', geoTypes(rp.asm, 'CylinderGeometry') === 0);
  ok('heli rig has main + tail rotor', !!rh.prop && !!rh.tailRotor);

  const propZ0 = rp.prop.rotation.z, heliY0 = rh.prop.rotation.y, tailX0 = rh.tailRotor.rotation.x;
  step(0.1, 3);
  ok('prop spins about local Z', rp.prop.rotation.z !== propZ0);
  ok('heli main rotor spins about Y', rh.prop.rotation.y !== heliY0);
  ok('heli main rotor does NOT spin about Z', rh.prop.rotation.z === 0);
  ok('heli tail rotor spins about X', rh.tailRotor.rotation.x !== tailX0);

  // Military livery differs from civil (fuselage = the first mesh child).
  upd([]); step(1, 2);
  upd([FP({ hex: 'civ', category: 'A1' }), FP({ hex: 'mil', category: 'A1', military: true, lon: OLON + 0.05 })]);
  const civC = rig('civ').asm.children[0].material.color.getHex();
  const milC = rig('mil').asm.children[0].material.color.getHex();
  ok('military tint differs from civil', civC !== milC, `civ=${civC.toString(16)} mil=${milC.toString(16)}`);
  ok('military rig flagged', rig('mil').military === true && rig('civ').military === false);

  // ── 3. banner vs sprite label ──────────────────────────────────────────────
  upd([]); step(1, 2);
  upd([A, B]);
  ok('prop + callsign → towed banner', !!rig('a1').banner && findUD(rig('a1').banner, 'bannerFront'));
  ok('prop + callsign → no sprite label', rig('a1').label === null);
  ok('jet → camera-facing sprite label', !!rig('b2').label && rig('b2').label.isSprite === true);
  ok('jet → no banner', rig('b2').banner === null);
  upd([]); step(1, 2);
  upd([FP({ hex: 'nc', category: 'A1', callsign: null })]);
  ok('prop WITHOUT callsign → sprite label, no banner',
     !!rig('nc').label && rig('nc').banner === null);
  upd([]); step(1, 2);
  upd([A, B], { showLabels: false });
  ok('showLabels=false → no banner', rig('a1').banner === null);
  ok('showLabels=false → no sprite label', rig('b2').label === null);
  ok('showLabels=false → asm carries no sprites', sprites(rig('b2').asm).length === 0);
  // Toggling labels back on restores them (and off again tears them down).
  upd([A, B], { showLabels: true });
  ok('labels re-enabled → banner + sprite rebuilt',
     !!rig('a1').banner && !!rig('b2').label);

  // ── 4. placement (anchor + relative offset) ────────────────────────────────
  upd([]); step(1, 2);
  const P4 = FP({ hex: 'p4', lat: OLAT + 0.15, lon: OLON - 0.22, altFt: 24000 });
  upd([P4]);
  const e4 = expectPos(P4);
  const g4 = rig('p4').asm.position;
  near('fresh rig snaps to display x', g4.x, e4.x, 1);
  near('fresh rig snaps to display y (compressed altitude)', g4.y, e4.y, 1);
  near('fresh rig snaps to display z', g4.z, e4.z, 1);
  ok('display radius stays inside the shell',
     Math.hypot(e4.x, e4.z) < SHELL0, `r=${Math.round(Math.hypot(e4.x, e4.z))}`);
  // Anchor change moves the whole shell, not the rigs' local offsets.
  upd([P4], { anchor: { x: -2200, z: 3300 } });
  ok('anchor shift moves _flightsGroup',
     r._flightsGroup.position.x === -2200 && r._flightsGroup.position.z === 3300);
  near('rig local offset unchanged by the anchor shift', rig('p4').asm.position.x, e4.x, 1);
  upd([P4], { anchor: ANCHOR });

  // _flightScenePos (the renderer's zero-alloc inline) must agree with the pure
  // flightDisplayPos it mirrors — the whole point of single-sourcing the curves.
  for (const [lat, lon, alt] of [[OLAT + 0.4, OLON + 0.05, 3000], [OLAT - 0.3, OLON - 0.5, 41000], [OLAT, OLON, 800]]) {
    const want = expectPos(FP({ lat, lon, altFt: alt }));
    const got = r._flightScenePos(lat, lon, alt, r._v3flight);
    ok(`_flightScenePos == flightDisplayPos (${lat},${lon})`,
       Math.abs(got.x - want.x) < 0.001 && Math.abs(got.y - want.y) < 0.001
       && Math.abs(got.z - want.z) < 0.001,
       `got ${got.x.toFixed(2)},${got.y.toFixed(2)},${got.z.toFixed(2)}`);
  }

  // ── 4b. distance-compensated model scale ───────────────────────────────────
  // The 2026-07 shell rescale (rMaxMm 24,000 → 120,000) put the rim 120 m from
  // the house, where a fixed-size toy model is a speck. The rig GROUP scale is
  // flightDisplayScale(displayRadius), COMPOSED multiplicatively with the
  // spawn/despawn fade — neither term may overwrite the other.
  {
    upd([]); step(1, 3);
    const rOf = rg => Math.hypot(rg.curX, rg.curZ);
    const wantScale = rg => rg.fade * F.flightDisplayScale(rOf(rg));
    // Two aircraft, one close in, one far enough out to sit near the rim.
    const NEARBY = FP({ hex: 'sn', lat: OLAT + 0.005, lon: OLON, altFt: 4000 });
    const RIMMED = FP({ hex: 'sf', lat: OLAT + 3.5, lon: OLON, altFt: 35000 });
    upd([NEARBY, RIMMED]);
    const rn = rig('sn'), rf = rig('sf');
    ok('4b: fresh rig scale = fade × flightDisplayScale(r) (near)',
       Math.abs(rn.asm.scale.x - wantScale(rn)) < 1e-9,
       `scale=${rn.asm.scale.x.toFixed(4)} want=${wantScale(rn).toFixed(4)}`);
    ok('4b: fresh rig scale = fade × flightDisplayScale(r) (rim)',
       Math.abs(rf.asm.scale.x - wantScale(rf)) < 1e-9,
       `scale=${rf.asm.scale.x.toFixed(4)} want=${wantScale(rf).toFixed(4)}`);
    ok('4b: a distant rig renders LARGER than a near one',
       rf.asm.scale.x > rn.asm.scale.x * 1.5,
       `near ${rn.asm.scale.x.toFixed(2)}× rim ${rf.asm.scale.x.toFixed(2)}×`);
    // The shell factor deliberately does NOT ride in the model scale (see
    // flights.ts's flightDisplayScale): scaling size WITH position preserves
    // every apparent size and made the draw-radius knob a no-op. The scale
    // therefore stays in [1, 1+gain] at every shell radius.
    ok('4b: a near rig is ~the authored 1× size, at any shell radius',
       rn.asm.scale.x < 1.2, `near=${rn.asm.scale.x.toFixed(3)}×`);
    ok('4b: scale is uniform on all three axes',
       rn.asm.scale.x === rn.asm.scale.y && rn.asm.scale.y === rn.asm.scale.z);
    ok('4b: rim scale stays under the 1+gain ceiling (no shell factor)',
       rf.asm.scale.x <= (1 + F.FLIGHT_SCALE_GAIN) + 1e-9,
       `${rf.asm.scale.x.toFixed(4)}×`);
    // _advanceFlights keeps the composition every frame.
    step(0.05, 4);
    ok('4b: per-frame advance keeps scale = fade × displayScale',
       Math.abs(rig('sf').asm.scale.x - wantScale(rig('sf'))) < 1e-9);
    // …and the FADE composes: a dying rim rig shrinks FROM its enlarged size.
    const rimFull = rig('sf').asm.scale.x;
    upd([NEARBY]);                                  // 'sf' vanishes → fade out
    step(0.1, 3);
    const dyingRim = rig('sf');
    ok('4b: dying rim rig is mid-fade', dyingRim.fade > 0 && dyingRim.fade < 1,
       `fade=${dyingRim.fade.toFixed(3)}`);
    ok('4b: …its scale is the FADED enlarged size (fade composes, not overwrites)',
       Math.abs(dyingRim.asm.scale.x - wantScale(dyingRim)) < 1e-9
       && dyingRim.asm.scale.x < rimFull
       && dyingRim.asm.scale.x > dyingRim.fade + 1e-6,
       `scale=${dyingRim.asm.scale.x.toFixed(4)} fade=${dyingRim.fade.toFixed(4)}`);
    upd([]); step(1, 3);
    ok('4b: board clear after the scale checks', r._flightRigs.size === 0);
  }

  // ── 4b-2. user model-size preference (FlightsConfig.modelScale) ────────────
  // A plain display multiplier folded into the SAME _flightRigScale site the
  // build / rebuild / advance all read — so it composes with the growth curve
  // and the fade rather than replacing either. Absent (a stale three-view) must
  // reproduce today's size exactly.
  {
    upd([]); step(1, 3);
    const rOf = rg => Math.hypot(rg.curX, rg.curZ);
    const base = rg => rg.fade * F.flightDisplayScale(rOf(rg));
    const NEARBY = FP({ hex: 'ms_n', lat: OLAT + 0.005, lon: OLON, altFt: 4000 });
    const RIMMED = FP({ hex: 'ms_f', lat: OLAT + 3.5, lon: OLON, altFt: 35000 });

    upd([NEARBY, RIMMED]);                                   // no opts at all
    const n0 = rig('ms_n').asm.scale.x, f0 = rig('ms_f').asm.scale.x;
    ok('4b2: modelScale absent → the shipped size, exactly',
       Math.abs(n0 - base(rig('ms_n'))) < 1e-9 && Math.abs(f0 - base(rig('ms_f'))) < 1e-9,
       `near=${n0.toFixed(4)} rim=${f0.toFixed(4)}`);
    upd([NEARBY, RIMMED], { opts: { modelScale: 1 } });
    step(0);                                                 // zero-time scale refresh
    ok('4b2: modelScale 1 is identical to absent',
       Math.abs(rig('ms_n').asm.scale.x - n0) < 1e-12 &&
       Math.abs(rig('ms_f').asm.scale.x - f0) < 1e-12);

    // A live rig picks the new factor up on the next FRAME (a poll is a
    // correction the per-frame ease applies; only build/rebuild set scale
    // directly) — step(0) advances nothing but the scale.
    upd([NEARBY, RIMMED], { opts: { modelScale: 2.5 } });
    step(0);
    ok('4b2: modelScale multiplies the composed scale (near + rim, live rigs)',
       Math.abs(rig('ms_n').asm.scale.x - n0 * 2.5) < 1e-9 &&
       Math.abs(rig('ms_f').asm.scale.x - f0 * 2.5) < 1e-9,
       `near=${rig('ms_n').asm.scale.x.toFixed(4)} want=${(n0 * 2.5).toFixed(4)}`);
    step(0.05, 4);
    ok('4b2: the per-frame advance keeps the multiplied scale',
       Math.abs(rig('ms_n').asm.scale.x - base(rig('ms_n')) * 2.5) < 1e-9 &&
       Math.abs(rig('ms_f').asm.scale.x - base(rig('ms_f')) * 2.5) < 1e-9);
    // A FRESH rig built while the factor is live starts at the scaled size.
    const FRESH = FP({ hex: 'ms_fresh', lat: OLAT + 0.01, lon: OLON + 0.01, altFt: 6000 });
    upd([NEARBY, RIMMED, FRESH], { opts: { modelScale: 2.5 } });
    ok('4b2: a fresh rig is built at the multiplied scale',
       Math.abs(rig('ms_fresh').asm.scale.x - base(rig('ms_fresh')) * 2.5) < 1e-9,
       `=${rig('ms_fresh').asm.scale.x.toFixed(4)}`);
    // …and a model rebuild (late registry data) keeps it.
    upd([NEARBY, RIMMED,
         FP({ hex: 'ms_fresh', lat: OLAT + 0.01, lon: OLON + 0.01, altFt: 6000,
              typeCode: 'B738', category: 'A3' })], { opts: { modelScale: 2.5 } });
    ok('4b2: a model rebuild keeps the multiplied scale',
       rig('ms_fresh').archetype === 'narrowbody' &&
       Math.abs(rig('ms_fresh').asm.scale.x - base(rig('ms_fresh')) * 2.5) < 1e-9,
       `=${rig('ms_fresh').asm.scale.x.toFixed(4)}`);
    // …and the FADE still composes on top.
    upd([NEARBY], { opts: { modelScale: 2.5 } });
    step(0.1, 3);
    const dying = rig('ms_f');
    ok('4b2: a fading rig shrinks from its multiplied size (fade still composes)',
       dying.fade > 0 && dying.fade < 1 &&
       Math.abs(dying.asm.scale.x - base(dying) * 2.5) < 1e-9,
       `fade=${dying.fade.toFixed(3)} scale=${dying.asm.scale.x.toFixed(4)}`);

    // Clamp 0.5..4; garbage → 1.
    const at = v => {
      upd([NEARBY], { opts: { modelScale: v } }); step(0);
      return rig('ms_n').asm.scale.x;
    };
    const nb = () => base(rig('ms_n'));
    ok('4b2: clamps below 0.5', Math.abs(at(0.01) - nb() * 0.5) < 1e-9);
    ok('4b2: clamps above 4', Math.abs(at(99) - nb() * 4) < 1e-9);
    ok('4b2: NaN / negative / non-number → 1',
       Math.abs(at(NaN) - nb()) < 1e-9 && Math.abs(at(-3) - nb()) < 1e-9 &&
       Math.abs(at('big') - nb()) < 1e-9);
    upd([]); step(1, 3);
    ok('4b2: board clear after the modelScale checks', r._flightRigs.size === 0);
  }

  // ── 4c. camera-frustum reach requirement ───────────────────────────────────
  // The shell reaches ≈137 m from the home anchor; the stock far plane (150,000)
  // is measured FROM THE CAMERA, so a rim aircraft on the far side clips at any
  // real orbit distance. Aircraft therefore join the neighborhood overlay's
  // dynamic-frustum requirement — but ONLY the far/near half of it: watching
  // planes must not stretch controls.maxDistance (documented asymmetry).
  {
    const NEAR0 = 10, FAR0 = 150000, MAXD0 = 45000;
    const stock = () => r._camera.near === NEAR0 && r._camera.far === FAR0
      && r._controls.maxDistance === MAXD0;
    ok('4c: stock frustum triple with no aircraft', stock(),
       `${r._camera.near}/${r._camera.far}/${r._controls.maxDistance}`);
    upd([FP({ hex: 'fr1', lat: OLAT + 0.5, altFt: 20000 })]);
    ok('4c: aircraft on screen widen the far plane past stock',
       r._camera.far > FAR0, `far=${r._camera.far.toFixed(0)}`);
    ok('4c: …near tracks far at the pinned 15000:1 ratio',
       Math.abs(r._camera.near - r._camera.far / 15000) < 1e-6, `near=${r._camera.near}`);
    ok('4c: …but maxDistance stays STOCK (flights never stretch the orbit range)',
       r._controls.maxDistance === MAXD0, `maxD=${r._controls.maxDistance}`);
    ok('4c: the recorded requirement is the shell reach at the live draw radius',
       r._frustumReqFlights === F.flightShellReachMm(SHELL0), `${r._frustumReqFlights}`);
    ok('4c: …i.e. the base constant scaled by the shell factor',
       Math.abs(r._frustumReqFlights - SFAC(SHELL0) * F.FLIGHT_SHELL_REACH_MM) < 1e-6);
    // Hiding the Flights layer must drop the requirement (rigs stay alive).
    r.setLayerVisibility({ flights: false });
    ok('4c: hiding the Flights layer restores the stock triple exactly', stock(),
       `${r._camera.near}/${r._camera.far}/${r._controls.maxDistance}`);
    ok('4c: …with the rigs still alive (visibility, not teardown)',
       r._flightRigs.size === 1 && r._frustumReqFlights === null);
    r.setLayerVisibility({});
    ok('4c: unhiding re-widens immediately', r._camera.far > FAR0, `far=${r._camera.far.toFixed(0)}`);
    // An empty list clears it — the stock restore must be EXACT (strict ===).
    upd([]);
    ok('4c: empty aircraft list restores the stock triple exactly', stock(),
       `${r._camera.near}/${r._camera.far}/${r._controls.maxDistance}`);
    ok('4c: flights requirement cleared', r._frustumReqFlights === null);
    // Losing the geo origin is the other no-content path.
    upd([FP({ hex: 'fr2', lat: OLAT + 0.5, altFt: 20000 })]);
    ok('4c: re-widens on new aircraft', r._camera.far > FAR0);
    upd([FP({ hex: 'fr2', lat: OLAT + 0.5, altFt: 20000 })], { origin: null });
    ok('4c: losing the geo origin restores the stock triple', stock(),
       `${r._camera.near}/${r._camera.far}/${r._controls.maxDistance}`);
    upd([]); step(1, 3);
    ok('4c: board clear after the frustum checks', r._flightRigs.size === 0);
  }

  // ── 4d. USER-DEFINABLE draw radius (updateFlights opts.shellMm) ───────────
  // FlightsConfig.shellRadiusM → flightShellMm → opts.shellMm. The renderer
  // must thread ONE stored factor through all four consumers — _flightScenePos
  // (position), _flightRigScale (size), the frustum requirement, and the
  // no-origin fallback — so the 3D shell can never disagree with the pure
  // module the 2D canvas draws from.
  {
    upd([]); step(1, 3);
    const SHELL2 = 240000;                      // 240 m — deliberately NOT the default
    const FAR_FP = FP({ hex: 'sh1', lat: OLAT + 0.18, lon: OLON - 0.25, altFt: 28000 });
    upd([FAR_FP], { opts: { shellMm: SHELL2 } });
    const want2 = expectPos(FAR_FP, 0, RAD_NM, SHELL2);
    const got2 = rig('sh1').asm.position;
    ok('4d: rig snaps to the NON-DEFAULT shell position',
       Math.abs(got2.x - want2.x) < 1 && Math.abs(got2.y - want2.y) < 1
       && Math.abs(got2.z - want2.z) < 1,
       `got ${got2.x.toFixed(1)},${got2.y.toFixed(1)},${got2.z.toFixed(1)}`);
    ok('4d: …and that is NOT where the default shell would have put it',
       Math.abs(got2.x - expectPos(FAR_FP).x) > 1000);

    // The zero-alloc inline must mirror the pure function AT THIS SHELL TOO —
    // the parity the whole single-sourcing discipline exists for.
    let parity = true;
    for (const [lat, lon, alt] of [[OLAT + 0.4, OLON + 0.05, 3000],
                                   [OLAT - 0.3, OLON - 0.5, 41000], [OLAT, OLON, 800]]) {
      const w = expectPos(FP({ lat, lon, altFt: alt }), 0, RAD_NM, SHELL2);
      const g = r._flightScenePos(lat, lon, alt, r._v3flight);
      if (Math.abs(g.x - w.x) > 0.001 || Math.abs(g.y - w.y) > 0.001
        || Math.abs(g.z - w.z) > 0.001) parity = false;
    }
    ok('4d: _flightScenePos == flightDisplayPos at a non-default shell', parity);

    // Similarity: 240,000 is exactly 2× the 120,000 authored reference. A FRESH
    // rig snaps to its display position (a poll on a LIVE rig is a correction
    // the per-frame ease glides onto), so each shell gets a clean board.
    upd([]); step(1, 3);
    upd([FAR_FP], { opts: { shellMm: F.FLIGHT_SHELL_BASE_MM } });
    const pBase = rig('sh1').asm.position.clone();
    upd([]); step(1, 3);
    upd([FAR_FP], { opts: { shellMm: SHELL2 } });
    const pTwice = rig('sh1').asm.position.clone();
    ok('4d: the rescale is a pure similarity (2× shell → 2× offsets)',
       Math.abs(pTwice.x - 2 * pBase.x) < 0.01 && Math.abs(pTwice.z - 2 * pBase.z) < 0.01
       && Math.abs(pTwice.y - 2 * pBase.y) < 0.01,
       `${pBase.x.toFixed(0)} → ${pTwice.x.toFixed(0)}`);
    // A LIVE rig glides to the new shell rather than jumping — the same eased
    // correction path a poll uses, so a settings edit is not a jump cut.
    upd([FAR_FP], { opts: { shellMm: F.FLIGHT_SHELL_BASE_MM } });
    const midEase = rig('sh1').asm.position.x;
    step(0.05, 2);
    ok('4d: a live rig EASES toward the new shell, never snaps',
       Math.abs(rig('sh1').asm.position.x - midEase) > 1e-6
       && Math.abs(rig('sh1').asm.position.x - pBase.x)
          < Math.abs(midEase - pBase.x) + 1e-6,
       `${midEase.toFixed(0)} → ${rig('sh1').asm.position.x.toFixed(0)} (target ${pBase.x.toFixed(0)})`);
    step(0.5, 90);
    ok('4d: …and converges on the new shell position',
       Math.abs(rig('sh1').asm.position.x - pBase.x) < 1,
       `${rig('sh1').asm.position.x.toFixed(1)} want ${pBase.x.toFixed(1)}`);

    // Size composition: fade × flightDisplayScale(r, shell) × modelScale.
    upd([FAR_FP], { opts: { shellMm: SHELL2, modelScale: 1.5 } });
    step(0);
    const rg = rig('sh1');
    const wantScale = rg.fade * F.flightDisplayScale(Math.hypot(rg.curX, rg.curZ), SHELL2) * 1.5;
    ok('4d: rig scale composes the LIVE shell with modelScale',
       Math.abs(rg.asm.scale.x - wantScale) < 1e-9,
       `scale=${rg.asm.scale.x.toFixed(4)} want=${wantScale.toFixed(4)}`);
    // …and the shell radius does NOT multiply the size: the same aircraft at
    // the same FRACTION of the shell renders at the same size on any shell.
    // (Scaling size with position preserved every apparent size and made the
    // draw-radius knob a perceptual no-op — user-reported; see flights.ts.)
    ok('4d: …and the shell factor is NOT in the size (equal u ⇒ equal scale)',
       Math.abs(rg.asm.scale.x
         - rg.fade * F.flightDisplayScale(Math.hypot(rg.curX, rg.curZ) / 2,
                                          F.FLIGHT_SHELL_BASE_MM) * 1.5) < 1e-9);

    // Frustum reach follows the live shell — never the base constant.
    upd([FAR_FP], { opts: { shellMm: SHELL2 } });
    ok('4d: the frustum requirement scales with the draw radius',
       Math.abs(r._frustumReqFlights - F.flightShellReachMm(SHELL2)) < 1e-6,
       `${r._frustumReqFlights}`);
    ok('4d: …which is 2× the base reach constant',
       Math.abs(r._frustumReqFlights - 2 * F.FLIGHT_SHELL_REACH_MM) < 1e-6);
    ok('4d: …and maxDistance is STILL stock (the deliberate asymmetry holds)',
       r._controls.maxDistance === 45000, `maxD=${r._controls.maxDistance}`);

    // Clamp + stale-chunk safety, renderer-side.
    upd([FAR_FP], { opts: { shellMm: 10000 } });          // 10 m → clamps up to 60 m
    ok('4d: an absurdly small shell clamps up to the 60 m minimum',
       Math.abs(r._frustumReqFlights - F.flightShellReachMm(60000)) < 1e-6,
       `${r._frustumReqFlights}`);
    upd([FAR_FP], { opts: { shellMm: NaN } });
    ok('4d: garbage shellMm falls back to the default shell',
       Math.abs(r._frustumReqFlights - F.flightShellReachMm(SHELL0)) < 1e-6);
    upd([]); step(1, 3);
    upd([FAR_FP], { opts: { modelScale: 1 } });            // opts present, shellMm absent
    ok('4d: opts without shellMm (a stale three-view) = the default shell',
       Math.abs(r._frustumReqFlights - F.flightShellReachMm(SHELL0)) < 1e-6);
    const wantDef = expectPos(FAR_FP);
    ok('4d: …and the position matches the default-shell projection',
       Math.abs(rig('sh1').asm.position.x - wantDef.x) < 1,
       `${rig('sh1').asm.position.x.toFixed(1)} want ${wantDef.x.toFixed(1)}`);

    upd([]); step(1, 3);                                  // back to the default shell
    ok('4d: board clear after the draw-radius checks', r._flightRigs.size === 0);
  }

  // ── 5. heading ─────────────────────────────────────────────────────────────
  // track 0 (due north), θ=0 → geo unit (e,n)=(0,1) → plan (0,1) → scene velocity
  // (−planX, +planY) = (0,+1): the aircraft flies toward scene +Z.
  upd([]); step(1, 2);
  upd([FP({ hex: 'h0', trackDeg: 0, gsKt: 300, lon: OLON + 0.1 })]);
  step(0.05);
  const n0 = noseDir(rig('h0').asm);
  ok('north-bound (θ=0) nose points at scene +Z', n0.z > 0.999, `nose=(${n0.x.toFixed(3)},${n0.z.toFixed(3)})`);
  near('north-bound yaw = π', rig('h0').yaw, Math.PI, 1e-6);
  // θ = π/2 rotates plan-north onto plan −X → scene velocity (+1, 0).
  upd([]); step(1, 2);
  upd([FP({ hex: 'h9', trackDeg: 0, gsKt: 300, lon: OLON + 0.1 })], { theta: Math.PI / 2 });
  step(0.05);
  const n9 = noseDir(rig('h9').asm);
  ok('θ=π/2 rotates the heading onto scene +X', n9.x > 0.999,
     `nose=(${n9.x.toFixed(3)},${n9.z.toFixed(3)})`);
  // Eased, not snapped: a settled rig turning 90° moves partway in one frame.
  upd([]); step(1, 2);
  const H = FP({ hex: 'hE', trackDeg: 0, gsKt: 300, lon: OLON + 0.1 });
  upd([H]); step(0.05, 10);
  const yawBefore = rig('hE').yaw;
  upd([{ ...H, trackDeg: 90 }]);
  step(0.05);
  const yawAfter = rig('hE').yaw, yawWant = Math.atan2(1, 0);   // plan (1,0) → φ = atan2(px,−py)
  ok('yaw eased toward the new track (moved)', Math.abs(yawAfter - yawBefore) > 1e-4);
  ok('yaw eased toward the new track (not snapped)',
     Math.abs(yawAfter - yawWant) > 0.5 * Math.abs(yawBefore - yawWant),
     `before=${yawBefore.toFixed(3)} after=${yawAfter.toFixed(3)} want=${yawWant.toFixed(3)}`);

  // ── 6. dead reckoning ──────────────────────────────────────────────────────
  upd([]); step(1, 2);
  const E = FP({ hex: 'dr', trackDeg: 90, gsKt: 300, lat: OLAT, lon: OLON + 0.1, altFt: 12000 });
  upd([E]);
  const lon0 = rig('dr').lon, radius0 = Math.hypot(rig('dr').asm.position.x, rig('dr').asm.position.z);
  const curX0 = rig('dr').curX;
  step(0.05, 40);                                   // 2 s
  const dLon = rig('dr').lon - lon0;
  // 300 kt = 154.33 m/s; 2 s → 308.7 m east → 308.7 / (111320·cos40°) deg.
  const wantDLon = (300 * 1852 / 3600) * 2 / (111320 * Math.cos(OLAT * Math.PI / 180));
  near('dead reckoning advances longitude at ground speed', dLon, wantDLon, wantDLon * 0.02,
       `got ${dLon.toExponential(3)}`);
  ok('latitude unchanged on a due-east track', Math.abs(rig('dr').lat - OLAT) < 1e-9);
  const radius1 = Math.hypot(rig('dr').asm.position.x, rig('dr').asm.position.z);
  ok('flying away from home increases the compressed radius', radius1 > radius0,
     `${radius0.toFixed(0)} → ${radius1.toFixed(0)}`);
  ok('east-bound display motion goes to scene −X (θ=0)', rig('dr').curX < curX0,
     `${curX0.toFixed(0)} → ${rig('dr').curX.toFixed(0)}`);
  // No gs / no track → the rig holds its fix (never invents a direction).
  upd([]); step(1, 2);
  upd([FP({ hex: 'nr', gsKt: null, trackDeg: null })]);
  const nrLat = rig('nr').lat;
  step(0.05, 20);
  ok('missing gs/track → no dead reckoning', rig('nr').lat === nrLat && rig('nr').lon === FP({}).lon);

  // ── 7. pitch sign ──────────────────────────────────────────────────────────
  upd([]); step(1, 2);
  upd([FP({ hex: 'up', vertRateFpm: 3000, trackDeg: 0, gsKt: 200, lon: OLON + 0.1 }),
       FP({ hex: 'dn', vertRateFpm: -3000, trackDeg: 0, gsKt: 200, lon: OLON + 0.12 })]);
  step(0.05);
  ok('climb → positive rotation.x', rig('up').asm.rotation.x > 0, `${rig('up').asm.rotation.x}`);
  ok('descent → negative rotation.x', rig('dn').asm.rotation.x < 0, `${rig('dn').asm.rotation.x}`);
  near('pitch magnitude = |vert/6000| · 0.12', Math.abs(rig('up').asm.rotation.x), 0.06, 1e-9);
  ok('climb → nose above the horizon', noseDir(rig('up').asm).y > 0,
     `y=${noseDir(rig('up').asm).y.toFixed(4)}`);
  ok('descent → nose below the horizon', noseDir(rig('dn').asm).y < 0);
  upd([]); step(1, 2);

  // ── 8. ISS ─────────────────────────────────────────────────────────────────
  const R_ISS = 26000;
  r.updateIss(null, ORIGIN, 0); step(0.05);
  ok('no ISS fix → sprite absent or hidden', !r._issSprite || r._issSprite.visible === false);
  r.updateIss({ lat: OLAT, lon: OLON, altKm: 420, velKmS: 7.66, tsMs: 1000 }, ORIGIN, 0);
  step(0.05);
  ok('overhead ISS fix → sprite visible', !!r._issSprite && r._issSprite.visible === true);
  near('overhead ISS sits at the shell zenith', r._issSprite.position.y, R_ISS, R_ISS * 0.05,
       `y=${r._issSprite.position.y.toFixed(0)}`);
  ok('overhead ISS at full ramp opacity', r._issSprite.material.opacity > 0.85,
     `op=${r._issSprite.material.opacity.toFixed(3)}`);
  ok('_issGroup recentered on the camera',
     Math.abs(r._issGroup.position.x - r._camera.position.x) < 1e-6
     && Math.abs(r._issGroup.position.y - r._camera.position.y) < 1e-6);
  // Below the horizon → hidden (a 420 km orbit's horizon is ~19.8° of arc).
  r.updateIss({ lat: OLAT, lon: OLON + 120, altKm: 420, velKmS: 7.66, tsMs: 2000 }, ORIGIN, 0);
  step(0.05);
  ok('below-horizon ISS hidden', r._issSprite.visible === false);
  // Near-horizon ramp: find the lon offset that puts the ISS at ≈1° altitude.
  let bestLon = 0, bestErr = 1e9;
  for (let d = 0; d <= 25; d += 0.01) {
    const alt = SA.satAltAz(OLAT, OLON, OLAT, OLON + d, 420).altRad * 180 / Math.PI;
    const err = Math.abs(alt - 1);
    if (err < bestErr) { bestErr = err; bestLon = d; }
  }
  r.updateIss({ lat: OLAT, lon: OLON + bestLon, altKm: 420, velKmS: 7.66, tsMs: 3000 }, ORIGIN, 0);
  step(0.001);
  ok('near-horizon ISS visible but dim', r._issSprite.visible === true
     && r._issSprite.material.opacity < 0.5 && r._issSprite.material.opacity > 0,
     `op=${r._issSprite.material.opacity.toFixed(3)} lonOff=${bestLon.toFixed(2)}`);
  // Dead reckoning from the fix PAIR (clear first — a fix with a predecessor
  // legitimately derives a rate, so "first fix" means genuinely first).
  r.updateIss(null, ORIGIN, 0);
  r.updateIss({ lat: OLAT, lon: OLON, altKm: 420, velKmS: 7.66, tsMs: 10000 }, ORIGIN, 0);
  ok('first fix of a pair sets no rate', r._issLonPerS === 0);
  r.updateIss({ lat: OLAT + 1, lon: OLON + 2, altKm: 420, velKmS: 7.66, tsMs: 20000 }, ORIGIN, 0);
  near('ISS ground-track rate from the fix pair (lon)', r._issLonPerS, 0.2, 1e-9);
  near('ISS ground-track rate from the fix pair (lat)', r._issLatPerS, 0.1, 1e-9);
  step(1, 5);
  near('ISS dead-reckons between polls', r._issLon, OLON + 2 + 1.0, 1e-6, `lon=${r._issLon}`);
  // No observer → inert.
  r.updateIss({ lat: OLAT, lon: OLON, altKm: 420, velKmS: 7.66, tsMs: 30000 }, null, 0);
  step(0.05);
  ok('no observer → ISS hidden', r._issSprite.visible === false);

  // ── 9. layer gating ────────────────────────────────────────────────────────
  upd([A, B]);
  r.setLayerVisibility({ flights: false });
  ok('flights layer off hides the aircraft group', r._flightsGroup.visible === false);
  ok('flights layer off hides the ISS group', r._issGroup.visible === false);
  r.setLayerVisibility({});
  ok('absent flights flag = layer on (aircraft)', r._flightsGroup.visible === true);
  ok('absent flights flag = layer on (ISS)', r._issGroup.visible === true);

  // ── 10. poll-correction ease ───────────────────────────────────────────────
  upd([]); step(1, 2);
  const FIXA = FP({ hex: 'ez', lat: OLAT + 0.2, lon: OLON + 0.2, altFt: 10000 });
  const FIXB = { ...FIXA, lon: OLON + 0.24 };
  upd([FIXA]);
  const eA = expectPos(FIXA), eB = expectPos(FIXB);
  near('rig snapped to fix A', rig('ez').curX, eA.x, 1);
  upd([FIXB]);
  step(0.1);
  const cx = rig('ez').curX;
  const t = (cx - eA.x) / (eB.x - eA.x);
  ok('a poll correction glides (strictly between A and B)', t > 0.001 && t < 0.5,
     `t=${t.toFixed(4)}`);
  ok('correction did NOT snap to B', Math.abs(cx - eB.x) > 1,
     `cx=${cx.toFixed(1)} eB=${eB.x.toFixed(1)}`);

  // ── 11. inert paths ────────────────────────────────────────────────────────
  r.updateFlights([A, B], null, 0, RAD_NM, true, ANCHOR);     // no origin resolved
  ok('no origin → no new rigs built + existing fade out',
     !rig('a1') || rig('a1').dying === true);
  step(1, 3);
  ok('no origin → shell empties', r._flightRigs.size === 0 && r._flightsGroup.children.length === 0);

  // ── 12. Eight archetypes (wave 2) ──────────────────────────────────────────
  // Silhouettes per docs/research/flight-fields-models.md §3.2. The renderer
  // resolves each aircraft's archetype ITSELF from fp.typeCode / fp.category
  // (aircraft-types.ts is pure + shared, like flights.ts).
  upd([]); step(1, 2);
  const ARCH = [
    ['ga-high',    'C172', 'A1'],
    ['ga-low',     'P28A', 'A1'],
    ['twin-prop',  'BE58', 'A2'],
    ['turboprop',  'AT72', 'A3'],
    ['narrowbody', 'B738', 'A3'],
    ['widebody',   'B77W', 'A5'],
    ['bizjet',     'CRJ9', 'A3'],
    ['heli',       'AS50', 'A7'],
  ];
  const archList = ARCH.map(([a, t, c], i) => FP({
    hex: `ar${i}`, typeCode: t, category: c, lon: OLON + 0.1 + i * 0.02,
  }));
  upd(archList);
  ARCH.forEach(([want, t], i) => {
    ok(`${t} → ${want} archetype`, rig(`ar${i}`).archetype === want,
       `got ${rig(`ar${i}`).archetype}`);
    ok(`${t} archetype matches the pure resolver`,
       rig(`ar${i}`).archetype === AT.aircraftArchetype(t, null));
  });
  const A_ = i => rig(`ar${i}`);
  const wingY = o => (withUD(o.asm, 'wing')[0]?.position.y ?? NaN);
  // The one fork `category` alone can NEVER resolve (§0.7): both self-report A1.
  ok('ga-high wing sits ABOVE the fuselage centerline', wingY(A_(0)) > 0, `y=${wingY(A_(0))}`);
  ok('ga-low wing sits BELOW the fuselage centerline', wingY(A_(1)) < 0, `y=${wingY(A_(1))}`);
  ok('ga-high/ga-low differ only in wing side (both tagged)',
     withUD(A_(0).asm, 'wing', 'high').length === 1 && withUD(A_(1).asm, 'wing', 'low').length === 1);
  ok('ga singles carry no engine nacelle', withUD(A_(0).asm, 'nacelle').length === 0
     && withUD(A_(1).asm, 'nacelle').length === 0);
  ok('ga singles carry ONE prop disc',
     A_(0).props.length === 1 && A_(1).props.length === 1);
  // twin-prop: two WING nacelles, two spinning discs.
  ok('twin-prop has 2 wing nacelles', withUD(A_(2).asm, 'nacelle', 'wing').length === 2,
     `n=${withUD(A_(2).asm, 'nacelle', 'wing').length}`);
  ok('twin-prop has 2 prop discs', A_(2).props.length === 2, `n=${A_(2).props.length}`);
  ok('twin-prop discs are on opposite wings',
     A_(2).props[0].position.x * A_(2).props[1].position.x < 0);
  const tpZ = A_(2).props.map(p => p.rotation.z);
  step(0.1, 3);
  ok('BOTH twin-prop discs spin about local Z',
     A_(2).props[0].rotation.z !== tpZ[0] && A_(2).props[1].rotation.z !== tpZ[1]);
  ok('twin-prop discs stay in phase with each other',
     Math.abs(A_(2).props[0].rotation.z - A_(2).props[1].rotation.z) < 1e-9);
  // turboprop: HIGH wing + T-tail + two turboprops (§3.2 — the shape a naive
  // "regional turboprop" reading gets wrong).
  ok('turboprop wing is HIGH', withUD(A_(3).asm, 'wing', 'high').length === 1);
  ok('turboprop has 2 wing nacelles + 2 discs',
     withUD(A_(3).asm, 'nacelle', 'wing').length === 2 && A_(3).props.length === 2);
  ok('turboprop has a T-TAIL', withUD(A_(3).asm, 'tail', 't-tail').length === 1);
  const tpFin = withUD(A_(3).asm, 'fin')[0], tpStab = withUD(A_(3).asm, 'tail')[0];
  ok('T-tail stabilizer sits ON TOP of the fin',
     tpStab.position.y >= tpFin.position.y + tpFin.geometry.parameters.height / 2 - 1,
     `stab=${tpStab.position.y} finTop=${tpFin.position.y + tpFin.geometry.parameters.height / 2}`);
  // narrowbody: underwing pods + conventional tail, no props.
  ok('narrowbody has 2 UNDERWING pods', withUD(A_(4).asm, 'nacelle', 'wing').length === 2);
  ok('narrowbody pods hang BELOW the wing',
     withUD(A_(4).asm, 'nacelle', 'wing').every(p => p.position.y < wingY(A_(4))));
  ok('narrowbody tail is conventional', withUD(A_(4).asm, 'tail', 'conventional').length === 1);
  ok('narrowbody has no prop', A_(4).props.length === 0 && A_(4).propRate === 0);
  ok('narrowbody wing is LOW', wingY(A_(4)) < 0, `y=${wingY(A_(4))}`);
  // widebody: same family, bigger, FOUR pods.
  ok('widebody has 4 pods', withUD(A_(5).asm, 'nacelle', 'wing').length === 4,
     `n=${withUD(A_(5).asm, 'nacelle', 'wing').length}`);
  const fusLen = o => descendants(o.asm).find(c => c.geometry
    && c.geometry.type === 'BoxGeometry' && c.geometry.parameters.depth > 1000)
    ?.geometry.parameters.depth ?? 0;
  ok('widebody fuselage is LONGER than a narrowbody', fusLen(A_(5)) > fusLen(A_(4)),
     `${fusLen(A_(4))} → ${fusLen(A_(5))}`);
  const finH = o => withUD(o.asm, 'fin')[0]?.geometry.parameters.height ?? 0;
  ok('widebody fin is TALLER than a narrowbody fin', finH(A_(5)) > finH(A_(4)),
     `${finH(A_(4))} → ${finH(A_(5))}`);
  ok('narrowbody fuselage is LONGER than a GA single', fusLen(A_(4)) > fusLen(A_(0)),
     `${fusLen(A_(0))} → ${fusLen(A_(4))}`);
  ok('models are ~2× the pre-wave-2 toy scale', fusLen(A_(4)) >= 2000,
     `narrowbody fuselage = ${fusLen(A_(4))} mm`);
  // bizjet — REAR-fuselage engines + T-tail. The §3.3 finding: a CRJ is

  // Fallback: no operator → identification back on the flanks, no spine plane.
  upd([{ ...BIG, operator: null }]);
  ok('a large fuselage with NO operator keeps its ID on the flanks',
     layPlanes().length === 2 && rig('lay1').idKey === 'AAL266|', rig('lay1').idKey);
  ok('…and grows no spine marking',
     layPlanes().every(p => p.userData.flank !== 'top'));
  // Small airframes: identification only, whatever the registry says.
  upd([]); step(1, 3);
  for (const [hex, type, cat, what] of [
        ['sm1', 'C172', 'A1', 'ga-high'], ['sm2', 'PA28', 'A1', 'ga-low'],
        ['sm3', 'R44',  'A7', 'heli']]) {
    upd([FP({ hex, callsign: 'N123AB', typeCode: type, category: cat,
              operator: 'SOME FLIGHT SCHOOL LLC' })]);
    const pls = withUD(rig(hex).asm, 'flightId');
    ok(`${what}: identification on the flanks only`,
       pls.length === 2 && pls.every(p => p.userData.flank !== 'top')
       && rig(hex).idKey === 'N123AB|', `${pls.length} / ${rig(hex).idKey}`);
    upd([]); step(1, 3);
  }
  // Big turboprop / twin-prop / bizjet DO take the two-marking layout.
  for (const [hex, type, cat, what] of [
        ['bg1x', 'AT76', 'A5', 'turboprop'], ['bg2x', 'BE58', 'A1', 'twin-prop'],
        ['bg3x', 'LJ45', 'A2', 'bizjet']]) {
    upd([FP({ hex, callsign: 'ABC123', typeCode: type, category: cat, operator: 'ACME AIR' })]);
    const pls = withUD(rig(hex).asm, 'flightId');
    ok(`${what}: operator broadside + ID on the spine`,
       pls.length === 3 && rig(hex).idKey === 'ACME AIR|ABC123',
       `${pls.length} / ${rig(hex).idKey}`);
    upd([]); step(1, 3);
  }
  // PIA: hex only, and the operator is withheld on EVERY surface.
  upd([FP({ hex: 'piaop', callsign: 'SECRET2', reg: 'N2PIA', typeCode: 'B738',
            category: 'A3', operator: 'A VERY PRIVATE LLC', pia: true })]);
  ok('a PIA aircraft shows the hex and no operator anywhere',
     withUD(rig('piaop').asm, 'flightId').length === 2
     && rig('piaop').idKey === 'PIAOP|', rig('piaop').idKey);
  // A long operator SHRINKS instead of squashing: the plane stays inside the
  // fuselage length AND keeps its texture aspect.
  upd([]); step(1, 3);
  upd([{ ...BIG, hex: 'lay2', operator: 'WILMINGTON TRUST CO TRUSTEE' }]);
  const longFl = withUD(rig('lay2').asm, 'flightId')
    .filter(p => p.userData.flank !== 'top')[0];
  const longGeo = longFl.geometry.parameters;
  const longTex = longFl.material.map.image;
  ok('a long operator name stays within the fuselage',
     longGeo.width <= 2400 * 0.55 + 1e-6, `w=${longGeo.width}`);
  near('a long operator keeps its glyph aspect (no horizontal squash)',
       longGeo.width / longGeo.height, longTex.width / longTex.height, 1e-6);
  upd([]); step(1, 3);

  // ── 20. Sky objects never fog (wave-A finding) ─────────────────────────────
  // The compressed shell puts aircraft kilometres out, past any weather
  // FogExp2 falloff — without fog:false the whole fleet greys out while the sky
  // dome behind it still paints. Every material on a rig must opt out.
  upd([FP({ hex: 'fog1', callsign: 'UAL1', typeCode: 'B738', category: 'A3',
            operator: 'UNITED AIRLINES' })]);
  const fogged = [];
  rig('fog1').asm.traverse(o => {
    const mats = Array.isArray(o.material) ? o.material : (o.material ? [o.material] : []);
    for (const m of mats) if (m.fog !== false) fogged.push(`${o.type}/${m.type}`);
  });
  ok('every material on an aircraft rig has fog disabled', fogged.length === 0,
     fogged.slice(0, 4).join(', '));
  ok('…including the inverted-hull outline shells', (() => {
       const shells = [];
       rig('fog1').asm.traverse(o => { if (o.userData && o.userData.outline) shells.push(o); });
       return shells.length > 0 && shells.every(o => o.material.fog === false);
     })());
  ok('the outline shells use a per-model CLONE, not the shared material', (() => {
       const shells = [];
       rig('fog1').asm.traverse(o => { if (o.userData && o.userData.outline) shells.push(o); });
       return shells.every(o => o.material !== r._outlineMaterial);
     })());
  ok('the SHARED outline material still fogs (ground geometry unaffected)',
     r._outlineMaterial.fog !== false);
  // A dimmed (privacy) build takes the same exemption.
  upd([FP({ hex: 'fog2', callsign: 'X', typeCode: 'C172', category: 'A1', ladd: true })]);
  const fogged2 = [];
  rig('fog2').asm.traverse(o => {
    const mats = Array.isArray(o.material) ? o.material : (o.material ? [o.material] : []);
    for (const m of mats) if (m.fog !== false) fogged2.push(m.type);
  });
  ok('a privacy-dimmed rig is fog-exempt too', fogged2.length === 0, fogged2.join(', '));
  ok('the towed banner is fog-exempt', (() => {
       upd([FP({ hex: 'fog3', callsign: 'N9', typeCode: 'C172', category: 'A1' })]);
       const b = rig('fog3').banner;
       return !!b && b.children.every(c => c.material.fog === false); })());
  upd([]); step(1, 3);

  // ── 21. Aircraft are clickable → {kind:'flight', hex} ──────────────────────
  // Point the camera at a rig and raycast the canvas centre. The tag lives on
  // the ASSEMBLY, so the walker resolves the same aircraft from any part.
  upd([FP({ hex: 'clk1', callsign: 'DAL7', typeCode: 'B738', category: 'A3',
            operator: 'DELTA AIR LINES', lat: OLAT + 0.05, lon: OLON + 0.05 })]);
  const clk = rig('clk1');
  ok('the rig assembly carries the flight click tag',
     clk.asm.userData.kind === 'flight' && clk.asm.userData.hex === 'clk1'
     && clk.asm.userData.fixtureId === 'clk1');
  const wp = clk.asm.position.clone(); clk.asm.getWorldPosition(wp);
  const rect = r._renderer.domElement.getBoundingClientRect();
  const pickX = rect.left + rect.width / 2, pickY = rect.top + rect.height / 2;
  const aimAt = (t, dist) => {
    r.setCameraView([t.x, t.y + dist * 0.15, t.z + dist], [t.x, t.y, t.z]);
    r._camera.updateMatrixWorld(true);
    r._scene.updateMatrixWorld(true);
  };
  aimAt(wp, 6000);
  const hitBody = r._raycastFixture(pickX, pickY);
  ok('a click on the airframe surfaces the flight',
     !!hitBody && hitBody.kind === 'flight' && hitBody.hex === 'clk1'
     && hitBody.entity_id === null, JSON.stringify(hitBody));
  // …and on its camera-facing label plate, which floats above the model.
  const lp = clk.label.position.clone(); clk.label.getWorldPosition(lp);
  aimAt(lp, 6000);
  const hitLabel = r._raycastFixture(pickX, pickY);
  ok('a click on the label sprite surfaces the same flight',
     !!hitLabel && hitLabel.kind === 'flight' && hitLabel.hex === 'clk1',
     JSON.stringify(hitLabel));
  ok('the label sprite hangs off the tagged assembly (walker reaches it)',
     clk.label.parent === clk.asm);
  // Layer-hidden flights are not click targets (the lights precedent).
  r.setLayerVisibility({ flights: false });
  aimAt(wp, 6000);
  ok('a hidden Flights layer makes aircraft untappable',
     r._raycastFixture(pickX, pickY) === null);
  r.setLayerVisibility({});
  aimAt(wp, 6000);
  ok('showing the layer again restores the pick', (() => {
       const h = r._raycastFixture(pickX, pickY);
       return !!h && h.kind === 'flight'; })());
  // A model rebuild (late registry data) must RE-tag the new assembly.
  upd([FP({ hex: 'clk1', callsign: 'DAL7', typeCode: 'LJ45', category: 'A2',
            operator: 'DELTA AIR LINES', lat: OLAT + 0.05, lon: OLON + 0.05 })]);
  ok('a rebuilt model keeps its click tag',
     rig('clk1').archetype === 'bizjet' && rig('clk1').asm.userData.kind === 'flight'
     && rig('clk1').asm.userData.hex === 'clk1');
  upd([]); step(1, 3);

  // ── 24. User glow rules (docs/research/flight-glow-rules.md) ───────────────
  // The rule list arrives through updateFlights's opts; matching happens at POLL
  // cadence inside _syncFlightBeacon, and _advanceFlights only samples the
  // resolved pattern's envelope. Colours are read off the live materials.
  {
    const hex = m => m.color.getHex();
    const GR = (o) => ({ id: o.id ?? 'g', criteria: {}, pattern: 'flash', colorA: '#ffd400', ...o });
    const glowUpd = (list, rules, extra = {}) =>
      upd(list, { opts: { glowRules: rules, ...extra } });

    // (a) A matched operator rule REPLACES the default treatment entirely.
    upd([]); step(1, 3);
    const RULES_A = [GR({ id: 'swa', pattern: 'strobe', colorA: '#ff0000', colorB: '#ffffff',
                          criteria: { operator: 'Southwest' } })];
    const SWA = FP({ hex: 'gr1', category: 'A3', operator: 'Southwest Airlines Co.',
                     military: true, lon: OLON + 0.1 });
    glowUpd([SWA], RULES_A);
    ok('a matching rule builds the beacon in ITS colour, not the status colour',
       rig('gr1').beaconColor === 0xff0000, rig('gr1').beaconColor.toString(16));
    ok('a matching rule sets the rig glow pattern', rig('gr1').glowPattern === 'strobe',
       rig('gr1').glowPattern);
    ok('a two-colour rule arms the per-frame colour lerp', rig('gr1').glowTwoColor === true);
    ok('the rebuild key records pattern|colorA|colorB',
       rig('gr1').glowKey === 'strobe|#ff0000|#ffffff', rig('gr1').glowKey);
    ok('persistent per-rig Colors exist (built at POLL cadence, never per frame)',
       !!rig('gr1').glowColorA && !!rig('gr1').glowColorB && !!rig('gr1').glowCur
       && rig('gr1').glowColorA.getHex() === 0xff0000
       && rig('gr1').glowColorB.getHex() === 0xffffff);

    // Re-polling with an UNCHANGED resolution must not rebuild the bead/glow.
    const beadA = rig('gr1').beacon, glowA = rig('gr1').beaconGlow;
    glowUpd([SWA], RULES_A);
    ok('an unchanged resolved glow does NOT rebuild the bead/sprite',
       rig('gr1').beacon === beadA && rig('gr1').beaconGlow === glowA);

    // (b) strobe — TWO opacity pops per 1 s period, sampled through real frames.
    {
      // Start mid-GAP so the sweep covers a full period with BOTH pops' rising
      // edges inside the sample window (starting at a pop's own peak would hide
      // it — there is no earlier sample to rise from).
      rig('gr1').beaconPhase = 0.45;
      const bm = rig('gr1').beacon.material;
      const samples = [];
      for (let i = 0; i < 100; i++) { step(0.01); samples.push(bm.opacity); }
      let pops = 0;
      for (let i = 1; i < samples.length - 1; i++) {
        if (samples[i] > 0.6 && samples[i] >= samples[i - 1] && samples[i] > samples[i + 1]) pops++;
      }
      ok('strobe drives TWO opacity pops per second on the live material', pops === 2, `pops=${pops}`);
      ok('strobe rests dark between pops', Math.min(...samples) < 0.2, `min=${Math.min(...samples)}`);
      ok('strobe reaches full brightness', Math.max(...samples) > 0.98, `max=${Math.max(...samples)}`);
      // Its two pops carry the two DIFFERENT colours.
      rig('gr1').beaconPhase = 0; step(0.0001);
      const popAColor = hex(bm);
      rig('gr1').beaconPhase = 0.12; step(0.0001);
      const popBColor = hex(bm);
      ok('strobe pop 1 is colour A, pop 2 is colour B',
         popAColor === 0xff0000 && popBColor === 0xffffff,
         `${popAColor.toString(16)} / ${popBColor.toString(16)}`);
      ok('the halo sprite is recoloured in lockstep with the bead',
         hex(rig('gr1').beaconGlow.material) === popBColor);
    }

    // (c) rotate — never fully dark, and the colour eases with the brightness.
    upd([]); step(1, 3);
    glowUpd([FP({ hex: 'gr2', category: 'A3', lon: OLON + 0.1 })],
            [GR({ id: 'rot', pattern: 'rotate', colorA: '#0000ff', colorB: '#00ff00' })]);
    {
      const bm = rig('gr2').beacon.material;
      rig('gr2').beaconPhase = 0;
      let min = 1, max = 0;
      for (let i = 0; i < 250; i++) { step(0.01); min = Math.min(min, bm.opacity); max = Math.max(max, bm.opacity); }
      ok('rotate NEVER dips below its 0.35 floor (the beacon-vs-strobe tell)',
         min > 0.34, `min=${min}`);
      ok('rotate still reaches full brightness', max > 0.98, `max=${max}`);
      rig('gr2').beaconPhase = 0; step(0.0001);
      ok('rotate is colour A at its bright end', hex(bm) === 0x0000ff, hex(bm).toString(16));
      rig('gr2').beaconPhase = 1 / (0.9 * 2); step(0.0001);
      ok('rotate is colour B at its dim end', hex(bm) === 0x00ff00, hex(bm).toString(16));
      rig('gr2').beaconPhase = 1 / (0.9 * 4); step(0.0001);
      const mid = hex(bm);
      ok('rotate crossfades THROUGH the two colours (a genuine lerp)',
         mid !== 0x0000ff && mid !== 0x00ff00, mid.toString(16));
    }

    // (d) alternate — hard colour swap, constant brightness.
    upd([]); step(1, 3);
    glowUpd([FP({ hex: 'gr3', category: 'A3', lon: OLON + 0.1 })],
            [GR({ id: 'alt', pattern: 'alternate', colorA: '#ff00ff', colorB: '#00ffff' })]);
    {
      const bm = rig('gr3').beacon.material;
      rig('gr3').beaconPhase = 0.1; step(0.0001);
      const c1 = hex(bm), a1 = bm.opacity;
      rig('gr3').beaconPhase = 0.9; step(0.0001);
      const c2 = hex(bm), a2 = bm.opacity;
      rig('gr3').beaconPhase = 1.7; step(0.0001);
      const c3 = hex(bm);
      ok('alternate hard-swaps A → B → A every 0.8 s',
         c1 === 0xff00ff && c2 === 0x00ffff && c3 === 0xff00ff,
         [c1, c2, c3].map(c => c.toString(16)).join(' '));
      ok('alternate holds a constant brightness (colour is the whole signal)',
         a1 === a2 && a1 === 1, `${a1} / ${a2}`);
    }

    // (e) solid — static two-tone: colorA bead core, colorB halo, no lerp.
    upd([]); step(1, 3);
    glowUpd([FP({ hex: 'gr4', category: 'A3', lon: OLON + 0.1 })],
            [GR({ id: 'sol', pattern: 'solid', colorA: '#ff8800', colorB: '#2222ff' })]);
    {
      const bm = rig('gr4').beacon.material, gm = rig('gr4').beaconGlow.material;
      ok('solid: the bead is colour A, the halo is colour B (§2 exception)',
         hex(bm) === 0xff8800 && hex(gm) === 0x2222ff,
         `${hex(bm).toString(16)} / ${hex(gm).toString(16)}`);
      ok('solid does NOT arm the per-frame lerp', rig('gr4').glowTwoColor === false);
      const a0 = bm.opacity, g0 = gm.opacity;
      step(0.37, 9);
      ok('solid never animates its opacity', bm.opacity === a0 && gm.opacity === g0
         && a0 === 1 && Math.abs(g0 - 0.6) < 1e-9, `${a0} / ${g0}`);
      ok('solid never repaints its colours', hex(bm) === 0xff8800 && hex(gm) === 0x2222ff);
    }
    // A single-colour solid repeats colour A on the halo.
    upd([]); step(1, 3);
    glowUpd([FP({ hex: 'gr5', category: 'A3', lon: OLON + 0.1 })],
            [GR({ id: 'sol1', pattern: 'solid', colorA: '#ff8800' })]);
    ok('solid with no second colour tints the halo colour A too',
       hex(rig('gr5').beacon.material) === 0xff8800
       && hex(rig('gr5').beaconGlow.material) === 0xff8800);

    // (f) fade — a slow breathe with a smooth crossfade.
    upd([]); step(1, 3);
    glowUpd([FP({ hex: 'gr6', category: 'A3', lon: OLON + 0.1 })],
            [GR({ id: 'fd', pattern: 'fade', colorA: '#000000', colorB: '#ffffff' })]);
    {
      const bm = rig('gr6').beacon.material;
      rig('gr6').beaconPhase = 1.25; step(0.0001);
      const top = bm.opacity, topC = hex(bm);
      rig('gr6').beaconPhase = 3.75; step(0.0001);
      const bot = bm.opacity, botC = hex(bm);
      ok('fade peaks a quarter period in and bottoms three quarters in',
         Math.abs(top - 1) < 1e-6 && Math.abs(bot - 0.15) < 1e-6, `${top} / ${bot}`);
      ok('fade crossfades all the way between the two colours',
         topC === 0xffffff && botC === 0x000000,
         `${topC.toString(16)} / ${botC.toString(16)}`);
    }

    // (g) pattern 'none' MUTES an aircraft that would otherwise beacon.
    upd([]); step(1, 3);
    const MUTE = [GR({ id: 'mute', pattern: 'none', criteria: { ladd: true } })];
    glowUpd([FP({ hex: 'gr7', category: 'A3', ladd: true, lon: OLON + 0.1 })], MUTE);
    ok("pattern 'none' removes the bead + halo entirely",
       rig('gr7').beacon === null && rig('gr7').beaconGlow === null
       && rig('gr7').beaconColor === 0 && rig('gr7').glowKey === '',
       rig('gr7').glowPattern);
    ok("a 'none' rule does not disturb an aircraft it doesn't match", (() => {
      glowUpd([FP({ hex: 'gr7', category: 'A3', ladd: true, lon: OLON + 0.1 }),
               FP({ hex: 'gr8', category: 'A3', military: true, lon: OLON + 0.12 })], MUTE);
      return rig('gr8').beaconColor === 0x2ee56a && rig('gr7').beacon === null; })());

    // (h) an UNMATCHED aircraft keeps the default ladder EXACTLY.
    upd([]); step(1, 3);
    const NARROW = [GR({ id: 'nm', pattern: 'solid', colorA: '#123456',
                         criteria: { operator: 'NeverMatchesAnything' } })];
    glowUpd([FP({ hex: 'gr9', category: 'A3', military: true, lon: OLON + 0.1 })], NARROW);
    ok('an unmatched aircraft keeps the default military green + flash',
       rig('gr9').beaconColor === 0x2ee56a && rig('gr9').glowPattern === 'flash'
       && rig('gr9').glowTwoColor === false);
    // …and its envelope is the SHIPPED one, sampled on the live materials.
    {
      const bm = rig('gr9').beacon.material, gm = rig('gr9').beaconGlow.material;
      let worst = 0;
      for (let i = 0; i < 60; i++) {
        step(0.017);
        const t = rig('gr9').beaconPhase;
        const s = Math.max(0, Math.sin(2 * Math.PI * 1.2 * t)), f = s * s * s;
        worst = Math.max(worst, Math.abs(bm.opacity - (0.28 + 0.72 * f)),
                                Math.abs(gm.opacity - (0.10 + 0.85 * f)));
      }
      ok('the default flash envelope is byte-identical to the shipped beacon',
         worst < 1e-12, `worst=${worst}`);
      ok('a single-colour glow never repaints .color (default path untouched)',
         hex(bm) === 0x2ee56a && hex(gm) === 0x2ee56a);
    }

    // (i) EMERGENCY still wins end-to-end, through a matching user rule.
    upd([]); step(1, 3);
    glowUpd([FP({ hex: 'gra', category: 'A3', military: true, squawk: '7700', lon: OLON + 0.1 })],
            [GR({ id: 'hij', pattern: 'solid', colorA: '#00ff00', criteria: { military: true } })]);
    ok('an emergency aircraft ignores a matching user rule (red flash wins)',
       rig('gra').beaconColor === 0xff2a1a && rig('gra').glowPattern === 'flash');

    // (j) the master gate still silences user rules.
    upd([]); step(1, 3);
    glowUpd([FP({ hex: 'grb', category: 'A3', lon: OLON + 0.1 })],
            [GR({ id: 'any', pattern: 'solid', colorA: '#00ff00' })], { beacons: false });
    ok('beacons:false silences a user rule too', rig('grb').beacon === null);

    // (k) rules RE-RESOLVE on a poll update — a live rig switches in place.
    upd([]); step(1, 3);
    // `interesting` is fixed across the polls so the FALLBACK is the yellow
    // default — and, unlike military/LADD, it is not one of the three build-time
    // livery inputs, so nothing here can trigger a model rebuild and the "the
    // rig survives a glow change" assertion below stays honest.
    const AC = o => FP({ hex: 'grc', category: 'A3', operator: 'Acme Air',
                         interesting: true, altFt: 30000, lon: OLON + 0.1, ...o });
    const HI = [GR({ id: 'hi', pattern: 'rotate', colorA: '#00ff00',
                     criteria: { minAltFt: 20000 } })];
    glowUpd([AC()], HI);
    const asmBefore = rig('grc').asm, phaseBefore = (rig('grc').beaconPhase = 3.3);
    ok('a live rig picks up the altitude-keyed rule', rig('grc').glowPattern === 'rotate');
    // Same rig, new fix that no longer matches → back to the default ladder.
    glowUpd([AC({ altFt: 4000 })], HI);
    ok('a poll that stops matching falls back to the default ladder',
       rig('grc').glowPattern === 'flash' && rig('grc').beaconColor === 0xffd400,
       rig('grc').beaconColor.toString(16));
    ok('the rig itself is NOT rebuilt by a glow change (motion state survives)',
       rig('grc').asm === asmBefore && rig('grc').beaconPhase === phaseBefore);
    // Editing the RULE LIST (same aircraft) re-resolves too.
    glowUpd([AC({ altFt: 4000 })],
            [GR({ id: 'lo', pattern: 'alternate', colorA: '#ff0000', colorB: '#0000ff',
                  criteria: { maxAltFt: 10000 } })]);
    ok('editing the rule list re-resolves a live rig',
       rig('grc').glowPattern === 'alternate' && rig('grc').beaconColor === 0xff0000);
    // Dropping the rules entirely restores the default.
    glowUpd([AC({ altFt: 4000 })], undefined);
    ok('removing every rule restores the default ladder',
       rig('grc').glowPattern === 'flash' && rig('grc').beaconColor === 0xffd400);

    // (l) first-match-wins + disabled, end-to-end through the renderer.
    upd([]); step(1, 3);
    const ORDER = [
      GR({ id: 'first', pattern: 'solid', colorA: '#111111', criteria: { typeCode: 'B73*' } }),
      GR({ id: 'second', pattern: 'fade', colorA: '#222222', criteria: { operator: 'Acme' } }),
    ];
    const BOTH = FP({ hex: 'grd', category: 'A3', typeCode: 'B738',
                      operator: 'Acme Air', lon: OLON + 0.1 });
    glowUpd([BOTH], ORDER);
    ok('the FIRST matching rule wins in the renderer', rig('grd').beaconColor === 0x111111);
    glowUpd([BOTH], [ORDER[1], ORDER[0]]);
    ok('reordering the rules changes the live rig', rig('grd').beaconColor === 0x222222);
    glowUpd([BOTH], [{ ...ORDER[1], enabled: false }, ORDER[0]]);
    ok('a disabled rule is skipped in the renderer', rig('grd').beaconColor === 0x111111);

    // (m) a garbage rule list never reaches the rig (the renderer re-sanitizes,
    // it never trusts a hand-edited config to have been through setFlights).
    upd([]); step(1, 3);
    glowUpd([FP({ hex: 'gre', category: 'A3', military: true, lon: OLON + 0.1 })],
            [{ id: 'bad', pattern: 'sparkle', colorA: '#00ff00', criteria: {} },
             { id: 'bad2', pattern: 'solid', colorA: 'not-a-colour', criteria: {} }]);
    ok('an unusable rule list is dropped, the default ladder stands',
       rig('gre').beaconColor === 0x2ee56a && rig('gre').glowPattern === 'flash');
    ok('a non-array rule list is tolerated', (() => {
      glowUpd([FP({ hex: 'gre', category: 'A3', military: true, lon: OLON + 0.1 })], 'nope');
      return rig('gre').beaconColor === 0x2ee56a; })());

    // (n) a model rebuild (late registry data) re-applies the RESOLVED glow onto
    // the new assembly, not the old default.
    upd([]); step(1, 3);
    const REB = o => FP({ hex: 'grf', category: 'A3', operator: 'Acme Air', lon: OLON + 0.1, ...o });
    const REBR = [GR({ id: 'reb', pattern: 'alternate', colorA: '#ff0000', colorB: '#0000ff',
                       criteria: { operator: 'Acme' } })];
    glowUpd([REB()], REBR);
    const oldAsm = rig('grf').asm;
    glowUpd([REB({ typeCode: 'LJ45' })], REBR);      // → bizjet, model rebuild
    ok('a model rebuild re-attaches the RULE glow (not the default)',
       rig('grf').asm !== oldAsm && rig('grf').archetype === 'bizjet'
       && rig('grf').beaconColor === 0xff0000 && rig('grf').glowPattern === 'alternate',
       rig('grf').glowKey);
    ok('the rebuilt beacon still hangs off the NEW assembly',
       rig('grf').beacon.parent === rig('grf').asm
       && withUD(rig('grf').asm, 'beacon').length === 1);
    // A beaconless rig stays beaconless across a rebuild.
    upd([]); step(1, 3);
    glowUpd([FP({ hex: 'grg', category: 'A3', lon: OLON + 0.1 })], []);
    ok('an unflagged aircraft has no beacon', rig('grg').beacon === null);
    glowUpd([FP({ hex: 'grg', category: 'A3', typeCode: 'LJ45', lon: OLON + 0.1 })], []);
    ok('a beaconless rig stays beaconless through a model rebuild',
       rig('grg').beacon === null && rig('grg').glowKey === '');

    // (o) the fade-out still scales the glow — rig.fade multiplies every pattern.
    upd([]); step(1, 3);
    glowUpd([FP({ hex: 'grh', category: 'A3', lon: OLON + 0.1 })],
            [GR({ id: 'sd', pattern: 'solid', colorA: '#ff8800' })]);
    {
      const bm = rig('grh').beacon.material;
      step(0.05);
      ok('a live solid glow sits at full opacity', Math.abs(bm.opacity - 1) < 1e-9, bm.opacity);
      upd([]);                                    // vanished → dying
      step(0.3);
      ok('a dying rig fades its glow with the airframe',
         bm.opacity > 0 && bm.opacity < 1 && Math.abs(bm.opacity - rig('grh').fade) < 1e-9,
         `${bm.opacity} vs fade ${rig('grh').fade}`);
      step(1, 3);
    }

    // (p) ZERO per-frame allocation: the materials, the persistent Colors and
    // the scratch Color are all the SAME objects after many frames. (The source
    // rule is enforced by inspection — _advanceFlights constructs no Color and
    // parses no hex string; `lerpColors` writes into rig.glowCur in place.)
    upd([]); step(1, 3);
    glowUpd([FP({ hex: 'gri', category: 'A3', lon: OLON + 0.1 })],
            [GR({ id: 'zz', pattern: 'rotate', colorA: '#ff0000', colorB: '#00ff00' })]);
    {
      const g = rig('gri');
      const ids = [g.beacon.material, g.beaconGlow.material, g.glowColorA, g.glowColorB, g.glowCur,
                   g.beacon.material.color, g.beaconGlow.material.color];
      step(0.016, 120);
      ok('120 frames allocate no new glow objects (identity preserved)',
         g.beacon.material === ids[0] && g.beaconGlow.material === ids[1]
         && g.glowColorA === ids[2] && g.glowColorB === ids[3] && g.glowCur === ids[4]
         && g.beacon.material.color === ids[5] && g.beaconGlow.material.color === ids[6]);
      ok('the persistent source Colors are never mutated by the per-frame lerp',
         g.glowColorA.getHex() === 0xff0000 && g.glowColorB.getHex() === 0x00ff00);
      ok('the phase accumulates in SECONDS (not radians) and is not wrapped',
         g.beaconPhase > 1.9, `phase=${g.beaconPhase}`);
    }
    upd([]); step(1, 3);
  }

  // ── 25. Mobile taps: pointer-type tap gate + fat-finger aircraft pick ──────
  // User-reported: tapping a plane in the HA phone app never opened the info
  // card. Two causes — (1) the manual pointerdown/pointerup tap gate used the
  // MOUSE slop (5 px / 500 ms) for every pointer, and a finger tap routinely
  // travels further; (2) even a passing tap had to hit the dart's exact
  // geometry, which on a phone is a handful of pixels. Fix: touch pointers get
  // canvas-2d's synthesis tolerances (12 px / 600 ms), and a screen-space
  // nearest-aircraft fallback (`_raycastFlightNear`, 28 px touch / 12 px mouse)
  // runs AFTER the precise raycast misses.
  {
    const dom = r._renderer.domElement;
    // OrbitControls captures the pointer on pointerdown; our synthetic events
    // carry no real pointerId, so neuter the capture API for the dispatches.
    dom.setPointerCapture = () => {};
    dom.releasePointerCapture = () => {};
    dom.hasPointerCapture = () => false;

    const clicks = [];
    r.onFixtureClick(info => clicks.push(info));
    // timeStamp is spoofed per event so the gate's TIME arm is testable without
    // real waits (and so consecutive taps never look like a 350 ms dblclick).
    let tsBase = 100000;
    const pev = (type, x, y, pointerType, ts) => {
      const e = new PointerEvent(type, {
        clientX: x, clientY: y, pointerType, pointerId: 1,
        bubbles: true, cancelable: true, isPrimary: true, view: window });
      Object.defineProperty(e, 'timeStamp', { value: ts, configurable: true });
      return e;
    };
    const tapAt = (x, y, dx, dy, pointerType, dtMs = 10) => {
      clicks.length = 0;
      tsBase += 5000;
      dom.dispatchEvent(pev('pointerdown', x, y, pointerType, tsBase));
      dom.dispatchEvent(pev('pointerup', x + dx, y + dy, pointerType, tsBase + dtMs));
      return clicks.slice();
    };

    upd([FP({ hex: 'tap1', callsign: 'UAL9', typeCode: 'B738', category: 'A3',
              lat: OLAT + 0.05, lon: OLON + 0.05 })]);
    const tRect = dom.getBoundingClientRect();
    ok('the harness canvas has a real rect (the px pick needs one)',
       tRect.width > 100 && tRect.height > 100, `${tRect.width}x${tRect.height}`);
    const twp = r._camera.position.clone(); rig('tap1').asm.getWorldPosition(twp);
    // Far enough back that the airframe covers well under the 150 px probe
    // offset below (the models are ~2x scale; from 6 m one fills the canvas).
    const AIM = 40000;
    aimAt(twp, AIM);
    // The rig's own projected client px — the same NDC→rect math the pick uses.
    const projPx = obj => {
      const v = r._camera.position.clone();
      obj.getWorldPosition(v);
      v.project(r._camera);
      return { x: tRect.left + (v.x * 0.5 + 0.5) * tRect.width,
               y: tRect.top + (-v.y * 0.5 + 0.5) * tRect.height };
    };
    const P = projPx(rig('tap1').asm);
    ok('the aimed rig projects inside the canvas',
       P.x > tRect.left && P.x < tRect.right && P.y > tRect.top && P.y < tRect.bottom,
       `${P.x.toFixed(1)},${P.y.toFixed(1)}`);

    // (a) tap gate — slop is pointer-type aware.
    ok('a touch tap that drifts 10 px still opens the aircraft',
       tapAt(P.x, P.y, 7, 7, 'touch').some(c => c.kind === 'flight' && c.hex === 'tap1'));
    ok('a MOUSE drag of the same 10 px is still a micro-orbit, not a click',
       tapAt(P.x, P.y, 7, 7, 'mouse').length === 0);
    ok('a tight 3 px mouse click still opens the aircraft',
       tapAt(P.x, P.y, 3, 0, 'mouse').some(c => c.kind === 'flight' && c.hex === 'tap1'));
    ok('a touch drag past 12 px is a drag, not a tap',
       tapAt(P.x, P.y, 13, 0, 'touch').length === 0);
    // …and the TIME arm: 550 ms is a touch tap but a mouse hold.
    ok('a 550 ms touch tap still counts (600 ms window)',
       tapAt(P.x, P.y, 0, 0, 'touch', 550).some(c => c.kind === 'flight'));
    ok('a 550 ms mouse press does not (500 ms window)',
       tapAt(P.x, P.y, 0, 0, 'mouse', 550).length === 0);
    ok('a 650 ms touch press is a long press, not a tap',
       tapAt(P.x, P.y, 0, 0, 'touch', 650).length === 0);

    // (b) the screen-space pick itself.
    const OFF = 150;                                   // far outside the model
    ok('the precise raycast misses well off the airframe',
       r._raycastFixture(P.x, P.y + OFF) === null);
    const nearHit = r._raycastFlightNear(P.x, P.y + OFF, 250);
    ok('the nearest-aircraft pick finds it inside the radius',
       !!nearHit && nearHit.kind === 'flight' && nearHit.hex === 'tap1'
       && nearHit.fixtureId === 'tap1' && nearHit.entity_id === null,
       JSON.stringify(nearHit));
    ok('outside the radius it picks nothing',
       r._raycastFlightNear(P.x, P.y + OFF, 28) === null);
    ok('dead on the projected point it picks with a tiny radius',
       (r._raycastFlightNear(P.x, P.y, 3) || {}).hex === 'tap1');
    // Layer-hidden flights are untappable — the lights precedent, mirrored.
    r.setLayerVisibility({ flights: false });
    ok('a hidden Flights layer makes the proximity pick inert',
       r._raycastFlightNear(P.x, P.y + OFF, 250) === null);
    r.setLayerVisibility({});
    ok('showing the layer again restores the proximity pick',
       (r._raycastFlightNear(P.x, P.y + OFF, 250) || {}).hex === 'tap1');
    // A rig fading out of the sky is not a target.
    {
      const g = rig('tap1'); const keep = g.fade; g.fade = 0;
      ok('a fully faded rig is not a proximity target',
         r._raycastFlightNear(P.x, P.y + OFF, 250) === null);
      g.fade = keep;
    }
    // Behind the camera: `project` wraps such a point onto the screen, so the
    // camera-forward dot must reject it.
    r.setCameraView([twp.x, twp.y, twp.z + 6000], [twp.x, twp.y, twp.z + 18000]);
    r._camera.updateMatrixWorld(true); r._scene.updateMatrixWorld(true);
    ok('an aircraft behind the camera never picks',
       r._raycastFlightNear(tRect.left + tRect.width / 2,
                            tRect.top + tRect.height / 2, 400) === null);
    aimAt(twp, AIM);

    // (c) nearest wins when two aircraft are both in range.
    upd([FP({ hex: 'tap1', callsign: 'UAL9', typeCode: 'B738', category: 'A3',
              lat: OLAT + 0.05, lon: OLON + 0.05 }),
         FP({ hex: 'tap2', callsign: 'AAL2', typeCode: 'B738', category: 'A3',
              lat: OLAT + 0.05, lon: OLON + 0.055 })]);
    aimAt(twp, 12000);
    {
      const P1 = projPx(rig('tap1').asm), P2 = projPx(rig('tap2').asm);
      const sep = Math.hypot(P2.x - P1.x, P2.y - P1.y);
      ok('the two rigs project to distinct screen points', sep > 20, `sep=${sep.toFixed(1)}px`);
      const mx = P1.x + (P2.x - P1.x) * 0.3, my = P1.y + (P2.y - P1.y) * 0.3;
      ok('the pick returns the NEAREST of two in-range aircraft',
         (r._raycastFlightNear(mx, my, sep * 2) || {}).hex === 'tap1');
      const nx = P1.x + (P2.x - P1.x) * 0.7, ny = P1.y + (P2.y - P1.y) * 0.7;
      ok('…and the other one from the other side',
         (r._raycastFlightNear(nx, ny, sep * 2) || {}).hex === 'tap2');
    }

    // (d) wiring + priority inside the pointerup handler. Stubbing the precise
    // raycast keeps this independent of how many px the airframe covers.
    aimAt(twp, AIM);
    const realRF = r._raycastFixture.bind(r);
    r._raycastFixture = () => null;
    ok('a touch tap 20 px off the dart still opens the aircraft (fallback wired)',
       tapAt(P.x, P.y + 20, 0, 0, 'touch').some(c => c.kind === 'flight' && c.hex === 'tap1'));
    ok('a MOUSE click 20 px off does not (12 px mouse radius)',
       tapAt(P.x, P.y + 20, 0, 0, 'mouse').length === 0);
    ok('a mouse click 8 px off does (inside the 12 px mouse radius)',
       tapAt(P.x, P.y + 8, 0, 0, 'mouse').some(c => c.kind === 'flight'));
    ok('a touch tap 40 px off does not (outside the 28 px touch radius)',
       tapAt(P.x, P.y + 40, 0, 0, 'touch').length === 0);
    // Precise beats proximity: a fixture under the finger must win over a dart.
    r._raycastFixture = () => ({ kind: 'light', entity_id: 'light.x', fixtureId: 'L1' });
    ok('a precise fixture hit beats the nearby aircraft',
       (tapAt(P.x, P.y, 0, 0, 'touch')[0] || {}).kind === 'light');
    r._raycastFixture = realRF;
    // Two rapid proximity taps both open the card (aircraft have no dblclick
    // action, so the proximity path clears the dblclick timer rather than
    // arming it and swallowing the second tap).
    r._raycastFixture = () => null;
    {
      clicks.length = 0;
      tsBase += 5000;
      dom.dispatchEvent(pev('pointerdown', P.x, P.y + 20, 'touch', tsBase));
      dom.dispatchEvent(pev('pointerup', P.x, P.y + 20, 'touch', tsBase + 10));
      dom.dispatchEvent(pev('pointerdown', P.x, P.y + 20, 'touch', tsBase + 120));
      dom.dispatchEvent(pev('pointerup', P.x, P.y + 20, 'touch', tsBase + 130));
      ok('two rapid proximity taps both open the flight card',
         clicks.length === 2 && clicks.every(c => c.kind === 'flight' && c.hex === 'tap1'),
         `${clicks.length} clicks`);
    }
    r._raycastFixture = realRF;
    r.onFixtureClick(() => {});
    upd([]); step(1, 3);
  }

  // ── 26. Banded speed visualisation (FlightsConfig.speedViz) ────────────────
  // Five bands (flights.ts's flightSpeedBand) each own a distinct effect set.
  // The renderer resolves the band ITSELF from the FlightPoint at POLL cadence
  // and rebuilds only on a change; everything per-frame is buffer refills and
  // opacity writes.
  {
    upd([]); step(1, 3);
    // Ground speed in KNOTS; the band thresholds are km/h (kt × 1.852).
    const SP = (hex, gsKt, extra = {}) => FP({
      hex, gsKt, trackDeg: 90, lat: OLAT + 0.12, lon: OLON + 0.12, altFt: 9000, ...extra });
    const bandOf = h => rig(h).speedBand;
    const trailPts = h => {
      const l = rig(h).trailLine;
      return l ? l.geometry.attributes.position.count : 0;
    };

    // (a) band 1 — hover: rotor blur disc, and deliberately NO trail geometry.
    upd([SP('sv1', 20, { category: 'A7' })]);          // A7 → helicopter
    {
      const g = rig('sv1');
      ok('26a: a hovering aircraft resolves to band 1', bandOf('sv1') === 1, `band=${bandOf('sv1')}`);
      ok('26a: band 1 builds a rotor blur disc', g.propDiscs.length >= 1,
         `n=${g.propDiscs.length}`);
      ok('26a: the rotor disc is HORIZONTAL (the rotor turns about Y)',
         Math.abs(g.propDiscs[0].rotation.x + Math.PI / 2) < 1e-6);
      ok('26a: band 1 builds NO trail geometry (the absence IS the hover cue)',
         g.trailLine === null && g.ribbon === null);
      ok('26a: band 1 has no contrail, burners or ghosts',
         g.burners.length === 0 && g.ghosts.length === 0 && g.motionLines.length === 0);
      // Station-keeping wobble rides the DRAWN transform, never rig.cur*.
      const cx = g.curX, cy = g.curY;
      step(0.1, 6);
      ok('26a: the hover jitter moves the drawn position off the eased one',
         Math.abs(g.asm.position.y - g.curY) > 1e-6 || Math.abs(g.asm.position.x - g.curX) > 1e-6,
         `dy=${(g.asm.position.y - g.curY).toFixed(2)}`);
      ok('26a: …and does NOT feed back into the eased path',
         Math.abs(g.curX - cx) < 60 && Math.abs(g.curY - cy) < 60);
      ok('26a: the jitter stays bounded (a wobble, not a drift)',
         Math.abs(g.asm.position.y - g.curY) <= 61 && Math.abs(g.asm.position.x - g.curX) <= 36);
    }

    // (b) band 2 — short comet tail (4 points) + a dimmer prop blur.
    upd([]); step(1, 3);
    upd([SP('sv2', 60, { category: 'A1' })]);          // 111 km/h, GA single
    {
      const g = rig('sv2');
      ok('26b: 60 kt resolves to band 2', bandOf('sv2') === 2, `band=${bandOf('sv2')}`);
      ok('26b: band 2 builds a 4-point comet tail', trailPts('sv2') === 4, `pts=${trailPts('sv2')}`);
      ok('26b: band 2 keeps a (dimmer) prop blur disc', g.propDiscs.length >= 1);
      ok('26b: the band-2 disc is dimmer than the band-1 one',
         g.propDiscs[0].userData.baseOpacity < 0.34,
         String(g.propDiscs[0].userData.baseOpacity));
      ok('26b: band 2 has no contrail', g.ribbon === null);
      step(0.2, 6);
      const line = g.trailLine;
      ok('26b: the tail draws once history exists',
         line.geometry.drawRange.count >= 2, `n=${line.geometry.drawRange.count}`);
