      ok('26b: the tail never draws more points than it allocated',
         line.geometry.drawRange.count <= 4);
      ok('26b: the tail is additive + depth-write-free (it must not occlude)',
         line.material.blending === mod.THREE?.AdditiveBlending
           || line.material.transparent === true,
         'transparent=' + line.material.transparent);
      ok('26b: the newest tail point IS the live TAIL EXIT (welded, not lagging)',
         (() => {
           const a = line.geometry.attributes.position.array;
           const n = line.geometry.drawRange.count;
           // The spine anchors at the tail, never the assembly origin (which
           // sits mid-fuselage) — see (l). Float32 attribute storage vs the
           // rig's float64 state: 1 mm at ~100 m offsets is the storage
           // precision, not a lag.
           const t = r._flightTailAnchor(g, g.asm.position.clone());
           return Math.abs(a[(n - 1) * 3] - t.x) < 1
             && Math.abs(a[(n - 1) * 3 + 2] - t.z) < 1;
         })());
      ok('26b: the tail brightness ramps toward the aircraft (the fade)',
         (() => {
           const c = line.geometry.attributes.color.array;
           const n = line.geometry.drawRange.count;
           return c[(n - 1) * 3 + 2] > c[2];
         })());
    }

    // (c) band 3 — medium tail (8 points) + two motion-line strips.
    upd([]); step(1, 3);
    upd([SP('sv3', 150)]);                              // 278 km/h
    {
      const g = rig('sv3');
      ok('26c: 150 kt resolves to band 3', bandOf('sv3') === 3, `band=${bandOf('sv3')}`);
      ok('26c: band 3 builds an 8-point comet tail', trailPts('sv3') === 8, `pts=${trailPts('sv3')}`);
      ok('26c: band 3 builds exactly 2 motion-line strips', g.motionLines.length === 2);
      ok('26c: the motion lines sit BEHIND the airframe (+Z is aft of the −Z nose)',
         g.motionLines.every(m => m.position.z > 0));
      ok('26c: the motion lines are mirrored across the fuselage',
         Math.abs(g.motionLines[0].position.x + g.motionLines[1].position.x) < 1e-6);
      ok('26c: band 3 has no contrail, burners or ghosts',
         g.ribbon === null && g.burners.length === 0 && g.ghosts.length === 0);
      const o0 = g.motionLines[0].material.opacity;
      step(0.05, 3);
      ok('26c: the motion lines flicker per frame',
         Math.abs(g.motionLines[0].material.opacity - o0) > 1e-6);
    }

    // (d) band 4 — the comet tail is REPLACED by a contrail ribbon.
    upd([]); step(1, 3);
    upd([SP('sv4', 300)]);                              // 556 km/h
    {
      const g = rig('sv4');
      ok('26d: 300 kt resolves to band 4', bandOf('sv4') === 4, `band=${bandOf('sv4')}`);
      ok('26d: band 4 builds a contrail ribbon', g.ribbon !== null);
      ok('26d: …and REPLACES the comet tail (not both)', g.trailLine === null);
      ok('26d: the ribbon is an indexed strip over 12 spine samples',
         g.ribbon.geometry.attributes.position.count === 24
         && g.ribbon.geometry.index.count === 11 * 6,
         `${g.ribbon.geometry.attributes.position.count} verts`);
      ok('26d: band 4 has no burners or ghosts (those are band 5)',
         g.burners.length === 0 && g.ghosts.length === 0);
      step(0.2, 8);
      ok('26d: the ribbon draws once history exists',
         g.ribbon.geometry.drawRange.count >= 6, `idx=${g.ribbon.geometry.drawRange.count}`);
      ok('26d: the ribbon alpha ramps 0 → peak → 0 along its length',
         (() => {
           const c = g.ribbon.geometry.attributes.color.array;
           const n = g.ribbon.geometry.drawRange.count / 6 + 1;
           const mid = Math.floor(n / 2);
           return c[0] < c[mid * 6] && c[(n - 1) * 6] < c[mid * 6];
         })());
      ok('26d: the ribbon widens toward the tail',
         (() => {
           const a = g.ribbon.geometry.attributes.position.array;
           const n = g.ribbon.geometry.drawRange.count / 6 + 1;
           const w = i => Math.hypot(a[i * 6] - a[i * 6 + 3], a[i * 6 + 1] - a[i * 6 + 4],
                                     a[i * 6 + 2] - a[i * 6 + 5]);
           return w(0) > w(n - 1);
         })(), 'far end wider than the aircraft end');
    }

    // (e) band 5 — contrail + afterburner + 2 ghosts, and a ONE-SHOT vapor
    // flash on ENTERING the band (never in steady state).
    upd([]); step(1, 3);
    upd([SP('sv5', 300)]); step(0.2, 4);                // start in band 4…
    ok('26e: the rig starts in band 4', bandOf('sv5') === 4);
    ok('26e: a rig that has never been band 5 has no vapor flash', rig('sv5').vapor === null);
    upd([SP('sv5', 450)]);                              // …then cross into band 5
    {
      const g = rig('sv5');
      ok('26e: 450 kt resolves to band 5', bandOf('sv5') === 5, `band=${bandOf('sv5')}`);
      ok('26e: band 5 keeps the contrail ribbon', g.ribbon !== null);
      ok('26e: band 5 builds afterburner strips', g.burners.length >= 2, `n=${g.burners.length}`);
      ok('26e: the burners trail aft of their engines (+Z)',
         g.burners.every(b => b.position.z > 0));
      ok('26e: band 5 builds exactly 2 ghost multiples', g.ghosts.length === 2);
      ok('26e: the ghosts sit at increasing lags behind the airframe',
         g.ghosts[0].position.z > 0 && g.ghosts[1].position.z > g.ghosts[0].position.z);
      ok('26e: the second ghost is fainter than the first',
         g.ghosts[1].material.opacity < g.ghosts[0].material.opacity);
      ok('26e: crossing INTO band 5 fires the one-shot vapor flash', g.vapor !== null);
      step(0.15);
      const peak = g.vapor && g.vapor.material.opacity;
      ok('26e: the flash spikes to a visible opacity', peak > 0.05, `op=${(peak ?? 0).toFixed(3)}`);
      step(0.15, 6);                                    // total > FLIGHT_VAPOR_S (0.8 s)
      ok('26e: …and decays away, disposing itself', g.vapor === null);
      // Staying fast must NOT re-arm it.
      upd([SP('sv5', 460)]);
      ok('26e: staying in band 5 does not re-arm the flash',
         g.vapor === null && bandOf('sv5') === 5);
      const bo = g.burners[0].material.opacity;
      step(0.05, 3);
      ok('26e: the burners flicker per frame',
         Math.abs(g.burners[0].material.opacity - bo) > 1e-6);
    }

    // (f) hysteresis is live on the rig: a speed inside the dead band must NOT
    // rebuild the effect set (the whole point of the guard).
    {
      const before = rig('sv5').ribbon;
      upd([SP('sv5', 372)]);                            // 689 km/h — inside 700 − 15
      ok('26f: a speed inside the dead band holds the band', bandOf('sv5') === 5);
      ok('26f: …and does not rebuild the ribbon', rig('sv5').ribbon === before);
      upd([SP('sv5', 369)]);                            // 683 km/h — past the margin
      ok('26f: clearing the margin drops the band', bandOf('sv5') === 4);
      ok('26f: dropping out of band 5 tears down burners + ghosts',
         rig('sv5').burners.length === 0 && rig('sv5').ghosts.length === 0);
    }

    // (g) trail rides the DISPLAY position: a poll CORRECTION must not kink it.
    upd([]); step(1, 3);
    {
      const straight = t => SP('kink', 300, {
        lat: OLAT + 0.10, lon: OLON + 0.10 + t * 0.004, altFt: 20000 });
      upd([straight(0)]);
      for (let i = 0; i < 12; i++) { upd([straight(i)]); step(0.15); }
      // A deliberately LARGE correction — the kind that would jump-cut a naive
      // trail that sampled the raw fix instead of the eased display position.
      upd([SP('kink', 300, { lat: OLAT + 0.13, lon: OLON + 0.17, altFt: 20000 })]);
      for (let i = 0; i < 12; i++) step(0.15);
      const g = rig('kink');
      const a = g.ribbon.geometry.attributes.position.array;
      const n = g.ribbon.geometry.drawRange.count / 6 + 1;
      // Spine point i is the midpoint of its two ribbon vertices.
      const pt = i => [(a[i * 6] + a[i * 6 + 3]) / 2, (a[i * 6 + 1] + a[i * 6 + 4]) / 2,
                       (a[i * 6 + 2] + a[i * 6 + 5]) / 2];
      let maxTurn = 0, segs = 0;
      for (let i = 1; i + 1 < n; i++) {
        const p0 = pt(i - 1), p1 = pt(i), p2 = pt(i + 1);
        const u = [p1[0] - p0[0], p1[1] - p0[1], p1[2] - p0[2]];
        const v = [p2[0] - p1[0], p2[1] - p1[1], p2[2] - p1[2]];
        const lu = Math.hypot(...u), lv = Math.hypot(...v);
        if (lu < 1e-6 || lv < 1e-6) continue;
        const d = (u[0] * v[0] + u[1] * v[1] + u[2] * v[2]) / (lu * lv);
        maxTurn = Math.max(maxTurn, Math.acos(Math.max(-1, Math.min(1, d))));
        segs++;
      }
      ok('26g: the trail has real segments to measure', segs >= 4, `segs=${segs}`);
      ok('26g: no kink — every consecutive turn stays under 30°',
         maxTurn < Math.PI / 6, `max=${(maxTurn * 180 / Math.PI).toFixed(1)}°`);
    }

    // (h) effects must never paint over the readable parts of a rig.
    upd([]); step(1, 3);
    upd([SP('ord', 300, { interesting: true, callsign: 'ORD1' })]); step(0.2, 4);
    {
      const g = rig('ord');
      ok('26h: the label + beacon exist to compare against',
         g.label !== null && g.beacon !== null);
      ok('26h: the contrail renders BELOW the label sprite',
         g.ribbon.renderOrder < g.label.renderOrder);
      ok('26h: …and below the status beacon',
         g.ribbon.renderOrder < g.beacon.renderOrder
         && g.ribbon.renderOrder < g.beaconGlow.renderOrder);
      ok('26h: every band effect is outline-skipped (no inverted-hull shells)',
         g.ribbon.userData.outlineSkip === true);
      ok('26h: every band effect is fog-exempt (aircraft are sky objects)',
         g.ribbon.material.fog === false);
      ok('26h: band effects are not depth-writers', g.ribbon.material.depthWrite === false);
    }

    // (i) the trail lives OUTSIDE the rig assembly — it must not inherit the
    // aircraft's yaw/scale, and must not become a click target.
    {
      const g = rig('ord');
      ok('26i: the trail is parented to the effects layer, not the assembly',
         g.ribbon.parent === g.viz && g.viz.parent === r._flightVizGroup);
      ok('26i: the effects layer shares the rig group transform exactly',
         r._flightVizGroup.position.equals(r._flightsGroup.position));
      ok('26i: the effects layer is NOT the aircraft raycast root',
         r._flightVizGroup !== r._flightsGroup
         && r._flightsGroup.children.every(c => c !== g.viz));
      ok('26i: the rig group still holds exactly one child per aircraft',
         r._flightsGroup.children.length === r._flightRigs.size,
         `${r._flightsGroup.children.length} vs ${r._flightRigs.size}`);
    }

    // (j) disposal: a vanished rig takes its effects with it.
    upd([]); step(1, 3);
    ok('26j: a disposed rig removes its effects group too',
       r._flightVizGroup.children.length === 0,
       `n=${r._flightVizGroup.children.length}`);

    // (k) speedViz:false builds nothing at all, and toggling back rebuilds.
    upd([SP('off1', 300)], { opts: { speedViz: false } });
    {
      const g = rig('off1');
      ok('26k: speedViz:false resolves no band', g.speedBand === 0);
      ok('26k: speedViz:false builds no trail, ribbon, burners, ghosts or discs',
         g.trailLine === null && g.ribbon === null && g.burners.length === 0
         && g.ghosts.length === 0 && g.propDiscs.length === 0
         && g.motionLines.length === 0 && g.vapor === null);
      step(0.2, 6);
      ok('26k: …and stays inert across frames', g.ribbon === null && g.speedBand === 0);
      ok('26k: the effects layer stays empty', r._flightVizGroup.children.length === 1
         && r._flightVizGroup.children[0].children.length === 0);
      upd([SP('off1', 300)]);                            // opts absent = ON
      ok('26k: an absent speedViz flag means ON (stale-chunk safe)',
         rig('off1').speedBand === 4 && rig('off1').ribbon !== null);
      upd([SP('off1', 300)], { opts: { speedViz: false } });
      ok('26k: turning it back off tears the effects down',
         rig('off1').ribbon === null && rig('off1').speedBand === 0);
    }
    // (l) TRAILING EFFECTS START AT THE TAIL EXIT, NEVER THE MODEL CENTRE.
    // User-reported at 290 kt (band 4) and 560 kt (band 5): "the plane
    // visualization is bisecting the plane 2/3 of the way back in the body".
    // `rig.cur*` is the ASSEMBLY ORIGIN, which sits mid-fuselage — a spine
    // anchored there ran the contrail straight through the airframe. The ring
    // buffer now stores TAIL positions, so the invariant holds at every sample
    // age, not just at the live head.
    upd([]); step(1, 3);
    {
      const MET = h => r._flightArchetypeMetrics(rig(h).archetype);
      const cen = h => { const g = rig(h); return { x: g.curX, y: g.curY, z: g.curZ }; };
      // Horizontal (display-plane) distance from the model centre — the plane
      // the report is about; height is the independently-scaled axis.
      const hDist = (x, z, c) => Math.hypot(x - c.x, z - c.z);
      const ribbonVerts = h => {
        const g = rig(h), a = g.ribbon.geometry.attributes.position.array;
        const n = g.ribbon.geometry.drawRange.count / 6 + 1, out = [];
        for (let i = 0; i < n; i++) {
          out.push([a[i * 6], a[i * 6 + 1], a[i * 6 + 2]]);
          out.push([a[i * 6 + 3], a[i * 6 + 4], a[i * 6 + 5]]);
        }
        return out;
      };
      const tailVerts = h => {
        const l = rig(h).trailLine, a = l.geometry.attributes.position.array;
        const n = l.geometry.drawRange.count, out = [];
        for (let i = 0; i < n; i++) out.push([a[i * 3], a[i * 3 + 1], a[i * 3 + 2]]);
        return out;
      };
      const minClear = (verts, h) => {
        const c = cen(h);
        return verts.reduce((m, v) => Math.min(m, hDist(v[0], v[2], c)), Infinity);
      };
      // Every burner strip must start at/behind the nozzle of the pod it belongs to.
      const nozzleOk = h => {
        const q = rig(h), pods = withUD(q.asm, 'nacelle');
        return pods.length > 0 && q.burners.length > 0 && q.burners.every(b =>
          pods.some(p => Math.abs(b.position.x - p.position.x) < 1
            && b.position.z >= p.position.z + p.userData.podLen / 2 - 1e-6));
      };
      // Fly a rig straight for a while so the ring buffer holds real history.
      const fly = (hex, gsKt, extra, frames = 14) => {
        const at = t => SP(hex, gsKt, {
          lat: OLAT + 0.10, lon: OLON + 0.10 + t * 0.004, altFt: 21000, ...extra });
        upd([at(0)]);
        for (let i = 0; i < frames; i++) { upd([at(i)]); step(0.15); }
        return rig(hex);
      };

      // 290 kt — the reported band-4 case.
      {
        const g = fly('tx4', 290, {});
        const M = MET('tx4'), sc = r._flightRigScale(g);
        ok('26l: 290 kt (the reported case) is band 4 with a contrail',
           g.speedBand === 4 && g.ribbon !== null, `band=${g.speedBand}`);
        const verts = ribbonVerts('tx4');
        ok('26l: the ribbon has real vertices to measure', verts.length >= 8,
           `n=${verts.length}`);
        // The pinned invariant: NO ribbon vertex may lie within the fuselage span.
        ok('26l: NO contrail vertex lies inside the fuselage (≥ fusLen/2 · scale)',
           minClear(verts, 'tx4') >= M.fusLen / 2 * sc - 2,
           `min=${minClear(verts, 'tx4').toFixed(0)} vs ${(M.fusLen / 2 * sc).toFixed(0)}`);
        // …and the stricter truth: it clears the rear-most DRAWN surface too.
        ok('26l: …and clears the rear-most drawn surface (aftZ · scale)',
           minClear(verts, 'tx4') >= M.aftZ * sc - 2,
           `min=${minClear(verts, 'tx4').toFixed(0)} vs ${(M.aftZ * sc).toFixed(0)}`);
        // The head sits EXACTLY at the tail exit — not short of it, not adrift.
        const head = r._flightTailAnchor(g, g.asm.position.clone());
        near('26l: the spine head is exactly the tail-exit anchor',
             hDist(head.x, head.z, cen('tx4')), (M.aftZ + 140) * sc, 2);
        ok('26l: every ribbon vertex is AFT of the aircraft (never ahead of the nose)',
           (() => {
             const c = cen('tx4');
             // Aft world dir for the drawn yaw: local +Z under R_y is (sin, cos).
             const ax = Math.sin(g.yaw), az = Math.cos(g.yaw);
             return verts.every(v => (v[0] - c.x) * ax + (v[2] - c.z) * az > 0);
           })());
      }

      // 560 kt — the reported band-5 case: contrail + burners + ghosts.
      upd([]); step(1, 3);
      {
        const g = fly('tx5', 560, {});
        const M = MET('tx5'), sc = r._flightRigScale(g);
        ok('26l: 560 kt (the reported case) is band 5', g.speedBand === 5,
           `band=${g.speedBand}`);
        ok('26l: no band-5 contrail vertex lies inside the fuselage',
           minClear(ribbonVerts('tx5'), 'tx5') >= M.fusLen / 2 * sc - 2,
           `min=${minClear(ribbonVerts('tx5'), 'tx5').toFixed(0)}`);
        // Afterburner strips emanate from the ENGINE NOZZLE, in the model frame.
        // Checked on a WIDEBODY too: its 660 mm pods are the ones a flat +300
        // standoff started 30 mm inside — the plume has to clear the pod it
        // belongs to, whatever that pod's length.
        ok('26l: the burner strips start at/behind their engine nozzle',
           nozzleOk('tx5'),
           `burner z=${g.burners.map(b => b.position.z.toFixed(0)).join(',')}`);
        ok('26l: …and no burner strip reaches forward into the fuselage',
           g.burners.every(b => b.position.z > 0));
        // Ghost multiples: the FIRST one's leading face must clear the tail.
        const gh0 = g.ghosts[0], gh1 = g.ghosts[1];
        const face = m => m.position.z - (M.fusLen * 0.8 / 2) * m.scale.z;
        ok('26l: the first ghost\'s leading face clears the tail exit',
           face(gh0) >= M.aftZ, `face=${face(gh0).toFixed(0)} vs aftZ=${M.aftZ}`);
        ok('26l: the second ghost trails the first without overlapping it',
           face(gh1) > gh0.position.z + (M.fusLen * 0.4) * gh0.scale.z - 1,
           `face1=${face(gh1).toFixed(0)}`);
      }
      {
        upd([]); step(1, 3);
        const w = fly('txw', 560, { category: 'A5' }, 6);   // widebody, 660 mm pods
        ok('26l: a widebody\'s longer pods get the same nozzle standoff',
           w.archetype === 'widebody' && nozzleOk('txw'),
           `${w.archetype} z=${w.burners.map(b => b.position.z.toFixed(0)).join(',')}`);
        ok('26l: …and its ghost multiples clear its (longer) tail too',
           (() => {
             const M = MET('txw');
             return w.ghosts[0].position.z - (M.fusLen * 0.8 / 2) * w.ghosts[0].scale.z
               >= M.aftZ;
           })());
      }

      // A helicopter's "fuselage" is only its cabin bubble — its boom + tail
      // rotor reach ~1.9 × fusLen/2. This is the case a naive fusLen/2 offset
      // gets wrong, and the reason `aftZ` is measured off the model builder.
      upd([]); step(1, 3);
      {
        const g = fly('txh', 150, { category: 'A7' });
        const M = MET('txh'), sc = r._flightRigScale(g);
        ok('26l: a 150 kt helicopter is band 3 with a comet tail',
           g.speedBand === 3 && g.trailLine !== null, `band=${g.speedBand}`);
        ok('26l: aftZ reaches past the heli cabin (fusLen/2 would not)',
           M.aftZ > M.fusLen / 2 * 1.5, `aftZ=${M.aftZ} fusLen/2=${M.fusLen / 2}`);
        ok('26l: NO comet-tail point lies inside the heli boom (≥ aftZ · scale)',
           minClear(tailVerts('txh'), 'txh') >= M.aftZ * sc - 2,
           `min=${minClear(tailVerts('txh'), 'txh').toFixed(0)} vs ${(M.aftZ * sc).toFixed(0)}`);
      }

      // Band 2 (a slow GA single): the display travel per 150 ms sample is far
      // SHORTER than the airframe, which is exactly the case that proves the
      // whole buffer — not just the live head — has to carry the offset.
      upd([]); step(1, 3);
      {
        const g = fly('tx2', 60, { category: 'A1' }, 10);
        const M = MET('tx2'), sc = r._flightRigScale(g);
        ok('26l: 60 kt is band 2 with a comet tail',
           g.speedBand === 2 && g.trailLine !== null, `band=${g.speedBand}`);
        const v = tailVerts('tx2');
        ok('26l: the band-2 tail has several samples', v.length >= 3, `n=${v.length}`);
        ok('26l: NO band-2 tail point lies inside the fuselage, at ANY sample age',
           minClear(v, 'tx2') >= M.fusLen / 2 * sc - 2,
           `min=${minClear(v, 'tx2').toFixed(0)} vs ${(M.fusLen / 2 * sc).toFixed(0)}`);
      }

      // Band 3 motion lines are model-frame, so they need the same clearance in
      // model coordinates: the strip's LEADING edge must sit behind the tail.
      upd([]); step(1, 3);
      {
        const g = fly('tx3', 150, {}, 6);
        const M = MET('tx3');
        ok('26l: 150 kt is band 3 with motion lines',
           g.speedBand === 3 && g.motionLines.length === 2);
        ok('26l: the motion-line strips start BEHIND the tail exit',
           g.motionLines.every(m =>
             m.position.z - (M.fusLen * 0.42) / 2 >= M.aftZ),
           `front=${(g.motionLines[0].position.z - M.fusLen * 0.21).toFixed(0)} vs ${M.aftZ}`);
      }

      // (m) A HEADING CHANGE must not detach or snap the anchor: the offset
      // direction rides the SAME eased yaw the assembly is drawn with, so the
      // tail swings with the model instead of jumping to a new tangent.
      upd([]); step(1, 3);
      {
        const at = (t, trk) => SP('trn', 290, {
          lat: OLAT + 0.10, lon: OLON + 0.10 + t * 0.004, altFt: 21000, trackDeg: trk });
        upd([at(0, 90)]);
        for (let i = 0; i < 10; i++) { upd([at(i, 90)]); step(0.15); }
        const g = rig('trn');
        const off = (MET('trn').aftZ + 140) * r._flightRigScale(g);
        upd([at(10, 180)]);                       // a hard 90° turn
        let maxStep = 0, moved = 0, attached = true;
        let prev = r._flightTailAnchor(g, g.asm.position.clone()).clone();
        for (let i = 0; i < 30; i++) {
          step(1 / 60);
          const a = r._flightTailAnchor(g, g.asm.position.clone()).clone();
          // The DRAWN head really is the anchor, every frame of the turn.
          const spine = g.ribbon.geometry.attributes.position.array;
          const n = g.ribbon.geometry.drawRange.count / 6 + 1;
          const hx = (spine[(n - 1) * 6] + spine[(n - 1) * 6 + 3]) / 2;
          const hz = (spine[(n - 1) * 6 + 2] + spine[(n - 1) * 6 + 5]) / 2;
          if (Math.hypot(hx - a.x, hz - a.z) > 2) attached = false;
          const d = Math.hypot(a.x - prev.x, a.z - prev.z);
          maxStep = Math.max(maxStep, d); moved += d;
          prev = a;
        }
        ok('26m: the tail anchor stays welded to the head through the turn', attached);
        ok('26m: the anchor genuinely swings (the yaw is being followed)',
           moved > off * 0.5, `moved=${moved.toFixed(0)} off=${off.toFixed(0)}`);
        ok('26m: …and never snaps — no frame moves it more than 15% of the offset',
           maxStep < off * 0.15, `max=${maxStep.toFixed(0)} vs ${(off * 0.15).toFixed(0)}`);
        const M = MET('trn'), sc = r._flightRigScale(g);
        ok('26m: the contrail stays outside the fuselage across the turn',
           (() => {
             const c = cen('trn'), a = g.ribbon.geometry.attributes.position.array;
             const n = g.ribbon.geometry.drawRange.count / 6 + 1;
             let mn = Infinity;
             for (let i = 0; i < n * 2; i++) {
               mn = Math.min(mn, Math.hypot(a[i * 3] - c.x, a[i * 3 + 2] - c.z));
             }
             return mn >= M.fusLen / 2 * sc - 2;
           })());
      }

      // ── 26n: feed latency must never reverse the aircraft ────────────────
      // User-reported: "the ribbon contrail is flapping like a flag and the
      // tail of the ribbon is coming back and bisecting the fuselage", plus
      // "the plane body also moves backwards when this happens". Both are ONE
      // defect. A cloud ADS-B fix is the position the receiver SAW seconds ago,
      // so a poll habitually lands BEHIND the dead-reckoned point; easing the
      // display onto it dragged the model backwards along its own track, and
      // the tail-exit head retreated into its own ring-buffer history — the
      // spine hairpinned (an exact −1.0 segment reversal walking back through
      // the buffer, measured at all eight headings) so the contrail ran forward
      // through the fuselage before extending aft. Reproduced at 16 ms frames,
      // 8 s polls and a 6 s-stale feed; the guard lives in _applyFlightFix
      // (drop the along-track part of a behind-us fix, bleed the excess off
      // with a speed trim) with a forward-only backstop in the display ease.
      upd([]); step(1, 3);
      {
        const M_PER_DEG = 111320, NM_M = 1852, DEG = Math.PI / 180;
        // Where a track-following aircraft really is `secs` after (lat, lon).
        const advLL = (lat, lon, trk, gs, secs) => {
          const ms = gs * NM_M / 3600, t = trk * DEG;
          const cl = Math.max(0.02, Math.abs(Math.cos(lat * DEG)));
          return { lat: lat + (ms * Math.cos(t)) / M_PER_DEG * secs,
                   lon: lon + (ms * Math.sin(t)) / (M_PER_DEG * cl) * secs };
        };
        const spineOf = (g, k) => {
          const a = new Float32Array(k * 3), n = r._flightSpine(g, k, a), p = [];
          for (let i = 0; i < n; i++) p.push([a[i * 3], a[i * 3 + 1], a[i * 3 + 2]]);
          return p;
        };
        const ribVerts = g => {
          const a = g.ribbon.geometry.attributes.position.array;
          const n = g.ribbon.geometry.drawRange.count / 6 + 1, o = [];
          for (let i = 0; i < n; i++) {
            o.push([a[i * 6], a[i * 6 + 1], a[i * 6 + 2]]);
            o.push([a[i * 6 + 3], a[i * 6 + 4], a[i * 6 + 5]]);
          }
          return o;
        };
        const HDGS = [0, 45, 90, 135, 180, 225, 270, 315];
        const GS = 290, LAG = 6, DT = 0.016;
        let worstBack = 0, worstDot = 1, folds = 0, aheadFrames = 0;
        let worstJump = 0, degSegs = 0, badPerp = 0, minSegSeen = Infinity;
        for (const hdg of HDGS) {
          upd([]); step(1, 3);
          const hex = 'lag' + hdg;
          const base = { lat: OLAT + 0.05, lon: OLON + 0.05 };
          const fix = ll => SP(hex, GS, { lat: ll.lat, lon: ll.lon, altFt: 21000,
                                          trackDeg: hdg });
          upd([fix(base)]);
          let t = 0, lastPoll = 0, prevVerts = null;
          for (let f = 0; f < Math.round(15 / DT); f++) {
            t += DT;
            if (t - lastPoll >= 8) {          // realistic poll cadence…
              lastPoll = t;                   // …reporting a LAG-second-old fix
              upd([fix(advLL(base.lat, base.lon, hdg, GS, t - LAG))]);
            }
            const g = rig(hex);
            const bx = g.curX, bz = g.curZ;
            step(DT);
            // (a) the model may glide, slow or hold — never retreat.
            const fx = -Math.sin(g.yaw), fz = -Math.cos(g.yaw);
            const along = (g.curX - bx) * fx + (g.curZ - bz) * fz;
            if (along < worstBack) worstBack = along;
            // A rig younger than its first trail sample draws nothing yet (draw
            // range 0) — there is no geometry to measure until it does.
            if (!g.ribbon || g.ribbon.geometry.drawRange.count === 0) continue;
            const sp = spineOf(g, 12);
            for (let i = 0; i + 1 < sp.length; i++) {
              const L = Math.hypot(sp[i + 1][0] - sp[i][0], sp[i + 1][1] - sp[i][1],
                                   sp[i + 1][2] - sp[i][2]);
              if (L < minSegSeen) minSegSeen = L;
              if (L < 1) degSegs++;
            }
            // (b) spine monotonicity: consecutive segments never double back.
            for (let i = 0; i + 2 < sp.length; i++) {
              const ax = sp[i + 1][0] - sp[i][0], az = sp[i + 1][2] - sp[i][2];
              const cx = sp[i + 2][0] - sp[i + 1][0], cz = sp[i + 2][2] - sp[i + 1][2];
              const la = Math.hypot(ax, az), lb = Math.hypot(cx, cz);
              if (la > 1e-6 && lb > 1e-6) {
                const d = (ax * cx + az * cz) / (la * lb);
                if (d < worstDot) worstDot = d;
                if (d < 0) folds++;
              }
            }
            // (c) the head stays AFT of the model centre at every heading.
            const head = sp[sp.length - 1];
            const ax = Math.sin(g.yaw), az = Math.cos(g.yaw);
            if ((head[0] - g.curX) * ax + (head[2] - g.curZ) * az <= 0) aheadFrames++;
            // (d) no flapping: bounded per-frame motion of every vertex except
            // the head weld (which legitimately advances with the aircraft).
            const vs = ribVerts(g);
            if (prevVerts && prevVerts.length === vs.length) {
              for (let i = 0; i < vs.length - 2; i++) {
                const d = Math.hypot(vs[i][0] - prevVerts[i][0],
                                     vs[i][1] - prevVerts[i][1],
                                     vs[i][2] - prevVerts[i][2]);
                if (d > worstJump) worstJump = d;
              }
            }
            prevVerts = vs;
            // (e) every ribbon rib is a real, unit-conditioned perpendicular.
            for (let i = 0; i < vs.length; i += 2) {
              const w = Math.hypot(vs[i][0] - vs[i + 1][0], vs[i][1] - vs[i + 1][1],
                                   vs[i][2] - vs[i + 1][2]);
              if (!(w > 0)) badPerp++;
            }
          }
        }
        ok('26n: a stale poll never slides the aircraft backwards along track',
           worstBack >= 0, `worst along-track step = ${worstBack.toFixed(2)} mm/frame`);
        ok('26n: the trail spine never doubles back (no hairpin through the model)',
           folds === 0 && worstDot > 0,
           `folds=${folds} minSegmentDot=${worstDot.toFixed(3)}`);
        ok('26n: the spine head stays aft of the aircraft at every heading',
           aheadFrames === 0, `aheadFrames=${aheadFrames}`);
        ok('26n: no degenerate spine segment survives the conditioning gate',
           degSegs === 0, `sub-mm segments=${degSegs}, min=${minSegSeen.toFixed(2)}mm`);
        ok('26n: the contrail does not flap — bounded per-frame vertex motion',
           worstJump < 40, `worst non-head vertex step = ${worstJump.toFixed(1)}mm`);
        ok('26n: every ribbon rib keeps a real width (no collapsed perpendicular)',
           badPerp === 0, `collapsed=${badPerp}`);

        // A behind-us fix is absorbed, not obeyed: the reckoning speed is
        // trimmed (never below FLIGHT_LAG_TRIM_MIN of the reported gs) instead
        // of the display being yanked back.
        upd([]); step(1, 3);
        {
          const hex = 'trim1', base = { lat: OLAT + 0.05, lon: OLON + 0.05 };
          const fix = ll => SP(hex, 290, { lat: ll.lat, lon: ll.lon, altFt: 21000,
                                           trackDeg: 90 });
          upd([fix(base)]);
          step(DT, Math.round(8 / DT));
          const g = rig(hex);
          const fullRate = Math.hypot(g.latPerS, g.lonPerS);
          const reckoned = { lat: g.lat, lon: g.lon };
          upd([fix(advLL(base.lat, base.lon, 90, 290, 8 - LAG))]);   // 6 s stale
          const trimmed = Math.hypot(g.latPerS, g.lonPerS);
          ok('26n: a stale fix keeps the reckoned along-track position',
             Math.abs(g.lon - reckoned.lon) < 1e-9 && Math.abs(g.lat - reckoned.lat) < 1e-9,
             `Δlon=${(g.lon - reckoned.lon).toExponential(2)}`);
          ok('26n: …and is absorbed by a speed trim, not a jump cut',
             trimmed < fullRate && trimmed >= fullRate * 0.79,
             `${trimmed.toExponential(3)} vs ${fullRate.toExponential(3)}`);
          // A fix that lands AHEAD (the ordinary case) is applied verbatim.
          const ahead = advLL(g.lat, g.lon, 90, 290, 4);
          upd([fix(ahead)]);
          ok('26n: a forward fix is still applied verbatim',
             Math.abs(g.lon - ahead.lon) < 1e-12 && Math.abs(g.lat - ahead.lat) < 1e-12);
          ok('26n: …and restores the untrimmed reckoning rate',
             Math.abs(Math.hypot(g.latPerS, g.lonPerS) - fullRate) < fullRate * 1e-9);
        }

        // Distant / slow rigs: the same conditioning must hold where display
        // travel per 150 ms sample is a fraction of a millimetre — the other
        // way a perpendicular goes degenerate and the strip snaps to an axis.
        upd([]); step(1, 3);
        {
          const hex = 'far1';
          upd([SP(hex, 300, { lat: OLAT + 0.02, lon: OLON + 0.02, altFt: 35000,
                              trackDeg: 90 })]);
          step(DT, Math.round(6 / DT));
          const g = rig(hex);
          const sp = spineOf(g, 12);
          let mn = Infinity;
          for (let i = 0; i + 1 < sp.length; i++) {
            mn = Math.min(mn, Math.hypot(sp[i + 1][0] - sp[i][0],
                                         sp[i + 1][1] - sp[i][1],
                                         sp[i + 1][2] - sp[i][2]));
          }
          ok('26n: a distant rig\'s spine respects the minimum segment length',
             sp.length >= 2 && mn >= 6 * r._flightRigScale(g) - 1e-6,
             `min=${mn.toFixed(2)}mm n=${sp.length}`);
          // Head edge direction is frame-stable across a push boundary.
          let prevU = null, flips = 0;
          for (let f = 0; f < Math.round(1.5 / DT); f++) {
            step(DT);
            const a = g.ribbon.geometry.attributes.position.array;
            const i = g.ribbon.geometry.drawRange.count / 6;
            const sx = a[i * 6] - a[i * 6 + 3], sy = a[i * 6 + 1] - a[i * 6 + 4],
                  sz = a[i * 6 + 2] - a[i * 6 + 5];
            const L = Math.hypot(sx, sy, sz);
            const u = [sx / L, sy / L, sz / L];
            if (prevU && u[0] * prevU[0] + u[1] * prevU[1] + u[2] * prevU[2] < 0.9) flips++;
            prevU = u;
          }
          ok('26n: the head rib never flips axis between frames', flips === 0,
             `flips=${flips}`);
        }
      }
    }

    upd([]); step(1, 3);
  }

  // ── 27. Independent vertical (height) scale (opts.verticalScale) ───────────
  // Composed ONLY at the display-height site, so 2D and 3D read one geometry
  // call. The horizontal shell must not move at all.
  {
    upd([]); step(1, 3);
    const VS_FP = FP({ hex: 'vs1', lat: OLAT + 0.22, lon: OLON - 0.18, altFt: 34000 });
    const expectVS = (fp, vs, shellMm = SHELL0) => {
      const d = F.flightDisplayPos(fp, OLAT, OLON, 0, RAD_NM, shellMm, vs);
      return { x: -d.planX, y: d.dispY, z: d.planY };
    };

    upd([VS_FP], { opts: { verticalScale: 0.5 } });
    {
      const got = rig('vs1').asm.position, want = expectVS(VS_FP, 0.5);
      ok('27: the rig snaps to the pure module\'s scaled height (2D/3D parity)',
         Math.abs(got.x - want.x) < 1 && Math.abs(got.y - want.y) < 1
         && Math.abs(got.z - want.z) < 1,
         `got y=${got.y.toFixed(1)} want ${want.y.toFixed(1)}`);
      const full = expectPos(VS_FP);
      // The renderer's inline reaches the same plan offsets a different way
      // (unit vector vs an atan2 round-trip), so this is the §4d parity
      // tolerance, not a bit compare — the POINT is that the height scale moved
      // neither coordinate at all.
      ok('27: the HORIZONTAL position is untouched by the height scale',
         Math.abs(got.x + F.flightDisplayPos(VS_FP, OLAT, OLON, 0, RAD_NM, SHELL0, 0.5).planX) < 0.001
         && Math.abs(got.x - full.x) < 0.001 && Math.abs(got.z - full.z) < 0.001,
         `dx=${(got.x - full.x).toExponential(2)} dz=${(got.z - full.z).toExponential(2)}`);
      ok('27: …while the height genuinely dropped', got.y < full.y - 1,
         `${full.y.toFixed(0)} → ${got.y.toFixed(0)}`);
    }

    // The zero-alloc inline must mirror the pure function at a non-default scale
    // — the same single-sourcing parity §4d pins for the shell radius.
    {
      let parity = true;
      for (const [lat, lon, alt] of [[OLAT + 0.4, OLON + 0.05, 3000],
                                     [OLAT - 0.3, OLON - 0.5, 41000], [OLAT, OLON, 800]]) {
        const w = expectVS(FP({ lat, lon, altFt: alt }), 0.5);
        const g = r._flightScenePos(lat, lon, alt, r._v3flight);
        if (Math.abs(g.x - w.x) > 0.001 || Math.abs(g.y - w.y) > 0.001
          || Math.abs(g.z - w.z) > 0.001) parity = false;
      }
      ok('27: _flightScenePos == flightDisplayPos at a non-default height scale', parity);
    }

    // A LIVE rig EASES onto a changed scale (a settings edit is a correction).
    {
      const before = rig('vs1').asm.position.y;
      upd([VS_FP], { opts: { verticalScale: 1.6 } });
      step(0.05, 2);
      const mid = rig('vs1').asm.position.y;
      const target = expectVS(VS_FP, 1.6).y;
      ok('27: a live rig eases toward a changed height scale, never snaps',
         mid > before + 1e-6 && mid < target - 1,
         `${before.toFixed(0)} → ${mid.toFixed(0)} (target ${target.toFixed(0)})`);
      step(0.5, 90);
      ok('27: …and converges on it',
         Math.abs(rig('vs1').asm.position.y - target) < 1,
         `${rig('vs1').asm.position.y.toFixed(1)} want ${target.toFixed(1)}`);
    }

    // The frustum requirement grows with a scale above 1, and is untouched below.
    {
      upd([VS_FP], { opts: { verticalScale: 1 } });
      const base = r._frustumReqFlights;
      upd([VS_FP], { opts: { verticalScale: 0.4 } });
      ok('27: a height scale below 1 leaves the frustum reach alone',
         r._frustumReqFlights === base, `${base} vs ${r._frustumReqFlights}`);
      upd([VS_FP], { opts: { verticalScale: 2 } });
      ok('27: a height scale above 1 widens the frustum reach',
         r._frustumReqFlights > base * 1.2,
         `${Math.round(base)} → ${Math.round(r._frustumReqFlights)}`);
      near('27: the widened reach matches flightShellReachMm(shell, 2)',
           r._frustumReqFlights, F.flightShellReachMm(SHELL0, 2), 1);
      upd([]); step(1, 3);
      ok('27: an empty shell drops the requirement entirely',
         r._frustumReqFlights === null, String(r._frustumReqFlights));
    }

    // Absent = 1 = the shipped geometry, exactly (stale-chunk safety).
    {
      upd([VS_FP]);
      const noOpt = rig('vs1').asm.position.clone();
      upd([]); step(1, 3);
      upd([VS_FP], { opts: { verticalScale: 1 } });
      const one = rig('vs1').asm.position.clone();
      ok('27: an absent verticalScale is byte-identical to an explicit 1',
         noOpt.equals(one), `${noOpt.y} vs ${one.y}`);
      upd([]); step(1, 3);
      upd([VS_FP], { opts: { verticalScale: NaN } });
      ok('27: a garbage verticalScale falls back to 1',
         rig('vs1').asm.position.equals(one));
    }
    upd([]); step(1, 3);
  }

  // ── 28. Military skins (vehicle library V3, research §4.4) ─────────────────
  // A live aircraft that really IS one of the six already-built BG_CRAFTS
  // military silhouettes wears that shape instead of the generic archetype body.
  // The pinned contract: the ENVELOPE (archetype metrics — label, beacon, id
  // planes, viz terms) is unchanged, only `aftZ` becomes the skin's own measured
  // rear extent, and the banner tow path is untouched.
  {
    upd([]); step(1, 3);
    const MFP = (hex, extra = {}) => FP({
      hex, lat: OLAT + 0.12, lon: OLON + 0.12, altFt: 21000,
      gsKt: 300, trackDeg: 90, ...extra });
    // Z extent in the ASSEMBLY's OWN frame. The page never imports THREE, so the
    // rig is parked at the origin with identity rotation/scale first (world ==
    // model frame) and the 8 geometry-bbox corners are pushed through each
    // mesh's matrixWorld by hand. Rigs are torn down at the end of the section.
    const zExtent = (asm) => {
      asm.position.set(0, 0, 0); asm.rotation.set(0, 0, 0); asm.scale.setScalar(1);
      asm.updateMatrixWorld(true);
      // matrixWorld composes the PARENT (_flightsGroup sits at the home anchor),
      // so measure relative to the assembly's own world origin — with an identity
      // local transform that is exactly the group offset.
      const base = asm.matrixWorld.elements[14];
      let min = Infinity, max = -Infinity;
      asm.traverse(o => {
        if (!o.isMesh || !o.geometry) return;
        if (!o.geometry.boundingBox) o.geometry.computeBoundingBox();
        const bb = o.geometry.boundingBox; if (!bb) return;
        const e = o.matrixWorld.elements;
        for (const x of [bb.min.x, bb.max.x])
          for (const y of [bb.min.y, bb.max.y])
            for (const z of [bb.min.z, bb.max.z]) {
              const wz = e[2] * x + e[6] * y + e[10] * z + e[14] - base;
              if (wz < min) min = wz;
              if (wz > max) max = wz;
            }
      });
      return { min, max, len: max - min };
    };
    // Mesh signature: geometry type + rounded parameters + local position, as a
    // sorted multiset — enough to catch any change to a build's shape. Outline
    // SHELLS are excluded: they share their host's geometry, so they add nothing
    // the hosts don't already say, and a translucent (privacy) build legitimately
    // has none.
    const meshSig = (root) => {
      const out = [];
      root.traverse(o => {
        if (!o.isMesh || !o.geometry || o.userData.outline) return;
        const p = o.geometry.parameters || {};
        const nums = Object.keys(p).sort().map(k =>
          typeof p[k] === 'number' ? `${k}:${p[k].toFixed(2)}` : `${k}:${p[k]}`);
        out.push(`${o.geometry.type}|${nums.join(',')}|` +
          `${o.position.x.toFixed(1)},${o.position.y.toFixed(1)},${o.position.z.toFixed(1)}`);
      });
      return out.sort().join('\n');
    };

    // (a) The three resolution paths each land a skin on a live rig.
    upd([MFP('sk16', { category: 'A6', callsign: 'VIPER1' })]);
    {
      const g = rig('sk16');
      ok('28: an A6 (fighter) aircraft wears the f16 skin',
         g.skin === 'f16', `skin=${g.skin}`);
      ok('28: …while its ARCHETYPE bucket is unchanged (bizjet)',
         g.archetype === 'bizjet', g.archetype);
      ok('28: the f16 skin builds its signature cropped delta wing',
         withUD(g.asm, 'wing', 'delta').length === 1);
    }
    upd([MFP('skb2', { typeCode: 'B2', callsign: 'SPIRIT' })]);
    ok('28: typeCode B2 wears the b2 flying-wing skin',
       rig('skb2').skin === 'b2'
       && withUD(rig('skb2').asm, 'wing', 'flyingwing').length === 2,   // one panel per side
       `${rig('skb2').skin}/${withUD(rig('skb2').asm, 'wing', 'flyingwing').length}`);
    upd([MFP('skah', { typeCode: 'UH60', military: true, gsKt: 120 })]);
    {
      const g = rig('skah');
      ok('28: a MILITARY rotorcraft wears the apache skin',
         g.skin === 'apache' && g.archetype === 'heli', `${g.skin}/${g.archetype}`);
      ok('28: the apache skin keeps a spinning main rotor + tail rotor',
         g.props.length >= 1 && g.tailRotor !== null && g.propRate > 0,
         `props=${g.props.length} rate=${g.propRate}`);
    }
    upd([MFP('skciv', { typeCode: 'EC35', military: false, gsKt: 120 })]);
    ok('28: a CIVIL helicopter keeps the generic body',
       rig('skciv').skin === null);

    // (b) Envelope: the skin is scaled by bucket fusLen / craft len, and reads
    //     the same SIZE as the generic body it replaces (§4.1's contract).
    upd([]); step(1, 3);
    upd([MFP('envS', { category: 'A6' }), MFP('envG', { typeCode: 'GLF6', lon: OLON + 0.13 })]);
    {
      const s = rig('envS'), gen = rig('envG');
      ok('28: both rigs are the same archetype bucket',
         s.archetype === 'bizjet' && gen.archetype === 'bizjet');
      const inner = s.asm.children.find(c => !c.isMesh && !c.isSprite && c.children.length > 2);
      const M = r._flightArchetypeMetrics('bizjet');
      ok('28: the skin hangs in a scaled inner group', !!inner, String(!!inner));
      near('28: the inner scale is exactly bucket fusLen / craft len',
           inner ? inner.scale.x : 0, M.fusLen / 2000, 1e-9);
      const es = zExtent(s.asm), eg = zExtent(gen.asm);
      ok('28: the skinned body reads within ±30 % of the generic body it replaces',
         Math.abs(es.len - eg.len) / eg.len <= 0.30,
         `skin=${es.len.toFixed(0)} generic=${eg.len.toFixed(0)}`);
      ok('28: …and within ±60 % of the bucket fusLen (the authored envelope)',
         Math.abs(es.len - M.fusLen) / M.fusLen <= 0.60,
         `len=${es.len.toFixed(0)} fusLen=${M.fusLen}`);
    }

    // (c) aftZ OVERRIDE — the one metric a skin owns, because the trail anchor
    //     must never start inside the model.
    {
      const s = rig('envS'), gen = rig('envG');
      const es = zExtent(s.asm);
      ok('28: the skinned rig carries its OWN aftZ (not the bucket value)',
         s.aftZ !== r._flightArchetypeMetrics('bizjet').aftZ,
         `skin=${s.aftZ.toFixed(0)} bucket=${r._flightArchetypeMetrics('bizjet').aftZ}`);
      ok('28: the override is ≥ the skin\'s scaled rear extent',
         s.aftZ >= es.max - 0.5, `aftZ=${s.aftZ.toFixed(1)} rear=${es.max.toFixed(1)}`);
      ok('28: a GENERIC rig still carries the bucket aftZ exactly',
         gen.aftZ === r._flightArchetypeMetrics('bizjet').aftZ, String(gen.aftZ));
      // Negative control: the bucket's own aftZ is NOT a safe anchor for this
      // silhouette — which is precisely why the override exists.
      ok('28: (control) the skin really does reach past the bucket aftZ',
         es.max > r._flightArchetypeMetrics('bizjet').aftZ,
         `rear=${es.max.toFixed(0)} bucket=${r._flightArchetypeMetrics('bizjet').aftZ}`);
    }
    upd([]); step(1, 3);

    // (d) The trailing effects all anchor off the rig's aftZ, so nothing emits
    //     from inside a borrowed silhouette.
    {
      const fly = (hex, extra) => {
        const at = t => MFP(hex, { gsKt: 560, lat: OLAT + 0.10,
          lon: OLON + 0.10 + t * 0.004, ...extra });
        upd([at(0)]);
        for (let i = 0; i < 14; i++) { upd([at(i)]); step(0.15); }
        return rig(hex);
      };
      const g = fly('skvz', { category: 'A6' });
      ok('28: the skinned rig reaches band 5 (contrail + burners + ghosts)',
         g.speedBand === 5 && g.ghosts.length === 2, `band=${g.speedBand}`);
      ok('28: the ghost multiples lag from the SKIN\'s tail, not the bucket\'s',
         g.ghosts.every(x => x.position.z >= g.aftZ),
         `${g.ghosts.map(x => x.position.z.toFixed(0)).join(',')} vs ${g.aftZ.toFixed(0)}`);
      const sc = r._flightRigScale(g);
      const head = r._flightTailAnchor(g, g.asm.position.clone());
      near('28: the trail head sits exactly at the SKIN\'s tail exit',
           Math.hypot(head.x - g.curX, head.z - g.curZ), (g.aftZ + 140) * sc, 2);
    }
    upd([]); step(1, 3);

    // (e) Attachments are envelope-owned and land EXACTLY where they do on a
    //     generic rig of the same bucket — except the fuselage lettering, which
    //     a fighter does not carry.
    upd([MFP('atS', { category: 'A6', callsign: 'VIPER2', military: true,
                      operator: 'USAF' }),
         MFP('atG', { typeCode: 'GLF6', callsign: 'GULF11', military: true,
                      operator: 'USAF', lon: OLON + 0.13 })]);
    {
      const s = rig('atS'), gen = rig('atG');
      const M = r._flightArchetypeMetrics('bizjet');
      ok('28: the skinned rig has a label plate at the bucket labelY',
         !!s.label && Math.abs(s.label.position.y - M.labelY) < 1e-9);
      ok('28: label height matches the generic rig exactly',
         !!gen.label && s.label.position.y === gen.label.position.y);
      const bead = h => withUD(rig(h).asm, 'beacon').find(o => o.isMesh);
      ok('28: the status beacon builds at the bucket beacon point',
         !!bead('atS') && bead('atS').position.z === M.beaconZ
         && bead('atS').position.y === M.beaconY);
      ok('28: beacon position matches the generic rig exactly',
         !!bead('atG') && bead('atS').position.equals(bead('atG').position));
      ok('28: a skinned rig carries NO fuselage lettering (no operator titles)',
         s.idPlanes === null, String(!!s.idPlanes));
      ok('28: (control) the generic rig DOES carry fuselage lettering',
         gen.idPlanes !== null);
    }
    upd([]); step(1, 3);

    // (f) Privacy dimming composes on a skin exactly as on a generic body.
    upd([MFP('skpia', { category: 'A6', callsign: 'N9PIA', pia: true })]);
    {
      const g = rig('skpia');
      const mats = [];
      g.asm.traverse(o => { if (o.isMesh && o.material && !o.userData.outline) mats.push(o.material); });
      ok('28: a PIA fighter still wears the skin', g.skin === 'f16' && g.dim === true);
      ok('28: every skin material builds translucent',
         mats.length > 3 && mats.every(m => m.transparent === true && m.opacity <= 0.45),
         `n=${mats.length}`);
      ok('28: …so the privacy build gets no outline shells',
         withUD(g.asm, 'outline').length === 0);
    }
    upd([]); step(1, 3);

    // (g) The master toggle. OFF is the pre-batch build, mesh-for-mesh.
    upd([MFP('tgl', { category: 'A6', callsign: 'VIPER3', military: true })],
        { opts: { militarySkins: false } });
    const offSig = meshSig(rig('tgl').asm);
    const offShells = withUD(rig('tgl').asm, 'outline').length;
    ok('28: militarySkins:false keeps the generic archetype body',
       rig('tgl').skin === null && withUD(rig('tgl').asm, 'wing', 'delta').length === 0);
    ok('28: …and carries the bucket aftZ',
       rig('tgl').aftZ === r._flightArchetypeMetrics('bizjet').aftZ);
    {
      // The golden: a toggled-off A6 is the SAME build as any other military
      // bizjet — i.e. exactly what shipped before this batch.
      upd([]); step(1, 3);
      upd([MFP('tglref', { typeCode: 'GLF6', callsign: 'VIPER3', military: true })]);
      ok('28: toggle-off mesh multiset is identical to the shipped generic body',
         meshSig(rig('tglref').asm) === offSig);
      ok('28: …including its outline shells',
         withUD(rig('tglref').asm, 'outline').length === offShells, `n=${offShells}`);
    }
    upd([]); step(1, 3);
    ok('28: an ABSENT militarySkins opt means ON (stale three-view safe)',
       (() => { upd([MFP('dflt', { category: 'A6' })]); return rig('dflt').skin === 'f16'; })());

    // (h) Re-skin IN PLACE: the type designator arrives on a LATER poll, and the
    //     toggle can flip under a live rig — neither may lose motion state.
    upd([]); step(1, 3);
    upd([MFP('late', { typeCode: null, category: 'A3' })]);
    {
      const before = rig('late');
      const asm0 = before.asm, x0 = before.curX;
      ok('28: the first poll (no type) builds a generic narrowbody',
         before.skin === null && before.archetype === 'narrowbody');
      upd([MFP('late', { typeCode: 'F22', category: 'A3' })]);
      const after = rig('late');
      ok('28: a later type designator re-skins the SAME rig in place',
         after === before && after.asm !== asm0 && after.skin === 'f22',
         `skin=${after.skin}`);
      ok('28: …keeping its display position (motion state survives)',
         after.curX === x0);
      ok('28: …and adopting the new silhouette + its aftZ',
         withUD(after.asm, 'wing', 'diamond').length === 1
         && after.aftZ !== r._flightArchetypeMetrics(after.archetype).aftZ);
      upd([MFP('late', { typeCode: 'F22', category: 'A3' })], { opts: { militarySkins: false } });
      ok('28: turning skins OFF drops a live rig back to the generic body',
         rig('late') === before && rig('late').skin === null
         && rig('late').aftZ === r._flightArchetypeMetrics(rig('late').archetype).aftZ);
    }
    upd([]); step(1, 3);

    // (i) The BANNER path is untouched by the shared geometry: an untinted craft
    //     builds opaque, with its outline shells, exactly as it always has —
    //     the `dim` parameter is trailing and defaults off. (The full banner
    //     golden lives in bgtext-multi-test / vehicle-craft-test.)
    {
      const plain = r._buildBannerCraft('f16', {});
      const dimmed = r._buildBannerCraft('f16', {}, true);
      const opaque = [];
      plain.asm.traverse(o => { if (o.isMesh && o.material && !o.userData.outline) opaque.push(o.material); });
      ok('28: the 2-arg banner build is fully opaque (unchanged)',
         opaque.length > 3 && opaque.filter(m => m.transparent).length <= 1,
         `n=${opaque.length}`);
      ok('28: the banner build still gets its inverted-hull outline shells',
         withUD(plain.asm, 'outline').length > 0);
      ok('28: the dim build is translucent and shell-free',
         withUD(dimmed.asm, 'outline').length === 0);
      ok('28: both builds share the same mesh signature (geometry is one source)',
         meshSig(plain.asm) === meshSig(dimmed.asm));
      r._clearGroup(plain.asm); r._clearGroup(dimmed.asm);
    }
  }

  // ══ 29. Airline liveries + fuselage / banner text ═══════════════════════════
  // docs/research/airline-reference.md. The livery is the tint pair
  // _buildAircraftModel already accepted for the background tow plane, so the
  // assertions compare COLOUR SIGNATURES against a directly-tinted reference
  // build — the materials go through _mat()'s _simsColor saturation push, so
  // comparing against the raw table hex would be wrong.
  {
    // AIRFRAME colours only: a live rig's assembly also carries the fuselage
    // lettering planes and (when flagged) the status beacon bead, none of which
    // a bare _buildAircraftModel reference has.
    const colorSig = (root) => {
      const out = [];
      root.traverse(o => {
        if (!o.isMesh || !o.material || o.userData.outline) return;
        if (o.userData.textPlane || o.userData.flightId || o.userData.beacon) return;
        out.push(o.material.color.getHex());
      });
      return out.sort((a, b) => a - b).join(',');
    };
    const DELTA_BODY = 0xc8102e, DELTA_ACCENT = 0x00285f;
    const refTint = r._buildAircraftModel('narrowbody', false, false,
      { body: DELTA_BODY, accent: DELTA_ACCENT });
    const refPlain = r._buildAircraftModel('narrowbody', false, false);
    const SIG_TINT = colorSig(refTint.asm), SIG_PLAIN = colorSig(refPlain.asm);
    r._clearGroup(refTint.asm); r._clearGroup(refPlain.asm);
    ok('29: the tinted + untinted reference builds genuinely differ',
       SIG_TINT !== SIG_PLAIN);

    const AFP = o => FP({ category: 'A3', typeCode: 'B738',
      operator: 'DELTA AIR LINES INC', ...o });

    // ── The livery itself ────────────────────────────────────────────────────
    r.updateFlights([
      AFP({ hex: 'c10001', callsign: 'DAL1234' }),                       // painted
      AFP({ hex: 'c10002', callsign: 'ZQX1234' }),                       // unknown prefix
      AFP({ hex: 'c10003', callsign: 'DAL1234', military: true }),       // olive wins
      AFP({ hex: 'c10004', callsign: 'DAL1234', pia: true }),            // PIA vetoes
      AFP({ hex: 'c10005', callsign: 'SKW1234' }),                       // colourless regional
      AFP({ hex: 'c10006', callsign: 'FFL0123' }),                       // PIA pseudo-operator
    ], ORIGIN, 0, RAD_NM, true, ANCHOR, {});

    ok('29: a DAL callsign paints the Delta livery',
       colorSig(rig('c10001').asm) === SIG_TINT);
    ok('29: …and records it as the rebuild signature',
       rig('c10001').airlineKey === `${DELTA_BODY}:${DELTA_ACCENT}`,
       rig('c10001').airlineKey);
    ok('29: an unknown prefix keeps the archetype paint',
       colorSig(rig('c10002').asm) === SIG_PLAIN && rig('c10002').airlineKey === '');
    ok('29: a MILITARY aircraft is never airline-tinted',
       colorSig(rig('c10003').asm) !== SIG_TINT && rig('c10003').airlineKey === '');
    ok('29: a PIA aircraft is never airline-tinted',
       colorSig(rig('c10004').asm) !== SIG_TINT && rig('c10004').airlineKey === '');
    ok('29: …and its fuselage identity stays the bare hex',
       rig('c10004').idKey === 'C10004|', rig('c10004').idKey);
    ok('29: a colourless regional keeps the archetype paint',
       rig('c10005').airlineKey === '');
    ok('29: a PIA pseudo-operator prefix paints nothing',
       rig('c10006').airlineKey === '');

    // A military SKIN outranks the livery: the borrowed silhouette keeps its
    // own signature paint (there is nothing for a tint to reach).
    r.updateFlights([FP({ hex: 'c10007', callsign: 'DAL1234', typeCode: 'F16',
      military: true, category: 'A6' })], ORIGIN, 0, RAD_NM, true, ANCHOR, {});
    ok('29: a military SKIN refuses the livery',
       rig('c10007').skin === 'f16' && rig('c10007').airlineKey === '');

    // ── The master toggle repaints IN PLACE, keeping motion state ────────────
    r.updateFlights([AFP({ hex: 'c10010', callsign: 'DAL1234' })],
                    ORIGIN, 0, RAD_NM, true, ANCHOR, {});
    const tgl = rig('c10010');
    const asmBefore = tgl.asm;
    tgl.curX = 1234; tgl.curY = 9000; tgl.curZ = -777; tgl.yaw = 0.75;
    tgl.spin = 3.5; tgl.beaconPhase = 2.25;
    ok('29: the rig starts painted', colorSig(tgl.asm) === SIG_TINT);
    r.updateFlights([AFP({ hex: 'c10010', callsign: 'DAL1234' })],
                    ORIGIN, 0, RAD_NM, true, ANCHOR, { airlineColors: false });
    ok('29: airlineColors:false repaints the rig back to the archetype livery',
       colorSig(rig('c10010').asm) === SIG_PLAIN);
    ok('29: …by REBUILDING the assembly in place', rig('c10010').asm !== asmBefore);
    ok('29: …keeping the eased display position',
       rig('c10010').curX === 1234 && rig('c10010').curY === 9000
       && rig('c10010').curZ === -777);
    ok('29: …and the position is written onto the fresh assembly',
       rig('c10010').asm.position.x === 1234 && rig('c10010').asm.position.z === -777);
    ok('29: …keeping yaw / prop spin / beacon phase',
       rig('c10010').yaw === 0.75 && rig('c10010').spin === 3.5
       && rig('c10010').beaconPhase === 2.25);
    ok('29: …and the signature clears so it will not rebuild again',
       rig('c10010').airlineKey === '');
    r.updateFlights([AFP({ hex: 'c10010', callsign: 'DAL1234' })],
                    ORIGIN, 0, RAD_NM, true, ANCHOR, {});
    ok('29: re-enabling repaints it', colorSig(rig('c10010').asm) === SIG_TINT);

    // A poll that changes nothing must not rebuild (the _syncFlightBeacon idiom).
    const stableAsm = rig('c10010').asm;
    r.updateFlights([AFP({ hex: 'c10010', callsign: 'DAL1234' })],
                    ORIGIN, 0, RAD_NM, true, ANCHOR, {});
    ok('29: an unchanged poll does not rebuild the model',
       rig('c10010').asm === stableAsm);

    // ── Fuselage text (`sideText`) reaches the painter ────────────────────────
    const sideKey = (mode) => {
      r.updateFlights([AFP({ hex: 'c10020', callsign: 'DAL1234' })],
                      ORIGIN, 0, RAD_NM, true, ANCHOR,
                      mode === undefined ? {} : { sideText: mode });
      return rig('c10020').idKey;
    };
    const AUTO_KEY = sideKey(undefined);
    ok('29: auto keeps the shipped livery layout (operator | identity)',
       AUTO_KEY === 'DELTA AIR LINES INC|DAL1234', AUTO_KEY);
    ok('29: sideText "auto" is byte-identical to absent', sideKey('auto') === AUTO_KEY);
    ok('29: sideText "slogan" reaches the fuselage painter',
       sideKey('slogan') === 'Keep Climbing|DAL1234', rig('c10020').idKey);
    ok('29: sideText "airline" paints the short name',
       sideKey('airline') === 'Delta|DAL1234');
    ok('29: sideText "callsign" paints the identity on the flanks only',
       sideKey('callsign') === 'DAL1234|');
    ok('29: sideText "none" blanks the airframe', sideKey('none') === '|');
    ok('29: …and removes the id planes entirely', rig('c10020').idPlanes === null);
    ok('29: an unknown mode falls back to auto', sideKey('bogus') === AUTO_KEY);
    ok('29: slogan text actually reaches a drawn plane', (() => {
      sideKey('slogan');
      return withUD(rig('c10020').asm, 'flightId').length >= 2;
    })());

    // ── Tow-banner text (`bannerText`) ──────────────────────────────────────
    // A piston single with a callsign tows the banner (the shipped rule).
    const banKey = (mode) => {
      r.updateFlights([FP({ hex: 'c10030', callsign: 'DAL1234', category: 'A1' })],
                      ORIGIN, 0, RAD_NM, true, ANCHOR,
                      mode === undefined ? {} : { bannerText: mode });
      return rig('c10030').bannerKey;
    };
    ok('29: the piston rig really is towing a banner', (() => {
      banKey(undefined);
      return rig('c10030').banner !== null && rig('c10030').archetype === 'ga-high';
    })());
    ok('29: banner auto is the identity (unchanged)', banKey(undefined) === 'DAL1234');
    ok('29: banner "airline" tows the short name', banKey('airline') === 'Delta');
    ok('29: banner "slogan" tows the slogan', banKey('slogan') === 'Keep Climbing');
    ok('29: banner "callsign" tows the identity', banKey('callsign') === 'DAL1234');
    ok('29: a banner-text change repaints the cloth', rig('c10030').banner !== null);

    // ── The `airline` LABEL FIELD resolves renderer-side ─────────────────────
    r.updateFlights([AFP({ hex: 'c10040', callsign: 'DAL1234' })],
                    ORIGIN, 0, RAD_NM, true, ANCHOR, { labelFields: ['callsign', 'airline'] });
    ok('29: the label plate carries the resolved airline',
       rig('c10040').labelKey === 'DAL1234|Delta', rig('c10040').labelKey);
    r.updateFlights([AFP({ hex: 'c10041', callsign: 'DAL1234', pia: true })],
                    ORIGIN, 0, RAD_NM, true, ANCHOR, { labelFields: ['callsign', 'airline'] });
    ok('29: a PIA plate withholds the airline',
       rig('c10041').labelKey === '🔒 C10041|', rig('c10041').labelKey);

    // Clear the section's rigs so later frames do not carry them.
    r.updateFlights([], ORIGIN, 0, RAD_NM, true, ANCHOR, {});
  }

  // ── report ─────────────────────────────────────────────────────────────────
  const pass = tests.filter(t => t.ok).length;
  const fail = tests.length - pass;
  document.title = `FLIGHTSRENDER ${fail ? 'FAIL' : 'PASS'} ${pass}/${tests.length}`;
  document.getElementById('log').innerHTML =
    `<div class="hd">${document.title}</div>` +
    tests.map(t => `<div class="${t.ok ? 'pass' : 'fail'}">${t.ok ? '✓' : '✗'} ${t.name}` +
      `${t.detail ? ` <span style="opacity:.65">— ${t.detail}</span>` : ''}</div>`).join('');
</script>
