<!doctype html>
<meta charset="utf-8">
<title>stairs fit test</title>
<style>html,body{margin:0;background:#111;color:#ccc;font:12px sans-serif}#c{width:1280px;height:880px}</style>
<div id="c"></div>
<!--
  Short-rise stairs + ramps — per-piece rise, rise-aware tread count, the
  app-side ground mirror, and the one-click level fit.

  Modules (transpile into the harness dir before serving):
    npx esbuild src/geometry.ts      --bundle --format=esm --outfile=<harness>/geometry.mod.js
    npx esbuild src/planner.ts       --bundle --format=esm --outfile=<harness>/planner.mod.js
    npx esbuild src/canvas-render.ts --bundle --format=esm --outfile=<harness>/canvas-render.mod.js
    npx esbuild src/canvas-interact.ts --bundle --format=esm --outfile=<harness>/canvas-interact.mod.js
    (the built three-renderer chunk is served next to this file, like the other 3D pages:
     npm run build, then copy THIS PAGE FIRST and dist/assets/ SECOND into the harness dir)

  Asserts:
   (A) pure stairsTreadCount: the golden matrix (defaults UNCHANGED — stairs
       3600/2743 → 13, half 1800/1372 → 6), the short-rise cases the feature
       exists for, and monotonicity in rise at fixed depth.
   (B) pure stairsRiseMm: honours Furniture.ht on the stairs family only, falls
       back on absent / garbage / below-minimum values.
   (C) builder ↔ ground-truth agreement: a 200 mm rise builds ONE tread, 350 mm
       builds TWO, tops land at the rise, and _groundYAt returns exactly those
       heights. Plus the default-flight regression pin (13 treads, top 2743).
   (D) ramp: one wedge whose sloped top runs 0 at the local −Z foot → HT at the
       +Z head (a bare wedge — no curbs), and a LINEAR _groundYAt (mid = base+ht/2).
   (E) resolveItemGroundMm (pure, app-side) === the renderer's _itemGroundY at
       grade / terrace / indoor points, including the floor-elevation composition
       that three-view performs before handing the level to the renderer.
   (F) Planner.autofitStairs on a real Planner: terrace→grade sizes elevation +
       rise (1 tread), the reversed piece auto-rotates 180°, level ends refuse
       with a reason, a ramp fits identically, and locked/non-family refuse.
   (H) Furniture.stairsOpen ("open underneath", 3D-BUILD-ONLY): floating tread /
       ramp / landing slabs whose TOP surfaces are bit-identical to the solid
       build, open air beneath, and a _groundYAt that cannot tell the difference.
   (I) Furniture.stairTreads (the per-piece STEP COUNT override): it wins over
       both derivations, clamps/rounds, and reaches all three consumers — the
       3D builder, _groundYAt's quantization and the 2D glyph.
   (J) Open-flight STRINGERS: two sloped boards under the floating treads,
       flights only, footprint-neutral, clipped at the floor, and 2 mm inside
       the tread cap side plane (the coincident-face pin).
   (K) snapStairEdges v2: rectPenetrationMm's unit matrix, the overlap-safe
       corner weld (with a negative control on the old buried result), and the
       elevation auto-compose across a U staircase / straight chain / landing.
-->
<script type="module">
  const G = await import('./geometry.mod.js');
  const P = await import('./planner.mod.js');
  const mod = await import('./assets/three-renderer.js?v=' + Date.now());
  const r = new mod.ThreeDRenderer(document.getElementById('c'));
  await r.load();

  const tests = [];
  const ok = (name, cond, detail) => tests.push({ name, ok: !!cond, detail });
  const near = (a, b, tol = 1) => Number.isFinite(a) && Math.abs(a - b) <= tol;

  // ══ (A) pure stairsTreadCount ═════════════════════════════════════════════
  const TC = G.stairsTreadCount;
  ok('A1 default full flight 3600/2743 → 13 (regression pin)', TC(3600, 2743) === 13, `n=${TC(3600, 2743)}`);
  ok('A2 default half flight 1800/1372 → 6 (regression pin)', TC(1800, 1372) === 6, `n=${TC(1800, 1372)}`);
  ok('A3 short rise 1000/200 → 1 step', TC(1000, 200) === 1, `n=${TC(1000, 200)}`);
  ok('A4 short rise 1000/350 → 2 steps', TC(1000, 350) === 2, `n=${TC(1000, 350)}`);
  ok('A5 tiny run + tiny rise 600/180 → 1 step', TC(600, 180) === 1, `n=${TC(600, 180)}`);
  ok('A6 the depth floor of 3 still holds for a tall rise', TC(300, 2743) === 3, `n=${TC(300, 2743)}`);
  ok('A7 a 50 mm rise is still one real step', TC(2400, 50) === 1, `n=${TC(2400, 50)}`);
  {
    let mono = true, prev = 0;
    for (let rise = 0; rise <= 4000; rise += 25) {
      const n = TC(3600, rise);
      if (n < prev) mono = false;
      prev = n;
    }
    ok('A8 monotonic non-decreasing in rise at fixed depth', mono && prev === 13, `top=${prev}`);
  }
  ok('A9 garbage inputs never NaN / never below 1',
     TC(NaN, NaN) === 1 && TC(undefined, undefined) === 1 && TC(-3600, -2743) === 3,
     `${TC(NaN, NaN)}/${TC(undefined, undefined)}/${TC(-3600, -2743)}`);

  // ══ (B) pure stairsRiseMm ═════════════════════════════════════════════════
  const RM = G.stairsRiseMm;
  ok('B1 absent ht → the kind default', RM({ kind: 'stairs' }, 2743) === 2743);
  ok('B2 a set ht wins', RM({ kind: 'stairs', ht: 200 }, 2743) === 200);
  ok('B3 landings + ramps honour it too',
     RM({ kind: 'stair_landing', ht: 400 }, 1372) === 400 && RM({ kind: 'ramp', ht: 900 }, 400) === 900);
  ok('B4 non-family kinds ignore ht entirely', RM({ kind: 'sofa', ht: 200 }, 800) === 800);
  ok('B5 garbage / sub-minimum falls back',
     RM({ kind: 'stairs', ht: 0 }, 2743) === 2743 && RM({ kind: 'stairs', ht: 10 }, 2743) === 2743 &&
     RM({ kind: 'stairs', ht: NaN }, 2743) === 2743,
     `min=${G.STAIRS_MIN_RISE_MM}`);
  ok('B6 ramp is a full stairs-family member', G.isStairsKind('ramp') === true && !!G.FURNITURE_KINDS.ramp);

  // ══ shared renderer fixture ═══════════════════════════════════════════════
  const FW = 10000, FD = 10000;
  const scene = { preset: 'day', floorColor: '#8a7860', floorTex: 'none', wallColor: '#cfd2d6' };
  const mkFloor = (extra = {}) => ({
    id: 'f1', name: 'T', w: FW, d: FD, walls: [], furniture: [],
    lights: [], switches: [], sensors: [], motionSensors: [], envSensors: [],
    doors: [], windows: [], bg: null, model3d: null, look3d: null, rooms: [],
    groundAreas: [], ...extra,
  });
  const grpAt = (fu) => r._floorGroup.children.find(
    c => c.type === 'Group' &&
         Math.abs(c.position.x - (FW / 2 - fu.x)) < 1 &&
         Math.abs(c.position.z - (fu.y - FD / 2)) < 1);
  const realMeshes = (o) => {
    const a = []; o.traverse(m => { if (m.isMesh && !m.userData?.outline) a.push(m); }); return a;
  };
  // The builder caps every tread with a 22 mm nosing box — one per step.
  const treadCaps = (o) => realMeshes(o).filter(
    m => m.geometry?.type === 'BoxGeometry' && near(m.geometry.parameters.height, 22, 0.001));
  // Top of the highest TREAD (nosing cap + 11). Kept distinct from the
  // group's overall max Y as a helper (sunken flights no longer build shaft
  // side walls — removed 2026-07-28 — but the cap-based read stays precise).
  const treadTopY = (o) => {
    let hi = -Infinity;
    for (const m of treadCaps(o)) hi = Math.max(hi, m.position.y + 11);
    return hi;
  };
  const topY = (o) => {
    let hi = -Infinity;
    for (const m of realMeshes(o)) {
      m.geometry.computeBoundingBox();
      let y = m.position.y + m.geometry.boundingBox.max.y;
      let p = m.parent;
      while (p && p !== o) { y += p.position.y; p = p.parent; }
      if (y > hi) hi = y;
    }
    return hi;
  };

  // ══ (C) builder ↔ _groundYAt agreement ════════════════════════════════════
  {
    const mk = (id, x, ht) => ({ id, x, y: 5000, w: 1000, h: 1000, kind: 'stairs', rotation: 0, ...(ht ? { ht } : {}) });
    const dflt = { id: 'sDef', x: 8000, y: 5000, w: 1000, h: 3600, kind: 'stairs', rotation: 0 };
    const s200 = mk('s200', 2000, 200), s350 = mk('s350', 5000, 350);
    r.updateFloor(mkFloor({ furniture: [s200, s350, dflt] }), scene);

    ok('C1 a 200 mm rise builds exactly ONE tread', treadCaps(grpAt(s200)).length === 1,
       `n=${treadCaps(grpAt(s200)).length}`);
    ok('C2 …topping out at the rise', near(topY(grpAt(s200)), 200), `top=${topY(grpAt(s200))}`);
    ok('C3 a 350 mm rise builds TWO treads', treadCaps(grpAt(s350)).length === 2,
       `n=${treadCaps(grpAt(s350)).length}`);
    ok('C4 …topping out at the rise', near(topY(grpAt(s350)), 350), `top=${topY(grpAt(s350))}`);
    // Ground truth must agree with the mesh, tread for tread.
    ok('C5 _groundYAt on the 1-tread flight = 200 everywhere on it',
       near(r._groundYAt(2000, 4700), 200) && near(r._groundYAt(2000, 5400), 200),
       `${r._groundYAt(2000, 4700)}/${r._groundYAt(2000, 5400)}`);
    ok('C6 _groundYAt on the 2-tread flight steps 175 → 350',
       near(r._groundYAt(5000, 4700), 175) && near(r._groundYAt(5000, 5400), 350),
       `${r._groundYAt(5000, 4700)}/${r._groundYAt(5000, 5400)}`);
    // REGRESSION PIN — an untouched flight is exactly what it always was.
    ok('C7 default flight still 13 treads', treadCaps(grpAt(dflt)).length === 13,
       `n=${treadCaps(grpAt(dflt)).length}`);
    ok('C8 default flight still tops out at 2743', near(topY(grpAt(dflt)), 2743), `top=${topY(grpAt(dflt))}`);
    ok('C9 default flight _groundYAt still quantizes to 13 treads',
       near(r._groundYAt(8000, 5000 - 1800 + 3600 / 13 / 2), 2743 / 13) &&
       near(r._groundYAt(8000, 5000 + 1800 - 1), 2743),
       `${r._groundYAt(8000, 5000 - 1800 + 3600 / 13 / 2)}/${r._groundYAt(8000, 5000 + 1800 - 1)}`);
    // A landing honours the override on its slab height.
    const land = { id: 'lnd', x: 2000, y: 8000, w: 1000, h: 1000, kind: 'stair_landing', rotation: 0, ht: 300 };
    r.updateFloor(mkFloor({ furniture: [land] }), scene);
    ok('C10 landing rise override drives its slab + ground truth',
       near(topY(grpAt(land)), 300) && near(r._groundYAt(2000, 8000), 300),
       `top=${topY(grpAt(land))} g=${r._groundYAt(2000, 8000)}`);
  }

  // ══ (D) ramp ══════════════════════════════════════════════════════════════
  {
    const HT = 600, D = 2400;
    const rp = { id: 'rp', x: 4000, y: 5000, w: 1200, h: D, kind: 'ramp', rotation: 0, ht: HT };
    r.updateFloor(mkFloor({ furniture: [rp] }), scene);
    const g = grpAt(rp);
    const wedges = realMeshes(g).filter(m => m.geometry?.type === 'ExtrudeGeometry');
    ok('D1 ramp builds exactly one wedge prism', wedges.length === 1, `n=${wedges.length}`);
    ok('D2 ramp has NO treads', treadCaps(g).length === 0, `caps=${treadCaps(g).length}`);
    // No side curbs — the bare wedge IS the ramp (user request 2026-07-28:
    // "remove the sides from the stairs and the ramps"). The wedge (+ blob
    // shadow decal) is the whole build.
    const curbs = realMeshes(g).filter(
      m => m.geometry?.type === 'BoxGeometry' && near(m.geometry.parameters.width, 40, 0.001)
                                              && near(m.geometry.parameters.height, 80, 0.001));
    ok('D3 ramp has NO side curbs (bare wedge)', curbs.length === 0, `n=${curbs.length}`);
    // The wedge's LOCAL frame maps (x,y,z) → world (W/2 − z, y, x): rotation.y
    // = −π/2 plus the +W/2 shift. So the sloped top must read 0 at world
    // z = −D/2 (the local −Z foot) and HT at world z = +D/2 (the head).
    {
      const w = wedges[0], pos = w.geometry.getAttribute('position');
      let footMax = -Infinity, headMax = -Infinity, above = 0;
      for (let i = 0; i < pos.count; i++) {
        const lx = pos.getX(i), ly = pos.getY(i);
        const wz = lx;                        // world z of this vertex
        if (near(wz, -D / 2, 1)) footMax = Math.max(footMax, ly);
        if (near(wz, D / 2, 1))  headMax = Math.max(headMax, ly);
        if (ly > HT * (wz + D / 2) / D + 1) above++;   // nothing may sit above the slope
      }
      ok('D4 sloped top: 0 at the foot, HT at the head, nothing above the plane',
         near(footMax, 0) && near(headMax, HT) && above === 0,
         `foot=${footMax} head=${headMax} above=${above}`);
      ok('D5 the wedge is oriented so world +Z is uphill',
         near(w.rotation.y, -Math.PI / 2, 1e-9) && near(w.position.x, rp.w / 2, 1e-9),
         `rotY=${w.rotation.y} x=${w.position.x}`);
    }
    // Ground truth is the LINEAR slope, not a staircase.
    ok('D6 _groundYAt mid-ramp = base + ht/2', near(r._groundYAt(4000, 5000), HT / 2),
       `g=${r._groundYAt(4000, 5000)}`);
    ok('D7 _groundYAt at the foot ≈ 0 and at the head ≈ HT',
       near(r._groundYAt(4000, 5000 - D / 2 + 5), 0, 5) && near(r._groundYAt(4000, 5000 + D / 2 - 5), HT, 5),
       `${r._groundYAt(4000, 5000 - D / 2 + 5)}/${r._groundYAt(4000, 5000 + D / 2 - 5)}`);
    ok('D8 the slope is continuous (quarter points interpolate)',
       near(r._groundYAt(4000, 5000 - D / 4), HT / 4, 2) && near(r._groundYAt(4000, 5000 + D / 4), 3 * HT / 4, 2),
       `${r._groundYAt(4000, 5000 - D / 4)}/${r._groundYAt(4000, 5000 + D / 4)}`);
    // A sunk ramp carries a raised BASE, and the slope rides on top of it.
    const rd = { ...rp, id: 'rd', x: 7500, elevation: -400 };
    r.updateFloor(mkFloor({ furniture: [rd] }), scene);
    ok('D9 elevation offsets the whole slope (descending ramp)',
       near(r._groundYAt(7500, 5000), -400 + HT / 2) && near(grpAt(rd).position.y, -400),
       `g=${r._groundYAt(7500, 5000)} y=${grpAt(rd).position.y}`);
    ok('D10 a ramp casts no blob shadow (stairs-family rule)',
       realMeshes(grpAt(rd)).every(m => !m.userData?.blob) &&
       !grpAt(rd).children.some(c => c.isMesh && c.geometry?.type === 'PlaneGeometry' && c.position.y === 8 + 400),
       'ok');
  }

  // ══ (E) resolveItemGroundMm ≡ _itemGroundY ════════════════════════════════
  {
    // A house loop in one corner + one sunken terrace out in the yard.
    const walls = [{ id: 'w', points: [
      { x: 1000, y: 1000 }, { x: 3000, y: 1000 }, { x: 3000, y: 3000 },
      { x: 1000, y: 3000 }, { x: 1000, y: 1000 }] }];
    const terrace = { id: 'tr', kind: 'grass', elevationMm: -150, points: [
      { x: 5000, y: 3000 }, { x: 9000, y: 3000 }, { x: 9000, y: 5000 }, { x: 5000, y: 5000 }] };
    const f = mkFloor({ walls, groundAreas: [terrace] });
    const PTS = [
      ['grade (outdoors, no terrace)', 6000, 8000],
      ['terrace interior', 7000, 4000],
      ['indoors', 2000, 2000],
      ['just outside the terrace', 7000, 5400],
    ];
    // Single floor: floorElevationMm('f1') = 0, so effective === the user value.
    const floors1 = [{ id: 'f1' }];
    const USER = -800;
    r.updateFloor(f, { ...scene, groundLevelMm: USER });
    for (const [label, x, y] of PTS) {
      const pure = G.resolveItemGroundMm(f, floors1, USER, x, y);
      const rend = r._itemGroundY(x, y);
      ok(`E ${label}: pure resolveItemGroundMm === renderer _itemGroundY`, near(pure, rend, 0.001),
         `pure=${pure} renderer=${rend}`);
    }
    ok('E5 the terrace really is a distinct level (sanity, not a trivial pass)',
       G.resolveItemGroundMm(f, floors1, USER, 7000, 4000) === -950 &&
       G.resolveItemGroundMm(f, floors1, USER, 6000, 8000) === -800 &&
       G.resolveItemGroundMm(f, floors1, USER, 2000, 2000) === 0,
       `${G.resolveItemGroundMm(f, floors1, USER, 7000, 4000)}/${G.resolveItemGroundMm(f, floors1, USER, 6000, 8000)}`);
    // Two floors: 'f1' is index 1 → AUTO elevation 3000, so the pure resolver
    // must subtract it exactly as three-view does before the renderer sees it.
    {
      const floors2 = [{ id: 'f0' }, { id: 'f1' }];
      const eff = USER - G.floorElevationMm(floors2, 'f1');
      r.updateFloor(f, { ...scene, groundLevelMm: eff });
      let allMatch = true;
      for (const [, x, y] of PTS) {
        if (!near(G.resolveItemGroundMm(f, floors2, USER, x, y), r._itemGroundY(x, y), 0.001)) allMatch = false;
      }
      ok('E6 upper-storey floor elevation composes identically in both', allMatch && eff === -3800, `eff=${eff}`);
    }
    ok('E7 a loop-less floor: terraces apply, the grade does not (matches _outdoors)',
       G.resolveItemGroundMm(mkFloor({ groundAreas: [terrace] }), floors1, USER, 7000, 4000) === -150 &&
       G.resolveItemGroundMm(mkFloor({ groundAreas: [terrace] }), floors1, USER, 6000, 8000) === 0,
       'ok');
    ok('E8 zero ground level + no terraces → 0 everywhere (default path)',
       G.resolveItemGroundMm(mkFloor({ walls }), floors1, 0, 6000, 8000) === 0 &&
       G.resolveItemGroundMm(mkFloor({ walls }), floors1, undefined, 2000, 2000) === 0, 'ok');
  }

  // ══ (F) Planner.autofitStairs ═════════════════════════════════════════════
  {
    const walls = [{ id: 'w', points: [
      { x: 1000, y: 1000 }, { x: 3000, y: 1000 }, { x: 3000, y: 3000 },
      { x: 1000, y: 3000 }, { x: 1000, y: 1000 }] }];
    const terrace = () => ({ id: 'tr', kind: 'grass', elevationMm: -150, points: [
      { x: 5000, y: 3000 }, { x: 9000, y: 3000 }, { x: 9000, y: 5000 }, { x: 5000, y: 5000 }] });
    // Foot (local −Z) lands at y = 5000 − 1350 = 3650 → on the terrace (−950);
    // head at y = 6350 → plain grade (−800). Rise = 150.
    const piece = (over = {}) => ({ id: 'st', x: 7000, y: 5000, w: 1000, h: 2400,
                                    kind: 'stairs', rotation: 0, ...over });
    const mkPlanner = (fu) => {
      const p = new P.Planner();
      p.store = {
        v: 1, currentFloorId: 'f1', activeSensorId: null,
        coverage: false, imperial: false, showDetails: false, useRawTargets: false,
        scene3d: { preset: 'day', groundLevelMm: -800 },
        floors: [{
          id: 'f1', name: 'Ground', w: FW, d: FD, walls, furniture: [fu],
          lights: [], switches: [], sensors: [], motionSensors: [], envSensors: [],
          doors: [], windows: [], bg: null, model3d: null, look3d: null, rooms: [],
          groundAreas: [terrace()],
        }],
      };
      p.uiMode = 'edit';
      return p;
    };

    {
      const fu = piece(), p = mkPlanner(fu);
      const res = p.autofitStairs(fu);
      ok('F1 terrace → grade fits: no refusal', res === null, `res=${res}`);
      ok('F2 elevation = the LOWER end ground (−950)', fu.elevation === -950, `elev=${fu.elevation}`);
      ok('F3 rise = the level difference (150)', fu.ht === 150, `ht=${fu.ht}`);
      ok('F4 rotation untouched when already uphill', (fu.rotation ?? 0) === 0, `rot=${fu.rotation}`);
      ok('F5 that fit is ONE real step', G.stairsTreadCount(fu.h, G.stairsRiseMm(fu, 2743)) === 1,
         `n=${G.stairsTreadCount(fu.h, G.stairsRiseMm(fu, 2743))}`);
      // …and the renderer agrees: base −950, top −800.
      r.updateFloor({ ...p.store.floors[0] }, { ...scene, groundLevelMm: -800 });
      ok('F6 the built flight spans terrace → grade in the scene',
         near(grpAt(fu).position.y, -950) && near(treadTopY(grpAt(fu)) + (fu.elevation ?? 0), -800),
         `base=${grpAt(fu).position.y} top=${treadTopY(grpAt(fu)) + (fu.elevation ?? 0)}`);
    }
    {
      // Aimed downhill (rotated 180°): fit must flip it back and size it the same.
      const fu = piece({ rotation: 180 }), p = mkPlanner(fu);
      const res = p.autofitStairs(fu);
      ok('F7 a downhill-aimed piece is accepted', res === null, `res=${res}`);
      ok('F8 …auto-rotated 180° so it rises from the low end', fu.rotation === 0, `rot=${fu.rotation}`);
      ok('F9 …with the same elevation + rise', fu.elevation === -950 && fu.ht === 150,
         `elev=${fu.elevation} ht=${fu.ht}`);
    }
    {
      // Both ends on plain grade → refuse with a reason, mutate nothing.
      const fu = piece({ x: 2000, y: 7000 }), p = mkPlanner(fu);
      const res = p.autofitStairs(fu);
      ok('F10 level ends refuse with a reason', typeof res === 'string' && /level/i.test(res), `res=${res}`);
      ok('F11 …and nothing was mutated', fu.elevation === undefined && fu.ht === undefined,
         `elev=${fu.elevation} ht=${fu.ht}`);
    }
    {
      // A ramp fits identically — same family predicate, same code path.
      const fu = piece({ kind: 'ramp' }), p = mkPlanner(fu);
      const res = p.autofitStairs(fu);
      ok('F12 a ramp fits between the same two levels', res === null && fu.elevation === -950 && fu.ht === 150,
         `res=${res} elev=${fu.elevation} ht=${fu.ht}`);
      r.updateFloor({ ...p.store.floors[0] }, { ...scene, groundLevelMm: -800 });
      ok('F13 …and its slope really spans them in the scene',
         near(r._groundYAt(7000, 5000 - 1200 + 5), -950, 5) && near(r._groundYAt(7000, 5000 + 1200 - 5), -800, 5),
         `${r._groundYAt(7000, 5000 - 1200 + 5)}/${r._groundYAt(7000, 5000 + 1200 - 5)}`);
    }
    {
      const fu = piece({ locked: true }), p = mkPlanner(fu);
      ok('F14 a locked piece refuses', typeof p.autofitStairs(fu) === 'string', `res=${p.autofitStairs(fu)}`);
      const sofa = piece({ kind: 'sofa' }), p2 = mkPlanner(sofa);
      ok('F15 a non-family kind refuses', typeof p2.autofitStairs(sofa) === 'string');
      const fu3 = piece(), p3 = mkPlanner(fu3);
      p3.uiMode = 'view';
      ok('F16 view mode refuses', typeof p3.autofitStairs(fu3) === 'string' && fu3.ht === undefined);
    }
    {
      // Exactly at the kind default the override is dropped (stays "untouched").
      const fu = piece({ h: 3600 }), p = mkPlanner(fu);
      p.store.floors[0].groundAreas = [{ ...terrace(), elevationMm: -2743 }];  // grade −800 → top −3543
      p.store.floors[0].furniture[0].y = 5000;
      const res = p.autofitStairs(fu);
      ok('F17 a fit that lands on the kind default clears the override',
         res === null && fu.ht === undefined && fu.elevation === -3543,
         `res=${res} ht=${fu.ht} elev=${fu.elevation}`);
    }
  }

  // ══ (G) 2D plan symbols ═══════════════════════════════════════════════════
  {
    const cr = await import('./canvas-render.mod.js?v=' + Date.now());
    const paint = (fu) => {
      const cv = document.createElement('canvas'); cv.width = 120; cv.height = 120;
      const ctx = cv.getContext('2d');
      ctx.translate(60, 60);
      cr.drawFurniturePrimitiveLocal(ctx, { id: 'x', x: 0, y: 0, ...fu }, 40, 44, [], false, {});
      const d = ctx.getImageData(0, 0, 120, 120).data;
      let painted = 0;
      for (let i = 3; i < d.length; i += 4) if (d[i] > 0) painted++;
      return painted;
    };
    let threw = null;
    let ramp = 0, short = 0, dflt = 0;
    try {
      ramp  = paint({ w: 1000, h: 2400, kind: 'ramp', ht: 600 });
      short = paint({ w: 1000, h: 1000, kind: 'stairs', ht: 200 });
      dflt  = paint({ w: 1000, h: 3600, kind: 'stairs' });
      paint({ w: 1000, h: 2400, kind: 'ramp', ht: 600, elevation: -600 });   // DN chevrons
      paint({ w: 1000, h: 1000, kind: 'stair_landing', ht: 300 });
    } catch (e) { threw = String(e); }
    ok('G1 2D plan symbols draw without throwing (ramp / short flight / default / sunk)',
       threw === null, threw ?? 'ok');
    ok('G2 every glyph paints pixels', ramp > 0 && short > 0 && dflt > 0,
       `ramp=${ramp} short=${short} default=${dflt}`);
  }

  // ══ (H) stairsOpen — "open underneath" floating slabs ═════════════════════
  // A 3D-BUILD-ONLY option: the TOP surfaces must be bit-identical to the solid
  // build (so _groundYAt / _buildNav / _terrain / autofit are untouched) while
  // everything BELOW them disappears.
  {
    const minY = (o) => {
      let lo = Infinity;
      for (const m of realMeshes(o)) {
        m.geometry.computeBoundingBox();
        let y = m.position.y + m.geometry.boundingBox.min.y;
        let p = m.parent;
        while (p && p !== o) { y += p.position.y; p = p.parent; }
        if (y < lo) lo = y;
      }
      return lo;
    };
    const capYs = (o) => treadCaps(o).map(m => m.position.y).sort((a, b) => a - b);

    // ── flights: solid vs open, same rise, same run ───────────────────────────
    const HT = 700, RUN = 1000;
    const solid = { id: 'hSolid', x: 2000, y: 2000, w: 1000, h: RUN, kind: 'stairs', rotation: 0, ht: HT };
    const openS = { ...solid, id: 'hOpen', x: 5000, stairsOpen: true };
    r.updateFloor(mkFloor({ furniture: [solid, openS] }), scene);
    const gS = grpAt(solid), gO = grpAt(openS);
    const n = G.stairsTreadCount(RUN, HT), riser = HT / n, treadD = RUN / n;

    ok('H1 open flight builds the SAME tread count as the solid one',
       treadCaps(gO).length === n && treadCaps(gS).length === n, `open=${treadCaps(gO).length} solid=${treadCaps(gS).length} n=${n}`);
    {
      const a = capYs(gS), b = capYs(gO);
      const same = a.length === b.length && a.every((y, i) => near(y, b[i], 1e-9));
      const atRise = b.every((y, i) => near(y + 11, riser * (i + 1), 1e-9));
      ok('H2 every tread TOP is unchanged (cap y + 11 = riser·(i+1))', same && atRise,
         `solid=[${a.map(v => v.toFixed(1))}] open=[${b.map(v => v.toFixed(1))}]`);
    }
    ok('H3 open flight tops out at the rise, exactly like the solid one',
       near(topY(gO), HT, 1e-9) && near(topY(gS), HT, 1e-9), `open=${topY(gO)} solid=${topY(gS)}`);
    {
      // The HIGHEST tread must float: its lowest geometry sits just under its
      // own top, not down at the base.
      const lastZ = -RUN / 2 + (n - 0.5) * treadD;
      let lo = Infinity;
      for (const m of realMeshes(gO)) {
        if (!near(m.position.z, lastZ, 1)) continue;
        m.geometry.computeBoundingBox();
        lo = Math.min(lo, m.position.y + m.geometry.boundingBox.min.y);
      }
      ok('H4 the top tread is open underneath (min y ≥ riser·(n−1) − 70)',
         lo >= riser * (n - 1) - 70 && near(lo, HT - 60, 1),
         `min=${lo} floor=${riser * (n - 1) - 70}`);
    }
    {
      // Stringers (the boards carrying the treads) DO touch down by design —
      // the assertion is about the TREADS floating, so they are filtered out.
      const treadOnly = (o) => {
        let lo = Infinity;
        for (const m of realMeshes(o)) {
          if (m.userData?.stairStringer) continue;
          m.geometry.computeBoundingBox();
          let y = m.position.y + m.geometry.boundingBox.min.y;
          let pp = m.parent;
          while (pp && pp !== o) { y += pp.position.y; pp = pp.parent; }
          if (y < lo) lo = y;
        }
        return lo;
      };
      ok('H5 no TREAD in the open flight reaches the base (min y = riser − 60 > 0)',
         treadOnly(gO) > 0 && near(treadOnly(gO), riser - 60, 1), `min=${treadOnly(gO)}`);
      ok('H5b …while the stringers under them DO touch down (they carry the flight)',
         near(minY(gO), 0, 1e-6), `min=${minY(gO)}`);
    }
    ok('H6 SOLID regression: the first tread still reaches y = 0',
       near(minY(gS), 0, 1e-9), `min=${minY(gS)}`);
    ok('H7 _groundYAt is identical on the open and the solid flight',
       near(r._groundYAt(5000, 2000 - RUN / 2 + 5), r._groundYAt(2000, 2000 - RUN / 2 + 5), 1e-9) &&
       near(r._groundYAt(5000, 2000 + RUN / 2 - 5), r._groundYAt(2000, 2000 + RUN / 2 - 5), 1e-9) &&
       near(r._groundYAt(5000, 2000 + RUN / 2 - 5), HT, 1e-9),
       `${r._groundYAt(5000, 2000 - RUN / 2 + 5)}/${r._groundYAt(2000, 2000 - RUN / 2 + 5)} · ` +
       `${r._groundYAt(5000, 2000 + RUN / 2 - 5)}/${r._groundYAt(2000, 2000 + RUN / 2 - 5)}`);

    // ── ramp: sloped slab, same top plane ────────────────────────────────────
    {
      const RHT = 600, RD = 2400, SLAB = 80;
      const vert = SLAB * Math.hypot(RD, RHT) / RD;   // perpendicular slab → vertical drop
      const rSolid = { id: 'hrS', x: 2000, y: 6000, w: 1200, h: RD, kind: 'ramp', rotation: 0, ht: RHT };
      const rOpen = { ...rSolid, id: 'hrO', x: 6000, stairsOpen: true };
      r.updateFloor(mkFloor({ furniture: [rSolid, rOpen] }), scene);
      const go = grpAt(rOpen);
      const wedges = realMeshes(go).filter(m => m.geometry?.type === 'ExtrudeGeometry');
      ok('H8 the open ramp is still ONE extruded prism (never a rotated box)',
         wedges.length === 1 && near(wedges[0].rotation.y, -Math.PI / 2, 1e-9) &&
         near(wedges[0].position.x, rOpen.w / 2, 1e-9), `n=${wedges.length}`);
      {
        const pos = wedges[0].geometry.getAttribute('position');
        let footMax = -Infinity, headMax = -Infinity, headMin = Infinity, above = 0, gmin = Infinity;
        for (let i = 0; i < pos.count; i++) {
          const wz = pos.getX(i), ly = pos.getY(i);
          if (near(wz, -RD / 2, 1)) footMax = Math.max(footMax, ly);
          if (near(wz, RD / 2, 1)) { headMax = Math.max(headMax, ly); headMin = Math.min(headMin, ly); }
          if (ly > RHT * (wz + RD / 2) / RD + 1) above++;
          gmin = Math.min(gmin, ly);
        }
        ok('H9 the open ramp TOP plane is unchanged (0 at the foot, HT at the head, nothing above)',
           near(footMax, 0, 1e-6) && near(headMax, RHT, 1e-6) && above === 0,
           `foot=${footMax} head=${headMax} above=${above}`);
        ok('H10 …and it is a SLAB: the head end bottoms out at HT − slab/cos(slope), well above 0',
           near(headMin, RHT - vert, 0.01) && headMin > 0,
           `headMin=${headMin} expect=${RHT - vert}`);
        ok('H11 …still touching down at the foot (underside clipped at y = 0)',
           near(gmin, 0, 1e-6), `min=${gmin}`);
      }
      ok('H12 _groundYAt on the open ramp is the identical linear slope',
         near(r._groundYAt(6000, 6000), r._groundYAt(2000, 6000), 1e-9) &&
         near(r._groundYAt(6000, 6000), RHT / 2, 1) &&
         near(r._groundYAt(6000, 6000 + RD / 4), 3 * RHT / 4, 2),
         `${r._groundYAt(6000, 6000)}/${r._groundYAt(2000, 6000)}`);
      // SOLID regression: the untouched wedge still runs down to y = 0 everywhere.
      {
        const ws = realMeshes(grpAt(rSolid)).filter(m => m.geometry?.type === 'ExtrudeGeometry')[0];
        const pos = ws.geometry.getAttribute('position');
        let headMin = Infinity;
        for (let i = 0; i < pos.count; i++) {
          if (near(pos.getX(i), RD / 2, 1)) headMin = Math.min(headMin, pos.getY(i));
        }
        ok('H13 SOLID regression: the plain wedge still reaches y = 0 at the head',
           near(headMin, 0, 1e-9), `headMin=${headMin}`);
      }
    }

    // ── landing ──────────────────────────────────────────────────────────────
    {
      const LHT = 400;
      const lSolid = { id: 'hlS', x: 2000, y: 8500, w: 1000, h: 1000, kind: 'stair_landing', rotation: 0, ht: LHT };
      const lOpen = { ...lSolid, id: 'hlO', x: 5000, stairsOpen: true };
      r.updateFloor(mkFloor({ furniture: [lSolid, lOpen] }), scene);
      ok('H14 the open landing tops out at HT, exactly like the solid one',
         near(topY(grpAt(lOpen)), LHT, 1e-9) && near(topY(grpAt(lSolid)), LHT, 1e-9),
         `open=${topY(grpAt(lOpen))} solid=${topY(grpAt(lSolid))}`);
      ok('H15 …and it is a platform slab (bottom ≥ HT − 70), while the solid one still reaches 0',
         minY(grpAt(lOpen)) >= LHT - 70 && near(minY(grpAt(lOpen)), LHT - 60, 1) &&
         near(minY(grpAt(lSolid)), 0, 1e-9),
         `open=${minY(grpAt(lOpen))} solid=${minY(grpAt(lSolid))}`);
      ok('H16 _groundYAt on the open landing is unchanged',
         near(r._groundYAt(5000, 8500), LHT, 1e-9) && near(r._groundYAt(2000, 8500), LHT, 1e-9),
         `${r._groundYAt(5000, 8500)}/${r._groundYAt(2000, 8500)}`);
    }
  }

  // ══ (I) Furniture.stairTreads — the per-piece STEP COUNT override ═════════
  // A user counting the steps on their real staircase is the authority, so the
  // override wins over BOTH the run-depth and the rise derivations, and all
  // three consumers (3D builder, 2D glyph, _groundYAt) read the same field.
  {
    ok('I1 absent override → the derived count (regression pin)', TC(1800, 1372) === 6, `n=${TC(1800, 1372)}`);
    ok('I2 override wins over the derivation', TC(1800, 1372, 10) === 10, `n=${TC(1800, 1372, 10)}`);
    ok('I3 …and over the RISE cap too (a short rise, many steps)',
       TC(1000, 200, 8) === 8 && TC(1000, 200) === 1, `n=${TC(1000, 200, 8)}`);
    ok('I4 below 1 falls back to the derivation', TC(1800, 1372, 0.4) === 6, `n=${TC(1800, 1372, 0.4)}`);
    ok('I5 zero / negative / NaN / undefined all fall back',
       TC(1800, 1372, 0) === 6 && TC(1800, 1372, -5) === 6 &&
       TC(1800, 1372, NaN) === 6 && TC(1800, 1372, undefined) === 6, 'ok');
    ok('I6 clamped at 60', TC(1800, 1372, 200) === 60, `n=${TC(1800, 1372, 200)}`);
    ok('I7 rounded to a whole step', TC(1800, 1372, 3.6) === 4 && TC(1800, 1372, 3.4) === 3,
       `${TC(1800, 1372, 3.6)}/${TC(1800, 1372, 3.4)}`);
    ok('I8 exactly 1 is honoured (not treated as absent)', TC(3600, 2743, 1) === 1, `n=${TC(3600, 2743, 1)}`);

    // Renderer: the builder AND the ground truth follow the override together.
    const HTd = 1372, RUNd = 1800;
    const over = { id: 'iOver', x: 2000, y: 5000, w: 1000, h: RUNd, kind: 'stairs_half', rotation: 0, stairTreads: 9 };
    const auto = { id: 'iAuto', x: 6000, y: 5000, w: 1000, h: RUNd, kind: 'stairs_half', rotation: 0 };
    r.updateFloor(mkFloor({ furniture: [over, auto] }), scene);
    ok('I9 the builder renders the overridden step count', treadCaps(grpAt(over)).length === 9,
       `n=${treadCaps(grpAt(over)).length}`);
    ok('I10 …and an un-overridden twin still renders the derived 6 (regression pin)',
       treadCaps(grpAt(auto)).length === 6, `n=${treadCaps(grpAt(auto)).length}`);
    ok('I11 the overridden flight still tops out at the rise',
       near(topY(grpAt(over)), HTd, 1e-6) && near(topY(grpAt(auto)), HTd, 1e-6),
       `over=${topY(grpAt(over))} auto=${topY(grpAt(auto))}`);
    {
      // Centre of the piece → frac 0.5 → step floor(0.5·n) → (ht/n)·(step+1).
      const gOver = r._groundYAt(2000, 5000), gAuto = r._groundYAt(6000, 5000);
      ok('I12 _groundYAt quantizes to the OVERRIDDEN 9-step layout',
         near(gOver, (HTd / 9) * 5, 1e-6), `g=${gOver} want=${(HTd / 9) * 5}`);
      ok('I13 …while the un-overridden twin keeps the 6-step layout',
         near(gAuto, (HTd / 6) * 4, 1e-6), `g=${gAuto} want=${(HTd / 6) * 4}`);
      ok('I14 the two layouts really do differ (the pin is not vacuous)',
         Math.abs(gOver - gAuto) > 1, `${gOver} vs ${gAuto}`);
    }
    {
      // Every tread top of the overridden flight sits on the 9-step ladder.
      const ys = treadCaps(grpAt(over)).map(m => m.position.y + 11).sort((a, b) => a - b);
      ok('I15 every overridden tread top = riser·(i+1) with riser = ht/9',
         ys.length === 9 && ys.every((y, i) => near(y, (HTd / 9) * (i + 1), 1e-6)),
         `[${ys.map(v => v.toFixed(1))}]`);
    }
    {
      // The 2D glyph reads the same field (it must not throw and must paint).
      const cr = await import('./canvas-render.mod.js?v=' + Date.now());
      // The glyph FILLS its rect at alpha 0.4, so any-alpha pixel counting
      // saturates; the tread lines are drawn fully OPAQUE over that fill, so
      // count alpha ≈ 255 pixels instead.
      const paintLines = (fu) => {
        const cv = document.createElement('canvas'); cv.width = 140; cv.height = 140;
        const ctx = cv.getContext('2d'); ctx.translate(70, 70);
        cr.drawFurniturePrimitiveLocal(ctx, { id: 'x', x: 0, y: 0, ...fu }, 40, 90, [], false, {});
        const d = ctx.getImageData(0, 0, 140, 140).data;
        let solid = 0;
        for (let i = 3; i < d.length; i += 4) if (d[i] > 200) solid++;
        return solid;
      };
      let threw = null, a = 0, b = 0;
      try {
        a = paintLines({ w: 1000, h: RUNd, kind: 'stairs_half' });
        b = paintLines({ w: 1000, h: RUNd, kind: 'stairs_half', stairTreads: 20 });
      } catch (e) { threw = String(e); }
      ok('I16 the 2D glyph honours the override (more tread lines, no throw)',
         threw === null && a > 0 && b > a, `${threw ?? ''} auto=${a} over=${b}`);
    }
  }

  // ══ (J) Open-flight STRINGERS ═════════════════════════════════════════════
  // The two sloped boards that carry the floating tread slabs. NOT the removed
  // full-height shaft side walls — thin boards tucked under the treads.
  {
    // World-local AABB of a mesh under a pure Y rotation (all we ever use).
    const meshBox = (m) => {
      const pos = m.geometry.attributes.position;
      const c = Math.cos(m.rotation.y), s = Math.sin(m.rotation.y);
      const b = { minX: Infinity, maxX: -Infinity, minY: Infinity, maxY: -Infinity };
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
        const wx = x * c + z * s + m.position.x, wy = y + m.position.y;
        if (wx < b.minX) b.minX = wx; if (wx > b.maxX) b.maxX = wx;
        if (wy < b.minY) b.minY = wy; if (wy > b.maxY) b.maxY = wy;
      }
      return b;
    };
    const stringers = (o) => realMeshes(o).filter(m => m.userData?.stairStringer === true);

    const W = 1000, RUN = 1800, HT = 1372;
    const sSolid = { id: 'jS', x: 2000, y: 7000, w: W, h: RUN, kind: 'stairs_half', rotation: 0 };
    const sOpen = { ...sSolid, id: 'jO', x: 6000, stairsOpen: true };
    r.updateFloor(mkFloor({ furniture: [sSolid, sOpen] }), scene);
    const gO = grpAt(sOpen), gS = grpAt(sSolid);
    ok('J1 an OPEN flight builds exactly two stringers', stringers(gO).length === 2,
       `n=${stringers(gO).length}`);
    ok('J2 a SOLID flight builds none (byte-identical to before)', stringers(gS).length === 0,
       `n=${stringers(gS).length}`);
    {
      const bs = stringers(gO).map(meshBox);
      ok('J3 neither board widens the footprint (|x| ≤ W/2)',
         bs.every(b => b.maxX <= W / 2 + 1e-6 && b.minX >= -W / 2 - 1e-6),
         bs.map(b => `[${b.minX.toFixed(1)},${b.maxX.toFixed(1)}]`).join(' '));
      ok('J4 one board per side', bs.length === 2 &&
         bs.some(b => b.maxX > 0 && b.minX > 0) && bs.some(b => b.minX < 0 && b.maxX < 0),
         bs.map(b => `[${b.minX.toFixed(1)},${b.maxX.toFixed(1)}]`).join(' '));
      ok('J5 they are 40 mm boards', bs.every(b => near(b.maxX - b.minX, 40, 1e-6)),
         bs.map(b => (b.maxX - b.minX).toFixed(2)).join('/'));
      ok('J6 the top never pokes above the flight (≤ HT)', bs.every(b => b.maxY <= HT + 1),
         bs.map(b => b.maxY.toFixed(1)).join('/'));
      ok('J7 …and reaches the head (top ≈ HT)', bs.every(b => near(b.maxY, HT, 1)),
         bs.map(b => b.maxY.toFixed(1)).join('/'));
      ok('J8 the bottom is clipped at the floor (≥ 0, and it touches down)',
         bs.every(b => b.minY >= -1 && b.minY <= 1), bs.map(b => b.minY.toFixed(3)).join('/'));
      // Coincident-face pin: the full-width tread CAP side plane vs the board's
      // OUTER face must NOT be coplanar (2 mm apart by construction).
      const outer = Math.max(...bs.map(b => b.maxX));
      ok('J9 the outer face is 2 mm inside the tread cap side plane (no coplanar pair)',
         near(W / 2 - outer, 2, 1e-6), `capPlane=${W / 2} outer=${outer}`);
      // …and the inset tread BODY side plane (±(W/2 − 4)) is BURIED in the board.
      const bodyPlane = W / 2 - 4;
      const plus = bs.find(b => b.minX > 0);
      ok('J10 the tread body side plane lands inside the board thickness (buried)',
         bodyPlane < plus.maxX && bodyPlane > plus.minX,
         `body=${bodyPlane} board=[${plus.minX.toFixed(1)},${plus.maxX.toFixed(1)}]`);
    }
    ok('J11 stringers do not disturb the tread count / tops',
       treadCaps(gO).length === treadCaps(gS).length &&
       near(topY(gO), topY(gS), 1e-6), `${treadCaps(gO).length}/${treadCaps(gS).length}`);
    ok('J12 …nor the walkable ground truth',
       near(r._groundYAt(6000, 7000), r._groundYAt(2000, 7000), 1e-9),
       `${r._groundYAt(6000, 7000)} vs ${r._groundYAt(2000, 7000)}`);
    {
      // Landing + ramp are untouched — stringers are a FLIGHT thing only.
      const land = { id: 'jL', x: 2000, y: 2500, w: 1000, h: 1000, kind: 'stair_landing', rotation: 0, ht: 400, stairsOpen: true };
      const ramp = { id: 'jR', x: 6000, y: 2500, w: 1000, h: 2400, kind: 'ramp', rotation: 0, stairsOpen: true };
      r.updateFloor(mkFloor({ furniture: [land, ramp] }), scene);
      ok('J13 an open LANDING builds no stringers', stringers(grpAt(land)).length === 0,
         `n=${stringers(grpAt(land)).length}`);
      ok('J14 an open RAMP builds no stringers', stringers(grpAt(ramp)).length === 0,
         `n=${stringers(grpAt(ramp)).length}`);
    }
    {
      // A single-tread flight is skipped (its top edge would be horizontal AT
      // the cap top = a coplanar pair).
      const one = { id: 'j1', x: 3000, y: 2500, w: 1000, h: 1000, kind: 'stairs', rotation: 0, ht: 200, stairsOpen: true };
      r.updateFloor(mkFloor({ furniture: [one] }), scene);
      ok('J15 a ONE-tread open flight builds no stringers',
         treadCaps(grpAt(one)).length === 1 && stringers(grpAt(one)).length === 0,
         `treads=${treadCaps(grpAt(one)).length} stringers=${stringers(grpAt(one)).length}`);
    }
    {
      // Very short flight (rise under the 300 mm drop) → the triangle fallback,
      // still two well-formed boards clipped at the floor.
      const shortF = { id: 'jT', x: 3000, y: 5000, w: 1000, h: 1000, kind: 'stairs', rotation: 0, ht: 260, stairsOpen: true };
      r.updateFloor(mkFloor({ furniture: [shortF] }), scene);
      const bs = stringers(grpAt(shortF)).map(meshBox);
      ok('J16 a flight shorter than the drop still builds two clipped boards',
         bs.length === 2 && bs.every(b => b.minY >= -1e-6 && b.maxY <= 260 + 1), 
         `n=${bs.length} ${bs.map(b => `${b.minY.toFixed(1)}..${b.maxY.toFixed(1)}`).join(' ')}`);
    }
  }

  // ══ (K) snapStairEdges v2 — overlap-safe weld + elevation auto-compose ════
  {
    const CI = await import('./canvas-interact.mod.js?v=' + Date.now());
    const PEN = G.rectPenetrationMm;

    // ── rectPenetrationMm unit matrix ────────────────────────────────────────
    const R = (x, y, w, h, rot) => ({ x, y, w, h, rotation: rot ?? 0 });
    ok('K1 separated rects → 0', PEN(R(0, 0, 100, 100), R(500, 0, 100, 100)) === 0);
    ok('K2 exactly touching → ~0', near(PEN(R(0, 0, 100, 100), R(100, 0, 100, 100)), 0, 1e-9),
       String(PEN(R(0, 0, 100, 100), R(100, 0, 100, 100))));
    ok('K3 a known 40 mm overlap measures 40',
       near(PEN(R(0, 0, 100, 100), R(60, 0, 100, 100)), 40, 1e-9),
       String(PEN(R(0, 0, 100, 100), R(60, 0, 100, 100))));
    ok('K4 identical rects → the full min dimension',
       near(PEN(R(0, 0, 100, 60), R(0, 0, 100, 60)), 60, 1e-9),
       String(PEN(R(0, 0, 100, 60), R(0, 0, 100, 60))));
    ok('K5 a rotated pair separates correctly',
       PEN(R(0, 0, 100, 100, 45), R(400, 0, 100, 100, 45)) === 0 &&
       PEN(R(0, 0, 100, 100, 45), R(50, 0, 100, 100, 45)) > 0, 'ok');
    ok('K6 corner-touching rects are not "penetrating"',
       near(PEN(R(0, 0, 100, 100), R(100, 100, 100, 100)), 0, 1e-9),
       String(PEN(R(0, 0, 100, 100), R(100, 100, 100, 100))));

    // ── the well-formed U staircase (defaults: rise/landing ht 1372) ─────────
    // A rises 0→1372 (head at y=1800), the landing tops out at 1372, B turns
    // back and starts FROM the landing.
    const mkU = (over = {}) => {
      const A = { id: 'A', x: 500, y: 900, w: 1000, h: 1800, kind: 'stairs_half', rotation: 0, elevation: 0 };
      const L = { id: 'L', x: 1000, y: 2300, w: 2000, h: 1000, kind: 'stair_landing', rotation: 0, elevation: 0 };
      const B = { id: 'B', x: 1500, y: 900, w: 1000, h: 1800, kind: 'stairs_half', rotation: 180, elevation: 1372 };
      const f = { furniture: [A, L, B] };
      Object.assign(f.furniture.find(p => p.id === over.id) ?? {}, over);
      return { f, A, L, B };
    };
    {
      // (a) weld B in from a sloppy drop → position AND elevation land.
      const { f, B } = mkU();
      B.x = 1540; B.y = 930; B.elevation = 0;
      const changed = CI.snapStairEdges(f, B);
      ok('K7 a sloppily-dropped half flight welds onto the landing corner',
         changed === true && B.x === 1500 && B.y === 900, `changed=${changed} (${B.x},${B.y})`);
      ok('K8 …and its elevation composes to the landing top (its FOOT abuts it)',
         B.elevation === 1372, `elev=${B.elevation}`);
    }
    {
      // …idempotent: re-welding a correct staircase changes no elevation.
      const { f, A, L, B } = mkU();
      CI.snapStairEdges(f, B);
      ok('K9 re-welding the already-correct B is an elevation no-op', B.elevation === 1372 && B.x === 1500,
         `elev=${B.elevation} x=${B.x}`);
      CI.snapStairEdges(f, A);
      ok('K10 re-welding A (its HEAD meets the landing: 1372 − 1372) stays 0',
         A.elevation === 0 && A.x === 500 && A.y === 900, `elev=${A.elevation} (${A.x},${A.y})`);
      L.x = 1030; L.y = 2360;
      CI.snapStairEdges(f, L);
      ok('K11 nudging the landing welds it back with elevation untouched',
         L.x === 1000 && L.y === 2300 && L.elevation === 0, `(${L.x},${L.y}) elev=${L.elevation}`);
      CI.snapStairEdges(f, B);
      ok('K12 …and B is still 1372 after the whole round trip (idempotent)',
         B.elevation === 1372, `elev=${B.elevation}`);
    }
    {
      // (b) straight chain: an upper flight's FOOT on a lower flight's HEAD.
      const low = { id: 'lo', x: 500, y: 900, w: 1000, h: 1800, kind: 'stairs_half', rotation: 0, elevation: 0 };
      const up = { id: 'up', x: 520, y: 2730, w: 1000, h: 1800, kind: 'stairs_half', rotation: 0, elevation: 0 };
      const f = { furniture: [low, up] };
      CI.snapStairEdges(f, up);
      ok('K13 a straight chain composes the upper flight onto the lower rise',
         up.x === 500 && up.y === 2700 && up.elevation === 1372,
         `(${up.x},${up.y}) elev=${up.elevation}`);
    }
    {
      // (c) my HEAD abutting a low landing → landingTop − myRise (negative here).
      const fl = { id: 'f1', x: 500, y: 880, w: 1000, h: 1800, kind: 'stairs_half', rotation: 0, elevation: 0 };
      const land = { id: 'l1', x: 500, y: 2300, w: 1000, h: 1000, kind: 'stair_landing', rotation: 0, ht: 400, elevation: 0 };
      const f = { furniture: [fl, land] };
      CI.snapStairEdges(f, fl);
      ok('K14 a HEAD-on-landing weld composes landingTop − myRise',
         fl.y === 900 && fl.elevation === 400 - 1372, `y=${fl.y} elev=${fl.elevation}`);
    }
    {
      // (d) overlap rejection — the reported defect. A sloppy flight near A's
      // corner used to snap to (1900, 2300), fully inside the landing.
      const A = { id: 'A', x: 500, y: 900, w: 1000, h: 1800, kind: 'stairs_half', rotation: 0, elevation: 0 };
      const L = { id: 'L', x: 1000, y: 2300, w: 2000, h: 1000, kind: 'stair_landing', rotation: 0, elevation: 0 };
      const bad = { id: 'X', x: 2080, y: 2320, w: 1000, h: 1800, kind: 'stairs_half', rotation: 90, elevation: 0 };
      // NB this probe DROP already overlaps the landing (820 mm) — the sloppy
      // placement the user made. A ≤ 250 mm weld can never undo that, so the
      // pin is that the weld must not make it WORSE by jumping to a far corner.
      const penBefore = PEN(bad, L);
      const oldRes = { ...bad, x: 1900, y: 2300 };
      ok('K15 negative control: the old nearest-corner result buried it deeper still',
         PEN(oldRes, L) > 300 && PEN(oldRes, L) > penBefore,
         `old=${PEN(oldRes, L)} drop=${penBefore}`);
      const f = { furniture: [A, L, bad] };
      CI.snapStairEdges(f, bad);
      ok('K16 the weld never increases penetration (it no longer corner-jumps inward)',
         PEN(bad, L) <= penBefore && PEN(bad, A) <= 30,
         `(${bad.x},${bad.y}) penL=${PEN(bad, L)} drop=${penBefore} penA=${PEN(bad, A)}`);
      ok('K17 …and it did not land on the old buried position',
         !(bad.x === 1900 && bad.y === 2300), `(${bad.x},${bad.y})`);
      {
        // The same defect from a CLEAN drop: the nearest corner belongs to one
        // piece while the snap would bury the flight 183 mm inside a THIRD one
        // (a rotated landing) — which is why the rejection tests EVERY stair
        // piece, not just the corner's owner.
        const C = { id: 'C', x: 2600, y: 2300, w: 1000, h: 1000, kind: 'stair_landing', rotation: 30, elevation: 0 };
        const clean = { id: 'Y', x: 2400, y: 3900, w: 1000, h: 1800, kind: 'stairs_half', rotation: 0, elevation: 0 };
        const before = Math.max(PEN(clean, A), PEN(clean, L), PEN(clean, C));
        ok('K17b negative control: the drop is clean and the old snap would bury it',
           near(before, 0, 1e-6) && PEN({ ...clean, x: 2500, y: 3700 }, C) > 150,
           `before=${before} old=${PEN({ ...clean, x: 2500, y: 3700 }, C)}`);
        CI.snapStairEdges({ furniture: [A, L, C, clean] }, clean);
        ok('K17c the corner weld is refused rather than burying it in the third piece',
           Math.max(PEN(clean, A), PEN(clean, L), PEN(clean, C)) <= 30 &&
           !(clean.x === 2500 && clean.y === 3700),
           `(${clean.x},${clean.y}) pen=${Math.max(PEN(clean, A), PEN(clean, L), PEN(clean, C))}`);
      }
    }
    {
      // (e) side-by-side flights: position welds, elevation is NOT composed
      // (their shared edges are the SLOPED sides, which hand off no level).
      const a = { id: 'sa', x: 500, y: 900, w: 1000, h: 1800, kind: 'stairs_half', rotation: 0, elevation: 0 };
      const b = { id: 'sb', x: 1520, y: 920, w: 1000, h: 1800, kind: 'stairs_half', rotation: 0, elevation: 0 };
      const f = { furniture: [a, b] };
      const changed = CI.snapStairEdges(f, b);
      ok('K18 side-by-side flights weld position…',
         changed === true && b.x === 1500 && b.y === 900, `(${b.x},${b.y})`);
      ok('K19 …without touching elevation (a side edge is the slope)',
         b.elevation === 0, `elev=${b.elevation}`);
    }
    {
      // A locked piece and a non-family kind still refuse outright.
      const L = { id: 'L', x: 1000, y: 2300, w: 2000, h: 1000, kind: 'stair_landing', rotation: 0, elevation: 0 };
      const lk = { id: 'lk', x: 1540, y: 930, w: 1000, h: 1800, kind: 'stairs_half', rotation: 180, elevation: 0, locked: true };
      const sofa = { id: 'so', x: 1540, y: 930, w: 1000, h: 1800, kind: 'sofa', rotation: 0, elevation: 0 };
      ok('K20 a locked piece never welds or composes',
         CI.snapStairEdges({ furniture: [L, lk] }, lk) === false && lk.x === 1540 && lk.elevation === 0,
         `(${lk.x}) elev=${lk.elevation}`);
      ok('K21 a non-family kind is ignored',
         CI.snapStairEdges({ furniture: [L, sofa] }, sofa) === false && sofa.x === 1540, `x=${sofa.x}`);
    }
    {
      // A lone piece with nothing to weld to is untouched.
      const solo = { id: 'so1', x: 4000, y: 4000, w: 1000, h: 1800, kind: 'stairs_half', rotation: 0, elevation: 250 };
      ok('K22 a lone flight neither moves nor re-elevates',
         CI.snapStairEdges({ furniture: [solo] }, solo) === false &&
         solo.x === 4000 && solo.elevation === 250, `(${solo.x}) elev=${solo.elevation}`);
    }
    {
      // The per-piece rise override feeds the compose (not the kind default).
      const low = { id: 'r1', x: 500, y: 500, w: 1000, h: 1000, kind: 'stairs', rotation: 0, elevation: 0, ht: 300 };
      const up = { id: 'r2', x: 520, y: 1490, w: 1000, h: 1000, kind: 'stairs', rotation: 0, elevation: 0, ht: 300 };
      const f = { furniture: [low, up] };
      CI.snapStairEdges(f, up);
      ok('K23 the compose reads the per-piece RISE override', up.elevation === 300,
         `elev=${up.elevation}`);
    }
  }

  // Restore a clean frame for the tally.
  r.updateFloor(mkFloor(), scene);

  let pass = 0; const fails = [];
  for (const t of tests) { if (t.ok) pass++; else fails.push(t.name); }
  const total = tests.length, allPass = pass === total;
  const title = allPass ? `STAIRSFIT PASS ${pass}/${total}` : `STAIRSFIT FAIL ${pass}/${total} [${fails.join(',')}]`;
  document.title = title;
  window.__RESULT__ = { title };
  document.body.insertAdjacentHTML('beforeend',
    `<pre style="position:fixed;left:8px;top:8px;color:#8f8">${title}\n` +
    tests.map(t => `${t.ok ? 'PASS' : 'FAIL'} ${t.name} — ${t.detail ?? ''}`).join('\n') + `</pre>`);
</script>
