<!doctype html>
<meta charset="utf-8">
<title>BGTEXTMULTI …</title>
<style>
  html,body{margin:0;background:#0b0f14;color:#cfd8dc;font:13px/1.4 sans-serif}
  #c{width:1000px;height:640px}
  #log{position:fixed;right:8px;top:8px;width:400px;max-height:96vh;overflow:auto;
       background:#111820;border:1px solid #263340;border-radius:6px;padding:8px 10px;font-size:11px}
  .pass{color:#69f0ae}.fail{color:#ff5252}.hd{font-weight:bold;margin:2px 0 6px}
</style>
<div id="c"></div>
<div id="log"></div>
<!--
  Multi-instance background text (skywriting / banner plane / grass / message
  train / news chopper) + legacy→bgTexts migration + per-entry resolution.

  Drives the REAL ThreeDRenderer (built chunk) for the multi-rig build/motion
  asserts, and a REAL Planner (bundled with a fake avatar-store) for migration +
  resolution. Build the two extra bundles into the harness:

    npx esbuild src/value-rules.ts --bundle --format=esm \
      --outfile=<harness>/value-rules.mod.js         (unused here; kept for bgtext-test)
    T=$(mktemp -d); cp -r src/* "$T"/; cp test-pages/fake-avatar-store.ts "$T"/avatar-store.ts
    npx esbuild "$T"/planner.ts --bundle --format=esm --outfile=<harness>/planner.mod.js

  Everything is synchronous after updateBgTexts, so reads reflect only manual steps.
-->
<script type="module">
 try {
  const V = '?v=' + Date.now();
  const mod = await import('./assets/three-renderer.js' + V);
  const { Planner } = await import('./planner.mod.js' + V);
  const THREE_DoubleSide = 2;   // THREE.DoubleSide constant (avoid a three import)

  const r = new mod.ThreeDRenderer(document.getElementById('c'));
  await r.load();

  // Floor 12000×8000 with a house loop leaving clear yard margins.
  const floor = {
    id: 'f1', name: 'T', w: 12000, d: 8000,
    walls: [{ id: 'w', points: [
      { x: 3000, y: 2000 }, { x: 9000, y: 2000 }, { x: 9000, y: 6500 },
      { x: 3000, y: 6500 }, { x: 3000, y: 2000 } ] }],
    furniture: [], lights: [], switches: [], sensors: [], motionSensors: [],
    envSensors: [], doors: [], windows: [], bg: null, model3d: null, look3d: null,
  };
  r.updateFloor(floor, { preset: 'day', floorColor: '#8a7860', floorTex: 'wood', wallColor: '#cfd2d6' });
  r.applyViewPreset('iso');

  const tests = [];
  const ok = (name, cond, detail) => tests.push({ name, ok: !!cond, detail: detail ?? '' });

  let clk = 1000;
  const step = (n, dt = 1 / 60) => { for (let i = 0; i < n; i++) { clk += dt; r._advanceBgText(dt, clk); } };

  const painted = (tex) => {
    const cv = tex.image, g = cv.getContext('2d');
    const d = g.getImageData(0, 0, cv.width, cv.height).data;
    let lit = 0;
    for (let i = 0; i < d.length; i += 4) if (d[i + 3] > 40 && (d[i] + d[i + 1] + d[i + 2]) > 60) lit++;
    return lit;
  };
  const flanks = (carObj) => {
    const out = {};
    carObj.traverse(o => { if (o.userData && o.userData.flank) out[o.userData.flank] = o; });
    return out;
  };
  const ent = (mode, text, extra) => ({ id: 'e_' + Math.random().toString(36).slice(2, 7), mode, text, ...(extra || {}) });
  const THREE_FrontSide = 0;    // THREE.FrontSide (avoid a three import, like THREE_DoubleSide)
  // Make a fresh Vector3 by cloning any existing one (no `three` import in this page).
  const vec = (proto, x, y, z) => proto.clone().set(x, y, z);
  const textPlanes = (grp) => grp.children.filter(c => c.userData && c.userData.textPlane);
  // Decode readability: a plane reads non-mirrored iff its texture's +U (world +X)
  // points to the RIGHT of a viewer standing in front (right = forward × up, with
  // forward = −normal). Returns a signed value; > 0 ⇒ left-to-right, not mirrored.
  const readability = (plane) => {
    plane.updateMatrixWorld(true);
    const e = plane.matrixWorld.elements;
    const Ux = vec(plane.position, e[0], e[1], e[2]).normalize();    // world axis of local +X
    const N  = vec(plane.position, e[8], e[9], e[10]).normalize();   // world axis of local +Z (normal)
    const up = vec(plane.position, 0, 1, 0);
    const forward = N.clone().multiplyScalar(-1);                    // viewer looks toward the front face
    const right = forward.clone().cross(up);                         // camera right = forward × up
    return Ux.dot(right);
  };

  // ════════════ MIGRATION (real Planner._normalizeStore, pure) ════════════
  const p = new Planner();
  const baseFloor = { id: 'f1', name: 'F', w: 12000, d: 8000 };
  const mkStore = (extra) => ({ v: 2, floors: [baseFloor], currentFloorId: 'f1', ...extra });

  {
    const s = p._normalizeStore(mkStore({ bgText: { mode: 'sky', text: 'HELLO' } }), 'f1');
    ok('legacy bgText(sky) → one bgTexts entry',
       Array.isArray(s.bgTexts) && s.bgTexts.length === 1 &&
       s.bgTexts[0].mode === 'sky' && s.bgTexts[0].text === 'HELLO',
       JSON.stringify(s.bgTexts));
  }
  {
    // bgTexts present + a legacy bgText → the list wins (no double-migrate).
    const s = p._normalizeStore(mkStore({
      bgTexts: [{ id: 'a', mode: 'grass', text: 'YARD' }],
      bgText: { mode: 'sky', text: 'HELLO' },
    }), 'f1');
    ok('no double-migrate (existing bgTexts wins)',
       s.bgTexts.length === 1 && s.bgTexts[0].mode === 'grass' && s.bgTexts[0].text === 'YARD',
       JSON.stringify(s.bgTexts));
  }
  {
    const off = p._normalizeStore(mkStore({ bgText: { mode: 'off', text: 'X' } }), 'f1');
    const empty = p._normalizeStore(mkStore({ bgText: { mode: 'sky', text: '   ' } }), 'f1');
    ok('legacy off / empty → no migration (undefined)',
       off.bgTexts === undefined && empty.bgTexts === undefined,
       `off=${off.bgTexts} empty=${empty.bgTexts}`);
  }
  {
    const many = Array.from({ length: 8 }, (_, i) => ({ id: 'e' + i, mode: 'sky', text: 'T' + i }));
    const s = p._normalizeStore(mkStore({ bgTexts: many }), 'f1');
    ok('bgTexts migration caps list at 6', s.bgTexts.length === 6, `n=${s.bgTexts.length}`);
  }

  // ════════════ RESOLUTION (real Planner.bgTextsResolved) ════════════
  // Use a fully-normalized store (repaired floor) so _isSlowEntity's floor scan
  // has all the arrays it expects.
  p.store = { ...p._normalizeStore(mkStore({}), 'f1'), imperial: false, bgTexts: [] };
  p.hass = { states: { 'sensor.msg': { state: '42', attributes: {}, entity_id: 'sensor.msg' } } };
  {
    p.store.bgTexts = [ent('sky', 'STATIC ONE')];
    const res = p.bgTextsResolved();
    ok('static text resolves per entry', res.length === 1 && res[0].text === 'STATIC ONE', JSON.stringify(res));
  }
  {
    p.store.bgTexts = [{ id: 'b', mode: 'banner', text: 'ignored static', entityId: 'sensor.msg' }];
    const res = p.bgTextsResolved();
    ok('bound entity wins over static text', res.length === 1 && res[0].text === '42', JSON.stringify(res));
  }
  {
    // Truncation regression: a time/date entity state must resolve VERBATIM
    // (a parseFloat prefix-parse used to coerce "14:35" → "14", "2026-07-20" → "2026").
    p.hass.states['sensor.clock'] = { state: '14:35', attributes: {}, entity_id: 'sensor.clock' };
    p.hass.states['sensor.day'] = { state: '2026-07-20', attributes: {}, entity_id: 'sensor.day' };
    p.store.bgTexts = [{ id: 'c', mode: 'sky', text: 'x', entityId: 'sensor.clock' }];
    ok('time entity "14:35" resolves verbatim', p.bgTextsResolved()[0].text === '14:35',
       JSON.stringify(p.bgTextsResolved()));
    p.store.bgTexts = [{ id: 'c', mode: 'banner', text: 'x', entityId: 'sensor.day' }];
    ok('date entity "2026-07-20" resolves verbatim', p.bgTextsResolved()[0].text === '2026-07-20',
       JSON.stringify(p.bgTextsResolved()));
    // format prefix/suffix passes through bgTextsResolved.
    p.store.bgTexts = [{ id: 'c', mode: 'sky', text: 'x', entityId: 'sensor.clock',
                        format: { prefix: '@ ', suffix: ' hrs' } }];
    ok('bg format prefix/suffix applied to entity value', p.bgTextsResolved()[0].text === '@ 14:35 hrs',
       JSON.stringify(p.bgTextsResolved()));
  }
  {
    // Per-mode cap: grass reflows multi-line → 160 chars; other styles → 40.
    p.store.bgTexts = [ent('grass', 'G'.repeat(60))];
    ok('grass under 160 chars kept intact', p.bgTextsResolved()[0].text.length === 60,
       `len=${p.bgTextsResolved()[0].text.length}`);
    p.store.bgTexts = [ent('grass', 'G'.repeat(200))];
    ok('grass text capped at 160 chars', p.bgTextsResolved()[0].text.length === 160,
       `len=${p.bgTextsResolved()[0].text.length}`);
    p.store.bgTexts = [ent('sky', 'S'.repeat(60))];
    ok('sky text still capped at 40 chars', p.bgTextsResolved()[0].text.length === 40,
       `len=${p.bgTextsResolved()[0].text.length}`);
  }
  {
    // Grass "fit to area": grassAreaId → the ground area's bbox inset ~10%.
    p.floor().groundAreas = [{ id: 'ga1', kind: 'grass',
      points: [{ x: 1000, y: 1000 }, { x: 5000, y: 1000 }, { x: 5000, y: 3000 }, { x: 1000, y: 3000 }] }];
    p.store.bgTexts = [{ id: 'g', mode: 'grass', text: 'FIT ME', grassAreaId: 'ga1' }];
    const res = p.bgTextsResolved();
    const ga = res[0].grassArea;
    ok('grass fit-to-area resolves bbox inset ~10%',
       !!ga && Math.abs(ga.cx - 3000) < 1 && Math.abs(ga.cy - 2000) < 1 &&
       Math.abs(ga.w - 3200) < 1 && Math.abs(ga.h - 1600) < 1,
       ga ? `cx=${ga.cx} cy=${ga.cy} w=${ga.w} h=${ga.h}` : 'no rect');
    ok('grass carries grassAreaId when resolved', res[0].grassAreaId === 'ga1');
    // GROUND WRITING: the row also carries the area's REAL polygon + kind so the
    // renderer can clip the decal to it and paint through its own material.
    ok('ground-writing row carries the area polygon (copied, not aliased)',
       !!ga && Array.isArray(ga.points) && ga.points.length === 4 &&
       ga.points[1].x === 5000 && ga.points[1].y === 1000 &&
       ga.points !== p.floor().groundAreas[0].points &&
       ga.points[0] !== p.floor().groundAreas[0].points[0],
       ga ? `n=${ga.points && ga.points.length}` : 'no rect');
    ok('ground-writing row carries the area kind', !!ga && ga.kind === 'grass', ga && ga.kind);
    ok('flat area omits elevationMm', !!ga && ga.elevationMm === undefined);
    p.floor().groundAreas[0].kind = 'concrete';
    p.floor().groundAreas[0].elevationMm = 250;
    const ga2 = p.bgTextsResolved()[0].grassArea;
    ok('ground-writing row tracks a kind + elevation change',
       !!ga2 && ga2.kind === 'concrete' && ga2.elevationMm === 250,
       ga2 ? `${ga2.kind}/${ga2.elevationMm}` : 'none');
    // Degenerate polygons still fail soft (auto placement).
    p.floor().groundAreas = [{ id: 'ga1', kind: 'grass', points: [{ x: 0, y: 0 }, { x: 10, y: 0 }] }];
    ok('a <3-point area fails soft (no grassArea → auto)',
       p.bgTextsResolved()[0].grassArea === undefined);
  }
  {
    // Stale grassAreaId (area not on the current floor) → no rect, auto fallback.
    p.store.bgTexts = [{ id: 'g', mode: 'grass', text: 'STALE', grassAreaId: 'nope' }];
    const res = p.bgTextsResolved();
    ok('stale grassAreaId → no grassArea (falls back to auto)',
       res[0].grassArea === undefined && res[0].grassAreaId === undefined,
       `area=${res[0].grassArea}`);
  }
  {
    p.store.bgTexts = [ent('sky', 'KEEP'), ent('banner', '   '), ent('grass', '')];
    const res = p.bgTextsResolved();
    ok('empty/blank entries skipped in resolution', res.length === 1 && res[0].text === 'KEEP',
       `n=${res.length}`);
  }
  {
    p.store.bgTexts = [{ id: 't', mode: 'train', text: 'CHOO CHOO', maxCars: 5 }];
    const res = p.bgTextsResolved();
    ok('train maxCars carried through resolution', res[0].maxCars === 5, `maxCars=${res[0].maxCars}`);
  }
  {
    p.store.bgTexts = [{ id: 'b', mode: 'sky', text: 'x', entityId: 'sensor.msg' }];
    ok('bound bg entity is config-path (_isSlowEntity)',
       p._isSlowEntity('sensor.msg') === true && p._isSlowEntity('sensor.other') === false,
       `${p._isSlowEntity('sensor.msg')}/${p._isSlowEntity('sensor.other')}`);
  }

  // ════════════ MULTI-INSTANCE PLACEMENT (renderer) ════════════
  {
    r.updateBgTexts([ent('sky', 'FIRST SKY'), ent('sky', 'SECOND SKY')], false, 0, 10);
    const s = r._bgRigs.filter(x => x.mode === 'sky');
    ok('two skywriters build with distinct positions',
       s.length === 2 && Math.abs(s[0].sky.position.x - s[1].sky.position.x) > 100,
       `dx=${s.length === 2 ? (s[0].sky.position.x - s[1].sky.position.x).toFixed(0) : 'n/a'}`);
  }
  {
    r.updateBgTexts([ent('banner', 'BANNER A'), ent('banner', 'BANNER B')], false, 0, 10);
    const b = r._bgRigs.filter(x => x.mode === 'banner');
    const distinct = b.length === 2 &&
      (Math.abs(b[0].radius - b[1].radius) > 50 || Math.abs(b[0].alt - b[1].alt) > 50 ||
       Math.abs(b[0].angle - b[1].angle) > 0.05);
    ok('two banner planes build with distinct orbits', distinct,
       b.length === 2 ? `R=${b[0].radius.toFixed(0)}/${b[1].radius.toFixed(0)} alt=${b[0].alt}/${b[1].alt}` : 'n/a');
  }
  {
    r.updateBgTexts([ent('grass', 'YARD ONE'), ent('grass', 'YARD TWO')], false, 0, 0);
    const g = r._bgRigs.filter(x => x.mode === 'grass');
    const distinct = g.length === 2 &&
      (Math.abs(g[0].grass.cx - g[1].grass.cx) > 100 || Math.abs(g[0].grass.cy - g[1].grass.cy) > 100);
    ok('two grass decals take distinct margin strips', distinct,
       g.length === 2 ? `c0=(${g[0].grass.cx.toFixed(0)},${g[0].grass.cy.toFixed(0)}) c1=(${g[1].grass.cx.toFixed(0)},${g[1].grass.cy.toFixed(0)})` : 'n/a');
  }
  {
    const eight = Array.from({ length: 8 }, (_, i) => ent('sky', 'SKY ' + i));
    r.updateBgTexts(eight, false, 0, 0);
    ok('renderer caps at 6 rigs from 8 entries', r._bgRigs.length === 6, `n=${r._bgRigs.length}`);
  }

  // ════════════ STORM HIDING ════════════
  {
    r.updateBgTexts([
      ent('sky', 'SKY'), ent('banner', 'BANNER'), ent('chopper', 'CHOP'),
      ent('grass', 'GRASS'), ent('train', 'TRAIN TIME'),
    ], true /* storm */, 0, 0);
    const modes = r._bgRigs.map(x => x.mode).sort();
    ok('storm hides sky/banner/chopper',
       !r._bgRigs.some(x => x.mode === 'sky' || x.mode === 'banner' || x.mode === 'chopper'),
       modes.join(','));
    ok('storm keeps grass + train (ground-level)',
       r._bgRigs.some(x => x.mode === 'grass') && r._bgRigs.some(x => x.mode === 'train'),
       modes.join(','));
  }

  // ════════════ MESSAGE TRAIN ════════════
  {
    r.updateBgTexts([ent('train', 'HELLO WRLD')], false, 0, 0);  // len 10 → ceil(10/6)=2
    const t = r._bgRigs.find(x => x.mode === 'train').train;
    ok('train car count (short msg → 1–2 cars)', t.chunks.length >= 1 && t.chunks.length <= 2,
       `cars=${t.chunks.length}`);
  }
  {
    const msg40 = 'A'.repeat(40);
    r.updateBgTexts([ent('train', msg40)], false, 0, 0);        // ceil(40/6)=7, default maxCars 8
    const t = r._bgRigs.find(x => x.mode === 'train').train;
    ok('train 40-char message → 7 cars (ceil(40/6))', t.chunks.length === 7, `cars=${t.chunks.length}`);
  }
  {
    const msg40 = 'B'.repeat(40);
    r.updateBgTexts([{ id: 'tc', mode: 'train', text: msg40, maxCars: 2 }], false, 0, 0);
    const t = r._bgRigs.find(x => x.mode === 'train').train;
    ok('train maxCars clamps car count (40 chars, maxCars=2 → 2)', t.chunks.length === 2, `cars=${t.chunks.length}`);
  }
  {
    // Both-flank chunk ordering: −X flank car k = chunk[k]; +X flank car k = chunk[N−1−k].
    r.updateBgTexts([ent('train', 'ABCDEFGHIJKL')], false, 0, 0);  // len 12 → 2 cars
    const t = r._bgRigs.find(x => x.mode === 'train').train;
    const N = t.chunks.length;
    let orderOk = N >= 2, painted2 = true;
    for (let k = 0; k < N; k++) {
      const car = t.vehicles[k + 1];   // vehicles[0] is the engine
      const fl = flanks(car.obj);
      if (!fl.minusX || !fl.plusX) { orderOk = false; break; }
      if (fl.minusX.userData.chunk !== t.chunks[k]) orderOk = false;
      if (fl.plusX.userData.chunk !== t.chunks[N - 1 - k]) orderOk = false;
      if (painted(fl.minusX.material.map) < 50 || painted(fl.plusX.material.map) < 50) painted2 = false;
    }
    ok('train both flanks: −X=chunk[i], +X=chunk[N−1−i]', orderOk, `chunks=${JSON.stringify(t.chunks)}`);
    ok('train both flank textures painted', painted2);
  }
  {
    // Cars follow the tangent: over a full loop the engine yaw takes many values.
    r.updateBgTexts([ent('train', 'ROUND TRIP')], false, 0, 0);
    const rig = r._bgRigs.find(x => x.mode === 'train');
    const engineObj = rig.train.vehicles[0].obj;
    const yaws = new Set();
    const wheel0 = rig.train.vehicles[0].wheels[0];
    const wRot0 = wheel0.rotation.x;
    for (let i = 0; i < 1700; i++) { clk += 1 / 30; r._advanceBgText(1 / 30, clk); yaws.add(Math.round(engineObj.rotation.y * 5) / 5); }
    ok('train cars orient to tangent (engine yaw varies round the loop)', yaws.size >= 3, `distinct yaws=${yaws.size}`);
    ok('train wheels spin over frames', Math.abs(wheel0.rotation.x - wRot0) > 1e-3,
       `dRot=${(wheel0.rotation.x - wRot0).toFixed(2)}`);
  }
  {
    r.updateBgTexts([ent('train', 'YARD LOOP')], false, 0, 0);
    const t = r._bgRigs.find(x => x.mode === 'train').train;
    const fw = floor.w, fd = floor.d;
    const outside = t.loopWorld.every(pt => pt.x < 0 || pt.x > fw || pt.y < 0 || pt.y > fd);
    ok('train loop stays entirely OUTSIDE the floor rect', outside,
       `pts=${t.loopWorld.length}`);
  }
  {
    // Per-rig CanvasTexture disposal on rebuild (dispose-count probe).
    r.updateBgTexts([ent('train', 'DISPOSE ME')], false, 0, 0);
    const t = r._bgRigs.find(x => x.mode === 'train').train;
    const fl = flanks(t.vehicles[1].obj);
    const map = fl.minusX.material.map;
    let disposed = false;
    const orig = map.dispose.bind(map);
    map.dispose = () => { disposed = true; orig(); };
    r.updateBgTexts([ent('sky', 'REPLACED')], false, 0, 0);
    ok('train flank texture disposed on rebuild', disposed);
  }

  // ════════════ NEWS CHOPPER ════════════
  {
    r.updateBgTexts([ent('chopper', 'BREAKING NEWS')], false, 0, 5);
    const c = r._bgRigs.find(x => x.mode === 'chopper');
    ok('chopper builds (main rotor + tail rotor + banner)',
       !!c && !!c.prop && c.prop.children && c.prop.children.length >= 2 &&
       !!c.tailRotor && !!c.banner,
       c ? `rotorBlades=${c.prop.children.length} tail=${!!c.tailRotor} banner=${!!c.banner}` : 'no rig');
  }
  {
    r.updateBgTexts([ent('chopper', 'ROTOR SPIN')], false, 0, 5);
    const c = r._bgRigs.find(x => x.mode === 'chopper');
    const y0 = c.prop.rotation.y;
    step(60);
    ok('chopper main rotor angle advances', Math.abs(c.prop.rotation.y - y0) > 1e-3,
       `dY=${(c.prop.rotation.y - y0).toFixed(3)}`);
  }
  {
    // Chopper orbits OPPOSITE the plane: compare signed sweep of the XZ position.
    r.updateBgTexts([ent('banner', 'PLANE'), ent('chopper', 'CHOP')], false, 0, 5);
    const plane = r._bgRigs.find(x => x.mode === 'banner');
    const chop = r._bgRigs.find(x => x.mode === 'chopper');
    step(2);  // settle
    const pA = plane.asm.position.clone(), cA = chop.asm.position.clone();
    step(30);
    const pB = plane.asm.position.clone(), cB = chop.asm.position.clone();
    const crossP = pA.x * pB.z - pA.z * pB.x;   // signed rotation sense
    const crossC = cA.x * cB.z - cA.z * cB.x;
    ok('chopper orbit direction OPPOSITE the plane (sign)',
       Math.sign(crossP) !== 0 && Math.sign(crossC) !== 0 && Math.sign(crossP) !== Math.sign(crossC),
       `plane=${crossP.toFixed(0)} chop=${crossC.toFixed(0)} dir p=${plane.dir} c=${chop.dir}`);
  }
  // ════════════ BANNER: TWO FRONTSIDE PLANES, NON-MIRRORED (bug 3) ════════════
  {
    r.updateBgTexts([ent('banner', 'TWO SIDES'), ent('chopper', 'TWO SIDES C')], false, 0, 5);
    for (const mode of ['banner', 'chopper']) {
      const rig = r._bgRigs.find(x => x.mode === mode);
      const planes = textPlanes(rig.banner);
      const frontBoth = planes.length === 2 && planes.every(p => p.material.side === THREE_FrontSide);
      const n0 = vec(rig.banner.position, 0, 0, 1).applyQuaternion(planes[0].quaternion);
      const n1 = vec(rig.banner.position, 0, 0, 1).applyQuaternion(planes[1].quaternion);
      const opposite = n0.dot(n1) < -0.9;
      const gap = planes.length === 2 ? Math.abs(planes[0].position.z - planes[1].position.z) : NaN;
      ok(`${mode} banner: two FrontSide planes, opposite facing, ~2mm apart`,
         frontBoth && opposite && Math.abs(gap - 2) < 0.6,
         `n=${planes.length} sides=${planes.map(p => p.material.side)} dot=${n0.dot(n1).toFixed(2)} gap=${gap}`);
      // Shared texture across both planes (one map, dedup-disposed).
      ok(`${mode} banner: both planes share ONE texture`,
         planes.length === 2 && !!planes[0].material.map && planes[0].material.map === planes[1].material.map,
         `same=${planes.length === 2 && planes[0].material.map === planes[1].material.map}`);
      // Rasterize + decode: the shared texture is painted, and BOTH faces read
      // left-to-right (the train-flank un-mirror), unlike the old DoubleSide plane.
      rig.banner.updateMatrixWorld(true);
      const map = planes[0].material.map;
      const r0 = readability(planes[0]), r1 = readability(planes[1]);
      ok(`${mode} banner: both sides painted + read non-mirrored`,
         painted(map) > 300 && r0 > 0.5 && r1 > 0.5,
         `lit=${painted(map)} read=${r0.toFixed(2)}/${r1.toFixed(2)}`);
    }
  }

  // ════════════ CHOPPER TOW WIRE connects chopper → banner top (bug 1) ════════════
  {
    r.updateBgTexts([ent('chopper', 'BANNER TOW LINE')], false, 0, 5);
    const c = r._bgRigs.find(x => x.mode === 'chopper');
    const w = c.towWire;
    ok('chopper builds a tow wire with attach/bannerTop metadata',
       !!w && Array.isArray(w.userData.attach) && Array.isArray(w.userData.bannerTop),
       `wire=${!!w}`);
    const len = w.geometry.parameters.height;
    w.updateMatrix();
    // Cylinder ends are local (0, ±len/2, 0); transform into asm space via the wire's local matrix.
    const endPlus  = vec(w.position, 0,  len / 2, 0).applyMatrix4(w.matrix);
    const endMinus = vec(w.position, 0, -len / 2, 0).applyMatrix4(w.matrix);
    const attach    = vec(w.position, ...w.userData.attach);
    const bannerTop = vec(w.position, ...w.userData.bannerTop);
    // Whichever end is nearer each target should coincide (wire spans attach→top).
    const dTop = Math.min(endPlus.distanceTo(bannerTop), endMinus.distanceTo(bannerTop));
    const dAtt = Math.min(endPlus.distanceTo(attach), endMinus.distanceTo(attach));
    ok('tow wire endpoints coincide with chopper attach + banner top', dTop < 1 && dAtt < 1,
       `dTop=${dTop.toFixed(2)} dAtt=${dAtt.toFixed(2)}`);
    // The declared bannerTop is now the banner Group's LEADING TOP CORNER, which
    // (children shifted −len/2,−bh/2) is the group ORIGIN → in asm space just the
    // group position.
    c.banner.updateMatrix();
    const cornerStatic = vec(c.banner.position, 0, 0, 0).applyMatrix4(c.banner.matrix);
    ok('declared bannerTop == banner leading-top corner (group origin)',
       cornerStatic.distanceTo(bannerTop) < 1, `d=${cornerStatic.distanceTo(bannerTop).toFixed(2)}`);
    // Still connected AFTER advancing frames: the banner sways rotation.y ABOUT
    // this corner (the towed pivot), so the corner is sway-INVARIANT and the wire
    // (fixed in the asm frame) stays attached.
    step(120);
    w.updateMatrix(); c.banner.updateMatrix();
    const cornerAfter = vec(c.banner.position, 0, 0, 0).applyMatrix4(c.banner.matrix);
    const wireEndA  = vec(w.position, 0,  len / 2, 0).applyMatrix4(w.matrix);
    const wireEndB  = vec(w.position, 0, -len / 2, 0).applyMatrix4(w.matrix);
    const dAfter = Math.min(wireEndA.distanceTo(cornerAfter), wireEndB.distanceTo(cornerAfter));
    ok('tow wire stays attached to banner leading corner after advance frames', dAfter < 1,
       `d=${dAfter.toFixed(2)}`);
  }

  // ════════════ PLANE PROPELLER spins about the flight axis (bug 2) ════════════
  {
    r.updateBgTexts([ent('banner', 'PROP SPIN')], false, 0, 5);
    const plane = r._bgRigs.find(x => x.mode === 'banner');
    const prop = plane.prop;
    // Proper propeller = a subgroup (hub + ≥2 blades), NOT a single disc mesh.
    ok('plane propeller is a hub+blades subgroup (not a disc)',
       prop.type === 'Group' && prop.children.length >= 3,
       `type=${prop.type} children=${prop.children.length}`);
    const blade = prop.children.find(c => c.geometry && c.geometry.parameters &&
      c.geometry.parameters.height === 760) || prop.children[1];
    const bl = blade.geometry.parameters.height;
    // Sample a blade TIP in prop-parent (asm) space; the prop axis = asm +Z through
    // prop.position, so radius = hypot(dx,dy) and depth-from-axis = dz.
    const sample = () => {
      prop.updateMatrix(); blade.updateMatrix();
      const tip = vec(prop.position, 0, bl / 2, 0).applyMatrix4(blade.matrix).applyMatrix4(prop.matrix);
      const dx = tip.x - prop.position.x, dy = tip.y - prop.position.y, dz = tip.z - prop.position.z;
      return { r: Math.hypot(dx, dy), ang: Math.atan2(dy, dx), dz };
    };
    const s0 = sample(); step(20); const s1 = sample(); step(20); const s2 = sample();
    const rConst = s0.r > 100 && Math.abs(s0.r - s1.r) < 1 && Math.abs(s1.r - s2.r) < 1;
    const angMoved = Math.abs(s0.ang - s1.ang) > 1e-3 && Math.abs(s1.ang - s2.ang) > 1e-3;
    ok('propeller blade tip orbits the flight axis at CONSTANT radius (angle advances)',
       rConst && angMoved, `r=${s0.r.toFixed(1)}/${s1.r.toFixed(1)}/${s2.r.toFixed(1)} dAng=${(s0.ang - s1.ang).toFixed(3)}`);
    ok('propeller sweeps the plane ⟂ flight axis (no disc wobble off the axis)',
       Math.abs(s0.dz) < 1 && Math.abs(s1.dz) < 1 && Math.abs(s2.dz) < 1,
       `dz=${s0.dz.toFixed(2)}/${s1.dz.toFixed(2)}/${s2.dz.toFixed(2)}`);
  }

  // ════════════ TRAIN SCALE (bug 3) ════════════

    const t = r._bgRigs.find(x => x.mode === 'train').train;

       t.vehicles.every(v => Math.abs(v.obj.scale.x - 1.8) < 1e-6 &&

    ok('train wheelR = 162 (90×1.8)', t.wheelR === 162, `wr=${t.wheelR}`);
    // Spin rate uses the scaled wheelR: one advance frame Δrot = −speed·dt/162.

  // ════════════ GRASS: multi-line reflow + target area (bug 4) ════════════
  // Count contiguous horizontal text-ink bands: the grass base is #4f7a34
  // (r=79); the dark cut #31521d (r=49) marks glyph rows → r < 62 = text ink.
  const rowBands = (cv) => {
    const g = cv.getContext('2d');
    const d = g.getImageData(0, 0, cv.width, cv.height).data;
    let bands = 0, inBand = false;
    for (let y = 0; y < cv.height; y++) {
      let ink = false;
      for (let x = 0; x < cv.width; x++) {
        const i = (y * cv.width + x) * 4;
        if (d[i] < 62 && d[i + 2] < 45) { ink = true; break; }   // darker than grass base
      }
      if (ink && !inBand) { bands++; inBand = true; } else if (!ink) inBand = false;
    }
    return bands;
  };
  {
    // Long text into a TALL narrow rect → wraps to multiple lines.
    r.updateBgTexts([{ id: 'ml', mode: 'grass',
      text: 'THE QUICK BROWN FOX JUMPS OVER THE LAZY DOG',
      grassArea: { cx: 6000, cy: 4000, w: 2400, h: 4000 } }], false, 0, 0);
    const cvML = r._bgRigs.find(x => x.mode === 'grass').grassMesh.material.map.image;
    const bML = rowBands(cvML);
    // Short text into a WIDE rect → a single line.
    r.updateBgTexts([{ id: 'sl', mode: 'grass', text: 'HI',
      grassArea: { cx: 6000, cy: 4000, w: 4000, h: 1200 } }], false, 0, 0);
    const cvSL = r._bgRigs.find(x => x.mode === 'grass').grassMesh.material.map.image;
    const bSL = rowBands(cvSL);
    ok('grass reflows long text into MULTIPLE lines (more than short)', bML >= 2 && bML > bSL,
       `long=${bML} short=${bSL}`);
    ok('grass short text stays few lines', bSL >= 1 && bSL <= 2, `short=${bSL}`);
  }
  {
    // Explicit target area → decal placed AT that rect (center + size).
    const area = { cx: 6000, cy: 4000, w: 2400, h: 1600 };
    r.updateBgTexts([{ id: 'ga', mode: 'grass', text: 'YARD PATCH', grassArea: area }], false, 0, 0);
    const rig = r._bgRigs.find(x => x.mode === 'grass');
    const gr = rig.grass;
    ok('grass fit-to-area decal placed at the target rect',
       Math.abs(gr.cx - area.cx) < 1 && Math.abs(gr.cy - area.cy) < 1 &&
       Math.abs(gr.w - area.w) < 1 && Math.abs(gr.h - area.h) < 1,
       `c=(${gr.cx},${gr.cy}) wh=${gr.w}x${gr.h}`);
    ok('grass decal geometry sized to the target rect',
       Math.abs(rig.grassMesh.geometry.parameters.width - area.w) < 1 &&
       Math.abs(rig.grassMesh.geometry.parameters.height - area.h) < 1);
  }

  // ════════════ SKYWRITING TYPOGRAPHY (item 6) ════════════
  {
    const inkRatio = (cv) => {
      const g = cv.getContext('2d');
      const d = g.getImageData(0, 0, cv.width, cv.height).data;
      let lit = 0;
      for (let i = 0; i < d.length; i += 4) if (d[i + 3] > 40) lit++;
      return lit / (cv.width * cv.height);
    };
    const skyCv = r._makeBgTextTexture('MMMMMMMM', 'sky').image;
    // Old-style reference: bold 800, NO letter spacing, original heavy blurs.
    const oc = document.createElement('canvas'), og = oc.getContext('2d');
    const oldFont = '800 96px system-ui, "Segoe UI", sans-serif'; og.font = oldFont;
    oc.width = Math.ceil(og.measureText('MMMMMMMM').width) + 180; oc.height = 240;
    og.font = oldFont; og.textAlign = 'left'; og.textBaseline = 'middle';
    og.globalCompositeOperation = 'lighter';
    let ox = 90;
    for (const ch of 'MMMMMMMM') {
      const cw = og.measureText(ch).width;
      for (const [blur, alpha] of [[42, 0.32], [22, 0.5], [8, 0.9]]) {
        og.shadowColor = 'rgba(255,255,255,0.95)'; og.shadowBlur = blur;
        og.fillStyle = `rgba(250,252,255,${alpha})`; og.fillText(ch, ox, 120);
      }
      ox += cw;
    }
    ok('skywriting lighter+spaced → less ink bloom than old bold',
       inkRatio(skyCv) < inkRatio(oc),
       `new=${inkRatio(skyCv).toFixed(3)} old=${inkRatio(oc).toFixed(3)}`);
    // Letter spacing widens the canvas beyond the tight (normal-weight) glyph run.
    og.font = '400 96px system-ui, "Segoe UI", sans-serif';
    const tightW = Math.ceil(og.measureText('MMMMMMMM').width) + 180;
    ok('skywriting applies letter spacing (canvas wider than tight run)', skyCv.width > tightW,
       `sky=${skyCv.width} tight=${tightW}`);
  }

  // ════════════ GROUND LEVEL (Scene3D.groundLevelMm) ════════════
  // Every bg-text rig lives in the yard or the sky over it, so all four styles
  // ride the surroundings grade: the train's rails, the tow plane's and
  // chopper's AGL flight altitude, and the skywriting. Grass is covered in
  // terrain-test's section H (it resolves through _groundYAt). Level 0 must
  // reproduce today's numbers exactly.
  {
    const LOW = -600;
    const sc0 = { preset: 'day', floorColor: '#8a7860', floorTex: 'wood', wallColor: '#cfd2d6' };
    const scLow = { ...sc0, groundLevelMm: LOW };
    const entries = [
      { id: 'gtrain', mode: 'train', text: 'ALL ABOARD' },
      { id: 'gplane', mode: 'banner', text: 'HELLO' },
      { id: 'gchop', mode: 'chopper', text: 'NEWS' },
      { id: 'gsky', mode: 'sky', text: 'HI' },
    ];
    const read = (sc) => {
      r.updateFloor(floor, sc);
      // Fresh entry ids per level so the persistent phase never crosses runs.
      const es = entries.map(e => ({ ...e, id: e.id + (sc === scLow ? 'L' : '0') }));
      r.updateBgTexts(es, false, 0, 0);
      const by = (m) => r._bgRigs.find(x => x.mode === m);
      return {
        train: by('train').train.baseY,
        trainCar: by('train').train.vehicles[0].obj.position.y,
        plane: by('banner').alt,
        chop: by('chopper').alt,
        sky: by('sky').sky.position.y,
      };
    };
    const zero = read(sc0), lo = read(scLow);
    ok('GL train rails ride the grade', zero.train === 0 && lo.train === LOW &&
       zero.trainCar === 0 && lo.trainCar === LOW,
       `base=${zero.train}/${lo.train} car=${zero.trainCar}/${lo.trainCar}`);
    ok('GL banner-plane altitude is AGL', lo.plane - zero.plane === LOW,
       `alt=${zero.plane}/${lo.plane}`);
    ok('GL chopper altitude is AGL', lo.chop - zero.chop === LOW,
       `alt=${zero.chop}/${lo.chop}`);
    ok('GL skywriting altitude is AGL', lo.sky - zero.sky === LOW,
       `y=${zero.sky}/${lo.sky}`);
    r.updateFloor(floor, sc0);
    r.updateBgTexts([], false, 0, 0);
  }

  // ════════════ CHOPPER TOW POINT: leading TOP corner, not the middle ═══════
  // The banner Group origin must BE the corner the wire ends at, so the sway
  // (banner.rotation.y) pivots there and the cloth trails back + down from it.
  {
    r.updateBgTexts([{ id: 'tow', mode: 'chopper', text: 'BREAKING NEWS' }], false, 0, 0);
    const rig = r._bgRigs.find(x => x.mode === 'chopper');
    const banner = rig.banner, wire = rig.towWire;
    const front = banner.children.find(c => c.userData && c.userData.bannerFace === 'front');
    const len = front.geometry.parameters.width, bh = front.geometry.parameters.height;
    // Planes are shifted so the group origin lands on their +X/+Y corner.
    ok('CHOP banner planes hang off the group origin corner (−len/2, −bh/2)',
       Math.abs(front.position.x + len / 2) < 1 && Math.abs(front.position.y + bh / 2) < 1,
       `off=(${front.position.x.toFixed(0)},${front.position.y.toFixed(0)}) len=${len | 0} bh=${bh | 0}`);
    // …so the cloth occupies local x ∈ [−len, 0], y ∈ [−bh, 0]: the origin is
    // the extreme +X (leading, toward the nose after the +π/2 broadside yaw)
    // and +Y (top) corner of the banner.
    front.geometry.computeBoundingBox();
    const bb = front.geometry.boundingBox;
    const maxX = front.position.x + bb.max.x, maxY = front.position.y + bb.max.y;
    ok('CHOP group origin IS the leading TOP corner of the cloth',
       Math.abs(maxX) < 1 && Math.abs(maxY) < 1, `maxX=${maxX.toFixed(1)} maxY=${maxY.toFixed(1)}`);
    // The tow line's far end coincides with that corner (it is built as a
    // cylinder centred on the attach→corner midpoint; userData carries both).
    const att = wire.userData.attach, cor = wire.userData.bannerTop;
    const bp = banner.position;
    const wireEnd = Math.hypot(cor[0] - bp.x, cor[1] - bp.y, cor[2] - bp.z);
    const mid = [(att[0] + cor[0]) / 2, (att[1] + cor[1]) / 2, (att[2] + cor[2]) / 2];
    ok('CHOP tow wire ends exactly at the banner group origin (the corner)',
       wireEnd < 1 &&
       Math.abs(wire.position.x - mid[0]) < 1 && Math.abs(wire.position.y - mid[1]) < 1 &&
       Math.abs(wire.position.z - mid[2]) < 1,
       `gap=${wireEnd.toFixed(1)}`);
    // The cloth trails BEHIND (local −X → scene +Z after rotation.y=+π/2) and
    // BELOW the tow point, never in front of the chopper.
    ok('CHOP cloth trails back + below the tow point',
       bb.min.x + front.position.x <= -len + 1 && bb.min.y + front.position.y <= -bh + 1,
       `min=(${(bb.min.x + front.position.x).toFixed(0)},${(bb.min.y + front.position.y).toFixed(0)})`);
    // Sway pivots about the corner: the origin is invariant under rotation.y.
    const before = banner.position.clone();
    r._advanceBgText(0.5, 12345);
    ok('CHOP sway pivots about the towed corner (origin unmoved)',
       banner.position.distanceTo(before) < 1e-6, `d=${banner.position.distanceTo(before)}`);
    r.updateBgTexts([], false, 0, 0);
  }

  // ════════════ PHASE PERSISTENCE ACROSS REBUILDS ════════════
  // Reported bug: the plane + train reset their lap every ~25-30 s. Two halves:
  // three-view's _keyBgText no longer carries configRev (so unrelated config
  // churn stops rebuilding these at all), and — belt and braces — a rebuild
  // that DOES happen resumes from the persistent per-entry phase instead of the
  // build angle.
  {
    const es = (txt) => [
      { id: 'pTrain', mode: 'train', text: txt },
      { id: 'pPlane', mode: 'banner', text: txt },
      { id: 'pSky', mode: 'sky', text: txt },
    ];
    r.updateBgTexts(es('LAP ONE'), false, 0, 0);
    const rigOf = (m) => r._bgRigs.find(x => x.mode === m);
    const build = { angle: rigOf('banner').angle, s: rigOf('train').train.s, sky: rigOf('sky').skyPhase };
    // Fly / drive for ~20 s of virtual time.
    for (let i = 0; i < 1200; i++) { clk += 1 / 60; r._advanceBgText(1 / 60, clk); }
    const flown = { angle: rigOf('banner').angle, s: rigOf('train').train.s, sky: rigOf('sky').skyPhase,
                    planePos: rigOf('banner').asm.position.clone(),
                    carPos: rigOf('train').train.vehicles[0].obj.position.clone() };
    ok('PHASE motion actually advanced before the rebuild',
       flown.angle !== build.angle && flown.s !== build.s && flown.sky !== build.sky,
       `angle=${flown.angle.toFixed(3)} s=${flown.s | 0}`);
    // A rebuild with the SAME entries (what an unrelated config bump used to do)
    // must not move anything.
    r.updateBgTexts(es('LAP ONE'), false, 0, 0);
    const same = { angle: rigOf('banner').angle, s: rigOf('train').train.s,
                   planePos: rigOf('banner').asm.position.clone(),
                   carPos: rigOf('train').train.vehicles[0].obj.position.clone() };
    // Horizontal (orbit / arc-length) position must be identical; the plane's
    // vertical bob is a pure function of the ABSOLUTE clock, so the re-seed
    // settles it at the real `performance.now()` rather than this page's fake
    // clock — it is continuous by construction and re-lands on the next frame.
    const planeXZ = Math.hypot(same.planePos.x - flown.planePos.x, same.planePos.z - flown.planePos.z);
    ok('PHASE identical rebuild leaves the plane + train exactly where they were',
       Math.abs(same.angle - flown.angle) < 1e-9 && Math.abs(same.s - flown.s) < 1e-6 &&
       planeXZ < 1e-6 && same.carPos.distanceTo(flown.carPos) < 1e-6,
       `dAngle=${(same.angle - flown.angle).toExponential(1)} dPlaneXZ=${planeXZ.toExponential(1)} dCar=${same.carPos.distanceTo(flown.carPos).toExponential(1)}`);
    // A REAL rebuild (the bound entity's text changed) also resumes mid-course.
    r.updateBgTexts(es('LAP TWO'), false, 0, 0);
    const edited = { angle: rigOf('banner').angle, s: rigOf('train').train.s,
                     sky: rigOf('sky').skyPhase };
    ok('PHASE text-change rebuild resumes mid-course (no restart)',
       Math.abs(edited.angle - flown.angle) < 1e-9 && Math.abs(edited.s - flown.s) < 1e-6 &&
       Math.abs(edited.sky - flown.sky) < 1e-9 && edited.angle !== build.angle,
       `angle=${edited.angle.toFixed(3)} vs build ${build.angle.toFixed(3)}`);
    // A FRESH entry id still starts at its own build stagger.
    r.updateBgTexts([{ id: 'brandNew', mode: 'banner', text: 'NEW' }], false, 0, 0);
    ok('PHASE a fresh entry id starts at its build angle',
       Math.abs(rigOf('banner').angle - 0) < 1e-9, `angle=${rigOf('banner').angle}`);
    r.updateBgTexts([], false, 0, 0);
  }

  // ════════════ TOW AIRCRAFT MODEL (BgTextEntry.aircraft) ════════════
  // A banner entry may tow its message with any of the 8 FLIGHT archetypes,
  // built by the same _buildAircraftModel the ADS-B rigs use. Absent / garbage
  // must reproduce the classic toy plane byte-for-byte.
  {
    // Signature of a rig's silhouette: mesh count + the fuselage/first-mesh
    // footprint + the total bounding span (banner excluded — it is identical
    // across models, so it would mask the difference).
    const airframe = (rig) => {
      const out = [];
      rig.asm.traverse(o => {
        const u = o.userData || {};
        if (o.isMesh && !u.textPlane && !u.outline && !u.outlineSkip) {
          // Skip anything under the banner group.
          let p = o.parent, inBanner = false;
          while (p) { if (p === rig.banner) { inBanner = true; break; } p = p.parent; }
          if (!inBanner) out.push(o);
        }
      });
      return out;
    };
    const span = (rig) => {
      let w = 0, l = 0;
      for (const m of airframe(rig)) {
        m.geometry.computeBoundingBox();
        const bb = m.geometry.boundingBox;
        w = Math.max(w, Math.abs(m.position.x) + Math.max(Math.abs(bb.min.x), Math.abs(bb.max.x)));
        l = Math.max(l, Math.abs(m.position.z) + Math.max(Math.abs(bb.min.z), Math.abs(bb.max.z)));
      }
      return { w, l, n: airframe(rig).length };
    };
    const build = (aircraft) => {
      r.updateBgTexts([{ id: 'ac_' + String(aircraft), mode: 'banner', text: 'FLY ME', aircraft }],
                      false, 0, 0);
      return r._bgRigs.find(x => x.mode === 'banner');
    };

    const toy = span(build(undefined));
    const toyGarbage = span(build('not-a-plane'));
    ok('AC absent → the classic toy tow plane',
       toy.n === 4 && Math.abs(toy.w - 650) < 1,          // 1300 mm wing, 4 body meshes
       `n=${toy.n} w=${toy.w}`);
    ok('AC unknown archetype falls back to the toy plane (never throws)',
       toyGarbage.n === toy.n && Math.abs(toyGarbage.w - toy.w) < 1e-6 &&
       Math.abs(toyGarbage.l - toy.l) < 1e-6,
       `n=${toyGarbage.n} w=${toyGarbage.w}`);

    // One SMALL archetype and one BIG one — distinguishable from each other and
    // from the toy plane by real geometry, not by a flag.
    const ga = build('ga-high');
    const gaS = span(ga);
    ok('AC ga-high builds a distinct silhouette (not the toy plane)',
       gaS.n !== toy.n || Math.abs(gaS.w - toy.w) > 50, `n=${gaS.n} w=${gaS.w} vs toy w=${toy.w}`);
    let highWing = false;
    ga.asm.traverse(o => { if (o.userData && o.userData.wing === 'high') highWing = true; });
    ok('AC ga-high carries the HIGH-wing tag', highWing);
    const wide = build('widebody');
    const wideS = span(wide);
    ok('AC widebody is markedly bigger than ga-high (>2× the plan footprint)',
       wideS.w * wideS.l > gaS.w * gaS.l * 2 && wideS.l > gaS.l * 1.4,
       `wide=${wideS.w.toFixed(0)}x${wideS.l.toFixed(0)} ga=${gaS.w.toFixed(0)}x${gaS.l.toFixed(0)}`);
    let pods = 0;
    wide.asm.traverse(o => { if (o.userData && o.userData.nacelle === 'wing') pods++; });
    ok('AC widebody carries underwing engine pods', pods >= 2, `pods=${pods}`);

    // The banner still tows, behind the tail, on every archetype.
    for (const [a, rig] of [['ga-high', ga], ['widebody', wide]]) {
      const front = rig.banner.children.find(c => c.userData && c.userData.bannerFace === 'front');
      ok(`AC ${a} still tows a readable banner`,
         !!front && !!front.material.map && rig.banner.position.z > 0 && readability(front) > 0,
         `z=${rig.banner.position.z | 0}`);
    }
    ok('AC widebody trails its banner clear of the longer fuselage',
       wide.banner.position.z > ga.banner.position.z,
       `wide=${wide.banner.position.z | 0} ga=${ga.banner.position.z | 0}`);

    // Prop / rotor spin: props spin about the FLIGHT axis (Z), a rotorcraft
    // about Y; a jet has no disc at all.
    const spun = (rig) => { clk += 0.5; r._advanceBgText(0.5, clk); return rig; };
    const tp = build('twin-prop');
    ok('AC twin-prop carries TWO spinning discs', (tp.props ?? []).length === 2,
       `n=${(tp.props ?? []).length}`);
    spun(tp);
    ok('AC twin-prop discs spin about Z (the flight axis)',
       tp.props.every(d => d.rotation.z !== 0 && d.rotation.y === 0),
       `z=${tp.props[0].rotation.z.toFixed(2)} y=${tp.props[0].rotation.y}`);
    const heli = build('heli');
    spun(heli);
    ok('AC heli on a BANNER entry spins its main rotor about Y',
       heli.rotorY === true && heli.props[0].rotation.y !== 0 && heli.props[0].rotation.z === 0,
       `y=${heli.props[0].rotation.y.toFixed(2)} z=${heli.props[0].rotation.z}`);
    ok('AC heli on a banner entry flies the BANNER orbit (not the chopper profile)',
       heli.mode === 'banner' && heli.dir === 1, `mode=${heli.mode} dir=${heli.dir}`);
    ok('AC heli tail rotor spins about X', heli.tailRotor && heli.tailRotor.rotation.x !== 0);
    const jet = build('narrowbody');
    spun(jet);
    ok('AC a jet archetype has no propeller disc',
       (jet.props ?? []).length === 0 && jet.propRate === 0,
       `n=${(jet.props ?? []).length} rate=${jet.propRate}`);
    // The dedicated news chopper is untouched by the archetype path.
    r.updateBgTexts([{ id: 'newschop', mode: 'chopper', text: 'NEWS', aircraft: 'widebody' }],
                    false, 0, 0);
    const nc = r._bgRigs.find(x => x.mode === 'chopper');
    ok('AC `aircraft` is ignored on a chopper entry (dedicated news build kept)',
       !!nc.towWire && !!nc.tailRotor && nc.dir === -1, `dir=${nc.dir}`);
    r.updateBgTexts([], false, 0, 0);
  }

  // ════════════ MODEL SIZE (BgTextEntry.scale) ════════════
  // Independent per-entry knob: the world grew ~190× across the frustum work,
  // so the toys need to be scalable without moving their flight paths.
  {
    const buildAll = (scale, tag) => {
      r.updateBgTexts([
        { id: 'sTrain' + tag, mode: 'train', text: 'BIG TRAIN', scale },
        { id: 'sPlane' + tag, mode: 'banner', text: 'BIG PLANE', scale },
        { id: 'sChop' + tag, mode: 'chopper', text: 'BIG CHOP', scale },
        { id: 'sSky' + tag, mode: 'sky', text: 'BIG SKY', scale },
        { id: 'sGrass' + tag, mode: 'grass', text: 'BIG LAWN', scale },
      ], false, 0, 0);
      const by = (m) => r._bgRigs.find(x => x.mode === m);
      const t = by('train').train;
      return {
        plane: by('banner').asm.scale.x, chop: by('chopper').asm.scale.x,
        sky: by('sky').sky.scale.y, grass: by('grass').grassMesh.scale.x,
        car: t.vehicles[0].obj.scale.x, spacing: t.spacing, wheelR: t.wheelR,
        alt: by('banner').alt, radius: by('banner').radius,
        carPos: t.vehicles[0].obj.position.clone(),
      };
    };
    const one = buildAll(undefined, '1'), three = buildAll(3, '3');
    ok('SCALE default (absent) is exactly 1 on every style',
       one.plane === 1 && one.chop === 1 && one.grass === 1 && one.car === 1.8 &&
       one.spacing === 1480 && one.wheelR === 162,
       `plane=${one.plane} car=${one.car} sp=${one.spacing}`);
    ok('SCALE ×3 scales the banner plane + chopper assemblies',
       Math.abs(three.plane - 3) < 1e-9 && Math.abs(three.chop - 3) < 1e-9,
       `plane=${three.plane} chop=${three.chop}`);
    ok('SCALE ×3 scales the skywriting sprite + grass decal',
       Math.abs(three.sky / one.sky - 3) < 1e-6 && Math.abs(three.grass - 3) < 1e-9,
       `sky=${(three.sky / one.sky).toFixed(3)} grass=${three.grass}`);
    ok('SCALE ×3 scales the train consist AND its spacing / wheel radius',
       Math.abs(three.car - 5.4) < 1e-9 && Math.abs(three.spacing - 4440) < 1e-6 &&
       Math.abs(three.wheelR - 486) < 1e-6,
       `car=${three.car} sp=${three.spacing} wR=${three.wheelR}`);
    ok('SCALE leaves the flight path alone (altitude + orbit radius unchanged)',
       three.alt === one.alt && three.radius === one.radius,
       `alt=${one.alt}/${three.alt} R=${one.radius | 0}/${three.radius | 0}`);
    // Clamp 0.5..5, garbage → 1.
    const lo = buildAll(0.01, 'lo'), hi = buildAll(999, 'hi'), bad = buildAll(NaN, 'bad');
    const neg = buildAll(-2, 'neg');
    ok('SCALE clamps below 0.5', Math.abs(lo.plane - 0.5) < 1e-9, `=${lo.plane}`);
    ok('SCALE clamps above 5', Math.abs(hi.plane - 5) < 1e-9, `=${hi.plane}`);
    ok('SCALE garbage (NaN / negative) → 1',
       bad.plane === 1 && neg.plane === 1, `NaN=${bad.plane} neg=${neg.plane}`);

    // Composition: the scale rides on TOP of the ground-level grade, and the
    // per-entry phase still persists across a rebuild with a scale set.
    const LOW = -600;
    const sc0 = { preset: 'day', floorColor: '#8a7860', floorTex: 'wood', wallColor: '#cfd2d6' };
    r.updateFloor(floor, { ...sc0, groundLevelMm: LOW });
    r.updateBgTexts([
      { id: 'sgTrain', mode: 'train', text: 'LOW BIG', scale: 2 },
      { id: 'sgPlane', mode: 'banner', text: 'LOW BIG', scale: 2, aircraft: 'widebody' },
    ], false, 0, 0);
    const gTrain = r._bgRigs.find(x => x.mode === 'train');
    const gPlane = r._bgRigs.find(x => x.mode === 'banner');
    ok('SCALE composes with ground level (rails on the grade, consist scaled)',
       gTrain.train.baseY === LOW && Math.abs(gTrain.train.vehicles[0].obj.scale.x - 3.6) < 1e-9 &&
       gTrain.train.vehicles[0].obj.position.y === LOW,
       `baseY=${gTrain.train.baseY} sc=${gTrain.train.vehicles[0].obj.scale.x}`);
    ok('SCALE composes with an AGL flight altitude on an archetype model',
       gPlane.alt === 6000 + LOW + 800 && Math.abs(gPlane.asm.scale.x - 2) < 1e-9,
       `alt=${gPlane.alt} sc=${gPlane.asm.scale.x}`);
    // Fly, then rebuild the SAME entries: phase persists AND the scale is re-applied.
    for (let i = 0; i < 600; i++) { clk += 1 / 60; r._advanceBgText(1 / 60, clk); }
    const flownAngle = gPlane.angle, flownS = gTrain.train.s;
    r.updateBgTexts([
      { id: 'sgTrain', mode: 'train', text: 'LOW BIG', scale: 2 },
      { id: 'sgPlane', mode: 'banner', text: 'LOW BIG', scale: 2, aircraft: 'widebody' },
    ], false, 0, 0);
    const g2Train = r._bgRigs.find(x => x.mode === 'train');
    const g2Plane = r._bgRigs.find(x => x.mode === 'banner');
    ok('SCALE + archetype rebuild resumes mid-course and keeps the scale',
       Math.abs(g2Plane.angle - flownAngle) < 1e-9 && Math.abs(g2Train.train.s - flownS) < 1e-6 &&
       Math.abs(g2Plane.asm.scale.x - 2) < 1e-9 &&
       Math.abs(g2Train.train.vehicles[0].obj.scale.x - 3.6) < 1e-9,
       `dAngle=${(g2Plane.angle - flownAngle).toExponential(1)} sc=${g2Plane.asm.scale.x}`);
    // A per-frame advance must never overwrite the group scale.
    clk += 1; r._advanceBgText(1, clk);
    ok('SCALE survives the per-frame advance (nothing writes scale)',
       Math.abs(g2Plane.asm.scale.x - 2) < 1e-9 &&
       Math.abs(g2Train.train.vehicles[0].obj.scale.x - 3.6) < 1e-9,
       `plane=${g2Plane.asm.scale.x} car=${g2Train.train.vehicles[0].obj.scale.x}`);
    r.updateFloor(floor, sc0);
    r.updateBgTexts([], false, 0, 0);
  }

  // ════════════ LAYER GATE (Layers2D.bgText, absent = ON) ════════════
  // three-view feeds updateBgTexts an EMPTY entry list whenever the `bgText`
  // layer is hidden (and folds the flag into _keyBgText so the swap actually
  // rebuilds). This asserts the RENDERER half of that contract: an empty feed
  // disposes every rig and frees its group, and re-enabling rebuilds the rigs —
  // resuming mid-course off the persistent _bgTextPhase, exactly like any other
  // legitimate rebuild.
  {
    const ENTRIES = [
      { id: 'lgTrain', mode: 'train', text: 'LAYER TRAIN' },
      { id: 'lgPlane', mode: 'banner', text: 'LAYER PLANE' },
      { id: 'lgGrass', mode: 'grass', text: 'LAYER LAWN' },
    ];
    r.updateBgTexts(ENTRIES, false, 0, 0);
    ok('LAYER on: three entries build three rigs', r._bgRigs.length === 3, `n=${r._bgRigs.length}`);
    const groupBefore = r._bgTextGroup.children.length;
    ok('LAYER on: the bg-text group has scene content', groupBefore > 0, `children=${groupBefore}`);

    // Fly a while so the phases are demonstrably mid-course.
    for (let i = 0; i < 400; i++) { clk += 1 / 60; r._advanceBgText(1 / 60, clk); }
    const flownAngle = r._bgRigs.find(x => x.mode === 'banner').angle;
    const flownS = r._bgRigs.find(x => x.mode === 'train').train.s;
    ok('LAYER on: rigs actually moved off their build pose',
       Math.abs(flownAngle) > 1e-6 && flownS > 1e-6, `angle=${flownAngle.toFixed(3)} s=${flownS.toFixed(1)}`);

    // Layer OFF → three-view passes []. Every rig must go.
    r.updateBgTexts([], false, 0, 0);
    ok('LAYER off: empty feed leaves ZERO rigs', r._bgRigs.length === 0, `n=${r._bgRigs.length}`);
    ok('LAYER off: the bg-text group is emptied', r._bgTextGroup.children.length === 0,
       `children=${r._bgTextGroup.children.length}`);
    // A per-frame advance over an empty rig list must be a safe no-op.
    let advThrew = false;
    try { clk += 1; r._advanceBgText(1, clk); } catch { advThrew = true; }
    ok('LAYER off: _advanceBgText over zero rigs is a safe no-op', !advThrew, '');

    // Layer back ON → rigs return, and the persistent phase map resumes them.
    r.updateBgTexts(ENTRIES, false, 0, 0);
    ok('LAYER on again: rigs return', r._bgRigs.length === 3, `n=${r._bgRigs.length}`);
    ok('LAYER on again: the group is repopulated', r._bgTextGroup.children.length > 0,
       `children=${r._bgTextGroup.children.length}`);
    const backAngle = r._bgRigs.find(x => x.mode === 'banner').angle;
    const backS = r._bgRigs.find(x => x.mode === 'train').train.s;
    ok('LAYER on again: phase persistence survives the hide/show cycle',
       Math.abs(backAngle - flownAngle) < 1e-9 && Math.abs(backS - flownS) < 1e-6,
       `dAngle=${(backAngle - flownAngle).toExponential(1)} dS=${(backS - flownS).toExponential(1)}`);
    // Hiding while entries exist must not be confused with "no entries authored":
    // toggling twice in a row is idempotent.
    r.updateBgTexts([], false, 0, 0);
    r.updateBgTexts([], false, 0, 0);
    ok('LAYER off twice is idempotent (still zero rigs, no leak)',
       r._bgRigs.length === 0 && r._bgTextGroup.children.length === 0,
       `n=${r._bgRigs.length} children=${r._bgTextGroup.children.length}`);
  }

  // ════════════ GRASS DECAL FACES THE CAMERA (item 12) ════════════
  // The lawn decal must stay FLAT (normal = world +Y) but yaw about its own
  // vertical axis so the text reads like a page lying on the floor: glyphs
  // left-to-right, unmirrored, TOP of the text FARTHEST from the viewer.
  //
  //   The plane is built in XY (texture right = local +X, texture top =
  //   local +Y, normal = local +Z) and carries Euler order 'YXZ', so its world
  //   orientation is Ry(psi)·Rx(-PI/2):
  //     textRight = ( cos psi, 0, -sin psi)
  //     textUp    = (-sin psi, 0, -cos psi)
  //     normal    = ( 0, 1, 0)                       <- always flat
  //   The page convention wants textUp ∝ (centre - camera), which pins
  //     psi = atan2(camX - centreX, camZ - centreZ).
  //   Readability then follows for free: cross(textRight, textUp) = +Y = the
  //   normal, i.e. a right-handed frame whose "out of the page" axis points at
  //   the overhead viewer — the unmirrored condition, true at every yaw.
  //
  // Everything below measures WORLD space off matrixWorld, never rotation.y.
  {
    const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
    const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
    const unit = (a) => { const L = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / L, a[1] / L, a[2] / L]; };
    const basis = (mesh) => {
      r._bgTextGroup.updateMatrixWorld(true);
      const m = mesh.matrixWorld.elements;   // column-major: col0/1/2 = local +X/+Y/+Z
      return { right: unit([m[0], m[1], m[2]]), up: unit([m[4], m[5], m[6]]),
               nrm: unit([m[8], m[9], m[10]]) };
    };
    // Horizontal unit vector from the camera TOWARD the decal centre.
    const camToCentre = (mesh) => unit([mesh.position.x - r._camera.position.x, 0,
                                        mesh.position.z - r._camera.position.z]);
    const placeCam = (mesh, azi, R = 9000, H = 5000) =>
      r._camera.position.set(mesh.position.x + Math.sin(azi) * R, H,
                             mesh.position.z + Math.cos(azi) * R);
    // Advance n frames, accumulating the WRAPPED per-frame yaw delta = the arc
    // actually travelled (the terminal snap-to-target can jump the raw value by
    // 2*PI without moving the decal, so the wrap matters).
    const arcOver = (mesh, n) => {
      let prev = mesh.rotation.y, acc = 0;
      for (let i = 0; i < n; i++) {
        step(1);
        let d = mesh.rotation.y - prev;
        while (d > Math.PI) d -= 2 * Math.PI;
        while (d < -Math.PI) d += 2 * Math.PI;
        acc += Math.abs(d); prev = mesh.rotation.y;
      }
      return acc;
    };
    const readable = (mesh, label) => {
      const b = basis(mesh), toC = camToCentre(mesh);
      ok(`grass ${label}: decal stays FLAT (normal = world +Y)`,
         b.nrm[1] > 0.9999, `n=(${b.nrm.map(v => v.toFixed(3))})`);
      ok(`grass ${label}: text-up is HORIZONTAL`,
         Math.abs(b.up[1]) < 1e-6 && Math.abs(b.right[1]) < 1e-6,
         `up.y=${b.up[1].toExponential(1)} right.y=${b.right[1].toExponential(1)}`);
      ok(`grass ${label}: text-up points AWAY from the camera (page convention)`,
         dot(b.up, toC) > 0.9999, `dot=${dot(b.up, toC).toFixed(5)}`);
      const c = cross(b.right, b.up);
      ok(`grass ${label}: cross(textRight, textUp) = +Y → unmirrored, readable`,
         c[1] > 0.9999 && Math.abs(c[0]) < 1e-6 && Math.abs(c[2]) < 1e-6,
         `c=(${c.map(v => v.toFixed(3))})`);
    };

    // ── auto margin-strip placement ─────────────────────────────────────────
    r.updateBgTexts([{ id: 'gyaw', mode: 'grass', text: 'READ ME' }], false, 0, 0);
    const rigA = r._bgRigs.find(x => x.mode === 'grass');
    const meshA = rigA.grassMesh;
    const homeA = { x: meshA.position.x, y: meshA.position.y, z: meshA.position.z };
    placeCam(meshA, 0.0);               // camera due +Z of the decal
    step(400);
    readable(meshA, 'azimuth 0');
    ok('grass yaw pivots in place (position untouched by the advance)',
       Math.abs(meshA.position.x - homeA.x) < 1e-9 &&
       Math.abs(meshA.position.y - homeA.y) < 1e-9 &&
       Math.abs(meshA.position.z - homeA.z) < 1e-9);

    // Orbit ~120° → re-settles the SHORT way (arc travelled well under PI).
    placeCam(meshA, 0.0 + 2 * Math.PI / 3);
    const arc120 = arcOver(meshA, 400);
    readable(meshA, 'after +120° orbit');
    ok('grass re-settles via the SHORTEST arc after a +120° orbit',
       arc120 < Math.PI && arc120 > 2 * Math.PI / 3 - 0.05,
       `arc=${arc120.toFixed(3)} rad (expect ~2.094, < PI)`);

    // The discriminating case: a further +120° (240° nominal from the start)
    // must go the SHORT way (-120°), never the 240° long way round.
    placeCam(meshA, 0.0 + 4 * Math.PI / 3);
    const arcWrap = arcOver(meshA, 400);
    readable(meshA, 'after wrap-crossing orbit');
    ok('grass takes the short arc across the ±PI wrap (never the long way)',
       arcWrap < Math.PI && arcWrap > 2 * Math.PI / 3 - 0.05,
       `arc=${arcWrap.toFixed(3)} rad (long way would be ~4.19)`);

    // Easing is gradual, not a per-frame snap: one 60 Hz frame after a 120°
    // jump must cover only a small fraction of it (tau ~ 0.6 s).
    placeCam(meshA, 0.0);
    const before = meshA.rotation.y;
    step(1);
    let d1 = meshA.rotation.y - before;
    while (d1 > Math.PI) d1 -= 2 * Math.PI;
    while (d1 < -Math.PI) d1 += 2 * Math.PI;
    ok('grass yaw EASES (a single frame covers only part of the swing)',
       Math.abs(d1) > 1e-4 && Math.abs(d1) < 0.35, `d=${d1.toFixed(4)} rad/frame`);
    step(400);
    readable(meshA, 'settled after ease');

    // ── grassArea (grassAreaId) placement: same behaviour, about the AREA centre ──
    const gaRect = { cx: 6000, cy: 4000, w: 3000, h: 1500 };
    r.updateBgTexts([{ id: 'gyawA', mode: 'grass', text: 'AREA TEXT', grassArea: gaRect }],
                    false, 0, 0);
    const rigB = r._bgRigs.find(x => x.mode === 'grass');
    const meshB = rigB.grassMesh;
    const homeB = { x: meshB.position.x, z: meshB.position.z };
    placeCam(meshB, -2.0);
    step(400);
    readable(meshB, 'grassArea');
    ok('grassArea decal yaws about the AREA rect centre (scene pos unmoved)',
       Math.abs(meshB.position.x - homeB.x) < 1e-9 && Math.abs(meshB.position.z - homeB.z) < 1e-9 &&
       Math.abs(rigB.grass.cx - gaRect.cx) < 1 && Math.abs(rigB.grass.cy - gaRect.cy) < 1);
    // A fresh rig SNAPS on its first advance (no swing in from the build angle).
    r.updateBgTexts([{ id: 'gyawS', mode: 'grass', text: 'SNAP', grassArea: gaRect }],
                    false, 0, 0);
    const meshS = r._bgRigs.find(x => x.mode === 'grass').grassMesh;
    placeCam(meshS, 2.5);
    step(1);
    readable(meshS, 'fresh rig first frame (snap)');

    // ── non-grass rigs are camera-INDEPENDENT ───────────────────────────────
    // Same entries, same virgin phases, same clock, two opposite camera poses:
    // sky / banner / train / chopper must land bit-identical; only grass moves.
    const snapshotAll = (tag, azi) => {
      const ents = [
        { id: 'ci' + tag, mode: 'sky', text: 'SKY' },
        { id: 'cb' + tag, mode: 'banner', text: 'BAN' },
        { id: 'ct' + tag, mode: 'train', text: 'TRAIN CARS' },
        { id: 'cc' + tag, mode: 'chopper', text: 'CHOP' },
        { id: 'cg' + tag, mode: 'grass', text: 'GRASS', grassArea: gaRect },
      ];
      r.updateBgTexts(ents, false, 0, 0);
      const by = (m) => r._bgRigs.find(x => x.mode === m);
      r._camera.position.set(by('grass').grassMesh.position.x + Math.sin(azi) * 9000, 5000,
                             by('grass').grassMesh.position.z + Math.cos(azi) * 9000);
      clk = 5000;                                  // fixed absolute clock for both runs
      for (let i = 0; i < 120; i++) { clk += 1 / 60; r._advanceBgText(1 / 60, clk); }
      return {
        skyX: by('sky').sky.position.x,
        banY: by('banner').asm.rotation.y, banX: by('banner').asm.position.x,
        choY: by('chopper').asm.rotation.y,
        trnY: by('train').train.vehicles[0].obj.rotation.y,
        trnS: by('train').train.s,
        grsY: by('grass').grassMesh.rotation.y,
      };
    };
    const runN = snapshotAll('N', 0), runS = snapshotAll('S', Math.PI);
    ok('sky rig is camera-independent (unchanged drift)', runN.skyX === runS.skyX,
       `${runN.skyX} vs ${runS.skyX}`);
    ok('banner plane is camera-independent (orbit pose + yaw identical)',
       runN.banY === runS.banY && runN.banX === runS.banX,
       `y ${runN.banY} vs ${runS.banY}`);
    ok('chopper is camera-independent (orbit yaw identical)', runN.choY === runS.choY,
       `${runN.choY} vs ${runS.choY}`);
    ok('train is camera-independent (arc position + car yaw identical)',
       runN.trnY === runS.trnY && runN.trnS === runS.trnS,
       `s ${runN.trnS} vs ${runS.trnS}`);
    let dGrs = runN.grsY - runS.grsY;
    while (dGrs > Math.PI) dGrs -= 2 * Math.PI;
    while (dGrs < -Math.PI) dGrs += 2 * Math.PI;
    ok('…while GRASS alone tracked the 180° camera move',
       Math.abs(Math.abs(dGrs) - Math.PI) < 1e-6, `d=${dGrs.toFixed(6)} rad`);
  }

  // ════════════ GROUND WRITING: area-bound polygon decals ════════════
  // The "fit to area" path must (a) clip the writing to the area's REAL polygon
  // — never a box of its own — landing on exactly the world points the ground
  // patch uses, (b) paint on a TRANSPARENT canvas so the area's own material is
  // the backdrop, with per-kind ink, and (c) stay camera-facing by spinning the
  // TEXTURE, since the mesh itself can never move off its area.
  {
    // Asymmetric L (a box-fitting build would cover the notch).
    const L = [{ x: 1000, y: 500 }, { x: 5000, y: 500 }, { x: 5000, y: 1500 },
               { x: 3000, y: 1500 }, { x: 3000, y: 3500 }, { x: 1000, y: 3500 }];
    const CX = 3000, CY = 2000;                    // bbox centre
    const S = Math.hypot(4000, 3000);              // bbox diagonal = the UV square side
    const areaOf = (kind = 'grass', extra) => ({ cx: CX, cy: CY, w: 3200, h: 2400,
                                                 points: L, kind, ...(extra || {}) });
    const build = (area, scale) => {
      r.updateBgTexts([{ id: 'gw', mode: 'grass', text: 'HELLO YARD',
                         grassArea: area, ...(scale ? { scale } : {}) }], false, 0, 0);
      return r._bgRigs.find(x => x.mode === 'grass');
    };

    const rigP = build(areaOf());
    const meshP = rigP.grassMesh, geoP = meshP.geometry;
    ok('area-bound decal builds a ShapeGeometry of the polygon (not a plane)',
       geoP.type === 'ShapeGeometry' && geoP.attributes.position.count > 4 &&
       geoP.parameters.width === undefined,
       `type=${geoP.type} verts=${geoP.attributes.position.count}`);

    // ── the decal's vertices land on the SAME world points the ground patch uses
    r.updateGroundAreas([{ id: 'gaP', kind: 'grass', points: L }], undefined,
                        12000, 8000, [], false, 0);
    const patch = r._groundGroup.children.find(c => c.userData && c.userData.terraceTop !== undefined);
    ok('a real ground patch was built for the comparison', !!patch,
       `children=${r._groundGroup.children.length}`);
    let maxDev = Infinity;
    if (patch) {
      meshP.updateMatrixWorld(true); patch.updateMatrixWorld(true);
      const pd = geoP.attributes.position, pp = patch.geometry.attributes.position;
      maxDev = -1;
      if (pd.count === pp.count) {
        for (let k = 0; k < pd.count; k++) {
          // both are ShapeGeometry(rotation.x=-PI/2): shape (sx,sy) → local (sx,0,-sy)
          const dx = meshP.position.x + pd.getX(k), dz = meshP.position.z - pd.getY(k);
          const px = patch.position.x + pp.getX(k), pz = patch.position.z - pp.getY(k);
          maxDev = Math.max(maxDev, Math.abs(dx - px), Math.abs(dz - pz));
        }
      }
      ok('every decal vertex matches the ground patch world position (x/z)',
         pd.count === pp.count && maxDev >= 0 && maxDev < 1e-6,
         `n=${pd.count}/${pp.count} maxDev=${maxDev}`);
      // Two ASYMMETRIC vertices spot-checked against _w() directly. (ShapeGeometry
      // may reverse/rotate the contour when triangulating, so match by position,
      // not by index — the index-wise patch comparison above already pins order.)
      for (const ix of [1, 3]) {
        const w = r._w(L[ix].x, L[ix].y, 0);
        let best = Infinity;
        for (let k = 0; k < pd.count; k++) {
          const gx = meshP.position.x + pd.getX(k), gz = meshP.position.z - pd.getY(k);
          best = Math.min(best, Math.hypot(gx - w.x, gz - w.z));
        }
        ok(`asymmetric vertex (${L[ix].x},${L[ix].y}) maps through _w() exactly`,
           best < 1e-6, `nearest decal vertex is ${best.toFixed(6)} mm away`);
      }
    }

    // ── the L's NOTCH is genuinely outside the decal ────────────────────────
    // Point-in-mesh over the triangulated geometry, in world XZ.
    const inDecal = (mesh, px, py) => {
      const w = r._w(px, py, 0), g = mesh.geometry;
      const pos = g.attributes.position, idx = g.index;
      const n = idx ? idx.count : pos.count;
      const vx = (k) => mesh.position.x + pos.getX(idx ? idx.getX(k) : k);
      const vz = (k) => mesh.position.z - pos.getY(idx ? idx.getX(k) : k);
      const sign = (ax, az, bx, bz, cx2, cz2) => (ax - cx2) * (bz - cz2) - (bx - cx2) * (az - cz2);
      for (let t = 0; t + 2 < n; t += 3) {
        const d1 = sign(w.x, w.z, vx(t), vz(t), vx(t + 1), vz(t + 1));
        const d2 = sign(w.x, w.z, vx(t + 1), vz(t + 1), vx(t + 2), vz(t + 2));
        const d3 = sign(w.x, w.z, vx(t + 2), vz(t + 2), vx(t), vz(t));
        const neg = d1 < 0 || d2 < 0 || d3 < 0, pos2 = d1 > 0 || d2 > 0 || d3 > 0;
        if (!(neg && pos2)) return true;
      }
      return false;
    };
    ok('a point in the L body IS covered by the decal', inDecal(meshP, 2000, 2500));
    ok('a point in the L NOTCH is NOT covered (truly constrained to the geometry)',
       !inDecal(meshP, 4200, 2800), 'notch (4200,2800)');
    ok('a point outside the bbox is NOT covered', !inDecal(meshP, 8000, 7000));

    // ── UV square: isotropic window of side S centred on the area centre ────
    {
      const pos = geoP.attributes.position, uv = geoP.attributes.uv;
      let bad = 0, checked = 0, outside = 0;
      for (let k = 0; k < pos.count; k++) {
        const sx = pos.getX(k), sy = pos.getY(k);
        if (Math.abs(uv.getX(k) - (0.5 + sx / S)) > 1e-6 ||
            Math.abs(uv.getY(k) - (0.5 + sy / S)) > 1e-6) bad++;
        if (uv.getX(k) < -1e-9 || uv.getX(k) > 1 + 1e-9 ||
            uv.getY(k) < -1e-9 || uv.getY(k) > 1 + 1e-9) outside++;
        checked++;
      }
      ok('every uv = (0.5 + sx/S, 0.5 + sy/S) with sx=cx−px, sy=cy−py',
         bad === 0 && checked > 4, `bad=${bad}/${checked}`);
      ok('every uv stays inside [0,1] (rotation can never sample past the border)',
         outside === 0, `outside=${outside}`);
      // Spot-check the known corner (5000,500): sx=−2000 sy=1500 → u=0.1 v=0.8.
      let hit = -1;
      for (let k = 0; k < pos.count; k++)
        if (Math.abs(pos.getX(k) - (CX - 5000)) < 1e-6 && Math.abs(pos.getY(k) - (CY - 500)) < 1e-6) hit = k;
      ok('known vertex (5000,500) has uv (0.1, 0.8)',
         hit >= 0 && Math.abs(uv.getX(hit) - 0.1) < 1e-6 && Math.abs(uv.getY(hit) - 0.8) < 1e-6,
         hit >= 0 ? `uv=(${uv.getX(hit).toFixed(4)},${uv.getY(hit).toFixed(4)})` : 'vertex not found');
      ok('the texture rotates about its centre (0.5, 0.5)',
         meshP.material.map.center.x === 0.5 && meshP.material.map.center.y === 0.5);
      const cvSq = meshP.material.map.image;
      ok('area-bound texture canvas is SQUARE (rotation cannot distort)',
         cvSq.width === cvSq.height, `${cvSq.width}x${cvSq.height}`);
    }

    // ── transparent backdrop + per-kind ink ────────────────────────────────
    const inkStats = (mesh) => {
      const cv = mesh.material.map.image, g2 = cv.getContext('2d');
      const d = g2.getImageData(0, 0, cv.width, cv.height).data;
      let n = 0, R = 0, G = 0, B = 0, opaque = 0;
      let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
      for (let i = 0; i < d.length; i += 4) {
        if (d[i + 3] > 40) {
          n++; R += d[i]; G += d[i + 1]; B += d[i + 2];
          if (d[i + 3] > 200) opaque++;
          const px = (i / 4) % cv.width, py = Math.floor((i / 4) / cv.width);
          if (px < minX) minX = px; if (px > maxX) maxX = px;
          if (py < minY) minY = py; if (py > maxY) maxY = py;
        }
      }
      return { n, r: R / Math.max(1, n), g: G / Math.max(1, n), b: B / Math.max(1, n),
               opaque, w: maxX - minX, h: maxY - minY, cv };
    };
    const grassInk = inkStats(meshP);
    const cvG = grassInk.cv, gg = cvG.getContext('2d');
    const alphaAt = (cv, x, y) => cv.getContext('2d').getImageData(x, y, 1, 1).data[3];
    ok('area-bound canvas corner is fully TRANSPARENT (area material shows through)',
       alphaAt(cvG, 0, 0) === 0 && alphaAt(cvG, cvG.width - 1, cvG.height - 1) === 0 &&
       alphaAt(cvG, cvG.width - 1, 0) === 0,
       `a=${alphaAt(cvG, 0, 0)}/${alphaAt(cvG, cvG.width - 1, cvG.height - 1)}`);
    ok('area-bound canvas paints only the lettering (mostly transparent)',
       grassInk.n > 200 && grassInk.n < cvG.width * cvG.height * 0.5,
       `ink=${grassInk.n}/${cvG.width * cvG.height}`);
    ok('area-bound material is transparent', meshP.material.transparent === true);

    const concreteInk = inkStats(build(areaOf('concrete')).grassMesh);
    ok('concrete-area ink differs from grass-area ink',
       Math.abs(concreteInk.r - grassInk.r) > 25 || Math.abs(concreteInk.b - grassInk.b) > 25,
       `grass=(${grassInk.r | 0},${grassInk.g | 0},${grassInk.b | 0}) ` +
       `concrete=(${concreteInk.r | 0},${concreteInk.g | 0},${concreteInk.b | 0})`);
    ok('grass ink stays green-dominant (shipped palette unchanged)',
       grassInk.g > grassInk.r + 10 && grassInk.g > grassInk.b + 10,
       `(${grassInk.r | 0},${grassInk.g | 0},${grassInk.b | 0})`);
    ok('concrete ink is neutral grey (not green)',
       Math.abs(concreteInk.r - concreteInk.g) < 25 && Math.abs(concreteInk.g - concreteInk.b) < 25,
       `(${concreteInk.r | 0},${concreteInk.g | 0},${concreteInk.b | 0})`);
    const waterInk = inkStats(build(areaOf('water')).grassMesh);
    ok('water ink is blue-dominant', waterInk.b > waterInk.r + 20,
       `(${waterInk.r | 0},${waterInk.g | 0},${waterInk.b | 0})`);

    // ── the size knob scales the TEXT, never the polygon ───────────────────
    const rig1 = build(areaOf(), 1), ink1 = inkStats(rig1.grassMesh);
    const rig2 = build(areaOf(), 2), ink2 = inkStats(rig2.grassMesh);
    ok('area-bound decal keeps mesh.scale = 1 at scale ×2 (never spills the area)',
       rig2.grassMesh.scale.x === 1 && rig2.grassMesh.scale.y === 1 && rig2.grassMesh.scale.z === 1,
       `s=${rig2.grassMesh.scale.x}`);
    ok('…and grows the PAINTED text instead', ink2.h > ink1.h * 1.5 && ink2.n > ink1.n,
       `h ${ink1.h}→${ink2.h}, ink ${ink1.n}→${ink2.n}`);
    r.updateBgTexts([{ id: 'auto2', mode: 'grass', text: 'AUTO BIG', scale: 2 }], false, 0, 0);
    ok('AUTO placement still scales the MESH at scale ×2 (regression)',
       r._bgRigs.find(x => x.mode === 'grass').grassMesh.scale.x === 2);

    // ── camera-facing via TEXTURE rotation (the mesh must never move) ──────
    const rigC = build(areaOf());
    const meshC = rigC.grassMesh, texC = meshC.material.map;
    const home = { x: meshC.position.x, y: meshC.position.y, z: meshC.position.z };
    const placeCam2 = (mesh, azi) =>
      r._camera.position.set(mesh.position.x + Math.sin(azi) * 9000, 5000,
                             mesh.position.z + Math.cos(azi) * 9000);
    placeCam2(meshC, 0.7); step(400);
    const rot1 = texC.rotation;
    placeCam2(meshC, 0.7 + 2.0); step(400);
    ok('area-bound decal spins the TEXTURE as the camera moves',
       Math.abs(texC.rotation - rot1) > 1.0, `${rot1.toFixed(3)} → ${texC.rotation.toFixed(3)}`);
    ok('…while mesh.rotation.y stays 0 (the polygon never leaves its area)',
       meshC.rotation.y === 0, `y=${meshC.rotation.y}`);
    ok('…and the mesh never moves', meshC.position.x === home.x &&
       meshC.position.y === home.y && meshC.position.z === home.z);

    // World-space readability at four azimuths. The surface's u-axis is local +X
    // and its v-axis local +Y (→ world −Z after rotation.x=−PI/2); three rotates
    // the SAMPLED uv by [[c,s],[−s,c]], so the painted image's own axes sit at
    //   textRight = cosθ·right + sinθ·up,  textUp = −sinθ·right + cosθ·up
    // with right/up read off matrixWorld. Same invariants as the mesh-yaw path.
    const unit2 = (v) => { const L2 = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / L2, v[1] / L2, v[2] / L2]; };
    const dot2 = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
    const cross2 = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
    for (const azi of [0, 1.3, -2.2, Math.PI]) {
      placeCam2(meshC, azi); step(600);
      meshC.updateMatrixWorld(true);
      const m = meshC.matrixWorld.elements;
      const right = unit2([m[0], m[1], m[2]]), up = unit2([m[4], m[5], m[6]]);
      const nrm = unit2([m[8], m[9], m[10]]);
      const th = texC.rotation, c = Math.cos(th), s = Math.sin(th);
      const tR = unit2([c * right[0] + s * up[0], c * right[1] + s * up[1], c * right[2] + s * up[2]]);
      const tU = unit2([-s * right[0] + c * up[0], -s * right[1] + c * up[1], -s * right[2] + c * up[2]]);
      const toC = unit2([meshC.position.x - r._camera.position.x, 0,
                         meshC.position.z - r._camera.position.z]);
      const cr = cross2(tR, tU);
      const tag = `azi ${azi.toFixed(2)}`;
      ok(`ground-writing ${tag}: decal stays FLAT (normal = world +Y)`, nrm[1] > 0.9999);
      ok(`ground-writing ${tag}: text-up points AWAY from the camera`,
         dot2(tU, toC) > 0.9999, `dot=${dot2(tU, toC).toFixed(5)}`);
      ok(`ground-writing ${tag}: cross(textRight, textUp) = +Y → unmirrored`,
         cr[1] > 0.9999 && Math.abs(cr[0]) < 1e-6 && Math.abs(cr[2]) < 1e-6,
         `c=(${cr.map(v => v.toFixed(3))})`);
    }

    // ── stale planner (rect only, no points) → the legacy plane, verbatim ──
    r.updateBgTexts([{ id: 'legacy', mode: 'grass', text: 'OLD WAY',
                       grassArea: { cx: 6000, cy: 4000, w: 3000, h: 1500 } }], false, 0, 0);
    const rigL = r._bgRigs.find(x => x.mode === 'grass');
    ok('a grassArea WITHOUT points takes the legacy PlaneGeometry path (stale planner)',
       rigL.grassMesh.geometry.type === 'PlaneGeometry' &&
       Math.abs(rigL.grassMesh.geometry.parameters.width - 3000) < 1 &&
       !rigL.grassTexRot,
       `type=${rigL.grassMesh.geometry.type} texRot=${rigL.grassTexRot}`);
    ok('…with the opaque mowed-grass backdrop (canvas corner NOT transparent)',
       alphaAt(rigL.grassMesh.material.map.image, 0, 0) === 255);
    placeCam2(rigL.grassMesh, 1.1); step(300);
    ok('…and still yaws the MESH, not the texture',
       Math.abs(rigL.grassMesh.rotation.y) > 0.05 && rigL.grassMesh.material.map.rotation === 0,
       `y=${rigL.grassMesh.rotation.y.toFixed(3)} texRot=${rigL.grassMesh.material.map.rotation}`);
    // A polygon area with fewer than 3 points also falls back.
    r.updateBgTexts([{ id: 'thin', mode: 'grass', text: 'THIN',
                       grassArea: { cx: 6000, cy: 4000, w: 3000, h: 1500,
                                    points: [{ x: 0, y: 0 }, { x: 10, y: 10 }], kind: 'sand' } }],
                    false, 0, 0);
    ok('a degenerate 2-point polygon falls back to the legacy plane',
       r._bgRigs.find(x => x.mode === 'grass').grassMesh.geometry.type === 'PlaneGeometry');
  }

  // ════════════ report ════════════
  const pass = tests.filter(t => t.ok).length, total = tests.length;
  const allPass = pass === total;
  const fails = tests.filter(t => !t.ok).map(t => t.name);
  const title = allPass ? `BGTEXTMULTI PASS ${pass}/${total}` : `BGTEXTMULTI FAIL ${pass}/${total} [${fails.join(', ')}]`;
  document.title = title;
  document.getElementById('log').innerHTML =
    `<div class="hd ${allPass ? 'pass' : 'fail'}">${title}</div>` +
    tests.map(t => `<div><span class="${t.ok ? 'pass' : 'fail'}">${t.ok ? 'PASS' : 'FAIL'}</span> ${t.name} <span style="color:#78909c">${t.detail}</span></div>`).join('');
 } catch (e) {
  document.title = 'BGTEXTMULTI ERR: ' + (e && e.stack ? e.stack.split('\n').slice(0, 3).join(' | ') : e);
  document.getElementById('log').textContent = e && e.stack ? e.stack : String(e);
 }
</script>
