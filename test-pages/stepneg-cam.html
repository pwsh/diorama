<!doctype html>
<meta charset="utf-8"><title>stepneg</title>
<style>html,body{margin:0;background:#111}#c{width:1280px;height:880px}</style>
<div id="c"></div>
<script type="module">
  const mod = await import('./assets/three-renderer.js?v=' + Date.now());
  const r = new mod.ThreeDRenderer(document.getElementById('c'));
  await r.load();
  const floor = {
    id:'f1', name:'T', w:8000, d:6000, walls:[],
    furniture: [
      { id:'st1', x:4000, y:3000, w:1000, h:2800, kind:'stairs', rotation:0, elevation:-2743 },
    ],
    lights: [
      { id:'l1', x:3400, y:3000, entity_id:'light.on', iconKind:'step', height:-800, rotation:270, label:'' },
    ],
    switches:[], sensors:[], motionSensors:[], envSensors:[], doors:[], windows:[], bg:null, model3d:null,
  };
  r.updateFloor(floor, { preset:'night', floorColor:'#8a7860', floorTex:'none' });
  r.updateLightsSwitches(floor.lights, [], () => ({ state:'on', attributes:{ brightness:230 } }));
  const cam=(new URLSearchParams(location.search).get("cam")||"-1500,900,-1200,4200,-1200,200").split(",").map(Number);r.setCameraView([cam[0],cam[1],cam[2]],[cam[3],cam[4],cam[5]]);
  // dump the spotlight + target positions
  let dump = '';
  r._lightGroup.traverse(o => {
    if (o.isSpotLight) dump += ` spot@(${o.position.x.toFixed(0)},${o.position.y.toFixed(0)},${o.position.z.toFixed(0)})`;
    if (o.isSpotLight && o.target) dump += ` tgt@(${o.target.position.x.toFixed(0)},${o.target.position.y.toFixed(0)},${o.target.position.z.toFixed(0)})`;
  });
  document.title = dump || 'no spot';
</script>
