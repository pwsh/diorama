<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>FLIGHTSUI …</title>
  <style>
    body { margin:0; background:#0d1116; color:#cfd8dc; font:13px/1.5 sans-serif; padding:14px; }
    h1 { font-size:15px; margin:0 0 10px; }
    h2 { font-size:12px; color:#90caf9; margin:14px 0 4px; }
    #summary { font-size:14px; font-weight:bold; margin:10px 0; padding:8px 10px; border-radius:5px; }
    .okbg { background:#12331f; color:#69f0ae; } .badbg { background:#3a1414; color:#ff8a80; }
    .row { display:flex; justify-content:space-between; gap:10px; padding:2px 0; border-bottom:1px solid #1c2530; }
    .pass { color:#69f0ae; } .fail { color:#ff5252; }
    .name { color:#cfd8dc; } .extra { color:#ffd54f; font-size:11px; }
  </style>
</head>
<body>
  <h1>Flights UI — alert feed `extra` channel · low-overflight · watch list · ISS edge · dismiss · prune · flyover event · watch normalization · labelFields/beacons/privacyDim config · 2D beacons + privacy dim + label fields · settings drawer</h1>
  <div id="summary">Running…</div>
  <div id="rows"></div>
  <div id="mount"></div>

  <!-- Two bundles, no live HA (the alert-center-test / config-test recipe):
         # pure alerts module (zero deps):
         npx esbuild src/alerts.ts --bundle --format=esm --outfile=<harness>/alerts.mod.js
         # the REAL Planner over an in-page fake HaApi (IndexedDB doesn't run under
         # the headless virtual-time harness → swap the avatar store for the stub):
         T=$(mktemp -d); cp -r src/* "$T"/
         cp test-pages/fake-avatar-store.ts "$T"/avatar-store.ts
         npx esbuild "$T"/planner.ts --bundle --format=esm --outfile=<harness>/planner.mod.js
       # 2D flight drawing + hit-testing + click routing. ONE bundle so all three
       # modules share module state — flightHitPx is populated by drawAll and read
       # by hitFlight, which a second bundle would silently duplicate:
         T=$(mktemp -d); cp -r src/* "$T"/
         cp test-pages/fake-avatar-store.ts "$T"/avatar-store.ts
         printf "export { drawAll, flightBeaconColor, flightLabelLines, flightFieldText, FLIGHT_BEACON_COLORS, flightHitPx } from './canvas-render.js';\nexport { hitFlight } from './canvas-hit.js';\nexport { onCanvasClick } from './canvas-interact.js';\n" > "$T"/flights2d-entry.ts
         npx esbuild "$T"/flights2d-entry.ts --bundle --format=esm --outfile=<harness>/canvas-render.mod.js
       # the REAL settings drawer (Lit, light DOM) + its own Planner export —
       # the sensor-focus recipe: copy tsconfig.json into the temp src dir (else
       # esbuild leaves raw decorators), alias lit, and DEFINE the build tag:
         T=$(mktemp -d); cp -r src/* "$T"/; cp tsconfig.json "$T"/
         cp test-pages/fake-avatar-store.ts "$T"/avatar-store.ts
         printf "export { Planner } from '../planner.js';\nimport './modals.js';\n" > "$T"/ui/flightsui-entry.ts
         npx esbuild "$T"/ui/flightsui-entry.ts --bundle --format=esm --tsconfig="$T"/tsconfig.json \
           --alias:lit=$PWD/node_modules/lit/index.js \
           --alias:lit/decorators.js=$PWD/node_modules/lit/decorators.js \
           --define:__DIORAMA_VERSION__='"test"' \
           --outfile=<harness>/flightsui.mod.js
       Run wide (--window-size=1200,900); globalThis.fetch is stubbed below so no
       flight/ISS poll ever leaves the page.
  -->
  <script type="module">
    import { buildAlertFeed } from './alerts.mod.js';

    const results = [];
    const ok = (name, cond, extra = '') => results.push({ name, pass: !!cond, extra: String(extra) });
    const eq = (name, got, want) => ok(name, got === want, `got ${JSON.stringify(got)} want ${JSON.stringify(want)}`);
    const sleep = ms => new Promise(r => setTimeout(r, ms));
    async function waitFor(cond, tries = 400) {
      for (let i = 0; i < tries; i++) { if (cond()) return true; await sleep(4); }
      return !!cond();
    }
    const section = n => results.push({ section: n });

    // No network from this page, ever — the planner's poll paths must see a
    // failure, not a real airplanes.live / wheretheiss.at request.
    globalThis.fetch = () => Promise.reject(new Error('offline test harness'));

    // ── 1. buildAlertFeed `extra` channel (pure, backward compatible) ─────────
    section('buildAlertFeed extra channel');
    const notifs = [
      { notification_id: 'n1', title: 'Info note', message: 'hello', created_at: '2026-07-24T10:00:00Z' },
    ];
    const repairs = [
      { issue_id: 'i1', domain: 'hue', severity: 'warning', created: '2026-07-24T09:00:00Z' },
    ];
    const extraAlerts = [
      { id: 'flight:low:abc123', source: 'flight', severity: 'critical',
        title: 'Low overflight', createdAt: '2026-07-24T11:00:00Z', dismissible: true },
      { id: 'flight:watch:def456', source: 'flight', severity: 'info',
        title: 'Watched flight', createdAt: '2026-07-24T11:30:00Z', dismissible: true },
    ];

    const baseFeed = buildAlertFeed(notifs, repairs, {});
    eq('omitted extra arg = old behavior (len)', baseFeed.length, 2);
    ok('omitted extra arg = old behavior (no flight rows)',
      baseFeed.every(a => a.source !== 'flight'));

    const withExtra = buildAlertFeed(notifs, repairs, {}, extraAlerts);
    eq('extra entries appended (len)', withExtra.length, 4);
    eq('extra sorted by severity → critical first', withExtra[0].id, 'flight:low:abc123');
    ok('extra entries keep their source', withExtra.some(a => a.source === 'flight' && a.id === 'flight:watch:def456'));

    // The repairs severity FLOOR is HA-source policy — client-local alerts are
    // appended verbatim and must not be filtered by it.
    const floored = buildAlertFeed([], repairs, { minRepairSeverity: 'critical' }, extraAlerts);
    eq('severity floor drops the warning repair', floored.some(a => a.source === 'repair'), false);
    eq('severity floor does NOT apply to extra', floored.filter(a => a.source === 'flight').length, 2);

    // Per-source toggles likewise do not reach `extra`.
    const toggled = buildAlertFeed(notifs, repairs,
      { showPersistentNotifications: false, showRepairs: false }, extraAlerts);
    eq('source toggles leave extra intact', toggled.length, 2);

    // ── Planner sections (real Planner over a fake HaApi, frozen clock) ───────
    const realNow = Date.now;
    try {
      const V = '?v=' + Date.now();
      const { Planner } = await import('./planner.mod.js' + V);

      class FakeHa {
        constructor() {
          this.states = {};
          this._stateCbs = []; this._connCbs = [];
          this._notifCb = null;
          this.repairs = [];
          this.calls = [];
        }
        connect() {
          for (const cb of this._connCbs) cb('connected');
          for (const cb of this._stateCbs) cb(this.states, undefined);
        }
        onState(fn) { this._stateCbs.push(fn); }
        onConn(fn) { this._connCbs.push(fn); }
        callService(domain, service, data) { this.calls.push({ domain, service, data }); return Promise.resolve(); }
        async getHistory() { return {}; }
        async getWeatherForecasts() { return null; }
        async getCalendarEvents() { return []; }
        async getDevices() { return []; }
        async getEntityRegistry() { return []; }
        async updateEntityRegistry() { return true; }
        async subscribeMqtt() { return () => {}; }
        async publishMqtt() {}
        async getUserData() { return null; }
        async setUserData() { return true; }
        async refreshStates() {}
        async subscribePersistentNotifications(cb) { this._notifCb = cb; return () => { this._notifCb = null; }; }
        async listRepairsIssues() { return this.repairs.map(r => ({ ...r })); }
        async ignoreRepairsIssue() { return true; }
        pushNotifs(u) { if (this._notifCb) this._notifCb(u); }
      }

      const ha = new FakeHa();
      const p = new Planner();
      p.connectWith(ha);
      await sleep(30);

      // Frozen, advanceable clock — cooldowns and the prune window are both
      // wall-clock driven, so the whole planner section runs on virtual time.
      let NOW = Date.parse('2026-07-24T12:00:00Z');
      Date.now = () => NOW;
      const advanceMin = m => { NOW += m * 60000; };

      // Observer origin: the weather lat/lon leg of flightsOrigin()'s fallback
      // chain (no geo landmarks configured in this harness).
      p.store.weather = { source: 'openmeteo', lat: 40, lon: -75 };
      ok('flightsOrigin resolves from weather lat/lon', p.flightsOrigin() != null);

      const ac = (hex, callsign, altFt, distNm) => ({
        hex, callsign, lat: 40, lon: -75, altFt, gsKt: null, trackDeg: null,
        vertRateFpm: null, category: null, seenPosS: 0, military: false, distNm,
      });
      // Config is assigned DIRECTLY (not through setFlights) so no poll timer
      // starts — _computeFlightAlerts is driven explicitly instead.
      const cfg = (alerts) => { p.store.flights = { enabled: true, source: 'cloud', iss: false, alerts }; };
      const reset = () => {
        p.flightAlerts = [];
        p._flightAlertDismissed = new Set();
        p._flightAlertAt = new Map();
        p._issWasUp = false;
        p.householdEvents = [];
        p.issNow = null;
      };
      const lowAlerts = () => p.flightAlerts.filter(a => a.id.startsWith('flight:low:'));
      const watchAlerts = () => p.flightAlerts.filter(a => a.id.startsWith('flight:watch:'));
      const issAlerts = () => p.flightAlerts.filter(a => a.id.startsWith('flight:iss:'));

      // ── 2. Low overflight ──────────────────────────────────────────────────
      section('Low overflight trigger');
      reset(); cfg({ lowAltFt: 2500 });
      p.flightsNow = [ac('a1b2c3', 'UAL123', 1500, 2)];
      p._computeFlightAlerts();
      eq('1500 ft @ 2 nm with lowAltFt 2500 → one alert', lowAlerts().length, 1);
      eq('alert source is flight', lowAlerts()[0]?.source, 'flight');
      eq('alert severity is warning', lowAlerts()[0]?.severity, 'warning');
      ok('title names the callsign + altitude',
        /Low overflight: UAL123 at 1,?500 ft/.test(lowAlerts()[0]?.title ?? ''), lowAlerts()[0]?.title);
      ok('message reports the distance', /2\.0 nm/.test(lowAlerts()[0]?.message ?? ''), lowAlerts()[0]?.message);

      // Same hex again inside the 10-minute cooldown → no duplicate.
      advanceMin(5);
      p._computeFlightAlerts();
      eq('same hex within cooldown → no duplicate', lowAlerts().length, 1);

      // A different aircraft is a separate alert.
      p.flightsNow = [ac('a1b2c3', 'UAL123', 1500, 2), ac('ddeeff', 'SWA9', 900, 1)];
      p._computeFlightAlerts();
      eq('different hex → second alert', lowAlerts().length, 2);
      ok('second alert keyed by its own hex', p.flightAlerts.some(a => a.id === 'flight:low:ddeeff'));

      // Beyond the 3 nm "overhead" gate → nothing, even though it is low and in radius.
      reset(); cfg({ lowAltFt: 2500 });
      p.flightsNow = [ac('bb1111', 'DAL5', 1200, 8)];
      p._computeFlightAlerts();
      eq('low but 8 nm out → no alert (3 nm gate)', lowAlerts().length, 0);

      // No threshold configured → the trigger is off entirely.
      reset(); cfg({});
      p.flightsNow = [ac('cc2222', 'AAL1', 300, 0.5)];
      p._computeFlightAlerts();
      eq('blank lowAltFt → no alert', lowAlerts().length, 0);

      // Hex fallback when the aircraft broadcasts no callsign.
      reset(); cfg({ lowAltFt: 2500 });
      p.flightsNow = [ac('c0ffee', null, 800, 1)];
      p._computeFlightAlerts();
      ok('no callsign → uppercase hex in the title',
        /Low overflight: C0FFEE/.test(lowAlerts()[0]?.title ?? ''), lowAlerts()[0]?.title);

      // ── 3. Watch list ──────────────────────────────────────────────────────
      section('Watch list trigger');
      reset(); cfg({ watch: ['UAL', 'a1b2c3'] });   // lowercase entry re-uppered at match time
      p.flightsNow = [ac('999999', 'UAL123', 35000, 12)];
      p._computeFlightAlerts();
      eq('callsign PREFIX match fires', watchAlerts().length, 1);
      eq('watch alert severity is info', watchAlerts()[0]?.severity, 'info');
      ok('watch title names the flight', /Watched flight: UAL123/.test(watchAlerts()[0]?.title ?? ''));

      reset(); cfg({ watch: ['UAL', 'a1b2c3'] });
      p.flightsNow = [ac('a1b2c3', 'XYZ1', 20000, 5)];
      p._computeFlightAlerts();
      eq('exact hex match fires (case-insensitive)', watchAlerts().length, 1);

      reset(); cfg({ watch: ['UAL', 'a1b2c3'] });
      p.flightsNow = [ac('777777', 'DAL42', 30000, 6)];
      p._computeFlightAlerts();
      eq('non-matching flight does not fire', watchAlerts().length, 0);

      reset(); cfg({ watch: ['ual'] });
      p.flightsNow = [ac('888888', 'UAL7', 30000, 6)];
      p._computeFlightAlerts();
      advanceMin(10);
      p._computeFlightAlerts();
      eq('watch cooldown (30 min) suppresses a re-fire at +10 min', watchAlerts().length, 1);
      advanceMin(25);
      p._computeFlightAlerts();
      eq('watch re-fires past the 30 min cooldown', watchAlerts().length, 1);
      ok('re-fire replaced the entry rather than stacking',
        p.flightAlerts.filter(a => a.id === 'flight:watch:888888').length === 1);

      // ── 4. ISS pass edge detector ──────────────────────────────────────────
      section('ISS pass edge detector');
      reset();
      p.store.flights = { enabled: true, source: 'cloud', iss: true, alerts: { issPass: true } };
      p.flightsNow = [];
      // Antipodal sub-point → well below the horizon.
      p.issNow = { lat: -40, lon: 105, altKm: 420, velKmS: 7.66, tsMs: NOW };
      p._computeFlightAlerts();
      eq('ISS below the horizon → no alert', issAlerts().length, 0);

      // Directly overhead → crosses the 10° threshold.
      p.issNow = { lat: 40, lon: -75, altKm: 420, velKmS: 7.66, tsMs: NOW + 1 };
      p._computeFlightAlerts();
      eq('below→above transition fires once', issAlerts().length, 1);
      eq('ISS alert severity is info', issAlerts()[0]?.severity, 'info');
      ok('ISS title carries the altitude readout',
        /ISS pass — above the horizon now \(alt \d+°\)/.test(issAlerts()[0]?.title ?? ''), issAlerts()[0]?.title);
      const issCreated = issAlerts()[0]?.createdAt;

      // Staying above must NOT re-fire (edge detector, not a level check).
      advanceMin(1);
      p.issNow = { lat: 40.5, lon: -75.2, altKm: 420, velKmS: 7.66, tsMs: NOW + 2 };
      p._computeFlightAlerts();
      eq('staying above does not re-fire (count)', issAlerts().length, 1);
      eq('staying above does not re-fire (createdAt unchanged)', issAlerts()[0]?.createdAt, issCreated);

      // issPass explicitly false → never, even across a fresh rising edge.
      reset();
      p.store.flights = { enabled: true, source: 'cloud', iss: true, alerts: { issPass: false } };
      p.issNow = { lat: -40, lon: 105, altKm: 420, velKmS: 7.66, tsMs: NOW };
      p._computeFlightAlerts();
      p.issNow = { lat: 40, lon: -75, altKm: 420, velKmS: 7.66, tsMs: NOW + 1 };
      p._computeFlightAlerts();
      eq('issPass:false → never fires', issAlerts().length, 0);

      // ── 5. Dismiss ─────────────────────────────────────────────────────────
      section('Dismiss routing');
      reset(); cfg({ lowAltFt: 2500 });
      p.flightsNow = [ac('a1b2c3', 'UAL123', 1500, 2)];
      p._computeFlightAlerts();
      ha.pushNotifs({ type: 'current', notifications: {
        na: { notification_id: 'na', title: 'Backup failed', message: 'disk', created_at: '2026-07-24T11:00:00Z' },
      }});
      await waitFor(() => p.notifications.length === 1);
      const target = p.alertFeed.find(a => a.source === 'flight');
      ok('flight alert present in alertFeed before dismiss', target != null);
      p.dismissAlert(target);
      eq('dismissed flight alert leaves alertFeed', p.alertFeed.some(a => a.id === target.id), false);
      eq('dismiss removes it from flightAlerts', p.flightAlerts.some(a => a.id === target.id), false);
      eq('other sources unaffected by a flight dismiss', p.alertFeed.some(a => a.source === 'notification'), true);
      eq('dismissing a flight alert makes no service call', ha.calls.length, 0);

      // View mode refuses.
      reset(); cfg({ lowAltFt: 2500 });
      p.flightsNow = [ac('a1b2c3', 'UAL123', 1500, 2)];
      p._computeFlightAlerts();
      const t2 = p.flightAlerts[0];
      p.uiMode = 'view';
      p.dismissAlert(t2);
      eq('view mode refuses dismiss', p.flightAlerts.some(a => a.id === t2.id), true);
      p.uiMode = 'edit';

      // ── 6. Pruning ─────────────────────────────────────────────────────────
      section('Retention window');
      reset(); cfg({ lowAltFt: 2500 });
      p.flightsNow = [ac('a1b2c3', 'UAL123', 1500, 2)];
      p._computeFlightAlerts();
      eq('alert exists before the window elapses', p.flightAlerts.length, 1);
      advanceMin(16);
      p.flightsNow = [];                      // nothing to re-push
      p._computeFlightAlerts();
      eq('alert older than 15 min is pruned', p.flightAlerts.length, 0);

      // ── 7. Household "flyover" event ───────────────────────────────────────
      section('Flyover household event');
      reset(); cfg({ lowAltFt: 2500 });
      p.flightsNow = [ac('a1b2c3', 'UAL123', 1500, 2)];
      p._computeFlightAlerts();
      const fly = p.householdEvents.filter(e => e.kind === 'flyover');
      eq('low overflight pushes one flyover event', fly.length, 1);
      eq('flyover event is house-wide (no fixture anchor)', fly[0]?.furnitureId, null);
      ok('flyover event carries a timestamp', typeof fly[0]?.at === 'number' && fly[0].at === NOW);

      reset(); cfg({ lowAltFt: 2500 });
      p.flightsNow = [ac('bb1111', 'DAL5', 1200, 8)];   // outside the 3 nm gate
      p._computeFlightAlerts();
      eq('no flyover event without a low overflight',
        p.householdEvents.filter(e => e.kind === 'flyover').length, 0);

      // ── 8. setFlights watch-list normalization ─────────────────────────────
      section('setFlights watch normalization');
      // enabled:false keeps _reconfigureFlights inert (no timers, no fetch)
      // while still exercising the normalization, which runs before the branch.
      p.setFlights(f => {
        f.enabled = false;
        f.alerts = { watch: [' ual ', 'n12345', '', '  ', 'a1b2c3'] };
      });
      const w = p.store.flights.alerts.watch;
      ok('watch normalized to uppercase', JSON.stringify(w) === JSON.stringify(['UAL', 'N12345', 'A1B2C3']),
        JSON.stringify(w));
      eq('blank entries dropped', w.length, 3);
      p.setFlights(f => { f.alerts.watch = ['   ', '']; });
      eq('all-blank watch list clears to undefined', p.store.flights.alerts.watch, undefined);
      p.setFlights(f => { f.alerts = {}; });
      ok('absent watch list stays absent', p.store.flights.alerts.watch === undefined);

      // ── 9. Feed integration ────────────────────────────────────────────────
      section('Alert feed integration');
      reset();
      p.store.flights = { enabled: true, source: 'cloud', iss: false, alerts: { lowAltFt: 2500 } };
      p.flightsNow = [ac('a1b2c3', 'UAL123', 1500, 2)];
      p._computeFlightAlerts();
      // Replace the earlier "Backup failed" note (which classifies as ERROR and
      // legitimately outranks a warning) with a plain info one, so the ordering
      // assertion below actually exercises warning-over-info.
      ha.pushNotifs({ type: 'current', notifications: {
        ni: { notification_id: 'ni', title: 'Welcome', message: 'all good', created_at: '2026-07-24T11:00:00Z' },
      }});
      await waitFor(() => p.notifications.length === 1 && p.notifications[0].notification_id === 'ni');
      const feed = p.alertFeed;
      ok('feed carries both the notification and the flight alert',
        feed.some(a => a.source === 'notification') && feed.some(a => a.source === 'flight'),
        feed.map(a => a.source).join(','));
      eq('flight warning outranks the info notification',
        feed.findIndex(a => a.source === 'flight') < feed.findIndex(a => a.id === 'notif:ni'), true);
      // Disabling the whole Alert Center hides flight alerts too.
      p.store.alerts = { enabled: false };
      eq('disabled alert center empties the feed', p.alertFeed.length, 0);
      p.store.alerts = {};

      // Feature disabled → the compute is inert (no new alerts, existing pruned out).
      reset();
      p.store.flights = { enabled: false, source: 'cloud', alerts: { lowAltFt: 2500 } };
      p.flightsNow = [ac('a1b2c3', 'UAL123', 1500, 2)];
      p._computeFlightAlerts();
      eq('flights disabled → no alerts computed', p.flightAlerts.length, 0);

      // ── 10. Label field config round-trip (setFlights sanitizer) ───────────
      section('labelFields / beacons / privacyDim config');
      p.setFlights(f => { f.enabled = false; f.labelFields = ['reg', 'ALT', 'bogus', 'reg']; });
      ok('labelFields sanitized (known keys, lowercased, de-duped)',
        JSON.stringify(p.store.flights.labelFields) === JSON.stringify(['reg', 'alt']),
        JSON.stringify(p.store.flights.labelFields));
      p.setFlights(f => { f.labelFields = ['nope', '']; });
      eq('an all-unknown list clears to undefined', p.store.flights.labelFields, undefined);
      p.setFlights(f => { f.labelFields = ['dist', 'callsign']; });
      ok('user ORDER is preserved by the sanitizer',
        JSON.stringify(p.store.flights.labelFields) === JSON.stringify(['dist', 'callsign']),
        JSON.stringify(p.store.flights.labelFields));
      p.setFlights(f => { f.beacons = false; f.privacyDim = false; });
      eq('beacons round-trips', p.store.flights.beacons, false);
      eq('privacyDim round-trips', p.store.flights.privacyDim, false);
      p.setFlights(f => { f.beacons = true; f.privacyDim = true; f.labelFields = undefined; });
      eq('beacons back on', p.store.flights.beacons, true);
      eq('labelFields cleared', p.store.flights.labelFields, undefined);
      // Tow banners (wave 3): opt-OUT, so absent must read as ON everywhere.
      eq('banners absent by default', p.store.flights.banners, undefined);
      p.setFlights(f => { f.banners = false; });
      eq('banners:false round-trips', p.store.flights.banners, false);
      p.setFlights(f => { f.banners = true; });
      eq('banners:true round-trips', p.store.flights.banners, true);
      p.setFlights(f => { f.banners = undefined; });
      eq('banners clears back to the default', p.store.flights.banners, undefined);

      // Model-size preference (0.5..4, default 1). Clamped in setFlights — not
      // only in the settings UI — so an import can never hand the renderer a
      // NaN or a 1000× plate; exactly-1 normalizes back to "absent".
      eq('modelScale absent by default', p.store.flights.modelScale, undefined);
      p.setFlights(f => { f.modelScale = 2.5; });
      eq('modelScale round-trips', p.store.flights.modelScale, 2.5);
      p.setFlights(f => { f.modelScale = 99; });
      eq('modelScale clamps above 4', p.store.flights.modelScale, 4);
      p.setFlights(f => { f.modelScale = 0.01; });
      eq('modelScale clamps below 0.5', p.store.flights.modelScale, 0.5);
      p.setFlights(f => { f.modelScale = NaN; });
      eq('modelScale NaN → default (undefined)', p.store.flights.modelScale, undefined);
      p.setFlights(f => { f.modelScale = -3; });
      eq('modelScale negative → default (undefined)', p.store.flights.modelScale, undefined);
      p.setFlights(f => { f.modelScale = 1; });
      eq('modelScale exactly 1 normalizes to absent', p.store.flights.modelScale, undefined);

      // ── 10b. flightByHex (what the detail card reads) ──────────────────────
      section('flightByHex lookup');
      p.flightsNow = [ac('a0b1c2', 'UAL9', 9000, 3), ac('d3e4f5', 'DAL1', 30000, 12)];
      eq('flightByHex finds an aircraft', p.flightByHex('d3e4f5')?.callsign, 'DAL1');
      eq('flightByHex is case-insensitive', p.flightByHex('D3E4F5')?.callsign, 'DAL1');
      eq('flightByHex misses cleanly', p.flightByHex('zzzzzz'), null);
      eq('flightByHex tolerates null', p.flightByHex(null), null);
      p.flightsNow = null;
      eq('flightByHex with no feed at all', p.flightByHex('a0b1c2'), null);
      p.flightsNow = [];

      // ── 11. 2D drawing (canvas-render) ────────────────────────────────────
      section('2D beacons / privacy dim / label fields');
      const CR = await import('./canvas-render.mod.js' + V);

      // Pure helpers first — these MIRROR three-renderer's private versions, so
      // the 2D and 3D readouts can never drift apart silently.
      const fpOf = o => ({
        hex: 'abc123', callsign: null, lat: 40, lon: -75, altFt: 10000, gsKt: null,
        trackDeg: null, vertRateFpm: null, category: 'A3', seenPosS: 0, military: false,
        reg: null, typeCode: null, typeDesc: null, operator: null, emergency: null,
        squawk: null, interesting: false, pia: false, ladd: false, ...o,
      });
      eq('2D beacon: emergency enum → red',
        CR.flightBeaconColor(fpOf({ emergency: 'general' }), true), CR.FLIGHT_BEACON_COLORS.emergency);
      eq('2D beacon: squawk 7700 → red',
        CR.flightBeaconColor(fpOf({ squawk: '7700' }), true), CR.FLIGHT_BEACON_COLORS.emergency);
      eq('2D beacon: interesting → yellow',
        CR.flightBeaconColor(fpOf({ interesting: true }), true), CR.FLIGHT_BEACON_COLORS.interesting);
      eq('2D beacon: military → green',
        CR.flightBeaconColor(fpOf({ military: true }), true), CR.FLIGHT_BEACON_COLORS.military);
      eq('2D beacon: LADD → white',
        CR.flightBeaconColor(fpOf({ ladd: true }), true), CR.FLIGHT_BEACON_COLORS.ladd);
      eq('2D beacon: unflagged → none', CR.flightBeaconColor(fpOf({}), true), null);
      eq('2D beacon: PIA alone does not beacon', CR.flightBeaconColor(fpOf({ pia: true }), true), null);
      eq('2D beacon: emergency outranks everything', CR.flightBeaconColor(
        fpOf({ emergency: 'downed', interesting: true, military: true, ladd: true }), true),
        CR.FLIGHT_BEACON_COLORS.emergency);
      eq('2D beacon: interesting outranks military',
        CR.flightBeaconColor(fpOf({ interesting: true, military: true }), true),
        CR.FLIGHT_BEACON_COLORS.interesting);
      eq('2D beacon: gate off → null',
        CR.flightBeaconColor(fpOf({ military: true }), false), null);

      const LFP = fpOf({ callsign: 'AAL266', reg: 'N454AL', typeCode: 'B38M',
        operator: 'AMERICAN AIRLINES INC', altFt: 12340, gsKt: 322,
        vertRateFpm: 1800, squawk: '1200', distNm: 13.7 });
      const lines = (fields, fp = LFP, dim = true) => CR.flightLabelLines(fp, fields, dim);
      eq('2D label default fields', JSON.stringify(lines(['callsign', 'alt'])),
        JSON.stringify({ top: 'AAL266', sub: '12,300 ft' }));
      eq('2D label reg/type/speed', JSON.stringify(lines(['reg', 'type', 'speed'])),
        JSON.stringify({ top: 'N454AL', sub: 'B38M · 320 kt' }));
      eq('2D label trend + distance', JSON.stringify(lines(['trend', 'dist'])),
        JSON.stringify({ top: '↑ climb', sub: '13.5 nm' }));
      eq('2D label level flight drops the trend',
        lines(['callsign', 'trend'], fpOf({ callsign: 'X1', vertRateFpm: 0 })).sub, '');
      eq('2D label PIA suppression shows the hex only',
        lines(['callsign', 'reg', 'operator'],
              fpOf({ callsign: 'SECRET1', reg: 'N1PIA', operator: 'ACME', pia: true })).top,
        '🔒 ABC123');
      eq('2D label LADD keeps its identity (badged)',
        lines(['callsign'], fpOf({ callsign: 'N66168', ladd: true })).top, '🔒 N66168');
      eq('2D label privacyDim off → no badge, full identity',
        CR.flightLabelLines(fpOf({ callsign: 'SECRET1', pia: true }), ['callsign'], false).top,
        'SECRET1');
      eq('2D and 3D field text agree on bucketing',
        CR.flightFieldText('alt', LFP, 'x', false) + '/' + CR.flightFieldText('speed', LFP, 'x', false),
        '12,300 ft/320 kt');

      // Integration: drive the REAL drawAll over a recording 2D context and
      // watch what the flight layer actually emits.
      // `strokePairs` records the alpha IN FORCE at each stroke — the ring's own
      // opacity, which `alphas` (every globalAlpha assignment, glyph + label
      // included) cannot isolate.
      const rec = { texts: [], strokes: [], alphas: [], strokePairs: [] };
      const cv = document.createElement('canvas');
      cv.width = 900; cv.height = 600;
      const raw = cv.getContext('2d');
      const ctx = new Proxy(raw, {
        get(t, k) {
          const v = t[k];
          if (typeof v === 'function') {
            return (...a) => {
              if (k === 'fillText') rec.texts.push(String(a[0]));
              if (k === 'stroke') {
                rec.strokes.push(String(t.strokeStyle));
                rec.strokePairs.push({ style: String(t.strokeStyle), alpha: t.globalAlpha });
              }
              return v.apply(t, a);
            };
          }
          return v;
        },
        set(t, k, v) {
          if (k === 'globalAlpha') rec.alphas.push(v);
          t[k] = v; return true;
        },
      });
      const clearRec = () => {
        rec.texts.length = 0; rec.strokes.length = 0; rec.alphas.length = 0;
        rec.strokePairs.length = 0;
      };
      const view = { ox: 450, oy: 300, scale: 0.02 };
      const draw2d = () => { clearRec(); CR.drawAll(ctx, p, view, cv); };

      p.store.flights = { enabled: true, source: 'cloud', iss: false };
      p.flightsNow = [fpOf({ hex: 'mil001', callsign: 'RCH123', reg: 'N1MIL',
        military: true, lat: 40.05, lon: -75.05, distNm: 4 })];
      let drew = null;
      try { draw2d(); } catch (e) { drew = e; }
      ok('drawAll with aircraft does not throw', drew === null, drew && drew.message);
      ok('military aircraft draws its green beacon ring',
        rec.strokes.includes(CR.FLIGHT_BEACON_COLORS.military), rec.strokes.slice(-6).join(','));
      ok('default plate draws callsign + altitude',
        rec.texts.includes('RCH123') && rec.texts.some(t => /10,000 ft/.test(t)),
        rec.texts.slice(-4).join('|'));

      p.store.flights = { enabled: true, source: 'cloud', iss: false, beacons: false };
      draw2d();
      ok('beacons:false draws no beacon ring',
        !rec.strokes.includes(CR.FLIGHT_BEACON_COLORS.military));

      p.store.flights = { enabled: true, source: 'cloud', iss: false, labelFields: ['reg', 'type'] };
      p.flightsNow = [fpOf({ hex: 'lf0001', callsign: 'AAL266', reg: 'N454AL',
        typeCode: 'B38M', lat: 40.05, lon: -75.05 })];
      draw2d();
      ok('labelFields drives the 2D text',
        rec.texts.includes('N454AL') && rec.texts.includes('B38M')
        && !rec.texts.includes('AAL266'), rec.texts.slice(-4).join('|'));

      p.store.flights = { enabled: true, source: 'cloud', iss: false };
      p.flightsNow = [fpOf({ hex: 'pia001', callsign: 'SECRET1', reg: 'N1PIA',
        pia: true, lat: 40.05, lon: -75.05 })];
      draw2d();
      ok('PIA aircraft is drawn dimmed', rec.alphas.includes(0.45), rec.alphas.join(','));
      ok('PIA identity is suppressed in 2D',
        !rec.texts.includes('SECRET1') && !rec.texts.includes('N1PIA')
        && rec.texts.some(t => t.includes('PIA001')), rec.texts.slice(-4).join('|'));

      p.store.flights = { enabled: true, source: 'cloud', iss: false, privacyDim: false };
      draw2d();
      ok('privacyDim:false draws the PIA aircraft at full alpha + identity',
        !rec.alphas.includes(0.45) && rec.texts.includes('SECRET1'),
        rec.texts.slice(-4).join('|'));

      p.store.flights = { enabled: true, source: 'cloud', iss: false };
      p.flightsNow = [fpOf({ hex: 'ldd001', callsign: 'N66168', ladd: true,
        lat: 40.05, lon: -75.05 })];
      draw2d();
      ok('LADD aircraft is dimmed but STILL beacons white',
        rec.alphas.includes(0.45) && rec.strokes.includes(CR.FLIGHT_BEACON_COLORS.ladd));
      p.flightsNow = [];

      // ── 11a-2. 2D glow rules (docs/research/flight-glow-rules.md §5) ───────
      // The 2D ring reads the SAME pure resolver + envelope the 3D rigs do, so
      // a rule can never colour one view and not the other. `performance.now`
      // is the 2D phase source (no per-aircraft state there), so it is stubbed
      // to sample specific phases deterministically.
      section('2D glow rules');
      const FLM = await import('./flights.mod.js' + V);
      const realPerfNow = performance.now.bind(performance);
      let PNOW = 0;
      performance.now = () => PNOW;
      try {
        const RULED = fpOf({ hex: 'gl0001', callsign: 'SWA1', operator: 'Southwest Airlines Co.',
          military: true, lat: 40.05, lon: -75.05, distNm: 4 });
        const rule = o => ({ id: o.id ?? 'g', criteria: {}, pattern: 'flash', colorA: '#ffd400', ...o });
        const withRules = (rules, extra = {}) => {
          p.store.flights = { enabled: true, source: 'cloud', iss: false, glowRules: rules, ...extra };
        };

        // The exported helper takes the rule list as an optional third arg.
        eq('2D flightBeaconColor honours a matching rule',
          CR.flightBeaconColor(RULED, true,
            [rule({ pattern: 'solid', colorA: '#ff0000', criteria: { operator: 'Southwest' } })]),
          '#ff0000');
        eq('2D flightBeaconColor falls through when nothing matches',
          CR.flightBeaconColor(RULED, true,
            [rule({ pattern: 'solid', colorA: '#ff0000', criteria: { operator: 'Delta' } })]),
          CR.FLIGHT_BEACON_COLORS.military);
        eq('2D flightBeaconColor with no rules is exactly the old ladder',
          CR.flightBeaconColor(RULED, true), CR.FLIGHT_BEACON_COLORS.military);

        // A matched rule REPLACES the default ring colour in a real draw.
        p.flightsNow = [RULED];
        withRules([rule({ pattern: 'solid', colorA: '#ff0000', criteria: { operator: 'Southwest' } })]);
        PNOW = 0; draw2d();
        ok('a matching rule recolours the 2D ring',
          rec.strokes.includes('#ff0000')
          && !rec.strokes.includes(CR.FLIGHT_BEACON_COLORS.military), rec.strokes.join(','));
        ok('a steady pattern draws the ring at a constant 0.6 alpha',
          rec.alphas.includes(0.6), rec.alphas.join(','));

        // solid + a second colour = two rings (the 2D "bead core + halo").
        withRules([rule({ pattern: 'solid', colorA: '#ff0000', colorB: '#0000ff',
                          criteria: { operator: 'Southwest' } })]);
        draw2d();
        ok('solid with a second colour draws BOTH rings',
          rec.strokes.includes('#ff0000') && rec.strokes.includes('#0000ff'),
          rec.strokes.join(','));
        ok('the outer halo ring is drawn dimmer', rec.alphas.includes(0.35));

        // alternate — a hard colour swap on the wall clock, no lerp.
        withRules([rule({ pattern: 'alternate', colorA: '#ff0000', colorB: '#0000ff',
                          criteria: { operator: 'Southwest' } })]);
        PNOW = 100; draw2d();
        const altEarly = rec.strokes.includes('#ff0000') && !rec.strokes.includes('#0000ff');
        PNOW = 900; draw2d();
        const altLate = rec.strokes.includes('#0000ff') && !rec.strokes.includes('#ff0000');
        PNOW = 1700; draw2d();
        const altBack = rec.strokes.includes('#ff0000');
        ok('alternate hard-swaps the 2D ring colour every 0.8 s',
          altEarly && altLate && altBack, `${altEarly}/${altLate}/${altBack}`);

        // rotate — a genuine crossfade: the mid-phase stroke is NEITHER colour.
        withRules([rule({ pattern: 'rotate', colorA: '#000000', colorB: '#ffffff',
                          criteria: { operator: 'Southwest' } })]);
        PNOW = (1000 / 0.9) / 4; draw2d();
        const mid = rec.strokes[rec.strokes.length - 1];
        ok('rotate crossfades the 2D ring colour through the pair',
          /^#[0-9a-f]{6}$/.test(mid) && mid !== '#000000' && mid !== '#ffffff', mid);
        // …and its alpha never drops below the documented 0.35 floor.
        let rotMin = 1;
        for (let ms = 0; ms < 3000; ms += 20) {
          PNOW = ms; draw2d();
          for (const a of rec.alphas) if (a < rotMin && a > 0) rotMin = a;
        }
        ok('the rotate ring never dips below its 0.35 floor', rotMin > 0.34, `min=${rotMin}`);

        // The 2D alpha IS flightGlowFrame's alpha — one formula, two views.
        withRules([rule({ pattern: 'fade', colorA: '#123456',
                          criteria: { operator: 'Southwest' } })]);
        PNOW = 1250; draw2d();
        const wantFade = FLM.flightGlowFrame('fade', 1.25).alpha;
        ok('the 2D ring alpha comes from the shared flightGlowFrame',
          rec.alphas.some(a => Math.abs(a - wantFade) < 1e-9),
          `want ${wantFade} got ${rec.alphas.join(',')}`);

        // strobe — two pops per second, the twin-pop envelope on the ring alpha.
        withRules([rule({ pattern: 'strobe', colorA: '#ff0000', colorB: '#00ff00',
                          criteria: { operator: 'Southwest' } })]);
        let popFrames = 0, dimFrames = 0;
        for (let ms = 0; ms < 1000; ms += 5) {
          PNOW = ms; draw2d();
          const ring = rec.strokePairs.filter(s2 => s2.style === '#ff0000' || s2.style === '#00ff00');
          if (ring.some(s2 => s2.alpha > 0.9)) popFrames++;
          if (ring.length && ring.every(s2 => s2.alpha < 0.2)) dimFrames++;
        }
        ok('the strobe ring is bright only during its two narrow pops',
          popFrames >= 6 && popFrames <= 30, `bright frames=${popFrames}/200`);
        ok('the strobe ring is dark for most of the cycle',
          dimFrames > 140, `dark frames=${dimFrames}/200`);
        PNOW = 0; draw2d();
        const s0 = rec.strokes[rec.strokes.length - 1];
        PNOW = 120; draw2d();
        const s1 = rec.strokes[rec.strokes.length - 1];
        ok('the strobe ring uses colour A on pop 1 and colour B on pop 2',
          s0 === '#ff0000' && s1 === '#00ff00', `${s0} / ${s1}`);

        // 'none' silences the ring; the aircraft itself still draws.
        withRules([rule({ pattern: 'none', criteria: { military: true } })]);
        PNOW = 0; draw2d();
        ok("a 'none' rule draws no 2D ring at all",
          !rec.strokes.includes(CR.FLIGHT_BEACON_COLORS.military)
          && rec.texts.includes('SWA1'), rec.strokes.join(','));

        // Emergency ignores a matching rule in 2D too.
        p.flightsNow = [fpOf({ hex: 'gl0002', callsign: 'EMG1', military: true,
          squawk: '7700', lat: 40.05, lon: -75.05, distNm: 4 })];
        withRules([rule({ pattern: 'solid', colorA: '#00ff00', criteria: { military: true } })]);
        draw2d();
        ok('an emergency aircraft keeps the red 2D ring through a matching rule',
          rec.strokes.includes(CR.FLIGHT_BEACON_COLORS.emergency)
          && !rec.strokes.includes('#00ff00'), rec.strokes.join(','));

        // The master gate still wins over the rules.
        withRules([rule({ pattern: 'solid', colorA: '#00ff00' })], { beacons: false });
        draw2d();
        ok('beacons:false silences user-ruled 2D rings too',
          !rec.strokes.includes('#00ff00'));

        // A garbage rule list must never break the RAF path.
        p.flightsNow = [RULED];
        withRules([{ id: 'x', pattern: 'sparkle', colorA: '#00ff00', criteria: {} }]);
        let threw2d = null;
        try { draw2d(); } catch (e) { threw2d = e; }
        ok('an unusable rule list never throws in the 2D draw path', threw2d === null,
          threw2d && threw2d.message);
      } finally {
        performance.now = realPerfNow;
      }
      p.store.flights = { enabled: true, source: 'cloud', iss: false };
      p.flightsNow = [];

      // ── 11b. 2D pick: hitFlight + click routing ────────────────────────────
      // hitFlight reads the positions drawAll published LAST FRAME (world anchor
      // + screen-px radius), so every case here draws first, then picks.
      section('2D flight pick + click routing');
      p.store.flights = { enabled: true, source: 'cloud', iss: false };
      const PICKED = fpOf({ hex: 'pik001', callsign: 'SWA55', lat: 40.05, lon: -75.05 });
      p.flightsNow = [PICKED];
      draw2d();
      const pickT = CR.flightHitPx.get('pik001');
      ok('drawAll publishes a pick target per aircraft', !!pickT
         && isFinite(pickT.x) && isFinite(pickT.y) && pickT.rPx > 0,
         JSON.stringify(pickT));
      eq('a click on the dart resolves the aircraft',
         CR.hitFlight(p, view, { x: pickT.x, y: pickT.y }), 'pik001');
      eq('a click just off the dart still resolves (touch margin)',
         CR.hitFlight(p, view, { x: pickT.x + 300, y: pickT.y }), 'pik001');
      eq('a click far away resolves nothing',
         CR.hitFlight(p, view, { x: pickT.x + 90000, y: pickT.y }), null);
      // Nearest dart wins when two overlap in the pick radius.
      p.flightsNow = [PICKED, fpOf({ hex: 'pik002', callsign: 'AAL2',
        lat: 40.0505, lon: -75.0505 })];
      draw2d();
      const pickT2 = CR.flightHitPx.get('pik002');
      eq('the NEAREST dart wins an overlap',
         CR.hitFlight(p, view, { x: pickT2.x, y: pickT2.y }), 'pik002');
      p.flightsNow = [PICKED];
      // Hiding the layer empties the map — a hidden aircraft is untappable.
      p.store.layers2d = { flights: false };
      draw2d();
      eq('a hidden Flights layer clears the pick map', CR.flightHitPx.size, 0);
      eq('…so nothing is pickable', CR.hitFlight(p, view, { x: pickT.x, y: pickT.y }), null);
      p.store.layers2d = {};
      draw2d();
      eq('showing the layer again restores the pick',
         CR.hitFlight(p, view, { x: pickT.x, y: pickT.y }), 'pik001');
      // Feature disabled → no pick even with a stale map.
      p.store.flights = { enabled: false, source: 'cloud' };
      eq('flights disabled → no pick',
         CR.hitFlight(p, view, { x: pickT.x, y: pickT.y }), null);
      p.store.flights = { enabled: true, source: 'cloud', iss: false };
      draw2d();

      // Click routing through the REAL onCanvasClick. The stub rect makes
      // pxToMm's client→world mapping exact (dpr 1 in the headless harness).
      const clickCanvas = document.createElement('canvas');
      clickCanvas.getBoundingClientRect = () => ({ left: 0, top: 0, width: 900, height: 600 });
      const opened = [];
      clickCanvas.addEventListener('open-flight-info', e => opened.push(e.detail.hex));
      const dpr1 = window.devicePixelRatio || 1;
      const clickAt = (mm) => {
        opened.length = 0;
        p.dragJustEnded = false;
        CR.onCanvasClick(p, clickCanvas, view, {
          clientX: (mm.x * view.scale + view.ox) / dpr1,
          clientY: (view.oy - mm.y * view.scale) / dpr1,
        });
        return opened.slice();
      };
      p.uiMode = 'edit'; p.tool = 'select';
      eq('edit + select: clicking a dart opens the card',
         clickAt(pickT).join(), 'pik001');
      eq('edit: clicking empty sky opens nothing',
         clickAt({ x: pickT.x + 90000, y: pickT.y }).length, 0);
      p.uiMode = 'kiosk';
      eq('kiosk: clicking a dart opens the card', clickAt(pickT).join(), 'pik001');
      p.uiMode = 'view';
      eq('view mode refuses (no interaction at all)', clickAt(pickT).length, 0);
      p.uiMode = 'edit';
      // A non-select tool is placing something — the dart must not steal it.
      p.tool = 'motion';
      eq('a placement tool is not hijacked by a dart', clickAt(pickT).length, 0);
      p.tool = 'select';
      p.flightsNow = [];
      p.store.layers2d = {};

      // ── 12. Settings ▸ Integrations — the flights block ────────────────────
      section('Settings drawer (flights block)');
      const UI = await import('./flightsui.mod.js' + V);
      const p2 = new UI.Planner();
      p2.connectWith(new FakeHa());
      await sleep(20);
      p2.store.flights = { enabled: true, source: 'cloud' };
      const drawer = document.createElement('diorama-settings-drawer');
      drawer.planner = p2;
      document.getElementById('mount').appendChild(drawer);
      drawer.show('integrations');
      await drawer.updateComplete;
      // EXACT label text — "Callsign" (a label field) and "Callsign labels"
      // (the master toggle) both exist, and a startsWith match would confuse them.
      const cbFor = text => {
        const l = [...drawer.querySelectorAll('label')]
          .find(el => el.textContent.replace(/\s+/g, ' ').trim() === text);
        return l ? l.querySelector('input[type=checkbox]') : null;
      };
      const flip = async (el, v) => {
        el.checked = v; el.dispatchEvent(new Event('change'));
        await drawer.updateComplete; await sleep(4);
      };
      const beaconsCb = cbFor('Status beacons');
      const privacyCb = cbFor('Dim privacy-flagged aircraft');
      ok('“Status beacons” checkbox rendered', !!beaconsCb);
      ok('“Dim privacy-flagged aircraft” checkbox rendered', !!privacyCb);
      eq('beacons checkbox defaults ON', beaconsCb && beaconsCb.checked, true);
      eq('privacy checkbox defaults ON', privacyCb && privacyCb.checked, true);
      await flip(beaconsCb, false);
      eq('unchecking beacons writes the store', p2.store.flights.beacons, false);
      await flip(cbFor('Dim privacy-flagged aircraft'), false);
      eq('unchecking privacy dim writes the store', p2.store.flights.privacyDim, false);
      await flip(cbFor('Status beacons'), true);
      eq('re-checking beacons writes the store', p2.store.flights.beacons, true);

      // Tow banners (wave 3) — an opt-OUT nested under the labels master.
      const bannersCb = cbFor('Tow banners (small planes)');
      ok('“Tow banners (small planes)” checkbox rendered', !!bannersCb);
      eq('banners checkbox defaults ON', bannersCb && bannersCb.checked, true);
      await flip(bannersCb, false);
      eq('unchecking banners writes the store', p2.store.flights.banners, false);
      eq('…and the checkbox reflects it', cbFor('Tow banners (small planes)').checked, false);
      await flip(cbFor('Tow banners (small planes)'), true);
      eq('re-checking banners writes the store', p2.store.flights.banners, true);

      const FIELD_LABELS = ['Callsign', 'Registration', 'Type', 'Operator', 'Altitude',
                            'Speed', 'Climb/descend', 'Squawk', 'Distance'];
      const fieldCbs = FIELD_LABELS.map(t => cbFor(t));
      eq('all 9 label-field checkboxes rendered', fieldCbs.filter(Boolean).length, 9);
      eq('Callsign checked by default', fieldCbs[0].checked, true);
      eq('Altitude checked by default', fieldCbs[4].checked, true);
      eq('Registration unchecked by default', fieldCbs[1].checked, false);
      await flip(cbFor('Registration'), true);
      ok('checking a field writes canonical-order labelFields',
        JSON.stringify(p2.store.flights.labelFields) === JSON.stringify(['callsign', 'reg', 'alt']),
        JSON.stringify(p2.store.flights.labelFields));
      await flip(cbFor('Callsign'), false);
      await flip(cbFor('Altitude'), false);
      ok('unchecking leaves only the remaining field',
        JSON.stringify(p2.store.flights.labelFields) === JSON.stringify(['reg']),
        JSON.stringify(p2.store.flights.labelFields));
      await flip(cbFor('Registration'), false);
      eq('an empty selection clears back to the default plate',
        p2.store.flights.labelFields, undefined);
      // The field grid is only offered while labels are on at all.
      await flip(cbFor('Callsign labels'), false);
      eq('labels off hides the label-field grid', cbFor('Registration'), null);
      await flip(cbFor('Callsign labels'), true);
      ok('labels back on restores the grid', !!cbFor('Registration'));
      ok('labels back on restores the banner toggle', !!cbFor('Tow banners (small planes)'));

      // Model size × — a plain number input beside the ISS toggle.
      const numFor = text => {
        const l = [...drawer.querySelectorAll('label')]
          .find(el => el.textContent.replace(/\s+/g, ' ').trim() === text);
        return l ? l.parentElement.querySelector('input[type=number]') : null;
      };
      const typeIn = async (el, v) => {
        el.value = String(v); el.dispatchEvent(new Event('change'));
        await drawer.updateComplete; await sleep(4);
      };
      const msIn = numFor('Model size ×');
      ok('“Model size ×” input rendered', !!msIn);
      eq('model-size input shows the default 1', msIn && msIn.value, '1');
      await typeIn(msIn, 2.5);
      eq('typing a model size writes the store', p2.store.flights.modelScale, 2.5);
      eq('…and the input reflects it', numFor('Model size ×').value, '2.5');
      await typeIn(numFor('Model size ×'), 50);
      eq('an out-of-range model size is clamped by setFlights', p2.store.flights.modelScale, 4);
      await typeIn(numFor('Model size ×'), 1);
      eq('back to 1 clears the field', p2.store.flights.modelScale, undefined);

      // Draw radius (m) — the user-definable display shell rim, beside Radius (nm).
      const drIn = numFor('Draw radius (m)');
      ok('“Draw radius (m)” input rendered', !!drIn);
      eq('draw-radius input shows the 300 m default', drIn && drIn.value, '300');
      await typeIn(drIn, 500);
      eq('typing a draw radius writes the store', p2.store.flights.shellRadiusM, 500);
      eq('…and the input reflects it', numFor('Draw radius (m)').value, '500');
      await typeIn(numFor('Draw radius (m)'), 5000);
      eq('an out-of-range draw radius is clamped to 1000',
        p2.store.flights.shellRadiusM, 1000);
      await typeIn(numFor('Draw radius (m)'), 10);
      eq('…and a too-small one to 60', p2.store.flights.shellRadiusM, 60);
      await typeIn(numFor('Draw radius (m)'), 300);
      eq('back to the default clears the field', p2.store.flights.shellRadiusM, undefined);
      eq('…and the input falls back to the default', numFor('Draw radius (m)').value, '300');
      // Editing the draw radius must not disturb its neighbours.
      await typeIn(numFor('Draw radius (m)'), 450);
      eq('editing the draw radius leaves Radius (nm) alone',
        numFor('Radius (nm)').value, String(p2.store.flights.radiusNm ?? 15));
      eq('…and leaves modelScale alone', p2.store.flights.modelScale, undefined);
      await typeIn(numFor('Draw radius (m)'), 300);

      // ── 12a. Glow rules editor (flight-glow-rules.md §6.4) ─────────────────
      // Collapsed summary rows + an ✎-expanded criteria form, every write going
      // through setFlights (which sanitizes) — so the editor can never author a
      // shape the matcher would reject.
      section('Settings drawer (glow rules editor)');
      const glowRows = () => [...drawer.querySelectorAll('[data-glow-rule]')];
      const addBtn = () => drawer.querySelector('[data-glow-add]');
      const fieldIn = (id, name) => drawer.querySelector(
        `[data-glow-rule="${id}"] [data-glow-field="${name}"]`);
      const rowBtn = (id, title) => [...drawer.querySelectorAll(`[data-glow-rule="${id}"] button`)]
        .find(b => b.title === title);
      const setField = async (id, name, v) => {
        const el = fieldIn(id, name);
        if (el.type === 'checkbox') el.checked = v; else el.value = String(v);
        el.dispatchEvent(new Event('change'));
        await drawer.updateComplete; await sleep(4);
      };
      const click = async el => { el.click(); await drawer.updateComplete; await sleep(4); };

      ok('“+ Add rule” button rendered', !!addBtn());
      eq('no rules by default', glowRows().length, 0);
      await click(addBtn());
      eq('adding a rule writes one entry to the store', p2.store.flights.glowRules?.length, 1);
      const rid = p2.store.flights.glowRules[0].id;
      eq('a new rule defaults to a visible pattern', p2.store.flights.glowRules[0].pattern, 'flash');
      ok('a new rule survives the sanitizer (it ships with a colour)',
        /^#[0-9a-f]{6}$/.test(p2.store.flights.glowRules[0].colorA ?? ''),
        p2.store.flights.glowRules[0].colorA);
      eq('a new rule starts enabled', p2.store.flights.glowRules[0].enabled, true);
      eq('a new rule matches everything until narrowed',
        JSON.stringify(Object.values(p2.store.flights.glowRules[0].criteria)
          .filter(v => v !== undefined)), '[]');
      eq('the new rule renders a row', glowRows().length, 1);
      ok('a new rule opens EXPANDED for editing', !!fieldIn(rid, 'operator'));
      ok('an unnamed rule summarizes as the catch-all',
        glowRows()[0].textContent.includes('any aircraft'), glowRows()[0].textContent.slice(0, 60));

      await setField(rid, 'label', '  Southwest 737s  ');
      eq('the name input writes a trimmed label', p2.store.flights.glowRules[0].label, 'Southwest 737s');
      await setField(rid, 'operator', 'Southwest');
      eq('a wildcard criterion writes the store',
        p2.store.flights.glowRules[0].criteria.operator, 'Southwest');
      await setField(rid, 'typeCode', 'b73?');
      eq('setFlights uppercases the uppercase-in-the-data criteria',
        p2.store.flights.glowRules[0].criteria.typeCode, 'B73?');
      await setField(rid, 'minAltFt', 5000);
      await setField(rid, 'maxAltFt', 30000);
      eq('a numeric range writes both bounds',
        `${p2.store.flights.glowRules[0].criteria.minAltFt}-${p2.store.flights.glowRules[0].criteria.maxAltFt}`,
        '5000-30000');
      await setField(rid, 'minAltFt', '');
      eq('blanking a bound clears it (never 0)',
        p2.store.flights.glowRules[0].criteria.minAltFt, undefined);
      await setField(rid, 'operator', '   ');
      eq('blanking a text criterion clears it — never an accidental match-all',
        p2.store.flights.glowRules[0].criteria.operator, undefined);
      await setField(rid, 'operator', 'Southwest');
      await setField(rid, 'military', 'yes');
      eq('a tri-state select writes true', p2.store.flights.glowRules[0].criteria.military, true);
      await setField(rid, 'military', 'no');
      eq('a tri-state select writes false', p2.store.flights.glowRules[0].criteria.military, false);
      await setField(rid, 'military', '');
      eq('“Any” clears the tri-state', p2.store.flights.glowRules[0].criteria.military, undefined);

      await setField(rid, 'pattern', 'strobe');
      eq('the pattern dropdown writes the store', p2.store.flights.glowRules[0].pattern, 'strobe');
      eq('the pattern dropdown offers all 7 patterns',
        fieldIn(rid, 'pattern').querySelectorAll('option').length, 7);
      await setField(rid, 'colorA', '#ff0000');
      await setField(rid, 'colorB', '#00ff00');
      eq('both colour pickers write the store',
        `${p2.store.flights.glowRules[0].colorA}/${p2.store.flights.glowRules[0].colorB}`,
        '#ff0000/#00ff00');
      await click(rowBtn(rid, 'Clear the second colour'));
      eq('the ✕ clears colour B only',
        p2.store.flights.glowRules[0].colorB === undefined
          && p2.store.flights.glowRules[0].colorA === '#ff0000', true);
      await setField(rid, 'pattern', 'none');
      ok('choosing “no glow” hides the colour row', !fieldIn(rid, 'colorA'));
      await setField(rid, 'pattern', 'flash');
      ok('switching back to a visible pattern restores a colour', !!fieldIn(rid, 'colorA'));

      await setField(rid, 'enabled', false);
      eq('the enable checkbox writes false', p2.store.flights.glowRules[0].enabled, false);
      ok('a disabled row is tagged [off]', glowRows()[0].textContent.includes('[off]'));
      await setField(rid, 'enabled', true);
      eq('re-enabling writes true', p2.store.flights.glowRules[0].enabled, true);

      // Collapse / re-expand.
      await click(rowBtn(rid, 'Edit conditions'));
      ok('collapsing hides the criteria form', !fieldIn(rid, 'operator'));
      ok('a named rule shows its NAME in the summary row',
        glowRows()[0].textContent.includes('Southwest 737s'));
      await click(rowBtn(rid, 'Edit conditions'));
      ok('re-expanding restores the form with its values',
        !!fieldIn(rid, 'operator') && fieldIn(rid, 'operator').value === 'Southwest');

      // Reorder — order is first-match-wins, so ▲/▼ change behaviour.
      await click(addBtn());
      const rid2 = p2.store.flights.glowRules[1].id;
      eq('a second rule appends at the END', p2.store.flights.glowRules.length, 2);
      ok('the first row cannot move up', rowBtn(rid, 'Move earlier').disabled === true);
      ok('the last row cannot move down', rowBtn(rid2, 'Move later').disabled === true);
      await click(rowBtn(rid2, 'Move earlier'));
      eq('▲ moves a rule earlier in the list',
        p2.store.flights.glowRules.map(r => r.id).join(','), `${rid2},${rid}`);
      await click(rowBtn(rid2, 'Move later'));
      eq('▼ moves it back',
        p2.store.flights.glowRules.map(r => r.id).join(','), `${rid},${rid2}`);
      eq('reordering preserves the rules themselves',
        p2.store.flights.glowRules[0].label, 'Southwest 737s');

      // Delete.
      await click(rowBtn(rid2, 'Delete rule'));
      eq('✕ deletes just that rule', p2.store.flights.glowRules.map(r => r.id).join(','), rid);
      await click(rowBtn(rid, 'Delete rule'));
      eq('deleting the last rule clears the field entirely',
        p2.store.flights.glowRules, undefined);
      eq('…and the list renders empty', glowRows().length, 0);

      // The cap is surfaced, not just enforced silently.
      p2.setFlights(f => {
        f.glowRules = Array.from({ length: 30 }, (_, i) => ({
          id: `cap${i}`, pattern: 'none', criteria: {} }));
      });
      await drawer.updateComplete; await sleep(4);
      eq('30 rules render', glowRows().length, 30);
      ok('the add button is disabled at the cap', addBtn().disabled === true);
      p2.setFlights(f => { f.glowRules = undefined; });
      await drawer.updateComplete; await sleep(4);
      ok('the add button is live again below the cap', addBtn().disabled === false);
      drawer.remove();

      // ── 12b. Settings ▸ Display — background-text entry rows ───────────────
      // The tow-aircraft picker + the per-entry model-size knob. The bg-text
      // editor lives in the Display tab of the SAME drawer, so this page is
      // where it is covered.
      section('Settings drawer (background text rows)');
      const p3 = new UI.Planner();
      p3.connectWith(new FakeHa());
      await sleep(20);
      p3.store.bgTexts = [{ id: 'bt1', mode: 'banner', text: 'HELLO' }];
      const dw = document.createElement('diorama-settings-drawer');
      dw.planner = p3;
      document.getElementById('mount').appendChild(dw);
      dw.show('display');
      await dw.updateComplete;
      const labelled = (text, sel) => {
        const l = [...dw.querySelectorAll('label')]
          .find(el => el.textContent.replace(/\s+/g, ' ').trim() === text);
        return l ? l.parentElement.querySelector(sel) : null;
      };
      const acSel = labelled('Aircraft', 'select');
      ok('BG banner row offers an “Aircraft” picker', !!acSel);
      eq('the picker defaults to the classic tow plane', acSel && acSel.value, '');
      eq('all 8 archetypes + the classic plane are listed', acSel && acSel.options.length, 9);
      acSel.value = 'widebody'; acSel.dispatchEvent(new Event('change'));
      await dw.updateComplete; await sleep(4);
      eq('picking an archetype writes the entry', p3.store.bgTexts[0].aircraft, 'widebody');
      ok('…and bgTextsResolved passes it through to the renderer',
        p3.bgTextsResolved()[0].aircraft === 'widebody',
        JSON.stringify(p3.bgTextsResolved()[0]));
      labelled('Aircraft', 'select').value = '';
      labelled('Aircraft', 'select').dispatchEvent(new Event('change'));
      await dw.updateComplete; await sleep(4);
      eq('choosing the classic plane clears the field', p3.store.bgTexts[0].aircraft, undefined);

      const szIn = labelled('Model size ×', 'input[type=number]');
      ok('BG entry row offers a “Model size ×” input', !!szIn);
      eq('bg model size defaults to 1', szIn && szIn.value, '1');
      const typeSz = async (v) => {
        const el = labelled('Model size ×', 'input[type=number]');
        el.value = String(v); el.dispatchEvent(new Event('change'));
        await dw.updateComplete; await sleep(4);
      };
      await typeSz(3);
      eq('typing a bg model size writes the entry', p3.store.bgTexts[0].scale, 3);
      ok('…and bgTextsResolved passes the scale through',
        p3.bgTextsResolved()[0].scale === 3, JSON.stringify(p3.bgTextsResolved()[0]));
      await typeSz(99);
      eq('the bg model size clamps at 5', p3.store.bgTexts[0].scale, 5);
      await typeSz(0.01);
      eq('…and at 0.5', p3.store.bgTexts[0].scale, 0.5);
      await typeSz(1);
      eq('back to 1 clears the bg scale field', p3.store.bgTexts[0].scale, undefined);

      // The aircraft picker is banner-ONLY; the size knob is on every mode.
      p3.store.bgTexts = [{ id: 'bt2', mode: 'train', text: 'CHOO' }];
      dw.requestUpdate(); await dw.updateComplete; await sleep(4);
      eq('a train row has no aircraft picker', labelled('Aircraft', 'select'), null);
      ok('a train row still has the model-size knob',
        !!labelled('Model size ×', 'input[type=number]'));
      dw.remove();

      // ── 13. Flight detail card (diorama-flight-modal) ──────────────────────
      section('Flight detail card');
      p2.store.weather = { source: 'openmeteo', lat: 40, lon: -75 };
      p2.store.flights = { enabled: true, source: 'cloud', iss: false };
      const mkFp = o => ({
        hex: 'ab1234', callsign: null, lat: 40, lon: -75, altFt: 10000, gsKt: null,
        trackDeg: null, vertRateFpm: null, category: null, seenPosS: null, military: false,
        reg: null, typeCode: null, typeDesc: null, operator: null, emergency: null,
        squawk: null, interesting: false, pia: false, ladd: false, ...o,
      });
      const card = document.createElement('diorama-flight-modal');
      card.planner = p2;
      document.getElementById('mount').appendChild(card);
      const cardText = async () => { await card.updateComplete; await sleep(4);
                                     return card.textContent.replace(/\s+/g, ' ').trim(); };
      const has = (t, sub) => t.includes(sub);

      const FULL = mkFp({
        hex: 'a1b2c3', callsign: 'AAL266', reg: 'N454AL', typeCode: 'B38M',
        typeDesc: 'BOEING 737 MAX 8', operator: 'AMERICAN AIRLINES INC',
        category: 'A3', altFt: 12340, gsKt: 322, trackDeg: 275, vertRateFpm: 1800,
        squawk: '1200', seenPosS: 3, lat: 40.2, lon: -75.0,
      });
      p2.flightsNow = [FULL];
      card.show('a1b2c3');
      let t = await cardText();
      ok('card renders the callsign as the headline', has(t, 'AAL266'), t.slice(0, 80));
      ok('card shows the ICAO hex', has(t, 'A1B2C3'));
      ok('card shows the registration', has(t, 'N454AL'));
      ok('card shows the operator', has(t, 'AMERICAN AIRLINES INC'));
      ok('card shows the type code + long description',
         has(t, 'B38M') && has(t, 'BOEING 737 MAX 8'));
      ok('card shows the resolved archetype + ADS-B category',
         has(t, 'narrowbody airliner') && has(t, 'category A3'), t.slice(0, 200));
      ok('card shows the REAL altitude in ft', has(t, '12,340 ft'), t.slice(0, 200));
      ok('card shows a climb arrow', has(t, '↑'));
      ok('card shows ground speed in kt', has(t, '322 kt'));
      ok('card shows the vertical rate in fpm', has(t, '+1,800 fpm'));
      ok('card shows the track + compass point', has(t, '275°') && has(t, 'W'));
      ok('card shows the squawk', has(t, '1200'));
      ok('card shows distance + bearing from home',
         /\d+\.\d nm N/.test(t), t.slice(0, 300));
      ok('card shows the fix age', has(t, '3 s ago'));
      ok('card is honest about the compressed shell',
         has(t, 'true in bearing, not to scale'));
      ok('an unflagged aircraft shows no status chips',
         !has(t, 'MILITARY') && !has(t, 'EMERGENCY') && !has(t, 'LADD'));
      // A descending aircraft flips the arrow.
      p2.flightsNow = [{ ...FULL, vertRateFpm: -1400 }];
      p2.dispatchEvent(new CustomEvent('live'));
      t = await cardText();
      ok('the card refreshes on the LIVE channel (descent arrow)',
         has(t, '↓') && has(t, '-1,400 fpm'), t.slice(0, 200));

      // Status flags.
      p2.flightsNow = [{ ...FULL, military: true, interesting: true, ladd: true,
                         emergency: 'lifeguard', squawk: '7700' }];
      p2.dispatchEvent(new CustomEvent('live'));
      t = await cardText();
      ok('card chips EMERGENCY with the reported string',
         has(t, 'EMERGENCY') && has(t, 'LIFEGUARD'), t.slice(0, 220));
      ok('card chips MILITARY', has(t, 'MILITARY'));
      ok('card chips INTERESTING', has(t, 'INTERESTING'));
      ok('card chips LADD', has(t, 'LADD'));
      ok('LADD does NOT anonymize (registration + operator kept)',
         has(t, 'N454AL') && has(t, 'AMERICAN AIRLINES INC'));

      // PIA anonymization.
      const PIAFP = mkFp({ hex: 'ff9911', callsign: 'SECRET1', reg: 'N1PIA',
        typeCode: 'B738', typeDesc: 'BOEING 737-800', operator: 'A VERY PRIVATE LLC',
        category: 'A3', pia: true, altFt: 33000 });
      p2.flightsNow = [PIAFP];
      card.show('ff9911');
      t = await cardText();
      ok('PIA card shows the hex as the identity', has(t, 'FF9911'), t.slice(0, 80));
      ok('PIA card withholds the callsign', !has(t, 'SECRET1'), t.slice(0, 200));
      ok('PIA card withholds the registration', !has(t, 'N1PIA'));
      ok('PIA card withholds the operator', !has(t, 'A VERY PRIVATE LLC'));
      ok('PIA card keeps type + category (not identifying)',
         has(t, 'B738') && has(t, 'category A3'));
      ok('PIA card explains itself', has(t, 'anonymized (PIA)'), t.slice(0, 260));
      ok('PIA card still chips PIA', has(t, 'PIA'));
      // privacyDim off → the courtesy is the user's call.
      p2.store.flights = { enabled: true, source: 'cloud', iss: false, privacyDim: false };
      p2.dispatchEvent(new CustomEvent('live'));
      t = await cardText();
      ok('privacyDim:false shows the PIA identity in full',
         has(t, 'SECRET1') && has(t, 'N1PIA') && !has(t, 'anonymized (PIA)'),
         t.slice(0, 200));
      p2.store.flights = { enabled: true, source: 'cloud', iss: false };

      // Signal lost: the aircraft leaves the feed while the card is open.
      p2.flightsNow = [FULL];
      card.show('a1b2c3');
      await cardText();
      p2.flightsNow = [];
      p2.dispatchEvent(new CustomEvent('live'));
      t = await cardText();
      ok('an aircraft leaving the feed shows "signal lost"',
         has(t, 'Signal lost'), t.slice(0, 160));
      ok('…and keeps the last received data', has(t, 'AAL266') && has(t, '12,340 ft'));
      p2.flightsNow = null;
      p2.dispatchEvent(new CustomEvent('live'));
      t = await cardText();
      ok('a null feed does not crash the open card', has(t, 'AAL266'));

      // Sparse aircraft: nothing invented for missing fields.
      p2.flightsNow = [mkFp({ hex: 'bare01', altFt: 5000 })];
      card.show('bare01');
      t = await cardText();
      ok('a bare aircraft falls back to its hex', has(t, 'BARE01'));
      ok('missing fields are omitted, not blank-labelled',
         !has(t, 'Registration') && !has(t, 'Operator') && !has(t, 'Squawk')
         && !has(t, 'Ground speed'), t.slice(0, 260));
      ok('altitude still renders', has(t, '5,000 ft'));

      // Never opened / closed → renders nothing.
      card.open = false;
      t = await cardText();
      eq('a closed card renders nothing', t, '');
      // Unknown hex with no prior data → nothing (never throws).
      card.show('nosuch');
      t = await cardText();
      eq('an unknown hex renders nothing', t, '');
      card.remove();

    } catch (err) {
      ok('Planner section ran without throwing', false, String((err && err.stack) || err));
    } finally {
      Date.now = realNow;
    }

    // ── Render ────────────────────────────────────────────────────────────────
    const rows = document.getElementById('rows');
    let pass = 0, total = 0;
    for (const r of results) {
      if (r.section) {
        const h = document.createElement('h2'); h.textContent = r.section; rows.appendChild(h); continue;
      }
      total++; if (r.pass) pass++;
      const div = document.createElement('div'); div.className = 'row';
      div.innerHTML = `<span class="name">${r.pass ? '✓' : '✗'} ${r.name}</span>` +
        `<span class="${r.pass ? 'pass' : 'extra'}">${r.pass ? 'PASS' : r.extra}</span>`;
      rows.appendChild(div);
    }
    const s = document.getElementById('summary');
    s.textContent = `FLIGHTSUI ${pass === total ? 'PASS' : 'FAIL'} ${pass}/${total}`;
    s.className = pass === total ? 'okbg' : 'badbg';
    document.title = `FLIGHTSUI ${pass}/${total}`;
  </script>
</body>
</html>
