      await drawer.updateComplete; await sleep(4);
      eq('clearing the field clears the store', p2.store.flights.proxyCommand, undefined);

      // adsb.lol gets its OWN YAML, not OpenSky's.
      await pickSource('adsblol');
      eq('picking adsb.lol writes the store', p2.store.flights.source, 'adsblol');
      ok('the adsb.lol YAML targets the adsb.lol endpoint',
        yamlText().includes('https://api.adsb.lol/v2/lat/'));
      ok('… and templates lat/lon/dist',
        ['{{ lat }}', '{{ lon }}', '{{ dist }}'].every(t => yamlText().includes(t)));
      ok('NEG the adsb.lol YAML never mentions opensky', !yamlText().includes('opensky'));

      // airplanes.live: selectable, but the 403 is stated up front.
      await pickSource('cloud');
      ok('choosing airplanes.live shows the access warning',
        !!drawer.querySelector('[data-flight-cloud-warn]'));
      ok('the warning names the HTTP status',
        drawer.querySelector('[data-flight-cloud-warn]').textContent.includes('403'));
      // The access requirement is FEEDING them data, not emailing them — and
      // anyone who qualifies necessarily owns a receiver, so the warning must
      // send them to the local source rather than leaving that unsaid.
      const cloudWarnText = () => drawer.querySelector('[data-flight-cloud-warn]')
        .textContent.replace(/\s+/g, ' ').trim();
      const cloudHintText = () => drawer.querySelector('[data-flight-source="cloud"]')
        .textContent.replace(/\s+/g, ' ').trim();
      ok('the warning states the feeder requirement',
        /feed them data from your own ADS-B receiver/i.test(cloudWarnText()), cloudWarnText());
      ok('… and the source hint says it too, before you select it',
        /feeding your own receiver.s ADS-B data/i.test(cloudHintText()), cloudHintText());
      ok('the warning points a feeder at the local receiver',
        /Local receiver \(LAN\)/.test(cloudWarnText()), cloudWarnText());
      // NEGATIVE CONTROL: pointing a feeder at the local source must not have
      // disabled airplanes.live for someone who does have access. (That it is
      // still SELECTED by the pickSource above is already covered — the warning
      // block only renders while source === 'cloud'.)
      ok('NEG airplanes.live is still selectable', srcRadio('cloud').disabled !== true);
      ok('NEG airplanes.live shows NO proxy block (it is a direct fetch)', !proxy());

      // The poll input's default is source-aware.
      const pollInput = () => {
        const l = [...drawer.querySelectorAll('label')]
          .find(el => el.textContent.replace(/\s+/g, ' ').trim() === 'Poll (s)');
        return l ? l.parentElement.querySelector('input[type=number]') : null;
      };
      eq('airplanes.live shows the 8 s poll default', pollInput().value, '8');
      await pickSource('opensky');
      eq('OpenSky shows the 60 s poll default (credit budget)', pollInput().value, '60');
      // NEGATIVE CONTROL: an explicit interval still displays verbatim.
      p2.setFlights(f => { f.pollSeconds = 15; });
      drawer.requestUpdate(); await drawer.updateComplete; await sleep(4);
      eq('NEG an explicit poll interval is shown as stored', pollInput().value, '15');
      p2.setFlights(f => { f.pollSeconds = undefined; });

      // An unconfigured proxy must SAY so in the status line, not sit silent.
      p2.store.flights = { enabled: true, source: 'opensky' };
      p2.flightsStatus = 'needs-proxy';
      drawer.requestUpdate(); await drawer.updateComplete; await sleep(4);
      ok('the status line reports the missing proxy',
        !!drawer.querySelector('[data-flight-needs-proxy]'));
      p2.flightsStatus = 'ok';
      drawer.requestUpdate(); await drawer.updateComplete; await sleep(4);
      ok('NEG … and clears once the feed is up',
        !drawer.querySelector('[data-flight-needs-proxy]'));

      // ── 12a2. The `local` source may OPTIONALLY use the same proxy ────────
      // A LAN receiver sends no CORS header and cannot be reached at all from
      // an https panel. Both walls disappear if HA fetches it — so the block is
      // OFFERED here, but never required, and the copy must say which is which.
      p2.store.flights = { enabled: true, source: 'local',
                           localUrl: 'http://192.168.1.50/tar1090/data/aircraft.json' };
      p2.flightsStatus = 'ok';
      drawer.requestUpdate(); await drawer.updateComplete; await sleep(4);

      ok('the local source offers the proxy block too', !!proxy());
      ok('the local YAML is a rest_command block', yamlText().includes('rest_command:'));
      ok('the local YAML carries the typed receiver URL',
        yamlText().includes('http://192.168.1.50/tar1090/data/aircraft.json'), yamlText());
      // No coordinates are involved, so there is nothing to template.
      ok('NEG the local YAML contains NO Jinja at all', !yamlText().includes('{{'), yamlText());
      ok('NEG the local YAML never mentions a third-party provider',
        !yamlText().includes('opensky') && !yamlText().includes('adsb.lol'));
      ok('the local YAML suggests its own service name',
        yamlText().includes('  diorama_local_adsb:'), yamlText());

      // The two rewritten warnings. They used to point at a repo path a panel
      // user cannot open; now each states the receiver-side fix AND the
      // Home-Assistant route.
      const corsHint = () => drawer.querySelector('[data-flight-local-cors]');
      ok('the CORS hint is shown for a local receiver', !!corsHint());
      ok('NEG it no longer points at an unopenable repo path',
        !corsHint().textContent.includes('docs/research'), corsHint().textContent.trim());
      ok('it still names the header the receiver would need',
        corsHint().textContent.includes('Access-Control-Allow-Origin'));
      ok('it offers Home Assistant as the alternative',
        /home assistant/i.test(corsHint().textContent), corsHint().textContent.trim());

      // The optional-proxy affordance must read as a CHOICE, not a failure.
      const proxyHint = () => proxy().textContent.replace(/\s+/g, ' ');
      ok('an empty name reads as "still fetching directly", not as silence',
        /straight from the browser/i.test(proxyHint()), proxyHint());
      ok('NEG local does NOT claim nothing is being fetched',
        !/nothing is being fetched/i.test(proxyHint()), proxyHint());
      // Honest caveat #1: HA has to be able to reach the receiver.
      ok('the block states HA must be able to reach the receiver',
        /reach the receiver/i.test(proxyHint()), proxyHint());

      // Filling the name in surfaces honest caveat #2 (the per-poll round-trip).
      drawer.querySelector('[data-flight-proxy-fill]').click();
      await drawer.updateComplete; await sleep(4);
      eq('the fill button writes the local suggestion',
        p2.store.flights.proxyCommand, 'diorama_local_adsb');
      ok('a configured local proxy states the per-poll service round-trip cost',
        /round-trip/i.test(proxyHint()), proxyHint());

      // NEGATIVE CONTROL: the REQUIRED-proxy wording still appears for a source
      // that genuinely cannot be fetched any other way.
      p2.store.flights = { enabled: true, source: 'opensky' };
      drawer.requestUpdate(); await drawer.updateComplete; await sleep(4);
      ok('NEG opensky still says nothing is being fetched without a proxy',
        /nothing is being fetched/i.test(proxy().textContent.replace(/\s+/g, ' ')));
      ok('NEG … and does not offer the browser-direct fallback',
        !/straight from the browser/i.test(proxy().textContent.replace(/\s+/g, ' ')));

      // With no receiver URL yet the YAML must be a MARKED placeholder rather
      // than a block that looks pasteable but would fetch nothing.
      p2.store.flights = { enabled: true, source: 'local' };
      drawer.requestUpdate(); await drawer.updateComplete; await sleep(4);
      ok('no receiver URL → the YAML says so instead of inventing one',
        /SET THE RECEIVER URL/i.test(yamlText())
        && !yamlText().includes('http://') && !yamlText().includes('https://'), yamlText());

      // ── 12a3. OFFLINE (the gh-pages demo) — no HA, so no YAML to paste ───
      // Planner.isOffline reads `offline` off the live api, exactly as it does
      // for the real LocalApi (`readonly offline = true`). Flipping it on the
      // stub is therefore the same switch the demo throws.
      section('Settings drawer (offline / demo mode)');
      const yamlEl = () => drawer.querySelector('[data-flight-yaml]');
      const offNotice = () => drawer.querySelector('[data-flight-offline-ha]');

      p2.hass.offline = true;
      p2.store.flights = { enabled: true, source: 'opensky' };
      p2.flightsStatus = 'needs-ha';
      drawer.requestUpdate(); await drawer.updateComplete; await sleep(4);

      ok('offline: the status line says a Home Assistant connection is needed',
        !!drawer.querySelector('[data-flight-needs-ha]'));
      ok('offline: NEG it does not say "needs the proxy below" — there is no below',
        !drawer.querySelector('[data-flight-needs-proxy]'));
      ok('offline: the offline notice replaces the proxy block', !!offNotice());
      // The headline suppression: YAML for a configuration.yaml that does not
      // exist, plus a field whose value could only start a doomed poll.
      ok('offline: NEG the rest_command YAML is NOT rendered', !yamlEl());
      ok('offline: NEG the service-name field is gone too',
        !drawer.querySelector('[data-flight-proxy-name]'));
      ok('offline: NEG no copy-YAML button either',
        !drawer.querySelector('[data-flight-yaml-copy]'));
      // Honest, and actionable: the ISS still works, and local is the way out.
      ok('offline: the notice says the ISS still works',
        /ISS still works/i.test(offNotice().textContent), offNotice().textContent.trim());
      ok('offline: the notice points at the local receiver as a way out',
        /local receiver/i.test(offNotice().textContent), offNotice().textContent.trim());
      // …and at the source that needs no hardware at all. A user stuck offline
      // must be told there IS a sky available, not only that this one is dead.
      ok('offline: the notice points at the synthetic demo source',
        /demo \(synthetic traffic\)/i.test(offNotice().textContent),
        offNotice().textContent.trim());

      // adsb.lol is equally dead offline.
      await pickSource('adsblol');
      ok('offline: adsb.lol is suppressed the same way', !!offNotice() && !yamlEl());

      // `entity` needs HA too — no rest_command involved, but no states either.
      await pickSource('entity');
      ok('offline: the entity source shows the same notice', !!offNotice());

      // `local` is the exception: the browser fetches the receiver itself, so
      // it must NOT get the "unavailable" notice — it gets its own explanation.
      await pickSource('local');
      const locOff = () => drawer.querySelector('[data-flight-local-offline]');
      ok('offline: local gets its OWN note, not the unavailable one',
        !!locOff() && !offNotice(), locOff() ? locOff().textContent.trim() : 'missing');
      ok('offline: NEG local shows no proxy block (HA cannot fetch for it)',
        !drawer.querySelector('[data-flight-proxy]') && !yamlEl());
      ok('offline: the local note explains the browser fetches it directly',
        /directly/i.test(locOff().textContent), locOff().textContent.trim());
      ok('offline: … and still names the HTTP/HTTPS constraint',
        /HTTP/i.test(locOff().textContent), locOff().textContent.trim());
      // The receiver URL field itself stays usable — this source can work.
      ok('offline: the receiver URL input is still offered',
        !!drawer.querySelector('input[placeholder^="http://192.0.2.10"]'));

      // NEGATIVE CONTROL for the whole section: back ONLINE, every suppressed
      // affordance returns. The offline flag is the only thing doing this.
      p2.hass.offline = false;
      await pickSource('opensky');
      ok('NEG online: the YAML is rendered again', !!yamlEl());
      ok('NEG online: the offline notice is gone', !offNotice());
      ok('NEG online: the service-name field is back',
        !!drawer.querySelector('[data-flight-proxy-name]'));
      await pickSource('local');
      ok('NEG online: local offers its optional proxy block again',
        !!drawer.querySelector('[data-flight-proxy]') && !locOff());

      // ── The demo (synthetic traffic) source block ────────────────────────
      // The one source that works with nothing behind it. Two things matter
      // here: it must never be suppressed like an HA-dependent source, and the
      // copy must never let invented aircraft read as real traffic.
      section('Settings drawer (demo source)');
      {
        const demoBlk = () => drawer.querySelector('[data-flight-demo]');
        const demoWarn = () => drawer.querySelector('[data-flight-demo-warn]');
        const originLine = () => drawer.querySelector('[data-flight-demo-origin]');
        const fleetIn = () => drawer.querySelector('[data-flight-demo-fleet]');
        const seedIn = () => drawer.querySelector('[data-flight-demo-seed]');
        const emergBox = () => drawer.querySelector('[data-flight-demo-emerg]');
        const setIn = async (el, v) => {
          el.value = String(v); el.dispatchEvent(new Event('change'));
          await drawer.updateComplete; await sleep(4);
        };

        // Selecting it must not be suppressed ONLINE…
        await pickSource('demo');
        ok('the demo block renders', !!demoBlk());
        ok('NEG the HA-unavailable notice is NOT shown for it', !offNotice());
        ok('NEG no rest_command YAML — nothing is fetched', !yamlEl());
        ok('NEG no service-name field either',
          !drawer.querySelector('[data-flight-proxy-name]'));

        // …and, the point of the whole source, must not be suppressed OFFLINE.
        p2.hass.offline = true;
        drawer.requestUpdate(); await drawer.updateComplete; await sleep(4);
        ok('offline: the demo block still renders', !!demoBlk());
        ok('offline: NEG it is NOT replaced by the unavailable notice', !offNotice());
        ok('offline: NEG and still no YAML', !yamlEl());

        // HONESTY. The copy must say, out loud, that these are not real.
        const warnText = () => demoWarn()?.textContent ?? '';
        ok('the block states the aircraft are invented', /invented/i.test(warnText()),
          warnText().trim());
        ok('… that nothing is fetched', /nothing is fetched/i.test(warnText()));
        ok('… and warns against reading it as real traffic',
          /not.*real traffic/i.test(warnText()), warnText().trim());
        // The source hint itself, seen before the block is even opened.
        const demoHint = drawer.querySelector('[data-flight-source="demo"]').textContent;
        ok('the source row itself says synthetic + offline + not real',
          /synthetic/i.test(demoHint) && /offline/i.test(demoHint)
            && /not real traffic/i.test(demoHint), demoHint.trim());

        // The synthetic origin is disclosed rather than silently assumed. This
        // planner carries a weather location from earlier sections, so drop it
        // first — "no real location configured" is the state under test, and it
        // is exactly what every committed demo floorplan ships as.
        const savedWeather = p2.store.weather;
        delete p2.store.weather;
        drawer.requestUpdate(); await drawer.updateComplete; await sleep(4);
        ok('the block discloses the synthetic location',
          /synthetic location/i.test(originLine().textContent),
          originLine().textContent.trim());
        ok('… and prints the actual coordinates it will use',
          originLine().textContent.includes(
            `${FLM.DEMO_FLIGHT_ORIGIN.lat.toFixed(4)}, ${FLM.DEMO_FLIGHT_ORIGIN.lon.toFixed(4)}`),
          originLine().textContent.trim());
        ok('… with the lat/lon inputs offered while it is synthetic',
          !!drawer.querySelector('[data-flight-demo-lat]')
            && !!drawer.querySelector('[data-flight-demo-lon]'));

        // NEGATIVE CONTROL: give the planner a real location and the wording
        // must change — the "synthetic" claim is conditional, not boilerplate.
        p2.store.weather = { source: 'openmeteo', lat: 51.5, lon: -0.12 };
        drawer.requestUpdate(); await drawer.updateComplete; await sleep(4);
        ok('NEG with a real location it stops claiming a synthetic one',
          !/synthetic location/i.test(originLine().textContent),
          originLine().textContent.trim());
        ok('NEG … it names where the location came from instead',
          /weather location/i.test(originLine().textContent),
          originLine().textContent.trim());
        ok('NEG … and shows the REAL coordinates',
          /51\.5000,\s*-0\.1200/.test(originLine().textContent),
          originLine().textContent.trim());
        ok('NEG … and hides the synthetic-location inputs',
          !drawer.querySelector('[data-flight-demo-lat]'));
        p2.store.weather = savedWeather;
        drawer.requestUpdate(); await drawer.updateComplete; await sleep(4);

        // The knobs write through setFlights (which sanitizes), not the UI.
        await setIn(fleetIn(), 4);
        eq('the fleet input writes through', p2.store.flights.demo?.fleet, 4);
        await setIn(fleetIn(), 9999);
        ok('an over-large fleet is clamped in the planner, not the UI',
          p2.store.flights.demo === undefined
            || p2.store.flights.demo.fleet === undefined,
          JSON.stringify(p2.store.flights.demo));
        await setIn(fleetIn(), 3);
        await setIn(seedIn(), 12);
        eq('the seed input writes through', p2.store.flights.demo?.seed, 12);
        await setIn(seedIn(), '');
        ok('clearing the seed drops it', p2.store.flights.demo?.seed === undefined,
          JSON.stringify(p2.store.flights.demo));

        // The emergency aircraft is opt-OUT: checked by default, and unchecking
        // is what stores anything at all.
        ok('the emergency aircraft is included by default', emergBox().checked === true);
        emergBox().checked = false; emergBox().dispatchEvent(new Event('change'));
        await drawer.updateComplete; await sleep(4);
        eq('unchecking stores the opt-out', p2.store.flights.demo?.emergency, false);
        ok('NEG the checkbox now reflects it', emergBox().checked === false);
        emergBox().checked = true; emergBox().dispatchEvent(new Event('change'));
        await drawer.updateComplete; await sleep(4);
        ok('re-checking normalizes the redundant `true` away',
          p2.store.flights.demo === undefined
            || p2.store.flights.demo.emergency === undefined,
          JSON.stringify(p2.store.flights.demo));

        // And it really does fly: the planner has aircraft, offline, with no
        // network and no origin configured.
        await waitFor(() => p2.flightsStatus === 'ok' && (p2.flightsNow?.length ?? 0) > 0);
        eq('the planner reports ok offline', p2.flightsStatus, 'ok');
        ok('… with aircraft in the sky', (p2.flightsNow?.length ?? 0) > 0,
          `n=${p2.flightsNow?.length}`);
        ok('… and the status line says so, not "needs a Home Assistant connection"',
          !drawer.querySelector('[data-flight-needs-ha]'));

        // Leave the drawer in the state the sweep below expects: online, still
        // enabled, on an ordinary source (which also stops the demo's timer).
        p2.hass.offline = false;
        await pickSource('opensky');
      }

      // ── The docs/research dead-end sweep ─────────────────────────────────
      // A panel user cannot open a repo path. No source hint may cite one.
      {
        const block = drawer.querySelector('[data-flight-source="entity"]')
          .closest('div').parentElement;
        const text = block.textContent;
        ok('NEG no source hint cites an unopenable repo path',
          !/docs\/research/i.test(text) && !/research doc/i.test(text),
          (text.match(/[^.]*research[^.]*/i) || ['clean'])[0].trim());
        const entHint = drawer.querySelector('[data-flight-source="entity"]').textContent;
        ok('the entity hint is self-contained about the attribute shape',
          /aircraft/.test(entHint) && /ac/.test(entHint) && /flights/.test(entHint),
          entHint.trim());
      }

      drawer.remove();

      // ── 12b. Settings ▸ Display — background-text entry rows ───────────────
      // The tow-aircraft picker + the per-entry model-size knob. The bg-text
      // editor lives in the Display tab of the SAME drawer, so this page is
      // where it is covered.
      section('Settings drawer (background text rows)');
      const p3 = new UI.Planner();
      p3.connectWith(new FakeHa());
      await sleep(20);
      p3.store.bgTexts = [{ id: 'bt1', mode: 'banner', text: 'HELLO' }];
      const dw = document.createElement('diorama-settings-drawer');
      dw.planner = p3;
      document.getElementById('mount').appendChild(dw);
      dw.show('display');
      await dw.updateComplete;
      const labelled = (text, sel) => {
        const l = [...dw.querySelectorAll('label')]
          .find(el => el.textContent.replace(/\s+/g, ' ').trim() === text);
        return l ? l.parentElement.querySelector(sel) : null;
      };
      const acSel = labelled('Aircraft', 'select');
      ok('BG banner row offers an “Aircraft” picker', !!acSel);
      eq('the picker defaults to the classic tow plane', acSel && acSel.value, '');
      // The HARD-CODED roster: 9 airliner-family entries (classic plane + 8
      // archetypes) + 7 military/NASA + 11 fiction + the news helicopter, in the
      // first four optgroups — pinned exactly.
      const acGroups = acSel ? [...acSel.querySelectorAll('optgroup')] : [];
      eq('the 28-craft hard-coded roster is listed first',
        acGroups.slice(0, 4).reduce((n, g) => n + g.querySelectorAll('option').length, 0), 28);
      eq('…grouped into four optgroups',
        acGroups.slice(0, 4).map(g => g.label).join('|'),
        'Toy plane & airliners|Military & NASA|Fiction|News');
      // Everything AFTER those four is registry-driven: one optgroup per loaded +
      // active vehicle pack carrying banner-surface models, labelled by its
      // Settings-tree path. The franchise space pack defaults UNLOADED, so it
      // must NOT appear until the user opts in.
      const vehGroups = acGroups.slice(4);
      ok('vehicle packs append their own optgroups', vehGroups.length >= 4,
        vehGroups.map(g => g.label).join('|'));
      ok('…labelled by the pack path', vehGroups.every(g => g.label.includes(' ▸ ')),
        vehGroups.map(g => g.label).join('|'));
      ok('…and the opt-in franchise space pack is absent by default',
        !vehGroups.some(g => g.label === 'Space ▸ Fiction'),
        vehGroups.map(g => g.label).join('|'));
      ok('…carrying namespaced vehicle ids',
        vehGroups.every(g => [...g.querySelectorAll('option')].every(o => o.value.includes('/'))));
      eq('every option is accounted for by the two families',
        acSel && acSel.options.length,
        28 + vehGroups.reduce((n, g) => n + g.querySelectorAll('option').length, 0));
      ok('the news helicopter is a CRAFT now, not a mode',
        !!acSel && [...acSel.options].some(o => o.value === 'news_chopper'));
      const modeSel = dw.querySelector('select');
      ok('…and the mode dropdown no longer offers "chopper"',
        !!modeSel && ![...modeSel.options].some(o => o.value === 'chopper'),
        modeSel && [...modeSel.options].map(o => o.value).join(','));
      acSel.value = 'widebody'; acSel.dispatchEvent(new Event('change'));
      await dw.updateComplete; await sleep(4);
      eq('picking an archetype writes the entry', p3.store.bgTexts[0].aircraft, 'widebody');
      ok('…and bgTextsResolved passes it through to the renderer',
        p3.bgTextsResolved()[0].aircraft === 'widebody',
        JSON.stringify(p3.bgTextsResolved()[0]));
      labelled('Aircraft', 'select').value = '';
      labelled('Aircraft', 'select').dispatchEvent(new Event('change'));
      await dw.updateComplete; await sleep(4);
      eq('choosing the classic plane clears the field', p3.store.bgTexts[0].aircraft, undefined);

      const szIn = labelled('Model size ×', 'input[type=number]');
      ok('BG entry row offers a “Model size ×” input', !!szIn);
      eq('bg model size defaults to 1', szIn && szIn.value, '1');
      const typeSz = async (v) => {
        const el = labelled('Model size ×', 'input[type=number]');
        el.value = String(v); el.dispatchEvent(new Event('change'));
        await dw.updateComplete; await sleep(4);
      };
      await typeSz(3);
      eq('typing a bg model size writes the entry', p3.store.bgTexts[0].scale, 3);
      ok('…and bgTextsResolved passes the scale through',
        p3.bgTextsResolved()[0].scale === 3, JSON.stringify(p3.bgTextsResolved()[0]));
      await typeSz(99);
      eq('the bg model size clamps at 5', p3.store.bgTexts[0].scale, 5);
      await typeSz(0.01);
      eq('…and at 0.5', p3.store.bgTexts[0].scale, 0.5);
      await typeSz(1);
      eq('back to 1 clears the bg scale field', p3.store.bgTexts[0].scale, undefined);

      // The aircraft picker is banner-ONLY; the size knob is on every mode.
      p3.store.bgTexts = [{ id: 'bt2', mode: 'train', text: 'CHOO' }];
      dw.requestUpdate(); await dw.updateComplete; await sleep(4);
      eq('a train row has no aircraft picker', labelled('Aircraft', 'select'), null);
      ok('a train row still has the model-size knob',
        !!labelled('Model size ×', 'input[type=number]'));
      dw.remove();

      // ── 13. Flight detail card (diorama-flight-modal) ──────────────────────
      section('Flight detail card');
      p2.store.weather = { source: 'openmeteo', lat: 40, lon: -75 };
      p2.store.flights = { enabled: true, source: 'cloud', iss: false };
      const mkFp = o => ({
        hex: 'ab1234', callsign: null, lat: 40, lon: -75, altFt: 10000, gsKt: null,
        trackDeg: null, vertRateFpm: null, category: null, seenPosS: null, military: false,
        reg: null, typeCode: null, typeDesc: null, operator: null, emergency: null,
        squawk: null, interesting: false, pia: false, ladd: false, ...o,
      });
      const card = document.createElement('diorama-flight-modal');
      card.planner = p2;
      document.getElementById('mount').appendChild(card);
      const cardText = async () => { await card.updateComplete; await sleep(4);
                                     return card.textContent.replace(/\s+/g, ' ').trim(); };
      const has = (t, sub) => t.includes(sub);

      const FULL = mkFp({
        hex: 'a1b2c3', callsign: 'AAL266', reg: 'N454AL', typeCode: 'B38M',
        typeDesc: 'BOEING 737 MAX 8', operator: 'AMERICAN AIRLINES INC',
        category: 'A3', altFt: 12340, gsKt: 322, trackDeg: 275, vertRateFpm: 1800,
        squawk: '1200', seenPosS: 3, lat: 40.2, lon: -75.0,
      });
      p2.flightsNow = [FULL];
      card.show('a1b2c3');
      let t = await cardText();
      ok('card renders the callsign as the headline', has(t, 'AAL266'), t.slice(0, 80));
      ok('card shows the ICAO hex', has(t, 'A1B2C3'));
      ok('card shows the registration', has(t, 'N454AL'));
      ok('card shows the operator', has(t, 'AMERICAN AIRLINES INC'));
      ok('card shows the type code + long description',
         has(t, 'B38M') && has(t, 'BOEING 737 MAX 8'));
      ok('card shows the resolved archetype + ADS-B category',
         has(t, 'narrowbody airliner') && has(t, 'category A3'), t.slice(0, 200));
      ok('card shows the REAL altitude in ft', has(t, '12,340 ft'), t.slice(0, 200));
      ok('card shows a climb arrow', has(t, '↑'));
      ok('card shows ground speed in kt', has(t, '322 kt'));
      ok('card shows the vertical rate in fpm', has(t, '+1,800 fpm'));
      ok('card shows the track + compass point', has(t, '275°') && has(t, 'W'));
      ok('card shows the squawk', has(t, '1200'));
      ok('card shows distance + bearing from home',
         /\d+\.\d nm N/.test(t), t.slice(0, 300));
      ok('card shows the fix age', has(t, '3 s ago'));
      ok('card is honest about the compressed shell',
         has(t, 'true in bearing, not to scale'));
      ok('an unflagged aircraft shows no status chips',
         !has(t, 'MILITARY') && !has(t, 'EMERGENCY') && !has(t, 'LADD'));
      // A descending aircraft flips the arrow.
      p2.flightsNow = [{ ...FULL, vertRateFpm: -1400 }];
      p2.dispatchEvent(new CustomEvent('live'));
      t = await cardText();
      ok('the card refreshes on the LIVE channel (descent arrow)',
         has(t, '↓') && has(t, '-1,400 fpm'), t.slice(0, 200));

      // Status flags.
      p2.flightsNow = [{ ...FULL, military: true, interesting: true, ladd: true,
                         emergency: 'lifeguard', squawk: '7700' }];
      p2.dispatchEvent(new CustomEvent('live'));
      t = await cardText();
      ok('card chips EMERGENCY with the reported string',
         has(t, 'EMERGENCY') && has(t, 'LIFEGUARD'), t.slice(0, 220));
      ok('card chips MILITARY', has(t, 'MILITARY'));
      ok('card chips INTERESTING', has(t, 'INTERESTING'));
      ok('card chips LADD', has(t, 'LADD'));
      ok('LADD does NOT anonymize (registration + operator kept)',
         has(t, 'N454AL') && has(t, 'AMERICAN AIRLINES INC'));

      // PIA anonymization.
      const PIAFP = mkFp({ hex: 'ff9911', callsign: 'SECRET1', reg: 'N1PIA',
        typeCode: 'B738', typeDesc: 'BOEING 737-800', operator: 'A VERY PRIVATE LLC',
        category: 'A3', pia: true, altFt: 33000 });
      p2.flightsNow = [PIAFP];
      card.show('ff9911');
      t = await cardText();
      ok('PIA card shows the hex as the identity', has(t, 'FF9911'), t.slice(0, 80));
      ok('PIA card withholds the callsign', !has(t, 'SECRET1'), t.slice(0, 200));
      ok('PIA card withholds the registration', !has(t, 'N1PIA'));
      ok('PIA card withholds the operator', !has(t, 'A VERY PRIVATE LLC'));
      ok('PIA card keeps type + category (not identifying)',
         has(t, 'B738') && has(t, 'category A3'));
      ok('PIA card explains itself', has(t, 'anonymized (PIA)'), t.slice(0, 260));
      ok('PIA card still chips PIA', has(t, 'PIA'));
      // privacyDim off → the courtesy is the user's call.
      p2.store.flights = { enabled: true, source: 'cloud', iss: false, privacyDim: false };
      p2.dispatchEvent(new CustomEvent('live'));
      t = await cardText();
      ok('privacyDim:false shows the PIA identity in full',
         has(t, 'SECRET1') && has(t, 'N1PIA') && !has(t, 'anonymized (PIA)'),
         t.slice(0, 200));
      p2.store.flights = { enabled: true, source: 'cloud', iss: false };

      // Signal lost: the aircraft leaves the feed while the card is open.
      p2.flightsNow = [FULL];
      card.show('a1b2c3');
      await cardText();
      p2.flightsNow = [];
      p2.dispatchEvent(new CustomEvent('live'));
      t = await cardText();
      ok('an aircraft leaving the feed shows "signal lost"',
         has(t, 'Signal lost'), t.slice(0, 160));
      ok('…and keeps the last received data', has(t, 'AAL266') && has(t, '12,340 ft'));
      p2.flightsNow = null;
      p2.dispatchEvent(new CustomEvent('live'));
      t = await cardText();
      ok('a null feed does not crash the open card', has(t, 'AAL266'));

      // ── 13a. Airline block (docs/research/airline-reference.md) ────────────
      // Four mutually exclusive outcomes: a real carrier, a regional (which
      // explains its partner livery instead of showing colours), a military
      // callsign word, and a PIA pseudo-operator that gets NO branding.
      section('Flight detail card — airline block');
      const swatches = () => card.querySelectorAll('[data-airline-swatch]').length;
      p2.flightsNow = [mkFp({ hex: 'aa0001', callsign: 'DAL1234', typeCode: 'B738',
        category: 'A3', altFt: 31000 })];
      card.show('aa0001');
      t = await cardText();
      ok('mainline: the card names the airline', has(t, 'Delta Air Lines'), t.slice(0, 240));
      ok('mainline: it shows the ICAO + IATA codes', has(t, 'DAL') && has(t, 'IATA DL'));
      ok('mainline: it shows the SPOKEN form', has(t, 'DELTA 1234'), t.slice(0, 300));
      ok('mainline: it shows the slogan', has(t, 'Keep Climbing'));
      ok('mainline: it chips the carrier kind', has(t, 'MAINLINE'));
      eq('mainline: two colour swatches are drawn', swatches(), 2);

      p2.flightsNow = [mkFp({ hex: 'aa0002', callsign: 'SKW5678', typeCode: 'CRJ9',
        category: 'A3' })];
      card.show('aa0002');
      t = await cardText();
      ok('regional: the card names the regional', has(t, 'SkyWest'), t.slice(0, 240));
      ok('regional: it explains the partner livery',
         has(t, 'operates as') && has(t, 'Delta Connection'), t.slice(0, 320));
      ok('regional: it chips REGIONAL', has(t, 'REGIONAL'));
      eq('regional: NO colour swatches (the livery is its partner\'s)', swatches(), 0);
      ok('regional: it still shows the spoken form', has(t, 'SKYWEST 5678'));

      p2.flightsNow = [mkFp({ hex: 'ae1234', callsign: 'RCH412', military: true,
        typeCode: 'C17', category: 'A5' })];
      card.show('ae1234');
      t = await cardText();
      ok('military: the callsign WORD is explained',
         has(t, 'REACH') && has(t, 'Air Mobility Command'), t.slice(0, 300));
      ok('military: the typical airframes are listed', has(t, 'C-17'));
      ok('military: the hex-range note is labelled a HEURISTIC',
         has(t, 'AE0000') && has(t, 'heuristic'), t.slice(0, 400));
      ok('military: no airline branding is invented',
         !has(t, 'MAINLINE') && swatches() === 0);
      // A civil aircraft outside the range gets no hex note.
      p2.flightsNow = [mkFp({ hex: 'a12345', callsign: 'UAL99' })];
      card.show('a12345');
      t = await cardText();
      ok('a civil hex outside AE0000–AFFFFF gets no military note',
         !has(t, 'heuristic'), t.slice(0, 240));
      ok('…but still resolves its airline', has(t, 'United Airlines'));

      p2.flightsNow = [mkFp({ hex: 'ff0001', callsign: 'FFL0123', pia: true })];
      card.show('ff0001');
      t = await cardText();
      ok('PIA: no airline name is shown', !has(t, 'ForeFlight'), t.slice(0, 300));
      ok('PIA: no colour swatches', swatches() === 0);
      ok('PIA: the card still explains the anonymization', has(t, 'anonymized (PIA)'));
      // With the courtesy off, the pseudo-operator is named for what it IS —
      // "not a real airline" — and still never branded.
      p2.store.flights = { enabled: true, source: 'cloud', iss: false, privacyDim: false };
      p2.dispatchEvent(new CustomEvent('live'));
      t = await cardText();
      ok('PIA (courtesy off): named as a privacy callsign, not an airline',
         has(t, 'privacy callsign') && has(t, 'not a real airline'), t.slice(0, 320));
      ok('PIA (courtesy off): still no colour swatches', swatches() === 0);
      p2.store.flights = { enabled: true, source: 'cloud', iss: false };

      // An unresolvable ident renders no airline block at all.
      p2.flightsNow = [mkFp({ hex: 'bb0001', callsign: 'N472QS' })];
      card.show('bb0001');
      await cardText();
      eq('an unresolvable ident renders no airline block',
         card.querySelectorAll('[data-airline-block]').length, 0);

      // Sparse aircraft: nothing invented for missing fields.
      p2.flightsNow = [mkFp({ hex: 'bare01', altFt: 5000 })];
      card.show('bare01');
      t = await cardText();
      ok('a bare aircraft falls back to its hex', has(t, 'BARE01'));
      ok('missing fields are omitted, not blank-labelled',
         !has(t, 'Registration') && !has(t, 'Operator') && !has(t, 'Squawk')
         && !has(t, 'Ground speed'), t.slice(0, 260));
      ok('altitude still renders', has(t, '5,000 ft'));

      // Never opened / closed → renders nothing.
      card.open = false;
      t = await cardText();
      eq('a closed card renders nothing', t, '');
      // Unknown hex with no prior data → nothing (never throws).
      card.show('nosuch');
      t = await cardText();
      eq('an unknown hex renders nothing', t, '');
      card.remove();

    } catch (err) {
      ok('Planner section ran without throwing', false, String((err && err.stack) || err));
    } finally {
      Date.now = realNow;
    }

    // ── Render ────────────────────────────────────────────────────────────────
    const rows = document.getElementById('rows');
    let pass = 0, total = 0;
    for (const r of results) {
      if (r.section) {
        const h = document.createElement('h2'); h.textContent = r.section; rows.appendChild(h); continue;
      }
      total++; if (r.pass) pass++;
      const div = document.createElement('div'); div.className = 'row';
      div.innerHTML = `<span class="name">${r.pass ? '✓' : '✗'} ${r.name}</span>` +
        `<span class="${r.pass ? 'pass' : 'extra'}">${r.pass ? 'PASS' : r.extra}</span>`;
      rows.appendChild(div);
    }
    const s = document.getElementById('summary');
    s.textContent = `FLIGHTSUI ${pass === total ? 'PASS' : 'FAIL'} ${pass}/${total}`;
    s.className = pass === total ? 'okbg' : 'badbg';
    document.title = `FLIGHTSUI ${pass}/${total}`;
  </script>
</body>
</html>
