<!doctype html>
<meta charset="utf-8">
<title>fence gate test</title>
<style>html,body{margin:0;background:#111;color:#ccc;font:12px sans-serif}#c{width:1280px;height:880px}</style>
<div id="c"></div>
<!--
  Batch T2 boundaries: fence WallKinds (picket/privacy/chainlink) + hedge +
  Door.kind 'gate' — including §10/§11: a gate must leave a REAL GAP in the
  fence line in BOTH views. Pure WALL_KINDS via geometry.mod.js; renderer via
  the built three-renderer chunk; the 2D pixel band via the real Planner + ONE
  COMBINED canvas bundle (the door-kinds-test / flights-ui-test precedent).
    npm run build
    H=<harness>; rm -rf "$H"; mkdir -p "$H"; cp -r dist/* "$H"/
    cp test-pages/fence-gate-test.html "$H"/
    npx esbuild src/geometry.ts --bundle --format=esm --outfile="$H"/geometry.mod.js
    T=$(mktemp -d); cp -r src/* "$T"/; cp test-pages/fake-avatar-store.ts "$T"/avatar-store.ts
    printf "export * from './canvas-render.js';\nexport * from './canvas-hit.js';\nexport { nearestWallKind, isFenceLikeKind } from './canvas-interact.js';\n" > "$T"/canvas2d-entry.ts
    npx esbuild "$T"/planner.ts        --bundle --format=esm --outfile="$H"/planner.mod.js
    npx esbuild "$T"/canvas2d-entry.ts --bundle --format=esm --outfile="$H"/canvas-render.mod.js
-->
<script type="module">
 try {
  const geo = await import('./geometry.mod.js?v=' + Date.now());
  const mod = await import('./assets/three-renderer.js?v=' + Date.now());
  const { WALL_KINDS, doorOpenFraction } = geo;

  const results = [];
  const ok = (name, cond, detail = '') => results.push(`${cond ? 'ok' : 'FAIL'}:${name}${detail ? '(' + detail + ')' : ''}`);
  const near = (a, b, t = 1e-6) => Math.abs(a - b) <= t;

  // === 1. WALL_KINDS pure entries + heights ================================
  ok('kind_picket',    !!WALL_KINDS.fence_picket);
  ok('kind_privacy',   !!WALL_KINDS.fence_privacy);
  ok('kind_chainlink', !!WALL_KINDS.fence_chainlink);
  ok('kind_hedge',     !!WALL_KINDS.hedge);
  ok('h_picket',    WALL_KINDS.fence_picket?.h === 1100, String(WALL_KINDS.fence_picket?.h));
  ok('h_privacy',   WALL_KINDS.fence_privacy?.h === 1800, String(WALL_KINDS.fence_privacy?.h));
  ok('h_chainlink', WALL_KINDS.fence_chainlink?.h === 1200, String(WALL_KINDS.fence_chainlink?.h));
  ok('h_hedge',     WALL_KINDS.hedge?.h === 900, String(WALL_KINDS.hedge?.h));

  // === Renderer setup =====================================================
  const r = new mod.ThreeDRenderer(document.getElementById('c'));
  await r.load();
  const scene3d = { preset: 'day', floorColor: '#8a7860', floorTex: 'none', wallColor: '#cfd2d6' };
  const wallY = 2500;
  const mkFloor = (walls, doors = []) => ({
    id: 'f1', name: 'T', w: 12000, d: 5000,
    walls,
    furniture: [], lights: [], switches: [], sensors: [], motionSensors: [], envSensors: [],
    doors, windows: [], bg: null, model3d: null, look3d: null, rooms: [],
  });
  const fence = (kind) => [{ id: 'w1', kind, points: [{x:500,y:wallY},{x:11500,y:wallY}] }];

  const boxesIn = (grp) => { const a = []; grp.traverse(o => { if (o.isMesh && o.geometry?.type === 'BoxGeometry') a.push(o); }); return a; };
  const extrudesIn = (grp) => { const a = []; grp.traverse(o => { if (o.isMesh && o.geometry?.type === 'ExtrudeGeometry') a.push(o); }); return a; };
  const cylsIn = (grp) => { const a = []; grp.traverse(o => { if (o.isMesh && o.geometry?.type === 'CylinderGeometry') a.push(o); }); return a; };

  // === 2. Picket fence: posts (~1100 tall) + many pickets (~1060) =========
  r.updateFloor(mkFloor(fence('fence_picket')), scene3d);
  { const bx = boxesIn(r._floorGroup);
    const posts = bx.filter(m => near(m.geometry.parameters.height, 1100, 2));
    const pickets = bx.filter(m => near(m.geometry.parameters.height, 1060, 2));
    ok('picket_posts', posts.length >= 2, String(posts.length));
    ok('picket_pickets', pickets.length >= 20, String(pickets.length)); }

  // === 3. Privacy fence: solid extrusion at h=1800 ========================
  r.updateFloor(mkFloor(fence('fence_privacy')), scene3d);
  { const ex = extrudesIn(r._floorGroup);
    ok('privacy_solid', ex.length === 1, String(ex.length));
    let topY = 0;
    for (const m of ex) { m.geometry.computeBoundingBox(); topY = Math.max(topY, m.geometry.boundingBox.max.y); }
    ok('privacy_h1800', near(topY, 1800, 2), topY.toFixed(0)); }

  // === 4. Privacy fence WITH a gate → opening splits the run =============
  const gateOnPrivacy = { id: 'g1', x: 5550, y: wallY, w: 900, rotation: 0, kind: 'gate', entity_id: null };
  r.updateFloor(mkFloor(fence('fence_privacy'), [gateOnPrivacy]), scene3d);
  { const ex = extrudesIn(r._floorGroup);
    ok('privacy_gate_split', ex.length === 2, String(ex.length));
    // Neither run covers the gate span center (t ≈ 5500 relative to wall start x=500).
    let coversGate = false;
    for (const m of ex) { m.geometry.computeBoundingBox(); const bb = m.geometry.boundingBox;
      if (bb.min.x <= 5000 - 500 + 1 && bb.max.x >= 6000 - 500 - 1) coversGate = true; }
    ok('privacy_gate_gap', !coversGate); }

  // === 5. Chain-link: semi-transparent MeshBasicMaterial plane + posts ====
  r.updateFloor(mkFloor(fence('fence_chainlink')), scene3d);
  { let plane = null; r._floorGroup.traverse(o => {
      if (o.isMesh && o.material?.type === 'MeshBasicMaterial' && o.geometry?.type === 'PlaneGeometry' && o.material.map) plane = o; });
    ok('chainlink_plane', !!plane);
    ok('chainlink_transparent', !!plane && plane.material.transparent === true && plane.material.opacity < 1, plane ? String(plane.material.opacity) : '-');
    ok('chainlink_doubleside', !!plane && plane.material.side === 2);  // THREE.DoubleSide === 2
    ok('chainlink_basic_not_toon', !!plane && plane.material.type === 'MeshBasicMaterial');
    const posts = cylsIn(r._floorGroup);
    ok('chainlink_posts', posts.length >= 2, String(posts.length)); }

  // === 6. Hedge: green solid extrusion at h=900 + trimmed crown box =======
  r.updateFloor(mkFloor(fence('hedge')), scene3d);
  { const ex = extrudesIn(r._floorGroup);
    ok('hedge_solid', ex.length === 1, String(ex.length));
    let topY = 0, green = false;
    for (const m of ex) { m.geometry.computeBoundingBox(); topY = Math.max(topY, m.geometry.boundingBox.max.y);
      const c = m.material.color; if (c.g > c.r && c.g > c.b) green = true; }
    ok('hedge_h900', near(topY, 900, 2), topY.toFixed(0));
    ok('hedge_green', green);
    // Crown box: a BoxGeometry near the top (height 260) → trimmed-shrub silhouette.
    const crown = boxesIn(r._floorGroup).filter(m => near(m.geometry.parameters.height, 260, 2));
    ok('hedge_crown', crown.length >= 1, String(crown.length)); }

  // === 7. Gate panel + swing driven by doorOpenFraction (fake cover) ======
  // doorOpenFraction pure sanity for the states we drive the gate with.
  ok('cov_open',   doorOpenFraction({ state: 'open' }) === 1);
  ok('cov_closed', doorOpenFraction({ state: 'closed' }) === 0);
  ok('cov_pos50',  near(doorOpenFraction({ state: 'open', attributes: { current_position: 50 } }), 0.5));

  const gate = { id: 'gt', x: 3000, y: wallY, w: 900, rotation: 0, kind: 'gate', entity_id: 'cover.gate' };
  const hingeOf = () => r._doorGroup.children[0];
  const gateBoards = () => { const h = hingeOf(); return h.children.filter(c => c.isMesh && !c.userData.outline && c.geometry?.type === 'BoxGeometry'); };
  const setGate = (state, pos) => {
    const st = { 'cover.gate': { state, attributes: pos == null ? {} : { current_position: pos } } };
    r.updateFloor(mkFloor(fence('fence_picket'), [gate]), scene3d);
    r.updateDoorsWindows([gate], [], id => st[id] || null);
  };
  setGate('closed', 0);
  { const b = gateBoards();
    ok('gate_boards', b.length >= 4, String(b.length));
    // Picket-styled: NO single full-door-height (2000) panel box.
    const tall = b.filter(m => near(m.geometry.parameters.height, 2000, 5));
    ok('gate_not_solid_door', tall.length === 0, String(tall.length)); }
  const rClosed = hingeOf().rotation.y;
  setGate('open', 100);
  const rOpen = hingeOf().rotation.y;
  setGate('open', 50);
  const rHalf = hingeOf().rotation.y;
  ok('gate_swings_open', Math.abs(rOpen - rClosed) > 0.2, `closed=${rClosed.toFixed(2)} open=${rOpen.toFixed(2)}`);
  ok('gate_half_between', Math.abs(rHalf - rClosed) > 0.05 && Math.abs(rHalf - rClosed) < Math.abs(rOpen - rClosed),
     `half=${rHalf.toFixed(2)}`);

  // === 8. Nav: fence run blocks, gate opening stays walkable =============
  // Gate hinge x=5550 → span center x=6000 (rotation 0: center = x + w/2).
  const navGate = { id: 'ng', x: 5550, y: wallY, w: 900, rotation: 0, kind: 'gate', entity_id: null };
  r.updateFloor(mkFloor(fence('fence_privacy'), [navGate]), scene3d);
  r.applyViewPreset('top');
  const nav = r._nav;
  const cellIdx = (wx, wy) => {
    const cx = Math.max(0, Math.min(nav.nx - 1, Math.floor(wx / nav.cell)));
    const cy = Math.max(0, Math.min(nav.ny - 1, Math.floor(wy / nav.cell)));
    return cy * nav.nx + cx;
  };
  const blockedAt = (wx, wy) => nav.blocked[cellIdx(wx, wy)] === 1;
  ok('nav_fence_blocks', blockedAt(2000, wallY), `cell=${cellIdx(2000, wallY)}`);
  ok('nav_gate_walkable', !blockedAt(6000, wallY), `cell=${cellIdx(6000, wallY)}`);

  // === 9. Fences ride the surroundings grade; gates hang with them ========
  // Fence-family kinds are yard structures — with a per-floor elevation the
  // grade can sit a whole storey below the slab, and a fence floating up there
  // is exactly the reported bug. Needs a closed wall loop on the floor: with no
  // loops at all `_outdoors` reads the whole rect as INDOORS (documented), so
  // nothing moves — asserted below too.
  {
    const GL = -3000;
    const FWx = 12000, FDx = 5000;
    const houseLoop = [
      { x: 500, y: 500 }, { x: 3000, y: 500 }, { x: 3000, y: 2000 },
      { x: 500, y: 2000 }, { x: 500, y: 500 },
    ];
    const houseWall = { id: 'hw', kind: 'full', points: houseLoop };
    const yardFence = { id: 'yf', kind: 'fence_picket', points: [{ x: 6000, y: 4000 }, { x: 10000, y: 4000 }] };
    const yardGate  = { id: 'yg', x: 7000, y: 4000, w: 900, rotation: 0, kind: 'gate', entity_id: null };
    const mkFloorG = (walls) => ({ ...mkFloor(walls, [yardGate]), w: FWx, d: FDx });
    const realMeshes = (o) => { const a = []; o.traverse(m => { if (m.isMesh && !m.userData?.outline) a.push(m); }); return a; };
    const baseYOf = (o) => {
      let lo = Infinity;
      for (const m of realMeshes(o)) {
        m.geometry.computeBoundingBox();
        let y = m.position.y + m.geometry.boundingBox.min.y, p = m.parent;
        while (p && p !== o) { y += p.position.y; p = p.parent; }
        if (y < lo) lo = y;
      }
      return lo;
    };
    const groupAt = (wx, wy, tol = 900) => {
      const sx = FWx / 2 - wx, sz = wy - FDx / 2;
      for (const g of r._floorGroup.children) {
        if (g.type !== 'Group') continue;
        let hit = false;
        g.traverse(o => { if (o.isMesh && Math.hypot(o.position.x - sx, o.position.z - sz) < tol) hit = true; });
        if (hit) return g;
      }
      return null;
    };
    const run = (gl, walls) => {
      r.updateFloor(mkFloorG(walls), gl === 0 ? scene3d : { ...scene3d, groundLevelMm: gl });
      r.updateDoorsWindows([yardGate], [], () => null);
    };
    run(GL, [houseWall, yardFence]);
    const fy = baseYOf(groupAt(6000, 4000));
    ok('grade_fence_follows', Math.abs(fy - GL) < 1, String(fy));
    ok('grade_house_wall_stays', Math.abs(baseYOf(groupAt(3000, 2000))) < 1,
       String(baseYOf(groupAt(3000, 2000))));
    const gh = r._doorGroup.children[0];
    ok('grade_gate_hangs_in_fence', Math.abs(gh.position.y - GL) < 1, String(gh.position.y));
    // No closed loop → nothing is "outdoors" → the whole build is unchanged.
    run(GL, [yardFence]);
    ok('grade_no_loops_no_move', Math.abs(baseYOf(groupAt(6000, 4000))) < 1
       && r._doorGroup.children[0].position.y === 0, String(baseYOf(groupAt(6000, 4000))));
    // Ground level 0 → byte-identical to the pre-change build.
    run(0, [houseWall, yardFence]);
    const ys = new Set(realMeshes(groupAt(6000, 4000)).map(m => Math.round(m.position.y)));
    ok('grade_zero_identical', Math.abs(baseYOf(groupAt(6000, 4000))) < 1
       && ys.has(550) && ys.has(920) && r._doorGroup.children[0].position.y === 0,
       [...ys].sort((a, b) => a - b).join(','));
  }

  // === 10. A gate leaves a REAL GAP in every fence kind ===================
  // Reported bug: the gate rendered but the fence ran straight through it.
  // picket + chain-link were built full-length (rails / pickets / posts / mesh
  // plane ignored the cut intervals), and the hedge's crown box bridged over
  // the gap its own extrusion had correctly punched. 2D had the twin bug: the
  // base stroke broke but the decorative slat / hatch marks ran through.
  {
    // Hinge x=5550, w=900, rotation 0 → doorSpanCenter = 6000, so the OPENING
    // is world x 5550..6450 (the hinge is one edge of the span, not its centre).
    const GAP_X0 = 5550, GAP_X1 = 6450;               // gate span in world x
    const gapGate = { id: 'gg', x: 5550, y: wallY, w: 900, rotation: 0, kind: 'gate', entity_id: null };
    // World-x extent of a mesh, accounting for the scene X-mirror in _w.
    // Scene x = fw/2 − world x, so a scene-x interval maps back by negation.
    const FW = 12000;
    const worldSpanX = (m) => {
      m.geometry.computeBoundingBox();
      const bb = m.geometry.boundingBox.clone();
      m.updateMatrixWorld(true);
      bb.applyMatrix4(m.matrixWorld);
      return [FW / 2 - bb.max.x, FW / 2 - bb.min.x];      // [lo, hi] in world x
    };
    // Does any real (non-outline) mesh SPAN the whole gate opening?
    const spansGate = (grp) => {
      let spans = false, worst = null;
      grp.traverse(o => {
        if (!o.isMesh || o.userData?.outline) return;
        const [lo, hi] = worldSpanX(o);
        if (lo <= GAP_X0 + 1 && hi >= GAP_X1 - 1) { spans = true; worst = `${lo | 0}..${hi | 0}`; }
      });
      return worst ?? (spans ? 'yes' : null);
    };
    // How much of the gate opening's MIDDLE is free of fence geometry: sample
    // the span centre and assert nothing sits within ±300 mm of it.
    const midClear = (grp) => {
      let clear = true;
      const mid = (GAP_X0 + GAP_X1) / 2;
      grp.traverse(o => {
        if (!o.isMesh || o.userData?.outline) return;
        const [lo, hi] = worldSpanX(o);
        if (lo < mid + 300 && hi > mid - 300) clear = false;
      });
      return clear;
    };
    // `railing` joined the matrix with the railing-gate work: the banister is a
    // see-through COMPOSITE like picket / chain-link (not the notched single-mesh
    // extrusion), and it was still built across the WHOLE segment — rails, posts
    // and balusters ran straight through a gate. (Its 2D balusters already
    // honoured the cuts, so only the 3D side was broken — §11 covers that.)
    for (const kind of ['fence_picket', 'fence_privacy', 'fence_chainlink', 'hedge', 'railing']) {
      // No gate → the run is continuous (the control: the assertions below only
      // mean something if the un-gated fence DOES cross the same interval).
      r.updateFloor(mkFloor(fence(kind)), scene3d);
      const solidGrp = r._floorGroup.children.find(c => c.type === 'Group' && c.children.length);
      ok(`gap_control_${kind}`, !midClear(solidGrp));
      // With a gate → nothing crosses the opening.
      r.updateFloor(mkFloor(fence(kind), [gapGate]), scene3d);
      const grp = r._floorGroup.children.find(c => c.type === 'Group' && c.children.length);
      ok(`gap_no_span_${kind}`, spansGate(grp) === null, String(spansGate(grp)));
      ok(`gap_mid_clear_${kind}`, midClear(grp));
    }
    // Each RUN gets its own end posts → the two gap edges carry real gate posts.
    // Railing posts are the 90×90 bars (h = kindH−60 = 854); assert one lands
    // within ±120 mm of each opening edge (a post CENTRE sits ON the cut).
    r.updateFloor(mkFloor(fence('railing'), [gapGate]), scene3d);
    {
      const grp = r._floorGroup.children.find(c => c.type === 'Group' && c.children.length);
      const postCentres = [];
      grp.traverse(o => {
        if (!o.isMesh || o.userData?.outline) return;
        const g = o.geometry?.parameters;
        if (!g || !near(g.height, 854, 2) || !near(g.width, 90, 2)) return;
        const [lo, hi] = worldSpanX(o);
        postCentres.push((lo + hi) / 2);
      });
      const nearEdge = (e) => postCentres.some(c => Math.abs(c - e) < 120);
      ok('railing_gate_post_lo', nearEdge(GAP_X0), postCentres.map(c => c | 0).join(','));
      ok('railing_gate_post_hi', nearEdge(GAP_X1), postCentres.map(c => c | 0).join(','));
    }
    // The gate PANEL itself still builds (the gap is a hole for the gate, not a
    // hole with nothing in it) and still swings.
    r.updateFloor(mkFloor(fence('fence_picket'), [gapGate]), scene3d);
    r.updateDoorsWindows([gapGate], [], () => null);
    ok('gap_gate_panel_present', r._doorGroup.children.length === 1);
  }

  // === 10b. Gate PANEL styling follows the HOST wall kind =================
  // ONE Door.kind ('gate'); only the leaf's look branches. A railing host builds
  // a banister leaf (stiles + 2 rails + slim balusters, ~914 = WALL_KINDS.railing.h);
  // a fence / hedge / no host keeps the picket leaf (~1100), byte-identical to
  // the pre-feature build. Structural fingerprints, not pixels.
  {
    const styleGate = { id: 'sg', x: 5550, y: wallY, w: 900, rotation: 0, kind: 'gate', entity_id: null };
    const leafBoxes = () => r._doorGroup.children[0].children
      .filter(c => c.isMesh && !c.userData.outline && c.geometry?.type === 'BoxGeometry');
    const buildOn = (kind) => {
      r.updateFloor(mkFloor(kind ? fence(kind) : [], [styleGate]), scene3d);
      r.updateDoorsWindows([styleGate], [], () => null);
      return leafBoxes().map(m => m.geometry.parameters);
    };
    // Picket host: 2 full-width rails (w = 900) + N tall pickets (h = 1060).
    const pk = buildOn('fence_picket');
    const pkPick = pk.filter(g => near(g.height, 1060, 2));
    const pkRail = pk.filter(g => near(g.width, 900, 2) && near(g.height, 80, 2));
    ok('style_picket_pickets', pkPick.length >= 8, String(pkPick.length));
    ok('style_picket_rails', pkRail.length === 2, String(pkRail.length));
    ok('style_picket_no_railing_stile', pk.filter(g => near(g.height, 914, 2)).length === 0);
    // Railing host: 2 full-height stiles (h = 914, w = 70) + 2 SHORT rails
    // (w = 830 = d.w − stile) + slim balusters (w = 26). No 1060 pickets.
    const rl = buildOn('railing');
    const rlStile = rl.filter(g => near(g.height, 914, 2) && near(g.width, 70, 2));
    const rlRail  = rl.filter(g => near(g.width, 830, 2));
    const rlBal   = rl.filter(g => near(g.width, 26, 2) && near(g.depth, 26, 2));
    ok('style_railing_stiles', rlStile.length === 2, String(rlStile.length));
    ok('style_railing_rails', rlRail.length === 2, String(rlRail.length));
    ok('style_railing_balusters', rlBal.length >= 2, String(rlBal.length));
    ok('style_railing_no_pickets', rl.filter(g => near(g.height, 1060, 2)).length === 0);
    // The leaf is SHORTER than the picket leaf (banister height, not fence).
    const topOf = (gs) => Math.max(...gs.map(g => g.height));
    ok('style_railing_shorter', topOf(rl) < topOf(pk), `${topOf(rl)} < ${topOf(pk)}`);
    // Coincident-face discipline: stiles are the DEEPEST part, balusters the
    // thinnest, so every rail / baluster end cap dies inside a thicker member.
    ok('style_railing_depths',
       Math.max(...rlStile.map(g => g.depth)) > Math.max(...rlRail.map(g => g.depth))
       && Math.min(...rlRail.map(g => g.depth)) > 26,
       `stile=${rlStile[0]?.depth} rail=${rlRail.map(g => g.depth).join('/')}`);
    // GOLDEN: fence-host gate is byte-identical to the pre-feature build.
    // Reference = the shipped picket leaf: 2 rails (900×80×30) + 9 pickets
    // (55×1060×22) for w = 900. Signature compared as a sorted multiset.
    const sig = (gs) => gs.map(g => `${g.width}x${g.height}x${g.depth}`).sort().join(' ');
    const GOLD = sig([
      { width: 900, height: 80, depth: 30 }, { width: 900, height: 80, depth: 30 },
      ...Array.from({ length: 9 }, () => ({ width: 55, height: 1060, depth: 22 })),
    ]);
    ok('style_picket_golden', sig(pk) === GOLD, sig(pk));
    // Hedge host + NO host at all both keep the picket leaf verbatim.
    ok('style_hedge_golden', sig(buildOn('hedge')) === GOLD);
    ok('style_nohost_golden', sig(buildOn(null)) === GOLD);
    // Swing / open machinery is shared and untouched by the styling branch.
    const rSt = { 'cover.rg': { state: 'open', attributes: { current_position: 100 } } };
    const rgGate = { ...styleGate, entity_id: 'cover.rg' };
    r.updateFloor(mkFloor(fence('railing'), [rgGate]), scene3d);
    r.updateDoorsWindows([rgGate], [], () => null);
    const rClosedY = r._doorGroup.children[0].rotation.y;
    r.updateDoorsWindows([rgGate], [], id => rSt[id] || null);
    ok('style_railing_swings', Math.abs(r._doorGroup.children[0].rotation.y - rClosedY) > 0.2);
  }

  // === 10c. Nav: a railing gate stays walkable ============================
  // Railings block nav like solid walls; wallCutsForSegment is kind-agnostic, so
  // the opening must remain a hole in the rasterized run.
  {
    const navRg = { id: 'nrg', x: 5550, y: wallY, w: 900, rotation: 0, kind: 'gate', entity_id: null };
    r.updateFloor(mkFloor(fence('railing'), [navRg]), scene3d);
    const nv = r._nav;
    const idx = (wx, wy) => {
      const cx = Math.max(0, Math.min(nv.nx - 1, Math.floor(wx / nv.cell)));
      const cy = Math.max(0, Math.min(nv.ny - 1, Math.floor(wy / nv.cell)));
      return cy * nv.nx + cx;
    };
    ok('nav_railing_blocks', nv.blocked[idx(2000, wallY)] === 1);
    ok('nav_railing_gate_walkable', nv.blocked[idx(6000, wallY)] !== 1);
    // Pure-level: the cut exists for a railing host (kind-agnostic by design).
    const { wallCutsForSegment } = geo;
    const cuts = wallCutsForSegment({ x: 500, y: wallY }, { x: 11500, y: wallY }, [navRg], []);
    ok('railing_cut_pure', cuts.solids.length === 2 && cuts.openings.length === 1,
       `${cuts.solids.length}/${cuts.openings.length}`);
  }

  // === 11. 2D: the gate gap is REAL PIXELS, not just a broken base stroke ==
  // The 2D twin of the same bug: drawWalls stroked only the solid sub-intervals,
  // but the picket slat ticks / chain-link hatch marks were sampled across the
  // WHOLE segment, so they painted straight over the gate's gap. Compare the
  // gap band against the identical scene with NO wall: any fence pixel in the
  // opening shows up as a difference.
  {
    const { Planner } = await import('./planner.mod.js?v=' + Date.now());
    const C2D = await import('./canvas-render.mod.js?v=' + Date.now());
    const { drawAll, computeView, mmToPx } = C2D;
    // === 11a. A door dropped on a boundary run defaults to 'gate' ==========
    // The drop sites (onCanvasClick's `door` tool + the doorMove release) gate
    // on isFenceLikeKind(nearestWallKind(...)). Railing joined that set: a
    // 914 mm banister can only sensibly host a gate, and the 3D gate now styles
    // itself to a railing host (§10b), so the default lands the right look.
    {
      const { nearestWallKind, isFenceLikeKind } = C2D;
      const nwFloor = (kind) => ({ walls: [{ id: 'w1', kind, points: [{ x: 500, y: wallY }, { x: 11500, y: wallY }] }] });
      ok('nwk_railing', nearestWallKind(nwFloor('railing'), 6000, wallY) === 'railing');
      ok('nwk_out_of_reach', nearestWallKind(nwFloor('railing'), 6000, wallY + 900) === null);
      ok('fencelike_railing', isFenceLikeKind('railing') === true);
      ok('fencelike_fences', ['fence_picket', 'fence_privacy', 'fence_chainlink', 'hedge']
        .every(k => isFenceLikeKind(k) === true));
      // House structure must NOT auto-gate (a door in a wall stays a door).
      ok('fencelike_not_house', ['full', 'half', 'invisible']
        .every(k => isFenceLikeKind(k) === false) && isFenceLikeKind(null) === false);
    }

    const sleep = ms => new Promise(res => setTimeout(res, ms));
    const waitFor = async (cond, tries = 600) => {
      for (let i = 0; i < tries; i++) { if (cond()) return true; await sleep(4); } return false;
    };
    class FakeHa {
      constructor(seed) { this.map = new Map(Object.entries(seed || {})); this.states = {}; this._s = []; this._c = []; }
      connect() { for (const cb of this._c) cb('connected'); for (const cb of this._s) cb(this.states, undefined); }
      onState(fn) { this._s.push(fn); } onConn(fn) { this._c.push(fn); }
      callService() { return Promise.resolve(); }
      async getHistory() { return {}; } async getWeatherForecasts() { return null; }
      async getDevices() { return []; } async getEntityRegistry() { return []; } async updateEntityRegistry() { return true; }
      async getUserData(k) { return this.map.has(k) ? JSON.parse(JSON.stringify(this.map.get(k))) : null; }
      async setUserData(k, v) { this.map.set(k, JSON.parse(JSON.stringify(v))); return true; }
      async refreshStates() {} async subscribeMqtt() { return () => {}; } async publishMqtt() {}
    }
    localStorage.removeItem('diorama:store:v1'); localStorage.removeItem('diorama:configs');
    const seedFloor = { id: 'f1', name: 'Yard', w: 12000, d: 5000,
      walls: [{ id: 'w1', kind: 'fence_picket', points: [{ x: 500, y: wallY }, { x: 11500, y: wallY }] }],
      furniture: [], lights: [], switches: [], sensors: [], motionSensors: [],
      envSensors: [], bleProxies: [], doors: [], windows: [], rooms: [], bg: null };
    const P = new Planner();
    P.connectWith(new FakeHa({ diorama: { v: 2, floors: [seedFloor], currentFloorId: 'f1',
      activeSensorId: null, coverage: false, imperial: false, showDetails: false, useRawTargets: false } }));
    await waitFor(() => P.configIndex !== null);
    const cvs = document.createElement('canvas'); cvs.width = 900; cvs.height = 500;
    const ctx2 = cvs.getContext('2d', { willReadFrequently: true });
    const view2 = computeView(cvs, 12000, 5000, null, 1);
    const gate2 = { id: 'g2d', x: 5550, y: wallY, w: 900, rotation: 0, kind: 'gate', entity_id: null, label: '' };
    const paint = (kind, doors) => {
      const f = P.floor();
      f.walls = kind ? [{ id: 'w1', kind, points: [{ x: 500, y: wallY }, { x: 11500, y: wallY }] }] : [];
      f.doors = doors;
      drawAll(ctx2, P, view2, null);
      return ctx2.getImageData(0, 0, cvs.width, cvs.height).data.slice();
    };
    // Pixel band across the MIDDLE of the gate opening (world x 5700..6300),
    // ±6 px of the wall line — inside the opening, clear of the end posts.
    const b0 = mmToPx(view2, 5700, wallY), b1 = mmToPx(view2, 6300, wallY);
    const bandDiff = (a, b) => {
      let nDiff = 0;
      for (let yy = Math.round(b0.y) - 6; yy <= Math.round(b0.y) + 6; yy++)
        for (let xx = Math.round(b0.x); xx <= Math.round(b1.x); xx++) {
          const i = (yy * cvs.width + xx) * 4;
          if (a[i] !== b[i] || a[i + 1] !== b[i + 1] || a[i + 2] !== b[i + 2]) nDiff++;
        }
      return nDiff;
    };
    // The band compares FENCE pixels, not edit affordances — since the
    // vertex-insert batch, edit+Select paints a midpoint "+" insert handle on
    // every unlocked wall, and this wall's single-edge midpoint (x 6000) lands
    // inside the gate band. Sample with a non-Select tool so only the fence
    // geometry differs between the with-wall and no-wall paints.
    P.tool = 'delete';
    // `railing` is in the matrix as a REGRESSION PIN, not a bug repro: drawWalls
    // already stroked only the solid sub-intervals and its baluster ticks already
    // carried the shared `inSolid` guard, so 2D was correct while 3D ran the
    // banister straight through the gate (§10).
    for (const kind of ['fence_picket', 'fence_privacy', 'fence_chainlink', 'hedge', 'railing']) {
      const control = bandDiff(paint(kind, []), paint(null, []));
      const gated = bandDiff(paint(kind, [gate2]), paint(null, [gate2]));
      ok(`gap2d_control_${kind}`, control > 20, String(control));
      ok(`gap2d_clear_${kind}`, gated === 0, String(gated));
    }
    P.tool = 'select';
  }

  const n = results.length, pcount = results.filter(x => x.startsWith('ok')).length;
  const pass = pcount === n;
  document.title = `FENCEGATE ${pass ? 'PASS' : 'FAIL'} ${pcount}/${n} ${results.filter(x=>x.startsWith('FAIL')).join(' ')}`;
  document.body.insertAdjacentHTML('beforeend',
    `<pre style="position:fixed;left:8px;top:8px;color:#8f8">${document.title}\n${results.join('\n')}</pre>`);
  r.applyViewPreset('iso');
 } catch (e) { document.title = 'ERR: ' + (e && e.stack ? e.stack.split('\n').slice(0,4).join(' | ') : e); }
</script>
