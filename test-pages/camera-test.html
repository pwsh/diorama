<!doctype html>
<meta charset="utf-8">
<title>CAMERA …</title>
<style>
  html,body{margin:0;background:#0b0f14;color:#cfd8dc;font:13px/1.4 sans-serif}
  #c{width:1000px;height:640px}
  #log{position:fixed;right:8px;top:8px;width:380px;max-height:96vh;overflow:auto;
       background:#111820;border:1px solid #263340;border-radius:6px;padding:8px 10px;font-size:11px}
  .pass{color:#69f0ae}.fail{color:#ff5252}.hd{font-weight:bold;margin:2px 0 6px}
</style>
<div id="c"></div>
<div id="log"></div>
<!-- Harness build (from the repo root; NEVER reuse stale bundles):
       npm run build
       H=/tmp/diorama-harness-camera
       rm -rf "$H"; mkdir -p "$H"
       cp -r dist/* "$H"/; cp test-pages/camera-test.html "$H"/
       npx esbuild src/geometry.ts --bundle --format=esm --outfile="$H"/geometry.mod.js
     Run headless (serve over http — Chrome blocks dynamic module imports on file://):
       (cd "$H" && python3 -m http.server 8811 &)
       google-chrome --headless=new --disable-gpu --enable-unsafe-swiftshader \
         --window-size=1280,880 --virtual-time-budget=15000 --dump-dom \
         "http://localhost:8811/camera-test.html?b=$RANDOM" | grep -o "<title>[^<]*"  -->
<script type="module">
  // Renderer-harness camera test: below-horizon polar cap, independent H/V FOV,
  // and the central camera-pivot policy (Scene3D.cameraPivot).
  // Whole body is synchronous after load() so no background _animate RAF can
  // interleave — every read reflects only manual setter calls.
  const mod = await import('./assets/three-renderer.js?v=' + Date.now());
  const { floorsUnionCenter, resolvePivotMode } = await import('./geometry.mod.js?v=' + Date.now());
  const r = new mod.ThreeDRenderer(document.getElementById('c'));
  await r.load();

  const floor = {
    id: 'f1', name: 'T', w: 10000, d: 8000,
    walls: [{ id: 'w', points: [{x:200,y:200},{x:9800,y:200},{x:9800,y:7800},{x:200,y:7800},{x:200,y:200}] }],
    furniture: [], lights: [], switches: [], sensors: [], motionSensors: [],
    envSensors: [], doors: [], windows: [], bg: null, model3d: null, look3d: null,
  };
  r.updateFloor(floor, { preset: 'day', floorColor: '#8a7860', floorTex: 'wood', wallColor: '#cfd2d6' });

  const tests = [];
  const ok = (name, cond, detail) => tests.push({ name, ok: !!cond, detail: detail ?? '' });
  const near = (a, b, eps) => Math.abs(a - b) <= eps;
  const D2R = Math.PI / 180;
  // Horizontal FOV back-computed from vertical fov + aspect (deg).
  const hFovOf = (cam) => 2 * Math.atan(cam.aspect * Math.tan(cam.fov / 2 * D2R)) / D2R;

  // 1. below-horizon polar cap
  r.setBelowHorizon(true);
  ok('belowHorizon(true) → maxPolar ≈ π−0.02',
     near(r._controls.maxPolarAngle, Math.PI - 0.02, 1e-6),
     `mp=${r._controls.maxPolarAngle.toFixed(4)}`);
  r.setBelowHorizon(false);
  ok('belowHorizon(false) → maxPolar ≈ π·0.49',
     near(r._controls.maxPolarAngle, Math.PI * 0.49, 1e-6),
     `mp=${r._controls.maxPolarAngle.toFixed(4)}`);

  // 2. auto FOV after a resize follows the canvas aspect
  r.resize(1600, 900);
  r.setFov(50, null);
  ok('setFov(50,null) after resize(1600,900) → aspect ≈ 1600/900',
     near(r._camera.aspect, 1600 / 900, 1e-4) && r._camera.fov === 50,
     `aspect=${r._camera.aspect.toFixed(4)} fov=${r._camera.fov}`);

  // 3. custom H FOV: setFov(50,90) → aspect = tan(45°)/tan(25°) ≈ 2.1445
  r.setFov(50, 90);
  const wantA = Math.tan(45 * D2R) / Math.tan(25 * D2R);
  ok('setFov(50,90) → aspect ≈ 2.1445',
     near(r._camera.aspect, wantA, 1e-3) && r._camera.fov === 50,
     `aspect=${r._camera.aspect.toFixed(4)} want=${wantA.toFixed(4)}`);
  ok('setFov(50,90) → back-computed hFov ≈ 90°',
     near(hFovOf(r._camera), 90, 0.5), `hFov=${hFovOf(r._camera).toFixed(3)}`);

  // 4. setFov(60,60) → aspect = tan(30)/tan(30) = 1.0
  r.setFov(60, 60);
  ok('setFov(60,60) → aspect ≈ 1.0',
     near(r._camera.aspect, 1.0, 1e-3) && r._camera.fov === 60,
     `aspect=${r._camera.aspect.toFixed(5)}`);

  // 5. custom H FOV survives a resize; then auto restores it
  r.setFov(50, 90);
  r.resize(800, 1200);
  ok('custom H FOV survives resize(800,1200) → aspect STILL ≈ 2.1445 (not 800/1200)',
     near(r._camera.aspect, wantA, 1e-3) && !near(r._camera.aspect, 800 / 1200, 1e-2),
     `aspect=${r._camera.aspect.toFixed(4)}`);
  r.setFov(50, null);
  ok('setFov(50,null) + same canvas → aspect ≈ 800/1200 (auto restored)',
     near(r._camera.aspect, 800 / 1200, 1e-4),
     `aspect=${r._camera.aspect.toFixed(4)}`);

  // 6. clamps: fovV ≥ 10, fovH ≤ 150
  r.setFov(5, 200);
  const clampedH = 2 * Math.atan(r._camera.aspect * Math.tan(r._camera.fov / 2 * D2R)) / D2R;
  ok('setFov(5,200) → fov clamped ≥ 10', r._camera.fov >= 10 && r._camera.fov === 10,
     `fov=${r._camera.fov}`);
  ok('setFov(5,200) → hFov clamped ≤ 150', near(clampedH, 150, 0.5),
     `hFov=${clampedH.toFixed(2)}`);

  // 7. applyViewPreset must NOT touch fov/aspect
  r.setFov(50, 90);
  const preFov = r._camera.fov, preAspect = r._camera.aspect;
  r.applyViewPreset('iso');
  ok('applyViewPreset(iso) does not change fov',
     r._camera.fov === preFov, `fov=${r._camera.fov} pre=${preFov}`);
  ok('applyViewPreset(iso) does not change aspect',
     near(r._camera.aspect, preAspect, 1e-9), `aspect=${r._camera.aspect} pre=${preAspect}`);

  // ── 8. camera pivot policy (Scene3D.pivotLocked / .freeMovement) ──────────
  const ctrl = r._controls, cam = r._camera;
  // Deterministic frame driver: the RAF's _animate also calls _updateCameraPivot,
  // but this whole body is synchronous so no frame can interleave here.
  const advance = (n, dt = 1 / 60) => { for (let i = 0; i < n; i++) r._updateCameraPivot(dt); };
  const putTarget = (x, z) => {   // move ONLY the target (simulating a drifted pivot)
    ctrl.target.x = x; ctrl.target.z = z;
  };
  const offsetOf = () => ({ x: cam.position.x - ctrl.target.x,
                            y: cam.position.y - ctrl.target.y,
                            z: cam.position.z - ctrl.target.z });

  // 8a. mode drives OrbitControls panning (covers mouse pan AND 2-finger touch)
  r.setCameraPivot(true, false, 0, 0);
  ok('setCameraPivot(center) → controls.enablePan false', ctrl.enablePan === false,
     `enablePan=${ctrl.enablePan}`);
  r.setCameraPivot(false, true, 0, 0);
  ok('setCameraPivot(free) → controls.enablePan true', ctrl.enablePan === true,
     `enablePan=${ctrl.enablePan}`);

  // 8b. free mode does NOT enforce — a drifted target stays where it is
  putTarget(3000, -2400);
  advance(60);
  ok('free mode: drifted target is left alone',
     near(ctrl.target.x, 3000, 1e-6) && near(ctrl.target.z, -2400, 1e-6),
     `t=(${ctrl.target.x.toFixed(1)},${ctrl.target.z.toFixed(1)})`);

  // 8c. centre mode eases a drifted target home, preserving the camera offset
  r.setCameraPivot(true, false, 0, 0);
  putTarget(3000, -2400);
  ctrl.target.y = 600;
  const off0 = offsetOf();
  advance(400);                                   // ~6.7 s at 60 fps (τ ≈ 0.5 s) → inside the 1 mm snap
  ok('centre mode: target x/z converge to the pivot',
     Math.abs(ctrl.target.x) < 1 && Math.abs(ctrl.target.z) < 1,
     `t=(${ctrl.target.x.toFixed(3)},${ctrl.target.z.toFixed(3)})`);
  const off1 = offsetOf();
  ok('centre mode: camera→target offset preserved through the ease',
     near(off1.x, off0.x, 1e-6) && near(off1.y, off0.y, 1e-6) && near(off1.z, off0.z, 1e-6),
     `d=(${(off1.x-off0.x).toExponential(1)},${(off1.y-off0.y).toExponential(1)},${(off1.z-off0.z).toExponential(1)})`);
  ok('centre mode: target.y untouched by the ease', near(ctrl.target.y, 600, 1e-9),
     `y=${ctrl.target.y}`);

  // 8d. a non-zero pivot (the glass-house union centre case) is honoured
  r.setCameraPivot(true, false, 900, -400);
  putTarget(0, 0);
  advance(400);
  ok('centre mode: eases to a non-zero pivot',
     near(ctrl.target.x, 900, 1) && near(ctrl.target.z, -400, 1),
     `t=(${ctrl.target.x.toFixed(2)},${ctrl.target.z.toFixed(2)})`);

  // 8e. self-guard: repeating the same call mid-ease must not reset progress
  r.setCameraPivot(true, false, 0, 0);
  putTarget(4000, 0);
  advance(6);                                     // partway home
  const mid = ctrl.target.x;
  r.setCameraPivot(true, false, 0, 0);               // identical args, twice
  r.setCameraPivot(true, false, 0, 0);
  ok('self-guard: repeat setCameraPivot does not reset an in-flight ease',
     near(ctrl.target.x, mid, 1e-9) && ctrl.enablePan === false && mid < 4000 && mid > 0,
     `mid=${mid.toFixed(1)}`);
  advance(400);
  ok('self-guard: ease still completes after the repeat calls',
     Math.abs(ctrl.target.x) < 1, `x=${ctrl.target.x.toFixed(3)}`);

  // 8f. precedence: auto-follow owns the target, so enforcement yields to it
  r.setAutoFollow(true);
  putTarget(2500, 1500);
  advance(60);
  ok('auto-follow wins: pivot enforcement leaves the target alone',
     near(ctrl.target.x, 2500, 1e-6) && near(ctrl.target.z, 1500, 1e-6),
     `t=(${ctrl.target.x.toFixed(1)},${ctrl.target.z.toFixed(1)})`);
  ok('auto-follow: panning still disabled in centre mode', ctrl.enablePan === false,
     `enablePan=${ctrl.enablePan}`);
  r.setAutoFollow(false);

  // 8g. precedence: cinematic orbit likewise owns the orbit centre
  r.setCinematicOrbit(true);
  putTarget(-1800, 700);
  advance(60);
  ok('cinematic orbit wins: pivot enforcement leaves the target alone',
     near(ctrl.target.x, -1800, 1e-6) && near(ctrl.target.z, 700, 1e-6),
     `t=(${ctrl.target.x.toFixed(1)},${ctrl.target.z.toFixed(1)})`);
  r.setCinematicOrbit(false);
  advance(400);
  ok('enforcement resumes once cinematic orbit is off', Math.abs(ctrl.target.x) < 1,
     `x=${ctrl.target.x.toFixed(3)}`);

  // ── 9. pure floorsUnionCenter ─────────────────────────────────────────────
  const uc = floorsUnionCenter([{ w: 10000, d: 8000 }, { w: 6000, d: 12000 }]);
  ok('floorsUnionCenter: multi-floor differing dims → max/2',
     uc.x === 5000 && uc.y === 6000, `(${uc.x},${uc.y})`);
  const us = floorsUnionCenter([{ w: 7000, d: 3000 }]);
  ok('floorsUnionCenter: single floor → its own centre',
     us.x === 3500 && us.y === 1500, `(${us.x},${us.y})`);
  const ue = floorsUnionCenter([]);
  ok('floorsUnionCenter: empty list → origin', ue.x === 0 && ue.y === 0, `(${ue.x},${ue.y})`);

  // ── 10. pure resolvePivotMode (two booleans + deprecated enum fallback) ────
  const pvEq = (got, l, f) => got.locked === l && got.free === f;
  const pvS = (g) => `locked=${g.locked} free=${g.free}`;
  ok('resolvePivotMode: undefined → locked, not free (the default)',
     pvEq(resolvePivotMode(undefined), true, false), pvS(resolvePivotMode(undefined)));
  ok('resolvePivotMode: empty scene3d → locked, not free',
     pvEq(resolvePivotMode({}), true, false), pvS(resolvePivotMode({})));
  ok('resolvePivotMode: pivotLocked:false alone → unlocked, not free',
     pvEq(resolvePivotMode({ pivotLocked: false }), false, false),
     pvS(resolvePivotMode({ pivotLocked: false })));
  ok('resolvePivotMode: freeMovement:true alone → locked AND free (the new mode)',
     pvEq(resolvePivotMode({ freeMovement: true }), true, true),
     pvS(resolvePivotMode({ freeMovement: true })));
  ok('resolvePivotMode: both explicit → unlocked + free',
     pvEq(resolvePivotMode({ pivotLocked: false, freeMovement: true }), false, true),
     pvS(resolvePivotMode({ pivotLocked: false, freeMovement: true })));
  ok('resolvePivotMode: legacy cameraPivot:free migrates to unlocked + free',
     pvEq(resolvePivotMode({ cameraPivot: 'free' }), false, true),
     pvS(resolvePivotMode({ cameraPivot: 'free' })));
  ok('resolvePivotMode: legacy cameraPivot:center migrates to locked, not free',
     pvEq(resolvePivotMode({ cameraPivot: 'center' }), true, false),
     pvS(resolvePivotMode({ cameraPivot: 'center' })));
  ok('resolvePivotMode: new pivotLocked WINS over a stale legacy free',
     pvEq(resolvePivotMode({ cameraPivot: 'free', pivotLocked: true }), true, false),
     pvS(resolvePivotMode({ cameraPivot: 'free', pivotLocked: true })));
  ok('resolvePivotMode: new freeMovement WINS over a stale legacy center',
     pvEq(resolvePivotMode({ cameraPivot: 'center', freeMovement: true }), true, true),
     pvS(resolvePivotMode({ cameraPivot: 'center', freeMovement: true })));

  // ── 11. the four combinations drive pan / rotate per the matrix ───────────
  r.setAutoFollow(false); r.setCinematicOrbit(false);
  const flags = (locked, free) => { r.setCameraPivot(locked, free, 0, 0);
                                    return `pan=${ctrl.enablePan} rot=${ctrl.enableRotate}`; };
  let f1 = flags(true, false);
  ok('matrix locked+!free: pan off, stock rotate on',
     ctrl.enablePan === false && ctrl.enableRotate === true, f1);
  let f2 = flags(true, true);
  ok('matrix locked+free: pan ON, stock rotate OFF (we drive rotation)',
     ctrl.enablePan === true && ctrl.enableRotate === false, f2);
  let f3 = flags(false, true);
  ok('matrix !locked+free: classic — pan on, stock rotate on',
     ctrl.enablePan === true && ctrl.enableRotate === true, f3);
  let f4 = flags(false, false);
  ok('matrix !locked+!free: pan off, stock rotate on',
     ctrl.enablePan === false && ctrl.enableRotate === true, f4);

  // ── 12. locked+free rigid rotation about the plan-centre pivot ────────────
  // A non-trivial (glass-house-ish) pivot. PY is the pivot HEIGHT — every pose
  // below parks target.y there, which is the height `_applyPivotRotate` uses by
  // default (and the gesture captures at pointerdown).
  const PX = 900, PZ = -400, PY = 600;
  const setPose = (cx, cy, cz, tx, ty, tz) => {
    cam.position.set(cx, cy, cz); ctrl.target.set(tx, ty, tz);
    r.setCameraPivot(true, true, PX, PZ);
  };
  const azOf = (o) => Math.atan2(o.x - PX, o.z - PZ);          // about the pivot's vertical axis
  const hRadOf = (o) => Math.hypot(o.x - PX, o.z - PZ);
  const distP = (o) => Math.hypot(o.x - PX, o.y - PY, o.z - PZ);
  const sep = () => Math.hypot(cam.position.x - ctrl.target.x,
                               cam.position.y - ctrl.target.y,
                               cam.position.z - ctrl.target.z);

  // 12a. PURE AZIMUTH on a PANNED pose (target deliberately off the pivot).
  setPose(6000, 4200, 5200, 2600, 600, 1800);
  const sep0 = sep(), camH0 = hRadOf(cam.position), tgtH0 = hRadOf(ctrl.target);
  const camAz0 = azOf(cam.position), tgtAz0 = azOf(ctrl.target), tgtY0 = ctrl.target.y;
  const DAZ = 0.37;
  r._applyPivotRotate(DAZ, 0);
  ok('locked+free azimuth: camera→target separation preserved',
     near(sep(), sep0, 1e-6), `sep=${sep().toFixed(6)} was ${sep0.toFixed(6)}`);
  ok('locked+free azimuth: camera distance to the pivot AXIS preserved',
     near(hRadOf(cam.position), camH0, 1e-6),
     `r=${hRadOf(cam.position).toFixed(6)} was ${camH0.toFixed(6)}`);
  ok('locked+free azimuth: the PANNED target keeps its pivot-axis distance too',
     near(hRadOf(ctrl.target), tgtH0, 1e-6),
     `r=${hRadOf(ctrl.target).toFixed(6)} was ${tgtH0.toFixed(6)}`);
  ok('locked+free azimuth: camera azimuth about the PIVOT advances by exactly dAz',
     near(azOf(cam.position) - camAz0, DAZ, 1e-9),
     `d=${(azOf(cam.position) - camAz0).toFixed(9)}`);
  ok('locked+free azimuth: the target rotates rigidly by the same dAz',
     near(azOf(ctrl.target) - tgtAz0, DAZ, 1e-9),
     `d=${(azOf(ctrl.target) - tgtAz0).toFixed(9)}`);
  ok('locked+free azimuth: heights untouched (y is the rotation axis)',
     near(ctrl.target.y, tgtY0, 1e-9) && near(cam.position.y, 4200, 1e-9),
     `ty=${ctrl.target.y} cy=${cam.position.y}`);

  // 12b. COMBINED az+polar: rigid ⇒ every distance to the pivot POINT is kept.
  setPose(6000, 4200, 5200, 2600, 600, 1800);
  const dc0 = distP(cam.position), dt0 = distP(ctrl.target), s0 = sep();
  r._applyPivotRotate(-0.21, 0.13);
  ok('locked+free rigid: |camera − pivot| preserved',
     near(distP(cam.position), dc0, 1e-6), `d=${distP(cam.position).toFixed(6)} was ${dc0.toFixed(6)}`);
  ok('locked+free rigid: |target − pivot| preserved',
     near(distP(ctrl.target), dt0, 1e-6), `d=${distP(ctrl.target).toFixed(6)} was ${dt0.toFixed(6)}`);
  ok('locked+free rigid: camera→target separation preserved',
     near(sep(), s0, 1e-6), `sep=${sep().toFixed(6)} was ${s0.toFixed(6)}`);
  // …and the camera still LOOKS at the target once OrbitControls settles.
  ctrl.update();
  const fwd = new (cam.position.constructor)();
  cam.getWorldDirection(fwd);
  const want = { x: ctrl.target.x - cam.position.x, y: ctrl.target.y - cam.position.y,
                 z: ctrl.target.z - cam.position.z };
  const wl = Math.hypot(want.x, want.y, want.z);
  ok('locked+free rigid: camera still looks at the target after controls.update()',
     near(fwd.x, want.x / wl, 1e-4) && near(fwd.y, want.y / wl, 1e-4) && near(fwd.z, want.z / wl, 1e-4),
     `fwd=(${fwd.x.toFixed(4)},${fwd.y.toFixed(4)},${fwd.z.toFixed(4)})`);

  // 12c. POLAR CLAMP — a huge delta is REDUCED, never wrapped past the caps.
  const polarOf = () => Math.atan2(Math.hypot(cam.position.x - PX, cam.position.z - PZ),
                                   cam.position.y - PY);
  r.setBelowHorizon(false);                     // maxPolarAngle = π·0.49
  setPose(6000, 4200, 5200, 2600, 600, 1800);
  r._applyPivotRotate(0, +9);                   // wildly overshoot toward the horizon
  ok('polar clamp: a huge downward delta stops at controls.maxPolarAngle',
     polarOf() <= ctrl.maxPolarAngle + 1e-6 && polarOf() > ctrl.maxPolarAngle - 1e-6,
     `phi=${polarOf().toFixed(6)} max=${ctrl.maxPolarAngle.toFixed(6)}`);
  setPose(6000, 4200, 5200, 2600, 600, 1800);
  r._applyPivotRotate(0, -9);                   // wildly overshoot toward the pole
  ok('polar clamp: a huge upward delta stops at the 0.05 rad floor',
     near(polarOf(), 0.05, 1e-6), `phi=${polarOf().toFixed(6)}`);
  r.setBelowHorizon(true);                      // the clamp must FOLLOW the setting
  setPose(6000, 4200, 5200, 2600, 600, 1800);
  r._applyPivotRotate(0, +9);
  ok('polar clamp: honours belowHorizon (clamps at π−0.02, not π·0.49)',
     near(polarOf(), Math.PI - 0.02, 1e-6), `phi=${polarOf().toFixed(6)}`);
  r.setBelowHorizon(false);

  // 12d. locked+FREE must NOT ease the target home — the pan is the point.
  r.setCameraPivot(true, true, 0, 0);
  putTarget(3000, -2400);
  advance(400);
  ok('locked+free: the panned target is NOT eased back to the pivot',
     near(ctrl.target.x, 3000, 1e-6) && near(ctrl.target.z, -2400, 1e-6),
     `t=(${ctrl.target.x.toFixed(1)},${ctrl.target.z.toFixed(1)})`);
  // …while locked+!free still does (the mode flip is the only difference).
  r.setCameraPivot(true, false, 0, 0);
  advance(400);
  ok('locked+!free: the same drifted target IS eased home',
     Math.abs(ctrl.target.x) < 1 && Math.abs(ctrl.target.z) < 1,
     `t=(${ctrl.target.x.toFixed(3)},${ctrl.target.z.toFixed(3)})`);

  // 12e. the real pointer gesture: a left drag rotates only in locked+free, is
  // abandoned once a second finger lands, and pauses auto-follow.
  // NB OrbitControls' own pointerdown calls `setPointerCapture(pointerId)`,
  // which THROWS NotFoundError for a synthetic pointer id (no active pointer).
  // The console therefore shows a few of those here — expected, harness-only,
  // and harmless: an exception in one listener never stops the others, so our
  // rotate handler still runs (it takes no capture of its own). It also means
  // OrbitControls does nothing at all for these events, which isolates the
  // assertions below to our handler.
  const dom = r._renderer.domElement;
  const pev = (type, id, x, y, extra = {}) => {
    try {
      dom.dispatchEvent(new PointerEvent(type, {
        pointerId: id, clientX: x, clientY: y, button: 0, buttons: 1,
        pointerType: 'mouse', bubbles: true, ...extra }));
    } catch (e) { /* OrbitControls' setPointerCapture on a synthetic id — ignore */ }
  };
  const dragAz = () => {
    setPose(6000, 4200, 5200, 2600, 600, 1800);
    const a0 = azOf(cam.position);
    pev('pointerdown', 7, 500, 300); pev('pointermove', 7, 560, 300); pev('pointerup', 7, 560, 300);
    return azOf(cam.position) - a0;
  };
  r._followPauseUntil = 0;
  const dAzDrag = dragAz();
  ok('gesture: a left drag RIGHT rotates the view about the pivot (azimuth falls)',
     dAzDrag < -1e-4, `dAz=${dAzDrag.toFixed(5)}`);
  ok('gesture: a rotate drag pauses auto-follow / cinematic (6 s window)',
     r._followPauseUntil > performance.now() / 1000 + 4, `until=${r._followPauseUntil.toFixed(2)}`);
  // A second pointer hands the gesture back to OrbitControls' 2-finger dolly/pan.
  setPose(6000, 4200, 5200, 2600, 600, 1800);
  const az2 = azOf(cam.position);
  pev('pointerdown', 8, 500, 300); pev('pointerdown', 9, 700, 300);
  pev('pointermove', 8, 620, 300);
  ok('gesture: a second pointer abandons the custom rotate',
     near(azOf(cam.position), az2, 1e-12), `d=${(azOf(cam.position) - az2).toExponential(1)}`);
  pev('pointerup', 8, 620, 300); pev('pointerup', 9, 700, 300);
  // …and the gesture is inert in every other combination.
  cam.position.set(6000, 4200, 5200); ctrl.target.set(2600, 600, 1800);
  r.setCameraPivot(false, true, PX, PZ);
  const az3 = azOf(cam.position);
  pev('pointerdown', 10, 500, 300); pev('pointermove', 10, 600, 300); pev('pointerup', 10, 600, 300);
  ok('gesture: inert in !locked+free (OrbitControls owns rotation there)',
     near(azOf(cam.position), az3, 1e-12), `d=${(azOf(cam.position) - az3).toExponential(1)}`);
  r.setCameraPivot(true, false, 0, 0);

  // 13. cameraGestures() — the "the user has posed the camera" signal three-view
  // uses to disarm its boot re-framing latch. It must count BOTH OrbitControls'
  // own gestures AND the custom locked-pivot rotate (which surrenders
  // OrbitControls' rotate, so its 'start' never fires for that drag).
  ok('gestures: cameraGestures() is exposed', typeof r.cameraGestures === 'function');
  const g0 = r.cameraGestures();
  r._controls.dispatchEvent({ type: 'start' });
  ok('gestures: an OrbitControls gesture increments the counter',
     r.cameraGestures() === g0 + 1, `${g0} → ${r.cameraGestures()}`);
  // The custom rotate only runs in locked+free; drive one real pointer drag.
  r.setCameraPivot(true, true, PX, PZ);
  const g1 = r.cameraGestures();
  pev('pointerdown', 11, 500, 300); pev('pointermove', 11, 560, 300); pev('pointerup', 11, 560, 300);
  ok('gestures: the custom locked-pivot rotate also counts',
     r.cameraGestures() === g1 + 1, `${g1} → ${r.cameraGestures()}`);
  const g2 = r.cameraGestures();
  r.applyViewPreset('iso');
  r.setCameraView([1000, 2000, 3000], [0, 0, 0]);
  ok('gestures: programmatic poses (presets / saved views / boot framing) do NOT count',
     r.cameraGestures() === g2, `${g2} → ${r.cameraGestures()}`);
  r.setCameraPivot(true, false, 0, 0);

  // 14. The boot framing the fix relies on: applyViewPreset('iso') frames off
  // the CURRENT floor rect, so a bigger plan is viewed from further out. The
  // renderer's constructor pose (0, 9000, −6000) is rect-independent — that is
  // precisely what read as "zoomed in a lot" on any house bigger than ~8 m.
  const isoDist = () => {
    r.applyViewPreset('iso');
    return Math.hypot(cam.position.x - ctrl.target.x,
                      cam.position.y - ctrl.target.y,
                      cam.position.z - ctrl.target.z);
  };
  // Both rects stay under controls.maxDistance (45000) so the ratio is clean —
  // `setCameraView` runs controls.update(), which WOULD clamp a longer pull-back.
  const smallD = isoDist();                                  // floor is 10000 × 8000
  const bigFloor = { ...floor, w: 20000, d: 16000 };
  r.updateFloor(bigFloor, { preset: 'day', floorColor: '#8a7860', floorTex: 'wood', wallColor: '#cfd2d6' });
  const bigD = isoDist();
  ok('boot framing: iso distance scales with the floor rect',
     near(bigD / smallD, 2, 1e-6), `${smallD.toFixed(0)} → ${bigD.toFixed(0)}`);
  const CTOR_DIST = Math.hypot(0, 9000, -6000);              // the old fixed boot pose
  ok('boot framing: the old fixed constructor pose was much closer than iso on a big plan',
     bigD > CTOR_DIST * 3, `iso=${bigD.toFixed(0)} ctor=${CTOR_DIST.toFixed(0)}`);
  r.updateFloor(floor, { preset: 'day', floorColor: '#8a7860', floorTex: 'wood', wallColor: '#cfd2d6' });

  // ── 15. pointer-ray wheel zoom (Scene3D.zoomToCursor) ─────────────────────
  // The reporting user's geometry: a big plot where the pivot is nowhere near
  // what you want to look at. OrbitControls' dolly step is proportional to the
  // distance to `controls.target`, so with the pivot welded to the plan centre
  // the apparent size of anything else stops growing (measured: a rear-yard
  // subject went 3.68 %/tick → 0.93 %/tick and bottomed out 19.8 m away). The
  // option makes the step a fraction of the distance to WHAT IS UNDER THE
  // POINTER instead, which is scale-free.
  const bigW = 32000, bigD2 = 52200;
  const bigPlot = { ...floor, w: bigW, d: bigD2 };
  r.updateFloor(bigPlot, { preset: 'day', floorColor: '#8a7860', floorTex: 'wood', wallColor: '#cfd2d6' });
  const HALF = { halfW: bigW / 2, halfD: bigD2 / 2 };
  const wpt = (wx, wy) => ({ x: bigW / 2 - wx, y: 0, z: wy - bigD2 / 2 });
  const dist3 = (a, b) => Math.hypot(a.x - b.x, a.y - b.y, a.z - b.z);
  const cdom = r._renderer.domElement;
  // Project a world point to client px through the SAME basis the camera uses.
  // right = cross(forward, worldUp) — getting that handedness backwards mirrors
  // the vertical axis and silently aims every "click" at the opposite end of
  // the plot, which is exactly how this was first mis-measured.
  const toClient = (pt) => {
    const P = cam.position, T = ctrl.target;
    const f = { x: T.x - P.x, y: T.y - P.y, z: T.z - P.z };
    const fl = Math.hypot(f.x, f.y, f.z); f.x /= fl; f.y /= fl; f.z /= fl;
    const rt = { x: -f.z, y: 0, z: f.x };
    const rl = Math.hypot(rt.x, rt.y, rt.z) || 1; rt.x /= rl; rt.y /= rl; rt.z /= rl;
    const up = { x: rt.y * f.z - rt.z * f.y, y: rt.z * f.x - rt.x * f.z, z: rt.x * f.y - rt.y * f.x };
    const v = { x: pt.x - P.x, y: pt.y - P.y, z: pt.z - P.z };
    const zz = v.x * f.x + v.y * f.y + v.z * f.z;
    const tn = Math.tan(cam.fov / 2 * D2R);
    const nx = (v.x * rt.x + v.y * rt.y + v.z * rt.z) / zz / (tn * cam.aspect);
    const ny = (v.x * up.x + v.y * up.y + v.z * up.z) / zz / tn;
    const rect = cdom.getBoundingClientRect();
    return { x: rect.left + (Math.max(-1, Math.min(1, nx)) + 1) / 2 * rect.width,
             y: rect.top + (1 - Math.max(-1, Math.min(1, ny))) / 2 * rect.height,
             nx, ny, front: zz > 0 };
  };
  // Self-check the harness projection before trusting anything it measures.
  r.setCameraPivot(true, false, 0, 0, HALF);
  r.applyViewPreset('front'); ctrl.update();
  {
    const nt = toClient({ x: ctrl.target.x, y: ctrl.target.y, z: ctrl.target.z });
    const nRear = toClient(wpt(16000, 45000)), nFront = toClient(wpt(16000, 1500));
    ok('15a harness: the target projects to the screen centre',
       Math.abs(nt.nx) < 1e-9 && Math.abs(nt.ny) < 1e-9, `(${nt.nx.toFixed(4)},${nt.ny.toFixed(4)})`);
    ok('15a harness: looking down from the front, the FAR end is above centre and the NEAR end below',
       nRear.ny > 0 && nFront.ny < 0, `rear=${nRear.ny.toFixed(3)} front=${nFront.ny.toFixed(3)}`);
  }
  const wheelAt = (pt, dy) => {
    const c = toClient(pt);
    cdom.dispatchEvent(new WheelEvent('wheel', { deltaY: dy, clientX: c.x, clientY: c.y,
                                                 bubbles: true, cancelable: true }));
  };
  // Drive 40 notches with the pointer held on `pt`; report the distance ratio.
  const zoomRun = (pt, zc, n = 40) => {
    r.setCameraPivot(true, false, 0, 0, { ...HALF, zoomToCursor: zc });
    r.applyViewPreset('front');
    for (let i = 0; i < 80; i++) { r._updateCameraPivot(1 / 60); ctrl.update(); }
    const d0 = dist3(cam.position, pt);
    const rates = [];
    for (let i = 0; i < n; i++) {
      const a = dist3(cam.position, pt);
      wheelAt(pt, -100);
      for (let k = 0; k < 12; k++) { r._updateCameraPivot(1 / 60); ctrl.update(); }
      rates.push(dist3(cam.position, pt) / a);
    }
    return { mag: d0 / dist3(cam.position, pt), rates,
             tgt: { x: ctrl.target.x, z: ctrl.target.z } };
  };
  const REAR = wpt(16000, 45000), CENTRE = wpt(16000, 26100);

  // 15b. OFF is exactly today: a rear subject's zoom decays, a centred one does not.
  const offRear = zoomRun(REAR, false), offMid = zoomRun(CENTRE, false);
  ok('15b OFF: a subject at the pivot magnifies far more than one at the rear',
     offMid.mag > offRear.mag * 3, `mid=${offMid.mag.toFixed(2)}x rear=${offRear.mag.toFixed(2)}x`);
  ok('15b OFF: the rear subject\u2019s per-notch growth DECAYS (the reported symptom)',
     (1 - offRear.rates[35]) < (1 - offRear.rates[0]) * 0.6,
     `first=${((1 - offRear.rates[0]) * 100).toFixed(2)}% last=${((1 - offRear.rates[35]) * 100).toFixed(2)}%`);
  ok('15b OFF: the pivot never moves', Math.hypot(offRear.tgt.x, offRear.tgt.z) < 1,
     `t=(${offRear.tgt.x.toFixed(2)},${offRear.tgt.z.toFixed(2)})`);

  // 15c. ON: the step is a constant fraction of the distance to the POINTED-AT
  // point, for every subject — that constancy IS the fix.
  const onRear = zoomRun(REAR, true), onMid = zoomRun(CENTRE, true);
  ok('15c ON: a rear subject magnifies as much as a centred one',
     Math.abs(onRear.mag / onMid.mag - 1) < 0.05,
     `rear=${onRear.mag.toFixed(2)}x mid=${onMid.mag.toFixed(2)}x`);
  ok('15c ON: the rear subject beats its own OFF magnification by a wide margin',
     onRear.mag > offRear.mag * 3, `${offRear.mag.toFixed(2)}x → ${onRear.mag.toFixed(2)}x`);
  {
    const lo = Math.min(...onRear.rates), hi = Math.max(...onRear.rates);
    ok('15c ON: the per-notch rate is constant across the whole run (no decay)',
       hi - lo < 0.004, `ratio ${lo.toFixed(4)}..${hi.toFixed(4)}`);
  }
  ok('15c ON: the pivot actually travelled toward the rear subject',
     Math.abs(onRear.tgt.z - REAR.z) < Math.abs(REAR.z) * 0.25,
     `tgt.z=${onRear.tgt.z.toFixed(0)} subject.z=${REAR.z.toFixed(0)}`);

  // 15d. CONTAINMENT — the whole reason this can ship under a LOCKED pivot.
  ok('15d ON: the zoom-driven pivot stays inside the plan rect',
     Math.abs(onRear.tgt.x) <= bigW / 2 + 1 && Math.abs(onRear.tgt.z) <= bigD2 / 2 + 1,
     `t=(${onRear.tgt.x.toFixed(0)},${onRear.tgt.z.toFixed(0)}) half=(${bigW / 2},${bigD2 / 2})`);
  // Aim well past the property: the pivot must stop at the boundary.
  r.setCameraPivot(true, false, 0, 0, { ...HALF, zoomToCursor: true });
  r.applyViewPreset('front');
  for (let i = 0; i < 80; i++) { r._updateCameraPivot(1 / 60); ctrl.update(); }
  for (let i = 0; i < 60; i++) {
    wheelAt(wpt(16000, bigD2 + 40000), -100);   // 40 m beyond the rear boundary
    for (let k = 0; k < 12; k++) { r._updateCameraPivot(1 / 60); ctrl.update(); }
  }
  ok('15d ON: aiming far beyond the plot still leaves the pivot on the plan',
     Math.abs(ctrl.target.x) <= bigW / 2 + 1 && Math.abs(ctrl.target.z) <= bigD2 / 2 + 1,
     `t=(${ctrl.target.x.toFixed(0)},${ctrl.target.z.toFixed(0)})`);
  // A drifted target is contained to the RECT (not welded to the centre) when on…
  r.setCameraPivot(true, false, 0, 0, { ...HALF, zoomToCursor: true });
  ctrl.target.set(3000, 600, 18900);
  const camBefore = cam.position.clone();
  advance(400);
  ok('15d ON: a target already INSIDE the plan is left completely alone',
     near(ctrl.target.x, 3000, 1e-9) && near(ctrl.target.z, 18900, 1e-9),
     `t=(${ctrl.target.x.toFixed(3)},${ctrl.target.z.toFixed(3)})`);
  ok('15d ON: and the camera is not translated either',
     cam.position.distanceTo(camBefore) < 1e-9, `d=${cam.position.distanceTo(camBefore).toExponential(1)}`);
  ctrl.target.set(bigW / 2 + 9000, 600, bigD2 / 2 + 9000);
  advance(600);
  ok('15d ON: a target OUTSIDE the plan is eased back to the rect corner',
     near(ctrl.target.x, bigW / 2, 1) && near(ctrl.target.z, bigD2 / 2, 1),
     `t=(${ctrl.target.x.toFixed(1)},${ctrl.target.z.toFixed(1)})`);
  // …and welded to the CENTRE when off — the default is untouched.
  r.setCameraPivot(true, false, 0, 0, { ...HALF, zoomToCursor: false });
  ctrl.target.set(3000, 600, 18900);
  advance(600);
  ok('15d OFF: the identical in-plan target is still welded to the plan centre',
     Math.abs(ctrl.target.x) < 1 && Math.abs(ctrl.target.z) < 1,
     `t=(${ctrl.target.x.toFixed(3)},${ctrl.target.z.toFixed(3)})`);

  // 15e. the option must be inert unless asked for — including for stale callers
  r.setCameraPivot(true, false, 0, 0, HALF);          // opts WITHOUT zoomToCursor
  {
    const t0 = { x: ctrl.target.x, z: ctrl.target.z };
    r.applyViewPreset('front');
    for (let i = 0; i < 80; i++) { r._updateCameraPivot(1 / 60); ctrl.update(); }
    for (let i = 0; i < 20; i++) { wheelAt(REAR, -100);
      for (let k = 0; k < 12; k++) { r._updateCameraPivot(1 / 60); ctrl.update(); } }
    ok('15e opts without the flag → the pivot still never moves',
       Math.hypot(ctrl.target.x, ctrl.target.z) < 1,
       `t=(${ctrl.target.x.toFixed(2)},${ctrl.target.z.toFixed(2)})`);
    void t0;
  }
  r.setCameraPivot(true, false, 0, 0);                // 4-arg stale caller
  r.applyViewPreset('front');
  for (let i = 0; i < 80; i++) { r._updateCameraPivot(1 / 60); ctrl.update(); }
  for (let i = 0; i < 20; i++) { wheelAt(REAR, -100);
    for (let k = 0; k < 12; k++) { r._updateCameraPivot(1 / 60); ctrl.update(); } }
  ok('15e a 4-arg (stale-chunk) caller gets today\u2019s behaviour exactly',
     Math.hypot(ctrl.target.x, ctrl.target.z) < 1,
     `t=(${ctrl.target.x.toFixed(2)},${ctrl.target.z.toFixed(2)})`);

  // 15f. free movement must NOT be clamped onto the plan — there the user is
  // deliberately allowed to leave it, so the lock's containment does not apply.
  r.setCameraPivot(true, true, 0, 0, { ...HALF, zoomToCursor: true });
  r.applyViewPreset('front');
  for (let i = 0; i < 80; i++) { r._updateCameraPivot(1 / 60); ctrl.update(); }
  for (let i = 0; i < 50; i++) {
    wheelAt(wpt(16000, bigD2 + 40000), -100);
    for (let k = 0; k < 12; k++) { r._updateCameraPivot(1 / 60); ctrl.update(); }
  }
  ok('15f free movement: the zoom pivot is allowed off the plan',
     Math.abs(ctrl.target.z) > bigD2 / 2, `t.z=${ctrl.target.z.toFixed(0)} half=${bigD2 / 2}`);

  // 15g. a wheel still counts as a hand-posed camera gesture (the boot-pose
  // latch in view-persist depends on this) and still pauses auto-follow.
  r.setCameraPivot(true, false, 0, 0, { ...HALF, zoomToCursor: true });
  {
    const g = r.cameraGestures();
    wheelAt(REAR, -100);
    ok('15g ON: a wheel notch counts as a camera gesture',
       r.cameraGestures() === g + 1, `${g} → ${r.cameraGestures()}`);
  }
  // 15h. zooming OUT is a plain reverse dolly — it must not drag the pivot.
  r.setCameraPivot(true, false, 0, 0, { ...HALF, zoomToCursor: true });
  r.applyViewPreset('front');
  for (let i = 0; i < 80; i++) { r._updateCameraPivot(1 / 60); ctrl.update(); }
  {
    const before = { x: ctrl.target.x, z: ctrl.target.z };
    for (let i = 0; i < 10; i++) { wheelAt(REAR, +100);
      for (let k = 0; k < 12; k++) { r._updateCameraPivot(1 / 60); ctrl.update(); } }
    ok('15h ON: zooming OUT leaves the pivot where it was',
       near(ctrl.target.x, before.x, 1) && near(ctrl.target.z, before.z, 1),
       `(${before.x.toFixed(1)},${before.z.toFixed(1)}) → (${ctrl.target.x.toFixed(1)},${ctrl.target.z.toFixed(1)})`);
  }
  // …and it must actually zoom OUT. Checking only the pivot would pass even if
  // the notch moved the camera TOWARD the pointer (it did, before this pin).
  r.setCameraPivot(true, false, 0, 0, { ...HALF, zoomToCursor: true });
  r.applyViewPreset('front');
  for (let i = 0; i < 80; i++) { r._updateCameraPivot(1 / 60); ctrl.update(); }
  {
    const radOf = () => Math.hypot(cam.position.x - ctrl.target.x,
                                   cam.position.y - ctrl.target.y,
                                   cam.position.z - ctrl.target.z);
    for (let i = 0; i < 15; i++) { wheelAt(REAR, -100);
      for (let k = 0; k < 12; k++) { r._updateCameraPivot(1 / 60); ctrl.update(); } }
    const rIn = radOf();
    const dOut = dist3(cam.position, REAR);
    wheelAt(REAR, +100);
    for (let k = 0; k < 12; k++) { r._updateCameraPivot(1 / 60); ctrl.update(); }
    ok('15h ON: one OUT notch grows the orbit radius by OrbitControls\u2019 own 1/0.95',
       Math.abs(radOf() / rIn - 1 / 0.95) < 0.005, `${rIn.toFixed(0)} → ${radOf().toFixed(0)} (${(radOf() / rIn).toFixed(4)})`);
    ok('15h ON: an OUT notch moves the camera AWAY from the pointed-at point',
       dist3(cam.position, REAR) > dOut,
       `${dOut.toFixed(0)} → ${dist3(cam.position, REAR).toFixed(0)}`);
  }
  r.setCameraPivot(true, false, 0, 0);
  r.updateFloor(floor, { preset: 'day', floorColor: '#8a7860', floorTex: 'wood', wallColor: '#cfd2d6' });

  // ── report ────────────────────────────────────────────────────────────────
  const pass = tests.filter(t => t.ok).length, total = tests.length;
  const allPass = pass === total;
  const fails = tests.filter(t => !t.ok).map(t => t.name);
  const title = allPass ? `CAMERA PASS ${pass}/${total}` : `CAMERA FAIL ${pass}/${total} [${fails.join(',')}]`;
  document.title = title;
  const log = document.getElementById('log');
  log.innerHTML = `<div class="hd ${allPass ? 'pass' : 'fail'}">${title}</div>` +
    tests.map(t => `<div><span class="${t.ok ? 'pass' : 'fail'}">${t.ok ? 'PASS' : 'FAIL'}</span> ${t.name} <span style="color:#78909c">${t.detail}</span></div>`).join('');
</script>
