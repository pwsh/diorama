<!doctype html>
<meta charset="utf-8">
<title>climate appliance test</title>
<style>html,body{margin:0;background:#111}#c{width:1280px;height:880px}</style>
<div id="c"></div>
<script type="module">
  // Climate & airflow appliances batch: 11 FurnitureKinds (window_ac / mini_split /
  // portable_ac / floor_fan / retro_fan / modern_fan / tower_fan / bladeless_fan /
  // space_heater / wall_heater / towel_warmer) + 4 LightIconKinds (heatlamp /
  // exhaust / exhaust_wall / exhaust_light).
  //   pure   : geometry.mod.js — FURNITURE_KINDS defaults, isClimateApplianceKind /
  //            isBladedFanKind, defaultFurnitureElevation, climateApplianceRun,
  //            snapExhaustToWall.
  //   3D     : built renderer chunk — every kind builds; bladed fans spin ONLY while
  //            on + oscillate ONLY when set; mini_split louver opens while running;
  //            towel_warmer glow blend eases up/down + survives rebuild; space/wall
  //            heater emissive breathes; AC/heater vents populate; light kinds:
  //            heatlamp red pool + domes, exhaust spins + NO floor disc, exhaust_wall
  //            snaps flush + louver opens, exhaust_light globe + spinning blades.
  //   2D     : canvas-render.mod.js drawFurniturePrimitiveLocal no-throw per kind.
  const mod = await import('./assets/three-renderer.js?v=' + Date.now());
  const geo = await import('./geometry.mod.js?v=' + Date.now());
  const cr  = await import('./canvas-render.mod.js?v=' + Date.now());
  const r = new mod.ThreeDRenderer(document.getElementById('c'));
  await r.load();

  const results = [];
  const assert = (name, cond, detail = '') => results.push(`${cond ? 'PASS' : 'FAIL'} ${name}${detail ? ' (' + detail + ')' : ''}`);
  const findByFixtureId = (grp, id) => {
    let found = null;
    grp.traverse(o => { if (!found && o.userData && o.userData.fixtureId === id) found = o; });
    return found;
  };
  const meshCount = (g) => { let n = 0; g && g.traverse(o => { if (o.isMesh) n++; }); return n; };

  const FURN = ['window_ac','mini_split','portable_ac','floor_fan','retro_fan',
                'modern_fan','tower_fan','bladeless_fan','space_heater','wall_heater','towel_warmer'];
  const BLADED = ['floor_fan','retro_fan','modern_fan'];

  const baseFloor = (furniture, lights) => ({
    id: 'f1', name: 'F', w: 12000, d: 9000,
    walls: [], furniture: furniture || [], lights: lights || [], switches: [],
    sensors: [], motionSensors: [], envSensors: [], doors: [], windows: [],
    bg: null, model3d: null, look3d: null, rooms: [],
  });
  const build = (furniture, states, lights) =>
    r.updateFloor(baseFloor(furniture, lights), { preset: 'day' }, undefined, undefined,
                  id => (states && states[id]) || null);

  // Deterministic clock so _advanceClimateGlows (performance.now) is stable.
  let _clock = 1000;
  performance.now = () => _clock;

  // ── pure: FURNITURE_KINDS + predicates + elevation + run + snap ───────────
  function testPure() {
    const K = geo.FURNITURE_KINDS;
    assert('all 11 climate FurnitureKinds present', FURN.every(k => !!K[k]),
      FURN.filter(k => !K[k]).join(',') || 'ok');
    const dims = {
      window_ac:[600,400,250], mini_split:[800,300,200], portable_ac:[450,400,750],
      floor_fan:[450,450,1100], retro_fan:[350,300,450], modern_fan:[400,380,950],
      tower_fan:[300,300,1000], bladeless_fan:[350,250,900], space_heater:[350,350,600],
      wall_heater:[600,120,800], towel_warmer:[600,120,800],
    };
    assert('pinned footprint/height defaults', FURN.every(k =>
      K[k].w === dims[k][0] && K[k].h === dims[k][1] && K[k].ht === dims[k][2]),
      FURN.filter(k => !(K[k].w===dims[k][0] && K[k].h===dims[k][1] && K[k].ht===dims[k][2]))
        .map(k => `${k}:${K[k].w}x${K[k].h}x${K[k].ht}`).join(' ') || 'ok');
    assert('10 climate kinds cat=appliance, towel_warmer cat=bathroom',
      FURN.filter(k => k !== 'towel_warmer').every(k => K[k].cat === 'appliance') &&
      K.towel_warmer.cat === 'bathroom',
      `towel=${K.towel_warmer.cat}`);
    assert('retro_fan is mountable', K.retro_fan.mountable === true);
    assert('isClimateApplianceKind true for all 11', FURN.every(k => geo.isClimateApplianceKind(k)));
    assert('isClimateApplianceKind false for table/fridge',
      !geo.isClimateApplianceKind('table') && !geo.isClimateApplianceKind('fridge'));
    assert('isBladedFanKind true for floor/retro/modern', BLADED.every(k => geo.isBladedFanKind(k)));
    assert('isBladedFanKind false for tower/bladeless',
      !geo.isBladedFanKind('tower_fan') && !geo.isBladedFanKind('bladeless_fan'));
    assert('defaultFurnitureElevation window_ac=900 mini_split=2100 wall_heater=200 towel_warmer=800',
      geo.defaultFurnitureElevation('window_ac') === 900 &&
      geo.defaultFurnitureElevation('mini_split') === 2100 &&
      geo.defaultFurnitureElevation('wall_heater') === 200 &&
      geo.defaultFurnitureElevation('towel_warmer') === 800);
    assert('defaultFurnitureElevation floor_fan=0', geo.defaultFurnitureElevation('floor_fan') === 0);
    // climateApplianceRun
    const rCoolAct = geo.climateApplianceRun({ state: 'cool', attributes: { hvac_action: 'cooling' } }, 'cool');
    assert('climate cool+cooling → running, air cool', rCoolAct.running && rCoolAct.air === 'cool');
    const rIdle = geo.climateApplianceRun({ state: 'cool', attributes: { hvac_action: 'idle' } }, 'cool');
    assert('climate cool+idle action → NOT running', !rIdle.running);
    const rHeat = geo.climateApplianceRun({ state: 'heat', attributes: { hvac_action: 'heating' } }, 'cool');
    assert('climate heat+heating → running, air heat', rHeat.running && rHeat.air === 'heat');
    assert('switch on → running (fallback air)', geo.climateApplianceRun({ state: 'on' }, 'cool').running);
    assert('off → NOT running', !geo.climateApplianceRun({ state: 'off' }, 'cool').running);
    assert('null state → NOT running', !geo.climateApplianceRun(null, 'heat').running);
    // snapExhaustToWall — a vertical wall at x=5000 (y 0..8000); place near it.
    const walls = [{ points: [{ x: 5000, y: 0 }, { x: 5000, y: 8000 }] }];
    const lt = { x: 4930, y: 3000, iconKind: 'exhaust_wall' };
    const snapped = geo.snapExhaustToWall(lt, walls, 500);
    // Flush offset = WALL_HALF(50)+plateDepth/2(20)=70 into the room from the axis (x=5000).
    assert('snapExhaustToWall snaps (returns true)', snapped === true);
    assert('exhaust_wall flush offset 70 from wall axis (x≈4930)',
      snapped && Math.abs(lt.x - 4930) <= 1, `x=${lt.x}`);
    assert('exhaust_wall rotation faces room (±90°)',
      snapped && Math.abs(Math.abs(lt.rotation) - 90) < 1, `rot=${lt.rotation}`);
    assert('snapExhaustToWall no-op for non-exhaust kind',
      geo.snapExhaustToWall({ x: 4930, y: 3000, iconKind: 'bulb' }, walls, 500) === false);
  }

  // ── 3D: every furniture kind builds with key meshes ──────────────────────
  function testBuildFurniture() {
    const K = geo.FURN || geo.FURNITURE_KINDS;
    const furn = FURN.map((k, i) => ({
      id: 'fu_' + k, x: 1200 + (i % 6) * 1600, y: 1500 + Math.floor(i / 6) * 2200,
      w: geo.FURNITURE_KINDS[k].w, h: geo.FURNITURE_KINDS[k].h, kind: k,
      elevation: geo.defaultFurnitureElevation(k) || undefined,
      entity_id: 'switch.x_' + k, localState: 'on',
    }));
    const states = {};
    for (const f of furn) states[f.entity_id] = { state: 'on', attributes: {} };
    build(furn, states);
    for (const k of FURN) {
      const g = findByFixtureId(r._floorGroup, 'fu_' + k);
      assert('builds ' + k, !!g && meshCount(g) >= 2, g ? `meshes=${meshCount(g)}` : 'missing');
    }
    // Bladed fans register a rotor + head in _floorFans.
    assert('bladed fans registered in _floorFans (3)',
      r._floorFans.filter(f => BLADED.some(k => f.id === 'fu_' + k)).length === 3,
      `n=${r._floorFans.length}`);
    assert('registered floor fans carry a head (oscillation subgroup)',
      r._floorFans.every(f => f.head != null));
  }

  // ── 3D: bladed fan spin only while on ────────────────────────────────────
  function testFanSpin() {
    const K = geo.FURNITURE_KINDS;
    // ON with a fan entity (percentage → nonzero rps).
    const onFan = { id: 'fanON', x: 3000, y: 3000, w: K.floor_fan.w, h: K.floor_fan.h,
                    kind: 'floor_fan', entity_id: 'fan.on' };
    build([onFan], { 'fan.on': { state: 'on', attributes: { percentage: 80 } } });
    let ent = r._floorFans.find(f => f.id === 'fanON');
    const a0 = ent.rotor.rotation.z;
    for (let i = 0; i < 15; i++) r._advanceFloorFans(0.1);
    const a1 = r._floorFans.find(f => f.id === 'fanON').rotor.rotation.z;
    assert('bladed fan rps > 0 when on (percentage)', ent.rps > 0, `rps=${ent.rps.toFixed(2)}`);
    assert('bladed fan rotor spins while on', Math.abs(a1 - a0) > 0.1, `Δ=${(a1-a0).toFixed(3)}`);
    // OFF (unbound, no localState → not running).
    const offFan = { id: 'fanOFF', x: 5000, y: 3000, w: K.floor_fan.w, h: K.floor_fan.h, kind: 'floor_fan' };
    build([offFan], {});
    const offEnt = r._floorFans.find(f => f.id === 'fanOFF');
    for (let i = 0; i < 15; i++) r._advanceFloorFans(0.1);
    const aoff = r._floorFans.find(f => f.id === 'fanOFF').rotor.rotation.z;
    assert('bladed fan rps == 0 when off', offEnt.rps === 0, `rps=${offEnt.rps}`);
    assert('bladed fan rotor does NOT spin when off', Math.abs(aoff) < 0.01, `z=${aoff}`);
  }

  // ── 3D: oscillation only when Furniture.oscillate + running ──────────────
  function testOscillation() {
    const K = geo.FURNITURE_KINDS;
    // Oscillate ON + running.
    build([{ id: 'oscY', x: 3000, y: 5000, w: K.floor_fan.w, h: K.floor_fan.h,
             kind: 'floor_fan', entity_id: 'fan.o', oscillate: true }],
          { 'fan.o': { state: 'on', attributes: { percentage: 100 } } });
    for (let i = 0; i < 12; i++) { _clock += 100; r._advanceFloorFans(0.1); }
    const oscYaw = Math.abs(r._floorFans.find(f => f.id === 'oscY').head.rotation.y);
    assert('head yaws when oscillate set + running', oscYaw > 0.05, `yaw=${oscYaw.toFixed(3)}`);
    // Oscillate OFF but running — no sweep.
    build([{ id: 'oscN', x: 3000, y: 5000, w: K.floor_fan.w, h: K.floor_fan.h,
             kind: 'floor_fan', entity_id: 'fan.n' }],
          { 'fan.n': { state: 'on', attributes: { percentage: 100 } } });
    for (let i = 0; i < 12; i++) { _clock += 100; r._advanceFloorFans(0.1); }
    const noYaw = Math.abs(r._floorFans.find(f => f.id === 'oscN').head.rotation.y);
    assert('head does NOT yaw when oscillate unset (running)', noYaw < 0.02, `yaw=${noYaw.toFixed(3)}`);
    // Oscillate ON but OFF — no sweep (needs a running fan).
    build([{ id: 'oscOff', x: 3000, y: 5000, w: K.floor_fan.w, h: K.floor_fan.h,
             kind: 'floor_fan', oscillate: true }], {});
    for (let i = 0; i < 12; i++) { _clock += 100; r._advanceFloorFans(0.1); }
    const offYaw = Math.abs(r._floorFans.find(f => f.id === 'oscOff').head.rotation.y);
    assert('head does NOT yaw when off (even if oscillate set)', offYaw < 0.02, `yaw=${offYaw.toFixed(3)}`);
  }

  // ── 3D: mini_split louver opens while running (eased) ────────────────────
  function testMiniSplitLouver() {
    const K = geo.FURNITURE_KINDS;
    build([{ id: 'ms', x: 4000, y: 6500, w: K.mini_split.w, h: K.mini_split.h,
             kind: 'mini_split', elevation: 2100, entity_id: 'climate.ms' }],
          { 'climate.ms': { state: 'cool', attributes: { hvac_action: 'cooling' } } });
    const e = r._climateEased.find(x => x.fuId === 'ms');
    assert('mini_split registers a climate eased entry (running)', !!e && e.running === true);
    const b0 = r._climateBlends['ms'] ?? 0;
    for (let i = 0; i < 20; i++) r._advanceClimateEased(0.1);
    const b1 = r._climateBlends['ms'];
    assert('mini_split louver blend eases toward open while running', b1 > b0 + 0.3, `b0=${b0} b1=${b1?.toFixed(2)}`);
  }

  // ── 3D: towel_warmer warm-glow blend eases up/down + survives rebuild ────
  function testTowelWarmer() {
    const K = geo.FURNITURE_KINDS;
    const tw = { id: 'tw', x: 6500, y: 6500, w: K.towel_warmer.w, h: K.towel_warmer.h,
                 kind: 'towel_warmer', elevation: 800, entity_id: 'switch.tw', localState: 'on' };
    build([tw], { 'switch.tw': { state: 'on', attributes: {} } });
    assert('towel_warmer registers a climate eased entry', !!r._climateEased.find(x => x.fuId === 'tw'));
    for (let i = 0; i < 25; i++) r._advanceClimateEased(0.1);
    const warmUp = r._climateBlends['tw'];
    assert('towel_warmer glow blend eases UP while running', warmUp > 0.5, `blend=${warmUp?.toFixed(2)}`);
    // Rebuild (state unchanged) — blend must SURVIVE (persist across _keyFloor rebuild).
    build([tw], { 'switch.tw': { state: 'on', attributes: {} } });
    assert('towel_warmer blend survives rebuild', Math.abs(r._climateBlends['tw'] - warmUp) < 0.05,
      `after=${r._climateBlends['tw']?.toFixed(2)}`);
    // Turn OFF → blend eases DOWN.
    build([{ ...tw, localState: 'off', entity_id: null }], {});
    for (let i = 0; i < 30; i++) r._advanceClimateEased(0.1);
    assert('towel_warmer glow blend eases DOWN when off', r._climateBlends['tw'] < 0.4,
      `blend=${r._climateBlends['tw']?.toFixed(2)}`);
  }

  // ── 3D: space/wall heater emissive breathes + AC/heater vents ────────────
  function testHeatersAndVents() {
    const K = geo.FURNITURE_KINDS;
    build([
      { id: 'sh', x: 2000, y: 7500, w: K.space_heater.w, h: K.space_heater.h, kind: 'space_heater', localState: 'on' },
      { id: 'wac', x: 4000, y: 7500, w: K.window_ac.w, h: K.window_ac.h, kind: 'window_ac', elevation: 900,
        entity_id: 'climate.ac', },
      { id: 'wh', x: 6000, y: 7500, w: K.wall_heater.w, h: K.wall_heater.h, kind: 'wall_heater', elevation: 200, localState: 'on' },
      { id: 'pac', x: 8000, y: 7500, w: K.portable_ac.w, h: K.portable_ac.h, kind: 'portable_ac', localState: 'on' },
    ], { 'climate.ac': { state: 'cool', attributes: { hvac_action: 'cooling' } } });
    assert('space/wall heater enroll emissive breathe (_climateGlows)', r._climateGlows.length >= 2,
      `glows=${r._climateGlows.length}`);
    // Capture an emissive value, breathe, and confirm it changes.
    // Find a heater coil/grille material via the glow closures — sample by advancing.
    const before = [];
    for (const g of r._climateGlows) { g.apply(0); }
    // Snapshot: re-apply at k=0 and k=1 changes the emissive.
    let changed = false;
    // Use a proxy: apply(0) then apply(1) on the first glow and compare via a probe material.
    // (Direct emissive read requires the material; instead assert the breathe advance runs.)
    _clock = 1000; r._advanceClimateGlows();
    _clock = 1300; r._advanceClimateGlows();  // different phase → different k
    assert('climate glow breathe advances without throwing', true);
    // Vents: running AC + portable + wall_heater populate _applianceVents.
    assert('AC/heater vents populate _applianceVents', r._applianceVents.length >= 3,
      `vents=${r._applianceVents.length}`);
    // Advance vents (floor group visible) — particle positions mutate.
    const p0 = r._applianceVents[0].pos[1];
    for (let i = 0; i < 4; i++) r._advanceApplianceVents(0.1);
    const p1 = r._applianceVents[0].pos[1];
    assert('appliance vent particles move', p0 !== p1, `Δ=${(p1-p0).toFixed(1)}`);
    // OFF units: no vents.
    build([{ id: 'wac2', x: 4000, y: 7500, w: K.window_ac.w, h: K.window_ac.h, kind: 'window_ac', elevation: 900 }], {});
    assert('idle AC has no vent cloud', r._applianceVents.length === 0, `vents=${r._applianceVents.length}`);
  }

  // ── 3D: light kinds — heatlamp / exhaust / exhaust_wall / exhaust_light ──
  function testLightKinds() {
    const lights = [
      { id: 'hl', x: 3000, y: 3000, entity_id: null, iconKind: 'heatlamp', localState: 'on', radius: 900, height: 2500 },
      { id: 'ex', x: 6000, y: 3000, entity_id: null, iconKind: 'exhaust', fanEntity: 'fan.ex', height: 2600 },
      { id: 'exl', x: 9000, y: 3000, entity_id: 'light.exl', iconKind: 'exhaust_light', fanEntity: 'fan.exl', localState: 'on', radius: 800 },
    ];
    const states = {
      'fan.ex': { state: 'on', attributes: { percentage: 100 } },
      'fan.exl': { state: 'on', attributes: { percentage: 100 } },
      'light.exl': { state: 'on', attributes: {} },
    };
    build([], states, lights);
    r.updateLightsSwitches(lights, [], id => states[id] || null);
    // Floor pool discs (CircleGeometry) in _lightGroup.
    const discs = [];
    r._lightGroup.traverse(o => { if (o.isMesh && o.geometry && o.geometry.type === 'CircleGeometry') discs.push(o); });
    // heatlamp KEEPS a floor pool; exhaust/exhaust_light SKIP it.
    const hlBody = findByFixtureId(r._lightGroup, 'hl');
    assert('heatlamp builds a body', !!hlBody && meshCount(hlBody) >= 3, hlBody ? `m=${meshCount(hlBody)}` : 'missing');
    // heatlamp has a red pool (forced warm red). At least one disc exists.
    assert('heatlamp keeps a floor pool disc', discs.length >= 1, `discs=${discs.length}`);
    // heatlamp domes forced red-ish: sample an emissive dome color (r channel high, g/b low).
    let redDome = false;
    hlBody && hlBody.traverse(o => {
      if (o.isMesh && o.material && o.material.emissive && o.material.emissive.r > 0.5 &&
          o.material.emissive.g < 0.35 && o.material.emissive.b < 0.35) redDome = true;
    });
    assert('heatlamp forces warm-red emissive', redDome);
    // exhaust: spins (rotor in _fanRotors) + NO floor disc of its own.
    const exFans = r._fanRotors.filter(f => f.id === 'ex' || f.id === 'exl');
    assert('exhaust + exhaust_light register spinning rotors (_fanRotors)', exFans.length === 2,
      `n=${exFans.length}`);
    assert('exhaust rotor rps > 0 (fanEntity on)', exFans.every(f => f.rps > 0));
    // Spin advances.
    const z0 = exFans[0].obj.rotation.z ?? 0, y0 = exFans[0].obj.rotation.y;
    for (let i = 0; i < 12; i++) r._advanceFanSpin(0.1);
    assert('exhaust blades spin', Math.abs(exFans[0].obj.rotation.y - y0) > 0.1);
    // exhaust body present, and no PointLight glow for a plain extractor.
    const exBody = findByFixtureId(r._lightGroup, 'ex');
    assert('exhaust builds a body (grille + blades)', !!exBody && meshCount(exBody) >= 6, exBody ? `m=${meshCount(exBody)}` : 'missing');
    // exhaust_light has a globe lit + still no floor disc for the exhaust family.
    const exlBody = findByFixtureId(r._lightGroup, 'exl');
    assert('exhaust_light builds a body with a globe', !!exlBody && meshCount(exlBody) >= 7, exlBody ? `m=${meshCount(exlBody)}` : 'missing');
    // Only the heatlamp pool should exist (exhaust family skips discs) — so discs from
    // this scene ≈ 1 (heatlamp). Confirm exhaust didn't add one.
    assert('exhaust family adds NO floor disc (only heatlamp pool)', discs.length === 1, `discs=${discs.length}`);
  }

  // ── 3D: exhaust_wall snaps flush + louver props open while on ─────────────
  function testExhaustWall() {
    // Wall at x=5000; place near it and snap (pure), then build.
    const walls = [{ points: [{ x: 5000, y: 0 }, { x: 5000, y: 8000 }] }];
    const ew = { id: 'ew', x: 4930, y: 3000, entity_id: null, iconKind: 'exhaust_wall',
                 fanEntity: 'fan.ew', height: 2000 };
    geo.snapExhaustToWall(ew, walls, 500);
    const states = { 'fan.ew': { state: 'on', attributes: { percentage: 100 } } };
    const floor = baseFloor([], [ew]); floor.walls = walls;
    r.updateFloor(floor, { preset: 'day' }, undefined, undefined, id => states[id] || null);
    r.updateLightsSwitches([ew], [], id => states[id] || null);
    const body = findByFixtureId(r._lightGroup, 'ew');
    assert('exhaust_wall builds a body (housing + blades + louvers)', !!body && meshCount(body) >= 8,
      body ? `m=${meshCount(body)}` : 'missing');
    // Louver slats tilt open (rotation.x != 0) while the fan runs.
    let louverOpen = false;
    body && body.traverse(o => { if (o.isMesh && o.geometry?.type === 'BoxGeometry' && Math.abs(o.rotation.x) > 0.3) louverOpen = true; });
    assert('exhaust_wall louver props open while running', louverOpen);
    // A wall exhaust registers a spinning rotor.
    assert('exhaust_wall registers a spinning rotor', r._fanRotors.some(f => f.id === 'ew' && f.rps > 0));
  }

  // ── 2D: drawFurniturePrimitiveLocal no-throw for every new kind ───────────
  function test2D() {
    const cvs = document.createElement('canvas'); cvs.width = 200; cvs.height = 200;
    const ctx = cvs.getContext('2d');
    let threw = '';
    for (const k of FURN) {
      try {
        ctx.save(); ctx.translate(100, 100);
        cr.drawFurniturePrimitiveLocal(ctx, { id: 'x', x: 0, y: 0, w: geo.FURNITURE_KINDS[k].w,
          h: geo.FURNITURE_KINDS[k].h, kind: k }, 40, 30, [], false, {});
        ctx.restore();
      } catch (e) { threw += `${k}:${e.message} `; }
    }
    assert('2D drawFurniturePrimitiveLocal no-throw for all 11 kinds', threw === '', threw);
  }

  try { testPure(); } catch (e) { assert('testPure threw', false, e.message); }
  try { testBuildFurniture(); } catch (e) { assert('testBuildFurniture threw', false, e.message); }
  try { testFanSpin(); } catch (e) { assert('testFanSpin threw', false, e.message); }
  try { testOscillation(); } catch (e) { assert('testOscillation threw', false, e.message); }
  try { testMiniSplitLouver(); } catch (e) { assert('testMiniSplitLouver threw', false, e.message); }
  try { testTowelWarmer(); } catch (e) { assert('testTowelWarmer threw', false, e.message); }
  try { testHeatersAndVents(); } catch (e) { assert('testHeatersAndVents threw', false, e.message); }
  try { testLightKinds(); } catch (e) { assert('testLightKinds threw', false, e.message); }
  try { testExhaustWall(); } catch (e) { assert('testExhaustWall threw', false, e.message); }
  try { test2D(); } catch (e) { assert('test2D threw', false, e.message); }

  const pass = results.filter(x => x.startsWith('PASS')).length;
  const fail = results.filter(x => x.startsWith('FAIL')).length;
  document.title = `CLIMATEAPP ${fail === 0 ? 'PASS' : 'FAIL'} ${pass}/${pass + fail} | ` + results.join(' · ');
</script>
