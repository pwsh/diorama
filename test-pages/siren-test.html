<!doctype html>
<meta charset="utf-8">
<title>SIREN …</title>
<style>html,body{margin:0;background:#111;color:#cfd8dc;font:12px monospace}#c{width:1280px;height:880px}#log{padding:8px;white-space:pre-wrap}</style>
<div id="c"></div>
<div id="log"></div>
<!-- Siren beacon (SafetySensor kind 'siren') smoke test. Three seams:
       (1) shared color/glyph plumbing (geometry.mod.js — 2D + 3D read these)
           npx esbuild src/geometry.ts --bundle --format=esm --outfile=<H>/geometry.mod.js
       (2) 3D build + spinning light-bar sweep + strobe (built three-renderer chunk)
       (3) triggerSiren control logic via the REAL Planner (planner.mod.js, same
           fake-HaApi/fake-avatar-store build as config-test):
             T=$(mktemp -d); cp -r src/* "$T"/; cp test-pages/fake-avatar-store.ts "$T"/avatar-store.ts
             npx esbuild "$T"/planner.ts --bundle --format=esm --outfile=<H>/planner.mod.js
     Asserts machine-checkable in document.title. -->
<script type="module">
  const V = '?v=' + Date.now();
  const geom = await import('./geometry.mod.js' + V);
  const mod  = await import('./assets/three-renderer.js' + V);
  const { Planner } = await import('./planner.mod.js' + V);

  const results = [];
  const assert = (name, cond, detail = '') => results.push({ name, ok: !!cond, detail: String(detail) });
  const meshCount = (o) => { let n = 0; o.traverse(x => { if (x.isMesh) n++; }); return n; };

  // ── (1) shared color / glyph / classification plumbing ────────────────────
  assert('siren color is emergency blue', geom.safetyColor('siren') === '#2979ff', geom.safetyColor('siren'));
  assert('siren glyph is 📢', geom.safetyGlyph('siren') === '📢', geom.safetyGlyph('siren'));
  assert('siren is NOT floor (ceiling)', geom.safetyIsFloor('siren') === false);
  assert('siren classified as siren', geom.safetyIsSiren('siren') === true);
  assert('smoke NOT classified as siren', geom.safetyIsSiren('smoke') === false);
  assert('siren defaults present', typeof geom.SAFETY_DEFAULTS.sirenSweepRevPerS === 'number'
      && typeof geom.SAFETY_DEFAULTS.sirenStrobeHz === 'number');

  // ── (1b) siren CAPABILITY helpers (research §2.1/§2.2) ────────────────────
  const F = geom.SIREN_FEATURE;
  assert('SIREN_FEATURE values match HA const.py',
    F.TURN_ON === 1 && F.TURN_OFF === 2 && F.TONES === 4 && F.VOLUME_SET === 8 && F.DURATION === 16,
    JSON.stringify(F));
  const stFull = { state: 'off', attributes: { supported_features: 31, available_tones: ['ping', 'siren'] } };
  const stPlain = { state: 'off', attributes: { supported_features: 3 } };
  assert('sirenSupports reads the bitmask', geom.sirenSupports(stFull, F.TONES) === true
      && geom.sirenSupports(stFull, F.DURATION) === true);
  assert('sirenSupports false for an unadvertised flag', geom.sirenSupports(stPlain, F.TONES) === false
      && geom.sirenSupports(stPlain, F.VOLUME_SET) === false);
  assert('sirenSupports tolerates a missing state / attrs',
    geom.sirenSupports(null, F.TONES) === false && geom.sirenSupports({}, F.TONES) === false
    && geom.sirenSupports({ attributes: {} }, F.TONES) === false);
  assert('sirenSupports tolerates a string bitmask', geom.sirenSupports({ attributes: { supported_features: '4' } }, F.TONES) === true);
  assert('sirenSupports tolerates garbage', geom.sirenSupports({ attributes: { supported_features: 'nope' } }, F.TONES) === false);
  // available_tones: list form
  const tl = geom.sirenTones(stFull);
  assert('sirenTones parses a list', tl.length === 2 && tl[0].value === 'ping' && tl[0].label === 'ping'
      && tl[1].value === 'siren', JSON.stringify(tl));
  // available_tones: dict form (id → human name) — key AND value are both valid
  // service params, so the row keeps the KEY as the value and the name as label.
  const td = geom.sirenTones({ attributes: { available_tones: { 1: 'Bell', 2: 'Chime' } } });
  assert('sirenTones parses a dict (key=value, name=label)',
    td.length === 2 && td[0].value === '1' && td[0].label === 'Bell' && td[1].label === 'Chime',
    JSON.stringify(td));
  assert('sirenTones tolerates absent/garbage', geom.sirenTones(null).length === 0
      && geom.sirenTones({ attributes: {} }).length === 0
      && geom.sirenTones({ attributes: { available_tones: 7 } }).length === 0
      && geom.sirenTones({ attributes: { available_tones: [null, {}, 'ok'] } }).length === 1);
  // sirenTurnOnData: every param is feature-GATED (a firmware that rejects an
  // unsupported key must never see it — tuya-local #2980).
  const cfg = { tone: 'bell', volume: 0.5, duration: 30 };
  const dFull = geom.sirenTurnOnData(cfg, stFull);
  assert('turn_on data carries all three when advertised',
    dFull.tone === 'bell' && dFull.volume_level === 0.5 && dFull.duration === 30, JSON.stringify(dFull));
  const dPlain = geom.sirenTurnOnData(cfg, stPlain);
  assert('turn_on data drops every unadvertised param', Object.keys(dPlain).length === 0, JSON.stringify(dPlain));
  assert('turn_on data omits unset params',
    Object.keys(geom.sirenTurnOnData({}, stFull)).length === 0);
  assert('turn_on data clamps volume + rounds duration',
    geom.sirenTurnOnData({ volume: 5 }, stFull).volume_level === 1
    && geom.sirenTurnOnData({ volume: -2 }, stFull).volume_level === 0
    && geom.sirenTurnOnData({ duration: 12.6 }, stFull).duration === 13);
  assert('turn_on data drops a non-positive duration',
    geom.sirenTurnOnData({ duration: 0 }, stFull).duration === undefined);

  // ── (2) 3D build + sweep rotation + strobe ────────────────────────────────
  const r = new mod.ThreeDRenderer(document.getElementById('c'));
  await r.load();

  const findGroupWithFixture = (grp, id) => grp.children.find(g => {
    let hit = false; g.traverse(o => { if (o.userData && o.userData.fixtureId === id) hit = true; }); return hit;
  });
  const beaconOf = (grp) => grp && grp.children.find(o => o.type === 'Group');
  const realNow = performance.now.bind(performance);
  let clock = 0;
  performance.now = () => clock;

  const sirenBound = { id: 'sir1', x: 2000, y: 2000, kind: 'siren', entity_id: 'siren.horn' };
  const sirenIdle  = { id: 'sir2', x: 4000, y: 2000, kind: 'siren', entity_id: 'siren.horn2' };
  const stAlarm = {
    'siren.horn':  { state: 'on',  attributes: {}, entity_id: 'siren.horn' },
    'siren.horn2': { state: 'off', attributes: {}, entity_id: 'siren.horn2' },
  };
  const sp = id => stAlarm[id] || null;

  // Frame at t=0 (alarming siren1 + idle siren2).
  clock = 0;
  r.updateSafetySensors([sirenBound, sirenIdle], sp);
  const g1 = findGroupWithFixture(r._safetyGroup, 'sir1');
  const g2 = findGroupWithFixture(r._safetyGroup, 'sir2');
  assert('siren builds a 3D group (alarming)', !!g1);
  assert('siren builds a 3D group (idle)', !!g2);
  const plate1 = g1 && g1.children.find(o => o.isMesh && o.userData && o.userData.kind === 'safety');
  assert('siren plate is click-tagged kind=safety', !!plate1);
  const b1a = beaconOf(g1);
  assert('siren has a spinning beacon group', !!b1a);
  const rot0 = b1a ? b1a.rotation.y : null;
  const alarmMeshes = g1 ? meshCount(g1) : 0;
  const idleMeshes  = g2 ? meshCount(g2) : 0;
  assert('alarming siren has more meshes than idle (rings + beams)', alarmMeshes > idleMeshes,
    `alarm=${alarmMeshes} idle=${idleMeshes}`);

  // Advance the clock a quarter revolution and rebuild — the sweep must rotate.
  clock = (1 / geom.SAFETY_DEFAULTS.sirenSweepRevPerS) * 0.25 * 1000;  // ms → 90° of sweep
  r.updateSafetySensors([sirenBound, sirenIdle], sp);
  const g1b = findGroupWithFixture(r._safetyGroup, 'sir1');
  const b1b = beaconOf(g1b);
  const rot1 = b1b ? b1b.rotation.y : null;
  assert('sweep rotation advances across frames', rot0 !== null && rot1 !== null && Math.abs(rot1 - rot0) > 0.5,
    `rot0=${(rot0||0).toFixed(3)} rot1=${(rot1||0).toFixed(3)}`);

  // Strobe: the lens emissive intensity square-waves. Sample two phases where
  // sin() has opposite sign → the lobe material emissiveIntensity differs.
  const lobeEmis = (grp) => { const b = beaconOf(grp); const m = b && b.children.find(o => o.isMesh);
    return m ? m.material.emissiveIntensity : null; };
  clock = 0;   // sin(0)=0 → not > 0 → dim phase
  r.updateSafetySensors([sirenBound], sp);
  const emisDim = lobeEmis(findGroupWithFixture(r._safetyGroup, 'sir1'));
  clock = (0.25 / geom.SAFETY_DEFAULTS.sirenStrobeHz) * 1000;  // quarter strobe period → peak, sin>0
  r.updateSafetySensors([sirenBound], sp);
  const emisBright = lobeEmis(findGroupWithFixture(r._safetyGroup, 'sir1'));
  assert('strobe: lens emissive differs bright vs dim phase', emisDim !== null && emisBright !== null && emisBright > emisDim,
    `dim=${emisDim} bright=${emisBright}`);

  performance.now = realNow;

  // ── (3) triggerSiren control logic (real Planner) ─────────────────────────
  const svc = [];
  class FakeHa {
    constructor() { this.states = {}; this._s = []; this._c = []; }
    connect() { for (const c of this._c) c('connected'); for (const s of this._s) s(this.states, undefined); }
    onState(f) { this._s.push(f); } onConn(f) { this._c.push(f); }
    callService(domain, service, data) { svc.push({ domain, service, data }); return Promise.resolve(); }
    async getHistory() { return {}; } async getWeatherForecasts() { return null; }
    async getDevices() { return []; } async getEntityRegistry() { return []; }
    async updateEntityRegistry() { return true; }
    async getUserData() { return null; } async setUserData() { return true; }
    async refreshStates() {}
  }
  localStorage.removeItem('diorama:store:v1'); localStorage.removeItem('diorama:configs');
  const p = new Planner();
  const stub = new FakeHa();
  p.connectWith(stub);
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  for (let i = 0; i < 300 && !p.floor(); i++) await sleep(4);

  const mkSiren = (o) => ({ id: 'x', x: 1000, y: 1000, kind: 'siren', entity_id: null, ...o });

  // Bound siren.* is dispatched BY STATE (never a blind toggle — the valve
  // open_valve/close_valve precedent).
  stub.states['siren.horn'] = { entity_id: 'siren.horn', state: 'off', attributes: { supported_features: 3 } };
  svc.length = 0; p.uiMode = 'edit';
  p.triggerSiren(mkSiren({ entity_id: 'siren.horn' }));
  assert('bound siren.* OFF dispatches siren.turn_on',
    svc.length === 1 && svc[0].domain === 'siren' && svc[0].service === 'turn_on'
    && svc[0].data.entity_id === 'siren.horn',
    JSON.stringify(svc[0] || null));
  assert('turn_on sends NO optional params when none are advertised',
    svc.length === 1 && Object.keys(svc[0].data).length === 1, JSON.stringify(svc[0] && svc[0].data));

  stub.states['siren.horn'] = { entity_id: 'siren.horn', state: 'on', attributes: { supported_features: 3 } };
  svc.length = 0;
  p.triggerSiren(mkSiren({ entity_id: 'siren.horn' }));
  assert('bound siren.* ON dispatches siren.turn_off',
    svc.length === 1 && svc[0].domain === 'siren' && svc[0].service === 'turn_off',
    JSON.stringify(svc[0] || null));
  assert('siren dispatch never uses a blind toggle',
    svc.every(c => c.service !== 'toggle'), JSON.stringify(svc));

  // tone / volume / duration ride turn_on ONLY when the entity advertises them.
  stub.states['siren.rich'] = { entity_id: 'siren.rich', state: 'off',
    attributes: { supported_features: 31, available_tones: ['bell', 'ping'] } };
  svc.length = 0;
  p.triggerSiren(mkSiren({ entity_id: 'siren.rich', tone: 'bell', volume: 0.4, duration: 20 }));
  assert('turn_on carries the configured tone/volume/duration when advertised',
    svc.length === 1 && svc[0].data.tone === 'bell' && svc[0].data.volume_level === 0.4
    && svc[0].data.duration === 20, JSON.stringify(svc[0] && svc[0].data));
  stub.states['siren.poor'] = { entity_id: 'siren.poor', state: 'off', attributes: { supported_features: 3 } };
  svc.length = 0;
  p.triggerSiren(mkSiren({ entity_id: 'siren.poor', tone: 'bell', volume: 0.4, duration: 20 }));
  assert('configured params are withheld from an entity that does not advertise them',
    svc.length === 1 && svc[0].data.tone === undefined && svc[0].data.volume_level === undefined
    && svc[0].data.duration === undefined, JSON.stringify(svc[0] && svc[0].data));

  // allowControl:false — a DISPLAY-ONLY beacon. Refuses in EVERY mode (edit too),
  // for bound and unbound alike (the Door.lockControl 'display' precedent).
  svc.length = 0;
  p.triggerSiren(mkSiren({ entity_id: 'siren.horn', allowControl: false }));
  assert('allowControl:false refuses a bound siren in edit mode', svc.length === 0, `calls=${svc.length}`);
  const dOnly = mkSiren({ entity_id: null, localState: 'off', allowControl: false });
  p.triggerSiren(dOnly);
  assert('allowControl:false refuses an unbound siren (localState unchanged)', dOnly.localState === 'off', dOnly.localState);
  const allowed = mkSiren({ entity_id: null, localState: 'off', allowControl: true });
  p.triggerSiren(allowed);
  assert('allowControl:true still controls', allowed.localState === 'on', allowed.localState);

  // Bound switch.* (relay siren) → switch.toggle
  svc.length = 0;
  p.triggerSiren(mkSiren({ entity_id: 'switch.siren_relay' }));
  assert('bound switch.* dispatches switch.toggle',
    svc.length === 1 && svc[0].domain === 'switch' && svc[0].service === 'toggle',
    JSON.stringify(svc[0] || null));

  // Bound binary_sensor → display-only, no service call
  svc.length = 0;
  p.triggerSiren(mkSiren({ entity_id: 'binary_sensor.siren_state' }));
  assert('bound binary_sensor is display-only (no service call)', svc.length === 0, `calls=${svc.length}`);

  // Unbound → flip localState (demo/Test)
  const un = mkSiren({ entity_id: null, localState: 'off' });
  svc.length = 0;
  p.triggerSiren(un);
  assert('unbound Test flips localState off→on', un.localState === 'on', un.localState);
  p.triggerSiren(un);
  assert('unbound Test flips localState on→off', un.localState === 'off', un.localState);
  assert('unbound never hits callService', svc.length === 0, `calls=${svc.length}`);

  // View mode refuses everything
  p.uiMode = 'view';
  const vb = mkSiren({ entity_id: 'siren.horn' });
  const vu = mkSiren({ entity_id: null, localState: 'off' });
  svc.length = 0;
  p.triggerSiren(vb); p.triggerSiren(vu);
  assert('view mode: bound siren refuses (no service call)', svc.length === 0, `calls=${svc.length}`);
  assert('view mode: unbound siren refuses (localState unchanged)', vu.localState === 'off', vu.localState);

  // Kiosk FIRES (a siren is safety-relevant — same call as the alarm keypad).
  // Planner.save() no-ops outside edit, so an unbound flip is session-only.
  p.uiMode = 'kiosk';
  stub.states['siren.horn'] = { entity_id: 'siren.horn', state: 'off', attributes: { supported_features: 3 } };
  svc.length = 0;
  p.triggerSiren(mkSiren({ entity_id: 'siren.horn' }));
  assert('kiosk mode: bound siren fires turn_on',
    svc.length === 1 && svc[0].service === 'turn_on', JSON.stringify(svc[0] || null));
  const ku = mkSiren({ entity_id: null, localState: 'off' });
  p.triggerSiren(ku);
  assert('kiosk mode: unbound siren flips localState (session-only)', ku.localState === 'on', ku.localState);
  p.uiMode = 'edit';

  // ── render ────────────────────────────────────────────────────────────────
  const pass = results.filter(x => x.ok).length;
  const total = results.length;
  const fails = results.filter(x => !x.ok).map(x => x.name);
  document.getElementById('log').textContent = results.map(t => `${t.ok ? 'PASS' : 'FAIL'} ${t.name} — ${t.detail}`).join('\n');
  document.title = fails.length === 0 ? `SIREN PASS ${pass}/${total}` : `SIREN FAIL ${pass}/${total} [${fails.join(',')}]`;
</script>
