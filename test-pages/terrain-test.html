<!doctype html>
<meta charset="utf-8">
<title>terrain test</title>
<style>html,body{margin:0;background:#111;color:#ccc;font:12px sans-serif}#c{width:1280px;height:880px}</style>
<div id="c"></div>
<!--
  Batch T1 — Terrain foundation.

  Pure matrix (geometry.mod.js): groundAreaSkirtBase over nested tiers, hidden
  areas skipped, sunken negative, highest-wins, non-containing sibling ignored;
  polygonCentroid interior point.

  Renderer harness (built three-renderer.js):
   - terrace TOP patch at y = elevationMm + 4;
   - skirt mesh exists only when elevation ≠ 0;
   - angled (grass) skirt out-flares vs vertical (rock) for the same poly/elev;
   - a nested tier's skirt stops at the lower tier's elevation (skirtBase);
   - _groundYAt returns the terrace height inside the poly / grade (0) outside;
   - yard-fill underlay patch exists only when Floor.yardFill is set and is
     punched with wall-loop holes (no triangle centroid inside the loop);
   - the `ground` layer flag flips the whole group;
   - a rebuild with a changed elevation re-lands the top patch (dirty-key proxy);
   - a robot rig re-grounds on a terrace top via _groundYAt (mower hookup).

  Ground level (Scene3D.groundLevelMm — the SURROUNDINGS move, the house does
  not): defaults are byte-compatible (grid/neighborhood y=0, yard fill y=2);
  a lowered level drops the backdrop grid, the neighborhood overlay GROUP and
  the yard-fill underlay, leaves authored ground areas / terraces where they
  are, runs the fill continuously UNDER the raised house pad (the wall-loop
  holes are punched only at level ≥ 0 — below it they'd expose the backdrop
  grid), makes _groundYAt return the level OUTSIDE every wall loop but 0 inside
  (and terrace tops keep their authored height), re-applies on a neighborhood-
  only rebuild, falls back to the floor's level when updateGroundAreas is
  called without the arg, clamps at ±10 000 mm, and restores exactly at 0.

  Section K (terrace-aware _itemGroundY): free-standing content (trees, seats,
  fences) grounds on an authored TERRACE, not just the flat grade, so the visual
  build agrees with _groundYAt everywhere; a sunken tier reads as a pit (surface
  moved, pit walls to the surrounding level) and a pad drawn inside it skirts
  down to that tier instead of floating over it as a thicker slab. Stair treads
  and riser decks stay EXCLUDED (pieces on a riser carry a manual `elevation`).

  Build the geometry bundle next to this file:
    npx esbuild src/geometry.ts --bundle --format=esm --outfile=<harness>/geometry.mod.js
  and serve the built renderer chunk (dist/assets/three-renderer.js) alongside.
-->
<script type="module">
  const G = await import('./geometry.mod.js');
  const mod = await import('./assets/three-renderer.js');
  const r = new mod.ThreeDRenderer(document.getElementById('c'));
  await r.load();

  const tests = [];
  const ok = (name, cond, detail) => tests.push({ name, ok: !!cond, detail });

  // ── Pure: groundAreaSkirtBase / polygonCentroid ─────────────────────────
  const sq = (cx, cy, half) => [
    { x: cx - half, y: cy - half }, { x: cx + half, y: cy - half },
    { x: cx + half, y: cy + half }, { x: cx - half, y: cy + half },
  ];
  // 3 concentric tiers about (5000,5000): outer@0, mid@600, inner@1200.
  const outer = { id: 'o', kind: 'grass', points: sq(5000, 5000, 3000), elevationMm: 0 };
  const mid   = { id: 'm', kind: 'grass', points: sq(5000, 5000, 2000), elevationMm: 600 };
  const inner = { id: 'i', kind: 'grass', points: sq(5000, 5000, 1000), elevationMm: 1200 };
  const tiers = [outer, mid, inner];
  ok('P1 nested inner@1200 skirtBase = mid 600', G.groundAreaSkirtBase(inner, tiers) === 600,
     `base=${G.groundAreaSkirtBase(inner, tiers)}`);
  ok('P2 nested mid@600 skirtBase = grade 0', G.groundAreaSkirtBase(mid, tiers) === 0,
     `base=${G.groundAreaSkirtBase(mid, tiers)}`);
  // Hidden mid tier is skipped → inner drops to the still-visible outer (0).
  const midHidden = { ...mid, hidden: true };
  ok('P3 hidden lower tier skipped', G.groundAreaSkirtBase(inner, [outer, midHidden, inner]) === 0,
     `base=${G.groundAreaSkirtBase(inner, [outer, midHidden, inner])}`);
  // Single sunken area → base 0 (skirt rises to grade).
  const sunk = { id: 's', kind: 'water', points: sq(5000, 5000, 1500), elevationMm: -500 };
  ok('P4 sunken negative single → base 0', G.groundAreaSkirtBase(sunk, [sunk]) === 0,
     `base=${G.groundAreaSkirtBase(sunk, [sunk])}`);
  // Highest-wins: inner@1500 over two containing lowers 600 & 900 → 900.
  const low600 = { id: 'l6', kind: 'grass', points: sq(5000, 5000, 2500), elevationMm: 600 };
  const low900 = { id: 'l9', kind: 'grass', points: sq(5000, 5000, 2000), elevationMm: 900 };
  const in1500 = { id: 'h', kind: 'grass', points: sq(5000, 5000, 1000), elevationMm: 1500 };
  ok('P5 highest containing lower wins (900)',
     G.groundAreaSkirtBase(in1500, [low600, low900, in1500]) === 900,
     `base=${G.groundAreaSkirtBase(in1500, [low600, low900, in1500])}`);
  // Non-containing lower sibling is ignored.
  const far600 = { id: 'f6', kind: 'grass', points: sq(500, 500, 400), elevationMm: 600 };
  ok('P6 non-containing lower ignored → 0',
     G.groundAreaSkirtBase(in1500, [far600, in1500]) === 0,
     `base=${G.groundAreaSkirtBase(in1500, [far600, in1500])}`);
  // Nesting is resolved by ENCLOSURE (smallest strictly-larger containing
  // polygon), so it reads correctly in both directions, not just "raised on
  // raised": a pedestal drawn inside a sunken lawn drops to the lawn, and the
  // lawn itself is NOT dragged up by the small pad drawn on top of it.
  const bigSunk = { id: 'bs', kind: 'grass', points: sq(5000, 5000, 3000), elevationMm: -950 };
  const padIn   = { id: 'pi', kind: 'concrete', points: sq(5000, 5000, 500), elevationMm: 100 };
  ok('P8 raised pad inside a sunken lawn drops to the lawn (−950)',
     G.groundAreaSkirtBase(padIn, [bigSunk, padIn]) === -950,
     `base=${G.groundAreaSkirtBase(padIn, [bigSunk, padIn])}`);
  ok('P9 the sunken lawn is not lifted by the pad drawn inside it (0)',
     G.groundAreaSkirtBase(bigSunk, [bigSunk, padIn]) === 0,
     `base=${G.groundAreaSkirtBase(bigSunk, [bigSunk, padIn])}`);
  const deepPit = { id: 'dp', kind: 'water', points: sq(5000, 5000, 900), elevationMm: -1600 };
  ok('P10 a pit inside a pit stops at the outer pit floor (−950)',
     G.groundAreaSkirtBase(deepPit, [bigSunk, deepPit]) === -950,
     `base=${G.groundAreaSkirtBase(deepPit, [bigSunk, deepPit])}`);
  // polygonCentroid of a square is its center; inside the polygon.
  const ctr = G.polygonCentroid(sq(5000, 5000, 1000));
  ok('P7 polygonCentroid is the interior center',
     Math.abs(ctr.x - 5000) < 1 && Math.abs(ctr.y - 5000) < 1 && G.pointInPolygon(ctr.x, ctr.y, sq(5000, 5000, 1000)),
     `ctr=(${ctr.x.toFixed(0)},${ctr.y.toFixed(0)})`);

  // ── Renderer harness ────────────────────────────────────────────────────
  const FW = 12000, FD = 10000;
  const scene = { preset: 'day', floorColor: '#8a7860', floorTex: 'none', wallColor: '#cfd2d6' };
  const mkFloor = (groundAreas = [], extra = {}) => ({
    id: 'f1', name: 'T', w: FW, d: FD, walls: [], furniture: [],
    lights: [], switches: [], sensors: [], motionSensors: [], envSensors: [],
    doors: [], windows: [], bg: null, model3d: null, look3d: null, rooms: [],
    groundAreas, ...extra,
  });
  const skirtsOf = () => r._groundGroup.children.filter(c => c.userData && c.userData.terraceSkirt);
  const topsOf = () => r._groundGroup.children.filter(c => c.userData && c.userData.terraceTop !== undefined);
  const yardOf = () => r._groundGroup.children.filter(c => c.userData && c.userData.yardFill);
  const bboxSize = (mesh) => {
    mesh.geometry.computeBoundingBox();
    const b = mesh.geometry.boundingBox;
    return { x: b.max.x - b.min.x, y: b.max.y - b.min.y, z: b.max.z - b.min.z };
  };

  // R1: a raised grass terrace tops out at elev + 4.
  const raised = { id: 'gt', kind: 'grass', points: sq(4000, 4000, 1000), elevationMm: 600 };
  r.updateFloor(mkFloor([raised]), scene);
  r.updateGroundAreas([raised]);
  {
    const top = topsOf()[0];
    ok('R1 terrace top y = elevationMm + 4',
       !!top && top.position.y === 604 && top.userData.terraceTop === 600,
       `y=${top?.position.y} terraceTop=${top?.userData.terraceTop}`);
    ok('R2b raised terrace HAS a skirt', skirtsOf().length === 1, `skirts=${skirtsOf().length}`);
  }

  // R2: a flat (elev 0) area has NO skirt.
  const flat = { id: 'gf', kind: 'grass', points: sq(4000, 4000, 1000), elevationMm: 0 };
  r.updateGroundAreas([flat]);
  ok('R2 flat area (elev 0) has NO skirt', skirtsOf().length === 0, `skirts=${skirtsOf().length}`);

  // R3: angled (grass) skirt out-flares vs vertical (rock) for same poly/elev.
  const grassT = { id: 'ga', kind: 'grass', points: sq(4000, 4000, 1000), elevationMm: 600 };
  r.updateGroundAreas([grassT]);
  const grassSkirtSize = bboxSize(skirtsOf()[0]);
  const grassAngled = skirtsOf()[0].userData.skirtAngled;
  const rockT = { id: 'ra', kind: 'rock', points: sq(4000, 4000, 1000), elevationMm: 600 };
  r.updateGroundAreas([rockT]);
  const rockSkirtSize = bboxSize(skirtsOf()[0]);
  const rockAngled = skirtsOf()[0].userData.skirtAngled;
  ok('R3 angled grass skirt flares wider than vertical rock skirt',
     grassAngled === true && rockAngled === false &&
     grassSkirtSize.x > rockSkirtSize.x + 100 && grassSkirtSize.z > rockSkirtSize.z + 100,
     `grass=${grassSkirtSize.x.toFixed(0)}x${grassSkirtSize.z.toFixed(0)} rock=${rockSkirtSize.x.toFixed(0)}x${rockSkirtSize.z.toFixed(0)}`);

  // R4: nested tiers' skirts each stop at the lower tier's elevation (a DEEP
  // 3-tier nest: outer@300, mid@600, inner@1200 → skirt bases 0 / 300 / 600).
  {
    const dOuter = { id: 'do', kind: 'grass', points: sq(6000, 5000, 2500), elevationMm: 300 };
    const dMid   = { id: 'dm', kind: 'grass', points: sq(6000, 5000, 1600), elevationMm: 600 };
    const dInner = { id: 'di', kind: 'grass', points: sq(6000, 5000, 800),  elevationMm: 1200 };
    r.updateGroundAreas([dOuter, dMid, dInner]);
    const bases = skirtsOf().map(s => s.userData.skirtBase).sort((a, b) => a - b);
    // three skirts; the innermost (1200) sits on 600, the mid (600) on 300, the
    // outer (300) on grade 0.
    ok('R4 nested skirts stop at the lower tier elevation',
       bases.length === 3 && bases[0] === 0 && bases[1] === 300 && bases[2] === 600,
       `bases=[${bases.join(',')}]`);
  }

  // R5: _groundYAt returns terrace height inside the poly / grade outside.
  r.updateFloor(mkFloor([raised]), scene);   // raised: sq(4000,4000,1000)@600
  const yIn = r._groundYAt(4000, 4000);
  const yOut = r._groundYAt(8000, 8000);
  ok('R5 _groundYAt = elevation inside / 0 outside', yIn === 600 && yOut === 0,
     `in=${yIn} out=${yOut}`);

  // R5b: a sunken terrace reads its (negative) top y and a skirt to grade 0.
  const sunkT = { id: 'st', kind: 'water', points: sq(4000, 4000, 1000), elevationMm: -500 };
  r.updateFloor(mkFloor([sunkT]), scene);
  r.updateGroundAreas([sunkT]);
  {
    const top = topsOf()[0], skirt = skirtsOf()[0];
    ok('R5b sunken top y = -496, skirt base 0, _groundYAt = -500',
       !!top && top.position.y === -496 && !!skirt && skirt.userData.skirtBase === 0 &&
       r._groundYAt(4000, 4000) === -500,
       `topY=${top?.position.y} base=${skirt?.userData.skirtBase} gy=${r._groundYAt(4000, 4000)}`);
  }

  // R6/R7: yard-fill underlay — exists only when set, punched by wall loops.
  // A closed rectangular wall loop (house) inside the yard.
  const loopPts = [
    { x: 3000, y: 3000 }, { x: 7000, y: 3000 }, { x: 7000, y: 6000 },
    { x: 3000, y: 6000 }, { x: 3000, y: 3000 },
  ];
  const walls = [{ id: 'w', points: loopPts, kind: 'full' }];
  // no yardFill → no yard-fill mesh.
  r.updateGroundAreas([], undefined, FW, FD, walls);
  ok('R6 no yard-fill mesh when Floor.yardFill unset', yardOf().length === 0, `yard=${yardOf().length}`);
  // yardFill grass → exactly one yard-fill mesh at y=2.
  r.updateGroundAreas([], 'grass', FW, FD, walls);
  {
    const yf = yardOf()[0];
    ok('R6b yard-fill mesh exists (y=2) when set', yardOf().length === 1 && !!yf && yf.position.y === 2,
       `yard=${yardOf().length} y=${yf?.position.y}`);
    // Hole check: no yard-fill triangle centroid inside the wall loop.
    const loop = loopPts.slice(0, 4);
    const geo = yf.geometry;
    const pos = geo.getAttribute('position');
    const idx = geo.getIndex();
    const readW = (vi) => ({ x: FW / 2 - pos.getX(vi), y: FD / 2 - pos.getY(vi) });
    const triN = idx ? idx.count / 3 : pos.count / 3;
    let inLoop = 0;
    for (let t = 0; t < triN; t++) {
      const a = idx ? idx.getX(t * 3) : t * 3, b = idx ? idx.getX(t * 3 + 1) : t * 3 + 1, c = idx ? idx.getX(t * 3 + 2) : t * 3 + 2;
      const wa = readW(a), wb = readW(b), wc = readW(c);
      const cx = (wa.x + wb.x + wc.x) / 3, cy = (wa.y + wb.y + wc.y) / 3;
      if (G.pointInPolygon(cx, cy, loop)) inLoop++;
    }
    ok('R7 yard-fill is punched with the wall-loop hole', inLoop === 0, `inLoop=${inLoop}/${triN}`);
  }

  // R8: `ground` layer flag flips the whole group's visibility.
  r.setLayerVisibility({ ground: false });
  const hidden = r._groundGroup.visible === false;
  r.setLayerVisibility({ ground: true });
  const shown = r._groundGroup.visible === true;
  ok('R8 ground layer flag hides / shows the group', hidden && shown, `hidden=${hidden} shown=${shown}`);

  // R9: rebuild after an elevation change re-lands the top patch (dirty-key
  // proxy — three-view folds elevationMm into _keyGround; here we prove the
  // rebuild output tracks the field).
  const a900 = { id: 'gt', kind: 'grass', points: sq(4000, 4000, 1000), elevationMm: 900 };
  r.updateGroundAreas([a900]);
  ok('R9 rebuild tracks elevation change (top y 904)', topsOf()[0].position.y === 904,
     `y=${topsOf()[0].position.y}`);

  // R10: a robot rig re-grounds on a terrace top via _groundYAt (mower hookup).
  r.updateFloor(mkFloor([raised]), scene);   // raised sq(4000,4000,1000)@600
  const robot = { id: 'rb1', kind: 'mower', x: 4000, y: 4000, w: 600, h: 400, rotation: 0 };
  const rstate = { rb1: { x: 4000, y: 4000, heading: 0, phase: 0, activity: 'docked', led: '#43a047' } };
  r.updateRobotRigs([robot], rstate);
  {
    const rig = r._robotRigs['rb1'];
    // docked → bob 0 → group.y === terrain height (600).
    ok('R10 robot rig re-grounds on the terrace (y=600)',
       !!rig && Math.abs(rig.group.position.y - 600) < 1e-6,
       `y=${rig?.group.position.y}`);
    // off-terrace → grade 0.
    r.updateRobotRigs([robot], { rb1: { ...rstate.rb1, x: 9000, y: 9000 } });
    const rig2 = r._robotRigs['rb1'];
    ok('R10b robot rig at grade off-terrace (y=0)', Math.abs(rig2.group.position.y - 0) < 1e-6,
       `y=${rig2.group.position.y}`);
  }

  // ── G: ground level (Scene3D.groundLevelMm) — surroundings move, house doesn't
  {
    // A closed house loop so _outdoors can tell inside from outside, plus one
    // authored terrace OUTSIDE it (must keep its own elevation).
    const houseLoop = [
      { x: 3000, y: 3000 }, { x: 7000, y: 3000 }, { x: 7000, y: 6000 },
      { x: 3000, y: 6000 }, { x: 3000, y: 3000 },
    ];
    const houseWalls = [{ id: 'gw', points: houseLoop, kind: 'full' }];
    const terr = { id: 'gterr', kind: 'grass', points: sq(9500, 8000, 700), elevationMm: 500 };
    const mkG = (sc3) => {
      r.updateFloor(mkFloor([terr], { walls: houseWalls }), sc3);
      r.updateGroundAreas([terr], 'grass', FW, FD, houseWalls, false, sc3.groundLevelMm);
    };
    // Minimal neighborhood payload (one building + one road + one water patch).
    const nb = {
      buildings: [{ points: sq(11000, 2000, 600), heightMm: 6000, baseMm: 0 }],
      roads: [{ points: [{ x: 0, y: 1500 }, { x: FW, y: 1500 }], widthMm: 3000, cls: 'residential', bridge: false }],
      water: [{ points: sq(1000, 9000, 500), cls: 'water' }],
      landuse: [], fetchedAt: 0, tileCount: 1, tileAddrs: [],
    };

    // G0: defaults are exactly today's numbers.
    mkG(scene);
    r.updateNeighborhood(nb, { opacity: 1 });
    ok('G0 default: grid + neighborhood at y=0, yard fill at y=2',
       r._grid.position.y === 0 && r._neighborhoodGroup.position.y === 0 && yardOf()[0].position.y === 2,
       `grid=${r._grid.position.y} nbhd=${r._neighborhoodGroup.position.y} yard=${yardOf()[0]?.position.y}`);
    ok('G0b default: _groundYAt outdoors = 0', r._groundYAt(11000, 9500) === 0,
       `gy=${r._groundYAt(11000, 9500)}`);
    const nbKids = r._neighborhoodGroup.children.length;
    ok('G0c neighborhood payload actually built', nbKids >= 3, `children=${nbKids}`);

    // G1..G7: lowered surroundings (raised-foundation case).
    const LOW = -600;
    const sceneLow = { ...scene, groundLevelMm: LOW };
    mkG(sceneLow);
    r.updateNeighborhood(nb, { opacity: 1 });
    ok('G1 backdrop grid drops to the ground level', r._grid.position.y === LOW, `y=${r._grid.position.y}`);
    ok('G2 neighborhood group drops to the ground level', r._neighborhoodGroup.position.y === LOW,
       `y=${r._neighborhoodGroup.position.y}`);
    ok('G3 yard-fill underlay at 2 + level', yardOf()[0].position.y === 2 + LOW,
       `y=${yardOf()[0]?.position.y}`);
    // An area whose CENTROID is outdoors is paint ON the yard, so its authored
    // elevationMm stacks on the grade (level + elev + 4). (Superseded the
    // original "authored areas never move" rule — a grass patch painted on a
    // lowered yard used to float above the yard fill.)
    ok('G4 outdoor ground area stacks on the grade (level + elev + 4)',
       topsOf()[0].position.y === LOW + 504, `y=${topsOf()[0]?.position.y}`);
    ok('G5 _groundYAt outdoors = ground level', r._groundYAt(11000, 9500) === LOW,
       `gy=${r._groundYAt(11000, 9500)}`);
    ok('G6 _groundYAt inside the wall loop stays on the slab (0)', r._groundYAt(5000, 4500) === 0,
       `gy=${r._groundYAt(5000, 4500)}`);
    // …and _groundYAt agrees with the patch it just built (the tier's walkable
    // top is level + elevation, 4 mm under the visual top).
    ok('G7 _groundYAt on an outdoor terrace = level + authored height',
       r._groundYAt(9500, 8000) === LOW + 500, `gy=${r._groundYAt(9500, 8000)}`);
    // Building prisms keep their local podium base — only the group moved.
    {
      const prism = r._neighborhoodGroup.children.find(c => c.geometry && c.geometry.type === 'ExtrudeGeometry');
      ok('G8 neighborhood building keeps local base 0 (whole-group offset)',
         !!prism && prism.position.y === 0, `y=${prism?.position.y}`);
    }
    // G9: a neighborhood-ONLY rebuild re-applies the offset (key-order safety).
    r.updateNeighborhood(null, null);
    r.updateNeighborhood(nb, { opacity: 1 });
    ok('G9 neighborhood-only rebuild re-applies the offset', r._neighborhoodGroup.position.y === LOW,
       `y=${r._neighborhoodGroup.position.y}`);

    // G9b: with a LOWERED grade the yard fill runs continuously under the raised
    // house pad (no wall-loop holes to see the backdrop grid through). At level
    // 0 the holes are still punched — that's R7 above.
    {
      const yf = yardOf()[0];
      const geo = yf.geometry, pos = geo.getAttribute('position'), idx = geo.getIndex();
      const readW = (vi) => ({ x: FW / 2 - pos.getX(vi), y: FD / 2 - pos.getY(vi) });
      const triN = idx ? idx.count / 3 : pos.count / 3;
      let inLoop = 0;
      for (let t = 0; t < triN; t++) {
        const a = idx ? idx.getX(t * 3) : t * 3, b = idx ? idx.getX(t * 3 + 1) : t * 3 + 1, c = idx ? idx.getX(t * 3 + 2) : t * 3 + 2;
        const wa = readW(a), wb = readW(b), wc = readW(c);
        const cx = (wa.x + wb.x + wc.x) / 3, cy = (wa.y + wb.y + wc.y) / 3;
        if (G.pointInPolygon(cx, cy, houseLoop.slice(0, 4))) inLoop++;
      }
      ok('G9b lowered grade fills UNDER the house pad (no wall-loop hole)', inLoop > 0,
         `inLoop=${inLoop}/${triN}`);
    }

    // G10: updateGroundAreas without the arg falls back to the floor's level.
    r.updateGroundAreas([terr], 'grass', FW, FD, houseWalls);
    ok('G10 yard fill falls back to the floor level without the arg',
       yardOf()[0].position.y === 2 + LOW, `y=${yardOf()[0]?.position.y}`);

    // G11: a rig standing outdoors settles onto the lowered ground.
    {
      const robot = { id: 'grb', kind: 'mower', x: 11000, y: 9500, w: 600, h: 400, rotation: 0 };
      r.updateRobotRigs([robot], { grb: { x: 11000, y: 9500, heading: 0, phase: 0, activity: 'docked', led: '#43a047' } });
      const rig = r._robotRigs['grb'];
      ok('G11 outdoor robot rig settles on the lowered ground',
         !!rig && Math.abs(rig.group.position.y - LOW) < 1e-6, `y=${rig?.group.position.y}`);
    }

    // G12: the ±10 000 clamp now guards the USER's stored offset only, and it
    // lives in geometry.ts (pure — three-view clamps without importing the lazy
    // renderer chunk); three-renderer re-exports it from its historical home.
    ok('G12 user ground offset clamps at ±10000 (pure)',
       G.resolveGroundLevelMm(-99999) === -10000 && G.resolveGroundLevelMm(99999) === 10000 &&
       G.resolveGroundLevelMm(-600) === -600 && G.resolveGroundLevelMm(undefined) === 0,
       `${G.resolveGroundLevelMm(-99999)}/${G.resolveGroundLevelMm(99999)}`);
    ok('G12a renderer re-exports the same clamp',
       mod.resolveGroundLevelMm(-99999) === -10000 && mod.resolveGroundLevelMm(250) === 250);
    // G12b: the EFFECTIVE level the renderer consumes (user offset − active
    // floor elevation) must NOT be re-clamped — a 3rd story is −9000 before the
    // user offset even starts, so re-clamping would pin tall stacks to grade.
    mkG({ ...scene, groundLevelMm: -15000 });
    ok('G12b effective ground level is NOT re-clamped by the renderer',
       r._grid.position.y === -15000, `y=${r._grid.position.y}`);

    // G13: back to 0 restores exactly (default path unchanged).
    mkG(scene);
    r.updateNeighborhood(nb, { opacity: 1 });
    ok('G13 level 0 restores grid/neighborhood/yard/_groundYAt exactly',
       r._grid.position.y === 0 && r._neighborhoodGroup.position.y === 0 &&
       yardOf()[0].position.y === 2 && r._groundYAt(11000, 9500) === 0,
       `grid=${r._grid.position.y} nbhd=${r._neighborhoodGroup.position.y} yard=${yardOf()[0]?.position.y} gy=${r._groundYAt(11000, 9500)}`);
    r.updateNeighborhood(null, null);   // leave the frustum as we found it
  }

  // ── H: FREE-STANDING content follows the ground level ────────────────────
  // One rule (_itemGroundY): anything planted on the ground whose plan anchor
  // is OUTSIDE every closed wall loop builds on the surroundings grade; things
  // mounted on the HOUSE (wall plates, wall/ceiling light kinds) and everything
  // indoors stay slab-relative. Every H case runs at level −600 AND at 0, and
  // the 0 run must reproduce the pre-ground-level numbers exactly.
  {
    const LOW = -600;
    const houseLoop = [
      { x: 3000, y: 3000 }, { x: 7000, y: 3000 }, { x: 7000, y: 6000 },
      { x: 3000, y: 6000 }, { x: 3000, y: 3000 },
    ];
    const houseWalls = [{ id: 'hw', points: houseLoop, kind: 'full' }];
    const OUT = { x: 10000, y: 8000 };     // clear of the house loop
    const IN  = { x: 5000,  y: 4500 };     // inside it
    const sceneAt = (gl) => (gl === 0 ? scene : { ...scene, groundLevelMm: gl });
    const near = (a, b, tol = 1e-6) => Math.abs(a - b) <= tol;

    // ── H1/H2: furniture. An outdoor tree stands on the grade, an identical
    // indoor one does not. Groups are found by their scene x (= fw/2 − wx).
    const fu = (id, kind, x, y, w, h, extra = {}) =>
      ({ id, kind, x, y, w, h, rotation: 0, ...extra });
    const grpAtWorldX = (wx) => r._floorGroup.children.find(
      c => c.type === 'Group' && Math.abs(c.position.x - (FW / 2 - wx)) < 1);
    const treeYs = (gl) => {
      r.updateFloor(mkFloor([], {
        walls: houseWalls,
        furniture: [fu('tOut', 'tree', OUT.x, OUT.y, 900, 900),
                    fu('tIn', 'tree', IN.x, IN.y, 900, 900)],
      }), sceneAt(gl));
      return { out: grpAtWorldX(OUT.x)?.position.y, in: grpAtWorldX(IN.x)?.position.y };
    };
    {
      const lo = treeYs(LOW), zero = treeYs(0);
      ok('H1 outdoor furniture stands on the lowered grade, indoor does not',
         near(lo.out, LOW) && near(lo.in, 0), `out=${lo.out} in=${lo.in}`);
      ok('H2 level 0 restores both to the slab exactly',
         zero.out === 0 && zero.in === 0, `out=${zero.out} in=${zero.in}`);
    }

    // ── H3/H4: an outdoor lawn chair's SitSpot rides the grade, and a rig that
    // dwells there sits ON the cushion (the whole seated pose drops with it).
    const realNow = performance.now.bind(performance);
    let fakeNow = realNow();
    performance.now = () => fakeNow;
    const sitOnLawnChair = (gl) => {
      r.clearTransientGroups();
      r.updateFloor(mkFloor([], {
        walls: houseWalls,
        furniture: [fu('lc', 'lawn_chair', OUT.x, OUT.y, 700, 1200)],
      }), sceneAt(gl));
      const seatY = r._sitSpots[0]?.seatY;
      for (let i = 0; i < 420; i++) {
        fakeNow += 16.7;
        r.updateTargets([{ key: 'LC', x: OUT.x, y: OUT.y - 700, color: 0x4fc3f7 }]);
      }
      const h = r._humanoids['LC'];
      return { seatY, sit: h?.sit ?? 0, rootY: h?.group.position.y ?? NaN };
    };
    {
      const lo = sitOnLawnChair(LOW), zero = sitOnLawnChair(0);
      // lawn_chair seat = 380 mm; the spot is the seat height + the grade.
      ok('H3 outdoor SitSpot seat height rides the grade',
         near(zero.seatY, 380) && near(lo.seatY, 380 + LOW),
         `seat0=${zero.seatY} seatLow=${lo.seatY}`);
      ok('H4 a rig seated outdoors drops with the chair (Δroot = level)',
         lo.sit > 0.9 && zero.sit > 0.9 && near(lo.rootY - zero.rootY, LOW, 1),
         `sit=${lo.sit.toFixed(2)}/${zero.sit.toFixed(2)} Δroot=${(lo.rootY - zero.rootY).toFixed(1)}`);
    }
    performance.now = realNow;

    // ── H5: ground areas — an INDOOR area is floor covering and never moves.
    {
      const inArea = { id: 'ai', kind: 'concrete', points: sq(IN.x, IN.y, 400), elevationMm: 0 };
      const outArea = { id: 'ao', kind: 'grass', points: sq(OUT.x, OUT.y, 700), elevationMm: 0 };
      r.updateFloor(mkFloor([inArea, outArea], { walls: houseWalls }), sceneAt(LOW));
      r.updateGroundAreas([inArea, outArea], undefined, FW, FD, houseWalls, false, LOW);
      const tops = topsOf();
      const yIn = tops.find(t => Math.abs(t.position.x - (FW / 2 - IN.x)) < 5000 && t.position.y === 4);
      const ys = tops.map(t => t.position.y).sort((a, b) => a - b);
      ok('H5 outdoor patch on the grade (4 + level), indoor patch at 4',
         ys.length === 2 && ys[0] === LOW + 4 && ys[1] === 4 && !!yIn,
         `ys=[${ys.join(',')}]`);
    }

    // ── H6: pools. An outdoor basin recesses from the grade.
    {
      const pool = { id: 'pl', kind: 'pool', points: sq(OUT.x, OUT.y, 1200), depthMm: 1400 };
      const surfOf = () => r._poolGroup.children.find(c => c.userData && c.userData.poolWater)?.position.y;
      r.updateFloor(mkFloor([], { walls: houseWalls, pools: [pool] }), sceneAt(LOW));
      r.updatePools([pool], () => null);
      const lo = surfOf();
      r.updateFloor(mkFloor([], { walls: houseWalls, pools: [pool] }), sceneAt(0));
      r.updatePools([pool], () => null);
      const zero = surfOf();
      ok('H6 outdoor pool water surface rides the grade',
         near(zero, G.poolWaterSurfaceY(pool)) && near(lo, G.poolWaterSurfaceY(pool) + LOW),
         `surf0=${zero} surfLow=${lo}`);
    }

    // ── H7/H8: lights. A ground-standing lamp (+ its floor pool) follows the
    // grade outdoors; a WALL-mounted sconce and a wall switch never do.
    {
      const lamp = { id: 'lp', x: OUT.x, y: OUT.y, entity_id: null, iconKind: 'lamp',
                     height: 1500, localState: 'on' };
      const sconce = { id: 'sc', x: OUT.x + 500, y: OUT.y, entity_id: null, iconKind: 'sconce',
                       height: 2200, localState: 'on' };
      const sw = { id: 'sw1', x: OUT.x, y: OUT.y + 500, entity_id: null, localState: 'on' };
      const read = (gl) => {
        r.updateFloor(mkFloor([], { walls: houseWalls, lights: [lamp, sconce], switches: [sw] }), sceneAt(gl));
        r.updateLightsSwitches([lamp, sconce], [sw], () => null);
        const lit = r._lightGroup.children;
        const bodyAtX = (wx) => lit.find(c => c.type === 'Group' && Math.abs(c.position.x - (FW / 2 - wx)) < 1);
        const disc = lit.find(c => c.isMesh && c.geometry.type === 'CircleGeometry');
        return {
          lamp: bodyAtX(OUT.x)?.position.y, sconce: bodyAtX(OUT.x + 500)?.position.y,
          pool: disc?.position.y, sw: r._switchGroup.children[0]?.position.y,
        };
      };
      const lo = read(LOW), zero = read(0);
      // (A floor lamp's body group origin sits at the floor — the pole rises
      // from it — so the invariant is the DELTA, not an absolute height.)
      ok('H7 outdoor ground-standing lamp + its floor pool ride the grade',
         near(zero.pool, 3) && near(lo.pool - zero.pool, LOW) &&
         near(lo.lamp - zero.lamp, LOW) && zero.lamp != null,
         `lamp=${zero.lamp}/${lo.lamp} pool=${zero.pool}/${lo.pool}`);
      // H7b: fire pits are ground features too (GROUND_STANDING_LIGHT_KINDS) —
      // body origin sits ON the surface (bodyY = 0), so it and its floor pool
      // both take the grade offset. Square + round share the code path.
      {
        const readPit = (kind, gl) => {
          const pit = { id: 'fp', x: OUT.x, y: OUT.y, entity_id: null, iconKind: kind,
                        localState: 'on' };
          r.updateFloor(mkFloor([], { walls: houseWalls, lights: [pit] }), sceneAt(gl));
          r.updateLightsSwitches([pit], [], () => null);
          const lit = r._lightGroup.children;
          return {
            body: lit.find(c => c.type === 'Group')?.position.y,
            pool: lit.find(c => c.isMesh && c.geometry.type === 'CircleGeometry')?.position.y,
          };
        };
        for (const kind of ['firepit_round', 'firepit_square']) {
          const lo = readPit(kind, LOW), zero = readPit(kind, 0);
          ok(`H7b outdoor ${kind} + its floor pool ride the grade`,
             near(zero.body, 0) && near(lo.body - zero.body, LOW) &&
             near(zero.pool, 3) && near(lo.pool - zero.pool, LOW),
             `body=${zero.body}/${lo.body} pool=${zero.pool}/${lo.pool}`);
        }
      }
      ok('H8 wall-mounted sconce + wall switch never move',
         near(zero.sconce, lo.sconce) && near(zero.sw, lo.sw) && near(lo.sw, 1200),
         `sconce=${zero.sconce}/${lo.sconce} switch=${zero.sw}/${lo.sw}`);
    }

    // ── H9: GPS landmarks / pins. Outdoors they ride the grade; the indoor
    // "find my phone" pin stays slab-relative.
    {
      const lms = [{ x: OUT.x, y: OUT.y, name: 'Mailbox' }];
      const pins = [{ x: IN.x, y: IN.y, label: 'A', color: '#4fc3f7', stale: false }];
      const read = (gl) => {
        r.updateFloor(mkFloor([], { walls: houseWalls }), sceneAt(gl));
        r.updateGpsPins(pins, lms);
        return r._gpsGroup.children.map(c => c.position.y);
      };
      const lo = read(LOW), zero = read(0);
      ok('H9 outdoor landmark sprite rides the grade, indoor pin does not',
         zero[0] === 300 && zero[1] === 1800 && lo[0] === 300 + LOW && lo[1] === 1800,
         `zero=[${zero.join(',')}] low=[${lo.join(',')}]`);
    }

    // ── H10: the lawn-text decal is MOWED INTO the ground it lies on (the
    // reported bug: it stayed at slab height while the yard dropped).
    {
      const read = (gl) => {
        r.updateFloor(mkFloor([], { walls: houseWalls }), sceneAt(gl));
        r.updateBgTexts([{ id: 'g1', mode: 'grass', text: 'HELLO' }], false, 0, 0);
        return r._bgRigs.find(x => x.mode === 'grass')?.grassMesh?.position.y;
      };
      const lo = read(LOW), zero = read(0);
      ok('H10 grass background text follows the ground level',
         zero === 6 && near(lo, 6 + LOW), `y0=${zero} yLow=${lo}`);
      r.updateBgTexts([], false, 0, 0);
    }
  }

  // ── I: FIXED WORLD GROUND PLANE — per-floor elevation + effective level ───
  // The ground plane is fixed in the world and the floors sit relative to it;
  // the active slab still builds at scene y=0, so three-view feeds the renderer
  //   effGround = resolveGroundLevelMm(user offset) − floorElevationMm(active)
  // and every downstream consumer is unchanged. Pure resolver here + the
  // composed value landing on the real renderer.
  {
    const fl = (id, elevationMm) => ({ id, elevationMm });
    const autoStack = [fl('a'), fl('b'), fl('c')];              // all AUTO
    ok('I1 STORY_H_MM is 3000 (the nominal story)', G.STORY_H_MM === 3000, `v=${G.STORY_H_MM}`);
    ok('I2 auto elevation = index × STORY_H_MM (floors[0] sits ON the ground)',
       G.floorElevationMm(autoStack, 'a') === 0 &&
       G.floorElevationMm(autoStack, 'b') === 3000 &&
       G.floorElevationMm(autoStack, 'c') === 6000,
       `${autoStack.map(x => G.floorElevationMm(autoStack, x.id)).join(',')}`);
    const mixed = [fl('base', -2800), fl('mid'), fl('top', 5400)];
    ok('I3 explicit elevationMm wins over the auto index value',
       G.floorElevationMm(mixed, 'base') === -2800 && G.floorElevationMm(mixed, 'top') === 5400,
       `base=${G.floorElevationMm(mixed, 'base')} top=${G.floorElevationMm(mixed, 'top')}`);
    ok('I4 a floor without elevationMm still falls back to its own index',
       G.floorElevationMm(mixed, 'mid') === 3000, `mid=${G.floorElevationMm(mixed, 'mid')}`);
    ok('I5 negative elevation is legal (basement / walk-out below grade)',
       G.floorElevationMm([fl('x', -1300)], 'x') === -1300);
    ok('I6 unknown id / empty / null → 0, never NaN',
       G.floorElevationMm(autoStack, 'nope') === 0 && G.floorElevationMm([], 'a') === 0 &&
       G.floorElevationMm(null, 'a') === 0 && G.floorElevationMm(undefined, 'a') === 0);
    ok('I7 garbage elevationMm falls back to AUTO (never NaN)',
       G.floorElevationMm([fl('a'), { id: 'b', elevationMm: NaN }], 'b') === 3000 &&
       G.floorElevationMm([fl('a'), { id: 'b', elevationMm: Infinity }], 'b') === 3000);
    ok('I8 AUTO elevations resolve against the FULL array (a filtered list would re-stack)',
       G.floorElevationMm(autoStack, 'c') === 6000 &&
       G.floorElevationMm(autoStack.filter(x => x.id !== 'b'), 'c') === 3000,
       'documents why the map is built from store.floors, not the enabled-only list');

    // Composition on the real renderer: the ground plane must land at the SAME
    // world height whichever story is selected. Selecting story N just means the
    // grade sits N stories BELOW the (always-at-0) active slab.
    const houseLoop2 = [
      { x: 3000, y: 3000 }, { x: 7000, y: 3000 }, { x: 7000, y: 6000 },
      { x: 3000, y: 6000 }, { x: 3000, y: 3000 },
    ];
    const walls2 = [{ id: 'iw', points: houseLoop2, kind: 'full' }];
    const OUT2 = { x: 11000, y: 9500 };
    // three-view's injection point, replicated exactly.
    const eff = (userMm, floors, activeId) =>
      G.resolveGroundLevelMm(userMm) - G.floorElevationMm(floors, activeId);
    const applyEff = (userMm, floors, activeId) => {
      r.updateFloor(mkFloor([], { walls: walls2 }), { ...scene, groundLevelMm: eff(userMm, floors, activeId) });
      return { grid: r._grid.position.y, nbhd: r._neighborhoodGroup.position.y,
               gy: r._groundYAt(OUT2.x, OUT2.y) };
    };
    const g0 = applyEff(0, autoStack, 'a');
    ok('I9 ground floor (auto 0): grade at the slab — today\'s behavior byte-identical',
       g0.grid === 0 && g0.nbhd === 0 && g0.gy === 0, JSON.stringify(g0));
    const g1 = applyEff(0, autoStack, 'b');
    ok('I10 selecting story 1 puts the grade one story BELOW the slab (the fix)',
       g1.grid === -3000 && g1.nbhd === -3000 && g1.gy === -3000, JSON.stringify(g1));
    const g2 = applyEff(0, autoStack, 'c');
    ok('I11 story 2 → two stories below; the ground plane never moved in world terms',
       g2.grid === -6000 && g2.nbhd === -6000 && g2.gy === -6000, JSON.stringify(g2));
    ok('I12 grade steps by exactly one story per floor (fixed plane invariant)',
       (g0.grid - g1.grid) === 3000 && (g1.grid - g2.grid) === 3000);
    const gb = applyEff(0, mixed, 'base');
    ok('I13 a basement at −2800 puts the grade ABOVE its slab',
       gb.grid === 2800 && gb.gy === 2800, JSON.stringify(gb));
    const gu = applyEff(-600, autoStack, 'b');
    ok('I14 the user offset composes on top of the elevation (−600 − 3000)',
       gu.grid === -3600 && gu.gy === -3600, JSON.stringify(gu));
    const gbis = applyEff(0, [fl('walkout', 1300)], 'walkout');
    ok('I15 the ground plane may BISECT a floor (slab 1300 above grade)',
       gbis.grid === -1300, JSON.stringify(gbis));
    // Effective values legitimately exceed the ±10 000 user clamp.
    const tall = [fl('a'), fl('b'), fl('c'), fl('d'), fl('e')];
    const gt = applyEff(-8000, tall, 'e');
    ok('I16 effective level past the user clamp survives (5th story + −8000 offset)',
       eff(-8000, tall, 'e') === -20000 && gt.grid === -20000, `grid=${gt.grid}`);
    // Flights anchor rides the grade, not the slab.
    r.updateFlights([], null, 0, 15, true, { x: 0, z: 0 });
    ok('I17 flights shell anchors on the GROUND, not the active slab',
       Math.abs(r._flightsGroup.position.y - (-20000)) < 1e-6,
       `y=${r._flightsGroup.position.y}`);
    // Restore the default frame for anything downstream.
    r.updateFloor(mkFloor([], { walls: walls2 }), scene);
  }

  // ── J: WALLS follow the world ground plane — but only yard structure ──────
  // Fence-family kinds always ride the grade; solid kinds (full/half/railing)
  // ride it only when FREE-STANDING (no closed-loop membership) and outdoors.
  // The loop test must win over the outdoors test, or the whole house envelope
  // (whose midpoints sit ON the loop boundary, which pointInPolygon excludes)
  // would sink a storey. Doors/windows inherit their host segment's base.
  {
    const GL = -3000;                       // one storey — the reported case
    const near = (a, b, tol = 1e-6) => Math.abs(a - b) <= tol;
    const houseLoopJ = [
      { x: 3000, y: 3000 }, { x: 7000, y: 3000 }, { x: 7000, y: 6000 },
      { x: 3000, y: 6000 }, { x: 3000, y: 3000 },
    ];
    const houseWallJ = { id: 'hwJ', kind: 'full', points: houseLoopJ };
    const yardWallJ  = { id: 'ywJ', kind: 'full', points: [{ x: 9500, y: 8500 }, { x: 11500, y: 8500 }] };
    const fenceJ     = { id: 'fwJ', kind: 'fence_picket', points: [{ x: 500, y: 8500 }, { x: 4000, y: 8500 }] };
    const teeJ       = { id: 'twJ', kind: 'full', points: [{ x: 5000, y: 3000 }, { x: 5000, y: 6000 }] };
    const gateJ      = { id: 'gJ', x: 1600, y: 8500, w: 900, rotation: 0, kind: 'gate', entity_id: null };
    const houseDoorJ = { id: 'hdJ', x: 5600, y: 6000, w: 900, rotation: 0, kind: 'swing', entity_id: null };
    const wallsJ  = [houseWallJ, yardWallJ, fenceJ];
    const loopsJ  = G.closedWallLoops(wallsJ);
    const loopsT  = G.closedWallLoops([houseWallJ, teeJ, yardWallJ, fenceJ]);
    const seg = (ax, ay, bx, by) => [{ x: ax, y: ay }, { x: bx, y: by }];

    // Pure: wallSegmentInLoops.
    ok('J1 a house-loop segment is a loop member',
       G.wallSegmentInLoops(...seg(3000, 3000, 7000, 3000), loopsJ), `loops=${loopsJ.length}`);
    ok('J2 membership is direction-agnostic (b→a matches too)',
       G.wallSegmentInLoops(...seg(7000, 3000, 3000, 3000), loopsJ));
    ok('J3 a free-standing yard polyline is NOT a member',
       !G.wallSegmentInLoops(...seg(9500, 8500, 11500, 8500), loopsJ));
    ok('J4 a yard fence run is NOT a member',
       !G.wallSegmentInLoops(...seg(500, 8500, 4000, 8500), loopsJ));
    ok('J5 endpoints off by <25 mm still weld onto the loop edge',
       G.wallSegmentInLoops(...seg(3020, 3000, 6980, 3012), loopsJ));
    ok('J6 endpoints off by 200 mm do not',
       !G.wallSegmentInLoops(...seg(3000, 3200, 7000, 3200), loopsJ));
    ok('J7 no loops at all → never a member',
       !G.wallSegmentInLoops(...seg(3000, 3000, 7000, 3000), []));
    ok('J8 a wall SPLIT by an interior tee is still a member (coverage path)',
       G.wallSegmentInLoops(...seg(3000, 3000, 7000, 3000), loopsT), `loops=${loopsT.length}`);
    ok('J9 wallInLoops convenience: house wall yes, yard wall no',
       G.wallInLoops(houseWallJ, loopsJ) && !G.wallInLoops(yardWallJ, loopsJ));

    // Renderer: base heights.
    const realMeshes = (o) => {
      const a = []; o.traverse(m => { if (m.isMesh && !m.userData?.outline) a.push(m); }); return a;
    };
    const baseYOf = (o) => {
      let lo = Infinity;
      for (const m of realMeshes(o)) {
        m.geometry.computeBoundingBox();
        let y = m.position.y + m.geometry.boundingBox.min.y;
        let p = m.parent;
        while (p && p !== o) { y += p.position.y; p = p.parent; }
        if (y < lo) lo = y;
      }
      return lo;
    };
    const wallGroupAt = (wx, wy, tol = 900) => {
      const sx = FW / 2 - wx, sz = wy - FD / 2;
      for (const g of r._floorGroup.children) {
        if (g.type !== 'Group') continue;
        let hit = false;
        g.traverse(o => {
          if (o.isMesh && Math.hypot(o.position.x - sx, o.position.z - sz) < tol) hit = true;
        });
        if (hit) return g;
      }
      return null;
    };
    const hingeAt = (dx) => r._doorGroup.children.find(
      c => Math.abs(c.position.x - (FW / 2 - dx)) < 1);
    const applyJ = (gl, walls = wallsJ) => {
      r.updateFloor(mkFloor([], { walls }), gl === 0 ? scene : { ...scene, groundLevelMm: gl });
      r.updateDoorsWindows([gateJ, houseDoorJ], [], () => null);
    };

    applyJ(GL);
    ok('J10 a yard FENCE segment bases on the grade',
       near(baseYOf(wallGroupAt(500, 8500)), GL, 1), `y=${baseYOf(wallGroupAt(500, 8500))}`);
    ok('J11 a FREE-STANDING solid wall in the yard bases on the grade',
       near(baseYOf(wallGroupAt(9500, 8500)), GL, 1), `y=${baseYOf(wallGroupAt(9500, 8500))}`);
    ok('J12 a closed-loop HOUSE wall stays on the slab (loop test beats outdoors)',
       near(baseYOf(wallGroupAt(7000, 6000)), 0, 1), `y=${baseYOf(wallGroupAt(7000, 6000))}`);
    ok('J13 a gate on the yard fence hangs at the FENCE base, not the slab',
       near(hingeAt(1600)?.position.y, GL, 1), `y=${hingeAt(1600)?.position.y}`);
    ok('J14 a door in the house wall stays at the slab',
       near(hingeAt(5600)?.position.y, 0, 1), `y=${hingeAt(5600)?.position.y}`);

    // The tee-split regression: an interior partition splits the perimeter wall
    // into several loop edges — it must STILL read as house structure.
    applyJ(GL, [houseWallJ, teeJ, yardWallJ, fenceJ]);
    ok('J15 a perimeter wall split by an interior tee still stays on the slab',
       near(baseYOf(wallGroupAt(7000, 6000)), 0, 1), `y=${baseYOf(wallGroupAt(7000, 6000))}`);

    // Ground level 0 → every wall back on the slab, at the pre-change numbers.
    applyJ(0);
    const fenceGrp0 = wallGroupAt(500, 8500), yardGrp0 = wallGroupAt(9500, 8500);
    ok('J16 at ground 0 every wall bases at 0 (fence, yard wall, house wall)',
       near(baseYOf(fenceGrp0), 0, 1) && near(baseYOf(yardGrp0), 0, 1)
       && near(baseYOf(wallGroupAt(7000, 6000)), 0, 1),
       `fence=${baseYOf(fenceGrp0)} yard=${baseYOf(yardGrp0)}`);
    // Pre-change constants: picket posts span 0..1100 → centre 550; the top rail
    // spans 880..960 → centre 920; a solid wall extrusion sits at y = 0.
    const ys0 = new Set(realMeshes(fenceGrp0).map(m => Math.round(m.position.y)));
    ok('J17 at ground 0 the picket mesh heights are byte-identical (550 / 920)',
       ys0.has(550) && ys0.has(920), [...ys0].sort((a, b) => a - b).join(','));
    ok('J18 at ground 0 the free-standing solid wall extrusion still sits at y=0',
       realMeshes(yardGrp0).every(m => m.position.y === 0),
       realMeshes(yardGrp0).map(m => m.position.y).join(','));
    ok('J19 at ground 0 both openings hang at the slab',
       hingeAt(1600)?.position.y === 0 && hingeAt(5600)?.position.y === 0,
       `${hingeAt(1600)?.position.y},${hingeAt(5600)?.position.y}`);
    // Restore.
    r.updateFloor(mkFloor([]), scene);
    r.updateDoorsWindows([], [], () => null);
  }

  // ── K: free-standing content rides TERRACES, not just the flat grade ──────
  // Reported: "adding yard areas places items at the level of the selected
  // floor and not the level of the ground" + "raising/lowering grass or
  // concrete just increases the thickness". Both are the same gap: _itemGroundY
  // resolved only the grade, so a tree inside a −950 backyard floated a metre
  // over the lawn the AVATARS (via the terrace-aware _groundYAt) stood on, and
  // a pad drawn inside that lawn stopped its skirt at grade so it read as a
  // thicker slab instead of a pedestal. Modelled on the user's plan: grade
  // −800, a sunken grass backyard at −950 with a raised concrete patio inside
  // it, plus a shed pad out on plain grade.
  {
    const GL = -800;
    const near = (a, b, tol = 1e-6) => Math.abs(a - b) <= tol;
    const houseLoopK = [
      { x: 3000, y: 3000 }, { x: 7000, y: 3000 }, { x: 7000, y: 6000 },
      { x: 3000, y: 6000 }, { x: 3000, y: 3000 },
    ];
    const fenceK = { id: 'fK', kind: 'fence_picket',
                     points: [{ x: 7500, y: 7000 }, { x: 10500, y: 7000 }] };
    const wallsK = [{ id: 'hwK', kind: 'full', points: houseLoopK }, fenceK];
    const backyard = { id: 'by', kind: 'grass',    points: sq(9000, 8000, 2000), elevationMm: -950 };
    const patio    = { id: 'pt', kind: 'concrete', points: sq(10000, 8600, 500), elevationMm: 100 };
    const shed     = { id: 'sh', kind: 'concrete', points: sq(1600, 8600, 600),  elevationMm: 100 };
    const areasK = [backyard, patio, shed];
    const TREE_SUNK = { x: 8000, y: 7000 };    // in the backyard, clear of the patio
    const CHAIR     = { x: 10000, y: 8600 };   // on the patio
    const TREE_FLAT = { x: 1500, y: 2000 };    // plain grade, clear of every area
    const IN_HOUSE  = { x: 5000, y: 4500 };
    const fuK = (id, kind, p, w, h) => ({ id, kind, x: p.x, y: p.y, w, h, rotation: 0 });
    const floorK = (gl, areas, elevScale = 1) => {
      const as = areas.map(a => ({ ...a, elevationMm: (a.elevationMm ?? 0) * elevScale }));
      const f = mkFloor(as, {
        walls: wallsK,
        furniture: [fuK('tSunk', 'tree', TREE_SUNK, 900, 900),
                    fuK('tFlat', 'tree', TREE_FLAT, 900, 900),
                    fuK('lcK', 'lawn_chair', CHAIR, 700, 1200)],
      });
      r.updateFloor(f, gl === 0 ? scene : { ...scene, groundLevelMm: gl });
      r.updateGroundAreas(as, undefined, FW, FD, wallsK, false, gl);
      return as;
    };
    const grpAtK = (p) => r._floorGroup.children.find(
      c => c.type === 'Group' && Math.abs(c.position.x - (FW / 2 - p.x)) < 1);
    const skirtNear = (wx) => skirtsOf().find(s => {
      s.geometry.computeBoundingBox();
      const b = s.geometry.boundingBox;
      return Math.abs((b.min.x + b.max.x) / 2 - (FW / 2 - wx)) < 400;
    });
    const vertY = (mesh) => {
      const pos = mesh.geometry.getAttribute('position');
      let lo = Infinity, hi = -Infinity;
      for (let i = 0; i < pos.count; i++) {
        const y = pos.getY(i);
        if (y < lo) lo = y; if (y > hi) hi = y;
      }
      return { lo, hi };
    };

    floorK(GL, areasK);

    // K1: a tree inside the sunken lawn stands ON the lawn — and on exactly the
    // height the rigs already used (_groundYAt), which is the whole point.
    {
      const g = grpAtK(TREE_SUNK), gy = r._groundYAt(TREE_SUNK.x, TREE_SUNK.y);
      ok('K1 tree inside the sunken terrace grounds on the lawn (grade − 950)',
         !!g && near(g.position.y, GL - 950) && near(g.position.y, gy),
         `y=${g?.position.y} groundYAt=${gy}`);
      // K1b: its blob shadow is a child, so it rides down with the group.
      const blob = g?.children.find(c => c.isMesh && c.geometry.type === 'PlaneGeometry'
                                    && c.material.depthWrite === false);
      ok('K1b the tree blob shadow rides the terrace with it',
         !!blob && near(g.position.y + blob.position.y, GL - 950 + 8),
         `blobWorldY=${blob ? g.position.y + blob.position.y : 'none'}`);
    }

    // K2: a lawn chair on the raised patio sits on the pad, and its SitSpot
    // carries the same offset (an avatar sits ON the cushion, not through it).
    {
      const g = grpAtK(CHAIR), gy = r._groundYAt(CHAIR.x, CHAIR.y);
      const spot = r._sitSpots.find(s => s.furnitureId === 'lcK') ?? r._sitSpots[0];
      ok('K2 lawn chair on the raised pad grounds on the pad (grade + 100)',
         !!g && near(g.position.y, GL + 100) && near(g.position.y, gy),
         `y=${g?.position.y} groundYAt=${gy}`);
      ok('K2b its SitSpot seat height carries the same offset (380 + grade + 100)',
         !!spot && near(spot.seatY, 380 + GL + 100), `seatY=${spot?.seatY}`);
    }

    // K3: a tree on plain grade is untouched by the change (pre-change value).
    ok('K3 a tree on plain grade still bases on the grade only',
       near(grpAtK(TREE_FLAT)?.position.y, GL), `y=${grpAtK(TREE_FLAT)?.position.y}`);

    // K4: the agreement invariant — the visual rule and the rig/nav rule must
    // return the same number everywhere (terrace, grade, indoors).
    {
      const pts = [TREE_SUNK, CHAIR, TREE_FLAT, IN_HOUSE, { x: 1600, y: 8600 }];
      const bad = pts.filter(p => r._groundYAt(p.x, p.y) !== r._itemGroundY(p.x, p.y));
      ok('K4 _groundYAt === _itemGroundY on terrace / grade / indoor points',
         bad.length === 0 && r._itemGroundY(IN_HOUSE.x, IN_HOUSE.y) === 0,
         `mismatches=${bad.length} indoor=${r._itemGroundY(IN_HOUSE.x, IN_HOUSE.y)}`);
    }

    // K5: the sunken lawn READS sunken — the top patch moved down and the skirt
    // is a pit wall spanning [sunken top … surrounding grade], nothing above it.
    {
      const top = topsOf().find(t => t.userData.terraceTop === -950);
      const sk = skirtNear(9000);
      const v = sk ? vertY(sk) : null;
      ok('K5 sunken lawn top patch sits at grade − 950 + 4 (surface moved)',
         !!top && top.position.y === GL - 946, `y=${top?.position.y}`);
      ok('K5b its skirt spans the pit walls [top … surrounding grade], none above',
         !!sk && sk.userData.skirtBase === GL &&
         near(v.lo, GL - 946, 1) && v.hi <= GL + 4 + 1e-6 && (v.hi - v.lo) > 900,
         `base=${sk?.userData.skirtBase} span=[${v?.lo.toFixed(0)},${v?.hi.toFixed(0)}]`);
    }

    // K6: the pad drawn INSIDE the sunken lawn is a pedestal down to the lawn
    // (this is what used to render as a 100 mm-thick slab floating over it);
    // the shed pad out on plain grade keeps its pre-change skirt to the grade.
    {
      const pk = skirtNear(10000), sh = skirtNear(1600);
      const vp = pk ? vertY(pk) : null;
      ok('K6 pad inside the sunken lawn skirts DOWN to the lawn, not to grade',
         !!pk && pk.userData.skirtBase === GL - 950 &&
         near(vp.lo, GL - 946, 1) && near(vp.hi, GL + 104, 1),
         `base=${pk?.userData.skirtBase} span=[${vp?.lo.toFixed(0)},${vp?.hi.toFixed(0)}]`);
      ok('K6b the pad on plain grade is unchanged: top grade+104, skirt to grade',
         !!sh && sh.userData.skirtBase === GL &&
         topsOf().filter(t => t.userData.terraceTop === 100)
                 .every(t => t.position.y === GL + 104),
         `base=${sh?.userData.skirtBase}`);
    }

    // K7: a fence crossing the terrace bases on the terrace top (inherited from
    // _itemGroundY — no second rule), while the house wall stays on the slab.
    {
      const realMeshesK = (o) => {
        const a = []; o.traverse(m => { if (m.isMesh && !m.userData?.outline) a.push(m); }); return a;
      };
      const baseYOfK = (o) => {
        let lo = Infinity;
        for (const m of realMeshesK(o)) {
          m.geometry.computeBoundingBox();
          let y = m.position.y + m.geometry.boundingBox.min.y;
          let p = m.parent;
          while (p && p !== o) { y += p.position.y; p = p.parent; }
          if (y < lo) lo = y;
        }
        return lo;
      };
      const wallGroupAtK = (wx, wy, tol = 900) => {
        const sx = FW / 2 - wx, sz = wy - FD / 2;
        for (const g of r._floorGroup.children) {
          if (g.type !== 'Group') continue;
          let hit = false;
          g.traverse(o => { if (o.isMesh && Math.hypot(o.position.x - sx, o.position.z - sz) < tol) hit = true; });
          if (hit) return g;
        }
        return null;
      };
      ok('K7 a fence crossing the sunken terrace bases on the terrace top',
         near(baseYOfK(wallGroupAtK(7500, 7000)), GL - 950, 1),
         `y=${baseYOfK(wallGroupAtK(7500, 7000))}`);
      ok('K7b the house wall still stays on the slab',
         near(baseYOfK(wallGroupAtK(7000, 6000)), 0, 1),
         `y=${baseYOfK(wallGroupAtK(7000, 6000))}`);
    }

    // K8: zero grade + zero elevations → everything back on the slab with no
    // skirts at all (the byte-identical default path: no grade, no terraces).
    {
      floorK(0, areasK, 0);
      const ys = [TREE_SUNK, CHAIR, TREE_FLAT].map(p => grpAtK(p)?.position.y);
      ok('K8 zero grade + zero elevation: every base is 0 and no skirt is built',
         ys.every(y => y === 0) && skirtsOf().length === 0 &&
         r._itemGroundY(TREE_SUNK.x, TREE_SUNK.y) === 0,
         `ys=[${ys.join(',')}] skirts=${skirtsOf().length}`);
      // …and terraces alone (no grade) still lift content, since a terrace is
      // authored height, not grade: this is the ONLY zero-grade change.
      floorK(0, areasK);
      ok('K8b at zero grade a terrace still grounds its content on the tier',
         near(grpAtK(TREE_SUNK)?.position.y, -950) && near(grpAtK(CHAIR)?.position.y, 100) &&
         grpAtK(TREE_FLAT)?.position.y === 0,
         `sunk=${grpAtK(TREE_SUNK)?.position.y} pad=${grpAtK(CHAIR)?.position.y} flat=${grpAtK(TREE_FLAT)?.position.y}`);
    }
    // Restore a clean frame for the tally.
    r.updateFloor(mkFloor([]), scene);
    r.updateGroundAreas([]);
  }

  // ── L: PER-ROOM FLOORING — each wall loop takes its room's floor look ─────
  // A Room may override floorColor / floorTex for its OWN loop (room →
  // Floor.look3d → Store.scene3d → defaults). Materials are cached per
  // colour|tex within one updateFloor, so rooms sharing a look share one
  // material and a plan with no overrides builds exactly as before. The
  // occupancy wash still REPLACES the material while the room is occupied.
  {
    const loopL = (x0, y0, x1, y1, id) => ({ id, kind: 'full',
      points: [{x:x0,y:y0},{x:x1,y:y0},{x:x1,y:y1},{x:x0,y:y1},{x:x0,y:y0}] });
    const wallsL = [loopL(1000, 1000, 5000, 6000, 'lw1'), loopL(6000, 1000, 11000, 6000, 'lw2')];
    const roomsL = () => ([
      { id: 'rA', name: 'A', anchor: { x: 3000, y: 3500 } },
      { id: 'rB', name: 'B', anchor: { x: 8500, y: 3500 } },
    ]);
    // Slabs are the ShapeGeometry meshes in _floorGroup (walls are extrusions).
    const slabs = () => r._floorGroup.children.filter(
      c => c.isMesh && c.geometry && c.geometry.type === 'ShapeGeometry');
    // Map a slab back to world coords via its geometry bbox centre:
    // scene sx = FW/2 − wx, sy = FD/2 − wy.
    const slabAt = (wx, wy) => slabs().find(m => {
      m.geometry.computeBoundingBox();
      const b = m.geometry.boundingBox;
      const cx = FW / 2 - (b.min.x + b.max.x) / 2, cy = FD / 2 - (b.min.y + b.max.y) / 2;
      return Math.abs(cx - wx) < 900 && Math.abs(cy - wy) < 900;
    });
    const hexOf = m => m ? '#' + m.material.color.getHexString() : null;
    const buildL = (rooms, stateOf) =>
      r.updateFloor(mkFloor([], { walls: wallsL, rooms }), scene, undefined, undefined, stateOf);

    buildL(roomsL());
    ok('L1 two wall loops build two floor slabs', slabs().length === 2, `${slabs().length}`);
    const A0 = slabAt(3000, 3500), B0 = slabAt(8500, 3500);
    ok('L2 both slabs found', !!A0 && !!B0, `${!!A0}/${!!B0}`);
    // _simsColor pushes saturation, so compare against REFERENCE hexes captured
    // by driving the SAME colour through the floor-wide path.
    const BASE = hexOf(A0);
    r.updateFloor(mkFloor([], { walls: wallsL, rooms: roomsL() }),
                  { ...scene, floorColor: '#c0392b' });
    const RED = hexOf(slabAt(3000, 3500));
    r.updateFloor(mkFloor([], { walls: wallsL, rooms: roomsL() }),
                  { ...scene, floorColor: '#2f6f4f' });
    const GREEN = hexOf(slabAt(3000, 3500));
    buildL(roomsL());
    ok('L3 no overrides → both slabs read the floor-wide colour',
       hexOf(A0) === BASE && hexOf(slabAt(8500, 3500)) === BASE && BASE !== RED,
       `${BASE} / ${RED}`);
    ok('L4 no overrides → ONE shared material (cache seeded with the base mat)',
       A0.material === B0.material, `${A0.material === B0.material}`);

    // Per-room colour override — only that loop changes.
    {
      const rooms = roomsL(); rooms[0].floorColor = '#c0392b';
      buildL(rooms);
      const A = slabAt(3000, 3500), B = slabAt(8500, 3500);
      ok('L5 a room floorColor override colours ITS slab', hexOf(A) === RED, hexOf(A));
      ok('L6 the other room keeps the floor-wide colour', hexOf(B) === BASE, hexOf(B));
      ok('L7 the two slabs no longer share a material', A.material !== B.material, 'distinct');
    }
    // Two rooms with the SAME look share one cached material.
    {
      const rooms = roomsL(); rooms[0].floorColor = '#2f6f4f'; rooms[1].floorColor = '#2f6f4f';
      buildL(rooms);
      const A = slabAt(3000, 3500), B = slabAt(8500, 3500);
      ok('L8 rooms sharing a look share ONE material',
         A.material === B.material && hexOf(A) === GREEN, hexOf(A));
    }
    // Per-room texture.
    {
      const rooms = roomsL(); rooms[1].floorTex = 'wood';
      buildL(rooms);
      const A = slabAt(3000, 3500), B = slabAt(8500, 3500);
      ok('L9 a room floorTex override gives that slab a map',
         !!B.material.map && !A.material.map, `${!!B.material.map}/${!!A.material.map}`);
      ok('L10 the per-room texture uses the loop-path 1/800 repeat',
         Math.abs(B.material.map.repeat.x - 1 / 800) < 1e-9
           && Math.abs(B.material.map.repeat.y - 1 / 800) < 1e-9,
         `${B.material.map.repeat.x},${B.material.map.repeat.y}`);
    }
    // null == inherit (the sidebar's clear writes undefined, imports may hold null).
    {
      const rooms = roomsL(); rooms[0].floorColor = null; rooms[0].floorTex = null;
      buildL(rooms);
      const A = slabAt(3000, 3500), B = slabAt(8500, 3500);
      ok('L11 null overrides read as inherit',
         hexOf(A) === BASE && A.material === B.material, hexOf(A));
    }
    // A loop with NO room keeps the floor-wide look.
    {
      buildL([{ id: 'rA', name: 'A', anchor: { x: 3000, y: 3500 }, floorColor: '#c0392b' }]);
      ok('L12 a room-less loop keeps the floor-wide material',
         hexOf(slabAt(8500, 3500)) === BASE, hexOf(slabAt(8500, 3500)));
    }
    // Occupancy WINS over the room look while the room is occupied.
    {
      const rooms = roomsL();
      rooms[0].floorColor = '#c0392b';
      rooms[0].occupancyEntity = 'binary_sensor.occ';
      buildL(rooms, id => (id === 'binary_sensor.occ' ? { state: 'on', attributes: {} } : null));
      const A = slabAt(3000, 3500);
      ok('L13 an occupied room takes the occupancy wash, not the room colour',
         A.material.emissive && A.material.emissive.getHex() !== 0 && hexOf(A) === BASE,
         `${hexOf(A)} emissive=${A.material.emissive?.getHexString()}`);
      buildL(rooms, () => ({ state: 'off', attributes: {} }));
      ok('L14 …and the room colour returns when it clears',
         hexOf(slabAt(3000, 3500)) === RED, hexOf(slabAt(3000, 3500)));
    }
    r.updateFloor(mkFloor([]), scene);
  }

  let pass = 0; const fails = [];
  for (const t of tests) { if (t.ok) pass++; else fails.push(t.name); }
  const total = tests.length, allPass = pass === total;
  const title = allPass ? `TERRAIN PASS ${pass}/${total}` : `TERRAIN FAIL ${pass}/${total} [${fails.join(',')}]`;
  document.title = title;
  window.__RESULT__ = { title };
  document.body.insertAdjacentHTML('beforeend',
    `<pre style="position:fixed;left:8px;top:8px;color:#8f8">${title}\n` +
    tests.map(t => `${t.ok ? 'PASS' : 'FAIL'} ${t.name} — ${t.detail ?? ''}`).join('\n') + `</pre>`);
</script>
