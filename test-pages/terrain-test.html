<!doctype html>
<meta charset="utf-8">
<title>terrain test</title>
<style>html,body{margin:0;background:#111;color:#ccc;font:12px sans-serif}#c{width:1280px;height:880px}</style>
<div id="c"></div>
<!--
  Batch T1 — Terrain foundation.

  Pure matrix (geometry.mod.js): groundAreaSkirtBase over nested tiers, hidden
  areas skipped, sunken negative, highest-wins, non-containing sibling ignored;
  polygonCentroid interior point.

  Renderer harness (built three-renderer.js):
   - terrace TOP patch at y = elevationMm + 4;
   - skirt mesh exists only when elevation ≠ 0;
   - angled (grass) skirt out-flares vs vertical (rock) for the same poly/elev;
   - a nested tier's skirt stops at the lower tier's elevation (skirtBase);
   - _groundYAt returns the terrace height inside the poly / grade (0) outside;
   - yard-fill underlay patch exists only when Floor.yardFill is set and is
     punched with wall-loop holes (no triangle centroid inside the loop);
   - the `ground` layer flag flips the whole group;
   - a rebuild with a changed elevation re-lands the top patch (dirty-key proxy);
   - a robot rig re-grounds on a terrace top via _groundYAt (mower hookup).

  Ground level (Scene3D.groundLevelMm — the SURROUNDINGS move, the house does
  not): defaults are byte-compatible (grid/neighborhood y=0, yard fill y=2);
  a lowered level drops the backdrop grid, the neighborhood overlay GROUP and
  the yard-fill underlay, leaves authored ground areas / terraces where they
  are, runs the fill continuously UNDER the raised house pad (the wall-loop
  holes are punched only at level ≥ 0 — below it they'd expose the backdrop
  grid), makes _groundYAt return the level OUTSIDE every wall loop but 0 inside
  (and terrace tops keep their authored height), re-applies on a neighborhood-
  only rebuild, falls back to the floor's level when updateGroundAreas is
  called without the arg, clamps at ±10 000 mm, and restores exactly at 0.

  Build the geometry bundle next to this file:
    npx esbuild src/geometry.ts --bundle --format=esm --outfile=<harness>/geometry.mod.js
  and serve the built renderer chunk (dist/assets/three-renderer.js) alongside.
-->
<script type="module">
  const G = await import('./geometry.mod.js');
  const mod = await import('./assets/three-renderer.js');
  const r = new mod.ThreeDRenderer(document.getElementById('c'));
  await r.load();

  const tests = [];
  const ok = (name, cond, detail) => tests.push({ name, ok: !!cond, detail });

  // ── Pure: groundAreaSkirtBase / polygonCentroid ─────────────────────────
  const sq = (cx, cy, half) => [
    { x: cx - half, y: cy - half }, { x: cx + half, y: cy - half },
    { x: cx + half, y: cy + half }, { x: cx - half, y: cy + half },
  ];
  // 3 concentric tiers about (5000,5000): outer@0, mid@600, inner@1200.
  const outer = { id: 'o', kind: 'grass', points: sq(5000, 5000, 3000), elevationMm: 0 };
  const mid   = { id: 'm', kind: 'grass', points: sq(5000, 5000, 2000), elevationMm: 600 };
  const inner = { id: 'i', kind: 'grass', points: sq(5000, 5000, 1000), elevationMm: 1200 };
  const tiers = [outer, mid, inner];
  ok('P1 nested inner@1200 skirtBase = mid 600', G.groundAreaSkirtBase(inner, tiers) === 600,
     `base=${G.groundAreaSkirtBase(inner, tiers)}`);
  ok('P2 nested mid@600 skirtBase = grade 0', G.groundAreaSkirtBase(mid, tiers) === 0,
     `base=${G.groundAreaSkirtBase(mid, tiers)}`);
  // Hidden mid tier is skipped → inner drops to the still-visible outer (0).
  const midHidden = { ...mid, hidden: true };
  ok('P3 hidden lower tier skipped', G.groundAreaSkirtBase(inner, [outer, midHidden, inner]) === 0,
     `base=${G.groundAreaSkirtBase(inner, [outer, midHidden, inner])}`);
  // Single sunken area → base 0 (skirt rises to grade).
  const sunk = { id: 's', kind: 'water', points: sq(5000, 5000, 1500), elevationMm: -500 };
  ok('P4 sunken negative single → base 0', G.groundAreaSkirtBase(sunk, [sunk]) === 0,
     `base=${G.groundAreaSkirtBase(sunk, [sunk])}`);
  // Highest-wins: inner@1500 over two containing lowers 600 & 900 → 900.
  const low600 = { id: 'l6', kind: 'grass', points: sq(5000, 5000, 2500), elevationMm: 600 };
  const low900 = { id: 'l9', kind: 'grass', points: sq(5000, 5000, 2000), elevationMm: 900 };
  const in1500 = { id: 'h', kind: 'grass', points: sq(5000, 5000, 1000), elevationMm: 1500 };
  ok('P5 highest containing lower wins (900)',
     G.groundAreaSkirtBase(in1500, [low600, low900, in1500]) === 900,
     `base=${G.groundAreaSkirtBase(in1500, [low600, low900, in1500])}`);
  // Non-containing lower sibling is ignored.
  const far600 = { id: 'f6', kind: 'grass', points: sq(500, 500, 400), elevationMm: 600 };
  ok('P6 non-containing lower ignored → 0',
     G.groundAreaSkirtBase(in1500, [far600, in1500]) === 0,
     `base=${G.groundAreaSkirtBase(in1500, [far600, in1500])}`);
  // polygonCentroid of a square is its center; inside the polygon.
  const ctr = G.polygonCentroid(sq(5000, 5000, 1000));
  ok('P7 polygonCentroid is the interior center',
     Math.abs(ctr.x - 5000) < 1 && Math.abs(ctr.y - 5000) < 1 && G.pointInPolygon(ctr.x, ctr.y, sq(5000, 5000, 1000)),
     `ctr=(${ctr.x.toFixed(0)},${ctr.y.toFixed(0)})`);

  // ── Renderer harness ────────────────────────────────────────────────────
  const FW = 12000, FD = 10000;
  const scene = { preset: 'day', floorColor: '#8a7860', floorTex: 'none', wallColor: '#cfd2d6' };
  const mkFloor = (groundAreas = [], extra = {}) => ({
    id: 'f1', name: 'T', w: FW, d: FD, walls: [], furniture: [],
    lights: [], switches: [], sensors: [], motionSensors: [], envSensors: [],
    doors: [], windows: [], bg: null, model3d: null, look3d: null, rooms: [],
    groundAreas, ...extra,
  });
  const skirtsOf = () => r._groundGroup.children.filter(c => c.userData && c.userData.terraceSkirt);
  const topsOf = () => r._groundGroup.children.filter(c => c.userData && c.userData.terraceTop !== undefined);
  const yardOf = () => r._groundGroup.children.filter(c => c.userData && c.userData.yardFill);
  const bboxSize = (mesh) => {
    mesh.geometry.computeBoundingBox();
    const b = mesh.geometry.boundingBox;
    return { x: b.max.x - b.min.x, y: b.max.y - b.min.y, z: b.max.z - b.min.z };
  };

  // R1: a raised grass terrace tops out at elev + 4.
  const raised = { id: 'gt', kind: 'grass', points: sq(4000, 4000, 1000), elevationMm: 600 };
  r.updateFloor(mkFloor([raised]), scene);
  r.updateGroundAreas([raised]);
  {
    const top = topsOf()[0];
    ok('R1 terrace top y = elevationMm + 4',
       !!top && top.position.y === 604 && top.userData.terraceTop === 600,
       `y=${top?.position.y} terraceTop=${top?.userData.terraceTop}`);
    ok('R2b raised terrace HAS a skirt', skirtsOf().length === 1, `skirts=${skirtsOf().length}`);
  }

  // R2: a flat (elev 0) area has NO skirt.
  const flat = { id: 'gf', kind: 'grass', points: sq(4000, 4000, 1000), elevationMm: 0 };
  r.updateGroundAreas([flat]);
  ok('R2 flat area (elev 0) has NO skirt', skirtsOf().length === 0, `skirts=${skirtsOf().length}`);

  // R3: angled (grass) skirt out-flares vs vertical (rock) for same poly/elev.
  const grassT = { id: 'ga', kind: 'grass', points: sq(4000, 4000, 1000), elevationMm: 600 };
  r.updateGroundAreas([grassT]);
  const grassSkirtSize = bboxSize(skirtsOf()[0]);
  const grassAngled = skirtsOf()[0].userData.skirtAngled;
  const rockT = { id: 'ra', kind: 'rock', points: sq(4000, 4000, 1000), elevationMm: 600 };
  r.updateGroundAreas([rockT]);
  const rockSkirtSize = bboxSize(skirtsOf()[0]);
  const rockAngled = skirtsOf()[0].userData.skirtAngled;
  ok('R3 angled grass skirt flares wider than vertical rock skirt',
     grassAngled === true && rockAngled === false &&
     grassSkirtSize.x > rockSkirtSize.x + 100 && grassSkirtSize.z > rockSkirtSize.z + 100,
     `grass=${grassSkirtSize.x.toFixed(0)}x${grassSkirtSize.z.toFixed(0)} rock=${rockSkirtSize.x.toFixed(0)}x${rockSkirtSize.z.toFixed(0)}`);

  // R4: nested tiers' skirts each stop at the lower tier's elevation (a DEEP
  // 3-tier nest: outer@300, mid@600, inner@1200 → skirt bases 0 / 300 / 600).
  {
    const dOuter = { id: 'do', kind: 'grass', points: sq(6000, 5000, 2500), elevationMm: 300 };
    const dMid   = { id: 'dm', kind: 'grass', points: sq(6000, 5000, 1600), elevationMm: 600 };
    const dInner = { id: 'di', kind: 'grass', points: sq(6000, 5000, 800),  elevationMm: 1200 };
    r.updateGroundAreas([dOuter, dMid, dInner]);
    const bases = skirtsOf().map(s => s.userData.skirtBase).sort((a, b) => a - b);
    // three skirts; the innermost (1200) sits on 600, the mid (600) on 300, the
    // outer (300) on grade 0.
    ok('R4 nested skirts stop at the lower tier elevation',
       bases.length === 3 && bases[0] === 0 && bases[1] === 300 && bases[2] === 600,
       `bases=[${bases.join(',')}]`);
  }

  // R5: _groundYAt returns terrace height inside the poly / grade outside.
  r.updateFloor(mkFloor([raised]), scene);   // raised: sq(4000,4000,1000)@600
  const yIn = r._groundYAt(4000, 4000);
  const yOut = r._groundYAt(8000, 8000);
  ok('R5 _groundYAt = elevation inside / 0 outside', yIn === 600 && yOut === 0,
     `in=${yIn} out=${yOut}`);

  // R5b: a sunken terrace reads its (negative) top y and a skirt to grade 0.
  const sunkT = { id: 'st', kind: 'water', points: sq(4000, 4000, 1000), elevationMm: -500 };
  r.updateFloor(mkFloor([sunkT]), scene);
  r.updateGroundAreas([sunkT]);
  {
    const top = topsOf()[0], skirt = skirtsOf()[0];
    ok('R5b sunken top y = -496, skirt base 0, _groundYAt = -500',
       !!top && top.position.y === -496 && !!skirt && skirt.userData.skirtBase === 0 &&
       r._groundYAt(4000, 4000) === -500,
       `topY=${top?.position.y} base=${skirt?.userData.skirtBase} gy=${r._groundYAt(4000, 4000)}`);
  }

  // R6/R7: yard-fill underlay — exists only when set, punched by wall loops.
  // A closed rectangular wall loop (house) inside the yard.
  const loopPts = [
    { x: 3000, y: 3000 }, { x: 7000, y: 3000 }, { x: 7000, y: 6000 },
    { x: 3000, y: 6000 }, { x: 3000, y: 3000 },
  ];
  const walls = [{ id: 'w', points: loopPts, kind: 'full' }];
  // no yardFill → no yard-fill mesh.
  r.updateGroundAreas([], undefined, FW, FD, walls);
  ok('R6 no yard-fill mesh when Floor.yardFill unset', yardOf().length === 0, `yard=${yardOf().length}`);
  // yardFill grass → exactly one yard-fill mesh at y=2.
  r.updateGroundAreas([], 'grass', FW, FD, walls);
  {
    const yf = yardOf()[0];
    ok('R6b yard-fill mesh exists (y=2) when set', yardOf().length === 1 && !!yf && yf.position.y === 2,
       `yard=${yardOf().length} y=${yf?.position.y}`);
    // Hole check: no yard-fill triangle centroid inside the wall loop.
    const loop = loopPts.slice(0, 4);
    const geo = yf.geometry;
    const pos = geo.getAttribute('position');
    const idx = geo.getIndex();
    const readW = (vi) => ({ x: FW / 2 - pos.getX(vi), y: FD / 2 - pos.getY(vi) });
    const triN = idx ? idx.count / 3 : pos.count / 3;
    let inLoop = 0;
    for (let t = 0; t < triN; t++) {
      const a = idx ? idx.getX(t * 3) : t * 3, b = idx ? idx.getX(t * 3 + 1) : t * 3 + 1, c = idx ? idx.getX(t * 3 + 2) : t * 3 + 2;
      const wa = readW(a), wb = readW(b), wc = readW(c);
      const cx = (wa.x + wb.x + wc.x) / 3, cy = (wa.y + wb.y + wc.y) / 3;
      if (G.pointInPolygon(cx, cy, loop)) inLoop++;
    }
    ok('R7 yard-fill is punched with the wall-loop hole', inLoop === 0, `inLoop=${inLoop}/${triN}`);
  }

  // R8: `ground` layer flag flips the whole group's visibility.
  r.setLayerVisibility({ ground: false });
  const hidden = r._groundGroup.visible === false;
  r.setLayerVisibility({ ground: true });
  const shown = r._groundGroup.visible === true;
  ok('R8 ground layer flag hides / shows the group', hidden && shown, `hidden=${hidden} shown=${shown}`);

  // R9: rebuild after an elevation change re-lands the top patch (dirty-key
  // proxy — three-view folds elevationMm into _keyGround; here we prove the
  // rebuild output tracks the field).
  const a900 = { id: 'gt', kind: 'grass', points: sq(4000, 4000, 1000), elevationMm: 900 };
  r.updateGroundAreas([a900]);
  ok('R9 rebuild tracks elevation change (top y 904)', topsOf()[0].position.y === 904,
     `y=${topsOf()[0].position.y}`);

  // R10: a robot rig re-grounds on a terrace top via _groundYAt (mower hookup).
  r.updateFloor(mkFloor([raised]), scene);   // raised sq(4000,4000,1000)@600
  const robot = { id: 'rb1', kind: 'mower', x: 4000, y: 4000, w: 600, h: 400, rotation: 0 };
  const rstate = { rb1: { x: 4000, y: 4000, heading: 0, phase: 0, activity: 'docked', led: '#43a047' } };
  r.updateRobotRigs([robot], rstate);
  {
    const rig = r._robotRigs['rb1'];
    // docked → bob 0 → group.y === terrain height (600).
    ok('R10 robot rig re-grounds on the terrace (y=600)',
       !!rig && Math.abs(rig.group.position.y - 600) < 1e-6,
       `y=${rig?.group.position.y}`);
    // off-terrace → grade 0.
    r.updateRobotRigs([robot], { rb1: { ...rstate.rb1, x: 9000, y: 9000 } });
    const rig2 = r._robotRigs['rb1'];
    ok('R10b robot rig at grade off-terrace (y=0)', Math.abs(rig2.group.position.y - 0) < 1e-6,
       `y=${rig2.group.position.y}`);
  }

  // ── G: ground level (Scene3D.groundLevelMm) — surroundings move, house doesn't
  {
    // A closed house loop so _outdoors can tell inside from outside, plus one
    // authored terrace OUTSIDE it (must keep its own elevation).
    const houseLoop = [
      { x: 3000, y: 3000 }, { x: 7000, y: 3000 }, { x: 7000, y: 6000 },
      { x: 3000, y: 6000 }, { x: 3000, y: 3000 },
    ];
    const houseWalls = [{ id: 'gw', points: houseLoop, kind: 'full' }];
    const terr = { id: 'gterr', kind: 'grass', points: sq(9500, 8000, 700), elevationMm: 500 };
    const mkG = (sc3) => {
      r.updateFloor(mkFloor([terr], { walls: houseWalls }), sc3);
      r.updateGroundAreas([terr], 'grass', FW, FD, houseWalls, false, sc3.groundLevelMm);
    };
    // Minimal neighborhood payload (one building + one road + one water patch).
    const nb = {
      buildings: [{ points: sq(11000, 2000, 600), heightMm: 6000, baseMm: 0 }],
      roads: [{ points: [{ x: 0, y: 1500 }, { x: FW, y: 1500 }], widthMm: 3000, cls: 'residential', bridge: false }],
      water: [{ points: sq(1000, 9000, 500), cls: 'water' }],
      landuse: [], fetchedAt: 0, tileCount: 1, tileAddrs: [],
    };

    // G0: defaults are exactly today's numbers.
    mkG(scene);
    r.updateNeighborhood(nb, { opacity: 1 });
    ok('G0 default: grid + neighborhood at y=0, yard fill at y=2',
       r._grid.position.y === 0 && r._neighborhoodGroup.position.y === 0 && yardOf()[0].position.y === 2,
       `grid=${r._grid.position.y} nbhd=${r._neighborhoodGroup.position.y} yard=${yardOf()[0]?.position.y}`);
    ok('G0b default: _groundYAt outdoors = 0', r._groundYAt(11000, 9500) === 0,
       `gy=${r._groundYAt(11000, 9500)}`);
    const nbKids = r._neighborhoodGroup.children.length;
    ok('G0c neighborhood payload actually built', nbKids >= 3, `children=${nbKids}`);

    // G1..G7: lowered surroundings (raised-foundation case).
    const LOW = -600;
    const sceneLow = { ...scene, groundLevelMm: LOW };
    mkG(sceneLow);
    r.updateNeighborhood(nb, { opacity: 1 });
    ok('G1 backdrop grid drops to the ground level', r._grid.position.y === LOW, `y=${r._grid.position.y}`);
    ok('G2 neighborhood group drops to the ground level', r._neighborhoodGroup.position.y === LOW,
       `y=${r._neighborhoodGroup.position.y}`);
    ok('G3 yard-fill underlay at 2 + level', yardOf()[0].position.y === 2 + LOW,
       `y=${yardOf()[0]?.position.y}`);
    // An area whose CENTROID is outdoors is paint ON the yard, so its authored
    // elevationMm stacks on the grade (level + elev + 4). (Superseded the
    // original "authored areas never move" rule — a grass patch painted on a
    // lowered yard used to float above the yard fill.)
    ok('G4 outdoor ground area stacks on the grade (level + elev + 4)',
       topsOf()[0].position.y === LOW + 504, `y=${topsOf()[0]?.position.y}`);
    ok('G5 _groundYAt outdoors = ground level', r._groundYAt(11000, 9500) === LOW,
       `gy=${r._groundYAt(11000, 9500)}`);
    ok('G6 _groundYAt inside the wall loop stays on the slab (0)', r._groundYAt(5000, 4500) === 0,
       `gy=${r._groundYAt(5000, 4500)}`);
    // …and _groundYAt agrees with the patch it just built (the tier's walkable
    // top is level + elevation, 4 mm under the visual top).
    ok('G7 _groundYAt on an outdoor terrace = level + authored height',
       r._groundYAt(9500, 8000) === LOW + 500, `gy=${r._groundYAt(9500, 8000)}`);
    // Building prisms keep their local podium base — only the group moved.
    {
      const prism = r._neighborhoodGroup.children.find(c => c.geometry && c.geometry.type === 'ExtrudeGeometry');
      ok('G8 neighborhood building keeps local base 0 (whole-group offset)',
         !!prism && prism.position.y === 0, `y=${prism?.position.y}`);
    }
    // G9: a neighborhood-ONLY rebuild re-applies the offset (key-order safety).
    r.updateNeighborhood(null, null);
    r.updateNeighborhood(nb, { opacity: 1 });
    ok('G9 neighborhood-only rebuild re-applies the offset', r._neighborhoodGroup.position.y === LOW,
       `y=${r._neighborhoodGroup.position.y}`);

    // G9b: with a LOWERED grade the yard fill runs continuously under the raised
    // house pad (no wall-loop holes to see the backdrop grid through). At level
    // 0 the holes are still punched — that's R7 above.
    {
      const yf = yardOf()[0];
      const geo = yf.geometry, pos = geo.getAttribute('position'), idx = geo.getIndex();
      const readW = (vi) => ({ x: FW / 2 - pos.getX(vi), y: FD / 2 - pos.getY(vi) });
      const triN = idx ? idx.count / 3 : pos.count / 3;
      let inLoop = 0;
      for (let t = 0; t < triN; t++) {
        const a = idx ? idx.getX(t * 3) : t * 3, b = idx ? idx.getX(t * 3 + 1) : t * 3 + 1, c = idx ? idx.getX(t * 3 + 2) : t * 3 + 2;
        const wa = readW(a), wb = readW(b), wc = readW(c);
        const cx = (wa.x + wb.x + wc.x) / 3, cy = (wa.y + wb.y + wc.y) / 3;
        if (G.pointInPolygon(cx, cy, houseLoop.slice(0, 4))) inLoop++;
      }
      ok('G9b lowered grade fills UNDER the house pad (no wall-loop hole)', inLoop > 0,
         `inLoop=${inLoop}/${triN}`);
    }

    // G10: updateGroundAreas without the arg falls back to the floor's level.
    r.updateGroundAreas([terr], 'grass', FW, FD, houseWalls);
    ok('G10 yard fill falls back to the floor level without the arg',
       yardOf()[0].position.y === 2 + LOW, `y=${yardOf()[0]?.position.y}`);

    // G11: a rig standing outdoors settles onto the lowered ground.
    {
      const robot = { id: 'grb', kind: 'mower', x: 11000, y: 9500, w: 600, h: 400, rotation: 0 };
      r.updateRobotRigs([robot], { grb: { x: 11000, y: 9500, heading: 0, phase: 0, activity: 'docked', led: '#43a047' } });
      const rig = r._robotRigs['grb'];
      ok('G11 outdoor robot rig settles on the lowered ground',
         !!rig && Math.abs(rig.group.position.y - LOW) < 1e-6, `y=${rig?.group.position.y}`);
    }

    // G12: clamp — an absurd value never flings the grid past the far plane.
    mkG({ ...scene, groundLevelMm: -99999 });
    ok('G12 ground level clamps at −10000', r._grid.position.y === -10000, `y=${r._grid.position.y}`);

    // G13: back to 0 restores exactly (default path unchanged).
    mkG(scene);
    r.updateNeighborhood(nb, { opacity: 1 });
    ok('G13 level 0 restores grid/neighborhood/yard/_groundYAt exactly',
       r._grid.position.y === 0 && r._neighborhoodGroup.position.y === 0 &&
       yardOf()[0].position.y === 2 && r._groundYAt(11000, 9500) === 0,
       `grid=${r._grid.position.y} nbhd=${r._neighborhoodGroup.position.y} yard=${yardOf()[0]?.position.y} gy=${r._groundYAt(11000, 9500)}`);
    r.updateNeighborhood(null, null);   // leave the frustum as we found it
  }

  // ── H: FREE-STANDING content follows the ground level ────────────────────
  // One rule (_itemGroundY): anything planted on the ground whose plan anchor
  // is OUTSIDE every closed wall loop builds on the surroundings grade; things
  // mounted on the HOUSE (wall plates, wall/ceiling light kinds) and everything
  // indoors stay slab-relative. Every H case runs at level −600 AND at 0, and
  // the 0 run must reproduce the pre-ground-level numbers exactly.
  {
    const LOW = -600;
    const houseLoop = [
      { x: 3000, y: 3000 }, { x: 7000, y: 3000 }, { x: 7000, y: 6000 },
      { x: 3000, y: 6000 }, { x: 3000, y: 3000 },
    ];
    const houseWalls = [{ id: 'hw', points: houseLoop, kind: 'full' }];
    const OUT = { x: 10000, y: 8000 };     // clear of the house loop
    const IN  = { x: 5000,  y: 4500 };     // inside it
    const sceneAt = (gl) => (gl === 0 ? scene : { ...scene, groundLevelMm: gl });
    const near = (a, b, tol = 1e-6) => Math.abs(a - b) <= tol;

    // ── H1/H2: furniture. An outdoor tree stands on the grade, an identical
    // indoor one does not. Groups are found by their scene x (= fw/2 − wx).
    const fu = (id, kind, x, y, w, h, extra = {}) =>
      ({ id, kind, x, y, w, h, rotation: 0, ...extra });
    const grpAtWorldX = (wx) => r._floorGroup.children.find(
      c => c.type === 'Group' && Math.abs(c.position.x - (FW / 2 - wx)) < 1);
    const treeYs = (gl) => {
      r.updateFloor(mkFloor([], {
        walls: houseWalls,
        furniture: [fu('tOut', 'tree', OUT.x, OUT.y, 900, 900),
                    fu('tIn', 'tree', IN.x, IN.y, 900, 900)],
      }), sceneAt(gl));
      return { out: grpAtWorldX(OUT.x)?.position.y, in: grpAtWorldX(IN.x)?.position.y };
    };
    {
      const lo = treeYs(LOW), zero = treeYs(0);
      ok('H1 outdoor furniture stands on the lowered grade, indoor does not',
         near(lo.out, LOW) && near(lo.in, 0), `out=${lo.out} in=${lo.in}`);
      ok('H2 level 0 restores both to the slab exactly',
         zero.out === 0 && zero.in === 0, `out=${zero.out} in=${zero.in}`);
    }

    // ── H3/H4: an outdoor lawn chair's SitSpot rides the grade, and a rig that
    // dwells there sits ON the cushion (the whole seated pose drops with it).
    const realNow = performance.now.bind(performance);
    let fakeNow = realNow();
    performance.now = () => fakeNow;
    const sitOnLawnChair = (gl) => {
      r.clearTransientGroups();
      r.updateFloor(mkFloor([], {
        walls: houseWalls,
        furniture: [fu('lc', 'lawn_chair', OUT.x, OUT.y, 700, 1200)],
      }), sceneAt(gl));
      const seatY = r._sitSpots[0]?.seatY;
      for (let i = 0; i < 420; i++) {
        fakeNow += 16.7;
        r.updateTargets([{ key: 'LC', x: OUT.x, y: OUT.y - 700, color: 0x4fc3f7 }]);
      }
      const h = r._humanoids['LC'];
      return { seatY, sit: h?.sit ?? 0, rootY: h?.group.position.y ?? NaN };
    };
    {
      const lo = sitOnLawnChair(LOW), zero = sitOnLawnChair(0);
      // lawn_chair seat = 380 mm; the spot is the seat height + the grade.
      ok('H3 outdoor SitSpot seat height rides the grade',
         near(zero.seatY, 380) && near(lo.seatY, 380 + LOW),
         `seat0=${zero.seatY} seatLow=${lo.seatY}`);
      ok('H4 a rig seated outdoors drops with the chair (Δroot = level)',
         lo.sit > 0.9 && zero.sit > 0.9 && near(lo.rootY - zero.rootY, LOW, 1),
         `sit=${lo.sit.toFixed(2)}/${zero.sit.toFixed(2)} Δroot=${(lo.rootY - zero.rootY).toFixed(1)}`);
    }
    performance.now = realNow;

    // ── H5: ground areas — an INDOOR area is floor covering and never moves.
    {
      const inArea = { id: 'ai', kind: 'concrete', points: sq(IN.x, IN.y, 400), elevationMm: 0 };
      const outArea = { id: 'ao', kind: 'grass', points: sq(OUT.x, OUT.y, 700), elevationMm: 0 };
      r.updateFloor(mkFloor([inArea, outArea], { walls: houseWalls }), sceneAt(LOW));
      r.updateGroundAreas([inArea, outArea], undefined, FW, FD, houseWalls, false, LOW);
      const tops = topsOf();
      const yIn = tops.find(t => Math.abs(t.position.x - (FW / 2 - IN.x)) < 5000 && t.position.y === 4);
      const ys = tops.map(t => t.position.y).sort((a, b) => a - b);
      ok('H5 outdoor patch on the grade (4 + level), indoor patch at 4',
         ys.length === 2 && ys[0] === LOW + 4 && ys[1] === 4 && !!yIn,
         `ys=[${ys.join(',')}]`);
    }

    // ── H6: pools. An outdoor basin recesses from the grade.
    {
      const pool = { id: 'pl', kind: 'pool', points: sq(OUT.x, OUT.y, 1200), depthMm: 1400 };
      const surfOf = () => r._poolGroup.children.find(c => c.userData && c.userData.poolWater)?.position.y;
      r.updateFloor(mkFloor([], { walls: houseWalls, pools: [pool] }), sceneAt(LOW));
      r.updatePools([pool], () => null);
      const lo = surfOf();
      r.updateFloor(mkFloor([], { walls: houseWalls, pools: [pool] }), sceneAt(0));
      r.updatePools([pool], () => null);
      const zero = surfOf();
      ok('H6 outdoor pool water surface rides the grade',
         near(zero, G.poolWaterSurfaceY(pool)) && near(lo, G.poolWaterSurfaceY(pool) + LOW),
         `surf0=${zero} surfLow=${lo}`);
    }

    // ── H7/H8: lights. A ground-standing lamp (+ its floor pool) follows the
    // grade outdoors; a WALL-mounted sconce and a wall switch never do.
    {
      const lamp = { id: 'lp', x: OUT.x, y: OUT.y, entity_id: null, iconKind: 'lamp',
                     height: 1500, localState: 'on' };
      const sconce = { id: 'sc', x: OUT.x + 500, y: OUT.y, entity_id: null, iconKind: 'sconce',
                       height: 2200, localState: 'on' };
      const sw = { id: 'sw1', x: OUT.x, y: OUT.y + 500, entity_id: null, localState: 'on' };
      const read = (gl) => {
        r.updateFloor(mkFloor([], { walls: houseWalls, lights: [lamp, sconce], switches: [sw] }), sceneAt(gl));
        r.updateLightsSwitches([lamp, sconce], [sw], () => null);
        const lit = r._lightGroup.children;
        const bodyAtX = (wx) => lit.find(c => c.type === 'Group' && Math.abs(c.position.x - (FW / 2 - wx)) < 1);
        const disc = lit.find(c => c.isMesh && c.geometry.type === 'CircleGeometry');
        return {
          lamp: bodyAtX(OUT.x)?.position.y, sconce: bodyAtX(OUT.x + 500)?.position.y,
          pool: disc?.position.y, sw: r._switchGroup.children[0]?.position.y,
        };
      };
      const lo = read(LOW), zero = read(0);
      // (A floor lamp's body group origin sits at the floor — the pole rises
      // from it — so the invariant is the DELTA, not an absolute height.)
      ok('H7 outdoor ground-standing lamp + its floor pool ride the grade',
         near(zero.pool, 3) && near(lo.pool - zero.pool, LOW) &&
         near(lo.lamp - zero.lamp, LOW) && zero.lamp != null,
         `lamp=${zero.lamp}/${lo.lamp} pool=${zero.pool}/${lo.pool}`);
      ok('H8 wall-mounted sconce + wall switch never move',
         near(zero.sconce, lo.sconce) && near(zero.sw, lo.sw) && near(lo.sw, 1200),
         `sconce=${zero.sconce}/${lo.sconce} switch=${zero.sw}/${lo.sw}`);
    }

    // ── H9: GPS landmarks / pins. Outdoors they ride the grade; the indoor
    // "find my phone" pin stays slab-relative.
    {
      const lms = [{ x: OUT.x, y: OUT.y, name: 'Mailbox' }];
      const pins = [{ x: IN.x, y: IN.y, label: 'A', color: '#4fc3f7', stale: false }];
      const read = (gl) => {
        r.updateFloor(mkFloor([], { walls: houseWalls }), sceneAt(gl));
        r.updateGpsPins(pins, lms);
        return r._gpsGroup.children.map(c => c.position.y);
      };
      const lo = read(LOW), zero = read(0);
      ok('H9 outdoor landmark sprite rides the grade, indoor pin does not',
         zero[0] === 300 && zero[1] === 1800 && lo[0] === 300 + LOW && lo[1] === 1800,
         `zero=[${zero.join(',')}] low=[${lo.join(',')}]`);
    }

    // ── H10: the lawn-text decal is MOWED INTO the ground it lies on (the
    // reported bug: it stayed at slab height while the yard dropped).
    {
      const read = (gl) => {
        r.updateFloor(mkFloor([], { walls: houseWalls }), sceneAt(gl));
        r.updateBgTexts([{ id: 'g1', mode: 'grass', text: 'HELLO' }], false, 0, 0);
        return r._bgRigs.find(x => x.mode === 'grass')?.grassMesh?.position.y;
      };
      const lo = read(LOW), zero = read(0);
      ok('H10 grass background text follows the ground level',
         zero === 6 && near(lo, 6 + LOW), `y0=${zero} yLow=${lo}`);
      r.updateBgTexts([], false, 0, 0);
    }
  }

  let pass = 0; const fails = [];
  for (const t of tests) { if (t.ok) pass++; else fails.push(t.name); }
  const total = tests.length, allPass = pass === total;
  const title = allPass ? `TERRAIN PASS ${pass}/${total}` : `TERRAIN FAIL ${pass}/${total} [${fails.join(',')}]`;
  document.title = title;
  window.__RESULT__ = { title };
  document.body.insertAdjacentHTML('beforeend',
    `<pre style="position:fixed;left:8px;top:8px;color:#8f8">${title}\n` +
    tests.map(t => `${t.ok ? 'PASS' : 'FAIL'} ${t.name} — ${t.detail ?? ''}`).join('\n') + `</pre>`);
</script>
