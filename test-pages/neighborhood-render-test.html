<!doctype html>
<meta charset="utf-8">
<title>NBHDRENDER …</title>
<style>
  html,body{margin:0;background:#0b0f14;color:#cfd8dc;font:13px/1.4 sans-serif}
  #c{width:1000px;height:640px}
  #log{position:fixed;right:8px;top:8px;width:400px;max-height:96vh;overflow:auto;
       background:#111820;border:1px solid #263340;border-radius:6px;padding:8px 10px;font-size:11px}
  .pass{color:#69f0ae}.fail{color:#ff5252}.hd{font-weight:bold;margin:2px 0 6px}
</style>
<div id="c"></div>
<div id="log"></div>
<script type="module">
  // Renderer-harness: neighborhood overlay buildings (Wave 2). Whole body is
  // synchronous after load()/updateFloor so no _animate RAF interleaves — every
  // read reflects only the manual updateNeighborhood call. Imports the BUILT
  // renderer chunk (bundles THREE); the test only reads plain numbers off
  // geometry.attributes.position + material props (no THREE import needed).
  //
  // Run: npm run build; cp -r dist/* test-pages/* into a harness dir; serve over
  // http; dump <title>. See test-pages/README.md.
  const mod = await import('./assets/three-renderer.js?v=' + Date.now());
  const r = new mod.ThreeDRenderer(document.getElementById('c'));
  await r.load();

  // Active floor 10000 × 8000 → the world→scene frame the overlay maps through:
  //   asx(wx) = afw/2 − wx = 5000 − wx ,  asz(wy) = wy − afd/2 = wy − 4000
  const AFW = 10000, AFD = 8000;
  const floor = {
    id: 'f1', name: 'T', w: AFW, d: AFD,
    walls: [{ id: 'w', points: [{x:200,y:200},{x:9800,y:200},{x:9800,y:7800},{x:200,y:7800},{x:200,y:200}] }],
    furniture: [], lights: [], switches: [], sensors: [], motionSensors: [],
    envSensors: [], doors: [], windows: [], bg: null, model3d: null, look3d: null,
  };
  r.updateFloor(floor, { preset: 'day', floorColor: '#8a7860', floorTex: 'wood', wallColor: '#cfd2d6' });

  const asx = wx => AFW / 2 - wx, asz = wy => wy - AFD / 2;

  const tests = [];
  const ok = (name, cond, detail) => tests.push({ name, ok: !!cond, detail: detail ?? '' });
  const near = (a, b, eps) => Math.abs(a - b) <= eps;

  const meshesOf = () => r._neighborhoodGroup.children;
  // Does the geometry (already rotated −π/2, position.y NOT applied here) carry a
  // vertex at scene (x, z)? Reads the position BufferAttribute directly.
  const hasVertexXZ = (geo, x, z, eps = 1) => {
    const pos = geo.attributes.position;
    for (let i = 0; i < pos.count; i++)
      if (near(pos.getX(i), x, eps) && near(pos.getZ(i), z, eps)) return true;
    return false;
  };
  const bboxOf = geo => { geo.computeBoundingBox(); return geo.boundingBox; };

  // ── An OFF-CENTER ASYMMETRIC footprint (the mirror catch) ───────────────────
  // Right-triangle in world mm — deliberately asymmetric so a front-to-back
  // mirror (forgetting the shape-y NEGATION) is detectable. Expected scene X/Z
  // computed by hand:
  //   p0 (2000,1000) → (asx 3000, asz −3000)
  //   p1 (3000,1000) → (asx 2000, asz −3000)
  //   p2 (2000,2500) → (asx 3000, asz −1500)   ← the asymmetric vertex
  const tri = { points: [{x:2000,y:1000},{x:3000,y:1000},{x:2000,y:2500}], heightMm: 9000, baseMm: 0 };
  const podium = { points: [{x:6000,y:5000},{x:7000,y:5000},{x:7000,y:6000},{x:6000,y:6000}], heightMm: 6000, baseMm: 2000 };

  // ── 1. basic build count ────────────────────────────────────────────────────
  r.updateNeighborhood({ buildings: [tri, podium], roads: [], water: [], landuse: [] }, null);
  ok('2 buildings → 2 meshes built', meshesOf().length === 2, `n=${meshesOf().length}`);

  // ── 2. off-center asymmetric footprint lands at correct scene X/Z ───────────
  const triMesh = meshesOf()[0];
  const g = triMesh.geometry;
  ok('vertex p0 → scene (3000,−3000)', hasVertexXZ(g, asx(2000), asz(1000)), `want(${asx(2000)},${asz(1000)})`);
  ok('vertex p1 → scene (2000,−3000)', hasVertexXZ(g, asx(3000), asz(1000)), `want(${asx(3000)},${asz(1000)})`);
  ok('vertex p2 (asymmetric) → scene (3000,−1500)', hasVertexXZ(g, asx(2000), asz(2500)), `want(${asx(2000)},${asz(2500)})`);
  // Explicit mirror-catch negative: if shape-y weren't negated, p0's z would be
  // +3000 (= −asz) instead of −3000. Assert NO vertex sits there.
  ok('NOT front-to-back mirrored (no vertex at z=+3000)', !hasVertexXZ(g, asx(2000), -asz(1000)), `mirror z=${-asz(1000)}`);

  // ── 3. extrusion top y = base + height ──────────────────────────────────────
  // triMesh: base 0, height 9000 → geometry Y ∈ [0,9000], position.y 0 → top 9000.
  const gb = bboxOf(g);
  ok('tri geometry Y spans 0..9000 (depth = height−base)', near(gb.min.y, 0, 1) && near(gb.max.y, 9000, 1), `y[${gb.min.y.toFixed(0)},${gb.max.y.toFixed(0)}]`);
  ok('tri mesh.position.y = 0 (grade)', triMesh.position.y === 0, `py=${triMesh.position.y}`);
  ok('tri world top y = 9000', near(triMesh.position.y + gb.max.y, 9000, 1));

  // ── 4. podium building floats at its base ───────────────────────────────────
  const podMesh = meshesOf()[1];
  const pg = bboxOf(podMesh.geometry);
  ok('podium mesh.position.y = 2000 (baseMm)', podMesh.position.y === 2000, `py=${podMesh.position.y}`);
  ok('podium geometry depth = 4000 (height−base)', near(pg.max.y, 4000, 1), `maxY=${pg.max.y.toFixed(0)}`);
  ok('podium world span 2000..6000', near(podMesh.position.y + pg.min.y, 2000, 1) && near(podMesh.position.y + pg.max.y, 6000, 1));

  // ── 5. outline-skip + no outline shells ─────────────────────────────────────
  ok('every neighborhood mesh has userData.outlineSkip', meshesOf().every(m => m.userData.outlineSkip === true));
  let outlineShells = 0;
  r._neighborhoodGroup.traverse(o => { if (o.userData && o.userData.outline) outlineShells++; });
  ok('NO inverted-hull outline shells in the group', outlineShells === 0, `shells=${outlineShells}`);

  // ── 6. ONE shared material across all buildings ─────────────────────────────
  ok('all buildings SHARE one material instance', meshesOf().every(m => m.material === meshesOf()[0].material));

  // ── 7. opacity < 1 → transparent; color override applied (with _simsColor push)
  r.updateNeighborhood({ buildings: [tri], roads: [], water: [], landuse: [] }, { opacity: 0.5, colorBuildings: '#ff0000' });
  const m2 = meshesOf()[0].material;
  ok('opacity 0.5 → material.opacity 0.5', m2.opacity === 0.5, `op=${m2.opacity}`);
  ok('opacity 0.5 → material.transparent true', m2.transparent === true);
  ok('colorBuildings #ff0000 → red-dominant material color', m2.color.r > m2.color.g && m2.color.r > m2.color.b, `rgb(${m2.color.r.toFixed(2)},${m2.color.g.toFixed(2)},${m2.color.b.toFixed(2)})`);

  // ── 8. opacity 1 (default) → not transparent, muted grey default ────────────
  r.updateNeighborhood({ buildings: [tri], roads: [], water: [], landuse: [] }, null);
  const m3 = meshesOf()[0].material;
  ok('no opacity → material.transparent false', m3.transparent === false, `tr=${m3.transparent}`);
  ok('no colorBuildings → grey-ish default (channels close)', Math.abs(m3.color.r - m3.color.b) < 0.2 && Math.abs(m3.color.r - m3.color.g) < 0.2, `rgb(${m3.color.r.toFixed(2)},${m3.color.g.toFixed(2)},${m3.color.b.toFixed(2)})`);

  // ── 9. rebuild replaces (disposes) — 3 → 1, no throw ────────────────────────
  let threw = false;
  try {
    r.updateNeighborhood({ buildings: [tri, podium, tri], roads: [], water: [], landuse: [] }, null);
    ok('rebuild with 3 → 3 meshes', meshesOf().length === 3, `n=${meshesOf().length}`);
    r.updateNeighborhood({ buildings: [tri], roads: [], water: [], landuse: [] }, null);
  } catch (e) { threw = true; }
  ok('rebuild 3 → 1 replaces meshes (count 1)', meshesOf().length === 1 && !threw, `n=${meshesOf().length} threw=${threw}`);

  // ── 10. null data / null buildings → empty group ────────────────────────────
  r.updateNeighborhood(null, null);
  ok('updateNeighborhood(null) → empty group', meshesOf().length === 0, `n=${meshesOf().length}`);
  r.updateNeighborhood({ buildings: [], roads: [], water: [], landuse: [] }, null);
  ok('empty buildings → empty group', meshesOf().length === 0, `n=${meshesOf().length}`);

  // ── 11. layer flip hides / shows via setLayerVisibility ─────────────────────
  r.updateNeighborhood({ buildings: [tri, podium], roads: [], water: [], landuse: [] }, null);
  r.setLayerVisibility({ neighborhood: false });
  ok('setLayerVisibility neighborhood:false → group hidden', r._neighborhoodGroup.visible === false);
  r.setLayerVisibility({ neighborhood: true });
  ok('setLayerVisibility neighborhood:true → group visible', r._neighborhoodGroup.visible === true);
  r.setLayerVisibility({});
  ok('absent flag → group visible (default on)', r._neighborhoodGroup.visible === true);

  // ── 12. self-intersecting ring skips without throwing; the rest build ───────
  // A bowtie (figure-8) — earcut wouldn't throw, so the renderer must PRE-reject
  // it. 2 valid + 1 bowtie → exactly 2 meshes.
  const bowtie = { points: [{x:2000,y:1000},{x:2500,y:1500},{x:2500,y:1000},{x:2000,y:1500}], heightMm: 5000, baseMm: 0 };
  let threw2 = false;
  try { r.updateNeighborhood({ buildings: [tri, bowtie, podium], roads: [], water: [], landuse: [] }, null); }
  catch (e) { threw2 = true; }
  ok('self-intersecting ring skipped, rest built (2 meshes, no throw)', meshesOf().length === 2 && !threw2, `n=${meshesOf().length} threw=${threw2}`);

  // ── 13. roads: ribbon patch built at y=3, correct frame mapping ─────────────
  // A horizontal centerline (2000,1000)→(4000,1000) width 1000 → a ribbon polygon.
  // Flat patches use mesh.rotation.x = −π/2 + position.y = layer y; the geometry
  // vertices stay (sx, sy, 0) with sx=asx(wx), sy=−asz(wy).
  const road = { points: [{x:2000,y:1000},{x:3000,y:1000},{x:4000,y:1000}], widthMm: 1000, cls: 'residential', bridge: false };
  r.updateNeighborhood({ buildings: [], roads: [road], water: [], landuse: [] }, null);
  const roadPatches = meshesOf().filter(m => Math.abs(m.rotation.x + Math.PI/2) < 1e-6 && m.position.y === 3);
  ok('road → one flat patch at y=3', roadPatches.length === 1, `n=${roadPatches.length}`);
  const rp = roadPatches[0];
  ok('road patch geometry has >4 vertices (ribbon)', rp.geometry.attributes.position.count > 4, `verts=${rp.geometry.attributes.position.count}`);
  const rb = bboxOf(rp.geometry);
  // sx over asx(2000..4000)=1000..3000; sy over −asz(500..1500)=2500..3500.
  ok('road ribbon frame mapping (sx≈1000..3000)', near(rb.min.x, asx(4000), 5) && near(rb.max.x, asx(2000), 5), `x[${rb.min.x.toFixed(0)},${rb.max.x.toFixed(0)}]`);
  ok('road ribbon width straddles centerline (sy≈2500..3500)', near(rb.min.y, -asz(1500), 5) && near(rb.max.y, -asz(500), 5), `y[${rb.min.y.toFixed(0)},${rb.max.y.toFixed(0)}]`);

  // ── 14. water: patch at y=2, opacity clamped ≤0.85 ──────────────────────────
  const waterPoly = { points: [{x:5000,y:4000},{x:6000,y:4000},{x:6000,y:5000},{x:5000,y:5000}], cls: 'lake' };
  r.updateNeighborhood({ buildings: [], roads: [], water: [waterPoly], landuse: [] }, { opacity: 1 });
  const waterPatches = meshesOf().filter(m => m.position.y === 2 && Math.abs(m.rotation.x + Math.PI/2) < 1e-6);
  ok('water → one flat patch at y=2', waterPatches.length === 1, `n=${waterPatches.length}`);
  ok('water material transparent + opacity ≤0.85', waterPatches[0].material.transparent === true && waterPatches[0].material.opacity <= 0.85 + 1e-6, `op=${waterPatches[0].material.opacity}`);

  // ── 15. landuse: patch at y=1 when present; empty → none ─────────────────────
  const luPoly = { points: [{x:1000,y:6000},{x:2000,y:6000},{x:2000,y:7000},{x:1000,y:7000}], cls: 'park' };
  r.updateNeighborhood({ buildings: [], roads: [], water: [], landuse: [luPoly] }, null);
  const luPatches = meshesOf().filter(m => m.position.y === 1 && Math.abs(m.rotation.x + Math.PI/2) < 1e-6);
  ok('landuse present → one patch at y=1', luPatches.length === 1, `n=${luPatches.length}`);
  ok('landuse material low opacity (≤0.35)', luPatches[0].material.opacity <= 0.35 + 1e-6, `op=${luPatches[0].material.opacity}`);
  r.updateNeighborhood({ buildings: [], roads: [], water: [], landuse: [] }, null);
  ok('empty landuse → no y=1 patch (respects extraction gate)', meshesOf().filter(m => m.position.y === 1).length === 0);

  // ── 16. color overrides applied per layer ───────────────────────────────────
  r.updateNeighborhood({ buildings: [], roads: [road], water: [waterPoly], landuse: [] },
    { colorRoads: '#ff0000', colorWater: '#00ff00' });
  const rMat = meshesOf().find(m => m.position.y === 3).material;
  const wMat = meshesOf().find(m => m.position.y === 2).material;
  ok('colorRoads red-dominant', rMat.color.r > rMat.color.g && rMat.color.r > rMat.color.b, `rgb(${rMat.color.r.toFixed(2)},${rMat.color.g.toFixed(2)},${rMat.color.b.toFixed(2)})`);
  ok('colorWater green-dominant', wMat.color.g > wMat.color.r && wMat.color.g > wMat.color.b, `rgb(${wMat.color.r.toFixed(2)},${wMat.color.g.toFixed(2)},${wMat.color.b.toFixed(2)})`);

  // ── 17. road cap at 600 (defensive) ─────────────────────────────────────────
  const manyRoads = [];
  for (let i = 0; i < 700; i++) manyRoads.push({ points: [{x:100+i,y:100},{x:200+i,y:100}], widthMm: 500, cls: 'service', bridge: false });
  r.updateNeighborhood({ buildings: [], roads: manyRoads, water: [], landuse: [] }, null);
  const cappedRoads = meshesOf().filter(m => m.position.y === 3);
  ok('700 roads → capped at 600 ribbons (default, no maxRoads)', cappedRoads.length === 600, `n=${cappedRoads.length}`);
  // A caller-supplied cap (roadCapForRadius at a big fetch radius) raises it.
  r.updateNeighborhood({ buildings: [], roads: manyRoads, water: [], landuse: [] }, { maxRoads: 1200 });
  ok('maxRoads 1200 → all 700 ribbons drawn', meshesOf().filter(m => m.position.y === 3).length === 700, `n=${meshesOf().filter(m => m.position.y === 3).length}`);
  r.updateNeighborhood({ buildings: [], roads: manyRoads, water: [], landuse: [] }, { maxRoads: 50 });
  ok('maxRoads 50 → capped at 50 ribbons', meshesOf().filter(m => m.position.y === 3).length === 50, `n=${meshesOf().filter(m => m.position.y === 3).length}`);

  // ── 18. all flat patches carry outlineSkip ──────────────────────────────────
  r.updateNeighborhood({ buildings: [tri], roads: [road], water: [waterPoly], landuse: [luPoly] }, null);
  ok('mixed content: every mesh outlineSkip', meshesOf().every(m => m.userData.outlineSkip === true), `n=${meshesOf().length}`);
  ok('mixed content: buildings + roads + water + landuse all present',
     meshesOf().some(m => m.rotation.x === 0) &&           // building (baked extrude, mesh rot 0)
     meshesOf().some(m => m.position.y === 3) &&
     meshesOf().some(m => m.position.y === 2) &&
     meshesOf().some(m => m.position.y === 1), `n=${meshesOf().length}`);
  r.updateNeighborhood(null, null);

  // ── 19. dynamic camera frustum for far-flung overlay content ────────────────
  // STOCK triple (load-bearing): near 10 / far 150000 / maxDistance 45000. The
  // overlay may widen it to reach distant buildings and MUST restore it exactly
  // when the overlay goes away.
  //
  // The widened path is CAMERA-DISTANCE-TRACKING, not static: the far plane is
  // measured from the camera, so the invariant is
  //     far ≥ camDist + 1.25·req + 30000   (clamped to [150000, 13.5e6])
  // A static far let a zoom-out drag the far-clip boundary in through the tile
  // content — the horizon crept toward the property (the reported bug). Here the
  // per-frame `_updateDynamicFrustum()` is driven MANUALLY (this whole body is
  // synchronous, so no _animate RAF interleaves and every read is deterministic).
  const NEAR0 = 10, FAR0 = 150000, MAXD0 = 45000, RATIO = 15000;
  const FAR_CEIL = 13_500_000, MAXD_CEIL = 8_500_000;
  const REACH_F = 1.25, MARGIN = 30000, MAXD_F = 2.2, HYST = 0.05;
  const camState = () => ({ near: r._camera.near, far: r._camera.far, maxD: r._controls.maxDistance });
  const stockOk = s => s.near === NEAR0 && s.far === FAR0 && s.maxD === MAXD0;
  // Live orbit distance the renderer itself measures.
  const camDist = () => r._camera.position.distanceTo(r._controls.target);
  // Park the camera at a chosen orbit distance along the current view ray, then
  // let the renderer re-evaluate (exactly what _animate does after controls.update).
  const zoomTo = d => {
    const t = r._controls.target, p = r._camera.position;
    const dx = p.x - t.x, dy = p.y - t.y, dz = p.z - t.z;
    const k = d / Math.hypot(dx, dy, dz);
    p.set(t.x + dx * k, t.y + dy * k, t.z + dz * k);
    r._updateDynamicFrustum();
  };
  const wantFar = req => Math.max(FAR0, Math.min(FAR_CEIL, camDist() + REACH_F * req + MARGIN));
  // Count projection-matrix rewrites so hysteresis is observable.
  let projCalls = 0;
  const realUPM = r._camera.updateProjectionMatrix.bind(r._camera);
  r._camera.updateProjectionMatrix = () => { projCalls++; realUPM(); };

  ok('frustum: stock triple at rest (10 / 150000 / 45000)', stockOk(camState()), JSON.stringify(camState()));

  // Nearby content (the small tri, reach ≈ 4.2 m) must NOT widen anything — the
  // formula stays under every floor at a normal orbit distance.
  r.updateNeighborhood({ buildings: [tri], roads: [], water: [], landuse: [] }, null);
  ok('frustum: near content keeps the stock triple', stockOk(camState()), JSON.stringify(camState()));

  // A building 100 m from the scene origin → the un-clamped formula.
  // asx(wx) = 5000 − wx, so wx = −95000 → sx = 100000 (sz = 0 at wy = 4000).
  const farSq = (wx, wy, s, ht) => ({ points: [{x:wx,y:wy},{x:wx+s,y:wy},{x:wx+s,y:wy+s},{x:wx,y:wy+s}], heightMm: ht, baseMm: 0 });
  // Independent reach computation (max |(asx, asz)| over the footprint, and the
  // building top) — mirrors the renderer's own scan.
  const reachOf = b => Math.max(b.heightMm, ...b.points.map(p => Math.hypot(asx(p.x), asz(p.y))));
  const bldgA = farSq(-95000, 4000, 1000, 5000);        // ≈100 m from the scene origin
  const REQ_A = reachOf(bldgA);
  r.updateNeighborhood({ buildings: [bldgA], roads: [], water: [], landuse: [] }, null);
  const dA = camDist();
  const fa = dA + REACH_F * REQ_A + MARGIN;
  const sA = camState();
  ok('frustum: test req ≈ 100 m (formula un-clamped here)', fa > FAR0 && fa < FAR_CEIL, `req=${REQ_A.toFixed(0)} camDist=${dA.toFixed(0)} far=${fa.toFixed(0)}`);
  ok('frustum: far building grows far to camDist+1.25·req+30000', near(sA.far, fa, 1), `far=${sA.far} want=${fa}`);
  ok('frustum: near = far / 15000', near(sA.near, sA.far / RATIO, 1e-6), `near=${sA.near}`);
  ok('frustum: maxDistance = req·2.2 (frameable extent)', near(sA.maxD, Math.max(MAXD0, REQ_A * MAXD_F), 1), `maxD=${sA.maxD}`);
  ok('frustum: near:far ratio ≤ 15000 (depth precision)', sA.far / sA.near <= RATIO + 1e-6, `${(sA.far / sA.near).toFixed(0)}`);
  ok('frustum: widened values never below stock', sA.far >= FAR0 && sA.near >= NEAR0 && sA.maxD >= MAXD0);
  ok('frustum: invariant far ≥ camDist + 1.25·req + margin', sA.far >= camDist() + REACH_F * REQ_A + MARGIN - 1e-6, `far=${sA.far}`);

  // ── the reported bug: ZOOMING OUT must PUSH the far plane out, not clip.
  const farAtNear = camState().far;
  zoomTo(200000);   // still inside controls.maxDistance (req·2.2 = 220 m) — a reachable pull-back
  const sOut = camState();
  ok('frustum: zoom-out grows far (the horizon bug)', sOut.far > farAtNear, `${farAtNear} → ${sOut.far}`);
  ok('frustum: zoom-out far tracks camDist+1.25·req+margin', near(sOut.far, wantFar(REQ_A), 1), `far=${sOut.far} want=${wantFar(REQ_A)}`);
  ok('frustum: zoom-out invariant holds (content not clipped)', sOut.far >= camDist() + REACH_F * REQ_A + MARGIN - 1e-6, `far=${sOut.far} camDist=${camDist().toFixed(0)}`);
  ok('frustum: zoom-out near still = far/15000', near(sOut.near, sOut.far / RATIO, 1e-6), `near=${sOut.near}`);
  // …and zooming back in brings it back down (never one-way sticky).
  zoomTo(dA);
  const sBack = camState();
  ok('frustum: zoom back in shrinks far again', sBack.far < sOut.far && near(sBack.far, fa, 1), `far=${sBack.far} want=${fa}`);

  // ── hysteresis: a small camera wiggle must NOT rewrite the projection matrix.
  {
    const before = projCalls, farBefore = camState().far;
    zoomTo(dA * 1.02);          // +2 % orbit distance — well inside the 5 % band
    zoomTo(dA * 0.98);
    ok('frustum: 2 % camDist wiggle does not bump projection updates', projCalls === before, `calls=${projCalls - before}`);
    ok('frustum: …and leaves far untouched', camState().far === farBefore, `far=${camState().far}`);
    // A move big enough to clear the band DOES update.
    const wiggleFar = camState().far;
    zoomTo(dA + wiggleFar * HYST * 2);
    ok('frustum: a >5 % move does update far', camState().far !== wiggleFar && projCalls > before, `far=${camState().far} calls=${projCalls - before}`);
    zoomTo(dA);
  }

  // ── a 3 km-scale fetch: the worst case the overlay can ask for. Both ceilings
  // engage, and the invariant must STILL hold at controls.maxDistance.
  const REQ_B = 12_000_000;                       // past both ceilings by design
  const bldgB = farSq(-(REQ_B - 5000), 4000, 1000, 5000);
  r.updateNeighborhood({ buildings: [bldgB], roads: [], water: [], landuse: [] }, null);
  const sB = camState();
  ok('frustum: huge content clamps far at the 13.5e6 ceiling', sB.far === FAR_CEIL, `far=${sB.far}`);
  ok('frustum: clamped near = 13.5e6/15000 = 900', near(sB.near, 900, 1e-6), `near=${sB.near}`);
  ok('frustum: clamped maxDistance at 8.5e6', sB.maxD === MAXD_CEIL, `maxD=${sB.maxD}`);
  ok('frustum: ratio still ≤ 15000 when clamped', sB.far / sB.near <= RATIO + 1e-6, `${(sB.far / sB.near).toFixed(0)}`);
  ok('frustum: minDistance (1000) still clears the widest near', r._controls.minDistance > sB.near, `min=${r._controls.minDistance} near=${sB.near}`);

  // A realistic 3 km fetch (reach ≈ 3.8e6 mm) framed from controls.maxDistance:
  // the whole point of the maxDistance factor is that this pose still sees it all.
  const REQ_C = 3_800_000;
  const bldgC = farSq(-(REQ_C - 5000), 4000, 1000, 5000);
  r.updateNeighborhood({ buildings: [bldgC], roads: [], water: [], landuse: [] }, null);
  const maxD_C = r._controls.maxDistance;
  ok('frustum: 3 km req un-clamped maxDistance = req·2.2', near(maxD_C, REQ_C * MAXD_F, 1) && maxD_C < MAXD_CEIL, `maxD=${maxD_C}`);
  ok('frustum: maxDistance frames the extent (d·tan(25°) ≥ req)', maxD_C * Math.tan(25 * Math.PI / 180) >= REQ_C, `${(maxD_C * Math.tan(25*Math.PI/180)).toFixed(0)} ≥ ${REQ_C}`);
  zoomTo(maxD_C);
  const sC = camState();
  ok('frustum: invariant holds at maxDistance for a 3 km req', sC.far >= camDist() + REACH_F * REQ_C + MARGIN - 1e-6 || sC.far === FAR_CEIL, `far=${sC.far} camDist=${camDist().toFixed(0)}`);
  ok('frustum: 3 km far stays under the ceiling', sC.far <= FAR_CEIL, `far=${sC.far}`);
  ok('frustum: near tracks far/15000 with the 10 floor', near(sC.near, Math.max(NEAR0, sC.far / RATIO), 1e-6), `near=${sC.near}`);
  zoomTo(dA);

  // Overlay off → the stock triple restores EXACTLY (never sticky) and the
  // dynamic updater goes quiet (the stock restore must WIN over any pending value).
  r.updateNeighborhood(null, null);
  ok('frustum: overlay null restores stock triple exactly', stockOk(camState()), JSON.stringify(camState()));
  zoomTo(40000); zoomTo(20000);
  ok('frustum: dynamic updater inert once the overlay is off', stockOk(camState()), JSON.stringify(camState()));
  // …and so does empty content (the other no-content path).
  r.updateNeighborhood({ buildings: [bldgB], roads: [], water: [], landuse: [] }, null);
  ok('frustum: re-widens on new far content', camState().far === FAR_CEIL, `far=${camState().far}`);
  r.updateNeighborhood({ buildings: [], roads: [], water: [], landuse: [] }, null);
  ok('frustum: empty content restores stock triple exactly', stockOk(camState()), JSON.stringify(camState()));
  // A resize / setFov must not clobber the frustum (they only touch fov/aspect).
  r.updateNeighborhood({ buildings: [bldgA], roads: [], water: [], landuse: [] }, null);
  zoomTo(dA);
  const fResize = camState().far;
  r.resize(800, 500);
  const sR = camState();
  ok('frustum: resize preserves near/far/maxDistance',
     sR.far === fResize && near(sR.near, fResize / RATIO, 1e-6) && near(sR.maxD, REQ_A * MAXD_F, 1), JSON.stringify(sR));
  r.setFov(70, 90);
  const sF = camState();
  ok('frustum: setFov preserves near/far/maxDistance',
     sF.far === fResize && sF.near === sR.near && sF.maxD === sR.maxD, JSON.stringify(sF));
  r.setFov(50, null);
  // Interaction pin: the camera-centered sky dome writes no depth and renders
  // first, so distant buildings overdraw it however wide the far plane gets.
  if (r._skyDome) {
    ok('frustum: sky dome still depthWrite:false / renderOrder −10 (buildings overdraw it)',
       r._skyDome.material.depthWrite === false && r._skyDome.renderOrder === -10,
       `dw=${r._skyDome.material.depthWrite} ro=${r._skyDome.renderOrder}`);
  } else {
    ok('frustum: sky dome not built in this harness (no depth interaction)', true, 'skipped');
  }
  r.updateNeighborhood(null, null);
  ok('frustum: final state back to stock', stockOk(camState()), JSON.stringify(camState()));

  // ── 19b. UNION of per-source reach requirements (nbhd ∪ flights) ────────────
  // The neighborhood overlay is no longer the only feature that draws past the
  // stock far plane: the live-aircraft display shell reaches ≈137 m from the
  // home anchor (FLIGHT_SHELL_REACH_MM). Each source records its OWN
  // requirement; the far/near widening uses the MAX, and the stock triple
  // restores EXACTLY only when BOTH are absent.
  //
  // ASYMMETRY under test: only the NEIGHBORHOOD requirement may raise
  // controls.maxDistance. Framing a km-scale overlay needs the pull-back;
  // watching aircraft does not, and a transient overflight must not change the
  // scene's zoom feel.
  //
  // Driven through the recorder seam `_recordFrustumReq` so this page needs no
  // flights bundle — flights-render-test §4c pins the real updateFlights path
  // (and that the recorded value IS the shell constant).
  {
    zoomTo(dA);
    const REQ_F = Math.hypot(120000, 66000);        // the flight-shell reach (≈136,953)
    const REQ_N_BIG = 900000;                       // a ~1 km overlay fetch
    const REQ_N_SMALL = 60000;                      // widens maxDistance but not far
    const both = (n, f) => { r._recordFrustumReq('nbhd', n); r._recordFrustumReq('flights', f); };
    const wantMaxD = n => n == null ? MAXD0 : Math.max(MAXD0, Math.min(MAXD_CEIL, n * MAXD_F));

    both(null, null);
    ok('union: both sources absent → stock triple exactly', stockOk(camState()), JSON.stringify(camState()));

    // FLIGHTS ONLY — far/near widen, maxDistance must NOT move.
    both(null, REQ_F);
    const sF = camState();
    ok('union: flights-only widens the far plane', sF.far > FAR0 && near(sF.far, wantFar(REQ_F), 1),
       `far=${sF.far.toFixed(0)} want=${wantFar(REQ_F).toFixed(0)}`);
    ok('union: flights-only keeps near = far/15000', near(sF.near, sF.far / RATIO, 1e-6), `near=${sF.near}`);
    ok('union: flights-only leaves maxDistance STOCK (the asymmetry)',
       sF.maxD === MAXD0, `maxD=${sF.maxD}`);
    ok('union: flights-only far clears the shell reach from the camera',
       sF.far >= camDist() + REACH_F * REQ_F + MARGIN - 1e-6, `far=${sF.far}`);

    // NBHD ONLY — unchanged from today (far AND maxDistance widen).
    both(REQ_N_BIG, null);
    const sN = camState();
    ok('union: nbhd-only widens far', near(sN.far, wantFar(REQ_N_BIG), 1), `far=${sN.far.toFixed(0)}`);
    ok('union: nbhd-only widens maxDistance', near(sN.maxD, wantMaxD(REQ_N_BIG), 1), `maxD=${sN.maxD}`);

    // BOTH, neighborhood larger → far tracks the neighborhood.
    both(REQ_N_BIG, REQ_F);
    const sBN = camState();
    ok('union: both present, nbhd larger → far = max(nbhd, flights)',
       near(sBN.far, wantFar(REQ_N_BIG), 1), `far=${sBN.far.toFixed(0)}`);
    ok('union: …maxDistance still from the neighborhood alone',
       near(sBN.maxD, wantMaxD(REQ_N_BIG), 1), `maxD=${sBN.maxD}`);

    // BOTH, flights larger → far tracks the flights shell, maxDistance still
    // comes from the (smaller) neighborhood requirement only.
    both(REQ_N_SMALL, REQ_F);
    const sBF = camState();
    ok('union: both present, flights larger → far = max(nbhd, flights)',
       near(sBF.far, wantFar(REQ_F), 1), `far=${sBF.far.toFixed(0)} want=${wantFar(REQ_F).toFixed(0)}`);
    ok('union: …and that is strictly wider than the nbhd term alone',
       wantFar(REQ_F) > wantFar(REQ_N_SMALL),
       `${wantFar(REQ_F).toFixed(0)} > ${wantFar(REQ_N_SMALL).toFixed(0)}`);
    ok('union: …maxDistance comes from the nbhd requirement, never the flights one',
       near(sBF.maxD, wantMaxD(REQ_N_SMALL), 1), `maxD=${sBF.maxD}`);

    // Dropping ONE source must not restore stock while the other is live.
    both(null, REQ_F);
    ok('union: dropping nbhd keeps the flights widening', camState().far > FAR0 && !stockOk(camState()),
       JSON.stringify(camState()));
    ok('union: …and maxDistance falls back to stock with the nbhd gone',
       camState().maxD === MAXD0, `maxD=${camState().maxD}`);
    r._recordFrustumReq('nbhd', REQ_N_BIG);
    r._recordFrustumReq('flights', null);
    ok('union: dropping flights keeps the nbhd widening',
       near(camState().far, wantFar(REQ_N_BIG), 1) && camState().maxD > MAXD0, JSON.stringify(camState()));

    // Only when BOTH are gone does the stock triple come back — strict ===.
    both(null, null);
    ok('union: both cleared → stock triple restored EXACTLY (strict ===)',
       stockOk(camState()), JSON.stringify(camState()));
    zoomTo(60000); zoomTo(25000);
    ok('union: …and the dynamic updater is inert afterwards', stockOk(camState()),
       JSON.stringify(camState()));
    zoomTo(dA);
  }

  r._camera.updateProjectionMatrix = realUPM;

  // ── report ──────────────────────────────────────────────────────────────────
  const pass = tests.filter(t => t.ok).length, total = tests.length;
  const allPass = pass === total;
  const fails = tests.filter(t => !t.ok).map(t => t.name);
  const title = allPass ? `NBHDRENDER PASS ${pass}/${total}` : `NBHDRENDER FAIL ${pass}/${total} [${fails.join(',')}]`;
  document.title = title;
  const log = document.getElementById('log');
  log.innerHTML = `<div class="hd ${allPass ? 'pass' : 'fail'}">${title}</div>` +
    tests.map(t => `<div><span class="${t.ok ? 'pass' : 'fail'}">${t.ok ? 'PASS' : 'FAIL'}</span> ${t.name} <span style="color:#78909c">${t.detail}</span></div>`).join('');
</script>
