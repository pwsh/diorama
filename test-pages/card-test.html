<!doctype html>
<meta charset="utf-8">
<title>CARD …</title>
<style>
  body { margin:0; background:#0d1116; color:#cfd8dc; font:13px/1.5 sans-serif; padding:14px; }
  h1 { font-size:15px; margin:0 0 10px; }
  #summary { font-size:14px; font-weight:bold; margin:10px 0; padding:8px 10px; border-radius:5px; }
  .okbg { background:#12331f; color:#69f0ae; } .badbg { background:#3a1414; color:#ff8a80; }
  .row { display:flex; justify-content:space-between; gap:10px; padding:2px 0; border-bottom:1px solid #1c2530; }
  .pass { color:#69f0ae; } .fail { color:#ff5252; }
  .name { color:#90caf9; } .extra { color:#ffd54f; font-size:11px; }
  /* Give mounted cards a real box so canvas ResizeObserver fires. Default hosts
     are 480px (> the 360px auto-compact threshold); .narrow tests ~300px. */
  #stage { position:absolute; left:-10000px; top:0; }
  .cardhost { width:480px; height:300px; }
  .cardhost.narrow { width:300px; }
</style>
<h1>Lovelace card — shared Planner · config surface · sizing · view-mode · lifecycle</h1>
<div id="summary">Running…</div>
<div id="rows"></div>
<div id="stage"></div>

<!-- Drives the REAL <diorama-card> (bundled card.mod.js) with a FAKE hass object
     (a stub `connection` matching HassPanelAdapter's calls). Build recipe:
       npm run build
       H=/tmp/diorama-harness-card; mkdir -p "$H"; cp -r dist/* test-pages/* "$H"/
       T=$(mktemp -d); cp -r src/* "$T"/
       cp test-pages/fake-avatar-store.ts "$T"/avatar-store.ts
       cp test-pages/card-entry.ts        "$T"/card-entry.ts
       npx esbuild "$T"/card-entry.ts --bundle --format=esm --outfile="$H"/card.mod.js
       cd "$H" && python3 -m http.server 8842
     (esbuild inlines the three-renderer dynamic import — only executed if a 3D
     card mounts; the 2D assertions never touch it.) -->
<script type="module">
  const V = '?v=' + Date.now();
  const { Planner, peekSharedPlanner, validateCardConfig,
          LAYER_DEFS, SIMPLE_LAYERS, CARD_SCENE_BOOLS } = await import('./card.mod.js' + V);

  const results = [];
  const ok = (name, cond, extra = '') => results.push({ name, pass: !!cond, extra: String(extra) });
  window.__R = results;   // harness-debug hook: inspect progress if the page hangs mid-run
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  async function waitFor(cond, tries = 800) {
    for (let i = 0; i < tries; i++) { if (cond()) return true; await sleep(5); }
    return !!cond();
  }
  const clone = x => JSON.parse(JSON.stringify(x));
  const stage = document.getElementById('stage');

  // ── Fake hass: states + a connection stub matching HassPanelAdapter ─────────
  let subscribeEventsCalls = 0;
  function makeStore(floors) {
    return {
      v: 2, currentFloorId: floors[0].id, activeSensorId: null,
      coverage: true, imperial: false, showDetails: false, useRawTargets: false,
      floors: floors.map(f => ({
        w: 8000, d: 6000, walls: [], furniture: [], lights: [], switches: [],
        sensors: [], motionSensors: [], roamers: [], envSensors: [], doors: [],
        windows: [], bg: null, rooms: [], bleProxies: [], alarmPanels: [],
        safetySensors: [], robots: [], presenceZones: [], cameras: [],
        groundAreas: [], voidAreas: [], ...f,
      })),
    };
  }
  function makeHass(seed) {
    const map = new Map(Object.entries(seed || {}).map(([k, v]) => [k, clone(v)]));
    return {
      states: {},
      connection: {
        async sendMessagePromise(msg) {
          switch (msg.type) {
            case 'frontend/get_user_data': return { value: map.has(msg.key) ? clone(map.get(msg.key)) : null };
            case 'frontend/set_user_data': map.set(msg.key, clone(msg.value)); return {};
            case 'get_states': return [];
            case 'config/device_registry/list': return [];
            case 'config/entity_registry/list': return [];
            default: return {};
          }
        },
        subscribeEvents(_cb, _type) { subscribeEventsCalls++; return Promise.resolve(() => {}); },
        subscribeMessage(_cb, _msg) { return Promise.resolve(() => {}); },
      },
    };
  }

  function mkCard(narrow = false) {
    const host = document.createElement('div');
    host.className = 'cardhost' + (narrow ? ' narrow' : '');
    const card = document.createElement('diorama-card');
    host.appendChild(card);
    stage.appendChild(host);
    return card;
  }

  try {
    // Reset localStorage config cache so a fresh registry loads from the fake hass.
    localStorage.removeItem('diorama:store:v1');
    localStorage.removeItem('diorama:configs');

    const SEED = { 'diorama': makeStore([
      { id: 'f1', name: 'Ground' }, { id: 'f2', name: 'Upstairs' },
    ]) };

    // ── (a) setConfig + hass → renders the 2D canvas ──────────────────────────
    const cardA = mkCard();
    cardA.setConfig({ view: '2d', mode: 'kiosk' });
    ok('a: setConfig before hass does not throw + no planner yet', cardA._planner == null, '');
    cardA.hass = makeHass(SEED);
    const plA = cardA._planner;
    ok('a: hass boots a Planner', plA instanceof Planner, '');
    await waitFor(() => plA.configIndex !== null);
    ok('a: config registry loaded', plA.configIndex !== null, '');
    await cardA.updateComplete;
    await waitFor(() => !!cardA.querySelector('diorama-canvas-2d canvas'));
    ok('a: renders <diorama-canvas-2d>', !!cardA.querySelector('diorama-canvas-2d'), '');
    ok('a: canvas element present', !!cardA.querySelector('canvas'), '');
    ok('a: shared Planner forced kiosk', plA.uiMode === 'kiosk', plA.uiMode);

    // ── (b) two cards share ONE Planner + ONE state_changed subscription ───────
    const subsBefore = subscribeEventsCalls;
    const cardB = mkCard();
    cardB.setConfig({ view: '2d', mode: 'kiosk' });
    cardB.hass = makeHass(SEED);   // a *different* hass object, same tab
    ok('b: second card reuses the same Planner (reference)', cardB._planner === plA, '');
    ok('b: peekSharedPlanner === card Planner', peekSharedPlanner() === plA, '');
    ok('b: no new state_changed subscription for the 2nd card', subscribeEventsCalls === subsBefore,
      `calls=${subscribeEventsCalls}`);
    ok('b: exactly one subscribeEvents overall', subscribeEventsCalls === 1, `calls=${subscribeEventsCalls}`);

    // ── (c) floor config switches floors (retry-on-config) ────────────────────
    const cardC = mkCard();
    cardC.setConfig({ view: '2d', mode: 'kiosk', floor: 'Upstairs' });
    cardC.hass = makeHass(SEED);
    await waitFor(() => cardC._planner.store.currentFloorId === 'f2', 800);
    ok('c: floor:"Upstairs" applied (retry-on-config)',
      cardC._planner.store.currentFloorId === 'f2', cardC._planner.store.currentFloorId);
    // by id too
    cardC.setConfig({ view: '2d', mode: 'kiosk', floor: 'f1' });
    await waitFor(() => cardC._planner.store.currentFloorId === 'f1', 400);
    ok('c: floor by id applied', cardC._planner.store.currentFloorId === 'f1', cardC._planner.store.currentFloorId);

    // ── (d) mode:'view' wires no click routing (card-local, planner stays kiosk)
    const cardV = mkCard();
    cardV.setConfig({ view: '2d', mode: 'view' });
    cardV.hass = makeHass(SEED);
    await cardV.updateComplete;
    await waitFor(() => !!cardV.querySelector('diorama-canvas-2d'));
    const cv2d = cardV.querySelector('diorama-canvas-2d');
    ok('d: view card canvas interactive === false', cv2d && cv2d.interactive === false, String(cv2d?.interactive));
    ok('d: shared Planner uiMode still kiosk (view is card-local)', plA.uiMode === 'kiosk', plA.uiMode);
    // a kiosk card's canvas stays interactive
    const ck2d = cardA.querySelector('diorama-canvas-2d');
    ok('d: kiosk card canvas interactive === true', ck2d && ck2d.interactive === true, String(ck2d?.interactive));

    // ── (e) getCardSize / getGridOptions sane shapes ──────────────────────────
    ok('e: getCardSize is a positive number', typeof cardA.getCardSize() === 'number' && cardA.getCardSize() > 0,
      String(cardA.getCardSize()));
    const g = cardA.getGridOptions();
    ok('e: getGridOptions rows/min_rows numbers', typeof g.rows === 'number' && typeof g.min_rows === 'number', JSON.stringify(g));
    ok('e: getGridOptions columns full + min_columns', g.columns === 'full' && g.min_columns >= 1, JSON.stringify(g));
    const card3d = mkCard();
    card3d.setConfig({ view: '3d', mode: 'kiosk' });
    card3d.hass = makeHass(SEED);
    ok('e: 3D card size > 2D card size', card3d.getCardSize() > cardV.getCardSize(),
      `${card3d.getCardSize()} vs ${cardV.getCardSize()}`);

    // ── (f) compact hides overlay chrome ──────────────────────────────────────
    const cardK = mkCard();
    cardK.setConfig({ view: '2d', mode: 'kiosk', compact: true });
    cardK.hass = makeHass(SEED);
    await cardK.updateComplete;
    await waitFor(() => !!cardK.querySelector('diorama-canvas-2d'));
    ok('f: compact hides expand link', !cardK.querySelector('.diorama-card-expand'), '');
    ok('f: compact hides floor chip', !cardK.querySelector('.diorama-card-floorchip'), '');
    const compactCanvas = cardK.querySelector('diorama-canvas-2d');
    ok('f: compact passes compact=true to canvas', compactCanvas && compactCanvas.compact === true, String(compactCanvas?.compact));
    // non-compact card (480px, above the auto-compact threshold) shows chrome
    ok('f: non-compact card shows expand link', !!cardA.querySelector('.diorama-card-expand'), '');
    ok('f: non-compact card shows floor chip', !!cardA.querySelector('.diorama-card-floorchip'), '');

    // auto-compact: a ~300px-wide card with no compact config enters compact
    const cardN = mkCard(true);
    cardN.setConfig({ view: '2d', mode: 'kiosk' });
    cardN.hass = makeHass(SEED);
    await cardN.updateComplete;
    await waitFor(() => cardN._autoCompact === true, 200);
    ok('f: ~300px card auto-compacts', cardN._autoCompact === true, `w<360 → ${cardN._autoCompact}`);
    await cardN.updateComplete;
    ok('f: auto-compact hides expand link', !cardN.querySelector('.diorama-card-expand'), '');

    // ── (g) setConfig(mode:'edit') throws ─────────────────────────────────────
    let threw = false;
    try { mkCard().setConfig({ mode: 'edit' }); } catch { threw = true; }
    ok('g: setConfig mode:"edit" throws', threw, '');
    let threwView = false;
    try { mkCard().setConfig({ view: 'iso' }); } catch { threwView = true; }
    ok('g: setConfig bad view throws', threwView, '');

    // ── (h) disconnect / reconnect does not throw + re-renders ────────────────
    const host = cardA.parentElement;
    let discThrew = false;
    try {
      host.removeChild(cardA);              // disconnectedCallback
      await sleep(20);
      stage.appendChild(host);              // reconnectedCallback
      await cardA.updateComplete;
      await sleep(40);
    } catch (err) { discThrew = true; ok('h: reconnect stack', false, String(err && err.stack || err)); }
    ok('h: disconnect/reconnect does not throw', !discThrew, '');
    ok('h: canvas still present after reconnect', !!cardA.querySelector('diorama-canvas-2d canvas'), '');
    ok('h: Planner survived reconnect (same instance)', cardA._planner === plA, '');

    // ── (i) 3D card mounts <diorama-three-view> without a synchronous throw ────
    let threeThrew = false;
    try {
      await card3d.updateComplete;
      await sleep(30);
    } catch (err) { threeThrew = true; }
    ok('i: 3D card mounts three-view, no sync throw', !threeThrew && !!card3d.querySelector('diorama-three-view'), '');

    // ── (j) `type` survives the visual-editor round-trip ──────────────────────
    // Regression (user-reported): validateCardConfig rebuilt the config without
    // `type`, so every editor edit emitted a type-less config and HA threw
    // "No type provided" — the visual editor wedged any card it touched.
    const CardCls = customElements.get('diorama-card');
    ok('j: validateCardConfig preserves type',
       validateCardConfig({ type: 'custom:diorama-card', view: '3d' }).type === 'custom:diorama-card', '');
    ok('j: validateCardConfig without type stays typeless (card path unaffected)',
       validateCardConfig({ view: '2d' }).type === undefined, '');
    ok('j: getStubConfig carries type',
       CardCls.getStubConfig().type === 'custom:diorama-card', '');
    const editor = await CardCls.getConfigElement();
    // A config stored BEFORE the fix lacks type — the editor must still emit it.
    editor.setConfig({ view: '2d', mode: 'kiosk' });
    let emitted = null;
    editor.addEventListener('config-changed', e => { emitted = e.detail.config; });
    editor._emit({ mode: 'view' });
    ok('j: editor emit injects type on a legacy typeless config',
       !!emitted && emitted.type === 'custom:diorama-card', JSON.stringify(emitted));
    ok('j: editor emit applies the patch alongside type',
       !!emitted && emitted.mode === 'view' && emitted.view === '2d', '');
    // And a modern config's own type value is carried through untouched.
    editor.setConfig({ type: 'custom:diorama-card', view: '3d' });
    emitted = null;
    editor._emit({ compact: true });
    ok('j: editor emit round-trips an existing type',
       !!emitted && emitted.type === 'custom:diorama-card' && emitted.view === '3d' && emitted.compact === true, '');

    // ── (k) shared layer defs ─────────────────────────────────────────────────
    // LAYER_DEFS is the ONE key→label list (sidebar + card editor); SIMPLE_LAYERS
    // is the ONE "Simple floorplan" literal (sidebar, ?layers=simple, card).
    ok('k: LAYER_DEFS is a non-empty {key,label} list',
       Array.isArray(LAYER_DEFS) && LAYER_DEFS.length > 20 &&
       LAYER_DEFS.every(d => typeof d.key === 'string' && typeof d.label === 'string'),
       `n=${LAYER_DEFS.length}`);
    ok('k: LAYER_DEFS keys are unique',
       new Set(LAYER_DEFS.map(d => d.key)).size === LAYER_DEFS.length, '');
    ok('k: LAYER_DEFS includes the new bgText layer',
       LAYER_DEFS.some(d => d.key === 'bgText' && d.label === 'Background text'), '');
    ok('k: SIMPLE_LAYERS turns background text OFF',
       SIMPLE_LAYERS.bgText === false, JSON.stringify(SIMPLE_LAYERS.bgText));
    ok('k: SIMPLE_LAYERS keeps avatars + activity ON',
       SIMPLE_LAYERS.targets === true && SIMPLE_LAYERS.activity === true, '');

    // ── (l) validateCardConfig: scene block ───────────────────────────────────
    const fullScene = {
      glassHouse: true, wallCutaway: false, autoFollow: true, cinematicOrbit: false,
      simsCam: true, plumbobs: false, skyBackdrop: true, fovV: 60, fovH: 90,
    };
    const vFull = validateCardConfig({ type: 'custom:diorama-card', view: '3d', scene: fullScene });
    ok('l: full valid scene object round-trips',
       !!vFull.scene && vFull.scene.glassHouse === true && vFull.scene.wallCutaway === false &&
       vFull.scene.simsCam === true && vFull.scene.fovV === 60 && vFull.scene.fovH === 90,
       JSON.stringify(vFull.scene));
    ok('l: scene round-trip keeps type', vFull.type === 'custom:diorama-card', '');
    const throwsCfg = (raw) => { try { validateCardConfig(raw); return false; } catch { return true; } };
    ok('l: scene.fovV 200 throws (out of 10–120)', throwsCfg({ scene: { fovV: 200 } }), '');
    ok('l: scene.fovV 5 throws (below 10)', throwsCfg({ scene: { fovV: 5 } }), '');
    ok('l: scene.fovH 200 throws (out of 10–150)', throwsCfg({ scene: { fovH: 200 } }), '');
    ok('l: scene.fovH 150 accepted (inclusive upper bound)',
       validateCardConfig({ scene: { fovH: 150 } }).scene.fovH === 150, '');
    ok('l: scene.fovV non-number throws', throwsCfg({ scene: { fovV: '60' } }), '');
    ok('l: scene.glassHouse non-boolean throws', throwsCfg({ scene: { glassHouse: 'yes' } }), '');
    ok('l: scene.plumbobs non-boolean throws', throwsCfg({ scene: { plumbobs: 1 } }), '');
    ok('l: scene non-object throws', throwsCfg({ scene: 'glass' }), '');
    const vUnknown = validateCardConfig({ scene: { glassHouse: true, somethingNew: 'x' } });
    ok('l: unknown scene key tolerated (ignored, rest kept)',
       !!vUnknown.scene && vUnknown.scene.glassHouse === true && vUnknown.scene.somethingNew === undefined,
       JSON.stringify(vUnknown.scene));
    ok('l: an all-unknown scene block drops entirely',
       validateCardConfig({ scene: { nope: 1 } }).scene === undefined, '');
    ok('l: CARD_SCENE_BOOLS covers the 7 boolean knobs',
       CARD_SCENE_BOOLS.length === 7 && CARD_SCENE_BOOLS.includes('simsCam') &&
       CARD_SCENE_BOOLS.includes('wallCutaway') && CARD_SCENE_BOOLS.includes('skyBackdrop'),
       CARD_SCENE_BOOLS.join(','));

    // ── (m) validateCardConfig: layers as an object ───────────────────────────
    const vLayObj = validateCardConfig({ type: 'custom:diorama-card', layers: { lights: false, targets: true } });
    ok('m: layers object round-trips',
       vLayObj.layers && vLayObj.layers.lights === false && vLayObj.layers.targets === true,
       JSON.stringify(vLayObj.layers));
    ok('m: layers object is COPIED (not the caller\'s reference)', (() => {
       const src = { lights: false }; const out = validateCardConfig({ layers: src });
       return out.layers !== src; })(), '');
    ok('m: layers string still accepted', validateCardConfig({ layers: 'simple' }).layers === 'simple', '');
    ok('m: layers with a non-boolean value throws', throwsCfg({ layers: { lights: 'off' } }), '');
    ok('m: layers as an array throws', throwsCfg({ layers: ['lights'] }), '');
    ok('m: layers as a number throws', throwsCfg({ layers: 3 }), '');

    // ── (n) applyCardConfig: a layers OBJECT lands immediately ────────────────
    const cardL = mkCard();
    cardL.setConfig({ view: '2d', mode: 'kiosk', layers: { lights: false, targets: true, bgText: false } });
    cardL.hass = makeHass(SEED);
    const plL = cardL._planner;
    ok('n: layers object applied synchronously (no retry needed)',
       plL.store.layers2d && plL.store.layers2d.lights === false &&
       plL.store.layers2d.targets === true && plL.store.layers2d.bgText === false,
       JSON.stringify(plL.store.layers2d));
    ok('n: layers object is copied onto the store, not aliased',
       plL.store.layers2d !== cardL._config.layers, '');
    // The string path still resolves through the URL template.
    cardL.setConfig({ view: '2d', mode: 'kiosk', layers: 'simple' });
    await waitFor(() => plL.store.layers2d && plL.store.layers2d.bgText === false &&
                        plL.store.layers2d.furniture === false, 400);
    ok('n: layers:"simple" applies the shared SIMPLE_LAYERS literal',
       plL.store.layers2d.furniture === false && plL.store.layers2d.bgText === false &&
       plL.store.layers2d.targets === true, JSON.stringify(plL.store.layers2d));
    ok('n: layers:"simple" does NOT set the urlTemplate to an object',
       typeof plL.urlTemplate.layers === 'string', String(plL.urlTemplate.layers));

    // ── (o) the card passes scene overrides down to <diorama-three-view> ──────
    const cardS = mkCard();
    cardS.setConfig({ view: '3d', mode: 'kiosk',
                      scene: { glassHouse: true, plumbobs: false, simsCam: true, fovV: 70 } });
    cardS.hass = makeHass(SEED);
    await cardS.updateComplete;
    await waitFor(() => !!cardS.querySelector('diorama-three-view'), 400);
    const tv = cardS.querySelector('diorama-three-view');
    ok('o: three-view receives scene3dOverride.glassHouse',
       !!tv && !!tv.scene3dOverride && tv.scene3dOverride.glassHouse === true,
       JSON.stringify(tv?.scene3dOverride));
    ok('o: override carries plumbobs:false + fovV (Scene3D field names)',
       !!tv.scene3dOverride && tv.scene3dOverride.plumbobs === false && tv.scene3dOverride.fovV === 70, '');
    ok('o: simsCam rides its OWN prop, not scene3dOverride',
       tv.simsCamOverride === true && tv.scene3dOverride.simsCam === undefined, '');
    ok('o: _sc3() merges the override OVER store.scene3d (override wins)', (() => {
       const p2 = tv.planner; const prev = p2.store.scene3d;
       p2.store.scene3d = { preset: 'day', glassHouse: false, floorColor: '#123456' };
       const m = tv._sc3();
       p2.store.scene3d = prev;
       return m.glassHouse === true && m.floorColor === '#123456' && m.preset === 'day';
     })(), '');
    ok('o: _sc3() with NO override returns the store object untouched', (() => {
       const p2 = tv.planner; const prev = p2.store.scene3d; const prevOv = tv.scene3dOverride;
       const sc = { preset: 'night' }; p2.store.scene3d = sc; tv.scene3dOverride = null;
       const m = tv._sc3();
       p2.store.scene3d = prev; tv.scene3dOverride = prevOv;
       return m === sc; })(), '');
    // A 3D card with no scene block leaves both props null (panel path unchanged).
    const tvPlain = card3d.querySelector('diorama-three-view');
    ok('o: no scene block → scene3dOverride null + simsCamOverride null',
       !!tvPlain && tvPlain.scene3dOverride === null && tvPlain.simsCamOverride === null,
       `${tvPlain?.scene3dOverride} / ${tvPlain?.simsCamOverride}`);

    // ── (p) editor: layers preset dropdown + custom multi-select grid ─────────
    // Deterministic seed for the "Custom…" grid: clear the shared store's layers
    // so the default-on / default-off resolution is what the grid starts from.
    peekSharedPlanner().store.layers2d = undefined;
    const ed2 = await CardCls.getConfigElement();
    ed2.hass = makeHass(SEED);
    stage.appendChild(ed2);   // Lit only starts updating once CONNECTED (updateComplete would hang otherwise)
    ed2.setConfig({ type: 'custom:diorama-card', view: '2d' });
    await ed2.updateComplete;
    let emit2 = null;
    ed2.addEventListener('config-changed', e => { emit2 = e.detail.config; });
    const layerSel = [...ed2.querySelectorAll('select')].find(
      s => [...s.options].some(o => o.value === '__custom'));
    ok('p: editor renders a layers preset dropdown with Custom…', !!layerSel, '');
    ok('p: dropdown lists (unchanged) / full / simple / Custom…',
       !!layerSel && ['', 'full', 'simple', '__custom'].every(v =>
         [...layerSel.options].some(o => o.value === v)),
       layerSel ? [...layerSel.options].map(o => o.value).join(',') : '');
    layerSel.value = 'simple'; layerSel.dispatchEvent(new Event('change'));
    ok('p: picking a preset emits layers as a STRING',
       !!emit2 && emit2.layers === 'simple' && emit2.type === 'custom:diorama-card', JSON.stringify(emit2));
    emit2 = null;
    layerSel.value = ''; layerSel.dispatchEvent(new Event('change'));
    ok('p: picking (unchanged) drops the layers key',
       !!emit2 && emit2.layers === undefined, JSON.stringify(emit2));
    emit2 = null;
    layerSel.value = '__custom'; layerSel.dispatchEvent(new Event('change'));
    ok('p: picking Custom… emits an EXPLICIT object with every layer key',
       !!emit2 && typeof emit2.layers === 'object' &&
       LAYER_DEFS.every(d => typeof emit2.layers[d.key] === 'boolean'),
       emit2 ? Object.keys(emit2.layers).length + ' keys' : '');
    ok('p: Custom… emission keeps type', !!emit2 && emit2.type === 'custom:diorama-card', '');
    ok('p: Custom… seeds default-OFF layers as false',
       !!emit2 && emit2.layers.activity === false && emit2.layers.heatmap === false &&
       emit2.layers.vacuumMap === false && emit2.layers.lights === true, '');
    await ed2.updateComplete;
    const gridBoxes = [...ed2.querySelectorAll('div[style*="grid-template-columns"] input[type=checkbox]')];
    ok('p: custom grid renders exactly one checkbox per layer def',
       gridBoxes.length === LAYER_DEFS.length, `${gridBoxes.length} boxes / ${LAYER_DEFS.length} defs`);
    // Toggle the bgText box off and confirm the whole explicit object re-emits.
    const bgIdx = LAYER_DEFS.findIndex(d => d.key === 'bgText');
    emit2 = null;
    gridBoxes[bgIdx].checked = false;
    gridBoxes[bgIdx].dispatchEvent(new Event('change'));
    ok('p: unchecking a grid box re-emits the full explicit object',
       !!emit2 && emit2.layers.bgText === false &&
       Object.keys(emit2.layers).length === LAYER_DEFS.length, JSON.stringify(emit2?.layers?.bgText));
    ok('p: grid toggle still keeps type', !!emit2 && emit2.type === 'custom:diorama-card', '');

    // ── (q) editor: Scene (3D) tri-state selects + FOV inputs ─────────────────
    const ed3 = await CardCls.getConfigElement();
    ed3.hass = makeHass(SEED);
    stage.appendChild(ed3);   // Lit only starts updating once CONNECTED (updateComplete would hang otherwise)
    ed3.setConfig({ type: 'custom:diorama-card', view: '3d' });
    await ed3.updateComplete;
    let emit3 = null;
    ed3.addEventListener('config-changed', e => { emit3 = e.detail.config; });
    const selects = [...ed3.querySelectorAll('select')];
    const triSels = selects.filter(s => {
      const vals = [...s.options].map(o => o.value).join(',');
      return vals === ',on,off';
    });
    ok('q: 3D editor renders one (inherit)/On/Off select per scene bool',
       triSels.length === CARD_SCENE_BOOLS.length, `${triSels.length} vs ${CARD_SCENE_BOOLS.length}`);
    triSels[0].value = 'on'; triSels[0].dispatchEvent(new Event('change'));
    ok('q: picking On emits scene.glassHouse true',
       !!emit3 && !!emit3.scene && emit3.scene.glassHouse === true, JSON.stringify(emit3?.scene));
    await ed3.updateComplete;
    const triSels2 = [...ed3.querySelectorAll('select')].filter(
      s => [...s.options].map(o => o.value).join(',') === ',on,off');
    triSels2[1].value = 'off'; triSels2[1].dispatchEvent(new Event('change'));
    ok('q: picking Off emits scene.wallCutaway false alongside the first key',
       !!emit3 && emit3.scene.glassHouse === true && emit3.scene.wallCutaway === false,
       JSON.stringify(emit3.scene));
    await ed3.updateComplete;
    const triSels3 = [...ed3.querySelectorAll('select')].filter(
      s => [...s.options].map(o => o.value).join(',') === ',on,off');
    triSels3[0].value = ''; triSels3[0].dispatchEvent(new Event('change'));
    ok('q: picking (inherit) DELETES the nested key',
       !!emit3 && emit3.scene.glassHouse === undefined &&
       !('glassHouse' in emit3.scene) && emit3.scene.wallCutaway === false,
       JSON.stringify(emit3.scene));
    await ed3.updateComplete;
    const triSels4 = [...ed3.querySelectorAll('select')].filter(
      s => [...s.options].map(o => o.value).join(',') === ',on,off');
    triSels4[1].value = ''; triSels4[1].dispatchEvent(new Event('change'));
    ok('q: clearing the LAST scene key drops the scene block entirely',
       !!emit3 && emit3.scene === undefined && !('scene' in emit3), JSON.stringify(emit3));
    ok('q: scene cleanup never drops type', !!emit3 && emit3.type === 'custom:diorama-card', '');
    // FOV number inputs
    await ed3.updateComplete;
    const nums = [...ed3.querySelectorAll('input[type=number]')];
    ok('q: two FOV number inputs render', nums.length === 2, String(nums.length));
    nums[0].value = '70'; nums[0].dispatchEvent(new Event('change'));
    ok('q: fovV input emits a number', !!emit3 && emit3.scene && emit3.scene.fovV === 70,
       JSON.stringify(emit3?.scene));
    await ed3.updateComplete;
    const nums2 = [...ed3.querySelectorAll('input[type=number]')];
    nums2[0].value = ''; nums2[0].dispatchEvent(new Event('change'));
    ok('q: blanking fovV inherits again (key removed, block dropped)',
       !!emit3 && emit3.scene === undefined, JSON.stringify(emit3));
    // Emitted scene configs must survive the card's own validator.
    ok('q: an editor-emitted scene config validates',
       validateCardConfig({ type: 'custom:diorama-card', view: '3d',
                            scene: { glassHouse: true, fovV: 70 } }).scene.fovV === 70, '');

  } catch (err) {
    ok('harness threw', false, (err && err.stack) ? err.stack.split('\n').slice(0, 4).join(' | ') : String(err));
  }

  // ── Report ──────────────────────────────────────────────────────────────────
  const pass = results.filter(r => r.pass).length;
  const total = results.length;
  const fails = results.filter(r => !r.pass).map(r => r.name + (r.extra ? ` {${r.extra}}` : ''));
  document.getElementById('rows').innerHTML = results.map(r =>
    `<div class="row"><span class="name">${r.name}</span>` +
    `<span class="${r.pass ? 'pass' : 'fail'}">${r.pass ? 'PASS' : 'FAIL'}${r.extra ? ` <span class="extra">${r.extra}</span>` : ''}</span></div>`
  ).join('');
  const sum = document.getElementById('summary');
  sum.textContent = `CARD ${pass === total ? 'PASS' : 'FAIL'} ${pass}/${total}`;
  sum.className = pass === total ? 'okbg' : 'badbg';
  window.__RESULT__ = { pass, total, results };
  document.title = `CARD ${pass === total ? 'PASS' : 'FAIL'} ${pass}/${total}` +
    (fails.length ? ` | FAILS: ${fails.join('; ')}` : '');
</script>
