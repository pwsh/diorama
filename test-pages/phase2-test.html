<!doctype html>
<meta charset="utf-8">
<title>phase2 test</title>
<style>html,body{margin:0;background:#111}#c{width:1280px;height:880px}</style>
<div id="c"></div>
<script type="module">
  const mod = await import('./assets/three-renderer.js');
  const r = new mod.ThreeDRenderer(document.getElementById('c'));
  await r.load();
  const fu = (kind, x, y, w, h, rot = 0, extra = {}) => ({ id: kind + x, x, y, w, h, kind, rotation: rot, ...extra });
  const customObjects = [{
    id: 'rec1', label: 'Arcade cabinet', w: 700, h: 700, ht: 1700, color: 0x7e57c2, cat: 'furniture',
    primitives: [
      { shape: 'box', size: [700, 1400, 650], pos: [0, 700, 0], color: '#5e35b1' },
      { shape: 'box', size: [640, 300, 80], pos: [0, 1550, -260], rot: [-20, 0, 0], color: '#26c6da' },
      { shape: 'cylinder', size: [40, 40, 120], pos: [-150, 1180, -320], color: '#ef5350' },
      { shape: 'sphere', size: [55, 0, 0], pos: [150, 1220, -320], color: '#ffee58' },
    ],
  }];
  const floor = {
    id: 'f1', name: 'T', w: 8000, d: 5000,
    walls: [],
    furniture: [
      fu('counter', 1500, 2500, 1800, 650, 180),
      fu('coffee_maker', 1100, 2450, 250, 250, 180, { elevation: 920 }),
      fu('toaster', 1900, 2450, 300, 200, 180, { elevation: 920 }),
      fu('exercise_equipment', 4200, 2500, 700, 1600, 90),
      fu('block', 6400, 2500, 700, 700, 0, { customKindId: 'rec1' }),
    ],
    lights: [], switches: [], sensors: [], motionSensors: [], envSensors: [],
    doors: [], windows: [], bg: null, model3d: null,
  };
  r.updateFloor(floor, { preset: 'day', floorColor: '#b9a88c', floorTex: 'none', wallColor: '#cfd2d6' }, undefined, customObjects);
  r.setCameraView([-2600, 2200, -4400], [-300, 700, 100]);
  document.title = 'ok';
</script>
