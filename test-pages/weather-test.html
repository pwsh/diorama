<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>WEATHER …</title>
  <style>
    body { margin:0; background:#0d1116; color:#cfd8dc; font:13px/1.4 sans-serif; padding:14px; }
    h1 { font-size:15px; margin:0 0 10px; }
    .grid { display:flex; flex-wrap:wrap; gap:10px; }
    .card { background:#141b22; border:1px solid #26323d; border-radius:6px; padding:8px 10px; width:300px; }
    .card h2 { font-size:12px; margin:0 0 6px; color:#90caf9; }
    .row { display:flex; justify-content:space-between; font-size:11px; gap:8px; }
    .pass { color:#69f0ae; } .fail { color:#ff5252; }
    #summary { font-size:14px; font-weight:bold; margin:10px 0; padding:8px 10px; border-radius:5px; }
    .okbg { background:#12331f; color:#69f0ae; } .badbg { background:#3a1414; color:#ff8a80; }
    code { color:#ffd54f; }
  </style>
</head>
<body>
  <h1>Weather core — WMO table · sensor heuristic · unit normalization</h1>
  <div id="summary">Running…</div>
  <div class="grid" id="grid"></div>

  <!-- weather.ts imports time-of-day.ts (type-only imports of types.ts are
       erased), so bundle it into a standalone module before serving:
         npx esbuild src/weather.ts --bundle --format=esm \
           --outfile=<harness>/weather.mod.js
       (matches the trilateration.html build-then-copy flow; no live HA). -->
  <script type="module">
    import {
      wmoToCondition, deriveFromSensors, resolveWeatherEntity,
      toCelsius, toKmh, toMmPerH, toKm, parseWindBearing,
      weatherEffectEnabled, visibilityToFogDensity, forecastRainSoon,
      chipAnchorStyle, resolveChipContent, parseOpenMeteoForecast, windText,
      parseWeatherAlerts, alertSeverityRank, worstAlertSeverity,
      uvBand, parseOpenMeteoCurrent,
    } from './weather.mod.js';

    const tests = [];
    const eq = (name, got, want) =>
      tests.push({ name, ok: got === want, detail: `got ${JSON.stringify(got)} want ${JSON.stringify(want)}` });
    const deepEq = (name, got, want) =>
      tests.push({ name, ok: JSON.stringify(got) === JSON.stringify(want),
                   detail: `got ${JSON.stringify(got)} want ${JSON.stringify(want)}` });
    const near = (name, got, want, tol = 1e-6) =>
      tests.push({ name, ok: Math.abs(got - want) <= tol, detail: `got ${got} ≈ ${want}` });

    // ── WMO → HA condition table (HA core open_meteo/const.py) ──────────────
    eq('wmo 0 day → sunny',            wmoToCondition(0, true),  'sunny');
    eq('wmo 0 night → clear-night',    wmoToCondition(0, false), 'clear-night');
    eq('wmo 1 day → sunny',            wmoToCondition(1, true),  'sunny');
    eq('wmo 2 → partlycloudy',         wmoToCondition(2, true),  'partlycloudy');
    eq('wmo 3 → cloudy',               wmoToCondition(3, true),  'cloudy');
    eq('wmo 45 → fog',                 wmoToCondition(45, true), 'fog');
    eq('wmo 48 → fog',                 wmoToCondition(48, true), 'fog');
    eq('wmo 51 → rainy',               wmoToCondition(51, true), 'rainy');
    eq('wmo 55 → rainy',               wmoToCondition(55, true), 'rainy');
    eq('wmo 61 → rainy',               wmoToCondition(61, true), 'rainy');
    eq('wmo 65 → pouring',             wmoToCondition(65, true), 'pouring');
    eq('wmo 66 → rainy',               wmoToCondition(66, true), 'rainy');
    eq('wmo 67 → pouring',             wmoToCondition(67, true), 'pouring');
    eq('wmo 71 → snowy',               wmoToCondition(71, true), 'snowy');
    eq('wmo 77 → snowy',               wmoToCondition(77, true), 'snowy');
    eq('wmo 80 → rainy',               wmoToCondition(80, true), 'rainy');
    eq('wmo 82 → pouring',             wmoToCondition(82, true), 'pouring');
    eq('wmo 85 → snowy',               wmoToCondition(85, true), 'snowy');
    eq('wmo 95 → lightning',           wmoToCondition(95, true), 'lightning');
    eq('wmo 96 → lightning-rainy',     wmoToCondition(96, true), 'lightning-rainy');
    eq('wmo 99 → lightning-rainy',     wmoToCondition(99, true), 'lightning-rainy');
    eq('wmo unmapped 7 night → clear', wmoToCondition(7, false), 'clear-night');

    // ── Sensor heuristic (DESIGN-world Feature W) ──────────────────────────
    eq('drizzle 0.5mm → rainy',        deriveFromSensors({ precipMmH: 0.5, tempC: 12, isDay: true }).condition, 'rainy');
    eq('heavy 8mm → pouring',          deriveFromSensors({ precipMmH: 8, tempC: 12, isDay: true }).condition, 'pouring');
    eq('cold precip → snowy',          deriveFromSensors({ precipMmH: 2, tempC: 0, isDay: true }).condition, 'snowy');
    eq('cold heavy precip → snowy',    deriveFromSensors({ precipMmH: 9, tempC: -3, isDay: false }).condition, 'snowy');
    eq('high wind dry → windy',        deriveFromSensors({ precipMmH: 0, windKmh: 45, isDay: true }).condition, 'windy');
    eq('lightning dry → lightning',    deriveFromSensors({ lightning: true, isDay: true }).condition, 'lightning');
    eq('lightning + rain → l-rainy',   deriveFromSensors({ lightning: true, precipMmH: 3, isDay: true }).condition, 'lightning-rainy');
    eq('calm day → sunny',             deriveFromSensors({ precipMmH: 0, windKmh: 5, tempC: 20, isDay: true }).condition, 'sunny');
    eq('calm night → clear-night',     deriveFromSensors({ precipMmH: 0, windKmh: 5, isDay: false }).condition, 'clear-night');
    eq('below wind threshold → clear', deriveFromSensors({ windKmh: 30, isDay: true }).condition, 'sunny');
    eq('no data → stale',              deriveFromSensors({ isDay: true }).stale, true);
    eq('has data → not stale',         deriveFromSensors({ tempC: 20, isDay: true }).stale, false);

    // ── Unit normalization ─────────────────────────────────────────────────
    near('32°F → 0°C',        toCelsius(32, '°F'), 0);
    near('212°F → 100°C',     toCelsius(212, 'fahrenheit'), 100);
    near('300K → 26.85°C',    toCelsius(300, 'K'), 26.85, 1e-2);
    near('°C passthrough',    toCelsius(18, '°C'), 18);
    near('10 m/s → 36 km/h',  toKmh(10, 'm/s'), 36);
    near('10 mph → 16.09',    toKmh(10, 'mph'), 16.09344, 1e-3);
    near('10 kn → 18.52',     toKmh(10, 'kn'), 18.52, 1e-2);
    near('km/h passthrough',  toKmh(25, 'km/h'), 25);
    near('0.5 in/h → 12.7mm', toMmPerH(0.5, 'in/h'), 12.7);
    near('mm/h passthrough',  toMmPerH(3, 'mm/h'), 3);

    // ── Entity source: sunny↔clear-night re-gated by sun ───────────────────
    eq('entity sunny @night → clear-night',
       resolveWeatherEntity('sunny', { temperature: 20, temperature_unit: '°C' },
         { 'sun.sun': { state: 'below_horizon', attributes: {} } }).condition, 'clear-night');
    eq('entity clear-night @day → sunny',
       resolveWeatherEntity('clear-night', {},
         { 'sun.sun': { state: 'above_horizon', attributes: {} } }).condition, 'sunny');
    eq('entity rainy passthrough',
       resolveWeatherEntity('rainy', {}, {}).condition, 'rainy');
    near('entity temp 50°F → 10°C',
       resolveWeatherEntity('cloudy', { temperature: 50, temperature_unit: '°F' }, {}).tempC, 10);
    eq('entity unavailable → stale',
       resolveWeatherEntity('unavailable', {}, {}).stale, true);

    // ── Forecast extraction (WeatherNow.forecastCondition) ─────────────────
    eq('entity forecast attr accepted',
       resolveWeatherEntity('sunny',
         { forecast: [{ condition: 'rainy' }] }, {}).forecastCondition, 'rainy');
    eq('entity forecast bogus rejected',
       resolveWeatherEntity('sunny',
         { forecast: [{ condition: 'drizzly-ish' }] }, {}).forecastCondition, undefined);
    eq('entity no forecast → undefined',
       resolveWeatherEntity('cloudy', {}, {}).forecastCondition, undefined);
    // wmo daily→forecast mapping is the same table used for tomorrow's code
    // (forecast is day-framed, so clear maps to sunny not clear-night).
    eq('wmo daily 65 → pouring forecast', wmoToCondition(65, true), 'pouring');

    // ── W3: per-effect toggle defaults + override ──────────────────────────
    eq('effect precip default on',        weatherEffectEnabled(undefined, 'precip'), true);
    eq('effect fog default on',           weatherEffectEnabled(undefined, 'fog'), true);
    eq('effect lightning default on',     weatherEffectEnabled(undefined, 'lightning'), true);
    eq('effect wind default on',          weatherEffectEnabled(undefined, 'wind'), true);
    eq('effect clouds default on',        weatherEffectEnabled(undefined, 'clouds'), true);
    eq('effect sunPosition default on',   weatherEffectEnabled(undefined, 'sunPosition'), true);
    eq('effect puddles default on',       weatherEffectEnabled(undefined, 'puddles'), true);
    eq('effect frost default OFF',        weatherEffectEnabled(undefined, 'frost'), false);
    eq('effect precipForecast default OFF', weatherEffectEnabled(undefined, 'precipForecast'), false);
    eq('effect override off',   weatherEffectEnabled({ source:'openmeteo', effects:{ precip:false } }, 'precip'), false);
    eq('effect override on',    weatherEffectEnabled({ source:'openmeteo', effects:{ frost:true } }, 'frost'), true);
    eq('effect absent key → default', weatherEffectEnabled({ source:'openmeteo', effects:{ fog:false } }, 'precip'), true);

    // ── W3: visibility → fog density ───────────────────────────────────────
    near('vis 10km → 4.2e-5',  visibilityToFogDensity(10), 0.000042, 1e-9);
    near('vis 1km → 4.2e-4',   visibilityToFogDensity(1), 0.00042, 1e-9);
    eq('vis 0km clamps to max', visibilityToFogDensity(0), 0.0009);
    eq('vis 0.05km clamps max', visibilityToFogDensity(0.05), 0.0009);
    eq('vis huge → ~0 floor',   visibilityToFogDensity(1e6) < 1e-6, true);

    // ── W3: visibility unit normalization (toKm) + wind_bearing cardinals ──
    near('5 mi → 8.05 km',    toKm(5, 'mi'), 8.04672, 1e-3);
    near('1000 m → 1 km',     toKm(1000, 'm'), 1);
    near('km passthrough',    toKm(5, 'km'), 5);
    eq('bearing 90 num',      parseWindBearing(90), 90);
    eq('bearing NW → 315',    parseWindBearing('NW'), 315);
    eq('bearing e → 90',      parseWindBearing('e'), 90);
    eq('bearing bogus → null', parseWindBearing('zzz'), null);
    eq('bearing missing → null', parseWindBearing(undefined), null);

    // ── W3: extended entity attributes (unit-normalized) ───────────────────
    const ext = resolveWeatherEntity('cloudy', {
      cloud_coverage: 80, visibility: 5, visibility_unit: 'mi',
      wind_gust_speed: 20, wind_speed_unit: 'mph',
      apparent_temperature: 23, temperature_unit: '°F',
      humidity: 66, wind_bearing: 'NW',
    }, {});
    eq('ext cloud_coverage',   ext.cloudCoverage, 80);
    near('ext visibility mi→km', ext.visibilityKm, 8.04672, 1e-3);
    near('ext gust mph→kmh',   ext.windGustKmh, 32.18688, 1e-3);
    near('ext apparent °F→°C', ext.apparentC, -5, 1e-6);
    eq('ext humidity',         ext.humidity, 66);
    eq('ext wind_bearing cardinal', ext.windBearing, 315);
    eq('ext absent → null',    resolveWeatherEntity('sunny', {}, {}).cloudCoverage, null);

    // ── W3: rainSoon from an hourly forecast ───────────────────────────────
    const nowMs = Date.parse('2026-07-12T12:00:00Z');
    const iso = (h) => new Date(nowMs + h * 3600000).toISOString();
    eq('rainSoon prob≥60 within 3h',
       forecastRainSoon([{ datetime: iso(1), precipitation_probability: 70 }], nowMs), true);
    eq('rainSoon rainy condition within 3h',
       forecastRainSoon([{ datetime: iso(2), condition: 'rainy', precipitation_probability: 10 }], nowMs), true);
    eq('rainSoon dry → false',
       forecastRainSoon([{ datetime: iso(1), condition: 'sunny', precipitation_probability: 10 }], nowMs), false);
    eq('rainSoon beyond 3h → false',
       forecastRainSoon([{ datetime: iso(8), precipitation_probability: 90 }], nowMs), false);
    eq('rainSoon empty → false', forecastRainSoon([], nowMs), false);

    // ── DC-C: chip anchor style computation ────────────────────────────────
    eq('anchor br default',        chipAnchorStyle('br', undefined),        'bottom:8px;right:8px');
    eq('anchor undefined → br',    chipAnchorStyle(undefined, undefined),   'bottom:8px;right:8px');
    eq('anchor bl',                chipAnchorStyle('bl', undefined),        'bottom:8px;left:8px');
    eq('anchor tl clears bar',     chipAnchorStyle('tl', undefined, 44),    'top:44px;left:8px');
    eq('anchor tr clears bar',     chipAnchorStyle('tr', undefined, 44),    'top:44px;right:8px');
    eq('anchor tm centered',       chipAnchorStyle('tm', undefined, 44),    'top:44px;left:50%;transform:translateX(-50%)');
    eq('anchor bm centered',       chipAnchorStyle('bm', undefined),        'bottom:8px;left:50%;transform:translateX(-50%)');
    eq('anchor default barOffset', chipAnchorStyle('tl', undefined),        'top:44px;left:8px');
    eq('custom wins over br',      chipAnchorStyle('br', { x: 20, y: 30 }),        'bottom:30px;right:20px');
    eq('custom wins over tl',      chipAnchorStyle('tl', { x: 12, y: 60 }, 44),    'top:60px;left:12px');
    eq('custom drops centering',   chipAnchorStyle('bm', { x: 5, y: 5 }),          'bottom:5px;left:5px');

    // ── DC-C: chipContent defaults resolution (uv flag folded in) ───────────
    deepEq('content undefined defaults', resolveChipContent(undefined),
           { apparent: false, humidity: false, wind: false, uv: false, hourly: 0, daily: 0 });
    deepEq('content flags on', resolveChipContent({ apparent: true, humidity: true, wind: true }),
           { apparent: true, humidity: true, wind: true, uv: false, hourly: 0, daily: 0 });
    deepEq('content uv flag on', resolveChipContent({ uv: true }),
           { apparent: false, humidity: false, wind: false, uv: true, hourly: 0, daily: 0 });
    deepEq('content counts clamped high', resolveChipContent({ hourly: 20, daily: 12 }),
           { apparent: false, humidity: false, wind: false, uv: false, hourly: 12, daily: 7 });
    deepEq('content counts clamped low', resolveChipContent({ hourly: -3, daily: -1 }),
           { apparent: false, humidity: false, wind: false, uv: false, hourly: 0, daily: 0 });
    deepEq('content counts floored', resolveChipContent({ hourly: 5.9, daily: 3.2 }),
           { apparent: false, humidity: false, wind: false, uv: false, hourly: 5, daily: 3 });

    // ── UV index: WHO band matrix + Open-Meteo/entity uv parse ──────────────
    const uvL = (v) => uvBand(v).label;
    eq('uv 0 → low',        uvL(0),  'low');
    eq('uv 2 → low',        uvL(2),  'low');
    eq('uv 3 → moderate',   uvL(3),  'moderate');
    eq('uv 5 → moderate',   uvL(5),  'moderate');
    eq('uv 6 → high',       uvL(6),  'high');
    eq('uv 7 → high',       uvL(7),  'high');
    eq('uv 8 → very high',  uvL(8),  'very high');
    eq('uv 10 → very high', uvL(10), 'very high');
    eq('uv 11 → extreme',   uvL(11), 'extreme');
    eq('uv 15 → extreme',   uvL(15), 'extreme');
    eq('uv band has color', /^#[0-9a-f]{6}$/i.test(uvBand(7).color), true);
    // Open-Meteo `current` parse populates uvIndex (unitless float).
    near('openmeteo uv parse', parseOpenMeteoCurrent({
      temperature_2m: 20, weather_code: 0, wind_speed_10m: 10, wind_direction_10m: 180,
      is_day: 1, uv_index: 8.6, cloud_cover: 40 }).uvIndex, 8.6, 1e-6);
    eq('openmeteo uv absent → null',
       parseOpenMeteoCurrent({ is_day: 1, weather_code: 0 }).uvIndex, null);
    eq('openmeteo sunny day', parseOpenMeteoCurrent({ weather_code: 0, is_day: 1 }).condition, 'sunny');
    // Entity source reads attributes.uv_index (Met.no & similar; null elsewhere).
    eq('entity uv_index parse', resolveWeatherEntity('sunny', { uv_index: 7 }, {}).uvIndex, 7);
    eq('entity uv absent → null', resolveWeatherEntity('sunny', {}, {}).uvIndex, null);

    // ── DC-C: wind text ────────────────────────────────────────────────────
    eq('windText metric', windText(12.4, false), '12 km/h');
    eq('windText imperial', windText(16.09344, true), '10 mph');

    // ── DC-C: Open-Meteo forecast parse (fixture JSON → normalized arrays) ──
    const omFixture = {
      hourly: {
        time: ['2026-07-12T12:00', '2026-07-12T13:00', '2026-07-12T14:00'],
        temperature_2m: [21.4, 22.1, 20.8],
        precipitation_probability: [10, 55, 80],
        weather_code: [0, 3, 61],
        is_day: [1, 1, 0],
      },
      daily: {
        time: ['2026-07-12', '2026-07-13'],
        weather_code: [0, 95],
        temperature_2m_max: [28.2, 30.9],
        temperature_2m_min: [15.1, 18.7],
        precipitation_probability_max: [20, 90],
      },
    };
    const om = parseOpenMeteoForecast(omFixture);
    eq('om hourly length', om.hourly.length, 3);
    eq('om hourly[0] condition day', om.hourly[0].condition, 'sunny');
    eq('om hourly[2] is_day=0 code61', om.hourly[2].condition, 'rainy');
    eq('om hourly[0] temp', om.hourly[0].temperature, 21.4);
    eq('om hourly[1] precip prob', om.hourly[1].precipitation_probability, 55);
    eq('om hourly no templow', om.hourly[0].templow, undefined);
    eq('om daily length', om.daily.length, 2);
    eq('om daily[1] condition (day-framed)', om.daily[1].condition, 'lightning');
    eq('om daily[0] high', om.daily[0].temperature, 28.2);
    eq('om daily[0] low', om.daily[0].templow, 15.1);
    eq('om daily[1] precip prob max', om.daily[1].precipitation_probability, 90);
    // Empty / missing blocks → empty arrays, never throws.
    deepEq('om empty json', parseOpenMeteoForecast({}), { hourly: [], daily: [] });
    eq('om partial hourly (no probs)',
       parseOpenMeteoForecast({ hourly: { time: ['x'], weather_code: [0] } }).hourly[0].precipitation_probability,
       undefined);

    // ── DC-D: weather ALERTS parse matrix ──────────────────────────────────
    const stEl = (state, attributes) => ({ state, attributes });

    // Severity ranking + worst-of.
    eq('rank advisory<watch',  alertSeverityRank('advisory') < alertSeverityRank('watch'), true);
    eq('rank watch<warning',   alertSeverityRank('watch') < alertSeverityRank('warning'), true);
    eq('worst of mixed',       worstAlertSeverity([{event:'a',severity:'advisory'},{event:'b',severity:'warning'},{event:'c',severity:'watch'}]), 'warning');
    eq('worst of empty → null', worstAlertSeverity([]), null);

    // Absent / unavailable / unknown → [].
    eq('null state → []',        parseWeatherAlerts(null).length, 0);
    eq('unavailable → []',       parseWeatherAlerts(stEl('unavailable', {})).length, 0);
    eq('unknown → []',           parseWeatherAlerts(stEl('unknown', {})).length, 0);
    eq('no attrs → []',          parseWeatherAlerts(stEl('0', {})).length, 0);

    // NWS Alerts custom integration: count state + `alerts` array (CAP-ish dicts).
    const nws = parseWeatherAlerts(stEl('2', { alerts: [
      { event: 'Tornado Warning', severity: 'Extreme', headline: 'Take cover now', expires: '2026-07-17T20:00:00Z' },
      { event: 'Flood Watch', severity: 'Severe', ends: '2026-07-18T02:00:00Z' },
    ] }));
    eq('nws count',              nws.length, 2);
    eq('nws warning event',      nws[0].event, 'Tornado Warning');
    eq('nws warning severity',   nws[0].severity, 'warning');
    eq('nws warning headline',   nws[0].headline, 'Take cover now');
    eq('nws warning expires',    nws[0].expires, '2026-07-17T20:00:00Z');
    eq('nws watch by event',     nws[1].severity, 'watch');   // "Watch" event word wins
    eq('nws watch expires(ends)', nws[1].expires, '2026-07-18T02:00:00Z');
    // NWS test/exercise alerts dropped (CAP status != Actual).
    eq('nws test alert dropped', parseWeatherAlerts(stEl('1', { alerts: [
      { event: 'Tornado Warning', severity: 'Extreme', status: 'Test' } ] })).length, 0);

    // NWS legacy pipe-joined attributes.
    const pipe = parseWeatherAlerts(stEl('2', {
      event: 'Heat Advisory | Severe Thunderstorm Warning',
      severity: 'Minor | Severe',
      expires: '2026-07-17T22:00:00Z | 2026-07-17T19:00:00Z',
    }));
    eq('pipe count',             pipe.length, 2);
    eq('pipe advisory',          pipe[0].severity, 'advisory');
    eq('pipe warning',           pipe[1].severity, 'warning');

    // MeteoAlarm binary_sensor: awareness_level / awareness_type pair (single alert).
    const ma3 = parseWeatherAlerts(stEl('on', {
      awareness_level: '3; orange; Severe', awareness_type: '3 Thunderstorm',
      event: 'Thunderstorm', headline: 'Storms this evening', expires: '2026-07-17T21:00:00Z',
    }));
    eq('meteoalarm one',         ma3.length, 1);
    eq('meteoalarm event',       ma3[0].event, 'Thunderstorm');
    eq('meteoalarm lvl3 → watch', ma3[0].severity, 'watch');
    eq('meteoalarm headline',    ma3[0].headline, 'Storms this evening');
    // awareness_level 4 (red) → warning; type strips the numeric code.
    const ma4 = parseWeatherAlerts(stEl('on', { awareness_level: '4; red; High', awareness_type: '5 Extreme High Temperature' }));
    eq('meteoalarm lvl4 → warning', ma4[0].severity, 'warning');
    eq('meteoalarm type stripped', ma4[0].event, 'Extreme High Temperature');
    // awareness_level 2 (yellow) → advisory.
    eq('meteoalarm lvl2 → advisory',
       parseWeatherAlerts(stEl('on', { awareness_level: '2; yellow; Moderate', awareness_type: '1 Wind' }))[0].severity, 'advisory');
    // Inactive binary_sensor → [].
    eq('meteoalarm off → []',    parseWeatherAlerts(stEl('off', { awareness_level: '', awareness_type: '' })).length, 0);

    // DWD: warning_count + indexed warning_N_* attributes (4-tier level).
    const dwd = parseWeatherAlerts(stEl('on', {
      warning_count: 2,
      warning_1_level: 3, warning_1_name: 'Gewitter', warning_1_headline: 'Severe storm', warning_1_end: '2026-07-17T18:00:00Z',
      warning_2_level: 1, warning_2_name: 'Wind',
    }));
    eq('dwd count',              dwd.length, 2);
    eq('dwd lvl3 → warning',     dwd[0].severity, 'warning');
    eq('dwd name event',         dwd[0].event, 'Gewitter');
    eq('dwd lvl3 end',           dwd[0].expires, '2026-07-17T18:00:00Z');
    eq('dwd lvl1 → advisory',    dwd[1].severity, 'advisory');
    eq('dwd count 0 → []',       parseWeatherAlerts(stEl('on', { warning_count: 0 })).length, 0);

    // Environment Canada: `alerts` array of title strings / title dicts.
    const ecStr = parseWeatherAlerts(stEl('1', { alerts: ['Rainfall Warning', 'Special Weather Statement'] }));
    eq('ec string count',        ecStr.length, 2);
    eq('ec string warning',      ecStr[0].severity, 'warning');   // "Warning" in title
    eq('ec string advisory',     ecStr[1].severity, 'advisory');  // "Statement" → advisory
    const ecDict = parseWeatherAlerts(stEl('1', { alerts: [
      { title: 'Snowfall Warning', alert_colour_level: 'red', expiry_time: '2026-07-18T06:00:00Z' } ] }));
    eq('ec dict event',          ecDict[0].event, 'Snowfall Warning');
    eq('ec dict warning',        ecDict[0].severity, 'warning');
    eq('ec dict expiry',         ecDict[0].expires, '2026-07-18T06:00:00Z');

    // Generic single-alert fallback (unlisted integration) + unknown severity.
    const gen = parseWeatherAlerts(stEl('on', { event: 'Dust Storm', severity: 'bananas' }));
    eq('generic event',          gen[0].event, 'Dust Storm');
    eq('generic unknown sev → advisory', gen[0].severity, 'advisory');
    // Garbage attrs (no recognizable keys) → [].
    eq('garbage attrs → []',     parseWeatherAlerts(stEl('on', { foo: 1, bar: 'baz' })).length, 0);
    eq('empty alerts array → []', parseWeatherAlerts(stEl('0', { alerts: [] })).length, 0);

    // ── run + render ────────────────────────────────────────────────────────
    const grid = document.getElementById('grid');
    let pass = 0;
    const fails = [];
    for (const t of tests) {
      if (t.ok) pass++; else fails.push(t.name);
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `<div class="row">
        <span>${t.ok ? '<span class=pass>PASS</span>' : '<span class=fail>FAIL</span>'} ${t.name}</span>
        <span>${t.detail}</span></div>`;
      grid.appendChild(card);
    }
    const total = tests.length;
    const allPass = pass === total;
    const title = allPass ? `WEATHER PASS ${pass}/${total}` : `WEATHER FAIL ${pass}/${total} [${fails.join(',')}]`;
    document.title = title;
    const sum = document.getElementById('summary');
    sum.textContent = title;
    sum.className = allPass ? 'okbg' : 'badbg';
  </script>
</body>
</html>
