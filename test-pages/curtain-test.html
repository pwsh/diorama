<!doctype html>
<meta charset="utf-8">
<title>curtain</title>
<style>html,body{margin:0;background:#111}#c{width:1280px;height:880px}</style>
<div id="c"></div>
<!-- Window glass polish (grey/translucent, open-vs-closed clarity) + interior
     curtains (roman / drape / split). Renderer assertions read _doorGroup meshes
     directly; the config-path assertion bundles the REAL Planner over a fake HaApi.
     Curtain INTERACTION (toggleCurtain dispatch + the 2D hitWindowCurtain band)
     needs the real Planner AND one COMBINED canvas bundle (canvas-render and
     canvas-hit must share a module instance — the flights-ui-test precedent).

     Harness build (from the repo root; NEVER reuse stale bundles):
       npm run build
       H=/tmp/diorama-harness-curtain
       rm -rf "$H"; mkdir -p "$H"; cp test-pages/curtain-test.html "$H"/; cp -r dist/* "$H"/
       npx esbuild src/geometry.ts --bundle --format=esm --outfile="$H"/geometry.mod.js
       T=$(mktemp -d); cp -r src/* "$T"/
       cp test-pages/fake-avatar-store.ts "$T"/avatar-store.ts
       printf "export * from './canvas-render.js';\nexport * from './canvas-hit.js';\n" > "$T"/canvas2d-entry.ts
       npx esbuild "$T"/planner.ts        --bundle --format=esm --outfile="$H"/planner.mod.js
       npx esbuild "$T"/canvas2d-entry.ts --bundle --format=esm --outfile="$H"/canvas-render.mod.js
     Run headless (serve over http — Chrome blocks dynamic module imports on file://):
       (cd "$H" && python3 -m http.server 8873 &) -->
<script type="module">
 try {
  const V = '?v=' + Date.now();
  const geo = await import('./geometry.mod.js' + V);
  const mod = await import('./assets/three-renderer.js' + V);
  const { Planner } = await import('./planner.mod.js' + V);
  const C2D = await import('./canvas-render.mod.js' + V);

  const results = [];
  const ok = (name, cond, detail = '') => results.push(`${cond ? 'ok' : 'FAIL'}:${name}${detail ? '(' + detail + ')' : ''}`);
  const near = (a, b, t = 1e-3) => Math.abs(a - b) <= t;

  const r = new mod.ThreeDRenderer(document.getElementById('c'));
  await r.load();
  const scene3d = { preset: 'day', floorColor: '#8a7860', floorTex: 'none', wallColor: '#cfd2d6' };
  const wallY = 2500;
  const mkFloor = (windows) => ({
    id: 'f1', name: 'T', w: 12000, d: 5000,
    walls: [{ id: 'w1', points: [{ x: 500, y: wallY }, { x: 11500, y: wallY }] }],
    furniture: [], lights: [], switches: [], sensors: [], motionSensors: [], envSensors: [],
    doors: [], windows, bg: null, model3d: null, look3d: null, rooms: [],
  });
  const build = (windows, states = {}) => {
    r.updateFloor(mkFloor(windows), scene3d);
    r.updateDoorsWindows([], windows, id => states[id] || null);
  };
  const isGlass = m => m.material && m.material.transparent === true;
  const panes = grp => { const o = []; grp.traverse(n => { if (n.isMesh && isGlass(n)) o.push(n); }); return o; };
  const curtainGroups = grp => {
    const o = []; grp.traverse(n => { if (n.userData && n.userData.kind === 'curtain') o.push(n); }); return o;
  };
  // Panel extent = the full slab geometry dim (child[0]) × the panel's gather scale.
  // (No THREE dependency; the panel's scale is what _placeCurtainPanel sets.)
  const panelExtent = (grp, axis, i = 0) => {
    const p = curtainGroups(grp)[i];
    const slab = p.children[0];
    const dim = axis === 'x' ? slab.geometry.parameters.width : slab.geometry.parameters.height;
    return dim * (axis === 'x' ? p.scale.x : p.scale.y);
  };

  const KINDS = ['single', 'double_hung', 'casement_pair', 'sliding', 'picture'];

  // === 1. Glass: light-grey, translucent, opacity closed 0.16 → open 0.08 ====
  {
    const wClosed = [{ id: 'g1', x: 6000, y: wallY, w: 1400, rotation: 0, entity_id: null, kind: 'single' }];
    build(wClosed);
    const gp = panes(r._doorGroup.children[0])[0];
    ok('glass_closed_opacity', near(gp.material.opacity, 0.16, 1e-6), gp.material.opacity.toFixed(3));
    const col = gp.material.color;
    ok('glass_grey_not_blue', (col.b - col.r) < 0.25 && col.r > 0.5,
      `r=${col.r.toFixed(2)} g=${col.g.toFixed(2)} b=${col.b.toFixed(2)}`);
    ok('glass_translucent', gp.material.transparent === true && gp.material.opacity < 0.3, '');
  }
  {
    const wOpen = [{ id: 'g2', x: 6000, y: wallY, w: 1400, rotation: 0, entity_id: 'binary_sensor.o', kind: 'single' }];
    build(wOpen, { 'binary_sensor.o': { state: 'on', attributes: {} } });
    const gp = panes(r._doorGroup.children[0])[0];
    ok('glass_open_opacity', near(gp.material.opacity, 0.08, 1e-6), gp.material.opacity.toFixed(3));
  }
  // Open glass is CLEARER than closed across ALL five kinds.
  {
    const closed = KINDS.map((k, i) => ({ id: 'c' + i, x: 1500 + i * 2000, y: wallY, w: 1200, rotation: 0, entity_id: null, kind: k }));
    build(closed);
    const clAll = KINDS.every((k, i) => near(panes(r._doorGroup.children[i])[0].material.opacity, 0.16, 1e-6));
    ok('glass_closed_all_kinds', clAll, '');
    const open = KINDS.map((k, i) => ({ id: 'o' + i, x: 1500 + i * 2000, y: wallY, w: 1200, rotation: 0, entity_id: 'binary_sensor.k' + i, kind: k }));
    const stO = {}; open.forEach(w => stO[w.entity_id] = { state: 'on', attributes: {} });
    build(open, stO);
    const opAll = KINDS.every((k, i) => near(panes(r._doorGroup.children[i])[0].material.opacity, 0.08, 1e-6));
    ok('glass_open_all_kinds', opAll, '');
  }

  // === 2. Curtain panel builds per style =====================================
  {
    build([{ id: 'h1', x: 6000, y: wallY, w: 1600, rotation: 0, entity_id: null, kind: 'single',
             curtain: { style: 'horizontal' }, curtainPos: 0 }]);
    ok('roman_one_panel', curtainGroups(r._doorGroup.children[0]).length === 1, '');
  }
  {
    build([{ id: 'v1', x: 6000, y: wallY, w: 1600, rotation: 0, entity_id: null, kind: 'single',
             curtain: { style: 'vertical', side: 'right' }, curtainPos: 0 }]);
    ok('drape_one_panel', curtainGroups(r._doorGroup.children[0]).length === 1, '');
  }
  {
    build([{ id: 's1', x: 6000, y: wallY, w: 1600, rotation: 0, entity_id: null, kind: 'single',
             curtain: { style: 'split' }, curtainPos: 0 }]);
    ok('split_two_panels', curtainGroups(r._doorGroup.children[0]).length === 2, '');
  }

  // === 3. Vertical side left vs right mirrored (gather direction) =============
  {
    const mk = side => [{ id: 'vs', x: 6000, y: wallY, w: 1600, rotation: 0, entity_id: null, kind: 'single',
                          curtain: { style: 'vertical', side }, curtainPos: 100 }];  // OPEN → gathered
    build(mk('right'));
    const rp = curtainGroups(r._doorGroup.children[0])[0];
    const rx = rp.position.x;
    build(mk('left'));
    const lp = curtainGroups(r._doorGroup.children[0])[0];
    const lx = lp.position.x;
    ok('vertical_right_gathers_right', rx > 0, rx.toFixed(0));
    ok('vertical_left_gathers_left', lx < 0, lx.toFixed(0));
    ok('vertical_mirrored', near(rx, -lx, 1), `${rx.toFixed(0)}/${lx.toFixed(0)}`);
  }
  // Split: panels gather OUTWARD (left panel -x, right panel +x) when open.
  {
    build([{ id: 'so', x: 6000, y: wallY, w: 1600, rotation: 0, entity_id: null, kind: 'single',
             curtain: { style: 'split' }, curtainPos: 100 }]);
    const ps = curtainGroups(r._doorGroup.children[0]).map(g => g.position.x).sort((a, b) => a - b);
    ok('split_gathers_outward', ps[0] < 0 && ps[1] > 0, ps.map(x => x.toFixed(0)).join(','));
  }

  // === 4. Closed covers the glass span; open gathers =========================
  const W = 1600;
  {
    // Vertical closed (curtainPos 0) → panel width ≈ W (covers the glass span).
    build([{ id: 'vc', x: 6000, y: wallY, w: W, rotation: 0, entity_id: null, kind: 'single',
             curtain: { style: 'vertical', side: 'right' }, curtainPos: 0 }]);
    const closedW = panelExtent(r._doorGroup.children[0], 'x');
    ok('vertical_closed_covers_span', Math.abs(closedW - W) < 80, closedW.toFixed(0));
    // Vertical open (curtainPos 100) → gathered narrow (<< span).
    build([{ id: 'vo', x: 6000, y: wallY, w: W, rotation: 0, entity_id: null, kind: 'single',
             curtain: { style: 'vertical', side: 'right' }, curtainPos: 100 }]);
    const openW = panelExtent(r._doorGroup.children[0], 'x');
    ok('vertical_open_gathers', openW < W * 0.35, openW.toFixed(0));
  }
  {
    // Roman closed → panel height ≈ glassH (default 800); open → gathered short at the top.
    const glassH = 800;
    build([{ id: 'rc', x: 6000, y: wallY, w: W, rotation: 0, entity_id: null, kind: 'single',
             curtain: { style: 'horizontal' }, curtainPos: 0 }]);
    const closedH = panelExtent(r._doorGroup.children[0], 'y');
    ok('roman_closed_covers_height', Math.abs(closedH - glassH) < 80, closedH.toFixed(0));
    build([{ id: 'ro', x: 6000, y: wallY, w: W, rotation: 0, entity_id: null, kind: 'single',
             curtain: { style: 'horizontal' }, curtainPos: 100 }]);
    const openH = panelExtent(r._doorGroup.children[0], 'y');
    ok('roman_open_rises', openH < glassH * 0.35, openH.toFixed(0));
  }

  // === 5. Fraction from a bound cover position interpolates ===================
  {
    // cover 'open' at current_position 50 → doorOpenFraction 0.5 → half-gathered.
    build([{ id: 'ci', x: 6000, y: wallY, w: W, rotation: 0, entity_id: null, kind: 'single',
             curtain: { style: 'vertical', side: 'right', entityId: 'cover.cur' } }],
          { 'cover.cur': { state: 'open', attributes: { current_position: 50 } } });
    const entry = r._curtains.find(c => c.winId === 'ci');
    ok('cover_frac_interpolates', entry && near(entry.targetFrac, 0.5, 1e-6), entry ? entry.targetFrac.toFixed(2) : 'none');
    const halfW = panelExtent(r._doorGroup.children[0], 'x');
    // scale = 0.14 + 0.86*(1-0.5) = 0.57 → width ≈ 0.57·W. Between gathered and full.
    ok('cover_frac_partial_width', halfW > W * 0.4 && halfW < W * 0.75, halfW.toFixed(0));
  }
  // Unbound curtainPos slider drives openness (25% → mostly closed, wide).
  {
    build([{ id: 'sl', x: 6000, y: wallY, w: W, rotation: 0, entity_id: null, kind: 'single',
             curtain: { style: 'vertical', side: 'right' }, curtainPos: 25 }]);
    const e = r._curtains.find(c => c.winId === 'sl');
    ok('slider_drives_frac', e && near(e.targetFrac, 0.25, 1e-6), e ? e.targetFrac.toFixed(2) : 'none');
  }

  // === 6. Eased blend survives a rebuild ====================================
  {
    // Build closed (target 0), settle the blend to ~0, then rebuild OPEN (target 1)
    // and advance ONE small frame — the blend must ease (partial), not snap to 1.
    build([{ id: 'eb', x: 6000, y: wallY, w: W, rotation: 0, entity_id: null, kind: 'single',
             curtain: { style: 'vertical', side: 'right' }, curtainPos: 0 }]);
    for (let i = 0; i < 40; i++) r._advanceCurtains(0.1);
    ok('blend_settled_closed', near(r._curtainBlend['eb'], 0, 0.02), (r._curtainBlend['eb'] ?? -9).toFixed(3));
    build([{ id: 'eb', x: 6000, y: wallY, w: W, rotation: 0, entity_id: null, kind: 'single',
             curtain: { style: 'vertical', side: 'right' }, curtainPos: 100 }]);
    r._advanceCurtains(0.05);  // one small step
    const b = r._curtainBlend['eb'];
    ok('blend_survives_rebuild', b > 0.01 && b < 0.5, (b ?? -9).toFixed(3));
  }

  // === 7. Curtain entity is config-path in the real Planner ==================
  {
    // Minimal FakeHa + Planner: a floor with a curtain-bound window → _isSlowEntity
    // returns true for that cover id, false for an unrelated one.
    const clone = v => JSON.parse(JSON.stringify(v));
    class FakeHa {
      constructor(seed) { this.map = new Map(Object.entries(seed || {}).map(([k, v]) => [k, clone(v)])); this.states = {}; this._s = []; this._c = []; }
      connect() { for (const cb of this._c) cb('connected'); for (const cb of this._s) cb(this.states, undefined); }
      onState(fn) { this._s.push(fn); } onConn(fn) { this._c.push(fn); }
      callService() { return Promise.resolve(); }
      async getHistory() { return {}; } async getWeatherForecasts() { return null; }
      async getDevices() { return []; } async getEntityRegistry() { return []; }
      async updateEntityRegistry() { return true; }
      async getUserData(k) { return this.map.has(k) ? clone(this.map.get(k)) : null; }
      async setUserData(k, v) { this.map.set(k, clone(v)); return true; }
      async refreshStates() {}
      async subscribeMqtt() { return () => {}; }
      async subscribePersistentNotifications() { return () => {}; }
      async listRepairsIssues() { return []; }
      async getCalendarEvents() { return []; }
    }
    const store = {
      v: 2,
      floors: [{
        id: 'f1', name: 'H', w: 8000, d: 6000,
        walls: [], furniture: [], lights: [], switches: [], sensors: [], motionSensors: [],
        roamers: [], envSensors: [], doors: [],
        windows: [{ id: 'w1', x: 1000, y: 1000, w: 1200, rotation: 0, entity_id: null,
                    curtain: { style: 'vertical', entityId: 'cover.living_curtain' } }],
        bg: null, rooms: [], bleProxies: [], alarmPanels: [], safetySensors: [], robots: [],
        presenceZones: [], cameras: [], groundAreas: [], voidAreas: [],
      }],
      currentFloorId: 'f1', activeSensorId: null,
      coverage: true, imperial: false, showDetails: false, useRawTargets: false,
    };
    localStorage.removeItem('diorama:store:v1'); localStorage.removeItem('diorama:configs');
    const p = new Planner();
    p.connectWith(new FakeHa({ 'diorama': store }));
    const waitFor = async (fn, ms = 3000) => { const t0 = Date.now(); while (!fn()) { if (Date.now() - t0 > ms) throw new Error('timeout'); await new Promise(r => setTimeout(r, 10)); } };
    await waitFor(() => p.store.floors[0].windows.length > 0 && p.store.floors[0].windows[0].curtain);
    ok('curtain_entity_config_path', p._isSlowEntity('cover.living_curtain') === true, '');
    ok('unrelated_not_config_path', p._isSlowEntity('cover.some_other') === false, '');
  }

  // === 8. 2D drawWindows does not throw with curtains ========================
  {
    const cnv = document.createElement('canvas'); cnv.width = 400; cnv.height = 300;
    const ctx = cnv.getContext('2d');
    let threw = false;
    try {
      const cr = geo; // geometry bundle does not export drawAll; just exercise doorOpenFraction path
      // Exercise the pure openness resolution the 2D tick uses.
      const f1 = geo.doorOpenFraction({ state: 'open', attributes: { current_position: 30 } });
      if (!near(f1, 0.3, 1e-6)) threw = true;
    } catch (e) { threw = true; }
    ok('curtain_2d_frac_ok', !threw, '');
  }

  // === 9. Bay windows: curtains are N/A and must be GATED OFF ===============
  // A drape hung across a bay would slice through the angled returns, so the
  // bay kinds skip the whole curtain build — including the closed-curtain glass
  // opacification (a bay's glass stays at the ordinary 0.16 closed clarity).
  for (const bk of ['bay', 'bay_bench']) {
    const wb = [{ id: 'cb', x: 6000, y: wallY, w: 1800, rotation: 0, entity_id: null,
                  kind: bk, curtain: { style: 'split' }, curtainPos: 0 }];
    let threw = null;
    try { build(wb); } catch (e) { threw = e; }
    ok(`bay_curtain_no_throw_${bk}`, threw === null, threw ? String(threw.message) : '');
    const grp = r._doorGroup.children[0];
    ok(`bay_no_curtain_panels_${bk}`, curtainGroups(grp).length === 0, String(curtainGroups(grp).length));
    let rods = 0; grp.traverse(o => { if (o.userData?.kind === 'curtainRod') rods++; });
    ok(`bay_no_curtain_rod_${bk}`, rods === 0, String(rods));
    ok(`bay_glass_not_opacified_${bk}`, near(panes(grp)[0].material.opacity, 0.16, 1e-6),
       panes(grp)[0].material.opacity.toFixed(3));
    // The bay itself still built its three panes.
    ok(`bay_still_three_panes_${bk}`, panes(grp).length === 3, String(panes(grp).length));
  }
  // A NON-bay window in the same scene keeps its curtains (no over-broad gate).
  {
    const wn = [{ id: 'cn', x: 6000, y: wallY, w: 1400, rotation: 0, entity_id: null,
                  kind: 'single', curtain: { style: 'split' }, curtainPos: 0 }];
    build(wn);
    ok('nonbay_curtain_still_built', curtainGroups(r._doorGroup.children[0]).length === 2,
       String(curtainGroups(r._doorGroup.children[0]).length));
  }

  // ── Shared fake-HA harness for the interaction sections ───────────────────
  const clone2 = v => JSON.parse(JSON.stringify(v));
  class FakeHa2 {
    constructor(seed) {
      this.map = new Map(Object.entries(seed || {}).map(([k, v]) => [k, clone2(v)]));
      this.states = {}; this._s = []; this._c = []; this.calls = [];
    }
    connect() { for (const cb of this._c) cb('connected'); for (const cb of this._s) cb(this.states, undefined); }
    onState(fn) { this._s.push(fn); } onConn(fn) { this._c.push(fn); }
    callService(domain, service, data) { this.calls.push({ domain, service, data }); return Promise.resolve(); }
    async getHistory() { return {}; } async getWeatherForecasts() { return null; }
    async getDevices() { return []; } async getEntityRegistry() { return []; }
    async updateEntityRegistry() { return true; }
    async getUserData(k) { return this.map.has(k) ? clone2(this.map.get(k)) : null; }
    async setUserData(k, v) { this.map.set(k, clone2(v)); return true; }
    async refreshStates() {}
    async subscribeMqtt() { return () => {}; }
    async subscribePersistentNotifications() { return () => {}; }
    async listRepairsIssues() { return []; }
    async getCalendarEvents() { return []; }
  }
  const mkStore = (windows) => ({
    v: 2,
    floors: [{
      id: 'f1', name: 'H', w: 8000, d: 6000,
      walls: [{ id: 'w1', points: [{ x: 0, y: 3000 }, { x: 8000, y: 3000 }] }],
      furniture: [], lights: [], switches: [], sensors: [], motionSensors: [],
      roamers: [], envSensors: [], doors: [], windows,
      bg: null, rooms: [], bleProxies: [], alarmPanels: [], safetySensors: [], robots: [],
      presenceZones: [], cameras: [], groundAreas: [], voidAreas: [],
    }],
    currentFloorId: 'f1', activeSensorId: null,
    coverage: true, imperial: false, showDetails: false, useRawTargets: false,
  });
  const waitFor2 = async (fn, ms = 3000) => {
    const t0 = Date.now();
    while (!fn()) { if (Date.now() - t0 > ms) throw new Error('timeout'); await new Promise(r => setTimeout(r, 10)); }
  };
  // The store body lives under the config-registry key `diorama-cfg-<id>` (the
  // legacy `diorama` key migrates ONCE and is never written again), so read the
  // ACTIVE config body — reading the seed key would report stale values forever.
  const persistedWindow = async (api, id) => {
    for (const [k, v] of api.map) {
      if (!k.startsWith('diorama-cfg-')) continue;
      const w = v?.floors?.[0]?.windows?.find(x => x.id === id);
      if (w) return w;
    }
    return null;
  };
  const bootPlanner = async (windows) => {
    localStorage.removeItem('diorama:store:v1'); localStorage.removeItem('diorama:configs');
    const api = new FakeHa2({ 'diorama': mkStore(windows) });
    const pl = new Planner();
    pl.connectWith(api);
    await waitFor2(() => pl.store.floors[0].windows.length === windows.length);
    return { pl, api };
  };

  // === 10. toggleCurtain dispatch matrix (REAL Planner over a fake HaApi) ====
  // Bound cover.* is STATE-PICKED (never a blind toggle — the valve/siren rule);
  // switch.* is an ordinary domain toggle; binary_sensor is display-only; unbound
  // flips curtainPos between the two extremes. View refuses everywhere; kiosk
  // fires but must not persist (save() no-ops outside edit).
  {
    const W = (id, curtain, extra = {}) => ({
      id, x: 2000, y: 3000, w: 1400, rotation: 0, entity_id: null,
      kind: 'single', curtain, ...extra,
    });
    const { pl, api } = await bootPlanner([
      W('cvOpen',  { style: 'vertical', entityId: 'cover.drape' }),
      W('cvHalf',  { style: 'vertical', entityId: 'cover.half' }),
      W('sw',      { style: 'vertical', entityId: 'switch.drape' }),
      W('bs',      { style: 'vertical', entityId: 'binary_sensor.drape' }),
      W('unb',     { style: 'split' }, { curtainPos: 100 }),
      W('unbShut', { style: 'split' }, { curtainPos: 0 }),
      W('none',    undefined),
    ]);
    const wins = pl.store.floors[0].windows;
    const byId = id => wins.find(w => w.id === id);
    api.states['cover.drape'] = { state: 'open', attributes: {} };
    api.states['cover.half']  = { state: 'open', attributes: { current_position: 20 } };
    api.states['switch.drape'] = { state: 'on', attributes: {} };
    api.states['binary_sensor.drape'] = { state: 'on', attributes: {} };

    // Openness resolver agrees with the renderer's private rule.
    ok('frac_cover_open', near(pl.curtainFraction(byId('cvOpen')), 1, 1e-9));
    ok('frac_cover_partial', near(pl.curtainFraction(byId('cvHalf')), 0.2, 1e-9));
    ok('frac_unbound_slider', near(pl.curtainFraction(byId('unb')), 1, 1e-9));
    ok('frac_no_curtain_open', near(pl.curtainFraction(byId('none')), 1, 1e-9));

    // Bound cover, OPEN → close_cover.
    api.calls.length = 0;
    pl.toggleCurtain(byId('cvOpen'));
    ok('cover_open_calls_close', api.calls.length === 1 && api.calls[0].domain === 'cover'
       && api.calls[0].service === 'close_cover'
       && api.calls[0].data.entity_id === 'cover.drape', JSON.stringify(api.calls));
    // Bound cover, mostly CLOSED (20 %) → open_cover.
    api.calls.length = 0;
    pl.toggleCurtain(byId('cvHalf'));
    ok('cover_closed_calls_open', api.calls.length === 1 && api.calls[0].service === 'open_cover',
       JSON.stringify(api.calls));
    // Bound switch → switch.toggle (domain-aware toggleEntity).
    api.calls.length = 0;
    pl.toggleCurtain(byId('sw'));
    ok('switch_calls_toggle', api.calls.length === 1 && api.calls[0].domain === 'switch'
       && api.calls[0].service === 'toggle', JSON.stringify(api.calls));
    // Bound binary_sensor → display-only, zero calls, no local mutation.
    api.calls.length = 0;
    const bsBefore = byId('bs').curtainPos;
    pl.toggleCurtain(byId('bs'));
    ok('binary_sensor_no_calls', api.calls.length === 0, JSON.stringify(api.calls));
    ok('binary_sensor_no_flip', byId('bs').curtainPos === bsBefore, String(byId('bs').curtainPos));
    // No curtain configured → no-op.
    api.calls.length = 0;
    pl.toggleCurtain(byId('none'));
    ok('no_curtain_noop', api.calls.length === 0 && byId('none').curtainPos === undefined, '');
    // Unbound → curtainPos flips 0 ↔ 100 (both directions).
    pl.toggleCurtain(byId('unb'));
    ok('unbound_open_to_shut', byId('unb').curtainPos === 0, String(byId('unb').curtainPos));
    pl.toggleCurtain(byId('unb'));
    ok('unbound_shut_to_open', byId('unb').curtainPos === 100, String(byId('unb').curtainPos));
    pl.toggleCurtain(byId('unbShut'));
    ok('unbound_from_zero_opens', byId('unbShut').curtainPos === 100, String(byId('unbShut').curtainPos));

    // Edit mode PERSISTS the unbound flip (save() writes the store body). Let the
    // 600 ms save debounce FLUSH before reading — save() serializes at flush time,
    // so a still-pending edit-mode save would otherwise pick up a later value.
    const rev0 = pl.configRev;
    pl.toggleCurtain(byId('unb'));
    ok('unbound_emits_config', pl.configRev > rev0, `${rev0}->${pl.configRev}`);
    await new Promise(r => setTimeout(r, 900));
    const editPersisted = (await persistedWindow(api, 'unb'))?.curtainPos;
    ok('edit_unbound_persisted', editPersisted === byId('unb').curtainPos,
       `${editPersisted} vs ${byId('unb').curtainPos}`);

    // VIEW mode: zero calls, no flip, on every binding shape.
    pl.setUiMode('view');
    api.calls.length = 0;
    const vBefore = byId('unb').curtainPos;
    pl.toggleCurtain(byId('cvOpen'));
    pl.toggleCurtain(byId('sw'));
    pl.toggleCurtain(byId('unb'));
    ok('view_zero_calls', api.calls.length === 0, JSON.stringify(api.calls));
    ok('view_no_flip', byId('unb').curtainPos === vBefore, String(byId('unb').curtainPos));

    // KIOSK: the cover service still fires (the whole point of a control kiosk),
    // and an unbound flip lands in memory but never in the persisted store.
    pl.setUiMode('kiosk');
    api.calls.length = 0;
    pl.toggleCurtain(byId('cvOpen'));
    ok('kiosk_cover_fires', api.calls.length === 1 && api.calls[0].service === 'close_cover',
       JSON.stringify(api.calls));
    const kBefore = byId('unb').curtainPos;
    pl.toggleCurtain(byId('unb'));
    ok('kiosk_unbound_flips_in_memory', byId('unb').curtainPos !== kBefore,
       `${kBefore}->${byId('unb').curtainPos}`);
    await new Promise(r => setTimeout(r, 900));   // past the 600 ms save debounce
    const pw = await persistedWindow(api, 'unb');
    ok('kiosk_unbound_not_persisted', pw && pw.curtainPos === editPersisted,
       `${pw && pw.curtainPos} (edit left ${editPersisted})`);
    pl.setUiMode('edit');
  }

  // === 11. hitWindowCurtain: the clickable band IS the painted band ==========
  // curtainTickPx is the ONE geometry source for the tick and its hit test, so
  // these assertions exercise the same offset the painter uses.
  {
    const { computeView, mmToPx, curtainTickPx, hitWindowCurtain, hitWindow,
            CURTAIN_TICK_OFF_PX } = C2D;
    const dpr = window.devicePixelRatio || 1;
    const cnv = document.createElement('canvas'); cnv.width = 800; cnv.height = 600;
    const W2 = (id, kind, curtain) => ({
      id, x: 4000, y: 3000, w: 1600, rotation: 0, entity_id: null, kind, curtain,
    });
    const { pl } = await bootPlanner([
      W2('cw', 'single', { style: 'vertical' }),
    ]);
    const f2 = pl.store.floors[0];
    const view = computeView(cnv, f2.w, f2.d, pl.viewCenter, pl.zoom);
    const win = f2.windows[0];
    // The tick exists and sits CURTAIN_TICK_OFF_PX·dpr off the span (screen px).
    const tick = curtainTickPx(view, win);
    ok('tick_exists', !!tick, '');
    const centre = mmToPx(view, win.x, win.y);
    const tmx = (tick.ax + tick.bx) / 2, tmy = (tick.ay + tick.by) / 2;
    ok('tick_offset_px', near(Math.hypot(tmx - centre.x, tmy - centre.y),
                              CURTAIN_TICK_OFF_PX * dpr, 1e-6),
       String(Math.hypot(tmx - centre.x, tmy - centre.y)));
    // World point under the tick's midpoint → hit; the bare span centre → miss.
    const pxToMm = (px, py) => ({ x: (px - view.ox) / view.scale, y: (view.oy - py) / view.scale });
    const onTick = pxToMm(tmx, tmy);
    ok('hit_on_tick', hitWindowCurtain(pl, view, onTick)?.win?.id === 'cw', '');
    ok('miss_on_span', hitWindowCurtain(pl, view, { x: win.x, y: win.y }) === null, '');
    // A point far off the band (stepped PERPENDICULAR to it — the window is
    // horizontal, so an along-band step would still land on the tick) misses;
    // the WINDOW body still hits its own span (the curtain never steals it).
    const far = pxToMm(tmx, tmy + 40 * dpr);
    ok('miss_far_off_band', hitWindowCurtain(pl, view, far) === null, '');
    ok('window_body_still_hits', hitWindow(pl, view, { x: win.x, y: win.y })?.win?.id === 'cw', '');
    // Priority: the tick point ALSO satisfies hitWindow (the band is inside the
    // window's ~10 px tolerance) — which is exactly why callers must test the
    // curtain first. Assert the overlap so the ordering requirement is pinned.
    ok('tick_overlaps_window_hit', hitWindow(pl, view, onTick)?.win?.id === 'cw', '');
    // Layer OFF → untappable (the openings hidden-layer rule).
    pl.store.layers2d = { ...(pl.store.layers2d || {}), openings: false };
    ok('layer_off_no_hit', hitWindowCurtain(pl, view, onTick) === null, '');
    pl.store.layers2d = { ...(pl.store.layers2d || {}), openings: true };
    ok('layer_on_hit_returns', hitWindowCurtain(pl, view, onTick)?.win?.id === 'cw', '');
    // No curtain configured → no band at all.
    delete win.curtain;
    ok('no_curtain_no_tick', curtainTickPx(view, win) === null, '');
    ok('no_curtain_no_hit', hitWindowCurtain(pl, view, onTick) === null, '');
    // Bay windows: curtains are gated off in 3D, so the plan offers no band.
    win.curtain = { style: 'split' };
    for (const bk of ['bay', 'bay_bench']) {
      win.kind = bk;
      ok(`bay_no_tick_${bk}`, curtainTickPx(view, win) === null, '');
      ok(`bay_no_hit_${bk}`, hitWindowCurtain(pl, view, onTick) === null, '');
    }
  }

  const pass = results.every(x => x.startsWith('ok'));
  const n = results.length, pc = results.filter(x => x.startsWith('ok')).length;
  document.title = `CURTAIN ${pass ? 'PASS' : 'FAIL'} ${pc}/${n} ${results.join(' ')}`;
  r.applyViewPreset('iso');
 } catch (e) { document.title = 'ERR: ' + (e && e.stack ? e.stack.split('\n').slice(0, 3).join(' | ') : e); }
</script>
