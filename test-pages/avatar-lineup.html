<!doctype html>
<meta charset="utf-8">
<title>avatar lineup</title>
<style>html,body{margin:0;background:#111}#c{width:1280px;height:880px}</style>
<div id="c"></div>
<script type="module">
  const q = new URLSearchParams(location.search);
  const mod = await import('./assets/three-renderer.js');
  const r = new mod.ThreeDRenderer(document.getElementById('c'));
  await r.load();
  const floor = {
    id: 'f1', name: 'Lineup', w: 11200, d: 3000,
    walls: [],
    furniture: [],
    lights: [], switches: [], sensors: [], motionSensors: [], envSensors: [],
    doors: [], windows: [], bg: null, model3d: null, look3d: null,
  };
  r.updateFloor(floor, { preset: q.get('preset') || 'day', floorColor: '#8a7860', floorTex: 'wood', wallColor: '#cfd2d6' });

  const kinds = (q.get('kinds') || 'adult,child,robot,alien,professional,hacker,movie_star,ninja,cyborg,ninja_cyborg,athlete,cat,dog').split(',');
  const colsAll = [0x4fc3f7,0xff8a65,0x90a4ae,0xba68c8,0x64b5f6,0x81c784,0xffd54f,0xff7043,0x4fc3f7,0xe57373,0x4db6ac];
  const cols = kinds.map((_, i) => colsAll[i % colsAll.length]);
  const targets = kinds.map((k, i) => ({
    key: 'a' + i, x: 700 + i * (parseFloat(q.get('gap')||'950')), y: 1500, color: cols[i], avatar: k,
  }));

  const realNow = performance.now.bind(performance);
  let fakeNow = realNow();
  performance.now = () => fakeNow;
  for (let i = 0; i < 150; i++) {
    fakeNow += 16.7;
    // Keep each perfectly still (idle) so silhouettes read cleanly.
    r.updateTargets(targets.map(t => ({ ...t })));
  }
  performance.now = realNow;

  const view = q.get('view') || 'front';
  r.applyViewPreset(view);
  const zoom = parseFloat(q.get('zoom') || '1');
  if (zoom !== 1) {
    const cv = r.cameraView();
    const t = cv.target;
    // Move the camera toward the target by `zoom` (1 = unchanged, 0.4 = 40% dist)
    const pos = [
      t[0] + (cv.pos[0] - t[0]) * zoom,
      t[1] + (cv.pos[1] - t[1]) * zoom,
      t[2] + (cv.pos[2] - t[2]) * zoom,
    ];
    // Optional lateral pan (mm in scene x) to center on a subset
    const panx = parseFloat(q.get('panx') || '0');
    r.setCameraView([pos[0] + panx, pos[1], pos[2]], [t[0] + panx, t[1] + 300, t[2]]);
  }
  document.title = 'lineup ' + kinds.join(',');
</script>
