<!doctype html>
<meta charset="utf-8">
<title>climb</title>
<style>html,body{margin:0;background:#111}#c{width:1280px;height:880px}</style>
<div id="c"></div>
<script type="module">
  const mod = await import('./assets/three-renderer.js');
  const r = new mod.ThreeDRenderer(document.getElementById('c'));
  await r.load();
  const floor = {
    id: 'f1', name: 'T', w: 8000, d: 6000,
    walls: [], lights: [], switches: [], sensors: [], motionSensors: [], envSensors: [],
    doors: [], windows: [], bg: null, model3d: null,
    furniture: [{ id: 'up', x: 4000, y: 3000, w: 1100, h: 3600, kind: 'stairs' }],
  };
  r.updateFloor(floor, { preset: 'day', floorColor: '#8a7860', floorTex: 'none', wallColor: '#cfd2d6' });
  r.setCameraView([-3400, 2600, -4400], [0, 1200, 0]);
  // Walk a target from the front of the stairs up the run (world +y),
  // freezing mid-flight.
  const realNow = performance.now.bind(performance);
  let fakeNow = realNow();
  performance.now = () => fakeNow;
  for (let i = 0; i < 200; i++) {
    fakeNow += 16.7;
    const y = 1300 + Math.min(2600, 1100 * (i * 0.0167));  // walks onto and up the stairs
    r.updateTargets([{ key: 't1', x: 4000, y, color: 0x4fc3f7 }]);
  }
  performance.now = realNow;
  document.title = 'climb ok';
</script>
