<!doctype html>
<meta charset="utf-8">
<title>vehicle pack test</title>
<style>html,body{margin:0;background:#111;color:#ddd;font:11px monospace}pre{white-space:pre-wrap}</style>
<pre id="out">running…</pre>
<script type="module">
 // PURE gate for the vehicle-model registry (src/vehicles.ts) + its geometry.ts
 // resolution hook. No three.js, no DOM canvas.
 //
 // Harness setup:
 //   npx esbuild test-pages/vehicle-pack-entry.ts --bundle --format=esm --outfile=<h>/veh.mod.js
 //   npx esbuild src/vehicle-packs/manifest.ts --format=esm --outfile=<h>/vmanifest.mod.js
 //   for every id in VEHICLE_PACK_MANIFEST:
 //     npx esbuild src/vehicle-packs/<id>.ts --bundle --format=esm --outfile=<h>/vp-<id>.mod.js
 //
 // veh.mod.js is ONE bundle carrying BOTH vehicles.ts and geometry.ts, so the
 // registry the config functions mutate is the SAME one resolveFurnitureDef
 // reads (geometry imports vehicles — two bundles would each get a copy).
 try {
  const V = '?v=' + Date.now();
  const VEH = await import('./veh.mod.js' + V);
  const GEO = VEH;                                   // same bundle → same registry
  const { VEHICLE_PACK_MANIFEST } = await import('./vmanifest.mod.js' + V);
  // Every manifest pack body, loaded by id — a new pack needs no edit here.
  const PACKS = [];
  for (const row of VEHICLE_PACK_MANIFEST) {
    PACKS.push((await import(`./vp-${row.id}.mod.js` + V)).default);
  }
  const byId = (id) => PACKS.find(p => p.id === id);
  // The three GROUND packs stay named: section 4+ exercises registry mechanics
  // against a known-size registry, so it registers exactly these.
  const civil = byId('base-ground-civil');
  const mil   = byId('base-ground-military');
  const fic   = byId('franchise-ground-fiction');
  const GROUND = [civil, mil, fic];

  const checks = [];
  const ok = (name, cond, extra = '') => checks.push({ name, pass: !!cond, extra });
  const eq = (name, a, b, extra = '') => ok(name, a === b, `${extra} got=${JSON.stringify(a)} want=${JSON.stringify(b)}`);

  // ═══ 1. Manifest ↔ pack-body agreement ═══════════════════════════════════
  // Pinned count: adding a pack is a deliberate change, so the test moves with it.
  eq('1a: manifest has 8 rows', VEHICLE_PACK_MANIFEST.length, 8);
  for (const row of VEHICLE_PACK_MANIFEST) {
    const body = PACKS.find(p => p.id === row.id);
    ok(`1b: manifest row ${row.id} has a body`, !!body);
    if (!body) continue;
    eq(`1c: ${row.id} count matches`, body.models.length, row.count);
    eq(`1d: ${row.id} label matches`, body.label, row.label);
    eq(`1e: ${row.id} path matches`, body.path.join('/'), row.path.join('/'));
    eq(`1f: ${row.id} franchise flag matches`, !!body.franchise, !!row.franchise);
  }
  eq('1g: exactly two franchise packs', VEHICLE_PACK_MANIFEST.filter(r => r.franchise).length, 2);
  eq('1h: the franchise packs are the two fiction ones',
     VEHICLE_PACK_MANIFEST.filter(r => r.franchise).map(r => r.id).sort().join(','),
     'franchise-ground-fiction,franchise-space-fiction');
  // Every pack id is unique and every path is distinct (the Settings tree keys off it).
  eq('1i: pack ids unique', new Set(VEHICLE_PACK_MANIFEST.map(r => r.id)).size,
     VEHICLE_PACK_MANIFEST.length);
  eq('1j: pack paths unique', new Set(VEHICLE_PACK_MANIFEST.map(r => r.path.join('/'))).size,
     VEHICLE_PACK_MANIFEST.length);

  // ── Prim geometry helpers (shared by §2's repo-wide invariants and §8/§9's
  // per-model pins). An exact rotated AABB — the recipe builder applies `rot`
  // as a THREE 'XYZ' Euler and nothing else.
  const D2R = Math.PI / 180;
  const halfOf = (pr) => {
    const [a, b, c] = [pr.size[0], pr.size[1], pr.size[2] ?? 0];
    switch (pr.shape) {
      case 'box': return [a / 2, b / 2, c / 2];
      case 'cylinder': return [Math.max(a, b), c / 2, Math.max(a, b)];
      case 'sphere': return [a, a, a];
      case 'cone': return [a, b / 2, a];
      default: return [a / 2, b / 2, c / 2];
    }
  };
  const rotM = (rot) => {
    const [rx, ry, rz] = (rot ?? [0, 0, 0]).map(d => d * D2R);
    const cx = Math.cos(rx), sx = Math.sin(rx), cy = Math.cos(ry), sy = Math.sin(ry),
          cz = Math.cos(rz), sz = Math.sin(rz);
    const mul = (A, B) => A.map((_, i) => [0, 1, 2].map(j =>
      [0, 1, 2].reduce((s, k) => s + A[i][k] * B[k][j], 0)));
    return mul(mul([[1, 0, 0], [0, cx, -sx], [0, sx, cx]],
                   [[cy, 0, sy], [0, 1, 0], [-sy, 0, cy]]),
               [[cz, -sz, 0], [sz, cz, 0], [0, 0, 1]]);
  };
  // Axis-aligned bounds of one primitive, in model-local mm.
  const bb = (pr) => {
    const h = halfOf(pr), R = rotM(pr.rot);
    const e = [0, 1, 2].map(i =>
      Math.abs(R[i][0]) * h[0] + Math.abs(R[i][1]) * h[1] + Math.abs(R[i][2]) * h[2]);
    return { min: pr.pos.map((p, i) => p - e[i]), max: pr.pos.map((p, i) => p + e[i]) };
  };
  // The documented flat-toon gotcha is about two sibling BOXES sharing an
  // exactly coplanar VISIBLE FACE. A tilted prim's AABB extremum is not a face
  // at all, and a cylinder/sphere/cone meets its AABB on a tangent LINE, not a
  // plane — so the coplanar test below is scoped to boxes whose rotations are
  // axis-preserving (every component a multiple of 90°).
  const faceted = (pr) => pr.shape === 'box'
    && (pr.rot ?? [0, 0, 0]).every(d => Math.abs(d % 90) < 1e-6);

  // ═══ 2. Model data sanity (every member of every pack) ═══════════════════
  const seenIds = new Set();
  let modelCount = 0;
  for (const pack of PACKS) {
    for (const m of pack.models) {
      modelCount++;
      const tag = m.id;
      ok(`2a: ${tag} id namespaced under its pack`, m.id.startsWith(pack.id + '/'), m.id);
      ok(`2b: ${tag} id unique`, !seenIds.has(m.id), m.id);
      seenIds.add(m.id);
      ok(`2c: ${tag} label non-empty`, typeof m.label === 'string' && m.label.trim().length > 0);
      ok(`2d: ${tag} category is a known one`,
         ['ground', 'aircraft', 'space'].includes(m.category), m.category);
      // SURFACE — not the taxonomy category — is what decides how a model is
      // authored and which consumer accepts it: a banner craft is centred
      // vertically and never placed, a ground model stands on y = 0. Every model
      // declares exactly one of the two. The Space pack's surface rovers are the
      // deliberate crossover (space CATEGORY, ground SURFACE), so the TREE is
      // checked against the category and the authoring frame against the surface.
      const ground = Array.isArray(m.surfaces) && m.surfaces.includes('ground');
      const sky = Array.isArray(m.surfaces) && m.surfaces.includes('banner');
      ok(`2e: ${tag} declares exactly one of ground / banner`,
         ground !== sky, JSON.stringify(m.surfaces));
      ok(`2e2: ${tag} pack path matches its category`,
         m.category === 'ground' ? pack.path[0] === 'Ground Vehicles'
           : (pack.path[0] === 'Aircraft' || pack.path[0] === 'Space'), pack.path[0]);
      ok(`2e3: ${tag} a Ground Vehicles member is ground-placeable`,
         pack.path[0] !== 'Ground Vehicles' || ground, JSON.stringify(m.surfaces));
      ok(`2f: ${tag} dims all positive finite`,
         m.dims.length === 3 && m.dims.every(v => Number.isFinite(v) && v > 0), JSON.stringify(m.dims));
      ok(`2g: ${tag} lenMm positive`, Number.isFinite(m.lenMm) && m.lenMm > 0, String(m.lenMm));
      // Sky craft are budgeted 5..16 prims (they are message props read at
      // distance); ground vehicles are placed furniture and may carry more.
      // The ceiling moved 14 → 16 on 2026-08-06: the three FIXED-GEAR types
      // (DC-3, Cessna 172, J-3 Cub) are the only sky craft whose undercarriage
      // is visible structure, and their wheels used to hang on nothing at all.
      ok(`2h: ${tag} has >= 5 primitives`, m.prims.length >= 5, String(m.prims.length));
      if (sky) ok(`2h2: ${tag} sky craft within the 16-prim budget`,
                  m.prims.length <= 16, String(m.prims.length));
      const badPrim = m.prims.find(p =>
        !['box', 'cylinder', 'sphere', 'cone'].includes(p.shape)
        || !Array.isArray(p.size) || !p.size.every(Number.isFinite)
        || !Array.isArray(p.pos) || p.pos.length !== 3 || !p.pos.every(Number.isFinite)
        || (p.rot && (p.rot.length !== 3 || !p.rot.every(Number.isFinite))));
      ok(`2i: ${tag} all primitives well-formed`, !badPrim, JSON.stringify(badPrim ?? ''));
      // A GROUND-surface model's origin is its footprint centre AT ground level,
      // so nothing may be authored below y = 0. A banner craft is centred
      // vertically instead (the BG_CRAFTS convention) and legitimately has parts
      // below its origin — it is checked for vertical CENTREDNESS instead.
      if (ground) {
        const below = m.prims.filter(p => p.pos[1] < -1);
        ok(`2j: ${tag} nothing authored below ground`, below.length === 0, String(below.length));
      } else {
        const ys = m.prims.map(p => p.pos[1]);
        const span = Math.max(...ys) - Math.min(...ys);
        const mid = (Math.max(...ys) + Math.min(...ys)) / 2;
        ok(`2j: ${tag} sky craft is centred vertically`,
           span === 0 || Math.abs(mid) <= Math.max(span * 0.5, m.dims[2] * 0.5),
           `mid=${mid} span=${span}`);
      }
      // Parts sit inside a generous envelope of the declared bounding box. A
      // VERTICAL craft is measured against its own height on Y, not its
      // (diameter-sized) depth.
      const [W, D, H] = m.dims;
      const out = m.prims.filter(p => Math.abs(p.pos[0]) > W
        || Math.abs(p.pos[2]) > (m.vertical ? Math.max(D, H) : D)
        || (sky && Math.abs(p.pos[1]) > Math.max(H, W)));
      ok(`2k: ${tag} parts inside the footprint envelope`, out.length === 0, String(out.length));

      // ── The two REPO-WIDE assembly invariants (2026-08-06) ────────────────
      // 2n  no FLOATING part: every prim's AABB must overlap some sibling's.
      //     AABB overlap is a superset of real overlap, so a non-overlap is a
      //     genuinely detached piece (headlamps hanging ahead of a bumper,
      //     rotor masts reaching neither cabin nor hub, rocket stages butted
      //     with exactly zero overlap — 135 of these shipped).
      // 2o  no COINCIDENT FACE between two sibling boxes: the flat-toon
      //     hatching gotcha. Fix by GROWING one part inward, never by moving
      //     the face anybody sees.
      {
        const bs = m.prims.map(bb);
        const ovl = (a, b) => [0, 1, 2].every(i =>
          Math.min(a.max[i], b.max[i]) - Math.max(a.min[i], b.min[i]) > 1);
        const orphans = [], coplanar = [];
        for (let i = 0; i < bs.length; i++) {
          let touches = false;
          for (let j = 0; j < bs.length; j++) {
            if (i === j) continue;
            if (!ovl(bs[i], bs[j])) continue;
            touches = true;
            if (j > i && faceted(m.prims[i]) && faceted(m.prims[j])) {
              for (let k = 0; k < 3; k++) {
                if (Math.abs(bs[i].max[k] - bs[j].max[k]) < 0.5) coplanar.push(`${i}/${j}${'xyz'[k]}+`);
                if (Math.abs(bs[i].min[k] - bs[j].min[k]) < 0.5) coplanar.push(`${i}/${j}${'xyz'[k]}-`);
              }
            }
          }
          if (!touches) orphans.push(i);
        }
        ok(`2n: ${tag} no floating parts`, orphans.length === 0, `[${orphans.join(',')}]`);
        ok(`2o: ${tag} no coincident sibling faces`, coplanar.length === 0,
           coplanar.slice(0, 6).join(' '));
      }
    }
  }
  const bySurface = (s) => PACKS.reduce(
    (n, p) => n + p.models.filter(m => m.surfaces.includes(s)).length, 0);
  eq('2l: 71 models across the eight packs', modelCount, 71);
  eq('2m: 34 of them tow banners', bySurface('banner'), 34);
  eq('2m2: 37 of them are ground-placeable', bySurface('ground'), 37);
  // The Space pack is the only one that carries BOTH surfaces (three launch
  // vehicles that fly, two rovers that drive).
  eq('2m3: the Space ▸ Real pack is the ground/banner crossover',
     PACKS.filter(p => p.models.some(m => m.surfaces.includes('banner'))
                       && p.models.some(m => m.surfaces.includes('ground')))
          .map(p => p.id).join(','), 'base-space-real');

  // ═══ 3. IP posture — fiction labels are descriptive-generic ══════════════
  // §5.3: no franchise / proper-noun term may appear in a SHIPPED string. This
  // is a hard gate, not a style note (the shipped BG_CRAFTS roster slipped twice).
  const BANNED = ['delorean', 'batman', 'batmobile', 'knight rider', 'kitt', 'general lee',
    'dukes of hazzard', 'ghostbuster', 'ecto', 'herbie', 'love bug', 'scooby',
    'mystery machine', 'a-team', 'bumblebee', 'transformer', 'flintstone',
    'back to the future', 'star wars', 'x-wing', 'firefly', 'serenity',
    // Space fiction (batch V2).
    'tardis', 'doctor who', 'police box', 'battlestar', 'galactica',
    'space odyssey', 'discovery one', 'star trek', 'millennium falcon',
    'space: 1999', 'space 1999'];
  const franchisePacks = PACKS.filter(p => p.franchise);
  eq('3z: both franchise packs present', franchisePacks.length, 2);
  for (const fp of franchisePacks) for (const m of fp.models) {
    const hay = (m.label + ' ' + m.id).toLowerCase();
    const hit = BANNED.find(b => hay.includes(b));
    ok(`3a: fiction "${m.label}" carries no franchise term`, !hit, hit ?? '');
  }
  ok('3b: fiction packs default UNLOADED', franchisePacks.every(p => p.franchise === true));
  ok('3c: base packs are not franchise', PACKS.filter(p => !p.franchise).length === 6
     && !civil.franchise && !mil.franchise);

  // ═══ 4. Registry: register / resolve / gating ════════════════════════════
  VEH.setVehiclePacksConfig(undefined);
  // Only the three GROUND packs — the count assertions below are exact.
  for (const p of GROUND) VEH.registerVehiclePack(p, 'builtin');

  const CIVIL_ID = civil.models[0].id;
  const FIC_ID = fic.models[0].id;

  ok('4a: base-pack model resolves by default', !!VEH.resolveVehicleDef(CIVIL_ID));
  eq('4b: resolved def is the authored one', VEH.resolveVehicleDef(CIVIL_ID)?.label, civil.models[0].label);
  ok('4c: franchise model does NOT resolve by default (opt-in)', VEH.resolveVehicleDef(FIC_ID) === null);
  ok('4d: unknown id → null', VEH.resolveVehicleDef('nope/nope') === null);
  ok('4e: null/undefined id → null',
     VEH.resolveVehicleDef(null) === null && VEH.resolveVehicleDef(undefined) === null);

  VEH.setVehiclePacksConfig({ 'franchise-ground-fiction': { loaded: true } });
  ok('4f: franchise resolves once loaded', !!VEH.resolveVehicleDef(FIC_ID));
  VEH.setVehiclePacksConfig({ 'franchise-ground-fiction': { loaded: true, active: false } });
  ok('4g: loaded-but-inactive → null', VEH.resolveVehicleDef(FIC_ID) === null);

  VEH.setVehiclePacksConfig({ 'base-ground-civil': { loaded: false } });
  ok('4h: explicitly unloaded base pack → null', VEH.resolveVehicleDef(CIVIL_ID) === null);

  const subset = [civil.models[0].id, civil.models[1].id];
  VEH.setVehiclePacksConfig({ 'base-ground-civil': { members: subset } });
  ok('4i: member in subset resolves', !!VEH.resolveVehicleDef(subset[0]));
  ok('4j: member EXCLUDED by subset → null', VEH.resolveVehicleDef(civil.models[2].id) === null);
  eq('4k: activeVehicleIds honours the subset', VEH.activeVehicleIds().length,
     subset.length + mil.models.length);

  VEH.setVehiclePacksConfig(undefined);
  eq('4l: default active ids = both base packs', VEH.activeVehicleIds().length,
     civil.models.length + mil.models.length);
  const listed = VEH.listActiveVehiclePacks();
  eq('4m: listActiveVehiclePacks omits the franchise pack', listed.length, 2);
  ok('4n: vehiclePackList sees all three registered packs', VEH.vehiclePackList().length === 3);
  eq('4o: vehiclePackOf maps a member to its pack', VEH.vehiclePackOf(CIVIL_ID)?.id, 'base-ground-civil');
  ok('4p: vehiclePackOf(unknown) → null', VEH.vehiclePackOf('nope/nope') === null);

  // Effective-state defaults.
  eq('4q: base pack effective loaded', VEH.vehiclePackEffectiveState(civil).loaded, true);
  eq('4r: base pack effective active', VEH.vehiclePackEffectiveState(civil).active, true);
  eq('4s: franchise pack effective loaded=false', VEH.vehiclePackEffectiveState(fic).loaded, false);
  eq('4t: franchise inactive while unloaded', VEH.vehiclePackEffectiveState(fic).active, false);

  // Idempotent re-register at the same version is a no-op; a bump replaces.
  VEH.registerVehiclePack(civil, 'builtin');
  eq('4u: re-register same version keeps one entry', VEH.vehiclePackList().length, 3);
  VEH.unregisterVehiclePack('base-ground-military');
  eq('4v: unregister drops the pack', VEH.vehiclePackList().length, 2);
  ok('4w: unregistered pack members stop resolving',
     VEH.resolveVehicleDef(mil.models[0].id) === null);
  VEH.registerVehiclePack(mil, 'builtin');
  ok('4x: re-register restores resolution', !!VEH.resolveVehicleDef(mil.models[0].id));

  // ═══ 5. vehicleRecipe conversion ════════════════════════════════════════
  const src = civil.models.find(m => m.id.endsWith('/pickup'));
  const rec = VEH.vehicleRecipe(src.id);
  ok('5a: recipe built for an active model', !!rec);
  eq('5b: recipe id == model id', rec.id, src.id);
  eq('5c: recipe label == model label', rec.label, src.label);
  eq('5d: recipe w == dims[0]', rec.w, src.dims[0]);
  eq('5e: recipe h == dims[1] (plan depth)', rec.h, src.dims[1]);
  eq('5f: recipe ht == dims[2]', rec.ht, src.dims[2]);
  eq('5g: recipe color is the body hex as an int', rec.color, parseInt(src.body.slice(1), 16));
  eq('5h: recipe cat is vehicle', rec.cat, 'vehicle');
  eq('5i: frontArrow true (vehicles have a functional front)', rec.frontArrow, true);
  eq('5j: primitive count preserved', rec.primitives.length, src.prims.length);
  const allHex = rec.primitives.every(p => /^#[0-9a-f]{6}$/i.test(p.color));
  ok('5k: every slot resolved to a concrete hex', allHex,
     JSON.stringify(rec.primitives.filter(p => !/^#[0-9a-f]{6}$/i.test(p.color)).map(p => p.color)));
  const all3 = rec.primitives.every(p => Array.isArray(p.size) && p.size.length === 3);
  ok('5l: every size normalised to a 3-tuple', all3);
  const noExtras = rec.primitives.every(p =>
    !('spin' in p) && !('emissive' in p) && !('segments' in p));
  ok('5m: spin / emissive / segments dropped', noExtras);

  // Slot resolution against a synthetic model (exercises all four slots).
  VEH.registerVehiclePack({
    id: 'probe', version: 1, label: 'P', path: ['P'], builtin: true,
    models: [{
      id: 'probe/slots', label: 'Slots', category: 'ground', lenMm: 1000,
      dims: [1000, 2000, 900], body: '#112233', accent: '#445566', surfaces: ['ground'],
      prims: [
        { shape: 'box', size: [10, 10, 10], pos: [0, 0, 0], color: 'body' },
        { shape: 'box', size: [10, 10, 10], pos: [0, 0, 0], color: 'accent' },
        { shape: 'box', size: [10, 10, 10], pos: [0, 0, 0], color: 'glass' },
        { shape: 'box', size: [10, 10, 10], pos: [0, 0, 0], color: 'dark' },
        { shape: 'box', size: [10, 10, 10], pos: [0, 0, 0], color: '#abcdef' },
        { shape: 'box', size: [10, 10, 10], pos: [0, 0, 0] },
        { shape: 'cone', size: [5, 9], pos: [0, 0, 0], color: 'body', spin: 'prop', emissive: true, segments: 3 },
      ],
    }],
  });
  const pr = VEH.vehicleRecipe('probe/slots');
  eq('5n: body slot', pr.primitives[0].color, '#112233');
  eq('5o: accent slot', pr.primitives[1].color, '#445566');
  eq('5p: glass slot', pr.primitives[2].color, VEH.VEHICLE_GLASS);
  eq('5q: dark slot', pr.primitives[3].color, VEH.VEHICLE_DARK);
  eq('5r: literal hex passes through', pr.primitives[4].color, '#abcdef');
  eq('5s: absent color falls back to body', pr.primitives[5].color, '#112233');
  eq('5t: 2-tuple cone size padded to 3', pr.primitives[6].size.length, 3);
  ok('5u: recipe memoized (same object identity)', VEH.vehicleRecipe('probe/slots') === pr);
  VEH.setVehiclePacksConfig({ probe: { active: false } });
  ok('5v: memo invalidated by a config change', VEH.vehicleRecipe('probe/slots') === null);
  VEH.setVehiclePacksConfig(undefined);
  ok('5w: recipe returns after re-enabling', !!VEH.vehicleRecipe('probe/slots'));
  ok('5x: unknown id → null recipe', VEH.vehicleRecipe('nope/nope') === null);
  VEH.unregisterVehiclePack('probe');

  // ═══ 6. geometry.resolveFurnitureDef hook ═══════════════════════════════
  // Same bundle as the registry above, so the packs registered in §4 are live.
  {
    GEO.setVehiclePacksConfig(undefined);
    GEO.registerVehiclePack(fic, 'builtin');
    ok('6a: fiction pack registered but unloaded', GEO.resolveVehicleDef(FIC_ID) === null);
    const pieceV = { id: 'f1', x: 0, y: 0, w: 1, h: 1, kind: 'block', vehicleModelId: CIVIL_ID };
    const d = GEO.resolveFurnitureDef(pieceV, []);
    eq('6b: vehicle piece resolves to the model recipe', d.label, civil.models[0].label);
    eq('6c: resolved def carries the model footprint', d.w, civil.models[0].dims[0]);
    ok('6d: resolved def carries primitives', Array.isArray(d.primitives) && d.primitives.length > 0);

    const pieceF = { id: 'f2', x: 0, y: 0, w: 1, h: 1, kind: 'block', vehicleModelId: FIC_ID };
    const df = GEO.resolveFurnitureDef(pieceF, []);
    eq('6e: unloaded-pack vehicle falls back to block', df.label, 'Block');

    // A vehicle reference WINS over a custom recipe on the same piece.
    const custom = { id: 'rec1', label: 'CustomThing', w: 10, h: 10, ht: 10, color: 1, primitives: [] };
    const both = { id: 'f3', x: 0, y: 0, w: 1, h: 1, kind: 'block',
                   vehicleModelId: CIVIL_ID, customKindId: 'rec1' };
    eq('6f: vehicleModelId wins over customKindId',
       GEO.resolveFurnitureDef(both, [custom]).label, civil.models[0].label);
    // …but a DEAD vehicle ref still lets the custom recipe through.
    const dead = { id: 'f4', x: 0, y: 0, w: 1, h: 1, kind: 'block',
                   vehicleModelId: FIC_ID, customKindId: 'rec1' };
    eq('6g: dead vehicle ref falls through to the custom recipe',
       GEO.resolveFurnitureDef(dead, [custom]).label, 'CustomThing');
    // No vehicle field → byte-identical legacy behaviour.
    const plain = { id: 'f5', x: 0, y: 0, w: 1, h: 1, kind: 'chair' };
    eq('6h: plain kinds unaffected', GEO.resolveFurnitureDef(plain, []).label, 'Chair');
    eq('6i: custom-only piece unaffected',
       GEO.resolveFurnitureDef({ id: 'f6', x: 0, y: 0, w: 1, h: 1, kind: 'block', customKindId: 'rec1' }, [custom]).label,
       'CustomThing');
  }

  // ═══ 7. Persisted config SHAPE (Store.vehiclePacks) ══════════════════════
  // The planner hands store.vehiclePacks straight to setVehiclePacksConfig, so
  // the shape must stay structurally identical to AvatarPackConfig.
  const cfgRoundTrip = { 'base-ground-civil': { loaded: true, active: true, members: [CIVIL_ID] } };
  VEH.setVehiclePacksConfig(cfgRoundTrip);
  ok('7a: config round-trips by identity', VEH.getVehiclePacksConfig() === cfgRoundTrip);
  eq('7b: subset of one → one active id from that pack',
     VEH.activeVehicleIds().filter(id => id.startsWith('base-ground-civil/')).length, 1);
  VEH.setVehiclePacksConfig(undefined);
  ok('7c: undefined config restores pack defaults', !!VEH.resolveVehicleDef(CIVIL_ID));

  // ═══ 8. Shipped-model geometry pins ══════════════════════════════════════
  // One measurement per correction from the 2026-08-05 visual review, so a fix
  // cannot silently revert. Everything here is computed from the PRIM DATA (an
  // exact rotated AABB — the recipe builder applies rot as a THREE 'XYZ' Euler
  // and nothing else), never eyeballed.
  {
    const mdl = (id) => {
      for (const p of PACKS) { const m = p.models.find(x => x.id === id); if (m) return m; }
      return null;
    };
    const one = (m, pred, what) => {
      const hits = m.prims.filter(pred);
      ok(`8·${what}: exactly one matching prim`, hits.length === 1, `n=${hits.length}`);
      return hits[0] ?? null;
    };
    const le = (name, a, b, extra = '') => ok(name, a <= b, `${extra} ${a} <= ${b}`);
    const ge = (name, a, b, extra = '') => ok(name, a >= b, `${extra} ${a} >= ${b}`);

    // 8a. Willys spare wheel: the tyre FACE is parallel to the rear panel, i.e.
    // the cylinder axis runs along Z. Measured, not asserted on the rot literal:
    // the AABB must be WIDER across the car than it is deep along it.
    {
      const m = mdl('base-ground-military/jeep_willys');
      const sp = one(m, p => p.shape === 'cylinder' && p.pos[2] > 1400, 'jeep-spare');
      if (sp) {
        const b = bb(sp);
        const dx = b.max[0] - b.min[0], dz = b.max[2] - b.min[2];
        ok('8a: jeep spare tyre faces the rear panel (dx >> dz)', dx > dz * 2, `dx=${dx} dz=${dz}`);
        ok('8a2: jeep spare sits on the rear panel, not on the ground', b.min[1] > 200, String(b.min[1]));
      }
    }

    // 8b. Time-machine car: gullwing doors CLOSED — nothing on the door line may
    // break the roofline or the declared half-width (raised doors did both).
    {
      const m = mdl('franchise-ground-fiction/time_machine_car');
      const doors = m.prims.filter(p => Math.abs(p.pos[0]) > m.dims[0] * 0.4 && p.pos[1] > 400);
      eq('8b: two door prims', doors.length, 2);
      const top = Math.max(...doors.map(d => bb(d).max[1]));
      const wide = Math.max(...doors.map(d => bb(d).max[0]));
      le('8b2: closed doors stay under the declared roofline', top, m.dims[2], 'door top');
      le('8b3: closed doors stay inside the declared half-width', wide, m.dims[0] / 2, 'door |x|');
      ok('8b4: doors are not tilted open', doors.every(d => !d.rot || d.rot[2] === 0));
    }

    // 8c. Armored hero car: the rear engine cover is a LOW hump — under the
    // canopy and under three quarters of the car's declared height.
    {
      const m = mdl('franchise-ground-fiction/armored_hero_car');
      const turb = one(m, p => p.shape === 'cylinder' && p.pos[2] > 1500 && p.size[2] >= 500,
                       'hero-turbine');
      const canopy = one(m, p => p.color === 'glass', 'hero-canopy');
      if (turb && canopy) {
        le('8c: engine cover under 0.75 × the declared height', bb(turb).max[1], m.dims[2] * 0.75);
        le('8c2: engine cover no taller than the cockpit canopy',
           bb(turb).max[1], bb(canopy).max[1]);
      }
    }

    // 8d. Racing compact: thin, contoured stripes that stay ON the bodywork —
    // no tall slabs, and nothing overhanging the nose or tail as a blocky end.
    {
      const m = mdl('franchise-ground-fiction/racing_compact');
      const body = m.prims[0];
      const stripes = m.prims.filter(p => p.color === 'accent' || p.color === '#2f5fbf');
      eq('8d: nine stripe segments (3 lanes × hood / roof / deck)', stripes.length, 9);
      ok('8d2: every stripe is a thin skin (<= 100 mm)',
         stripes.every(s => s.size[1] <= 100), JSON.stringify(stripes.map(s => s.size[1])));
      const zLo = Math.min(...stripes.map(s => bb(s).min[2]));
      const zHi = Math.max(...stripes.map(s => bb(s).max[2]));
      ok('8d3: no stripe overhangs the nose or tail',
         zLo >= bb(body).min[2] && zHi <= bb(body).max[2], `${zLo}..${zHi}`);
      le('8d4: stripes stay under the roofline',
         Math.max(...stripes.map(s => bb(s).max[1])), m.dims[2]);
      ok('8d5: the hood and deck lanes are ANGLED (rot.x)',
         stripes.filter(s => s.rot && s.rot[0] !== 0).length === 6,
         String(stripes.filter(s => s.rot && s.rot[0] !== 0).length));
      const bumpers = m.prims.filter(p => p.shape === 'cylinder' && p.size[2] > 1000);
      eq('8d6: two ROUNDED bumpers replace the old blocky ends', bumpers.length, 2);
      ok('8d7: bumpers are slim', bumpers.every(b => b.size[0] <= 120));
    }

    // 8e. School bus: the grille lives on the front face at/below hood level, and
    // nothing at all floats above the hood ahead of it.
    {
      const m = mdl('base-ground-civil/school_bus');
      const hood = one(m, p => p.color === 'body' && p.pos[2] < -3000, 'bus-hood');
      const grille = one(m, p => p.color === 'accent' && p.pos[2] < -4000, 'bus-grille');
      if (hood && grille) {
        const hoodTop = bb(hood).max[1], hoodFront = bb(hood).min[2];
        le('8e: grille sits at or below the hood line', bb(grille).max[1], hoodTop);
        ok('8e2: grille is on the hood front face',
           bb(grille).min[2] <= hoodFront && bb(grille).max[2] > hoodFront,
           `${bb(grille).min[2]}..${bb(grille).max[2]} vs ${hoodFront}`);
        const floaters = m.prims.filter(p => bb(p).max[1] > hoodTop && bb(p).max[2] < hoodFront + 400);
        eq('8e3: nothing floats above the hood at the nose', floaters.length, 0);
      }
    }

    // 8f. Semi truck: the trailer's nose OVERLAPS the tractor frame — no daylight
    // at the coupling, in both the length and the height axis.
    {
      const m = mdl('base-ground-civil/semi_truck');
      const frame = one(m, p => p.color === 'body' && p.size[2] === 6200, 'semi-frame');
      const trailer = one(m, p => p.size[2] > 12000, 'semi-trailer');
      if (frame && trailer) {
        const dz = bb(frame).max[2] - bb(trailer).min[2];
        const dy = bb(frame).max[1] - bb(trailer).min[1];
        ge('8f: trailer nose overlaps the fifth wheel along Z', dz, 200, 'overlap');
        ge('8f2: …and shares height with the frame', dy, 100, 'overlap');
      }
    }

    // 8g. Pickup: short hood, tall cab.
    {
      const m = mdl('base-ground-civil/pickup');
      const hood = one(m, p => p.color === 'body' && p.pos[2] < -1800 && p.pos[1] > 800, 'pickup-hood');
      const cab = one(m, p => p.color === 'body' && p.size[1] > 900, 'pickup-cab');
      if (hood && cab) {
        le('8g: hood no longer than 1200 mm', hood.size[2], 1200);
        ge('8g2: cab roof at least 1750 mm up', bb(cab).max[1], 1750);
        ge('8g3: the cab is taller than the hood is long', bb(cab).max[1], hood.size[2]);
      }
    }

    // 8h. Ambulance: the light bar RESTS on the cab roof (its underside inside
    // the roof, never floating above it).
    {
      const m = mdl('base-ground-civil/ambulance');
      const cab = one(m, p => p.color === 'body' && p.pos[2] < -1500 && p.size[1] > 1000, 'amb-cab');
      const bar = one(m, p => p.color === 'accent' && p.size[0] === 1700, 'amb-bar');
      if (cab && bar) {
        const roof = bb(cab).max[1], under = bb(bar).min[1];
        le('8h: light bar is seated on the cab roof', under, roof, 'bar underside');
        ge('8h2: …and not sunk through it', under, roof - 120, 'bar underside');
      }
    }

    // 8h3. Fire engine + police cruiser: the same light-bar contract as the
    // ambulance — seated on the roof (never floating), and the two-color bar
    // pieces never share (or nearly share) face planes: the smaller centre
    // piece is strictly prouder in BOTH y and z.
    {
      const fe = mdl('base-ground-civil/fire_engine');
      const cab = one(fe, p => p.color === 'body' && p.pos[2] < -2000 && p.size[1] > 1000, 'fe-cab');
      const red = one(fe, p => p.size[0] === 1900, 'fe-bar-red');
      const blue = one(fe, p => p.size[0] === 900 && p.pos[1] > 2000, 'fe-bar-blue');
      if (cab && red && blue) {
        le('8h3: fire-engine bar seated on the crew-cab roof', bb(red).min[1], bb(cab).max[1], 'bar underside');
        ge('8h3b: …and not sunk through it', bb(red).min[1], bb(cab).max[1] - 120, 'bar underside');
        ok('8h3c: blue centre strictly prouder than red in y AND z',
          blue.size[1] > red.size[1] && blue.size[2] > red.size[2],
          `blue=${blue.size[1]}x${blue.size[2]} red=${red.size[1]}x${red.size[2]}`);
      }
      const pc = mdl('base-ground-civil/police_cruiser');
      const cabin = one(pc, p => p.color === 'body' && p.size[2] === 2200, 'pc-cabin');
      const pBlue = one(pc, p => p.size[0] === 1300, 'pc-bar-blue');
      const pRed = one(pc, p => p.size[0] === 620, 'pc-bar-red');
      if (cabin && pBlue && pRed) {
        le('8h4: cruiser bar seated on the cabin roof', bb(pBlue).min[1], bb(cabin).max[1], 'bar underside');
        ok('8h4b: red centre strictly prouder than blue in y AND z (no near-coplanar shimmer)',
          pRed.size[1] > pBlue.size[1] + 10 && pRed.size[2] > pBlue.size[2] + 10,
          `red=${pRed.size[1]}x${pRed.size[2]} blue=${pBlue.size[1]}x${pBlue.size[2]}`);
      }
    }

    // 8i. Tanks: the tracks read as tracks — wide belts, still inside the
    // declared footprint.
    for (const [id, minW] of [['base-ground-military/sherman', 600],
                              ['base-ground-military/abrams', 800]]) {
      const m = mdl(id);
      const slabs = m.prims.filter(p => p.shape === 'box' && p.color === 'dark' && p.size[2] > 3000);
      ok(`8i ${id}: two track slabs`, slabs.length === 2, String(slabs.length));
      for (const s of slabs) {
        ge(`8i ${id}: track belt width`, s.size[0], minW);
        le(`8i ${id}: track stays inside the footprint`, bb(s).max[0], m.dims[0] / 2);
      }
    }

    // 8j. The two Space rovers: ground surface, space category, real names.
    for (const id of ['base-space-real/lunar_rover', 'base-space-real/mars_rover']) {
      const m = mdl(id);
      ok(`8j ${id}: exists`, !!m);
      if (!m) continue;
      eq(`8j ${id}: category is space`, m.category, 'space');
      eq(`8j ${id}: surface is ground only`, m.surfaces.join(','), 'ground');
      ok(`8j ${id}: not a vertical-launch craft`, !m.vertical);
      const wheels = m.prims.filter(p => p.shape === 'cylinder' && p.rot && p.rot[2] === 90);
      ge(`8j ${id}: rolled wheels`, wheels.length, 4);
    }
    eq('8j2: the Space pack still flies three launch vehicles',
       byId('base-space-real').models.filter(m => m.vertical).length, 3);

    // ═══ 9. Second-wave civil roster (2026-08-06) ═════════════════════════
    // The eleven everyday street models. Every member already rides §2's
    // generic sanity sweep; these are the per-member SIGNATURE-CUE pins —
    // the same "a fix cannot silently revert" contract §8 gives the first
    // wave, measured off the prim data, never eyeballed.
    const WAVE2 = ['sedan', 'hatchback', 'minivan', 'delivery_van', 'box_truck',
      'garbage_truck', 'tow_truck', 'rv_camper', 'tractor', 'golf_cart', 'bicycle'];
    eq('9z: the civil pack carries 20 members', civil.models.length, 20);
    eq('9z2: pack version bumped (thumb-cache key)', civil.version, 5);
    for (const name of WAVE2) {
      const id = `base-ground-civil/${name}`;
      const m = mdl(id);
      ok(`9a ${name}: member exists`, !!m);
      if (!m) continue;
      ok(`9b ${name}: resolves through the registry`, !!VEH.resolveVehicleDef(id));
      const rec = VEH.vehicleRecipe(id);
      ok(`9c ${name}: recipe converts`, !!rec);
      if (rec) {
        eq(`9d ${name}: recipe footprint == dims`,
           `${rec.w}x${rec.h}x${rec.ht}`, `${m.dims[0]}x${m.dims[1]}x${m.dims[2]}`);
        eq(`9e ${name}: recipe cat is vehicle`, rec.cat, 'vehicle');
      }
      eq(`9f ${name}: lenMm == declared depth`, m.lenMm, m.dims[1]);
      eq(`9g ${name}: era tagged`, m.era, 'contemporary');
      // (The floating-part / coincident-face invariants these rows used to pin
      // for the second wave alone are now §2n / §2o, applied to EVERY member of
      // EVERY pack — see the note there.)
    }

    // Per-model signature cues.
    {
      // Sedan: a real THREE-box — the trunk deck sits aft of the cabin and
      // below its roofline, and the belt trim is proud of the body sides.
      const m = mdl('base-ground-civil/sedan');
      const cabin = one(m, p => p.color === 'body' && p.size[2] === 2100, 'sedan-cabin');
      const trunk = one(m, p => p.color === 'body' && p.pos[2] > 1000, 'sedan-trunk');
      const trim = one(m, p => p.color === 'accent', 'sedan-trim');
      const lower = m.prims[0];
      if (cabin && trunk && trim) {
        ge('9j: trunk deck is aft of the cabin', bb(trunk).min[2], bb(cabin).max[2] - 10);
        le('9j2: trunk deck stays below the cabin roof', bb(trunk).max[1], bb(cabin).max[1]);
        ge('9j3: belt trim is proud of the body sides', trim.size[0], lower.size[0] + 20);
      }
    }
    {
      // Hatchback: the rear screen is RAKED (rot about X) and lives at the tail.
      const m = mdl('base-ground-civil/hatchback');
      const screen = one(m, p => p.color === 'glass' && !!p.rot, 'hatch-screen');
      const cabin = one(m, p => p.color === 'body' && p.size[2] === 2500, 'hatch-cabin');
      if (screen && cabin) {
        ok('9k: rear screen is raked', screen.rot[0] !== 0, String(screen.rot[0]));
        ge('9k2: rear screen is at the tail', screen.pos[2], cabin.pos[2] + 800);
        // Two-box: the cabin runs most of the length (no separate trunk box).
        ge('9k3: cabin spans over half the vehicle', cabin.size[2], m.dims[1] * 0.5);
      }
    }
    {
      // Minivan: ONE box — a SLOPED short hood feeding a tall greenhouse, plus
      // the sliding-door rub rail proud of the flanks.
      const m = mdl('base-ground-civil/minivan');
      const hood = one(m, p => p.color === 'body' && !!p.rot, 'van-hood');
      const green = one(m, p => p.color === 'body' && p.size[2] === 3400, 'van-greenhouse');
      const rail = one(m, p => p.color === 'accent', 'van-rail');
      if (hood && green && rail) {
        ok('9l: hood is sloped', hood.rot[0] !== 0, String(hood.rot[0]));
        le('9l2: hood is short', hood.size[2], 1000);
        ge('9l3: greenhouse is tall', bb(green).max[1], m.dims[2] * 0.9);
        ge('9l4: rub rail proud of the body', rail.size[0], 1890);
      }
    }
    {
      // Delivery van: the cargo box is FLUSH with the cab (same roofline order)
      // and its front overlaps the cab — one continuous body, not two lumps.
      const m = mdl('base-ground-civil/delivery_van');
      const cab = one(m, p => p.color === 'body' && p.size[2] === 1500, 'dv-cab');
      const cargo = one(m, p => p.color === 'body' && p.size[2] === 4400, 'dv-cargo');
      if (cab && cargo) {
        ge('9m: cargo front overlaps the cab', bb(cab).max[2] - bb(cargo).min[2], 100);
        ge('9m2: cargo box is tall', bb(cargo).max[1], m.dims[2] * 0.9);
        le('9m3: cargo box is flush with the cab in width',
           Math.abs(cargo.size[0] - cab.size[0]), 120);
      }
    }
    {
      // Box truck: a SEPARATE box, strictly taller AND wider than the cab, whose
      // nose overhangs the cab roof.
      const m = mdl('base-ground-civil/box_truck');
      const cab = one(m, p => p.color === 'body' && p.size[1] === 1500, 'bt-cab');
      const boxb = one(m, p => p.color === 'accent' && p.size[2] === 5050, 'bt-box');
      const nose = one(m, p => p.color === 'accent' && p.size[1] === 700, 'bt-nose');
      if (cab && boxb && nose) {
        ge('9n: box is taller than the cab', bb(boxb).max[1] - bb(cab).max[1], 500);
        ge('9n2: box is wider than the cab', boxb.size[0] - cab.size[0], 60);
        ge('9n3: box nose overhangs the cab', bb(cab).max[2] - bb(nose).min[2], 500);
        ge('9n4: …and sits on the cab roof', bb(nose).max[1], bb(cab).max[1] + 400);
      }
    }
    {
      // Garbage truck: cab-over (the cab reaches the nose), a SLOPED rear
      // packer panel, and forks standing ahead of the cab.
      const m = mdl('base-ground-civil/garbage_truck');
      const cab = one(m, p => p.color === 'body' && p.size[2] === 1900, 'gt-cab');
      const packer = one(m, p => p.color === 'body' && !!p.rot, 'gt-packer');
      const forks = m.prims.filter(p => p.color === 'accent' && p.pos[2] < -4000);
      if (cab && packer) {
        le('9o: cab-over — the cab reaches the nose', bb(cab).min[2], -m.dims[1] / 2 + 400);
        ok('9o2: rear packer is sloped', packer.rot[0] !== 0, String(packer.rot[0]));
        ge('9o3: packer is at the tail', packer.pos[2], 3000);
        eq('9o4: three front-loader fork parts', forks.length, 3);
        le('9o5: forks stand ahead of the cab nose',
           Math.max(...forks.map(f => bb(f).max[2])), bb(cab).min[2]);
      }
    }
    {
      // Tow truck: the deck TILTS (rear end lower than the front), an amber bar
      // is seated on the cab roof, and the boom rises toward the rear.
      const m = mdl('base-ground-civil/tow_truck');
      const deck = one(m, p => p.color === 'accent' && p.size[2] === 4200, 'tt-deck');
      const cab = one(m, p => p.color === 'body' && p.size[1] === 1200, 'tt-cab');
      const bar = one(m, p => p.size[0] === 1600, 'tt-bar');
      const boom = one(m, p => p.size[2] === 2800, 'tt-boom');
      if (deck && cab && bar && boom) {
        ok('9p: deck tilts rear-down', deck.rot && deck.rot[0] > 0, JSON.stringify(deck.rot));
        le('9p2: light bar seated on the cab roof', bb(bar).min[1], bb(cab).max[1]);
        ge('9p3: …and not sunk through it', bb(bar).min[1], bb(cab).max[1] - 120);
        ok('9p4: boom rises toward the rear', boom.rot && boom.rot[0] < 0, JSON.stringify(boom.rot));
        ge('9p5: boom tops out above the cab', bb(boom).max[1], bb(cab).max[1] + 400);
      }
    }
    {
      // RV camper: the class-C tell — a bunk box OVERHANGING the cab nose —
      // plus the beltline stripe and a roof AC box seated on the coach.
      const m = mdl('base-ground-civil/rv_camper');
      const cab = one(m, p => p.color === 'body' && p.size[2] === 1800, 'rv-cab');
      const bunk = one(m, p => p.color === 'body' && p.size[1] === 800, 'rv-bunk');
      const coach = one(m, p => p.color === 'body' && p.size[2] === 5400, 'rv-coach');
      const ac = one(m, p => p.color === 'accent' && p.size[0] === 900, 'rv-ac');
      if (cab && bunk && coach && ac) {
        le('9q: bunk overhangs the cab nose', bb(bunk).min[2], bb(cab).min[2] - 100);
        ge('9q2: bunk sits above the cab', bb(bunk).min[1], bb(cab).max[1] - 120);
        le('9q3: roof AC seated on the coach roof', bb(ac).min[1], bb(coach).max[1]);
        ge('9q4: …and not sunk through it', bb(ac).min[1], bb(coach).max[1] - 120);
      }
    }
    {
      // Tractor: the whole point — BIG rear wheels, small front wheels.
      const m = mdl('base-ground-civil/tractor');
      const wheels = m.prims.filter(p => p.shape === 'cylinder' && p.rot && p.rot[2] === 90);
      eq('9r: four road wheels', wheels.length, 4);
      const rear = wheels.filter(w => w.pos[2] > 0), front = wheels.filter(w => w.pos[2] < 0);
      eq('9r2: two rear + two front', `${rear.length}/${front.length}`, '2/2');
      if (rear.length === 2 && front.length === 2) {
        ge('9r3: rear wheels are much bigger', rear[0].size[0] / front[0].size[0], 1.7);
        ok('9r4: every wheel still sits on the ground',
           wheels.every(w => Math.abs(bb(w).min[1]) < 1), '');
      }
      const cab = one(m, p => p.color === 'body' && p.size[2] === 1500, 'tr-cab');
      if (cab) ge('9r5: cab is set high over the rear axle', bb(cab).min[1], 1400);
    }
    {
      // Golf cart: OPEN sides — no glass at all — under four posts and a flat
      // canopy, with the bag rack off the tail.
      const m = mdl('base-ground-civil/golf_cart');
      eq('9s: no glass anywhere (open sides)', m.prims.filter(p => p.color === 'glass').length, 0);
      const posts = m.prims.filter(p => p.shape === 'box' && p.size[0] === 80 && p.size[1] === 900);
      eq('9s2: four canopy posts', posts.length, 4);
      const roof = one(m, p => p.color === 'accent' && p.size[2] === 1900, 'gc-roof');
      if (roof && posts.length === 4) {
        ge('9s3: canopy sits on top of the posts',
           bb(roof).min[1], Math.max(...posts.map(q => bb(q).max[1])) - 60);
        le('9s4: canopy stays near the declared height', bb(roof).max[1], m.dims[2]);
      }
      const rack = m.prims.filter(p => p.color === 'accent' && p.pos[2] > 800);
      eq('9s5: two bag-rack parts at the tail', rack.length, 2);
      const wheels = m.prims.filter(p => p.shape === 'cylinder');
      ok('9s6: tiny wheels', wheels.length === 4 && wheels.every(w => w.size[0] <= 260),
         JSON.stringify(wheels.map(w => w.size[0])));
    }
    {
      // Bicycle: two big thin wheels + an angled diamond frame.
      const m = mdl('base-ground-civil/bicycle');
      const wheels = m.prims.filter(p => p.shape === 'cylinder' && p.rot && p.rot[2] === 90
        && p.color === 'dark' && p.size[0] >= 300);
      eq('9t: exactly two road wheels', wheels.length, 2);
      if (wheels.length === 2) {
        ok('9t2: wheels are big and thin',
           wheels.every(w => w.size[0] >= 300 && w.size[2] <= 80),
           JSON.stringify(wheels.map(w => [w.size[0], w.size[2]])));
        ok('9t3: both wheels roll on the ground',
           wheels.every(w => Math.abs(bb(w).min[1]) < 1), '');
      }
      const tubes = m.prims.filter(p => p.shape === 'box' && p.rot && p.rot[0] !== 0);
      ge('9t4: at least five angled frame tubes', tubes.length, 5);
      ok('9t5: every frame tube is slim (<= 160 mm across)',
         tubes.every(t => t.size[0] <= 160), JSON.stringify(tubes.map(t => t.size[0])));
      const bar = one(m, p => p.shape === 'cylinder' && p.size[2] >= 400, 'bike-bar');
      const saddle = one(m, p => p.color === 'dark' && p.shape === 'box', 'bike-saddle');
      if (bar && saddle) {
        ge('9t6: handlebar is up front', -bar.pos[2], 300);
        ge('9t7: saddle is behind the handlebar', saddle.pos[2] - bar.pos[2], 600);
      }
    }
  }

  const passN = checks.filter(c => c.pass).length, total = checks.length;
  const fails = checks.filter(c => !c.pass);
  document.getElementById('out').textContent =
    `packs=${PACKS.length} models=${modelCount}\n\n` +
    fails.map(c => `FAIL ${c.name}  ${c.extra}`).join('\n') + `\n\n${passN}/${total}`;
  document.title = `VEHICLEPACK ${passN === total ? 'PASS' : 'FAIL'} ${passN}/${total}`;
 } catch (e) {
  document.title = 'VEHICLEPACK ERR: ' + (e && e.stack ? e.stack.split('\n').slice(0, 4).join(' | ') : e);
 }
</script>
