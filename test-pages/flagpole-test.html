<!doctype html>
<meta charset="utf-8">
<title>FLAGPOLE …</title>
<style>html,body{margin:0;background:#111;color:#cfd8dc;font:12px monospace}#c{width:1280px;height:880px}#log{padding:8px;white-space:pre-wrap}</style>
<div id="c"></div>
<div id="log"></div>
<!-- Yard flagpole fixture + two ground LightIconKinds. Seams:
       (1) pure flag library (flags.mod.js):
             npx esbuild src/flags.ts --bundle --format=esm --outfile=<H>/flags.mod.js
       (2) pure geometry helpers (geometry.mod.js — flagpoleHoistFraction, lightTilt):
             npx esbuild src/geometry.ts --bundle --format=esm --outfile=<H>/geometry.mod.js
       (3) storage repairFloor backfill (storage.mod.js):
             npx esbuild src/storage.ts --bundle --format=esm --outfile=<H>/storage.mod.js
       (4) 2D draw no-throw (canvas-render.mod.js, pure/no-three):
             npx esbuild src/canvas-render.ts --bundle --format=esm --outfile=<H>/canvas-render.mod.js
       (5) 3D build (flag planes / ripple / hoist / inground+ground_spot) via the
           built three-renderer chunk (./assets/three-renderer.js).
       (6) config-path + deleteSelection via the REAL Planner (planner.mod.js,
           same fake-HaApi/fake-avatar-store build as config-test):
             T=$(mktemp -d); cp -r src/* "$T"/; cp test-pages/fake-avatar-store.ts "$T"/avatar-store.ts
             npx esbuild "$T"/planner.ts --bundle --format=esm --outfile=<H>/planner.mod.js
     Asserts machine-checkable in document.title. -->
<script type="module">
  const V = '?v=' + Date.now();
  const flags = await import('./flags.mod.js' + V);
  const geom  = await import('./geometry.mod.js' + V);
  const store = await import('./storage.mod.js' + V);
  const cr    = await import('./canvas-render.mod.js' + V);
  const mod   = await import('./assets/three-renderer.js' + V);
  const { Planner } = await import('./planner.mod.js' + V);

  const results = [];
  const assert = (name, cond, detail = '') => results.push({ name, ok: !!cond, detail: String(detail) });
  const near = (a, b, t = 1e-6) => Math.abs(a - b) <= t;
  const { FLAG_PAINTERS, flagEntry, flagDominant, DEFAULT_FLAG } = flags;
  const { flagpoleHoistFraction, lightTilt, FLAGPOLE_DEFAULTS } = geom;

  // ── (1) pure flag library ────────────────────────────────────────────────
  const ids = Object.keys(FLAG_PAINTERS);
  assert('≥16 flags registered', ids.length >= 16, `n=${ids.length}`);
  assert('DEFAULT_FLAG is usa', DEFAULT_FLAG === 'usa');
  assert('flagEntry(undefined) → default', flagEntry(undefined).label === FLAG_PAINTERS.usa.label);
  assert('flagEntry(unknown) → default (no throw)', flagEntry('zzz_bogus').label === FLAG_PAINTERS.usa.label);
  assert('flagDominant(usa) is a hex', /^#[0-9a-f]{6}$/i.test(flagDominant('usa')));
  // Every painter: paints without throwing + non-blank (fully painted + ≥2 colors)
  // + has a label + a hex dominant.
  let allPaint = true, allNonBlank = true, allMeta = true;
  const badPaint = [], badBlank = [];
  for (const id of ids) {
    const e = FLAG_PAINTERS[id];
    if (typeof e.label !== 'string' || !e.label || !/^#[0-9a-f]{6}$/i.test(e.dominant)) allMeta = false;
    const cv = document.createElement('canvas'); cv.width = 60; cv.height = 36;
    const g = cv.getContext('2d');
    try { e.paint(g, cv.width, cv.height); }
    catch (err) { allPaint = false; badPaint.push(id); continue; }
    const data = g.getImageData(0, 0, cv.width, cv.height).data;
    let fullyPainted = true; const seen = new Set();
    for (let i = 0; i < data.length; i += 4) {
      if (data[i + 3] !== 255) fullyPainted = false;
      seen.add((data[i] << 16) | (data[i + 1] << 8) | data[i + 2]);
    }
    if (!fullyPainted || seen.size < 2) { allNonBlank = false; badBlank.push(id); }
  }
  assert('every flag paints without throwing', allPaint, badPaint.join(','));
  assert('every flag is non-blank (fully painted, ≥2 colors)', allNonBlank, badBlank.join(','));
  assert('every flag has label + hex dominant', allMeta);

  // open_sign is asymmetric (text reads L→R) — proves it's worth double-facing.
  {
    const cv = document.createElement('canvas'); cv.width = 240; cv.height = 144;
    const g = cv.getContext('2d'); FLAG_PAINTERS.open_sign.paint(g, cv.width, cv.height);
    const white = (x0, x1) => {   // count white-ish pixels in a vertical band
      const d = g.getImageData(x0, 40, x1 - x0, 64).data; let n = 0;
      for (let i = 0; i < d.length; i += 4) if (d[i] > 200 && d[i + 1] > 200 && d[i + 2] > 200) n++;
      return n;
    };
    // "OPEN": the 'O' occupies the left third, 'N' the right third — both have ink,
    // and the exact-center gap between letters differs from the letter columns →
    // horizontally asymmetric (not blank/symmetric fill).
    const left = white(24, 72), mid = white(108, 132), right = white(168, 216);
    assert('open_sign has ink both sides (readable text)', left > 20 && right > 20, `L=${left} R=${right}`);
    assert('open_sign is horizontally asymmetric', Math.abs(left - right) + Math.abs(left - mid) > 5, `L=${left} M=${mid} R=${right}`);
  }

  // ── (2) pure flagpoleHoistFraction + lightTilt ───────────────────────────
  const stOf = (id, s, attrs) => ({ state: s, attributes: attrs || {}, entity_id: id });
  assert('unbound → full (1)',        flagpoleHoistFraction({}, null) === 1);
  assert('unbound halfMast → 0.5',    flagpoleHoistFraction({ halfMast: true }, null) === 0.5);
  assert('sensor 30% → 0.3',          near(flagpoleHoistFraction({ entityId: 'sensor.h' }, stOf('sensor.h', '30')), 0.3));
  assert('number 100% → 1',           flagpoleHoistFraction({ entityId: 'number.h' }, stOf('number.h', '100')) === 1);
  assert('cover pos 60 → 0.6',        near(flagpoleHoistFraction({ entityId: 'cover.h' }, stOf('cover.h', 'open', { current_position: 60 })), 0.6));
  assert('cover open (no pos) → 1',   flagpoleHoistFraction({ entityId: 'cover.h' }, stOf('cover.h', 'open')) === 1);
  assert('cover closed (no pos) → 0', flagpoleHoistFraction({ entityId: 'cover.h' }, stOf('cover.h', 'closed')) === 0);
  assert('entity WINS over halfMast', near(flagpoleHoistFraction({ entityId: 'sensor.h', halfMast: true }, stOf('sensor.h', '30')), 0.3));
  assert('bound but no reading → falls back', flagpoleHoistFraction({ entityId: 'sensor.h', halfMast: true }, null) === 0.5);
  assert('clamp over 100 → 1',        flagpoleHoistFraction({ entityId: 'sensor.h' }, stOf('sensor.h', '180')) === 1);
  assert('lightTilt default 35',      lightTilt({}) === 35);
  assert('lightTilt clamp 2 → 5',     lightTilt({ tilt: 2 }) === 5);
  assert('lightTilt clamp 120 → 85',  lightTilt({ tilt: 120 }) === 85);

  // ── (3) storage repairFloor backfill ─────────────────────────────────────
  {
    const f = store.repairFloor({ id: 'z', name: 'Z', w: 4000, d: 4000 });
    assert('repairFloor backfills flagpoles []', Array.isArray(f.flagpoles) && f.flagpoles.length === 0);
  }

  // ── (5) renderer: flagpole build / hoist / ripple / non-mirror ───────────
  const r = new mod.ThreeDRenderer(document.getElementById('c'));
  await r.load();
  const scene3d = { preset: 'day', floorColor: '#8a7860', floorTex: 'none', wallColor: '#cfd2d6' };
  const mkFloor = (extra) => Object.assign({
    id: 'f1', name: 'T', w: 8000, d: 6000,
    walls: [], furniture: [], lights: [], switches: [], sensors: [], motionSensors: [], envSensors: [],
    doors: [], windows: [], bg: null, model3d: null, look3d: null, rooms: [],
  }, extra || {});
  const countGeo = (g, ctor) => { let n = 0; g.traverse(o => { if (o.isMesh && o.geometry && o.geometry.type === ctor) n++; }); return n; };

  const fpFull  = { id: 'full',  x: 1500, y: 3000, flag: 'usa' };
  const fpHalf  = { id: 'half',  x: 3000, y: 3000, flag: 'canada', halfMast: true };
  const fpEnt   = { id: 'ent30', x: 4500, y: 3000, flag: 'open_sign', entityId: 'sensor.h30' };
  const hoistSt = { 'sensor.h30': stOf('sensor.h30', '30') };
  r.updateFloor(mkFloor({ flagpoles: [fpFull, fpHalf, fpEnt] }), scene3d);
  r.updateFlagpoles([fpFull, fpHalf, fpEnt], id => hoistSt[id] || null, 0, 0);

  const rigOf = (id) => r._flagpoleRigs.find(x => x.id === id);
  const rFull = rigOf('full'), rHalf = rigOf('half'), rEnt = rigOf('ent30');
  assert('3 flag rigs built', !!rFull && !!rHalf && !!rEnt, `n=${r._flagpoleRigs.length}`);
  // Pole parts: ≥2 cylinders (tapered pole) + 1 sphere (finial) + exactly 2 planes.
  const poleGrp = r._flagpoleGroup.children[0];
  assert('pole = ≥2 cylinders (tapered)', countGeo(poleGrp, 'CylinderGeometry') >= 2);
  assert('pole has a finial sphere', countGeo(poleGrp, 'SphereGeometry') >= 1);
  assert('flag = exactly 2 planes (double-faced)', countGeo(rFull.assembly, 'PlaneGeometry') === 2);
  // Non-mirror: two planes SHARE one geometry + one material (map), back rotated π.
  const [front, back] = rFull.assembly.children;
  assert('flag planes share geometry', front.geometry === back.geometry);
  assert('flag planes share material + texture', front.material === back.material && front.material.map === back.material.map);
  assert('flag back plane rotated π (un-mirrored)', near(Math.abs(back.rotation.y), Math.PI, 1e-3), `y=${back.rotation.y}`);
  assert('flag front plane not rotated', near(front.rotation.y, 0, 1e-6));

  // Hoist Y ordering: full > half(checkbox) > entity 30%.
  const yFull = rFull.assembly.position.y, yHalf = rHalf.assembly.position.y, yEnt = rEnt.assembly.position.y;
  assert('hoist Y ordered full > half > entity30', yFull > yHalf && yHalf > yEnt, `full=${yFull.toFixed(0)} half=${yHalf.toFixed(0)} ent=${yEnt.toFixed(0)}`);
  // Entity 30% sits ~30% up its own travel range (fresh rig snaps to target).
  assert('entity-30 hoist ≈ 0.3 of travel', near((yEnt - rEnt.botY) / (rEnt.topY - rEnt.botY), 0.3, 0.02), `frac=${((yEnt - rEnt.botY) / (rEnt.topY - rEnt.botY)).toFixed(3)}`);

  // Eased hoist blend: entity drops 100% → 0%; a rebuild keeps the OLD eased
  // value (survives rebuild), then _advanceFlagpoles GLIDES it (not instant).
  {
    const st100 = { 'sensor.g': stOf('sensor.g', '100') };
    const fpG = { id: 'glide', x: 6000, y: 3000, flag: 'japan', entityId: 'sensor.g' };
    r.updateFloor(mkFloor({ flagpoles: [fpG] }), scene3d);
    r.updateFlagpoles([fpG], id => st100[id] || null, 0, 0);
    const rg0 = rigOf('glide'); const yStart = rg0.assembly.position.y;
    assert('glide starts at full (fresh snap)', near((yStart - rg0.botY) / (rg0.topY - rg0.botY), 1, 0.02));
    // Now target 0% — rebuild (survives), then advance ONE small step.
    const st0 = { 'sensor.g': stOf('sensor.g', '0') };
    r.updateFlagpoles([fpG], id => st0[id] || null, 0, 0);
    const rg = rigOf('glide');
    r._advanceFlagpoles(0.1, 1.0);
    const fracMid = (rg.assembly.position.y - rg.botY) / (rg.topY - rg.botY);
    assert('hoist eases (not instant) after target change', fracMid > 0.05 && fracMid < 0.95, `frac=${fracMid.toFixed(3)}`);
    for (let i = 0; i < 120; i++) r._advanceFlagpoles(0.1, 1 + i * 0.1);
    const fracEnd = (rg.assembly.position.y - rg.botY) / (rg.topY - rg.botY);
    assert('hoist settles toward lowered', fracEnd < 0.05, `frac=${fracEnd.toFixed(3)}`);
  }

  // Ripple: the shared flag geometry's position buffer mutates over frames, in
  // place (SAME buffer identity — zero alloc). Rebuild the 3-pole scene first.
  r.updateFloor(mkFloor({ flagpoles: [fpFull] }), scene3d);
  r.updateFlagpoles([fpFull], () => null, 0, 0);
  {
    const rig = rigOf('full');
    const arr0 = rig.geo.attributes.position.array;
    r._advanceFlagpoles(0.05, 1.0);
    const zA = Array.from(arr0);
    r._advanceFlagpoles(0.05, 1.7);
    const arr1 = rig.geo.attributes.position.array;
    assert('ripple mutates SAME buffer identity (zero-alloc)', arr1 === arr0);
    let changed = false;
    for (let i = 2; i < arr1.length; i += 3) if (Math.abs(arr1[i] - zA[i]) > 1e-4) { changed = true; break; }
    assert('ripple Z values change across frames', changed);
    // Amplitude grows toward the fly: a fly-end vertex ripples more than the hoist.
    let maxZ = 0, hoistZ = 0;
    const pos = rig.geo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const bx = rig.base[i * 3], z = Math.abs(pos.getZ(i));
      if (bx < 1) hoistZ = Math.max(hoistZ, z);
      if (bx > rig.fw - 1) maxZ = Math.max(maxZ, z);
    }
    assert('ripple amplitude grows toward the fly', maxZ > hoistZ + 1, `fly=${maxZ.toFixed(1)} hoist=${hoistZ.toFixed(1)}`);
  }

  // Flagpoles ride the FURNITURE layer (yard decor).
  r.setLayerVisibility({ furniture: false });
  assert('flagpole group hidden when furniture layer off', r._flagpoleGroup.visible === false);
  r.setLayerVisibility({ furniture: true });
  assert('flagpole group visible when furniture layer on', r._flagpoleGroup.visible === true);

  // ── (5b) inground + ground_spot light kinds ──────────────────────────────
  const on = (id) => ({ state: 'on', attributes: { brightness: 255 }, entity_id: id });
  // inground: emissive lens + tight glow RING, and NO standard floor pool disc
  // (CircleGeometry). The upward cone + ring use Cylinder/Ring, not Circle.
  {
    const lig = { id: 'lig', x: 2000, y: 2000, entity_id: 'light.ig', iconKind: 'inground', radius: 900 };
    r.updateLightsSwitches([lig], [], id => (id === 'light.ig' ? on(id) : null));
    const circ = countGeo(r._lightGroup, 'CircleGeometry');
    const ring = countGeo(r._lightGroup, 'RingGeometry');
    assert('inground: NO standard floor pool disc (0 CircleGeometry)', circ === 0, `circ=${circ}`);
    assert('inground: builds a tight glow RingGeometry', ring >= 1, `ring=${ring}`);
  }
  // ground_spot: beam cone carries userData.dir = world aim; for rotation 90 /
  // tilt 35 the aim is [cos35, sin35, 0]. Pool ellipse offset along the azimuth.
  {
    const gsp = { id: 'gsp', x: 3000, y: 2000, entity_id: 'light.gs', iconKind: 'ground_spot', rotation: 90, tilt: 35, radius: 900 };
    r.updateLightsSwitches([gsp], [], id => (id === 'light.gs' ? on(id) : null));
    let beamDir = null, poolOff = null;
    r._lightGroup.traverse(o => {
      if (o.userData && Array.isArray(o.userData.dir)) beamDir = o.userData.dir;
      if (o.userData && o.userData.groundPool && Array.isArray(o.userData.poolOffset)) poolOff = o.userData.poolOffset;
    });
    assert('ground_spot: beam carries a world aim dir', !!beamDir, JSON.stringify(beamDir));
    const t = 35 * Math.PI / 180;
    const exp = [Math.cos(t), Math.sin(t), 0];   // rot 90 → fdx=1, fdz=0
    assert('ground_spot beam aims per rotation+tilt (rot90/tilt35)',
      beamDir && near(beamDir[0], exp[0], 1e-3) && near(beamDir[1], exp[1], 1e-3) && near(beamDir[2], exp[2], 1e-3),
      JSON.stringify(beamDir));
    assert('ground_spot: ground pool offset along azimuth (+x, ~0 z)',
      poolOff && poolOff[0] > 100 && near(poolOff[1], 0, 1e-3), JSON.stringify(poolOff));
    // Low tilt = longer throw: tilt 20 pools farther than tilt 70.
    const throwFor = (tilt) => {
      const l2 = { id: 'gs2', x: 3000, y: 2000, entity_id: 'light.gs', iconKind: 'ground_spot', rotation: 90, tilt, radius: 900 };
      r.updateLightsSwitches([l2], [], () => on('light.gs'));
      let off = null; r._lightGroup.traverse(o => { if (o.userData && o.userData.groundPool) off = o.userData.poolOffset; });
      return off ? Math.hypot(off[0], off[1]) : 0;
    };
    const t20 = throwFor(20), t70 = throwFor(70);
    assert('ground_spot: low tilt = longer throw', t20 > t70, `t20=${t20.toFixed(0)} t70=${t70.toFixed(0)}`);
  }

  // ── (6) real Planner: config-path + deleteSelection + defaultFloor backfill ─
  class FakeHa {
    constructor() { this.states = {}; this._s = []; this._c = []; }
    connect() { for (const c of this._c) c('connected'); for (const s of this._s) s(this.states, undefined); }
    onState(f) { this._s.push(f); } onConn(f) { this._c.push(f); }
    callService() { return Promise.resolve(); }
    async getHistory() { return {}; } async getWeatherForecasts() { return null; }
    async getDevices() { return []; } async getEntityRegistry() { return []; }
    async updateEntityRegistry() { return true; }
    async getUserData() { return null; } async setUserData() { return true; }
    async refreshStates() {}
  }
  localStorage.removeItem('diorama:store:v1'); localStorage.removeItem('diorama:configs');
  const p = new Planner();
  p.connectWith(new FakeHa());
  const sleep = ms => new Promise(res => setTimeout(res, ms));
  for (let i = 0; i < 300 && !p.floor(); i++) await sleep(4);
  assert('defaultFloor backfills flagpoles []', Array.isArray(p.floor().flagpoles));

  p.uiMode = 'edit';
  const f0 = p.floor();
  f0.flagpoles = [{ id: 'fp1', x: 1000, y: 1000, flag: 'usa', entityId: 'sensor.mast_pct' }];
  // config-path: the hoist entity routes through the config channel.
  assert('flagpole hoist entity is config-path', p._isSlowEntity('sensor.mast_pct') === true);
  assert('unrelated entity is NOT config-path (scoped)', p._isSlowEntity('sensor.random_thing') === false);

  // deleteSelection removes the active flagpole.
  p.activeFlagpoleId = 'fp1';
  const removed = p.deleteSelection();
  assert('deleteSelection removes the active flagpole', removed === true && (p.floor().flagpoles || []).length === 0);
  assert('deleteSelection clears activeFlagpoleId', p.activeFlagpoleId === null);

  // ── (4) 2D draw no-throw ─────────────────────────────────────────────────
  {
    let threw = null;
    try {
      p.floor().flagpoles = [
        { id: 'd1', x: 1200, y: 1200, flag: 'usa', label: 'Front' },
        { id: 'd2', x: 2400, y: 1200, flag: 'ghost', halfMast: true },
        { id: 'd3', x: 3600, y: 1200, flag: 'checkered', entityId: 'sensor.mast_pct' },
      ];
      p.hass.states['sensor.mast_pct'] = stOf('sensor.mast_pct', '50');
      const cv = document.createElement('canvas'); cv.width = 640; cv.height = 480;
      const ctx = cv.getContext('2d');
      cr.drawAll(ctx, p, { ox: 0, oy: 0, scale: 0.05 }, null);
    } catch (e) { threw = e; }
    assert('2D drawAll (with flagpoles) does not throw', threw === null, threw && threw.message);
  }

  // ── render ────────────────────────────────────────────────────────────────
  const pass = results.filter(x => x.ok).length;
  const total = results.length;
  const fails = results.filter(x => !x.ok).map(x => x.name);
  document.getElementById('log').textContent = results.map(t => `${t.ok ? 'PASS' : 'FAIL'} ${t.name} — ${t.detail}`).join('\n');
  document.title = fails.length === 0 ? `FLAGPOLE PASS ${pass}/${total}` : `FLAGPOLE FAIL ${pass}/${total} [${fails.join(',')}]`;
</script>
