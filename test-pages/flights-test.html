      // (p) EMERGENCY alerts (research §2 / §5.5). The loudest trigger in the
      // feature: severity 'error', no 3 nm overhead gate, and — unlike every
      // other flight alert — an ACTIVE emergency must not age out of the 15 min
      // retention window while the aircraft is still declaring one.
      {
        calls.length = 0;
        handler = () => ring(1);
        const { p } = await boot(makeStore({
          weather: WEATHER, flights: { enabled: false, source: 'cloud', iss: false },
        }));
        const savedNow = Date.now;
        let NOW = Date.parse('2026-07-25T12:00:00Z');
        Date.now = () => NOW;
        const advMin = m => { NOW += m * 60000; };
        // Config assigned DIRECTLY (not via setFlights) so no poll timer starts
        // — _computeFlightAlerts is driven explicitly, the flights-ui-test idiom.
        p.store.flights = { enabled: true, source: 'cloud', iss: false };
        const mk = (hex, over) => ({
          hex, callsign: null, lat: 47.6, lon: -122.3, altFt: 9000, gsKt: null,
          trackDeg: null, vertRateFpm: null, category: null, seenPosS: 0,
          military: false, reg: null, typeCode: null, typeDesc: null, operator: null,
          emergency: null, squawk: null, interesting: false, pia: false, ladd: false,
          distNm: 12, ...over,
        });
        const emergs = () => p.flightAlerts.filter(a => a.id.startsWith('flight:emerg:'));
        const reset = () => {
          p.flightAlerts = [];
          p._flightAlertDismissed = new Set();
          p._flightAlertAt = new Map();
          p.householdEvents = [];
          p.issNow = null;
        };

        // Squawk 7700, 12 nm out — far outside the 3 nm low-overflight gate.
        reset();
        p.flightsNow = [mk('a1b2c3', { callsign: 'SWA1234', squawk: '7700', distNm: 12 })];
        const chg0 = p._computeFlightAlerts();
        ok('11p: squawk 7700 raises one emergency alert', emergs().length === 1, `n=${emergs().length}`);
        ok('11p: emergency id is per-hex', emergs()[0]?.id === 'flight:emerg:a1b2c3', emergs()[0]?.id);
        ok('11p: emergency severity is error', emergs()[0]?.severity === 'error', emergs()[0]?.severity);
        ok('11p: emergency source is flight', emergs()[0]?.source === 'flight');
        ok('11p: emergency is dismissible', emergs()[0]?.dismissible === true);
        ok('11p: title names the callsign + the squawk',
          /^EMERGENCY: SWA1234 squawking 7700$/.test(emergs()[0]?.title ?? ''), emergs()[0]?.title);
        ok('11p: a new emergency reports changed', chg0 === true);
        ok('11p: emergency ignores the 3 nm overhead gate (12 nm still fires)',
          emergs().length === 1 && /12\.0 nm/.test(emergs()[0]?.message ?? ''), emergs()[0]?.message);

        // Still declaring 20 minutes later: past FLIGHT_ALERT_TTL_MS (15 min),
        // and it must NOT be pruned — nor churn the id list (LIVE-path).
        const created0 = emergs()[0]?.createdAt;
        advMin(20);
        const chg1 = p._computeFlightAlerts();
        ok('11p: an ACTIVE emergency survives the 15 min prune', emergs().length === 1,
          `n=${emergs().length}`);
        ok('11p: refreshed in place — createdAt preserved', emergs()[0]?.createdAt === created0,
          `${created0} → ${emergs()[0]?.createdAt}`);
        ok('11p: refreshing a persisting emergency reports NO change (no configRev bump)',
          chg1 === false);

        // The aircraft stops declaring → the notice ages out normally.
        p.flightsNow = [mk('a1b2c3', { callsign: 'SWA1234', squawk: '1200' })];
        p._computeFlightAlerts();
        ok('11p: cleared emergency past the TTL is pruned', emergs().length === 0,
          `n=${emergs().length}`);

        // The `emergency` enum fires on its own (it is a SUPERSET of the
        // squawks — lifeguard/minfuel/downed have no code of their own), and a
        // routine 1200 must never be announced as "squawking 1200".
        reset();
        p.flightsNow = [mk('bbb111', { callsign: 'LIFE1', emergency: 'lifeguard', squawk: '1200' })];
        p._computeFlightAlerts();
        ok('11p: `emergency` enum fires without an emergency squawk', emergs().length === 1);
        ok('11p: title reports the enum, not the routine squawk',
          emergs()[0]?.title === 'EMERGENCY: LIFE1 squawking lifeguard', emergs()[0]?.title);

        // 7600/7500 also fire; a normalized "none" never does.
        for (const [sq, label] of [['7600', 'nordo'], ['7500', 'unlawful']]) {
          reset();
          p.flightsNow = [mk('ccc222', { squawk: sq })];
          p._computeFlightAlerts();
          ok(`11p: squawk ${sq} (${label}) fires`, emergs().length === 1);
        }
        reset();
        p.flightsNow = [mk('ddd333', { squawk: '1200', emergency: null })];
        p._computeFlightAlerts();
        ok('11p: an ordinary aircraft raises nothing', emergs().length === 0);

        // No callsign → the uppercase hex, like the other triggers.
        reset();
        p.flightsNow = [mk('a7d588', { squawk: '7700' })];
        p._computeFlightAlerts();
        ok('11p: no callsign → uppercase hex in the title',
          /^EMERGENCY: A7D588 /.test(emergs()[0]?.title ?? ''), emergs()[0]?.title);

        // Two emergencies → two distinct per-hex alerts.
        reset();
        p.flightsNow = [mk('e1e1e1', { squawk: '7700' }), mk('e2e2e2', { emergency: 'downed' })];
        p._computeFlightAlerts();
        ok('11p: two emergencies → two distinct alerts', emergs().length === 2,
          `n=${emergs().length}`);

        // Dismissal: local mute, then a re-arm once the 10 min cooldown passes
        // (stable per-hex ids would otherwise mute that aircraft forever).
        reset();
        p.flightsNow = [mk('f0f0f0', { callsign: 'EMG1', squawk: '7700' })];
        p._computeFlightAlerts();
        const target = emergs()[0];
        p.dismissAlert(target);
        ok('11p: dismissal removes the emergency', emergs().length === 0);
        advMin(5);
        p._computeFlightAlerts();
        ok('11p: dismissed emergency stays muted inside the cooldown', emergs().length === 0,
          `n=${emergs().length}`);
        advMin(6);                                    // 11 min total > 10 min
        p._computeFlightAlerts();
        ok('11p: a still-live emergency re-arms past the cooldown', emergs().length === 1,
          `n=${emergs().length}`);
        ok('11p: the re-armed alert is freshly stamped',
          emergs()[0]?.createdAt === new Date(NOW).toISOString(), emergs()[0]?.createdAt);

        // The newest-wins cap must never be the thing that mutes an emergency.
        reset();
        p.store.flights = { enabled: true, source: 'cloud', iss: false, alerts: { watch: ['TST'] } };
        const many = [];
        for (let i = 0; i < 8; i++) many.push(mk('c' + String(i).padStart(5, '0'), { callsign: 'TST' + i }));
        many.push(mk('9f9f9f', { callsign: 'MAYDAY1', squawk: '7700' }));
        p.flightsNow = many;
        p._computeFlightAlerts();
        ok('11p: emergency survives the newest-wins cap alongside 8 watch alerts',
          emergs().length === 1, `alerts=${p.flightAlerts.length} emerg=${emergs().length}`);
        ok('11p: the cap dropped a WATCH alert instead',
          p.flightAlerts.filter(a => a.id.startsWith('flight:watch:')).length === 7,
          `watch=${p.flightAlerts.filter(a => a.id.startsWith('flight:watch:')).length}`);

        // Disabled feature → no emergency alerts at all.
        reset();
        p.store.flights = { enabled: false, source: 'cloud', iss: false };
        p.flightsNow = [mk('aaa999', { squawk: '7700' })];
        p._computeFlightAlerts();
        ok('11p: flights disabled → no emergency alert', emergs().length === 0);

        Date.now = savedNow;
        p.store.flights = { enabled: false, source: 'cloud', iss: false };
      }

      // (q) labelFields sanitization rides setFlights (the watch-list precedent:
      // normalize at the STORE boundary, not in the settings UI, so an import or

      {

        p.setFlights(f => { f.labelFields = 'callsign'; });
        ok('11q: a non-array becomes undefined', p.store.flights.labelFields === undefined);
        p.setFlights(f => { f.labelFields = ['type', 'operator', 'speed', 'trend', 'squawk']; });
        p.setFlights(f => { f.radiusNm = 33; });
        ok('11q: an unrelated setFlights leaves labelFields intact',

            === JSON.stringify(['type', 'operator', 'speed', 'trend', 'squawk']),

        // shellRadiusM rides the SAME store-boundary discipline as modelScale:

        p.setFlights(f => { f.shellRadiusM = 450; });

        ok('11q: an unrelated setFlights leaves shellRadiusM intact',

        // verticalScale — the SAME store-boundary discipline once more (clamp

        p.setFlights(f => { f.verticalScale = NaN; });
        ok('11q: a non-finite height scale falls back to the default (undefined)',

        ok('11q: an unrelated setFlights leaves verticalScale intact',

          p.store.flights.speedViz === undefined, String(p.store.flights.speedViz));
        p.setFlights(f => { f.speedViz = false; });
        ok('11q: speedViz round-trips false',
          p.store.flights.speedViz === false, String(p.store.flights.speedViz));
        p.setFlights(f => { f.speedViz = true; });
        ok('11q: speedViz round-trips true',
          p.store.flights.speedViz === true, String(p.store.flights.speedViz));
        p.setFlights(f => { f.beacons = false; f.privacyDim = false; });
        await p.saveConfigNow();
        const saved = stub.peek('diorama-cfg-default');
        ok('11q: labelFields + beacons + privacyDim persist through the store',
          JSON.stringify(saved?.flights?.labelFields) === JSON.stringify(['type', 'operator', 'speed', 'trend', 'squawk'])
          && saved?.flights?.beacons === false && saved?.flights?.privacyDim === false,
          JSON.stringify(saved?.flights));
        ok('11q: shellRadiusM persists through the store too',
          saved?.flights?.shellRadiusM === 450, String(saved?.flights?.shellRadiusM));
        quiesce(p);
      }

      // (r) glowRules sanitization rides setFlights too (flight-glow-rules.md
      // §6.3) — the SAME store-boundary discipline, so an import or a
      // hand-edited config can never hand the renderer an unknown pattern, a
      // malformed colour, an inverted range or a blank `**` text criterion.
      {
        calls.length = 0;
        handler = () => ring(1);
        const { p, stub } = await boot(makeStore({ weather: WEATHER }));
        p.setFlights(f => {
          f.glowRules = [
            { id: 'r1', label: '  SWA  ', pattern: 'strobe', colorA: '#FF0000', colorB: '#ffffff',
              criteria: { callsign: ' swa* ', typeCode: 'b73?', operator: '  ', minAltFt: 9000, maxAltFt: 2000 } },
            { id: 'r2', pattern: 'nonsense', colorA: '#00ff00', criteria: {} },     // dropped
            { id: 'r3', pattern: 'solid', colorA: 'not-a-color', criteria: {} },    // dropped
            { id: 'r4', pattern: 'none', criteria: { military: true } },            // kept w/o colour
          ];
        });
        const gr = p.store.flights.glowRules;
        ok('11r: unknown pattern + colourless visible pattern are dropped', gr.length === 2,
          `n=${gr?.length}`);
        ok('11r: label trimmed, colours normalized to lowercase hex',
          gr[0].label === 'SWA' && gr[0].colorA === '#ff0000' && gr[0].colorB === '#ffffff',
          JSON.stringify(gr[0].label) + ' ' + gr[0].colorA);
        ok('11r: uppercase-data criteria uppercased, blank criterion → undefined',
          gr[0].criteria.callsign === 'SWA*' && gr[0].criteria.typeCode === 'B73?'
          && gr[0].criteria.operator === undefined,
          JSON.stringify(gr[0].criteria));
        ok('11r: an inverted min/max pair is swapped',
          gr[0].criteria.minAltFt === 2000 && gr[0].criteria.maxAltFt === 9000,
          `${gr[0].criteria.minAltFt}..${gr[0].criteria.maxAltFt}`);
        ok("11r: pattern 'none' survives without a colour", gr[1].pattern === 'none' && gr[1].id === 'r4');
        p.setFlights(f => { f.glowRules = []; });
        ok('11r: an empty list becomes undefined', p.store.flights.glowRules === undefined);
        p.setFlights(f => { f.glowRules = 'nope'; });
        ok('11r: a non-array becomes undefined', p.store.flights.glowRules === undefined);
        p.setFlights(f => {
          f.glowRules = [{ id: 'keep', pattern: 'fade', colorA: '#123456', criteria: { military: true } }];
        });
        p.setFlights(f => { f.radiusNm = 21; });
        ok('11r: an unrelated setFlights leaves glowRules intact',
          p.store.flights.glowRules?.length === 1 && p.store.flights.glowRules[0].pattern === 'fade');
        await p.saveConfigNow();
        const savedG = stub.peek('diorama-cfg-default');
        ok('11r: glowRules persist through the store (in the _normalizeStore field list)',
          savedG?.flights?.glowRules?.length === 1
          && savedG.flights.glowRules[0].colorA === '#123456',
          JSON.stringify(savedG?.flights?.glowRules));
        quiesce(p);
      }

      // ── 8z. The server-side proxy path, end to end ─────────────────────
      // Neither OpenSky nor adsb.lol can be fetched by the browser, so the poll
      // asks Home Assistant to fetch them via the user's rest_command.
      {
        const eq = (name, got, want, extra = '') =>
          ok(name, got === want, extra || `got ${JSON.stringify(got)} want ${JSON.stringify(want)}`);

        // (a) opensky selected but NO rest_command name → explicit status, and
        //     nothing is called at all (not the service, not the network).
        {
          calls.length = 0; svc.length = 0;
          handler = () => ring(3);
          const { p } = await boot(makeStore({
            weather: WEATHER, flights: { enabled: true, source: 'opensky', iss: false },
          }));
          await waitFor(() => p.flightsStatus === 'needs-proxy');
          eq('31a: unconfigured proxy → status needs-proxy', p.flightsStatus, 'needs-proxy');
          eq('31a: … and ZERO service calls', svc.length, 0);
          eq('31a: … and ZERO network calls', calls.length, 0);
          ok('31a: … and no stale data shown', p.flightsNow === null);
          // A direct poll must not downgrade the honest status into 'error'.
          await p._pollFlights();
          eq('31a: an explicit poll still reports needs-proxy', p.flightsStatus, 'needs-proxy');
          eq('31a: … and still calls nothing', svc.length, 0);
          quiesce(p);
        }

        // (a2) …and the ISS, a separate CORS-open feed, keeps running anyway.
        {
          calls.length = 0; svc.length = 0;
          handler = u => u.includes('wheretheiss')
            ? { latitude: 10, longitude: 20, altitude: 420, velocity: 27000, timestamp: 1784953269 }
            : null;
          const { p } = await boot(makeStore({
            weather: WEATHER, flights: { enabled: true, source: 'opensky', iss: true },
          }));
          await waitFor(() => p.issNow !== null);
          ok('31a2: an unconfigured aircraft proxy does NOT take the ISS down',
            p.issNow !== null);
          eq('31a2: … while the aircraft status stays honest', p.flightsStatus, 'needs-proxy');
          eq('31a2: NEG no aircraft fetch was attempted', aircraftCalls().length, 0);
          quiesce(p);
        }

        // (b) name configured → HA fetches OpenSky for us and the states land.
        {
          calls.length = 0; svc.length = 0;
          handler = () => ring(3);
          svcReply = () => ({ context: {}, response: { status: 200, content: OPENSKY } });
          // The OpenSky fixture was captured over New York, so the observer has
          // to stand there or the radius filter would (correctly) drop it all.
          const NY = { source: 'openmeteo', lat: 40.7, lon: -74.0, chip: true };
          const { p } = await boot(makeStore({
            weather: NY,
            flights: { enabled: true, source: 'opensky', proxyCommand: 'diorama_opensky',
                       radiusNm: 100, iss: false },
          }));
          await p._pollFlights();
          eq('31b: the rest_command domain is used', svc[0]?.domain, 'rest_command');
          eq('31b: the configured service name is called', svc[0]?.service, 'diorama_opensky');
          eq('31b: the bounding box is passed as service data',
            Object.keys(svc[0]?.data ?? {}).sort().join(','), 'lamax,lamin,lomax,lomin');
          ok('31b: the box matches the configured origin + radius',
            JSON.stringify(svc[0].data) === JSON.stringify(
              F.openSkyBoundingBox(40.7, -74.0, 100)), JSON.stringify(svc[0].data));
          eq('31b: status ok after the proxied poll', p.flightsStatus, 'ok');
          ok('31b: aircraft landed from the rest_command response',
            (p.flightsNow?.length ?? 0) > 0, `n=${p.flightsNow?.length}`);
          ok('31b: … and they are within the configured radius',
            p.flightsNow.every(fp => fp.distNm <= 100));
          // NEGATIVE CONTROL: the direct browser fetch is NOT used by this source.
          eq('31b: NEG no browser fetch for a proxied source', aircraftCalls().length, 0);
          quiesce(p);
        }

        // (c) the same transport carries adsb.lol's {ac:[...]}.
        {
          svc.length = 0;
          svcReply = () => ({ response: { status: 200, content: ADSBLOL } });
          // Likewise: the adsb.lol capture is centred over the North Sea.
          const EU = { source: 'openmeteo', lat: 51.89508, lon: 2.79437, chip: true };
          const { p } = await boot(makeStore({
            weather: EU,
            flights: { enabled: true, source: 'adsblol', proxyCommand: 'diorama_adsblol',
                       radiusNm: 100, iss: false },
          }));
          await p._pollFlights();
          eq('31c: the adsblol command is called', svc[0]?.service, 'diorama_adsblol');
          eq('31c: point + radius service data (no box)',
            Object.keys(svc[0]?.data ?? {}).sort().join(','), 'dist,lat,lon');
          // Every normalized row in the fixture sits inside the 100 nm radius,
          // so the whole normalized list must survive the planner's filter.
          eq('31c: every normalized aircraft landed',
            p.flightsNow?.length ?? 0, F.normalizeAircraftList(ADSBLOL).length);
          ok('31c: … and they carry a recomputed distNm',
            p.flightsNow.every(fp => Number.isFinite(fp.distNm) && fp.distNm <= 100));
          quiesce(p);
        }

        // (d) a failing rest_command with nothing cached reports 'error', not silence.
        {
          svc.length = 0;
          svcReply = () => null;
          const { p } = await boot(makeStore({
            weather: WEATHER,
            flights: { enabled: true, source: 'opensky', proxyCommand: 'nope', iss: false },
          }));
          await p._pollFlights();
          ok('31d: the call WAS attempted', svc.length > 0, `svc=${svc.length}`);
          eq('31d: a failing proxy with no data → status error', p.flightsStatus, 'error');
          quiesce(p);
        }

        // (e) MIGRATION: an existing explicit 'cloud' store keeps cloud and keeps
        //     using the direct browser fetch — we never rewrite a stored choice.
        {
          calls.length = 0; svc.length = 0;
          handler = () => ring(2);
          const { p } = await boot(makeStore({
            weather: WEATHER, flights: { enabled: true, source: 'cloud', radiusNm: 30, iss: false },
          }));
          await waitFor(() => p.flightsStatus === 'ok');
          eq('31e: a stored cloud source is preserved', p.store.flights.source, 'cloud');
          ok('31e: … and still hits airplanes.live directly',
            aircraftCalls().some(u => u.includes('api.airplanes.live')), aircraftCalls()[0] || '');
          eq('31e: … using no rest_command at all', svc.length, 0);
          quiesce(p);
        }

        // (f) MIGRATION: an ABSENT source now resolves to OpenSky (the new
        //     default), which surfaces as needs-proxy rather than a dead poll.
        {
          calls.length = 0; svc.length = 0;
          handler = () => ring(2);
          const { p } = await boot(makeStore({
            weather: WEATHER, flights: { enabled: true, iss: false },
          }));
          await waitFor(() => p.flightsStatus === 'needs-proxy');
          eq('31f: absent source → the OpenSky path', p.flightsStatus, 'needs-proxy');
          eq('31f: NEG absent source does NOT fetch airplanes.live', aircraftCalls().length, 0);
          quiesce(p);
        }

        // (g) setFlights: creation default + proxy-name sanitizing.
        {
          const { p } = await boot(makeStore({ weather: WEATHER }));
          p.setFlights(f => { f.enabled = false; });
          eq('31g: a fresh flights config is created on OpenSky',
            p.store.flights.source, 'opensky');
          p.setFlights(f => { f.proxyCommand = ' rest_command.My Feed '; });
          eq('31g: setFlights sanitizes the proxy command',
            p.store.flights.proxyCommand, 'myfeed');
          p.setFlights(f => { f.proxyCommand = '   '; });
          eq('31g: a blank proxy command clears back to undefined',
            p.store.flights.proxyCommand, undefined);
          // NEGATIVE CONTROL: an untouched field is not invented.
          p.setFlights(f => { f.radiusNm = 20; });
          eq('31g: NEG the cleared command stays cleared',
            p.store.flights.proxyCommand, undefined);
          quiesce(p);
        }

        // (h) the source-aware poll default (OpenSky's credit budget).
        {
          const { p } = await boot(makeStore({ weather: WEATHER }));
          p.store.flights = { enabled: false, source: 'opensky' };
          eq('31h: OpenSky polls every 60 s by default', p._flightsPollMs(), 60000);
          p.store.flights = { enabled: false, source: 'cloud' };
          eq('31h: cloud keeps the 8 s default', p._flightsPollMs(), 8000);
          p.store.flights = { enabled: false };
          eq('31h: an absent source takes the OpenSky default', p._flightsPollMs(), 60000);
          p.store.flights = { enabled: false, source: 'opensky', pollSeconds: 20 };
          eq('31h: an explicit interval still wins', p._flightsPollMs(), 20000);
          p.store.flights = { enabled: false, source: 'opensky', pollSeconds: 999 };
          eq('31h: NEG the 5..60 clamp is unchanged', p._flightsPollMs(), 60000);
          quiesce(p);
        }
      }

      // ── 8y. `local` may OPTIONALLY route through the HA rest_command ────
      // A LAN receiver serves no CORS header and cannot be reached at all from
      // an https panel. Letting HA fetch it removes both walls — but the direct
      // browser fetch stays valid, so the presence of a rest_command name is
      // the ONLY switch, and `local` must never demand one.
      {
        const eq = (name, got, want, extra = '') =>
          ok(name, got === want, extra || `got ${JSON.stringify(got)} want ${JSON.stringify(want)}`);
        const LURL = 'http://192.168.1.50/tar1090/data/aircraft.json';

        // (a) local + a proxy name → HA is asked, the browser is NOT.
        {
          calls.length = 0; svc.length = 0;
          handler = () => WIDE;                    // a direct fetch would succeed…
          svcReply = () => ({ context: {}, response: { status: 200, content: WIDE } });
          const { p } = await boot(makeStore({
            weather: WEATHER,
            flights: { enabled: true, source: 'local', localUrl: LURL,
                       proxyCommand: 'diorama_local_adsb', radiusNm: 40, iss: false },
          }));
          await p._pollFlights();
          eq('32a: the rest_command domain is used', svc[0]?.domain, 'rest_command');
          eq('32a: the configured service name is called', svc[0]?.service, 'diorama_local_adsb');
          eq('32a: NO service data is sent (the URL is in the YAML)',
            Object.keys(svc[0]?.data ?? { x: 1 }).length, 0, JSON.stringify(svc[0]?.data));
          eq('32a: status ok after the proxied poll', p.flightsStatus, 'ok');
          ok('32a: aircraft landed from the rest_command response',
            (p.flightsNow?.length ?? 0) > 0, `n=${p.flightsNow?.length}`);
          // NEGATIVE CONTROL: the direct browser fetch is NOT used when proxied
          // — this is the whole point (the receiver URL never leaves the YAML).
          eq('32a: NEG the receiver was NOT fetched by the browser',
            calls.filter(u => u.includes('192.168.1.50')).length, 0, calls.join(' '));
          quiesce(p);
        }

        // (b) local with NO proxy name → today's direct browser fetch, no service.
        {
          calls.length = 0; svc.length = 0;
          handler = () => WIDE;
          svcReply = () => ({ context: {}, response: { status: 200, content: WIDE } });
          const { p } = await boot(makeStore({
            weather: WEATHER,
            flights: { enabled: true, source: 'local', localUrl: LURL, radiusNm: 40, iss: false },
          }));
          await waitFor(() => p.flightsStatus === 'ok');
          ok('32b: the receiver URL is fetched directly', calls.includes(LURL), calls[0] || '');
          eq('32b: NEG no rest_command is called', svc.length, 0);
          quiesce(p);
        }

        // (b2) a BLANK/garbage proxy name sanitizes away → still the direct path.
        {
          calls.length = 0; svc.length = 0;
          handler = () => WIDE;
          const { p } = await boot(makeStore({
            weather: WEATHER,
            flights: { enabled: true, source: 'local', localUrl: LURL,
                       proxyCommand: '   ', radiusNm: 40, iss: false },
          }));
          await waitFor(() => p.flightsStatus === 'ok');
          ok('32b2: an unusable proxy name falls back to the direct fetch',
            calls.includes(LURL) && svc.length === 0, `calls=${calls.length} svc=${svc.length}`);
          quiesce(p);
        }

        // (c) local NEVER reports needs-proxy — that status means "this feed is
        //     unreachable without one", which is false for a LAN receiver.
        {
          calls.length = 0; svc.length = 0;
          handler = () => WIDE;
          const { p } = await boot(makeStore({
            weather: WEATHER,
            flights: { enabled: true, source: 'local', localUrl: LURL, radiusNm: 40, iss: false },
          }));
          await waitFor(() => p.flightsStatus === 'ok');
          ok('32c: local with no proxy is NOT needs-proxy', p.flightsStatus !== 'needs-proxy',
            p.flightsStatus);
          // NEGATIVE CONTROL: the same store on a proxy-REQUIRED source does
          // report it — the status itself is alive, local is simply exempt.
          const { p: p2 } = await boot(makeStore({
            weather: WEATHER, flights: { enabled: true, source: 'opensky', iss: false },
          }));
          await waitFor(() => p2.flightsStatus === 'needs-proxy');
          eq('32c: NEG the same shape on opensky DOES report needs-proxy',
            p2.flightsStatus, 'needs-proxy');
          quiesce(p); quiesce(p2);
        }

        // (d) a proxied local receiver serving text/plain: rest_command hands
        //     back `content` as a raw JSON STRING. It must still parse.
        {
          svc.length = 0;
          svcReply = () => ({ context: {}, response: { status: 200, content: JSON.stringify(WIDE) } });
          const { p } = await boot(makeStore({
            weather: WEATHER,
            flights: { enabled: true, source: 'local', localUrl: LURL,
                       proxyCommand: 'diorama_local_adsb', radiusNm: 40, iss: false },
          }));
          await p._pollFlights();
          eq('32d: a text/plain receiver body still parses', p.flightsStatus, 'ok');
          ok('32d: … and yields the same aircraft', (p.flightsNow?.length ?? 0) > 0,
            `n=${p.flightsNow?.length}`);
          // NEGATIVE CONTROL: genuinely unparseable text is not silently accepted.
          svcReply = () => ({ response: { status: 200, content: '<html>502 Bad Gateway</html>' } });
          const { p: p2 } = await boot(makeStore({
            weather: WEATHER,
            flights: { enabled: true, source: 'local', localUrl: LURL,
                       proxyCommand: 'diorama_local_adsb', radiusNm: 40, iss: false },
          }));
          await p2._pollFlights();
          eq('32d: NEG an HTML error body → status error, not a fake ok',
            p2.flightsStatus, 'error');
          quiesce(p); quiesce(p2);
        }

        // (e) a failing local rest_command with nothing cached reports 'error'.
        {
          svc.length = 0;
          svcReply = () => null;
          calls.length = 0;
          handler = () => WIDE;
          const { p } = await boot(makeStore({
            weather: WEATHER,
            flights: { enabled: true, source: 'local', localUrl: LURL,
                       proxyCommand: 'diorama_local_adsb', radiusNm: 40, iss: false },
          }));
          await p._pollFlights();
          ok('32e: the call WAS attempted', svc.length > 0, `svc=${svc.length}`);
          eq('32e: a failing local proxy with no data → status error', p.flightsStatus, 'error');
          eq('32e: NEG it does not silently fall back to the browser fetch',
            calls.filter(u => u.includes('192.168.1.50')).length, 0);
          quiesce(p);
        }

        // ── 8y2. A receiver's WHOLE CATCH is filtered the same either way ──
        // A LAN antenna hears everything, out past 200 nm, unlike adsb.lol or
        // OpenSky which pre-filter server-side. `_applyFlights` is the single
        // shared gate; the risk of the proxy path is that it bypasses it.
        // TWO radii are needed, and the reason is load-bearing: at 40 nm the
        // fixture has 61 aircraft inside, so the 50-cap alone would trim the
        // list to a 31 nm maximum and the radius filter could be deleted
        // without any containment assertion noticing (measured). At 12 nm only
        // 18 are inside, so the cap is inert and containment is genuinely the
        // radius filter's doing. The 40 nm run therefore owns the CAP, the
        // 12 nm run owns the RADIUS.
        const RADIUS = 40, TIGHT = 12;
        const wideVia = async (proxied, radiusNm = RADIUS) => {
          calls.length = 0; svc.length = 0;
          handler = () => WIDE;
          svcReply = () => ({ context: {}, response: { status: 200, content: WIDE } });
          const { p } = await boot(makeStore({
            weather: WEATHER,
            flights: {
              enabled: true, source: 'local', localUrl: LURL, radiusNm, iss: false,
              ...(proxied ? { proxyCommand: 'diorama_local_adsb' } : {}),
            },
          }));
          await p._pollFlights();
          const list = p.flightsNow ?? [];
          quiesce(p);
          return list;
        };
        const direct = await wideVia(false);
        const viaHa = await wideVia(true);
        const tightDirect = await wideVia(false, TIGHT);
        const tightProxy = await wideVia(true, TIGHT);

        // The fixture really is a wide catch — assert the PREMISE, so a future
        // fixture edit that removes the far traffic cannot silently pass this.
        const rawNorm = F.normalizeAircraftList(WIDE);
        ok('33: the fixture normalizes to more than MAX_AIRCRAFT',
          rawNorm.length > F.MAX_AIRCRAFT, `n=${rawNorm.length}`);
        ok('33: the fixture really does contain traffic beyond the radius',
          rawNorm.length > direct.length, `${rawNorm.length} → ${direct.length}`);

        // The fixture is deliberately emitted in SHUFFLED order — ascending
        // distance would let "sorted nearest-first" pass with no sort at all.
        const monotonic = (list) => {
          for (let i = 1; i < list.length; i++) {
            if (list[i].distNm < list[i - 1].distNm - 1e-9) return false;
          }
          return true;
        };
        ok('33: the fixture is NOT emitted in distance order (so the sort is testable)',
          !monotonic(F.normalizeAircraftList(WIDE).map(a => ({
            distNm: F.flightBearingDistance(47.6, -122.3, a.lat, a.lon).distNm }))));

        for (const [via, list] of [['direct', direct], ['proxy', viaHa]]) {
          ok(`33 (${via}): capped at MAX_AIRCRAFT`, list.length === F.MAX_AIRCRAFT,
            `n=${list.length}`);
          ok(`33 (${via}): sorted nearest-first`, monotonic(list));
          ok(`33 (${via}): the nearest aircraft survived the cap`,
            Math.abs(list[0].distNm - 2) < 0.01, `${list[0].distNm.toFixed(3)} nm`);
          // The fixture's ground rows also carry alt_geom (as tar1090 emits),
          // so this tests the `alt_baro === 'ground'` sentinel itself and not
          // the no-altitude drop standing in for it.
          ok(`33 (${via}): ground aircraft are dropped`,
            !list.some(a => a.callsign && a.callsign.startsWith('GND')),
            list.filter(a => (a.callsign || '').startsWith('GND')).map(a => a.hex).join(','));
          ok(`33 (${via}): NEG the far traffic is gone`,
            !list.some(a => (a.callsign || '').startsWith('FAR')),
            list.filter(a => (a.callsign || '').startsWith('FAR')).map(a => a.hex).join(','));
        }

        // The RADIUS, at a radius the cap cannot mask.
        for (const [via, list] of [['direct', tightDirect], ['proxy', tightProxy]]) {
          ok(`33 (${via}, ${TIGHT} nm): the cap is INERT here`,
            list.length > 0 && list.length < F.MAX_AIRCRAFT, `n=${list.length}`);
          ok(`33 (${via}, ${TIGHT} nm): every aircraft is inside the radius`,
            list.every(a => a.distNm <= TIGHT + 1e-6),
            `n=${list.length} max=${Math.max(...list.map(a => a.distNm)).toFixed(2)} nm`);
          ok(`33 (${via}, ${TIGHT} nm): sorted nearest-first`, monotonic(list));
          ok(`33 (${via}, ${TIGHT} nm): NEG no ground or far traffic`,
            !list.some(a => /^(GND|FAR)/.test(a.callsign || '')));
        }
        ok('33: the tight radius really did drop traffic the wide one kept',
          tightDirect.length < direct.length, `${direct.length} → ${tightDirect.length}`);
        eq('33: the tight radius agrees across both transports',
          JSON.stringify(tightProxy.map(a => a.hex)),
          JSON.stringify(tightDirect.map(a => a.hex)));
        // The actual regression risk of the optional proxy: a second code path
        // that skips `_applyFlights` entirely. Same bytes in ⇒ same list out.
        eq('33: the proxied list is IDENTICAL to the direct one',
          JSON.stringify(viaHa.map(a => [a.hex, a.altFt, Math.round(a.distNm * 1e6)])),
          JSON.stringify(direct.map(a => [a.hex, a.altFt, Math.round(a.distNm * 1e6)])),
          `direct=${direct.length} proxy=${viaHa.length}`);
        // NEGATIVE CONTROL for that equality: the SAME comparison against a
        // deliberately different radius must fail, proving it discriminates.
        {
          calls.length = 0; handler = () => WIDE;
          const { p } = await boot(makeStore({
            weather: WEATHER,
            flights: { enabled: true, source: 'local', localUrl: LURL, radiusNm: 10, iss: false },
          }));
          await p._pollFlights();
          const narrow = p.flightsNow ?? [];
          ok('33: NEG a different radius yields a different list (the compare discriminates)',
            JSON.stringify(narrow.map(a => a.hex)) !== JSON.stringify(direct.map(a => a.hex))
            && narrow.every(a => a.distNm <= 10 + 1e-6) && narrow.length > 0,
            `n=${narrow.length}`);
          quiesce(p);
        }

        // Altitude band, over the proxy path too.
        {
          svc.length = 0;
          svcReply = () => ({ context: {}, response: { status: 200, content: WIDE } });
          const { p } = await boot(makeStore({
            weather: WEATHER,
            flights: { enabled: true, source: 'local', localUrl: LURL,
                       proxyCommand: 'diorama_local_adsb', radiusNm: RADIUS,
                       minAltFt: 5000, maxAltFt: 20000, iss: false },
          }));
          await p._pollFlights();
          const alts = (p.flightsNow ?? []).map(a => a.altFt);
          ok('33: the altitude band applies on the proxy path',
            alts.length > 0 && alts.every(a => a >= 5000 && a <= 20000),
            `n=${alts.length} [${Math.min(...alts)}..${Math.max(...alts)}]`);
          // NEGATIVE CONTROL: the unfiltered run genuinely contains out-of-band
          // traffic, so the band is doing real work.
          ok('33: NEG the unbanded run DOES contain out-of-band altitudes',
            direct.some(a => a.altFt < 5000 || a.altFt > 20000),
            `min=${Math.min(...direct.map(a => a.altFt))} max=${Math.max(...direct.map(a => a.altFt))}`);
          quiesce(p);
        }

        // ── 8y3. Missing-altitude rows and the minAltFt comparison ─────────
        // INVESTIGATED: a row with no usable altitude never reaches the band
        // filter at all — `normalizeAircraftList` drops it (alt_baro →
        // alt_geom → altitude, then `if (altFt === null) continue`). So
        // `fp.altFt` is always a real number by the time `_applyFlights` runs,
        // and there is no silent null-vs-number comparison to get wrong.
        {
          const norm = F.normalizeAircraftList(WIDE);
          ok('34: every normalized point has a FINITE altitude',
            norm.length > 0 && norm.every(a => Number.isFinite(a.altFt)),
            `n=${norm.length}`);
          ok('34: the explicitly-null-altitude rows are dropped at normalization',
            !norm.some(a => (a.callsign || '').startsWith('NUL')));
          ok('34: the rows with NO altitude key are dropped too',
            !norm.some(a => (a.callsign || '').startsWith('NOA')));
          // The fixture really contains them (premise, so the two assertions
          // above cannot pass vacuously).
          const missing = WIDE.aircraft.filter(a =>
            a.alt_baro == null && a.alt_geom == null && a.altitude == null);
          ok('34: the fixture DOES carry such rows', missing.length === 5,
            `n=${missing.length}`);
          // …and the ground rows are NOT among them: they carry alt_geom, so
          // only the `ground` sentinel can be what drops them.
          ok('34: the ground rows have a usable alt_geom (so the sentinel is load-bearing)',
            WIDE.aircraft.filter(a => a.alt_baro === 'ground').length === 5
            && WIDE.aircraft.filter(a => a.alt_baro === 'ground')
                 .every(a => typeof a.alt_geom === 'number'));
          // alt_baro null + alt_geom present is a FALLBACK, not a drop.
          const geom = norm.find(a => a.callsign === 'GEOM1');
          ok('34: alt_baro null falls back to alt_geom rather than dropping',
            !!geom && geom.altFt === 7500, JSON.stringify(geom && geom.altFt));
          // …and that fallback row is subject to the band like any other.
          {
            svc.length = 0;
            svcReply = () => ({ response: { status: 200, content: WIDE } });
            const { p } = await boot(makeStore({
              weather: WEATHER,
              flights: { enabled: true, source: 'local', localUrl: LURL,
                         proxyCommand: 'diorama_local_adsb', radiusNm: RADIUS,
                         minAltFt: 8000, iss: false },
            }));
            await p._pollFlights();
            ok('34: minAltFt 8000 excludes the 7500 ft geom-fallback row',
              !(p.flightsNow ?? []).some(a => a.callsign === 'GEOM1'));
            quiesce(p);
            // NEGATIVE CONTROL: with no floor it IS present, so the exclusion
            // above is the filter's doing and not a normalization accident.
            ok('34: NEG with no altitude floor the same row survives',
              direct.some(a => a.callsign === 'GEOM1'),
              direct.map(a => a.callsign).filter(Boolean).slice(0, 3).join(','));
          }
        }
      }

      // ── 8x. OFFLINE (the gh-pages demo / standalone offline mode) ──────
      // There is no Home Assistant, so `callServiceWithResponse` can never
      // return anything and there are no entity states to read. Anything that
      // depends on either must SAY it needs Home Assistant and start no timer;
      // the ISS is a separate CORS-open feed and must keep flying, because
      // offline it is the only flight visual left.
      {
        const eq = (name, got, want, extra = '') =>
          ok(name, got === want, extra || `got ${JSON.stringify(got)} want ${JSON.stringify(want)}`);
        const LURL = 'http://192.168.1.50/tar1090/data/aircraft.json';
        const ISS = { latitude: 10, longitude: 20, altitude: 420, velocity: 27000, timestamp: 1784953269 };

        // (a) the demo default: offline + opensky + no proxy name configured.
        {
          calls.length = 0; svc.length = 0;
          handler = u => u.includes('wheretheiss') ? ISS : ring(3);
          svcReply = () => ({ context: {}, response: { status: 200, content: OPENSKY } });
          const { p } = await boot(makeStore({
            weather: WEATHER, flights: { enabled: true, source: 'opensky', iss: true },
          }), undefined, { offline: true });
          await waitFor(() => p.flightsStatus === 'needs-ha');
          eq('35a: offline + a HA-dependent source → needs-ha', p.flightsStatus, 'needs-ha');
          ok('35a: the planner really is in offline mode', p.isOffline === true);
          // NEGATIVE CONTROL: it must NOT be the online diagnosis. Pasting YAML
          // into a configuration.yaml that does not exist is not the fix.
          ok('35a: NEG not needs-proxy', p.flightsStatus !== 'needs-proxy');
          ok('35a: NEG not a generic error', p.flightsStatus !== 'error');
          ok('35a: no stale aircraft shown', p.flightsNow === null);
          // NO POLL TIMER — the thing that would otherwise hammer a dead service.
          eq('35a: NO aircraft poll timer was started', p._flightsTimer, null);
          eq('35a: ZERO service calls attempted', svc.length, 0);
          eq('35a: ZERO aircraft network calls', aircraftCalls().length, 0);
          // …and the ISS keeps flying. This is the whole point of the branch
          // deliberately not being an early return.
          await waitFor(() => p.issNow !== null);
          ok('35a: the ISS still polls offline', p.issNow !== null);
          ok('35a: … on its own timer', p._issTimer !== null);
          ok('35a: … having really hit its own feed', issCalls().length > 0,
            `iss=${issCalls().length}`);
          // An explicit poll must not downgrade the honest status.
          await p._pollFlights();
          eq('35a: an explicit poll still reports needs-ha', p.flightsStatus, 'needs-ha');
          eq('35a: … and still calls nothing', svc.length + aircraftCalls().length, 0);
          quiesce(p);
        }

        // (b) offline + opensky WITH a proxy name typed in anyway. This is the
        //     case that used to poll a service that cannot exist, forever.
        {
          calls.length = 0; svc.length = 0;
          handler = u => u.includes('wheretheiss') ? ISS : ring(3);
          const { p } = await boot(makeStore({
            weather: WEATHER,
            flights: { enabled: true, source: 'opensky', proxyCommand: 'diorama_opensky', iss: false },
          }), undefined, { offline: true });
          await waitFor(() => p.flightsStatus === 'needs-ha');
          eq('35b: a configured proxy name does not make it reachable offline',
            p.flightsStatus, 'needs-ha');
          eq('35b: NO poll timer despite a valid service name', p._flightsTimer, null);
          eq('35b: NEG the service was never called', svc.length, 0);
          // The _pollFlights guard in its own right. Scenario (a) cannot reach
          // it — the older needs-proxy guard returns first there — so a proxy
          // name that IS configured is the only way to exercise it. Without it
          // an explicit poll would call the dead service and, since this fake
          // would happily answer, silently flip the status to 'ok'.
          svcReply = () => ({ context: {}, response: { status: 200, content: OPENSKY } });
          await p._pollFlights();
          eq('35b: an explicit poll makes no call offline', svc.length, 0);
          eq('35b: … and does not downgrade the status', p.flightsStatus, 'needs-ha');
          ok('35b: … and lands no aircraft', p.flightsNow === null);
          // NEGATIVE CONTROL: the SAME store ONLINE does call it and succeeds —
          // so offline is the only reason nothing happened.
          calls.length = 0; svc.length = 0;
          svcReply = () => ({ context: {}, response: { status: 200, content: OPENSKY } });
          const NY = { source: 'openmeteo', lat: 40.7, lon: -74.0, chip: true };
          const { p: p2 } = await boot(makeStore({
            weather: NY,
            flights: { enabled: true, source: 'opensky', proxyCommand: 'diorama_opensky',
                       radiusNm: 100, iss: false },
          }));
          await p2._pollFlights();
          ok('35b: NEG the same config ONLINE calls the service and lands data',
            svc.length > 0 && p2.flightsStatus === 'ok' && (p2.flightsNow?.length ?? 0) > 0,
            `svc=${svc.length} status=${p2.flightsStatus} n=${p2.flightsNow?.length}`);
          quiesce(p); quiesce(p2);
        }

        // (c) offline + entity. No rest_command is involved, but an HA sensor
        //     cannot exist without HA — reporting a fetch 'error' would be a
        //     lie, since nothing was ever fetched.
        {
          calls.length = 0; svc.length = 0;
          handler = () => ring(3);
          const { p } = await boot(makeStore({
            weather: WEATHER,
            flights: { enabled: true, source: 'entity', entityId: 'sensor.adsb', iss: false },
          }), undefined, { offline: true });
          await waitFor(() => p.flightsStatus === 'needs-ha');
          eq('35c: offline + entity → needs-ha', p.flightsStatus, 'needs-ha');
          ok('35c: NEG not the misleading generic error', p.flightsStatus !== 'error');
          eq('35c: NO poll timer', p._flightsTimer, null);
          quiesce(p);
        }

        // ── The sources that ARE genuinely reachable with no HA behind us ──
        // (d) local + a receiver URL: a plain browser fetch of the user's own
        //     LAN receiver. THE one aircraft source that works offline, so it
        //     must never be suppressed as "needs HA".
        {
          calls.length = 0; svc.length = 0;
          handler = () => WIDE;
          const { p } = await boot(makeStore({
            weather: WEATHER,
            flights: { enabled: true, source: 'local', localUrl: LURL, radiusNm: 40, iss: false },
          }), undefined, { offline: true });
          await waitFor(() => p.flightsStatus === 'ok');
          eq('35d: offline + local is NOT suppressed', p.flightsStatus, 'ok');
          ok('35d: the receiver really was fetched by the browser', calls.includes(LURL),
            calls[0] || '');
          ok('35d: aircraft landed offline', (p.flightsNow?.length ?? 0) > 0,
            `n=${p.flightsNow?.length}`);
          ok('35d: a poll timer IS running for a source that can work',
            p._flightsTimer !== null);
          eq('35d: NEG no service call was attempted', svc.length, 0);
          quiesce(p);
        }

        // (e) local + a proxy name, OFFLINE: the proxy is definitionally
        //     unavailable, so it DEMOTES to the direct fetch rather than
        //     reporting failure — the receiver URL is right there and reachable.
        {
          calls.length = 0; svc.length = 0;
          handler = () => WIDE;
          svcReply = () => ({ context: {}, response: { status: 200, content: WIDE } });
          const { p } = await boot(makeStore({
            weather: WEATHER,
            flights: { enabled: true, source: 'local', localUrl: LURL,
                       proxyCommand: 'diorama_local_adsb', radiusNm: 40, iss: false },
          }), undefined, { offline: true });
          await waitFor(() => p.flightsStatus === 'ok');
          eq('35e: offline demotes a proxied local source to the direct fetch',
            p.flightsStatus, 'ok');
          ok('35e: the browser fetched the receiver', calls.includes(LURL), calls[0] || '');
          eq('35e: NEG the dead rest_command was NOT called', svc.length, 0);
          // NEGATIVE CONTROL: the identical store ONLINE takes the proxy path,
          // so the demotion is genuinely the offline flag's doing.
          calls.length = 0; svc.length = 0;
          const { p: p2 } = await boot(makeStore({
            weather: WEATHER,
            flights: { enabled: true, source: 'local', localUrl: LURL,
                       proxyCommand: 'diorama_local_adsb', radiusNm: 40, iss: false },
          }));
          await p2._pollFlights();
          ok('35e: NEG the same config ONLINE uses the rest_command instead',
            svc.length > 0 && !calls.includes(LURL),
            `svc=${svc.length} calls=${calls.length}`);
          quiesce(p); quiesce(p2);
        }

        // (f) local offline with NO receiver URL: nothing to fetch, but that is
        //     an incomplete configuration, not a "needs HA" state.
        {
          calls.length = 0; svc.length = 0;
          handler = () => WIDE;
          const { p } = await boot(makeStore({
            weather: WEATHER, flights: { enabled: true, source: 'local', iss: false },
          }), undefined, { offline: true });
          await waitFor(() => p.flightsStatus === 'error');
          ok('35f: offline + local with no URL is not mislabelled needs-ha',
            p.flightsStatus !== 'needs-ha', p.flightsStatus);
          eq('35f: NEG and nothing was fetched', calls.length, 0);
          quiesce(p);
        }

        // (g) cloud offline: a direct browser fetch, so the TRANSPORT is
        //     reachable without HA. It will fail (airplanes.live 403s everyone
        //     now) — but as an honest error from a request that was really made.
        {
          calls.length = 0; svc.length = 0;
          handler = () => null;                    // stand in for the 403
          const { p } = await boot(makeStore({
            weather: WEATHER, flights: { enabled: true, source: 'cloud', iss: false },
          }), undefined, { offline: true });
          await waitFor(() => p.flightsStatus === 'error');
          ok('35g: offline + cloud is NOT suppressed as needs-ha',
            p.flightsStatus !== 'needs-ha', p.flightsStatus);
          ok('35g: … the request really was attempted',
            aircraftCalls().some(u => u.includes('airplanes.live')), aircraftCalls().join(' '));
          quiesce(p);
        }

        // (h) NEGATIVE CONTROL for the whole section: ONLINE, the very first
        //     scenario reports the ordinary needs-proxy, so `needs-ha` is
        //     reachable only via the offline flag.
        {
          calls.length = 0; svc.length = 0;
          handler = () => ring(3);
          const { p } = await boot(makeStore({
            weather: WEATHER, flights: { enabled: true, source: 'opensky', iss: false },
          }));
          await waitFor(() => p.flightsStatus === 'needs-proxy');
          eq('35h: NEG online, the same store reports needs-proxy', p.flightsStatus, 'needs-proxy');
          ok('35h: NEG needs-ha is unreachable while online', p.flightsStatus !== 'needs-ha');
          quiesce(p);
        }
      }

      // ── 8v. The `demo` source, end to end through the real Planner ──────
      // The whole point of the source: it works where every fetched source
      // cannot. So the assertions that matter are the NEGATIVE ones — nothing
      // is fetched, no service is called, and none of the "cannot work here"
      // statuses are reachable — plus the positive one that the fleet still
      // flows through the ORDINARY `_applyFlights` filtering.
      {
        const eq = (name, got, want, extra = '') =>
          ok(name, got === want, extra || `got ${JSON.stringify(got)} want ${JSON.stringify(want)}`);
        const ISS = { latitude: 10, longitude: 20, altitude: 420, velocity: 27000, timestamp: 1784953269 };
        const EMERG_HEX = 'a8b1c2';

        // (a) OFFLINE + demo. This is the gh-pages demo's exact situation, and
        //     the reason the source exists.
        {
          calls.length = 0; svc.length = 0;
          handler = u => u.includes('wheretheiss') ? ISS : null;
          svcReply = () => ({ context: {}, response: { status: 200, content: OPENSKY } });
          // NB deliberately NO weather block and NO geo landmarks — exactly what
          // every committed demo floorplan ships as. Any other source would be
          // stuck at 'no-origin' before it ever looked at the network.
          const { p } = await boot(makeStore({
            flights: { enabled: true, source: 'demo', radiusNm: 15, iss: true },
          }), undefined, { offline: true });
          await waitFor(() => p.flightsStatus === 'ok');
          eq('36a: offline + demo reports ok', p.flightsStatus, 'ok');
          ok('36a: the planner really is in offline mode', p.isOffline === true);
          ok('36a: aircraft landed', (p.flightsNow?.length ?? 0) > 0, `n=${p.flightsNow?.length}`);
          // NEGATIVE CONTROLS: none of the "cannot work here" states apply.
          ok('36a: NEG not needs-ha', p.flightsStatus !== 'needs-ha');
          ok('36a: NEG not needs-proxy', p.flightsStatus !== 'needs-proxy');
          ok('36a: NEG not no-origin', p.flightsStatus !== 'no-origin');
          ok('36a: NEG not error', p.flightsStatus !== 'error');
          // ZERO network, ZERO Home Assistant. The two claims the UI makes.
          eq('36a: ZERO aircraft network calls', aircraftCalls().length, 0, aircraftCalls().join(' '));
          eq('36a: ZERO Home Assistant service calls', svc.length, 0, JSON.stringify(svc));
          // …while the ISS keeps its own separate, genuinely-fetched feed.
          await waitFor(() => p.issNow !== null);
          ok('36a: the ISS is untouched and still real', p.issNow !== null);
          ok('36a: … having really hit its own feed', issCalls().length > 0);
          // The poll timer IS running (unlike every offline-blocked source), so
          // the sky actually moves.
          ok('36a: a poll timer is running', p._flightsTimer !== null);
          // NEGATIVE CONTROL on the origin fallback: with no geo fit and no
          // weather location, `flightsOrigin` still answers — and it answers
          // with the SYNTHETIC point, which is what unblocks the whole source.
          const o = p.flightsOrigin();
          ok('36a: an origin resolves with nothing configured', o !== null);
          ok('36a: … and it is the synthetic one',
            o && Math.abs(o.lat - F.DEMO_FLIGHT_ORIGIN.lat) < 1e-9
              && Math.abs(o.lon - F.DEMO_FLIGHT_ORIGIN.lon) < 1e-9, JSON.stringify(o));
          quiesce(p);
        }

        // (b) NEGATIVE CONTROL for (a): the SAME store with a fetched source
        //     and no location is blocked at 'no-origin'. So the demo's own
        //     origin is genuinely the thing doing the unblocking, not some
        //     other fallback that would have applied anyway.
        {
          calls.length = 0; svc.length = 0;
          handler = () => ring(3);
          const { p } = await boot(makeStore({
            flights: { enabled: true, source: 'cloud', radiusNm: 15, iss: false },
          }), undefined, { offline: true });
          await waitFor(() => p.flightsStatus === 'no-origin');
          eq('36b: NEG a fetched source with no location is blocked', p.flightsStatus, 'no-origin');
          ok('36b: NEG flightsOrigin is null for it', p.flightsOrigin() === null);
          quiesce(p);
        }

        // (c) ORIGIN PRECEDENCE: a real configured location must WIN, so a user
        //     with a calibrated home sees the synthetic traffic centred on their
        //     actual house rather than on a placeholder in Seattle.
        {
          const { p } = await boot(makeStore({
            weather: { source: 'openmeteo', lat: 51.5, lon: -0.12, chip: true },
            flights: { enabled: true, source: 'demo', radiusNm: 15, iss: false },
          }));
          await waitFor(() => p.flightsStatus === 'ok');
          const o = p.flightsOrigin();
          ok('36c: a configured weather location beats the synthetic one',
            o && Math.abs(o.lat - 51.5) < 1e-9 && Math.abs(o.lon + 0.12) < 1e-9, JSON.stringify(o));
          ok('36c: NEG it is NOT the synthetic default',
            o && Math.abs(o.lat - F.DEMO_FLIGHT_ORIGIN.lat) > 1);
          // …and the fleet really is drawn about THAT point.
          const near = p.flightsNow.every(fp =>
            F.flightBearingDistance(51.5, -0.12, fp.lat, fp.lon).distNm <= 15.001);
          ok('36c: every aircraft is within the radius of the configured home', near);
          quiesce(p);
        }

        // (d) THE RADIUS FILTER IS LIVE. Two roster members are generated
        //     outside the configured radius on purpose; `_applyFlights` must
        //     drop exactly those. Checked at two very different radii so the
        //     result cannot be an artefact of one setting.
        for (const rad of [15, 40]) {
          const { p } = await boot(makeStore({
            flights: { enabled: true, source: 'demo', radiusNm: rad, iss: false },
          }), undefined, { offline: true });
          await waitFor(() => p.flightsStatus === 'ok');
          const origin = p.flightsOrigin();
          const generated = F.demoFlightPoints(Date.now(), origin, rad);
          const outside = generated.filter(fp =>
            F.flightBearingDistance(origin.lat, origin.lon, fp.lat, fp.lon).distNm > rad);
          ok(`36d/${rad}: the generator really emits out-of-range traffic`,
            outside.length === 2, `outside=${outside.length}`);
          const shownHex = new Set(p.flightsNow.map(fp => fp.hex));
          ok(`36d/${rad}: … and every one of them is FILTERED OUT`,
            outside.every(fp => !shownHex.has(fp.hex)),
            outside.filter(fp => shownHex.has(fp.hex)).map(fp => fp.hex).join(','));
          ok(`36d/${rad}: the rest survive`,
            p.flightsNow.length === generated.length - outside.length,
            `shown=${p.flightsNow.length} gen=${generated.length}`);
          // Non-vacuity guard for the two assertions above: the filter must have
          // genuinely removed something, not passed everything through.
          ok(`36d/${rad}: the filter really removed aircraft`,
            p.flightsNow.length < generated.length,
            `shown=${p.flightsNow.length} gen=${generated.length}`);
          ok(`36d/${rad}: nothing shown exceeds the radius`,
            p.flightsNow.every(fp => (fp.distNm ?? 1e9) <= rad + 1e-6));
          quiesce(p);
        }

        // (e) The ALTITUDE band filter applies too — same code path, but worth
        //     pinning because a synthetic fleet is exactly where someone might
        //     assume the filters were skipped.
        {
          const { p } = await boot(makeStore({
            flights: { enabled: true, source: 'demo', radiusNm: 15, minAltFt: 20000, iss: false },
          }), undefined, { offline: true });
          await waitFor(() => p.flightsStatus === 'ok');
          ok('36e: minAltFt drops the low traffic',
            p.flightsNow.every(fp => fp.altFt >= 20000),
            p.flightsNow.map(fp => Math.round(fp.altFt)).join(','));
          ok('36e: … but does not empty the sky', p.flightsNow.length > 0);
          quiesce(p);
        }

        // (f) MOTION. Two polls at different wall-clock instants must move every
        //     aircraft — that is the only thing the renderer's dead reckoning
        //     has to work with.
        {
          const realNow = Date.now;
          try {
            let t0 = 1755300000000;
            Date.now = () => t0;
            const { p } = await boot(makeStore({
              flights: { enabled: true, source: 'demo', radiusNm: 15, iss: false },
            }), undefined, { offline: true });
            await waitFor(() => p.flightsStatus === 'ok');
            const first = new Map(p.flightsNow.map(fp => [fp.hex, { lat: fp.lat, lon: fp.lon }]));
            t0 += 120000;                             // two minutes later
            await p._pollFlights();
            let moved = 0;
            for (const fp of p.flightsNow) {
              const a = first.get(fp.hex);
              if (!a) continue;
              if (F.flightBearingDistance(a.lat, a.lon, fp.lat, fp.lon).distNm > 0.05) moved++;
            }
            eq('36f: every aircraft moved over two minutes', moved, p.flightsNow.length);
            // NEGATIVE CONTROL: at the SAME instant nothing moves, so the motion
            // above is the clock and not per-call randomness.
            const snap = p.flightsNow.map(fp => [fp.hex, fp.lat, fp.lon].join(':')).join('|');
            await p._pollFlights();
            eq('36f: NEG re-polling at the same instant is identical',
              p.flightsNow.map(fp => [fp.hex, fp.lat, fp.lon].join(':')).join('|'), snap);
            quiesce(p);
          } finally { Date.now = realNow; }
        }

        // (g) The EMERGENCY aircraft drives the real alert lifecycle — and can
        //     be switched off without leaving the source, because it is the one
        //     fleet member with an effect outside the sky.
        {
          const { p } = await boot(makeStore({
            flights: { enabled: true, source: 'demo', radiusNm: 15, iss: false },
          }), undefined, { offline: true });
          await waitFor(() => p.flightsStatus === 'ok');
          ok('36g: the emergency aircraft is in the sky',
            p.flightsNow.some(fp => fp.hex === EMERG_HEX && F.isEmergency(fp)));
          await waitFor(() => p.flightAlerts.some(a => a.id === `flight:emerg:${EMERG_HEX}`));
          const al = p.flightAlerts.find(a => a.id === `flight:emerg:${EMERG_HEX}`);
          ok('36g: … and raised a real Alert Center row', !!al);
          eq('36g: … at error severity', al?.severity, 'error');
          // Opt out; the aircraft and its alert both go, the rest of the fleet stays.
          const n0 = p.flightsNow.length;
          p.setFlights(f => { f.demo = { ...(f.demo ?? {}), emergency: false }; });
          await waitFor(() => p.flightsStatus === 'ok'
            && !p.flightsNow.some(fp => fp.hex === EMERG_HEX));
          ok('36g: opting out removes the emergency aircraft',
            !p.flightsNow.some(fp => fp.hex === EMERG_HEX));
          eq('36g: … and exactly one aircraft', p.flightsNow.length, n0 - 1);
          ok('36g: … and nothing else is emergency-flagged',
            !p.flightsNow.some(fp => F.isEmergency(fp)));
          quiesce(p);
        }

        // (h) `setFlights` sanitizes the demo block like every other knob —
        //     HERE, not in the settings UI, so an import lands the same shape.
        {
          const { p } = await boot(makeStore({
            flights: { enabled: true, source: 'demo', iss: false },
          }), undefined, { offline: true });
          await waitFor(() => p.flightsStatus === 'ok');
          p.setFlights(f => { f.demo = { fleet: 0, seed: 0, lat: 12.5 }; });
          eq('36h: a too-small fleet clamps up to 1', p.store.flights.demo.fleet, 1);
          ok('36h: a zero seed is dropped', p.store.flights.demo.seed === undefined);
          ok('36h: half a coordinate is dropped', p.store.flights.demo.lat === undefined);
          ok('36h: … and the fleet really did shrink the sky',
            p.flightsNow.length <= 1, `n=${p.flightsNow.length}`);
          // An over-large fleet clamps to the roster length — which IS the
          // default, so the "exactly the default clears" rule then collapses the
          // whole block. Both halves of that in one step.
          p.setFlights(f => { f.demo = { fleet: 9999 }; });
          ok('36h: an over-large fleet clamps to the roster and collapses away',
            p.store.flights.demo === undefined, JSON.stringify(p.store.flights.demo));
          await waitFor(() => (p.flightsNow?.length ?? 0) > 1);
          ok('36h: … leaving the full fleet flying again',
            p.flightsNow.length > 1, `n=${p.flightsNow.length}`);
          quiesce(p);

      ok('12: operator (`ownOp`) extracted', count('operator') === 37, `n=${count('operator')}`);

      ok('12: a known entry carries the full identity set',

      ok('12: the fixture carries 4 LADD-flagged aircraft', laddRaw.length === 4, `n=${laddRaw.length}`);

      ok('19: unknown keys dropped', JSON.stringify(S(['callsign', 'nope'])) === JSON.stringify(['callsign']));
      ok('19: case + whitespace normalized', JSON.stringify(S([' REG '])) === JSON.stringify(['reg']));
      ok('19: duplicates dropped', JSON.stringify(S(['alt', 'alt', 'ALT'])) === JSON.stringify(['alt']));
      ok('19: non-string entries ignored', JSON.stringify(S([42, null, {}, 'dist'])) === JSON.stringify(['dist']));
      ok('19: empty / all-unknown → undefined',
        S([]) === undefined && S(['zzz']) === undefined);
      ok('19: non-array → undefined',
        S(undefined) === undefined && S(null) === undefined && S('callsign') === undefined && S(7) === undefined);
      ok('19: every documented key round-trips',
        JSON.stringify(S([...F.FLIGHT_LABEL_FIELDS])) === JSON.stringify([...F.FLIGHT_LABEL_FIELDS]));
    }

    // ── 16b. Label TEXT resolvers, hoisted into flights.ts ──────────────────
    // `flightFieldText` / `flightLabelLines` (+ the privacy gates and the
    // identifier ladder they call) used to be mirrored ~20-line copies in
    // canvas-render.ts and three-renderer.ts with no parity test — the last
    // such pair after the glow ladder moved here. Both renderers now delegate
    // to THESE, so goldening them here pins the 2D line and the 3D plate at
    // once. Numeric fields are BUCKETED so a live aircraft doesn't repaint
    // every poll: alt 100 ft, speed 10 kt, distance 0.5 nm.
    {
      const FT = F.flightFieldText, LL = F.flightLabelLines;
      // A fully-populated aircraft; bucketing boundaries chosen to be visible.
      const fp = {
        hex: 'a1b2c3', callsign: 'SWA2451', reg: 'N8654B', typeCode: 'B738',
        operator: 'Southwest Airlines Company', altFt: 34567, gsKt: 447,
        vertRateFpm: 0, squawk: '1200', distNm: 7.34,
        pia: false, ladd: false,
      };
      ok('19b: callsign field is the resolved identifier',
        FT('callsign', fp, 'IDENT', false) === 'IDENT', FT('callsign', fp, 'IDENT', false));
      ok('19b: reg / type pass through verbatim',
        FT('reg', fp, '', false) === 'N8654B' && FT('type', fp, '', false) === 'B738');
      ok('19b: operator truncates at 22 chars',
        FT('operator', fp, '', false) === 'Southwest Airlines Com'
        && fp.operator.length > 22,
        FT('operator', fp, '', false));
      ok('19b: alt buckets to 100 ft and thousands-separates',
        FT('alt', fp, '', false) === '34,600 ft', FT('alt', fp, '', false));
      ok('19b: speed buckets to 10 kt',
        FT('speed', fp, '', false) === '450 kt', FT('speed', fp, '', false));
      ok('19b: dist buckets to 0.5 nm at one decimal',
        FT('dist', fp, '', false) === '7.5 nm', FT('dist', fp, '', false));
      ok('19b: squawk is prefixed', FT('squawk', fp, '', false) === 'sq 1200');
      ok('19b: level flight yields no trend', FT('trend', fp, '', false) === '');
      ok('19b: climb / descend at the ±300 fpm gates',
        FT('trend', { ...fp, vertRateFpm: 300 }, '', false) === '↑ climb'
        && FT('trend', { ...fp, vertRateFpm: -300 }, '', false) === '↓ descend'
        && FT('trend', { ...fp, vertRateFpm: 299 }, '', false) === '');
      ok('19b: suppress withholds reg / type / operator, never alt',
        FT('reg', fp, '', true) === '' && FT('type', fp, '', true) === ''
        && FT('operator', fp, '', true) === '' && FT('alt', fp, '', true) === '34,600 ft');
      ok('19b: missing optional fields resolve empty, not "null"',
        FT('reg', { ...fp, reg: null }, '', false) === ''
        && FT('speed', { ...fp, gsKt: null }, '', false) === ''
        && FT('dist', { ...fp, distNm: null }, '', false) === ''
        && FT('squawk', { ...fp, squawk: null }, '', false) === '');
      ok('19b: an unknown field key resolves empty', FT('nope', fp, 'IDENT', false) === '');

      // Identifier ladder: callsign → registration → hex (uppercased).
      ok('19b: identifier prefers callsign, then reg, then hex',
        F.flightIdentifier(fp, false) === 'SWA2451'
        && F.flightIdentifier({ ...fp, callsign: '  ' }, false) === 'N8654B'
        && F.flightIdentifier({ ...fp, callsign: null, reg: null }, false) === 'A1B2C3');
      ok('19b: a suppressed identifier is the hex alone',
        F.flightIdentifier(fp, true) === 'A1B2C3');

      // Privacy gates: LADD keeps identity + badge; PIA withholds identity.
      ok('19b: privacy gates are off when privacyDim is off',
        F.flightPrivacyDimmed({ ...fp, pia: true }, false) === false
        && F.flightIdentitySuppressed({ ...fp, pia: true }, false) === false);
      ok('19b: LADD dims but does not suppress',
        F.flightPrivacyDimmed({ ...fp, ladd: true }, true) === true
        && F.flightIdentitySuppressed({ ...fp, ladd: true }, true) === false);
      ok('19b: PIA both dims and suppresses',
        F.flightPrivacyDimmed({ ...fp, pia: true }, true) === true
        && F.flightIdentitySuppressed({ ...fp, pia: true }, true) === true);

      // Two-line goldens — the exact strings both renderers paint.
      const dflt = LL(fp, [...F.FLIGHT_LABEL_FIELDS_DEFAULT], true);
      ok('19b: default plate is callsign headline + altitude detail',
        dflt.top === 'SWA2451' && dflt.sub === '34,600 ft', `${dflt.top} / ${dflt.sub}`);
      const many = LL(fp, ['callsign', 'operator', 'alt', 'speed', 'dist'], true);
      ok('19b: first field is the headline, the rest join on " · "',
        many.top === 'SWA2451'
        && many.sub === 'Southwest Airlines Com · 34,600 ft · 450 kt · 7.5 nm',
        `${many.top} / ${many.sub}`);
      const gappy = LL({ ...fp, reg: null, vertRateFpm: 0 }, ['reg', 'trend', 'alt'], true);
      ok('19b: empty fields drop out rather than blanking a line',
        gappy.top === '34,600 ft' && gappy.sub === '', `${gappy.top} / ${gappy.sub}`);
      const none = LL({ ...fp, reg: null }, ['reg'], true);
      ok('19b: when every field resolves empty the identifier stands alone',
        none.top === 'SWA2451' && none.sub === '', `${none.top} / ${none.sub}`);
      const pia = LL({ ...fp, pia: true }, ['callsign', 'reg', 'operator', 'alt'], true);
      ok('19b: a PIA plate shows the badged hex + altitude, no identity',
        pia.top === '🔒 A1B2C3' && pia.sub === '34,600 ft', `${pia.top} / ${pia.sub}`);
      const piaOff = LL({ ...fp, pia: true }, ['callsign', 'reg', 'alt'], false);
      ok('19b: privacyDim:false restores a PIA aircraft\'s identity',
        piaOff.top === 'SWA2451' && piaOff.sub === 'N8654B · 34,600 ft',
        `${piaOff.top} / ${piaOff.sub}`);
      const ladd = LL({ ...fp, ladd: true }, ['callsign', 'reg'], true);
      ok('19b: a LADD plate keeps its identity behind the 🔒 badge',
        ladd.top === '🔒 SWA2451' && ladd.sub === 'N8654B', `${ladd.top} / ${ladd.sub}`);
      ok('19b: an empty field list still yields the identifier',
        LL(fp, [], true).top === 'SWA2451');
    }

    // ── 17. Glow-rule wildcard matcher (docs/research/flight-glow-rules.md §3) ─
    // The hybrid rule: a pattern with NO wildcard is a friendly SUBSTRING match;
    // a pattern with `*` or `?` is matched ANCHORED. Compiled by hand-walking
    // the string — the user's raw text NEVER reaches `new RegExp` unescaped, so
    // this can never become a second real-regex surface.
    {
      const G = F.globMatch;
      ok('20: bare text is a substring match', G('Southwest', 'Southwest Airlines Co.'));
      ok('20: bare text matches mid-string too', G('west Air', 'Southwest Airlines Co.'));
      ok('20: bare text is case-insensitive both ways',
        G('southWEST', 'Southwest Airlines Co.') && G('SOUTHWEST', 'southwest airlines'));
      ok('20: bare text that is absent does not match', G('Delta', 'Southwest Airlines Co.') === false);

      ok('20: a `*` makes the match ANCHORED (prefix)', G('SWA*', 'SWA2451'));
      ok('20: anchored prefix rejects a mid-string hit', G('SWA*', 'XSWA2451') === false);
      ok('20: `*` matches the empty run', G('SWA*', 'SWA'));
      ok('20: a leading `*` anchors at the end', G('*451', 'SWA2451') && G('*451', 'SWA24510') === false);
      ok('20: `*x*` is an explicit substring', G('*west*', 'Southwest Airlines'));
      ok('20: `?` is EXACTLY one character',
        G('B73?', 'B737') && G('B73?', 'B738') && G('B73?', 'B73') === false
        && G('B73?', 'B7378') === false);
      ok('20: `?` and `*` compose', G('N?2*', 'N123AB') && G('N?2*', 'N13AB') === false);
      ok('20: anchored is NOT substring — the §3.1 false-positive guard',
        G('A32*', 'A320') && G('A32*', 'DC-A320') === false);

      // Regex metacharacters in a LITERAL pattern must stay literal (a user
      // typing "AAL.*" means a dot, not "any run"), and nothing may throw.
      ok('20: a literal dot is a dot, not a regex wildcard',
        G('AAL.', 'AAL.') && G('AAL.', 'AALX') === false);
      ok('20: `.*` in plain text is literal (no accidental regex)',
        G('AAL.*', 'AAL.*23') && G('AAL.*', 'AAL123') === false);
      const hostiles = ['(((', ')', '[a-z', '\\', '^$', '+++', '{2,}', 'a|b', '/x/', 'a-b',
        '(a+)+$', '\\d{3}'];
      let threw = false, matchedItself = true;
      for (const h of hostiles) {
        try {
          if (!G(h, `pre${h}post`)) matchedItself = false;
        } catch { threw = true; }
      }
      ok('20: metacharacter-laden literals never throw', threw === false);
      ok('20: metacharacter-laden literals match themselves literally', matchedItself);
      ok('20: a catastrophic-backtracking shape is inert (no regex semantics)',
        G('(a+)+$', 'aaaaaaaaaaaaaaaaaaaaaaaaaaX') === false);

      ok('20: a blank / absent pattern is "any" (unset criterion)',
        G('', 'anything') && G('   ', 'anything') && G(undefined, 'anything') && G(null, 'anything'));
      ok('20: a null value can only satisfy a blank pattern',
        G('N*', null) === false && G('N*', undefined) === false && G('N*', '') === false
        && G('', null) === true);
      ok('20: repeated calls hit the compile cache and agree',
        G('SWA*', 'SWA1') && G('SWA*', 'SWA1') && G('SWA*', 'AAL1') === false);
    }

    // ── 18. Criteria matching — AND across every present field (§3.3) ────────
    {
      const M = F.matchesGlowCriteria;
      const AC = o => ({
        hex: 'abc123', callsign: 'SWA2451', lat: 40, lon: -75, altFt: 12000,
        gsKt: 320, trackDeg: 90, vertRateFpm: 0, category: 'A3', seenPosS: 1,
        military: false, reg: 'N8642A', typeCode: 'B738',
        typeDesc: 'BOEING 737 MAX 8', operator: 'Southwest Airlines Co.',
        emergency: null, squawk: '1200', interesting: false, pia: false, ladd: false,
        distNm: 7.5, ...o,
      });
      const base = AC();
      ok('21: empty criteria match everything (the catch-all rule)',
        M(base, {}) && M(AC({ military: true, callsign: null }), {}));
      ok('21: undefined criteria object matches', M(base, undefined));

      ok('21: operator wildcard', M(base, { operator: 'Southwest' }) && !M(base, { operator: 'Delta' }));
      ok('21: typeCode wildcard', M(base, { typeCode: 'B73*' }) && !M(base, { typeCode: 'A32*' }));
      ok('21: typeDesc wildcard', M(base, { typeDesc: '*MAX*' }) && !M(base, { typeDesc: '*NEO*' }));
      ok('21: reg wildcard', M(base, { reg: 'N*' }) && !M(base, { reg: 'G-*' }));
      ok('21: callsign wildcard', M(base, { callsign: 'SWA*' }) && !M(base, { callsign: 'UAL*' }));
      ok('21: category wildcard', M(base, { category: 'A3' }) && !M(base, { category: 'A7' }));
      ok('21: a null string field fails a set criterion',
        !M(AC({ reg: null }), { reg: 'N*' }) && M(AC({ reg: null }), {}));

      ok('21: minAltFt / maxAltFt bound independently',
        M(base, { minAltFt: 10000 }) && !M(base, { minAltFt: 15000 })
        && M(base, { maxAltFt: 15000 }) && !M(base, { maxAltFt: 10000 }));
      ok('21: an altitude RANGE is inclusive at both ends',
        M(base, { minAltFt: 12000, maxAltFt: 12000 })
        && M(base, { minAltFt: 5000, maxAltFt: 20000 })
        && !M(base, { minAltFt: 5000, maxAltFt: 11999 }));
      ok('21: speed bounds', M(base, { minSpeedKt: 300, maxSpeedKt: 400 })
        && !M(base, { minSpeedKt: 400 }) && !M(base, { maxSpeedKt: 200 }));
      ok('21: a NULL speed FAILS a speed criterion (never silently passes)',
        !M(AC({ gsKt: null }), { minSpeedKt: 0 }) && !M(AC({ gsKt: null }), { maxSpeedKt: 900 })
        && M(AC({ gsKt: null }), {}));
      ok('21: distance bounds use the planner-filled distNm',
        M(base, { maxDistNm: 10 }) && !M(base, { maxDistNm: 5 })
        && M(base, { minDistNm: 5 }) && !M(base, { minDistNm: 10 }));
      ok('21: a missing distNm FAILS a distance criterion',
        !M(AC({ distNm: undefined }), { maxDistNm: 500 }));

      ok('21: tri-state military', M(AC({ military: true }), { military: true })
        && !M(base, { military: true }) && M(base, { military: false })
        && M(AC({ military: true }), {}));
      ok('21: tri-state interesting / ladd / pia',
        M(AC({ interesting: true }), { interesting: true }) && !M(base, { interesting: true })
        && M(AC({ ladd: true }), { ladd: true }) && M(base, { ladd: false })
        && M(AC({ pia: true }), { pia: true }) && !M(base, { pia: true }));
      ok('21: tri-state emergency reads through isEmergency (squawk or field)',
        M(AC({ squawk: '7700' }), { emergency: true })
        && M(AC({ emergency: 'lifeguard' }), { emergency: true })
        && M(base, { emergency: false }) && !M(base, { emergency: true }));

      ok('21: every present criterion is ANDed',
        M(base, { operator: 'Southwest', typeCode: 'B73*', minAltFt: 10000, military: false })
        && !M(base, { operator: 'Southwest', typeCode: 'B73*', minAltFt: 10000, military: true })
        && !M(base, { operator: 'Delta', typeCode: 'B73*' }));

      // The real 94-aircraft capture: wildcard matching against genuine data.
      const real = F.normalizeAircraftList(LAX);
      const nReg = real.filter(a => M(a, { reg: 'N*' })).length;
      const anyReg = real.filter(a => a.reg != null).length;
      ok('21: `N*` matches only US-registered aircraft in the real capture',
        nReg > 0 && nReg <= anyReg && real.every(a => !M(a, { reg: 'N*' }) || /^N/i.test(a.reg ?? '')),
        `${nReg}/${anyReg} registered`);
      ok('21: a catch-all matches every aircraft in the real capture',
        real.every(a => M(a, {})), `n=${real.length}`);
    }

    // ── 19. Resolution: rule list + the three-tier precedence (§4) ───────────
    {
      const R = F.resolveFlightGlow;
      const AC = o => ({
        hex: 'abc123', callsign: 'SWA2451', lat: 40, lon: -75, altFt: 12000,
        gsKt: 320, trackDeg: 90, vertRateFpm: 0, category: 'A3', seenPosS: 1,
        military: false, reg: 'N8642A', typeCode: 'B738', typeDesc: 'BOEING 737 MAX 8',
        operator: 'Southwest Airlines Co.', emergency: null, squawk: '1200',
        interesting: false, pia: false, ladd: false, distNm: 7.5, ...o,
      });
