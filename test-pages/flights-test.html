<!doctype html>
<meta charset="utf-8">
<title>FLIGHTS …</title>
<style>
  body { margin:0; background:#0d1116; color:#cfd8dc; font:13px/1.5 sans-serif; padding:14px; }
  h1 { font-size:15px; margin:0 0 10px; }
  h2 { font-size:12px; margin:14px 0 4px; color:#78909c; text-transform:uppercase; letter-spacing:.06em; }

  .okbg { background:#12331f; color:#69f0ae; } .badbg { background:#3a1414; color:#ff8a80; }
  .row { display:flex; justify-content:space-between; gap:10px; padding:2px 0; border-bottom:1px solid #1c2530; }

</style>
<h1>Flights &amp; ISS (roadmap P4) — normalizer · compression curves · bearing/distance · satAltAz · Planner wiring</h1>
<div id="summary">Running…</div>
<div id="rows"></div>

<!-- Fixture provenance:
       fixtures/adsb/airplanes-live-lax.json — REAL capture (2026-07-24) of
         `curl -s 'https://api.airplanes.live/v2/point/33.9425/-118.408/25'`
         (94 aircraft, 50 of them on the ground). Not hand-edited.
       fixtures/adsb/local-aircraft.json — hand-authored readsb {aircraft:[...]}
         shape covering the edge cases a real capture won't reliably contain:
         a "ground" sentinel, a no-position entry, an mlat/alt_geom-only entry,
         a military dbFlags entry, a string-typed lat, a blank callsign.
       fixtures/adsb/garbage.json — hand-authored malformed corpus.
       fixtures/adsb/opensky-states.json — REAL capture (2026-08-15) of
         `curl -s 'https://opensky-network.org/api/states/all?lamin=40.4&lomin=-74.3&lamax=41.0&lomax=-73.7'`
         (45 positional-array states over New York; 30 on the ground, 3 with a
         blank callsign, many null-heavy). Not hand-edited.
       fixtures/adsb/adsblol-point.json — 10 aircraft TRIMMED (unedited rows,
         envelope preserved) from a REAL 818-aircraft capture (2026-08-15) of
         `curl -s 'https://api.adsb.lol/v2/lat/51.89508/lon/2.79437/dist/250'`
         — chosen to cover a "ground" sentinel, a C2 surface vehicle, military
         and LADD dbFlags, an ultralight, a gs-less row and ordinary airliners.
       fixtures/adsb/local-wide-catch.json — GENERATED (deterministic; great-circle
         destination points about 47.6/-122.3, the harness HOME) to model what a
         LAN receiver actually hears, which no cloud capture can: 60 airborne
         inside 40 nm (over the 50 cap), 14 airborne from 45 out to 221 nm,
         5 "ground" sentinels, 3 null-altitude rows, 2 rows with no altitude key
         at all, and 1 alt_baro-null/alt_geom-present fallback row. 85 total.

     Build (flights.ts AND aircraft-types.ts are genuinely zero-import → plain
     transpile; sky-astro.ts pulls in sky-catalog.ts → bundle; planner per the
     config-test recipe, with the in-memory avatar-store swap because IndexedDB
     does not complete under --virtual-time-budget):
       npx esbuild src/flights.ts --format=esm --outfile=<harness>/flights.mod.js
       npx esbuild src/aircraft-types.ts --format=esm --outfile=<harness>/aircraft-types.mod.js
       npx esbuild src/airlines.ts --format=esm --outfile=<harness>/airlines.mod.js
       npx esbuild src/sky-astro.ts --bundle --format=esm --outfile=<harness>/sky-astro.mod.js
       T=$(mktemp -d); cp -r src/* "$T"/
       cp test-pages/fake-avatar-store.ts "$T"/avatar-store.ts
       npx esbuild "$T"/planner.ts --bundle --format=esm --outfile=<harness>/planner.mod.js
-->
<script type="module">
  const V = '?v=' + Date.now();
  const F = await import('./flights.mod.js' + V);

  // ── Base-shell view of the geometry API ──────────────────────────────────
  // The display shell's radius is USER-DEFINABLE (FlightsConfig.shellRadiusM):
  // every geometry function takes a trailing `shellMm`, whose ABSENT default is
  // the 300 m user default. All the derivation goldens below were authored
  // against the 120 m AUTHORED REFERENCE (FLIGHT_SHELL_BASE_MM), so sections
  // 3–6d call through `FB` — the very same functions with `shellMm` pinned to
  // that reference — and stay byte-identical. Section 6e then exercises the new
  // default, the clamp and the SIMILARITY law that relates the two.
  const BASE = F.FLIGHT_SHELL_BASE_MM;
  const FB = {
    ...F,
    compressRadiusMm: (d, r, s = BASE) => F.compressRadiusMm(d, r, s),
    compressAltitudeMm: (a, s = BASE) => F.compressAltitudeMm(a, s),
    flightDisplayAltitudeMm: (a, d, r, s = BASE) => F.flightDisplayAltitudeMm(a, d, r, s),
    flightDisplayScale: (r, s = BASE) => F.flightDisplayScale(r, s),
    flightDisplayPos: (fp, la, lo, th, rad, s = BASE) =>
      F.flightDisplayPos(fp, la, lo, th, rad, s),
  };
  const AT = await import('./aircraft-types.mod.js' + V);
  const SA = await import('./sky-astro.mod.js' + V);
  const { Planner } = await import('./planner.mod.js' + V);

  const results = [];
  const ok = (name, cond, extra = '') => results.push({ name, pass: !!cond, extra: String(extra) });
  const near = (name, got, want, tol, extra = '') =>
    ok(name, Math.abs(got - want) <= tol, extra || `got ${got}, want ${want}±${tol}`);
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  async function waitFor(cond, tries = 800) {
    for (let i = 0; i < tries; i++) { if (cond()) return true; await sleep(4); }
    return !!cond();
  }
  const clone = x => JSON.parse(JSON.stringify(x));
  const TWO_PI = Math.PI * 2;

  const LAX = await (await fetch('./fixtures/adsb/airplanes-live-lax.json' + V)).json();
  const LOCAL = await (await fetch('./fixtures/adsb/local-aircraft.json' + V)).json();
  const GARBAGE = await (await fetch('./fixtures/adsb/garbage.json' + V)).json();
  const OPENSKY = await (await fetch('./fixtures/adsb/opensky-states.json' + V)).json();
  const ADSBLOL = await (await fetch('./fixtures/adsb/adsblol-point.json' + V)).json();
  const WIDE = await (await fetch('./fixtures/adsb/local-wide-catch.json' + V)).json();

  try {
    // ── 1. Normalizer ────────────────────────────────────────────────────────
    {
      const cloud = F.normalizeAircraftList(LAX);
      ok('1: real cloud fixture parses', cloud.length === 44, `n=${cloud.length} (94 raw, 50 on ground)`);
      ok('1: every entry has finite hex/lat/lon/altFt', cloud.every(a =>
        typeof a.hex === 'string' && a.hex.length > 0 &&
        Number.isFinite(a.lat) && Number.isFinite(a.lon) && Number.isFinite(a.altFt)));
      ok('1: hex lowercased', cloud.every(a => a.hex === a.hex.toLowerCase()));
      ok('1: no "ground" survivors', cloud.every(a => a.altFt !== 'ground'));
      ok('1: callsigns trimmed (no trailing pad)', cloud.every(a =>
        a.callsign === null || a.callsign === a.callsign.trim()));
      ok('1: blank callsigns became null', cloud.filter(a => a.callsign === null).length === 2,
        `nulls=${cloud.filter(a => a.callsign === null).length}`);
      ok('1: cloud dst carried into distNm', cloud.every(a => Number.isFinite(a.distNm)));

      const local = F.normalizeAircraftList(LOCAL);
      ok('2: local {aircraft:[…]} envelope parses', local.length === 5, `n=${local.length}`);
      const byHex = Object.fromEntries(local.map(a => [a.hex, a]));
      ok('2: "ground" sentinel filtered (no alt_geom fallback)', !byHex.bbbbbb);
      ok('2: no-position entry filtered', !byHex.cccccc);
      ok('2: string lat rejected (strict numbers)', !byHex['111111']);
      ok('2: normal entry fields', byHex.a1b2c3 && byHex.a1b2c3.callsign === 'UAL123' &&
        byHex.a1b2c3.altFt === 12000 && byHex.a1b2c3.gsKt === 320.4 &&
        byHex.a1b2c3.trackDeg === 180.2 && byHex.a1b2c3.vertRateFpm === -640 &&
        byHex.a1b2c3.seenPosS === 0.4 && byHex.a1b2c3.category === 'A3');
      ok('2: mlat entry kept via alt_geom fallback', byHex.dddddd && byHex.dddddd.altFt === 3400);
      ok('2: source hex uppercase → lowercased', !!byHex.eeeeee);
      ok('2: blank flight → null callsign', byHex.eeeeee && byHex.eeeeee.callsign === null);
      ok('2: dbFlags bit 1 → military', byHex.eeeeee && byHex.eeeeee.military === true);
      ok('2: dbFlags 8 (LADD) is NOT military', byHex.ffffff && byHex.ffffff.military === false);
      ok('2: absent dbFlags → military false', byHex.a1b2c3 && byHex.a1b2c3.military === false);
      ok('2: geom_rate vertRate fallback', byHex.ffffff && byHex.ffffff.vertRateFpm === 300);
      ok('2: true_heading track fallback', byHex['222222'] && byHex['222222'].trackDeg === 45);
      ok('2: absent optional fields → null not NaN', byHex.dddddd &&
        byHex.dddddd.vertRateFpm === null && byHex['222222'].vertRateFpm === null);
      ok('2: no distNm when source lacks dst', byHex.a1b2c3 && byHex.a1b2c3.distNm === undefined);

      // Envelope equivalence: {ac} vs {aircraft} vs a bare array.
      const bare = LOCAL.aircraft;
      const asAc = F.normalizeAircraftList({ ac: bare });
      const asFlights = F.normalizeAircraftList({ flights: bare });
      const asBare = F.normalizeAircraftList(bare);
      const sig = l => JSON.stringify(l.map(a => a.hex + ':' + a.altFt));
      ok('3: {ac} envelope == {aircraft}', sig(asAc) === sig(local));
      ok('3: {flights} envelope == {aircraft}', sig(asFlights) === sig(local));
      ok('3: bare array == {aircraft}', sig(asBare) === sig(local));

      // Never throws — every shape of garbage.
      let threw = false;
      const bad = [null, undefined, 42, 'string', true, {}, { aircraft: 'nope' }, { ac: 42 },
        [[]], [null], NaN, { aircraft: null }, () => {}];
      let allEmpty = true;
      for (const b of bad) {
        try { const r = F.normalizeAircraftList(b); if (r.length !== 0) allEmpty = false; }
        catch { threw = true; }
      }
      ok('4: garbage inputs never throw', !threw);
      ok('4: garbage inputs → []', allEmpty);
      let g = null, gThrew = false;
      try { g = F.normalizeAircraftList(GARBAGE); } catch { gThrew = true; }
      ok('4: malformed-entry corpus does not throw', !gThrew);
      ok('4: every malformed entry skipped', g && g.length === 0, `n=${g ? g.length : 'threw'}`);
      ok('4: out-of-range lat/lon rejected', g && g.length === 0);
    }

    // ── 2. aircraftModelKind ────────────────────────────────────────────────
    {
      const mk = c => F.aircraftModelKind({ category: c });
      ok('5: A7 → heli', mk('A7') === 'heli');
      ok('5: A1 → prop', mk('A1') === 'prop');
      ok('5: A2 → prop', mk('A2') === 'prop');
      ok('5: A3 → jet', mk('A3') === 'jet');
      ok('5: A5 → jet', mk('A5') === 'jet');
      ok('5: null category → jet', mk(null) === 'jet');
      ok('5: unknown category → jet', mk('D7') === 'jet');
    }

    // ── 3. compressRadiusMm — RADIUS-ANCHORED piecewise-linear mapping ──────
    // Report 1 (radial remap): "flights 10 miles away still appear close to the
    // property line… if 15 nm is entered, the entries 15 miles away should be
    // fairly small and render at the edge of the dome; the 10 nm entries should
    // be midpoint between the home and the horizon." The old asymptotic curve
    // (rMax·d/(d+K)) front-loaded distance and NEVER reached the rim — at
    // radius 15 it put 10 nm at 71 % of the shell and 15 nm at 79 %.
    //
    // Report 2 (near-field collapse): the fix for report 1 was the power law
    // r = rMax·(d/R)^P, P = ln2/ln1.5 — the unique POWER through those two
    // anchors. It hit both anchors but collapsed everything below the midpoint:
    // "a plane at 6.5 nm with a radius of 15 nm and a draw distance of 300 m
    // renders this plane in the backyard… at 2 nm it is rendering over the
    // house." The mapping is now the PIECEWISE-LINEAR curve through the very
    // same anchors:
    //   f(u) = 0.75·u          u ≤ 2/3      (slope = midF / midU)
    //   f(u) = 1.5·u − 0.5     u > 2/3      (slope = (1−midF)/(1−midU))
    // Both anchors still hold EXACTLY, but the near field is now PROPORTIONAL
    // (f′(0) = 0.75) instead of vanishing.
    {
      const R = FB.FLIGHT_SHELL.rMaxMm;
      const MIDU = FB.FLIGHT_SHELL.radialMidU, MIDF = FB.FLIGHT_SHELL.radialMidF;
      const HEAD = FB.FLIGHT_SHELL.radialHeadroom, RMAX_HEAD = R * (1.5 * HEAD - 0.5);
      ok('6: 0 nm → 0 mm', FB.compressRadiusMm(0, 30) === 0);
      let mono = true, bounded = true, prev = -1;
      for (let d = 0; d <= 250; d += 0.1) {
        const v = FB.compressRadiusMm(d, 30);
        if (v < prev - 1e-9) mono = false;
        if (!(v <= RMAX_HEAD + 1e-6)) bounded = false;
        prev = v;
      }
      ok('6: monotonically non-decreasing over 0..250 nm', mono);
      ok('6: bounded by rMaxMm · f(headroom) = 1.075 (the dead-reckoning slack)', bounded,
        `cap=${RMAX_HEAD.toFixed(1)}`);
      ok('6: negative distance clamps to 0', FB.compressRadiusMm(-5, 30) === 0);
      ok('6: non-finite distance clamps to 0', FB.compressRadiusMm(NaN, 30) === 0);

      // THE anchors, and the two slopes derived from them.
      near('6: radialMidU is ⅔ (the ⅔-radius anchor)', MIDU, 2 / 3, 1e-15);
      near('6: radialMidF is ½ (…which renders at the midpoint)', MIDF, 0.5, 0);
      near('6: near-field slope is midF/midU = 0.75', MIDF / MIDU, 0.75, 1e-12);
      near('6: far-field slope is (1−midF)/(1−midU) = 1.5', (1 - MIDF) / (1 - MIDU), 1.5, 1e-12);
      near('6: radialHeadroom is 1.05', HEAD, 1.05, 0);

      // Continuity at the kink: the slope changes, the value must not jump.
      {
        const EPS = 1e-6, uL = MIDU - EPS, uR = MIDU + EPS;
        const fL = FB.compressRadiusMm(uL * 15, 15) / R, fR = FB.compressRadiusMm(uR * 15, 15) / R;
        ok('6: continuous at the u = ⅔ kink (no jump, only a slope change)',
          Math.abs(fR - fL) <= 2 * EPS * 1.5 + 1e-12, `Δ=${(fR - fL).toExponential(2)}`);
        near('6: …and the kink value IS the midpoint anchor', fL, 0.5, 1e-5);
      }

      // "Matches the radius entry": the SAME two anchors must hold at every
      // configured radius — the shell is a scale model of whatever the user
      // typed, so 10-of-15 and 20-of-30 read identically.
      let rimAll = true, midAll = true, sevenAll = true;
      for (const rad of [5, 15, 30, 100]) {
        if (Math.abs(FB.compressRadiusMm(rad, rad) - R) > 1e-6) rimAll = false;
        if (Math.abs(FB.compressRadiusMm(2 * rad / 3, rad) - R / 2) > 1e-6) midAll = false;
        // …and the whole curve is radius-invariant in u, not just the anchors.
        if (Math.abs(FB.compressRadiusMm(7 * rad / 15, rad) / R - 0.35) > 1e-9) sevenAll = false;
      }
      ok('6: d = radiusNm renders AT the rim, at every radius (5/15/30/100)', rimAll);
      ok('6: d = ⅔·radiusNm renders at the MIDPOINT, at every radius', midAll);
      ok('6: the curve is a pure function of d/radiusNm (scale model)', sevenAll);
      ok('6: the rim anchor is EXACT at the shipped radius (not merely close)',
        FB.compressRadiusMm(15, 15) === R);
      ok('6: the midpoint anchor is EXACT at the shipped radius', FB.compressRadiusMm(10, 15) === R / 2);

      // The user's headline numbers, at the shipped default radius.
      near('6: 15 nm @ radius 15 → the rim exactly', FB.compressRadiusMm(15, 15), 120000, 1e-9);
      near('6: 10 nm @ radius 15 → half way out exactly', FB.compressRadiusMm(10, 15), 60000, 1e-9);
      near('6: 7.5 nm @ radius 15 → 45,000 mm (37.5 %)',
        FB.compressRadiusMm(7.5, 15), 45000, 1e-9);
      // The OLD curve put 10 nm at 71 % of the shell — the whole complaint.
      const pct10 = 100 * FB.compressRadiusMm(10, 15) / R;
      ok('6: 10 nm is no longer crowded into the outer shell (was 71 %)',
        pct10 > 45 && pct10 < 55, `${pct10.toFixed(1)} %`);

      // ── NEAR-FIELD REGRESSION: the user's exact scenario ─────────────────
      // Radius 15 nm, draw radius 300 m (the shipped default). The power law
      // put 6.5 nm at 23.9 % (≈72 m — "in the backyard") and 2 nm at 3.2 %
      // (≈10 m — "over the house"). Proportional near field fixes both.
      {
        const SH = 300000;
        near('6: 6.5 nm @ radius 15, 300 m shell → 97,500 mm (was ≈72 m, "the backyard")',
          F.compressRadiusMm(6.5, 15, SH), 97500, 1);
        near('6: 2 nm @ radius 15, 300 m shell → 30,000 mm (was ≈10 m, "over the house")',
          F.compressRadiusMm(2, 15, SH), 30000, 1);
        near('6: …i.e. 6.5 of 15 nm is 32.5 % of the shell', F.compressRadiusMm(6.5, 15, SH) / SH,
          0.325, 1e-12);
        near('6: …and 2 of 15 nm is 10 %', F.compressRadiusMm(2, 15, SH) / SH, 0.1, 1e-12);
        // The near field is PROPORTIONAL, not collapsing: halving the distance
        // halves the radius exactly, all the way down (the power law squashed
        // it by 2^P ≈ 3.27× instead).
        let prop = true;
        for (const d of [0.5, 1, 2, 3, 4, 5, 6.5, 8, 9.9]) {
          if (Math.abs(F.compressRadiusMm(d, 15, SH) - 0.75 * (d / 15) * SH) > 1e-6) prop = false;
        }
        ok('6: the sub-midpoint branch is exactly proportional (r = 0.75·d/R·shell)', prop);
      }

      // Beyond the radius the mapping keeps expanding for `headroom`, then
      // pins — the planner filters d > radiusNm, so this is dead-reckoning
      // slack only (a drifting rig must not freeze onto the rim).
      ok('6: keeps expanding just past the rim (dead-reckoning slack)',
        FB.compressRadiusMm(15.3, 15) > R);
      near('6: pins at the headroom cap past 1.05·radius',
        FB.compressRadiusMm(90, 15), RMAX_HEAD, 1e-6);
      ok('6: bigger radius pushes the same aircraft inward',
        FB.compressRadiusMm(20, 100) < FB.compressRadiusMm(20, 20));
      // A garbage/zero radius must not divide by zero — it falls back to the
      // shipped default rather than producing NaN/Infinity.
      near('6: radius 0 falls back to the default radius',
        FB.compressRadiusMm(10, 0), FB.compressRadiusMm(10, FB.FLIGHTS_DEFAULT_RADIUS_NM), 1e-9);
      ok('6: non-finite radius is finite + defaulted',
        Number.isFinite(FB.compressRadiusMm(10, NaN))
        && FB.compressRadiusMm(10, NaN) === FB.compressRadiusMm(10, FB.FLIGHTS_DEFAULT_RADIUS_NM));
    }

    // ── 4. compressAltitudeMm ───────────────────────────────────────────────
    {
      const S = FB.FLIGHT_SHELL;
      near('7: 0 ft → yMinMm', FB.compressAltitudeMm(0), S.yMinMm, 1e-9);
      near('7: altMaxFt → yMaxMm', FB.compressAltitudeMm(S.altMaxFt), S.yMaxMm, 1e-9);
      ok('7: clamps above altMaxFt', FB.compressAltitudeMm(120000) === FB.compressAltitudeMm(S.altMaxFt));
      ok('7: clamps below 0', FB.compressAltitudeMm(-2000) === FB.compressAltitudeMm(0));
      let mono = true, inBand = true, prev = -1;
      for (let a = 0; a <= 50000; a += 25) {
        const v = FB.compressAltitudeMm(a);
        if (v < prev - 1e-9) mono = false;
        if (v < S.yMinMm - 1e-9 || v > S.yMaxMm + 1e-9) inBand = false;
        prev = v;
      }
      ok('7: monotonic over 0..50000 ft', mono);
      ok('7: stays inside [yMin, yMax]', inBand);
      ok('7: non-finite → yMinMm', FB.compressAltitudeMm(NaN) === S.yMinMm);
      ok('7: log knee spends detail low (3000 ft past halfway of 45000 ft band)',
        FB.compressAltitudeMm(3000) - S.yMinMm > (S.yMaxMm - S.yMinMm) * 0.24);
    }

    // ── 5. flightBearingDistance goldens ────────────────────────────────────
    {
      const OLAT = 47.6, OLON = -122.3;
      const b = (dlat, dlon) => FB.flightBearingDistance(OLAT, OLON, OLAT + dlat, OLON + dlon);
      const n = b(0.1, 0), e = b(0, 0.1), s = b(-0.1, 0), w = b(0, -0.1);
      near('8: due north bearing = 0', n.bearingRad, 0, 1e-9);
      near('8: due north distance ≈ 6.004 nm', n.distNm, 6.00405, 0.001);
      near('8: due east bearing = π/2', e.bearingRad, Math.PI / 2, 1e-9);
      near('8: due east distance ≈ 4.049 nm (cos lat)', e.distNm, 4.04854, 0.001);
      near('8: due south bearing = π', s.bearingRad, Math.PI, 1e-9);
      near('8: due west bearing = 3π/2 (normalized, never negative)', w.bearingRad, 3 * Math.PI / 2, 1e-9);
      let inRange = true;
      for (let dl = -1; dl <= 1; dl += 0.05) for (let dn = -1; dn <= 1; dn += 0.05) {
        const r = b(dn, dl).bearingRad;
        if (!(r >= 0 && r < TWO_PI)) inRange = false;
      }
      ok('8: bearing always in [0, 2π)', inRange);
      ok('8: zero offset → distance 0', b(0, 0).distNm === 0);
      // City pair sanity vs the true great-circle distance (LAX → Long Beach).
      const city = FB.flightBearingDistance(33.9425, -118.408, 33.8177, -118.1516);
      const TRUE_NM = 14.8151;   // haversine, R = 6371 km
      ok('8: LAX→LGB distance within 2% of great-circle',
        Math.abs(city.distNm - TRUE_NM) / TRUE_NM < 0.02, `got ${city.distNm.toFixed(3)} nm`);
      near('8: LAX→LGB bearing ≈ 120.4° (SE)', city.bearingRad * 180 / Math.PI, 120.4, 0.5);
    }

    // ── 6. flightDisplayPos ─────────────────────────────────────────────────
    {
      const OLAT = 47.6, OLON = -122.3;
      const fp = (dlat, dlon, alt) => ({ lat: OLAT + dlat, lon: OLON + dlon, altFt: alt });
      const north = FB.flightDisplayPos(fp(0.1, 0, 10000), OLAT, OLON, 0, 30);
      ok('9: θ=0 north aircraft → planY > 0', north.planY > 0, `planY=${north.planY.toFixed(1)}`);
      near('9: θ=0 north aircraft → planX ≈ 0', north.planX, 0, 1e-6);
      near('9: radius matches compressRadiusMm', Math.hypot(north.planX, north.planY),
        FB.compressRadiusMm(north.distNm, 30), 1e-6);
      // dispY is NO LONGER compressAltitudeMm alone — it is capped at the true
      // elevation angle (see section 6b). At 6 nm / 10,000 ft the cap bites.
      ok('9: dispY is the elevation cap, not the raw altitude curve',
        north.dispY < FB.compressAltitudeMm(10000) - 1,
        `dispY=${north.dispY.toFixed(1)} rawCurve=${FB.compressAltitudeMm(10000).toFixed(1)}`);
      near('9: dispY == flightDisplayAltitudeMm(alt, dist, r)', north.dispY,
        FB.flightDisplayAltitudeMm(10000, north.distNm, FB.compressRadiusMm(north.distNm, 30)), 1e-9);
      near('9: distNm echoed from flightBearingDistance', north.distNm, 6.00405, 0.001);
      near('9: bearingRad echoed', north.bearingRad, 0, 1e-9);

      const rot = FB.flightDisplayPos(fp(0.1, 0, 10000), OLAT, OLON, Math.PI / 2, 30);
      near('9: θ=π/2 rotates north aircraft onto −X', rot.planX, -Math.hypot(north.planX, north.planY), 1e-6);
      near('9: θ=π/2 leaves planY ≈ 0', rot.planY, 0, 1e-6);
      near('9: rotation preserves radius', Math.hypot(rot.planX, rot.planY),
        Math.hypot(north.planX, north.planY), 1e-6);

      const east = FB.flightDisplayPos(fp(0, 0.1, 10000), OLAT, OLON, 0, 30);
      ok('9: θ=0 east aircraft → planX > 0 and planY ≈ 0',
        east.planX > 0 && Math.abs(east.planY) < 1e-6);
      const far = FB.flightDisplayPos(fp(0.4, 0, 10000), OLAT, OLON, 0, 30);
      ok('9: farther aircraft renders farther out', far.planY > north.planY);
      ok('9: nothing escapes the shell', Math.hypot(far.planX, far.planY) < FB.FLIGHT_SHELL.rMaxMm);
      // The whole real fixture, projected: no NaN, everything inside the shell.
      const cloud = FB.normalizeAircraftList(LAX);
      let clean = true;
      for (const a of cloud) {
        const p = FB.flightDisplayPos(a, 33.9425, -118.408, 0.3, 25);
        if (!Number.isFinite(p.planX) || !Number.isFinite(p.planY) || !Number.isFinite(p.dispY)) clean = false;
        if (Math.hypot(p.planX, p.planY) >= FB.FLIGHT_SHELL.rMaxMm) clean = false;
        if (p.dispY < FB.FLIGHT_SHELL.clearMm || p.dispY > FB.FLIGHT_SHELL.yMaxMm) clean = false;
      }
      ok('9: all 44 real aircraft project finite + inside the shell', clean);
    }

    // ── 6b. Elevation-true altitude cap ─────────────────────────────────────
    // The user-reported bug: EVERY aircraft read as "directly above the
    // property", because dispY came from compressAltitudeMm alone — a curve
    // that never looked at distance, over an altitude band comparable to the
    // radial shell. The fix caps the display height at the TRUE
    // elevation angle:
    //   dispY = max(clearMm, min(compressAltitudeMm(alt), r · altM / distM))
    // clearMm (6500) is the property-clearance render floor — no aircraft may
    // ever draw low enough to hit the house (user-reported: approach traffic
    // at 1500–2000 ft skimmed the yard at the old 2500 mm yMinMm floor).
    {
      const OLAT = 47.6, OLON = -122.3;
      const FT_M = 0.3048, NM_M = 1852, EARTH_R_M = 6371000, DEGR = Math.PI / 180;
      // An aircraft due NORTH at exactly `distNm` (equirectangular with dlon=0
      // makes east 0, so hypot(east, north) is the north leg exactly).
      const atNm = (distNm, altFt) => ({
        lat: OLAT + (distNm * NM_M) / (EARTH_R_M * DEGR), lon: OLON, altFt,
      });
      const D = (distNm, altFt, radiusNm = 15) =>
        FB.flightDisplayPos(atNm(distNm, altFt), OLAT, OLON, 0, radiusNm);
      const dispAngDeg = d => Math.atan2(d.dispY, Math.hypot(d.planX, d.planY)) * 180 / Math.PI;
      const trueAngDeg = (altFt, distNm) =>
        Math.atan2(altFt * FT_M, distNm * NM_M) * 180 / Math.PI;

      // Distance goldens (radius 15 nm), recomputed for the 2026-07 RADIAL
      // REMAP — now the PIECEWISE-LINEAR mapping (asymptotic rMax·d/(d+K) →
      // power law rMax·(d/R)^P → rMax·f(d/R) with f piecewise linear through
      // the same anchors). The display ANGLES are UNCHANGED — the elevation
      // branch reproduces the true angle at any radius, which is exactly what
      // makes remapping the radius safe — only the radii (and the heights that
      // keep the angle true) move.
      const g1 = D(8.7, 35000);
      near('9b: 35,000 ft @ 8.7 nm → r', Math.hypot(g1.planX, g1.planY), 52200, 0.01);
      near('9b: 35,000 ft @ 8.7 nm → dispY', g1.dispY, 34561.5551, 0.01);
      near('9b: 35,000 ft @ 8.7 nm → 33.5° up (== true)', dispAngDeg(g1), 33.508, 0.01);

      // THE user-facing anchor: an aircraft at exactly the configured radius
      // renders ON the rim, small and low in the sky.
      const g2 = D(15, 35000);
      // (atNm's nm → latitude round-trip is float-exact only to ~1e-9 nm, so
      // the anchor is pinned to 0.01 mm rather than bit-equality here; the
      // exact-equality form lives in section 3 on the pure function.)
      near('9b: 35,000 ft @ 15 nm → r is the rim exactly',
        Math.hypot(g2.planX, g2.planY), 120000, 0.01);
      near('9b: 35,000 ft @ 15 nm → dispY', g2.dispY, 46082.0734, 0.01);
      near('9b: 35,000 ft @ 15 nm → 21.0° up (== true)', dispAngDeg(g2), 21.008, 0.01);

      // …and the second anchor: ⅔ of the radius sits at the shell midpoint.
      const gMid = D(10, 35000);
      near('9b: 35,000 ft @ 10 nm → r is the midpoint exactly',
        Math.hypot(gMid.planX, gMid.planY), 60000, 0.01);
      near('9b: 35,000 ft @ 10 nm → 29.9° up (== true)', dispAngDeg(gMid), 29.943, 0.01);
      ok('9b: the rim aircraft reads LOWER in the sky than the midpoint one',
        dispAngDeg(g2) < dispAngDeg(gMid), `${dispAngDeg(g2).toFixed(1)}° < ${dispAngDeg(gMid).toFixed(1)}°`);

      // Overhead traffic. A 0.5 nm aircraft is 1/30th of the radius, i.e.
      // 0.75/30 = 2.5 % of the shell (the power law put it at 0.3 %, an
      // 8× collapse), so the elevation term is small enough that LOW very-near
      // traffic still rides the clearance floor. It reads steeply overhead,
      // which is the property that matters; the floor is the one documented
      // exception to angle-honesty (a plane must never be able to hit the
      // house), and it can only push the angle UP, never down.
      const g3 = D(0.5, 5000);
      near('9b: 5,000 ft @ 0.5 nm → r', Math.hypot(g3.planX, g3.planY), 3000, 0.01);
      near('9b: 5,000 ft @ 0.5 nm → dispY rides the clearance floor',
        g3.dispY, FB.FLIGHT_SHELL.clearMm, 1e-9);
      ok('9b: 5,000 ft @ 0.5 nm → still reads overhead (> 55° up)', dispAngDeg(g3) > 55,
        `${dispAngDeg(g3).toFixed(1)}°`);
      ok('9b: the floor only ever raises the angle, never lowers it',
        dispAngDeg(g3) >= trueAngDeg(5000, 0.5));
      const g4 = D(0.5, 35000);
      ok('9b: 35,000 ft @ 0.5 nm → reads > 75° up (overhead stays overhead)',
        dispAngDeg(g4) > 75, `${dispAngDeg(g4).toFixed(1)}°`);
      // The log-curve branch is no longer reachable at the default radius (the
      // elevation term peaks at ≈1.05·rMax·altM/(R·NM_M), below the curve for
      // every altitude at R = 15) — it governs at SMALL radii, where the same
      // aircraft is a large fraction of the shell.
      const g5 = D(5, 35000, 5);
      near('9b: 35,000 ft @ 5 nm, radius 5 → the log curve wins',
        g5.dispY, FB.compressAltitudeMm(35000), 1e-9);
      ok('9b: …and the capped angle stays BELOW the true one',
        dispAngDeg(g5) < trueAngDeg(35000, 5), `${dispAngDeg(g5).toFixed(1)}° < 49.0°`);

      // THE original regression: dispY came from the altitude curve alone, so
      // it was completely independent of distance. It is not (the far sample
      // sits past the headroom clamp, where the radius stops growing but the
      // real distance keeps going, so the elevation term falls away).
      ok('9b: dispY is NOT independent of distance (the reported bug)',
        Math.abs(D(3, 35000).dispY - D(30, 35000).dispY) > 1000,
        `${D(3, 35000).dispY.toFixed(0)} vs ${D(30, 35000).dispY.toFixed(0)}`);

      // "Farther = lower in the sky" is an ANGLE property, and under the
      // radius-anchored mapping it is the angle that must be asserted — dispY
      // itself does whatever the branch algebra says. Under the OLD asymptotic
      // radius dispY_elev fell with distance; under the power law it ROSE
      // (∝ d^(P−1)); under the PIECEWISE-LINEAR mapping the sub-midpoint
      // branch is r = shell·0.75·d/R, so
      //   dispY_elev = r·altM/(d·NM_M) = shell·0.75·altM/(NM_M·R)
      // — exactly CONSTANT in d (radius and height grow together), then rising
      // on the 1.5-slope branch. In every case the RATIO — the elevation angle
      // — strictly falls, on every branch: elevation (angle == true, and true
      // falls), log curve (dispY constant, r grows) and clearance floor (dispY
      // constant, r grows). Swept over the domain the planner actually feeds,
      // d ≤ radiusNm.
      let angMono = true, aprev = Infinity;
      for (let d = 0.25; d <= 15; d += 0.05) {
        const v = dispAngDeg(D(d, 35000));
        if (!(v < aprev - 1e-9)) { angMono = false; break; }
        aprev = v;
      }
      ok('9b: fixed altitude → display ELEVATION ANGLE strictly falls with distance', angMono);
      let angAll = true;
      for (const rad of [5, 15, 30, 100]) for (const alt of [1500, 10000, 35000]) {
        let p2 = Infinity;
        for (let d = 0.25; d <= rad; d += rad / 200) {
          const v = dispAngDeg(D(d, alt, rad));
          if (!(v < p2 - 1e-9)) { angAll = false; break; }
          p2 = v;
        }
      }
      ok('9b: …at every radius (5/15/30/100) and altitude', angAll);
      let yUp = true, yprev = -Infinity;
      for (let d = 0.5; d <= 15; d += 0.25) {
        const v = D(d, 35000).dispY;
        if (v < yprev - 1e-9) { yUp = false; break; }
        yprev = v;
      }
      ok('9b: …while dispY itself never FALLS with distance (angle still falls)', yUp);
      // The linear-branch identity itself: on the sub-midpoint branch the
      // elevation term is shell·0.75·altM/(NM_M·R) — the same height at every
      // distance. This is the algebra the angle sweep above rests on.
      {
        const ys = [];
        for (let d = 0.5; d <= 9.9; d += 0.25) ys.push(D(d, 35000).dispY);
        const spread = Math.max(...ys) - Math.min(...ys);
        ok('9b: sub-midpoint dispY_elev is CONSTANT in distance (r ∝ d)', spread < 1e-6,
          `spread=${spread.toExponential(2)} mm`);
        near('9b: …and equals shell · 0.75 · altM / (NM_M · R)', ys[0],
          FB.FLIGHT_SHELL.rMaxMm * 0.75 * (35000 * FT_M) / (NM_M * 15), 1e-6);
      }
      // …and the radius strictly INCREASES right out to the rim, i.e. the
      // aircraft walks out toward the horizon rather than merely shrinking.
      // (Bounded at the configured radius: past 1.05·R the mapping pins, and
      // the planner has filtered those aircraft out anyway.)
      let rMono = true, rPrev = -Infinity;
      for (let d = 3; d <= 15; d += 0.5) {
        const v = Math.hypot(...(x => [x.planX, x.planY])(D(d, 35000)));
        if (!(v > rPrev + 1e-9)) { rMono = false; break; }
        rPrev = v;
      }
      ok('9b: …while the display radius still grows', rMono);

      // Monotonic (non-decreasing) in altitude at a fixed distance — both terms
      // are non-decreasing in altitude, so min() and the floor are too.
      let altMono = true, aPrev = -Infinity;
      for (let a = 0; a <= 45000; a += 250) {
        const v = D(10, a).dispY;
        if (v < aPrev - 1e-9) { altMono = false; break; }
        aPrev = v;
      }
      ok('9b: fixed distance → dispY non-decreasing in altitude', altMono);

      // Angle parity: where the elevation branch is active the DISPLAYED angle
      // equals the TRUE one; nowhere (above the floor) may it exceed it.
      // Swept over RADIUS as well as distance/altitude: the log-curve branch is
      // unreachable at radius 15 (see g5), so a fixed-radius grid could no
      // longer witness both branches. Distances are expressed as fractions of
      // the radius, which is the frame the mapping is defined in.
      let parity = true, never = true, sawElev = 0, sawCurve = 0;
      for (const rad of [5, 15, 40])
      for (const alt of [500, 1500, 4000, 9000, 18000, 27000, 35000, 43000]) {
        for (const frac of [0.02, 0.05, 0.14, 0.33, 0.6, 1, 1.66, 2.66]) {
          const d = frac * rad, p = D(d, alt, rad);
          const disp = dispAngDeg(p), tru = trueAngDeg(alt, d);
          const floored = p.dispY <= FB.FLIGHT_SHELL.clearMm + 1e-9;
          const elevBranch = !floored && p.dispY < FB.compressAltitudeMm(alt) - 1e-6;
          if (elevBranch) { sawElev++; if (Math.abs(disp - tru) > 1e-6) parity = false; }
          else if (!floored) sawCurve++;
          if (!floored && disp > tru + 1e-6) never = false;
        }
      }
      ok('9b: elevation branch reproduces the TRUE elevation angle exactly',
        // The 6500 clearance floor absorbs the lowest-altitude rows of the
        // grid. The near-field elevation term is now shell·0.75·altM/(NM_M·R)
        // — CONSTANT rather than vanishing as d → 0 — so materially FEWER
        // cells floor than under the power law (77 vs 110 of 192) and more
        // display at their true elevation angle: 86 on the elevation branch,
        // 29 on the log curve (small radii only), 77 floored.
        parity && sawElev >= 60, `${sawElev} samples on the elevation branch`);
      ok('9b: display angle never EXCEEDS the true angle (above the floor)', never);
      ok('9b: the log curve still governs some near/high traffic at small radii',
        sawCurve > 0, `${sawCurve} samples`);

      // The clearMm property-clearance floor: NOTHING may render low enough to
      // hit the house — distant low approach traffic rides the floor.
      near('9b: 1,000 ft @ 15 nm floors at clearMm', D(15, 1000).dispY, FB.FLIGHT_SHELL.clearMm, 1e-9);
      ok('9b: nothing ever sits below clearMm', D(90, 500).dispY === FB.FLIGHT_SHELL.clearMm);
      ok('9b: clearance floor clears a 2-story house (≥ 6000 mm + margin)',
        FB.FLIGHT_SHELL.clearMm >= 6500);
      // The user-reported regression: 1,500–2,000 ft approach traffic a few nm
      // out must never skim the yard.
      ok('9b: 1,800 ft @ 5 nm sits at/above the clearance floor',
        D(5, 1800).dispY >= FB.FLIGHT_SHELL.clearMm);

      // Bounds + garbage tolerance on the shared helper itself.
      ok('9b: helper clamps to the shell band',
        FB.flightDisplayAltitudeMm(99999, 1, 24000) <= FB.FLIGHT_SHELL.yMaxMm
        && FB.flightDisplayAltitudeMm(-5000, 10, 18000) === FB.FLIGHT_SHELL.clearMm);
      ok('9b: helper survives non-finite input',
        FB.flightDisplayAltitudeMm(NaN, NaN, NaN) === FB.FLIGHT_SHELL.clearMm
        && FB.flightDisplayAltitudeMm(10000, 0, 0) === FB.FLIGHT_SHELL.clearMm);
      ok('9b: helper agrees with flightDisplayPos on the real fixture', (() => {
        for (const a of FB.normalizeAircraftList(LAX)) {
          const p = FB.flightDisplayPos(a, 33.9425, -118.408, 0.3, 25);
          const r = Math.hypot(p.planX, p.planY);
          if (Math.abs(p.dispY - FB.flightDisplayAltitudeMm(a.altFt, p.distNm, r)) > 1e-9) return false;
        }
        return true;
      })());

      // The shipped default radius — one shared constant across planner,
      // both renderers and the settings input.
      ok('9b: FLIGHTS_DEFAULT_RADIUS_NM is 15', FB.FLIGHTS_DEFAULT_RADIUS_NM === 15);
    }

    // ── 6c. Shell SIZE — the user's exact complaint, golden-pinned ───────────
    // "Planes 7 nautical miles away are directly over the property." On the old
    // 24,000 mm shell a 7 nm aircraft landed 15.3 m from the house — inside the
    // yard, and absurd next to the real-scale neighborhood overlay. The rescale
    // (rMaxMm 120,000) puts it ≈76 m out. Radius is altitude-INDEPENDENT, so the
    // "any cruise altitude" half of the complaint is a property, not a sample.
    {
      const OLAT = 47.6, OLON = -122.3;
      const NM_M = 1852, EARTH_R_M = 6371000, DEGR = Math.PI / 180;
      const atNm = (distNm, altFt) => ({
        lat: OLAT + (distNm * NM_M) / (EARTH_R_M * DEGR), lon: OLON, altFt,
      });
      const R7 = alt => Math.hypot(
        ...(p => [p.planX, p.planY])(
          FB.flightDisplayPos(atNm(7, alt), OLAT, OLON, 0, FB.FLIGHTS_DEFAULT_RADIUS_NM)));

      near('9c: shell rMaxMm is 120,000 mm', FB.FLIGHT_SHELL.rMaxMm, 120000, 0);
      near('9c: shell yMaxMm is 66,000 mm', FB.FLIGHT_SHELL.yMaxMm, 66000, 0);
      near('9c: clearMm unchanged at 6,500 mm', FB.FLIGHT_SHELL.clearMm, 6500, 0);
      near('9c: yMinMm unchanged at 2,500 mm', FB.FLIGHT_SHELL.yMinMm, 2500, 0);
      near('9c: 7 nm @ default radius → r = 42,000 mm', R7(35000), 42000, 0.01);
      // The absolute "≥ 60 m" pin from the SHELL-RESCALE report is superseded by
      // the RADIAL-REMAP report: an absolute floor on a mid-range aircraft is
      // exactly what pushed 10 nm out to 71 % of the shell. The honest invariant
      // is RELATIVE — 7 of 15 nm belongs in the inner third, well clear of the
      // property but nowhere near the horizon.
      let far7 = true, same7 = true;
      const pct7 = 100 * R7(35000) / FB.FLIGHT_SHELL.rMaxMm;
      for (const alt of [1200, 4500, 12000, 24000, 35000, 43000]) {
        if (R7(alt) < 25000) far7 = false;                    // ≥ 25 m from the property
        if (Math.abs(R7(alt) - R7(35000)) > 1e-9) same7 = false;
      }
      ok('9c: 7 nm at ANY cruise altitude lands ≥ 25 m out (well past the yard)', far7,
        `r=${R7(35000).toFixed(0)} mm`);
      ok('9c: …and sits in the inner half of the shell, not crowding the rim',
        pct7 > 25 && pct7 < 45, `${pct7.toFixed(1)} % of the shell`);
      ok('9c: …and the display radius is altitude-independent', same7);
      // The elevation branch must GOVERN cruise traffic from ~8 nm outward —
      // that is what makes a distant jet hug the horizon instead of the roof.
      const ALT_M = 35000 * 0.3048;
      let elevGoverns = true;
      for (let d = 8; d <= 60; d += 0.5) {
        const r = FB.compressRadiusMm(d, FB.FLIGHTS_DEFAULT_RADIUS_NM);
        if (!(FB.compressAltitudeMm(35000) > r * (ALT_M / (d * NM_M)))) elevGoverns = false;
      }
      ok('9c: yMaxMm is sized so the elevation branch governs cruise ≥ 8 nm', elevGoverns);
      // Reach constant (the renderer's camera-frustum requirement).
      near('9c: FLIGHT_SHELL_REACH_MM = hypot(rMax, yMax)', FB.FLIGHT_SHELL_REACH_MM,
        Math.hypot(120000, 66000), 1e-9);
      ok('9c: shell reach exceeds the stock 150,000 far plane once orbited',
        FB.FLIGHT_SHELL_REACH_MM + 45000 > 150000,
        `${(FB.FLIGHT_SHELL_REACH_MM + 45000).toFixed(0)} mm`);
    }

    // ── 6d. flightDisplayScale (distance-compensated model size) ─────────────
    // At 76+ m a fixed-size toy model is a speck; the rig group scale grows
    // linearly with the compressed radius. Monotonic, bounded, 1 at the origin
    // (so nothing near the house changes size), garbage-safe.
    {
      const S = FB.flightDisplayScale, R = FB.FLIGHT_SHELL.rMaxMm;
      near('9d: scale at r=0 is exactly 1', S(0), 1, 0);
      near('9d: scale at rMax is 1 + gain', S(R), 1 + FB.FLIGHT_SCALE_GAIN, 1e-12);
      // Eased 2.2 → 0.8 with the radial remap: the user wants an aircraft AT
      // the configured radius to read "fairly small". Perspective at 120 m does
      // the work; the gain only keeps the rim model from dissolving.
      near('9d: gain is 0.8 (rim = 1.8×, "fairly small")', FB.FLIGHT_SCALE_GAIN, 0.8, 0);
      near('9d: half-shell scales 1.4×', S(R / 2), 1.4, 1e-12);
      let mono = true, bounded = true, prev = -Infinity;
      for (let r = 0; r <= R * 1.5; r += R / 400) {
        const v = S(r);
        if (v < prev - 1e-12) mono = false;
        if (v < 1 - 1e-12 || v > 1 + FB.FLIGHT_SCALE_GAIN + 1e-12) bounded = false;
        prev = v;
      }
      ok('9d: monotonically non-decreasing in radius', mono);
      ok('9d: bounded in [1, 1+gain] even past rMax', bounded);
      ok('9d: saturates past rMax (never unbounded)', S(R * 10) === S(R));
      ok('9d: garbage-safe → 1 (non-finite is NOT treated as "at the rim")',
        S(NaN) === 1 && S(-5) === 1 && S(undefined) === 1 && S(Infinity) === 1);
      // Real-world read: a 7 nm aircraft is visibly bigger than a 2 nm one.
      const s7 = S(FB.compressRadiusMm(7, 15)), s2 = S(FB.compressRadiusMm(2, 15));
      ok('9d: farther aircraft render LARGER (legibility, not perspective)', s7 > s2,
        `2 nm ${s2.toFixed(2)}× → 7 nm ${s7.toFixed(2)}×`);
      near('9d: 7 nm @ default radius scales 1.28×', s7, 1.28, 1e-9);
      // A rim aircraft must stay modest — the growth curve must never undo the
      // distance read the radial remap just bought.
      ok('9d: the rim model stays under 2× (the "fairly small" requirement)',
        S(R) < 2, `${S(R).toFixed(2)}×`);
    }

    // ── 6e. USER-DEFINABLE shell radius — clamp + the SIMILARITY law ────────
    // "The maximum draw distance on planes needs to be doubled or tripled. Make
    // a user definable draw radius that aircraft will be scaled into."
    // FlightsConfig.shellRadiusM (default 300 m, clamp 60..1000) sets the rim;
    // the POSITION geometry is a SIMILARITY TRANSFORM of the 120 m authored
    // reference by s = shellMm / FLIGHT_SHELL_BASE_MM. The MODEL SCALE
    // deliberately does NOT carry that factor (see the block at the end of this
    // section — scaling size with position made the knob a perceptual no-op),
    // and neither does clearMm — an absolute clearance over a physical house.
    {
      const M = F.flightShellMm;
      near('9e: FLIGHT_SHELL_BASE_MM is the 120,000 mm authored reference',
        F.FLIGHT_SHELL_BASE_MM, 120000, 0);
      near('9e: FLIGHT_SHELL_DEFAULT_RADIUS_M is 300 m (2.5× the reference)',
        F.FLIGHT_SHELL_DEFAULT_RADIUS_M, 300, 0);
      near('9e: clamp window is 60..1000 m',
        F.FLIGHT_SHELL_MIN_RADIUS_M * 1e6 + F.FLIGHT_SHELL_MAX_RADIUS_M, 60 * 1e6 + 1000, 0);

      // Clamp matrix — every unusable input lands on the default, never NaN.
      near('9e: shellMm(300) → 300,000 mm', M(300), 300000, 0);
      near('9e: shellMm() → the 300 m default', M(), 300000, 0);
      near('9e: shellMm(undefined) → default', M(undefined), 300000, 0);
      near('9e: shellMm(null) → default', M(null), 300000, 0);
      near('9e: shellMm(NaN) → default', M(NaN), 300000, 0);
      near('9e: shellMm(0) → default', M(0), 300000, 0);
      near('9e: shellMm(-5) → default', M(-5), 300000, 0);
      near('9e: shellMm(59) clamps up to 60 m', M(59), 60000, 0);
      near('9e: shellMm(60) → 60,000 mm', M(60), 60000, 0);
      near('9e: shellMm(1000) → 1,000,000 mm', M(1000), 1000000, 0);
      near('9e: shellMm(1001) clamps down to 1000 m', M(1001), 1000000, 0);
      near('9e: shellMm(120) reproduces the authored reference', M(120), BASE, 0);
      // Swept over POSITIVE inputs only: 0 and below are "unusable" and land on
      // the default (300 m), which is deliberately not a monotone continuation.
      let clampMono = true, cPrev = -Infinity;
      for (let m = 1; m <= 1200; m += 5) {
        const v = M(m);
        if (v < cPrev - 1e-9) clampMono = false;
        if (v < 60000 - 1e-9 || v > 1000000 + 1e-9) clampMono = false;
        cPrev = v;
      }
      ok('9e: shellMm is monotonic and stays inside the clamp window', clampMono);

      // Reach: the base constant still means the base shell (stale-chunk
      // back-compat), and the function scales it.
      ok('9e: flightShellReachMm(BASE) === FLIGHT_SHELL_REACH_MM',
        F.flightShellReachMm(BASE) === F.FLIGHT_SHELL_REACH_MM,
        `${F.flightShellReachMm(BASE)}`);
      near('9e: FLIGHT_SHELL_REACH_MM itself is unchanged (≈136,953 mm)',
        F.FLIGHT_SHELL_REACH_MM, Math.hypot(120000, 66000), 1e-9);
      near('9e: flightShellReachMm() defaults to the 300 m shell',
        F.flightShellReachMm(), 2.5 * F.FLIGHT_SHELL_REACH_MM, 1e-6);
      near('9e: reach scales linearly with the shell (1,000 m → ≈1.141e6 mm)',
        F.flightShellReachMm(M(1000)), (1000000 / BASE) * F.FLIGHT_SHELL_REACH_MM, 1e-6);
      ok('9e: even the maximum shell stays inside CAM_FAR_CEIL (13.5e6 mm)',
        F.flightShellReachMm(M(1000)) < 13.5e6, `${F.flightShellReachMm(M(1000)).toFixed(0)} mm`);
      near('9e: garbage shellMm → the default reach',
        F.flightShellReachMm(NaN), F.flightShellReachMm(), 1e-9);

      // ── The similarity law itself ─────────────────────────────────────────
      const OLAT = 47.6, OLON = -122.3;
      const NM_M = 1852, EARTH_R_M = 6371000, DEGR = Math.PI / 180, FT_M = 0.3048;
      const atNm = (distNm, altFt) => ({
        lat: OLAT + (distNm * NM_M) / (EARTH_R_M * DEGR), lon: OLON, altFt,
      });
      const P = (distNm, altFt, radiusNm, shellMm) =>
        F.flightDisplayPos(atNm(distNm, altFt), OLAT, OLON, 0.3, radiusNm, shellMm);
      const rel = (a, b) => Math.abs(a - b) / Math.max(1, Math.abs(b));
      const GRID = [];
      for (const rad of [5, 15, 30]) for (const alt of [800, 1800, 9000, 22000, 35000])
        for (const frac of [0.05, 0.2, 0.45, 0.7, 1]) GRID.push([frac * rad, alt, rad]);

      let xyAll = true, dyGeneral = true, dyStrict = true, dyChecked = 0;
      let angAll = true, angChecked = 0, floorSeen = 0;
      for (const k of [0.5, 1, 2.5, 3]) {
        const shell = k * BASE;
        for (const [d, alt, rad] of GRID) {
          const b = P(d, alt, rad, BASE), q = P(d, alt, rad, shell);
          // planX / planY are EXACTLY k× the base values.
          if (rel(q.planX, k * b.planX) > 1e-6) xyAll = false;
          if (rel(q.planY, k * b.planY) > 1e-6) xyAll = false;
          // dispY = max(clearMm, k · unflooredBase) — the general identity, with
          // the ABSOLUTE clearance floor left unscaled.
          const rBase = Math.hypot(b.planX, b.planY);
          const unfloored = Math.min(FB.compressAltitudeMm(alt),
                                     rBase * (alt * FT_M / Math.max(d * NM_M, 1)));
          if (rel(q.dispY, Math.max(F.FLIGHT_SHELL.clearMm, k * unfloored)) > 1e-6) dyGeneral = false;
          // …and the simple form the brief pins: base above the floor and k ≥ 1
          // ⇒ scaled dispY is exactly k× the base dispY.
          if (k >= 1 && b.dispY > F.FLIGHT_SHELL.clearMm + 1e-6) {
            dyChecked++;
            if (rel(q.dispY, k * b.dispY) > 1e-6) dyStrict = false;
          }
          // Angle honesty: a similarity cannot change an elevation angle, so
          // wherever the floor is NOT engaged the display angle is invariant.
          const floored = q.dispY <= F.FLIGHT_SHELL.clearMm + 1e-9
            || b.dispY <= F.FLIGHT_SHELL.clearMm + 1e-9;
          if (floored) { floorSeen++; continue; }
          angChecked++;
          const ab = Math.atan2(b.dispY, rBase);
          const aq = Math.atan2(q.dispY, Math.hypot(q.planX, q.planY));
          if (Math.abs(ab - aq) > 1e-9) angAll = false;
        }
      }
      ok('9e: planX/planY are exactly k× the base shell (k = 0.5/1/2.5/3)', xyAll);
      ok('9e: dispY = max(clearMm, k · unfloored base) on every sample', dyGeneral);
      ok('9e: …so above the floor, k ≥ 1 ⇒ dispY is exactly k× the base', dyStrict,
        `${dyChecked} samples`);
      ok('9e: the elevation ANGLE is invariant under the rescale (off the floor)',
        angAll && angChecked > 50, `${angChecked} samples`);
      ok('9e: …and the clearance floor is genuinely exercised too', floorSeen > 0,
        `${floorSeen} floored samples`);

      // k = 1 must be byte-identical to the pre-rescale geometry.
      let identity = true;
      for (const [d, alt, rad] of GRID) {
        const b = P(d, alt, rad, BASE), q = P(d, alt, rad, 120000);
        if (b.planX !== q.planX || b.planY !== q.planY || b.dispY !== q.dispY) identity = false;
      }
      ok('9e: shellMm = 120,000 reproduces the reference geometry bit-for-bit', identity);

      // The default shell is 2.5× — the "doubled or tripled" ask, on the nose.
      const dFar = P(15, 35000, 15, M());
      near('9e: an aircraft at the search radius sits at the shell rim (300 m)',
        Math.hypot(dFar.planX, dFar.planY), 300000, 0.05);
      ok('9e: …i.e. 2.5× farther out than the old 120 m shell',
        Math.hypot(dFar.planX, dFar.planY)
          > 2.4 * Math.hypot(...(x => [x.planX, x.planY])(P(15, 35000, 15, BASE))));

      // ── Model scale does NOT carry the shell factor (2026-07 reversal) ────
      // The shell is a similarity in POSITION only. It briefly carried the
      // factor into flightDisplayScale as well, on the reasoning that position
      // and size should grow together so a given aircraft keeps its apparent
      // angular size. That is geometrically true and is exactly the bug: a
      // pure similarity preserves EVERY apparent angle and size from the house
      // viewpoint, so the draw-radius knob became a perceptual no-op —
      // user-reported: "setting the draw distance larger or smaller doesn't
      // change how far it is away". Scale now depends only on u = r/shell, so a
      // bigger shell genuinely pushes traffic away and perspective shrinks it.
      // Size taste rides FlightsConfig.modelScale (0.5–4).
      let scaleAll = true;
      for (const k of [0.5, 1, 2.5, 3]) {
        const shell = k * BASE;
        for (const r0 of [0, 12000, 60000, 120000, 200000]) {
          if (F.flightDisplayScale(k * r0, shell) !== F.flightDisplayScale(r0, BASE)) {
            scaleAll = false;
          }
        }
      }
      ok('9e: flightDisplayScale(k·r, k·shell) === flightDisplayScale(r, shell) — SHELL-INVARIANT',
        scaleAll);
      near('9e: scale at the DEFAULT shell rim is 1 + gain (1.8×), NOT 2.5 × that',
        F.flightDisplayScale(M(), M()), 1 + F.FLIGHT_SCALE_GAIN, 1e-9);
      near('9e: scale at the origin is exactly 1 at every shell',
        F.flightDisplayScale(0, M()), 1, 0);
      ok('9e: …at 60 m and 1,000 m too (the whole clamp window)',
        F.flightDisplayScale(0, M(60)) === 1 && F.flightDisplayScale(0, M(1000)) === 1
        && F.flightDisplayScale(M(60), M(60)) === F.flightDisplayScale(M(1000), M(1000)));
      // The knob is no longer a no-op: at a FIXED real distance, doubling the
      // draw radius doubles the rendered distance while the model stays the
      // same size — so the aircraft genuinely recedes.
      {
        const r1 = F.compressRadiusMm(6.5, 15, M(150)), r2 = F.compressRadiusMm(6.5, 15, M(300));
        ok('9e: doubling the draw radius doubles the display distance…',
          Math.abs(r2 - 2 * r1) < 1e-6, `${(r1 / 1000).toFixed(1)} m → ${(r2 / 1000).toFixed(1)} m`);
        ok('9e: …while the model scale is unchanged (so it really looks farther)',
          F.flightDisplayScale(r1, M(150)) === F.flightDisplayScale(r2, M(300)));
      }
      ok('9e: garbage shellMm → the default shell, never NaN',
        Number.isFinite(F.flightDisplayScale(1000, NaN))
        && F.flightDisplayScale(1000, NaN) === F.flightDisplayScale(1000, M()));
      ok('9e: compressRadiusMm/compressAltitudeMm default to the 300 m shell',
        F.compressRadiusMm(15, 15) === F.compressRadiusMm(15, 15, M())
        && F.compressAltitudeMm(0) === F.compressAltitudeMm(0, M())
        && F.compressAltitudeMm(0) === 2.5 * F.FLIGHT_SHELL.yMinMm);
      ok('9e: …and clearMm is NOT scaled by the shell (absolute clearance)',
        F.flightDisplayAltitudeMm(200, 40, 10, M(1000)) === F.FLIGHT_SHELL.clearMm
        && F.FLIGHT_SHELL.clearMm === 6500);
    }

    // ── 7. satAltAz goldens ─────────────────────────────────────────────────
    {
      const overhead = SA.satAltAz(47.6, -122.3, 47.6, -122.3, 420);
      near('10: satellite directly overhead → alt = π/2', overhead.altRad, Math.PI / 2, 1e-9);
      const anti = SA.satAltAz(47.6, -122.3, -47.6, 57.7, 420);
      ok('10: antipodal satellite → alt < 0', anti.altRad < 0, `alt=${anti.altRad.toFixed(3)}`);
      near('10: antipodal alt ≈ −π/2', anti.altRad, -Math.PI / 2, 0.01);
      const eastSat = SA.satAltAz(0, 0, 0, 5, 420);
      near('10: equator satellite due east → az = π/2', eastSat.azRad, Math.PI / 2, 1e-9);
      ok('10: equator satellite 5° east is above the horizon', eastSat.altRad > 0,
        `alt=${(eastSat.altRad * 180 / Math.PI).toFixed(1)}°`);
      const westSat = SA.satAltAz(0, 0, 0, -5, 420);
      near('10: equator satellite due west → az = 3π/2', westSat.azRad, 3 * Math.PI / 2, 1e-9);
      near('10: east/west symmetry in altitude', eastSat.altRad, westSat.altRad, 1e-12);
      const northSat = SA.satAltAz(0, 0, 5, 0, 420);
      near('10: satellite due north → az = 0', northSat.azRad, 0, 1e-9);
      const southSat = SA.satAltAz(0, 0, -5, 0, 420);
      near('10: satellite due south → az = π', southSat.azRad, Math.PI, 1e-9);
      const pole = SA.satAltAz(89.9, 0, 80, 0, 420);
      near('10: observer near the pole, satellite down lon 0 → az = π', pole.azRad, Math.PI, 1e-6);
      let ranged = true;
      for (let la = -80; la <= 80; la += 17) for (let lo = -180; lo < 180; lo += 23) {
        const r = SA.satAltAz(47.6, -122.3, la, lo, 420);
        if (!(r.azRad >= 0 && r.azRad < TWO_PI)) ranged = false;
        if (!(r.altRad >= -Math.PI / 2 - 1e-9 && r.altRad <= Math.PI / 2 + 1e-9)) ranged = false;
      }
      ok('10: az in [0,2π) and alt in [−π/2, π/2] across the globe', ranged);
      ok('10: higher orbit raises a horizon-grazing satellite',
        SA.satAltAz(0, 0, 0, 20, 2000).altRad > SA.satAltAz(0, 0, 0, 20, 420).altRad);
      ok('10: deterministic (same input, same output)',
        JSON.stringify(SA.satAltAz(12, 34, 56, 78, 420)) === JSON.stringify(SA.satAltAz(12, 34, 56, 78, 420)));
    }

    // ── 8. Planner wiring (real Planner + fake HaApi + stubbed fetch) ────────
    {
      // Stubbed network. `handler(url)` returns a JSON value, or null → !ok.
      // `calls` records ONLY flight/ISS traffic — the Planner also polls
      // Open-Meteo for the weather config these scenarios use as the origin
      // fallback, and that noise must not count as a flight fetch.
      const isFlightUrl = u =>
        u.includes('airplanes.live') || u.includes('wheretheiss') || u.includes('aircraft.json');
      const calls = [];
      let handler = () => null;
      // The server-side transport: HA calls a rest_command on our behalf and
      // hands back its body. Recorded like `calls` so a scenario can assert
      // exactly what was asked of HA, and what was NOT.
      const svc = [];
      let svcReply = () => null;
      const realFetch = globalThis.fetch;
      globalThis.fetch = async (url, init) => {
        const u = String(url);
        if (u.includes('/fixtures/') || u.includes('.mod.js')) return realFetch(url, init);
        if (isFlightUrl(u)) calls.push(u);
        const body = handler(u);
        if (body == null) return { ok: false, status: 503, json: async () => { throw new Error('no body'); } };
        return { ok: true, status: 200, json: async () => body };
      };
      const aircraftCalls = () => calls.filter(u => !u.includes('wheretheiss'));
      const issCalls = () => calls.filter(u => u.includes('wheretheiss'));

      class FakeHa {
        constructor(seed, states) {
          this.map = new Map();
          for (const [k, v] of Object.entries(seed || {})) this.map.set(k, clone(v));
          this.states = states || {};
          this._stateCbs = []; this._connCbs = [];
        }
        connect() {
          for (const cb of this._connCbs) cb('connected');
          for (const cb of this._stateCbs) cb(this.states, undefined);
        }
        push(id, st) {
          this.states[id] = st;
          for (const cb of this._stateCbs) cb(this.states, id);
        }
        onState(fn) { this._stateCbs.push(fn); }
        onConn(fn) { this._connCbs.push(fn); }
        callService() { return Promise.resolve(); }
        async callServiceWithResponse(domain, service, data) {
          svc.push({ domain, service, data });
          return svcReply(domain, service, data);
        }
        async getHistory() { return {}; }
        async getWeatherForecasts() { return null; }
        async getDevices() { return []; }
        async getEntityRegistry() { return []; }
        async updateEntityRegistry() { return true; }
        async getCalendarEvents() { return []; }
        async subscribePersistentNotifications() { return () => {}; }
        async listRepairsIssues() { return []; }
        async subscribeMqtt() { return () => {}; }
        async publishMqtt() { return true; }
        async getUserData(key) { return this.map.has(key) ? clone(this.map.get(key)) : null; }
        async setUserData(key, value) { this.map.set(key, clone(value)); return true; }
        async refreshStates() {}
        peek(key) { return this.map.has(key) ? clone(this.map.get(key)) : null; }
      }

      const makeStore = extra => ({
        v: 2,
        floors: [{
          id: 'f1', name: 'Home', w: 8000, d: 6000,
          walls: [], furniture: [], lights: [], switches: [], sensors: [], motionSensors: [],
          roamers: [], envSensors: [], doors: [], windows: [], bg: null, rooms: [], bleProxies: [],
          alarmPanels: [], safetySensors: [], robots: [], presenceZones: [], cameras: [],
          groundAreas: [], voidAreas: [],
        }],
        currentFloorId: 'f1', activeSensorId: null,
        coverage: true, imperial: false, showDetails: false, useRawTargets: false,
        ...extra,
      });

      const HOME = { lat: 47.6, lon: -122.3 };
      const WEATHER = { source: 'openmeteo', lat: HOME.lat, lon: HOME.lon, chip: true };
      const seedFor = store => ({
        'diorama-configs': { version: 1, activeId: 'default', configs: [{ id: 'default', name: 'Default', updatedAt: 1 }] },
        'diorama-cfg-default': store,
      });

      // `opts.offline` marks the api as the LocalApi does (`readonly offline =
      // true`), which is exactly what Planner.isOffline reads — no other
      // behaviour changes, so the fake stays honest: callServiceWithResponse
      // still resolves through svcReply, and the test asserts it is never CALLED
      // rather than relying on it returning null.
      async function boot(store, states, opts) {
        localStorage.removeItem('diorama:store:v1');
        localStorage.removeItem('diorama:configs');
        const stub = new FakeHa(seedFor(store), states);
        if (opts?.offline) stub.offline = true;
        const p = new Planner();
        p.connectWith(stub);
        await waitFor(() => p.configIndex !== null);
        return { p, stub };
      }
      // Stop a scenario's timers so virtual time can't spin them during later ones.
      const quiesce = p => { p.setFlights(f => { f.enabled = false; }); };

      // Build a synthetic cloud payload of n aircraft, ringed outward from home.
      function ring(n, { startNm = 1, stepNm = 0.4, alt = 10000 } = {}) {
        const ac = [];
        for (let i = 0; i < n; i++) {
          const nm = startNm + i * stepNm;
          const dlat = (nm * 1852) / (6371000 * Math.PI / 180);   // due north
          ac.push({
            hex: 'f' + String(i).padStart(5, '0'), flight: 'TST' + i + '   ',
            lat: HOME.lat + dlat, lon: HOME.lon,
            alt_baro: typeof alt === 'function' ? alt(i) : alt,
            gs: 300, track: 180, category: 'A3', seen_pos: 0.5,
          });
        }
        return { ac, now: 1, total: n };
      }

      // (a) enabled + cloud + origin → poll lands, rev bumps, status ok.
      {
        calls.length = 0;
        handler = u => u.includes('wheretheiss')
          ? { latitude: -16.7, longitude: 90.1, altitude: 418.9, velocity: 27586.1, timestamp: 1784953269 }
          : ring(3);
        const { p } = await boot(makeStore({
          weather: WEATHER, flights: { enabled: true, source: 'cloud', radiusNm: 30 },
        }));
        await waitFor(() => p.flightsStatus === 'ok' && (p.flightsNow?.length ?? 0) === 3);
        ok('11a: status ok after a successful poll', p.flightsStatus === 'ok', p.flightsStatus);
        ok('11a: aircraft stored', (p.flightsNow?.length ?? 0) === 3, `n=${p.flightsNow?.length}`);
        ok('11a: flightsAt stamped', p.flightsAt > 0);
        // A NEW aircraft list on a later poll must bump the revision (the
        // renderer's only "something changed" signal). The poll is driven
        // directly — the 8 s interval outlives the harness's virtual clock.
        const rev0 = p.flightsRev;
        handler = u => u.includes('wheretheiss')
          ? { latitude: -16.7, longitude: 90.1, altitude: 418.9, velocity: 27586.1, timestamp: 1784953269 }
          : ring(7);
        await p._pollFlights();
        ok('11a: a later poll replaces the list', (p.flightsNow?.length ?? 0) === 7, `n=${p.flightsNow?.length}`);
        ok('11a: flightsRev bumped on new data', p.flightsRev > rev0, `${rev0}→${p.flightsRev}`);
        ok('11a: distNm filled from the origin', p.flightsNow.every(a => Number.isFinite(a.distNm)));
        ok('11a: cloud endpoint hit with the configured point + radius',
          aircraftCalls().some(u => u.includes('/v2/point/47.6000/-122.3000/30')), aircraftCalls()[0] || '');
        ok('11a: flightsOrigin falls back to weather lat/lon',
          JSON.stringify(p.flightsOrigin()) === JSON.stringify(HOME), JSON.stringify(p.flightsOrigin()));
        await waitFor(() => p.issNow !== null);
        ok('11a: ISS polled alongside', p.issNow !== null);
        near('11a: ISS velocity normalized km/h → km/s', p.issNow?.velKmS ?? 0, 7.6628, 0.001);
        near('11a: ISS timestamp normalized s → ms', p.issNow?.tsMs ?? 0, 1784953269000, 0.5);
        near('11a: ISS altitude km passed through', p.issNow?.altKm ?? 0, 418.9, 1e-9);
        quiesce(p);
      }

      // (b) disabled → completely inert, no fetch at all.
      {
        calls.length = 0;
        handler = () => ring(3);
        const { p } = await boot(makeStore({ weather: WEATHER, flights: { enabled: false, source: 'cloud' } }));
        await sleep(120);
        ok('11b: disabled → status off', p.flightsStatus === 'off', p.flightsStatus);
        ok('11b: disabled → no aircraft data', p.flightsNow === null);
        ok('11b: disabled → no ISS data', p.issNow === null);
        ok('11b: disabled → ZERO network calls', calls.length === 0, `calls=${calls.length}`);
        quiesce(p);
      }

      // (c) absent flights config → equally inert.
      {
        calls.length = 0;
        handler = () => ring(3);
        const { p } = await boot(makeStore({ weather: WEATHER }));
        await sleep(120);
        ok('11c: absent config → status off + no calls', p.flightsStatus === 'off' && calls.length === 0,
          `${p.flightsStatus} calls=${calls.length}`);
        quiesce(p);
      }

      // (d) enabled but no resolvable origin → 'no-origin', still no fetch.
      {
        calls.length = 0;
        handler = () => ring(3);
        const { p } = await boot(makeStore({ flights: { enabled: true, source: 'cloud' } }));
        await waitFor(() => p.flightsStatus === 'no-origin');
        ok('11d: no origin → status no-origin', p.flightsStatus === 'no-origin', p.flightsStatus);
        ok('11d: no origin → no data', p.flightsNow === null && p.issNow === null);
        ok('11d: no origin → no network calls', calls.length === 0, `calls=${calls.length}`);
        ok('11d: flightsOrigin() === null', p.flightsOrigin() === null);
        quiesce(p);
      }

      // (e) a calibrated geo landmark WINS over the weather lat/lon.
      {
        calls.length = 0;
        handler = () => ring(1);
        const { p } = await boot(makeStore({
          weather: WEATHER,
          geo: { landmarks: [{ id: 'l1', name: 'Mailbox', x: 1000, y: 2000, lat: 40.5, lon: -74.25 }] },
          flights: { enabled: true, source: 'cloud', iss: false },
        }));
        await waitFor(() => p.flightsStatus === 'ok');
        const o = p.flightsOrigin();
        ok('11e: geo fit origin beats weather lat/lon',
          o && Math.abs(o.lat - 40.5) < 1e-9 && Math.abs(o.lon + 74.25) < 1e-9, JSON.stringify(o));
        ok('11e: cloud query uses the landmark point',
          aircraftCalls().some(u => u.includes('/40.5000/-74.2500/')), aircraftCalls()[0] || '');
        ok('11e: iss:false → no ISS poll', issCalls().length === 0, `iss calls=${issCalls().length}`);
        quiesce(p);
      }

      // (f) radius + altitude filters, nearest-first ordering, MAX_AIRCRAFT cap.
      {
        calls.length = 0;
        // 80 aircraft from 1 nm outward in 0.2 nm steps → all inside 20 nm, so
        // the cap (not the radius) is what trims the list.
        handler = () => ring(80, { startNm: 1, stepNm: 0.2 });
        const { p } = await boot(makeStore({
          weather: WEATHER, flights: { enabled: true, source: 'cloud', radiusNm: 20, iss: false },
        }));
        await waitFor(() => (p.flightsNow?.length ?? 0) > 0);
        const list = p.flightsNow;
        ok('11f: radius filter applied (all ≤ 20 nm)', list.every(a => a.distNm <= 20 + 1e-6));
        ok('11f: capped at MAX_AIRCRAFT', list.length === F.MAX_AIRCRAFT, `n=${list.length}`);
        let sorted = true;
        for (let i = 1; i < list.length; i++) if (list[i].distNm < list[i - 1].distNm - 1e-9) sorted = false;
        ok('11f: sorted nearest-first', sorted);
        ok('11f: cap keeps the NEAREST 50, dropping the 30 farther ones',
          list[0].hex === 'f00000' && list[list.length - 1].distNm < 11,
          `first=${list[0].hex} lastDist=${list[list.length - 1].distNm.toFixed(2)} nm`);
        quiesce(p);
      }
      {
        calls.length = 0;
        handler = () => ring(9, { startNm: 1, stepNm: 0.5, alt: i => 500 + i * 2500 });
        const { p } = await boot(makeStore({
          weather: WEATHER,
          flights: { enabled: true, source: 'cloud', radiusNm: 50, minAltFt: 3000, maxAltFt: 15000, iss: false },
        }));
        await waitFor(() => p.flightsStatus === 'ok');
        const alts = (p.flightsNow ?? []).map(a => a.altFt);
        ok('11f: minAltFt filter applied', alts.every(a => a >= 3000), JSON.stringify(alts));
        ok('11f: maxAltFt filter applied', alts.every(a => a <= 15000));
        ok('11f: altitude band keeps the in-band entries', alts.length === 5, `n=${alts.length}`);
        quiesce(p);
      }

      // (g) a failed fetch KEEPS the last data (stale-tolerant).
      {
        calls.length = 0;
        handler = () => ring(4);
        const { p } = await boot(makeStore({
          weather: WEATHER, flights: { enabled: true, source: 'cloud', radiusNm: 30, iss: false },
        }));
        await waitFor(() => (p.flightsNow?.length ?? 0) === 4);
        const keptRev = p.flightsRev;
        handler = () => null;                       // every fetch now fails
        const before = calls.length;
        await p._pollFlights();
        await p._pollFlights();

      // (l) toggling back off tears the feed down.
      {
        calls.length = 0;
        handler = u => u.includes('wheretheiss')
          ? { latitude: 1, longitude: 2, altitude: 420, velocity: 27000, timestamp: 1784953270 }
          : ring(2);
        const { p } = await boot(makeStore({
          weather: WEATHER, flights: { enabled: true, source: 'cloud', radiusNm: 30 },

        p.setFlights(f => { f.enabled = false; });

        ok('11l: disabling clears the ISS fix', p.issNow === null);
        ok('11l: disabling sets status off', p.flightsStatus === 'off', p.flightsStatus);

      // (m) LIVE-path discipline (user-reported bug): a routine poll must NOT
      // bump configRev. Every three-view dirty key folds configRev, so a
      // per-poll emit rebuilt the weather group (precip re-seeded) and the
      // bg-text rigs (banner plane / chopper / train snapped back to their
      // build-time orbit angle) every few seconds. `flightsRev` is the renderer's
      // signal — _keyFlights is recomputed every tick, so it alone suffices.
      // Config emits are reserved for structural transitions.
      {
        calls.length = 0;
        // Boot with the feed FAILING so the first poll lands no data — that way
        // the first SUCCESSFUL poll below is driven explicitly and configRev can
        // be sampled immediately before it (booting straight into success races
        // the transition emit against the await).
        handler = () => null;
        const { p } = await boot(makeStore({
          weather: WEATHER,
          // No alert triggers configured: every poll below is routine by
          // construction, so nothing but the transition rules can emit.
          flights: { enabled: true, source: 'cloud', radiusNm: 30, iss: false },
        }));
        await waitFor(() => p.flightsStatus === 'error');

        // (b) the FIRST successful poll is a transition ('error' → 'ok', plus
        // null → data) and MUST repaint — the app.ts attribution chip only
        // appears on a config emit.
        const revBeforeFirst = p.configRev;
        handler = () => ring(3);
        await p._pollFlights();
        ok('11m: first successful poll lands data', p.flightsStatus === 'ok'
          && (p.flightsNow?.length ?? 0) === 3, `${p.flightsStatus} n=${p.flightsNow?.length}`);
        ok('11m: first successful poll emits config (status error→ok, chip appears)',
          p.configRev > revBeforeFirst, `${revBeforeFirst}→${p.configRev}`);

        // (a) two consecutive routine polls: flightsRev twice, configRev never.
        const cfgRev0 = p.configRev, fRev0 = p.flightsRev;
        handler = () => ring(4);
        await p._pollFlights();
        const cfgRev1 = p.configRev, fRev1 = p.flightsRev;
        handler = () => ring(5);
        await p._pollFlights();
        ok('11m: routine poll #1 bumps flightsRev', fRev1 === fRev0 + 1, `${fRev0}→${fRev1}`);
        ok('11m: routine poll #2 bumps flightsRev', p.flightsRev === fRev1 + 1,
          `${fRev1}→${p.flightsRev}`);
        ok('11m: two routine polls leave configRev UNCHANGED',
          p.configRev === cfgRev0 && cfgRev1 === cfgRev0,
          `${cfgRev0}→${cfgRev1}→${p.configRev}`);
        ok('11m: the routine polls really landed new data', (p.flightsNow?.length ?? 0) === 5,
          `n=${p.flightsNow?.length}`);

        // (c) a failed poll while data is cached: status stays 'ok', nothing
        // changes, so no repaint either.
        const cfgRev2 = p.configRev;
        handler = () => null;
        await p._pollFlights();
        ok('11m: failed poll with cached data keeps status ok', p.flightsStatus === 'ok',
          p.flightsStatus);
        ok('11m: failed poll with cached data emits NO config',
          p.configRev === cfgRev2, `${cfgRev2}→${p.configRev}`);
        quiesce(p);

      // (n) ISS: the first fix repaints (chip), later advanced fixes do not.
      {
        calls.length = 0;
        let issTs = 1784953269;
        handler = u => u.includes('wheretheiss')
          // Far from home + iss:true, so the above-horizon edge never fires and
          // every update below is routine.
          ? { latitude: -16.7, longitude: 90.1, altitude: 418.9, velocity: 27586.1, timestamp: issTs }

        ok('11n: routine ISS update emits NO config', p.configRev === cfgRev0,

          p.flightsRev === fRev1 && p.configRev === cfgRev0);

      // (e) a failing FIRST poll with nothing cached IS a status transition
      // (→ 'error') and must repaint so the UI can surface it.
      {

        const { p } = await boot(makeStore({

        await sleep(60);

        const cfgRev0 = p.configRev;
