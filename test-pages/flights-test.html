      const rule = o => ({ id: o.id ?? 'r', criteria: {}, pattern: 'flash', colorA: '#ffffff', ...o });

      // Tier 4 — no rules at all reproduces the shipped ladder EXACTLY.
      ok('22: no rules → default emergency red flash',
        JSON.stringify(R(AC({ squawk: '7700' }), undefined, true))
          === JSON.stringify({ pattern: 'flash', colorA: '#ff2a1a' }));
      ok('22: no rules → interesting yellow',
        R(AC({ interesting: true }), undefined, true).colorA === '#ffd400');
      ok('22: no rules → military green',
        R(AC({ military: true }), undefined, true).colorA === '#2ee56a');
      ok('22: no rules → LADD white',
        R(AC({ ladd: true }), undefined, true).colorA === '#f2f6fb');
      ok('22: no rules + no status → null', R(AC(), undefined, true) === null);
      ok('22: interesting outranks military outranks LADD (unchanged ladder)',
        R(AC({ interesting: true, military: true, ladd: true }), [], true).colorA === '#ffd400'
        && R(AC({ military: true, ladd: true }), [], true).colorA === '#2ee56a');
      ok('22: every default resolution is the `flash` pattern',
        ['interesting', 'military', 'ladd'].every(k =>
          R(AC({ [k]: true }), [], true).pattern === 'flash'));

      // Tier 1 — the master gate.
      ok('22: beacons:false silences EVERYTHING, user rules included',
        R(AC({ squawk: '7700' }), [rule({ pattern: 'solid', colorA: '#00ff00' })], false) === null
        && R(AC({ military: true }), undefined, false) === null);

      // Tier 2 — emergency short-circuits BEFORE any rule is read.
      const hijack = [rule({ id: 'm', pattern: 'solid', colorA: '#00ff00', criteria: { military: true } })];
      const em = R(AC({ military: true, squawk: '7700' }), hijack, true);
      ok('22: EMERGENCY wins over a matching user rule (pattern + colour)',
        em.pattern === 'flash' && em.colorA === '#ff2a1a' && em.colorB === undefined,
        JSON.stringify(em));
      ok('22: emergency wins over a catch-all rule too',
        R(AC({ emergency: 'downed' }), [rule({ pattern: 'none' })], true).colorA === '#ff2a1a');

      // Tier 3 — first ENABLED match wins and REPLACES the whole resolution.
      const list = [
        rule({ id: 'a', pattern: 'strobe', colorA: '#ff0000', colorB: '#ffffff',
               criteria: { operator: 'Southwest' } }),
        rule({ id: 'b', pattern: 'rotate', colorA: '#2196f3', criteria: { typeCode: 'B73*' } }),
      ];
      const first = R(AC(), list, true);
      ok('22: FIRST match wins across overlapping rules',
        first.pattern === 'strobe' && first.colorA === '#ff0000' && first.colorB === '#ffffff',
        JSON.stringify(first));
      ok('22: reordering the same two rules changes the answer',
        R(AC(), [list[1], list[0]], true).pattern === 'rotate');
      ok('22: a DISABLED rule is skipped, the next one wins',
        R(AC(), [{ ...list[0], enabled: false }, list[1]], true).pattern === 'rotate');
      ok('22: enabled:true is explicit-and-fine',
        R(AC(), [{ ...list[0], enabled: true }], true).pattern === 'strobe');
      ok('22: a matching rule REPLACES the default status treatment',
        R(AC({ military: true }), [rule({ pattern: 'fade', colorA: '#ff00ff',
                                          criteria: { military: true } })], true).colorA === '#ff00ff');
      ok('22: a non-matching rule falls through to the default ladder',
        R(AC({ military: true }), [rule({ pattern: 'fade', colorA: '#ff00ff',
                                          criteria: { operator: 'Delta' } })], true).colorA === '#2ee56a');
      ok('22: a colourless visible rule defaults to white (defensive)',
        R(AC(), [{ id: 'x', criteria: {}, pattern: 'solid' }], true).colorA === '#ffffff');

      // pattern:'none' — a supported way to mute a class of aircraft.
      ok("22: pattern 'none' resolves to null (mutes the default LADD beacon)",
        R(AC({ ladd: true }), [rule({ pattern: 'none', criteria: { ladd: true } })], true) === null);
      ok("22: 'none' does NOT fall through to the later rules",
        R(AC({ military: true }), [rule({ id: 'n', pattern: 'none' }),
                                   rule({ id: 'z', pattern: 'solid', colorA: '#00ff00' })], true) === null);
      ok("22: a DISABLED 'none' rule does not mute",
        R(AC({ military: true }), [{ ...rule({ pattern: 'none' }), enabled: false }], true).colorA === '#2ee56a');

      // flightGlowRuleMatch — the enable-aware predicate the resolver walks with.
      ok('22: flightGlowRuleMatch honours enabled',
        F.flightGlowRuleMatch(list[0], AC()) === true
        && F.flightGlowRuleMatch({ ...list[0], enabled: false }, AC()) === false
        && F.flightGlowRuleMatch(null, AC()) === false
        && F.flightGlowRuleMatch(undefined, AC()) === false);
    }

    // ── 20. Pattern math — flightGlowFrame goldens (§2) ──────────────────────
    {
      const FR = F.flightGlowFrame;
      const inRange = fr => fr.alpha >= 0 && fr.alpha <= 1 && fr.glow >= 0 && fr.glow <= 1
        && fr.mix >= 0 && fr.mix <= 1;
      const PATTERNS = ['none', 'solid', 'flash', 'strobe', 'rotate', 'fade', 'alternate'];
      ok('23: FLIGHT_GLOW_PATTERNS is the documented 7-value enum',
        F.FLIGHT_GLOW_PATTERNS.join(',') === PATTERNS.join(','), F.FLIGHT_GLOW_PATTERNS.join(','));
      let allBounded = true;
      for (const pat of PATTERNS) {
        for (let t = 0; t < 12; t += 0.0137) if (!inRange(FR(pat, t))) allBounded = false;
      }
      ok('23: every pattern stays inside 0..1 for alpha/glow/mix over 12 s', allBounded);
      ok('23: garbage / non-finite t never produces NaN',
        PATTERNS.every(p => [NaN, Infinity, -Infinity, undefined].every(t => {
          const fr = FR(p, t); return isFinite(fr.alpha) && isFinite(fr.glow) && isFinite(fr.mix); })));
      ok('23: an unknown pattern is dark (defensive default)',
        FR('zzz', 1).alpha === 0 && FR('zzz', 1).glow === 0);

      // none
      ok("23: 'none' is fully dark at every phase",
        [0, 0.3, 1, 7.7].every(t => FR('none', t).alpha === 0 && FR('none', t).glow === 0));

      // solid — steady, never animates, mix is meaningless (caller must not lerp)
      ok("23: 'solid' is a constant steady-on",
        [0, 0.4, 3.3, 9].every(t => FR('solid', t).alpha === 1 && FR('solid', t).glow === 0.6
                                    && FR('solid', t).mix === 0));

      // flash — the EXISTING shipped envelope, 1.2 Hz, verbatim
      const flashAt = t => {
        const s = Math.max(0, Math.sin(2 * Math.PI * 1.2 * t)), f = s * s * s;
        return { alpha: 0.28 + 0.72 * f, glow: 0.10 + 0.85 * f };
      };
      let flashExact = true;
      for (let t = 0; t < 5; t += 0.011) {
        const g = FR('flash', t), w = flashAt(t);
        if (Math.abs(g.alpha - w.alpha) > 1e-12 || Math.abs(g.glow - w.glow) > 1e-12) flashExact = false;
      }
      ok('23: `flash` reproduces the SHIPPED beacon envelope exactly (byte-identical default)', flashExact);
      near('23: flash peaks at the quarter cycle', FR('flash', 1 / (1.2 * 4)).alpha, 1, 1e-9);
      near('23: flash floors through the dark half', FR('flash', 0.6).alpha, 0.28, 1e-9);
      ok('23: flash alternates colour by WHOLE cycle',
        FR('flash', 0.1).mix === 0 && FR('flash', 0.7).mix === 0
        && FR('flash', 1.0).mix === 1 && FR('flash', 1.6).mix === 1
        && FR('flash', 1.7).mix === 0);

      // strobe — TWO narrow pops per 1 s cycle, then a long dark gap
      const peaks = [];
      let prev = FR('strobe', -0.002).alpha;
      // Sweep ONE cycle, stopping short of the wrap so t≈1.0 isn't counted as a
      // third peak (it is the next cycle's first pop).
      for (let t = 0; t <= 0.98; t += 0.002) {
        const a = FR('strobe', t).alpha, next = FR('strobe', t + 0.002).alpha;
        if (a > prev && a >= next && a > 0.5) peaks.push(t);
        prev = a;
      }
      ok('23: strobe fires TWO pops per second', peaks.length === 2, JSON.stringify(peaks));
      near('23: strobe pop 1 sits at phase 0', peaks[0] ?? -9, 0, 0.008);
      near('23: strobe pop 2 sits at the 0.12 gap', peaks[1] ?? -9, 0.12, 0.008);
      near('23: strobe peaks at full brightness', FR('strobe', 0).alpha, 1, 1e-9);
      near('23: strobe rests near dark between pops', FR('strobe', 0.5).alpha, 0.15, 1e-9);
      ok('23: the first pop is colour A, the second colour B',
        FR('strobe', 0).mix === 0 && FR('strobe', 0.12).mix === 1);
      ok('23: strobe mix is BINARY by construction (no lerp needed in 2D)',
        (() => { for (let t = 0; t < 3; t += 0.007) {
          const m = FR('strobe', t).mix; if (m !== 0 && m !== 1) return false; } return true; })());
      ok('23: strobe repeats every 1.0 s',
        Math.abs(FR('strobe', 0.03).alpha - FR('strobe', 1.03).alpha) < 1e-12);

      // rotate — a sweep that NEVER goes fully dark (the physical discriminator)
      let rotMin = 1, rotMax = 0;
      for (let t = 0; t < 4; t += 0.003) {
        const a = FR('rotate', t).alpha; rotMin = Math.min(rotMin, a); rotMax = Math.max(rotMax, a);
      }
      near('23: rotate never dips below its 0.35 floor', rotMin, 0.35, 1e-6);
      near('23: rotate reaches full brightness', rotMax, 1, 1e-6);
      ok('23: rotate is strictly brighter than a strobe gap at every phase',
        (() => { for (let t = 0; t < 4; t += 0.01) if (FR('rotate', t).alpha < 0.349) return false;
                 return true; })());
      near('23: rotate colour eases WITH brightness (bright = colour A)', FR('rotate', 0).mix, 0, 1e-9);
      near('23: rotate is colour B at its dim end', FR('rotate', 1 / (0.9 * 2)).mix, 1, 1e-9);
      near('23: rotate period is 1/0.9 s',
        FR('rotate', 0.2).alpha, FR('rotate', 0.2 + 1 / 0.9).alpha, 1e-9);

      // fade — a 5 s breathing period
      near('23: fade is mid-way at t=0', FR('fade', 0).alpha, 0.575, 1e-9);
      near('23: fade peaks a quarter period in (1.25 s)', FR('fade', 1.25).alpha, 1, 1e-9);
      near('23: fade bottoms three quarters in (3.75 s)', FR('fade', 3.75).alpha, 0.15, 1e-9);
      near('23: fade has a 5 s period', FR('fade', 0.4).alpha, FR('fade', 5.4).alpha, 1e-9);
      ok('23: fade crossfades colour smoothly (mix tracks brightness, not a step)',
        (() => { for (let t = 0; t < 5; t += 0.05) {
          const fr = FR('fade', t); if (Math.abs(fr.mix - (fr.alpha - 0.15) / 0.85) > 1e-9) return false; }
          return true; })());

      // alternate — hard swap, constant brightness (wig-wag)
      ok("23: 'alternate' holds a constant brightness",
        [0, 0.5, 1.4, 3.9].every(t => FR('alternate', t).alpha === 1 && FR('alternate', t).glow === 0.6));
      ok('23: alternate swaps colour every 0.8 s, hard (never a fraction)',
        FR('alternate', 0).mix === 0 && FR('alternate', 0.79).mix === 0
        && FR('alternate', 0.81).mix === 1 && FR('alternate', 1.59).mix === 1
        && FR('alternate', 1.61).mix === 0);
      ok('23: alternate mix is only ever 0 or 1',
        (() => { for (let t = 0; t < 6; t += 0.013) {
          const m = FR('alternate', t).mix; if (m !== 0 && m !== 1) return false; } return true; })());

      // The halo envelope is a genuine SECOND curve, not a copy of alpha.
      ok('23: the halo (glow) envelope differs from the bead (alpha) envelope',
        FR('flash', 0.6).glow === 0.10 && FR('flash', 0.6).alpha === 0.28
        && Math.abs(FR('rotate', 0).glow - 0.9) < 1e-9
        && FR('rotate', 0).glow !== FR('rotate', 0).alpha);
    }

    // ── 21. lerpHexColor (§5's 2D colour blend) ──────────────────────────────
    {
      const L = F.lerpHexColor;
      ok('24: mix 0 is colour A, mix 1 is colour B',
        L('#ff0000', '#0000ff', 0) === '#ff0000' && L('#ff0000', '#0000ff', 1) === '#0000ff');
      ok('24: mix 0.5 is the midpoint', L('#000000', '#ffffff', 0.5) === '#808080',
        L('#000000', '#ffffff', 0.5));
      ok('24: per-channel lerp', L('#ff0000', '#00ff00', 0.5) === '#808000', L('#ff0000', '#00ff00', 0.5));
      ok('24: output is always 6-digit lowercase hex',
        /^#[0-9a-f]{6}$/.test(L('#010203', '#0a0b0c', 0.37)));
      ok('24: mix is clamped', L('#000000', '#ffffff', -3) === '#000000'
        && L('#000000', '#ffffff', 9) === '#ffffff');
      ok('24: a missing / malformed B returns A unchanged',
        L('#123456', undefined, 0.5) === '#123456' && L('#123456', 'nope', 0.5) === '#123456'
        && L('#123456', null, 0.5) === '#123456');
      ok('24: garbage A never throws and never emits a malformed colour',
        L('nope', '#ffffff', 0.5) === 'nope' && L(null, '#ffffff', 0.5) === '#ffffff');
      ok('24: a NaN mix falls back to colour A', L('#ff0000', '#0000ff', NaN) === '#ff0000');
    }

    // ── 22. sanitizeFlightGlowRules (§6.3) ──────────────────────────────────
    {
      const S = F.sanitizeFlightGlowRules;
      ok('25: the alias and the canonical name are ONE implementation',
        F.sanitizeGlowRules === S);
      ok('25: a non-array → undefined',
        S(undefined) === undefined && S(null) === undefined && S('x') === undefined && S(7) === undefined);
      ok('25: an empty array → undefined', S([]) === undefined);
      ok('25: non-object entries are skipped',
        S([null, 42, 'x', [], { id: 'a', pattern: 'solid', colorA: '#ffffff', criteria: {} }]).length === 1);

      ok('25: an unknown pattern drops the whole rule',
        S([{ id: 'a', pattern: 'sparkle', colorA: '#ffffff', criteria: {} }]) === undefined);
      ok('25: a missing pattern drops the rule',
        S([{ id: 'a', colorA: '#ffffff', criteria: {} }]) === undefined);
      ok('25: a visible pattern with NO usable colour drops the rule',
        S([{ id: 'a', pattern: 'flash', criteria: {} }]) === undefined
        && S([{ id: 'a', pattern: 'flash', colorA: 'red', criteria: {} }]) === undefined
        && S([{ id: 'a', pattern: 'flash', colorA: '#fff', criteria: {} }]) === undefined);
      ok("25: pattern 'none' is kept WITHOUT a colour",
        S([{ id: 'a', pattern: 'none', criteria: {} }])?.length === 1);

      const one = S([{ id: 'a', pattern: 'FLASH', colorA: '#FFD400', criteria: {} }]);
      ok('25: the pattern enum is case-SENSITIVE (an uppercase value drops)', one === undefined);
      const col = S([{ id: 'a', pattern: 'flash', colorA: '#FFD400', colorB: 'FF0000', criteria: {} }])[0];
      ok('25: colours normalize to lowercase #rrggbb (with or without the hash)',
        col.colorA === '#ffd400' && col.colorB === '#ff0000', `${col.colorA} ${col.colorB}`);
      ok('25: an unusable colorB is dropped, not kept malformed',
        S([{ id: 'a', pattern: 'flash', colorA: '#ffffff', colorB: 'zzz', criteria: {} }])[0].colorB === undefined);

      ok('25: enabled defaults to true and false survives',
        S([{ id: 'a', pattern: 'none', criteria: {} }])[0].enabled === true
        && S([{ id: 'a', pattern: 'none', enabled: false, criteria: {} }])[0].enabled === false);
      ok('25: a blank label collapses to undefined; a real one is trimmed',
        S([{ id: 'a', pattern: 'none', label: '   ', criteria: {} }])[0].label === undefined
        && S([{ id: 'a', pattern: 'none', label: ' hi ', criteria: {} }])[0].label === 'hi');

      // THE trap: a blank text criterion must NOT become `**` (match-everything).
      const blank = S([{ id: 'a', pattern: 'none',
        criteria: { operator: '', typeCode: '   ', reg: 42, callsign: null } }])[0];
      ok('25: blank / whitespace / non-string criteria → undefined, NEVER `**`',
        blank.criteria.operator === undefined && blank.criteria.typeCode === undefined
        && blank.criteria.reg === undefined && blank.criteria.callsign === undefined);
      ok('25: a blank-criteria rule still matches everything (unset = any)',
        F.matchesGlowCriteria(F.normalizeAircraftList(LAX)[0], blank.criteria) === true);

      const up = S([{ id: 'a', pattern: 'none', criteria: {
        typeCode: ' b738 ', reg: 'n8642a', callsign: 'swa*', category: 'a3',
        operator: '  Southwest  ', typeDesc: ' Boeing 737 ' } }])[0].criteria;
      ok('25: uppercase-in-the-data fields are uppercased',
        up.typeCode === 'B738' && up.reg === 'N8642A' && up.callsign === 'SWA*' && up.category === 'A3');
      ok('25: free-text fields keep their casing (matched case-insensitively anyway)',
        up.operator === 'Southwest' && up.typeDesc === 'Boeing 737');

      const cl = S([{ id: 'a', pattern: 'none', criteria: {
        minAltFt: -500, maxAltFt: 999999, minSpeedKt: -3, maxSpeedKt: 5000,
        minDistNm: -1, maxDistNm: 9999 } }])[0].criteria;
      ok('25: numeric criteria clamp to their documented bands',
        cl.minAltFt === 0 && cl.maxAltFt === 60000 && cl.minSpeedKt === 0
        && cl.maxSpeedKt === 800 && cl.minDistNm === 0 && cl.maxDistNm === 500,
        JSON.stringify(cl));
      const sw = S([{ id: 'a', pattern: 'none', criteria: {
        minAltFt: 30000, maxAltFt: 1000, minSpeedKt: 400, maxSpeedKt: 100,
        minDistNm: 20, maxDistNm: 5 } }])[0].criteria;
      ok('25: an inverted min/max pair is swapped, not dropped',
        sw.minAltFt === 1000 && sw.maxAltFt === 30000 && sw.minSpeedKt === 100
        && sw.maxSpeedKt === 400 && sw.minDistNm === 5 && sw.maxDistNm === 20);
      const nn = S([{ id: 'a', pattern: 'none', criteria: {
        minAltFt: NaN, maxAltFt: '5000', minSpeedKt: Infinity, military: 'yes', pia: 1 } }])[0].criteria;
      ok('25: non-finite / non-number / non-boolean criteria collapse to undefined',
        nn.minAltFt === undefined && nn.maxAltFt === undefined && nn.minSpeedKt === undefined
        && nn.military === undefined && nn.pia === undefined);
      ok('25: a non-object criteria field is tolerated as empty',
        S([{ id: 'a', pattern: 'none', criteria: 'nope' }])[0].criteria.operator === undefined
        && S([{ id: 'a', pattern: 'none' }])?.length === 1);
      ok('25: every tri-state boolean round-trips both ways',
        (() => { const c = S([{ id: 'a', pattern: 'none', criteria: {
          military: true, interesting: false, ladd: true, pia: false, emergency: true } }])[0].criteria;
          return c.military === true && c.interesting === false && c.ladd === true
            && c.pia === false && c.emergency === true; })());

      ok('25: MAX_FLIGHT_GLOW_RULES is 30', F.MAX_FLIGHT_GLOW_RULES === 30);
      const many = S(Array.from({ length: 44 },
        (_, i) => ({ id: `r${i}`, pattern: 'none', criteria: {} })));
      ok('25: the cap is enforced, keeping the FIRST 30', many.length === 30
        && many[0].id === 'r0' && many[29].id === 'r29', `n=${many.length}`);

      const dup = S([{ id: 'same', pattern: 'none', criteria: {} },
                     { id: 'same', pattern: 'none', criteria: {} },
                     { pattern: 'none', criteria: {} },
                     { id: '   ', pattern: 'none', criteria: {} }]);
      ok('25: ids are de-duplicated and a missing/blank one is repaired',
        dup.length === 4 && new Set(dup.map(r => r.id)).size === 4 && dup[0].id === 'same'
        && dup.every(r => typeof r.id === 'string' && r.id.trim() !== ''),
        dup.map(r => r.id).join(','));
      ok('25: id repair is DETERMINISTIC (no Math.random — imports stay reproducible)',
        JSON.stringify(S([{ pattern: 'none', criteria: {} }, { pattern: 'none', criteria: {} }]))
          === JSON.stringify(S([{ pattern: 'none', criteria: {} }, { pattern: 'none', criteria: {} }])));

      // Sanitizing twice is a no-op — the shape the store keeps is stable.
      const once = S([{ pattern: 'strobe', colorA: '#FF0000', colorB: '#00FF00', label: ' hi ',
        criteria: { callsign: ' swa* ', minAltFt: 9000, maxAltFt: 2000, military: true } }]);
      ok('25: sanitizing an already-sanitized list is idempotent',
        JSON.stringify(S(once)) === JSON.stringify(once), JSON.stringify(once));
      ok('25: the sanitized shape is JSON-round-trippable (store-safe)',
        JSON.stringify(S(JSON.parse(JSON.stringify(once)))) === JSON.stringify(once));
    }

    // ── 26. Banded speed indicator (flightSpeedBand) ─────────────────────────
    // Five bands over 60 / 200 / 450 / 700 km/h with ±15 km/h hysteresis, plus
    // the archetype fallback for a feed carrying no ground speed.
    {
      const B = F.flightSpeedBand;
      ok('26: thresholds are the pinned 60/200/450/700',
        JSON.stringify(Array.from(F.FLIGHT_SPEED_THRESHOLDS_KMH)) === '[60,200,450,700]',
        JSON.stringify(Array.from(F.FLIGHT_SPEED_THRESHOLDS_KMH)));
      ok('26: hysteresis margin is 15 km/h', F.FLIGHT_BAND_HYSTERESIS_KMH === 15);

      // Stateless ladder — every band, and both sides of every edge.
      ok('26: 0 km/h → band 1', B(0) === 1);
      ok('26: 59.9 → band 1', B(59.9) === 1);
      ok('26: exactly 60 → band 2 (edge is inclusive-low)', B(60) === 2);
      ok('26: 199.9 → band 2', B(199.9) === 2);
      ok('26: exactly 200 → band 3', B(200) === 3);
      ok('26: 449.9 → band 3', B(449.9) === 3);
      ok('26: exactly 450 → band 4', B(450) === 4);
      ok('26: 699.9 → band 4', B(699.9) === 4);
      ok('26: exactly 700 → band 5', B(700) === 5);
      ok('26: 2000 → band 5 (saturates)', B(2000) === 5);

      // Hysteresis UP: leaving a band upward needs the edge + 15.
      ok('26: hysteresis up — 205 with prev 2 holds band 2', B(205, 2) === 2);
      ok('26: hysteresis up — 214.9 with prev 2 still holds', B(214.9, 2) === 2);
      ok('26: hysteresis up — 215 with prev 2 advances to 3', B(215, 2) === 3);
      ok('26: hysteresis up — 70 with prev 1 holds band 1', B(70, 1) === 1);
      ok('26: hysteresis up — 75 with prev 1 advances to 2', B(75, 1) === 2);
      ok('26: hysteresis up — 710 with prev 4 holds band 4', B(710, 4) === 4);
      ok('26: hysteresis up — 715 with prev 4 advances to 5', B(715, 4) === 5);

      // Hysteresis DOWN: dropping out of a band needs its lower edge − 15.
      ok('26: hysteresis down — 195 with prev 3 holds band 3', B(195, 3) === 3);
      ok('26: hysteresis down — 185.1 with prev 3 still holds', B(185.1, 3) === 3);
      ok('26: hysteresis down — 185 with prev 3 drops to 2', B(185, 3) === 2);
      ok('26: hysteresis down — 690 with prev 5 holds band 5', B(690, 5) === 5);
      ok('26: hysteresis down — 685 with prev 5 drops to 4', B(685, 5) === 4);
      ok('26: hysteresis down — 50 with prev 2 holds band 2', B(50, 2) === 2);
      ok('26: hysteresis down — 45 with prev 2 drops to 1', B(45, 2) === 1);

      // A band-5 rig has no upper edge, a band-1 rig no lower one — neither
      // branch may throw or wander.
      ok('26: prev 5 cannot advance further', B(5000, 5) === 5);
      ok('26: prev 1 cannot drop further', B(0, 1) === 1);
      // Same band in, same band out — the guard that makes this a rebuild key.
      ok('26: prev equal to the raw band is idempotent',
        [1, 2, 3, 4, 5].every(b => B([30, 120, 300, 600, 900][b - 1], b) === b));
      // A big jump crosses several bands at once (no stepping).
      ok('26: a jump from band 1 to band 5 resolves in one step', B(900, 1) === 5);
      ok('26: a jump from band 5 to band 1 resolves in one step', B(10, 5) === 1);
      // Hysteresis cannot oscillate: a value inside the dead band round-trips.
      ok('26: 205 km/h is stable under repeated resolution from either side',
        B(205, B(205, 2)) === 2 && B(205, B(205, 3)) === 3);

      // Fallback: no usable speed → the archetype's regime.
      ok('26: null speed + heli → band 1', B(null, null, 'heli') === 1);
      ok('26: null speed + ga-high → band 2', B(null, null, 'ga-high') === 2);
      ok('26: null speed + ga-low → band 2', B(null, null, 'ga-low') === 2);
      ok('26: null speed + turboprop → band 3', B(null, null, 'turboprop') === 3);
      ok('26: null speed + twin-prop → band 3', B(null, null, 'twin-prop') === 3);
      ok('26: null speed + narrowbody → band 4', B(null, null, 'narrowbody') === 4);
      ok('26: null speed + widebody → band 4', B(null, null, 'widebody') === 4);
      ok('26: null speed + bizjet → band 4', B(null, null, 'bizjet') === 4);
      ok('26: null speed + unknown archetype → the narrowbody default (4)',
        B(null, null, 'not-an-archetype') === 4 && B(null) === 4);
      ok('26: undefined / NaN / negative speed all take the fallback',
        B(undefined, null, 'heli') === 1 && B(NaN, null, 'heli') === 1
        && B(-5, null, 'heli') === 1);
      ok('26: a garbage-typed speed takes the fallback', B('fast', null, 'heli') === 1);
      ok('26: the fallback IGNORES prevBand (it cannot oscillate, so it settles)',
        B(null, 5, 'heli') === 1);
      ok('26: every archetype in the table maps to a real band',
        Object.values(F.FLIGHT_BAND_FALLBACK).every(b => b >= 1 && b <= 5));

      // FlightPoint convenience — knots → km/h through the SAME resolver.
      const fpS = (gsKt, extra = {}) => ({ hex: 'x', callsign: null, lat: 0, lon: 0,
        altFt: 1000, gsKt, trackDeg: null, vertRateFpm: null, category: null,
        seenPosS: null, military: false, reg: null, typeCode: null, typeDesc: null,
        operator: null, emergency: null, squawk: null, interesting: false,
        pia: false, ladd: false, ...extra });
      ok('26: KT_TO_KMH is the exact nautical-mile conversion', F.KT_TO_KMH === 1.852);
      ok('26: 20 kt (37 km/h) → band 1', F.flightPointSpeedBand(fpS(20)) === 1);
      ok('26: 60 kt (111 km/h) → band 2', F.flightPointSpeedBand(fpS(60)) === 2);
      ok('26: 150 kt (278 km/h) → band 3', F.flightPointSpeedBand(fpS(150)) === 3);
      ok('26: 300 kt (556 km/h) → band 4', F.flightPointSpeedBand(fpS(300)) === 4);
      ok('26: 450 kt (833 km/h) → band 5', F.flightPointSpeedBand(fpS(450)) === 5);
      ok('26: a null gsKt takes the archetype fallback',
        F.flightPointSpeedBand(fpS(null), null, 'heli') === 1);
      ok('26: prevBand threads through the convenience wrapper',
        F.flightPointSpeedBand(fpS(111), 3) === 3          // 205 km/h, inside the dead band
        && F.flightPointSpeedBand(fpS(120), 2) === 3);      // 222 km/h, past 200 + 15

      // Real-fixture sanity: the LAX capture's airborne traffic bands sensibly.
      {
        const live = F.normalizeAircraftList(LAX);
        const bands = live.map(a =>
          F.flightPointSpeedBand(a, null, AT.aircraftArchetype(a.typeCode, a.category)));
        ok('26: every real aircraft resolves to a band in 1..5',
          bands.every(b => Number.isInteger(b) && b >= 1 && b <= 5));
        ok('26: the real capture spans more than one band',
          new Set(bands).size >= 2, `bands=${[...new Set(bands)].sort().join(',')}`);
      }
    }

    // ── 27. Independent vertical (height) scale ──────────────────────────────
    // verticalScale multiplies the DISPLAY HEIGHT only, is applied BEFORE the
    // absolute clearMm floor, and never touches the horizontal shell.
    {
      const CLEAR = F.FLIGHT_SHELL.clearMm;
      ok('27: clamp window is 0.2..2 with default 1',
        F.FLIGHT_VSCALE_MIN === 0.2 && F.FLIGHT_VSCALE_MAX === 2
        && F.FLIGHT_VSCALE_DEFAULT === 1);
      ok('27: flightVerticalScale clamps + defaults',
        F.flightVerticalScale(0.05) === 0.2 && F.flightVerticalScale(9) === 2
        && F.flightVerticalScale(undefined) === 1 && F.flightVerticalScale(NaN) === 1
        && F.flightVerticalScale(-1) === 1 && F.flightVerticalScale(0.75) === 0.75);

      // Byte-identity: the absent / explicit-1 paths reproduce the shipped
      // composition EXACTLY, at the authored reference shell and at the default.
      {
        const grid = [];
        for (const alt of [0, 800, 2000, 9000, 20000, 38000, 51000]) {
          for (const d of [0.3, 2, 6.5, 10, 15, 30]) {
            for (const shell of [F.FLIGHT_SHELL_BASE_MM, F.flightShellMm(), F.flightShellMm(1000)]) {
              const r = F.compressRadiusMm(d, 15, shell);
              grid.push([F.flightDisplayAltitudeMm(alt, d, r, shell),
                         F.flightDisplayAltitudeMm(alt, d, r, shell, 1)]);
            }
          }
        }
        ok('27: an explicit verticalScale of 1 is byte-identical to omitting it',
          grid.every(([a, b]) => a === b), `n=${grid.length}`);
        ok('27: the FB reference wrapper is unaffected too',
          FB.flightDisplayAltitudeMm(30000, 8, 40000) ===
          F.flightDisplayAltitudeMm(30000, 8, 40000, F.FLIGHT_SHELL_BASE_MM, 1));
      }

      // 0.5 halves the composed height wherever the result stays ABOVE the floor.
      {
        const shell = F.flightShellMm();
        let checked = 0, halved = 0;
        for (const alt of [12000, 20000, 30000, 40000]) {
          for (const d of [0.5, 1, 2, 4]) {
            const r = F.compressRadiusMm(d, 15, shell);
            const full = F.flightDisplayAltitudeMm(alt, d, r, shell, 1);
            const half = F.flightDisplayAltitudeMm(alt, d, r, shell, 0.5);
            if (full / 2 > CLEAR) { checked++; if (Math.abs(half - full / 2) < 1e-6) halved++; }
          }
        }
        ok('27: 0.5 exactly halves dispY everywhere the floor is not engaged',
          checked > 0 && halved === checked, `${halved}/${checked}`);
      }

      // The floor is ABSOLUTE and applied AFTER the scale: no scale, however
      // small, can put an aircraft below the property-clearance height.
      {
        const shell = F.flightShellMm();
        const r = F.compressRadiusMm(10, 15, shell);
        const lows = [0.2, 0.3, 0.5, 0.75].map(v =>
          F.flightDisplayAltitudeMm(35000, 10, r, shell, v));
        ok('27: dispY never drops below clearMm at any scale',
          lows.every(y => y >= CLEAR - 1e-9), lows.map(y => Math.round(y)).join(','));
        ok('27: the floor is unscaled — an already-floored aircraft is unchanged by scaling',
          F.flightDisplayAltitudeMm(400, 14, r, shell, 0.2) === CLEAR
          && F.flightDisplayAltitudeMm(400, 14, r, shell, 1) === CLEAR);
        ok('27: scaling is monotonic (never inverts the ordering of two scales)',
          [0.2, 0.5, 1, 1.5, 2].every((v, i, a) => i === 0
            || F.flightDisplayAltitudeMm(35000, 4, r, shell, v)
               >= F.flightDisplayAltitudeMm(35000, 4, r, shell, a[i - 1])));
        ok('27: 2 exactly doubles a height clear of the floor',
          Math.abs(F.flightDisplayAltitudeMm(35000, 1, r, shell, 2)
                   - 2 * F.flightDisplayAltitudeMm(35000, 1, r, shell, 1)) < 1e-6);
      }

      // The HORIZONTAL shell is untouched — the whole point of the feature.
      {
        const fp = { hex: 'v1', callsign: null, lat: 40.15, lon: -75.1, altFt: 33000,
          gsKt: 420, trackDeg: 90, vertRateFpm: 0, category: 'A3', seenPosS: 0,
          military: false, reg: null, typeCode: 'B738', typeDesc: null, operator: null,
          emergency: null, squawk: null, interesting: false, pia: false, ladd: false };
        const a = F.flightDisplayPos(fp, 40, -75, 0, 15, F.flightShellMm(), 1);
        const b = F.flightDisplayPos(fp, 40, -75, 0, 15, F.flightShellMm(), 0.4);
        ok('27: planX / planY / distNm / bearing are bit-identical across scales',
          a.planX === b.planX && a.planY === b.planY
          && a.distNm === b.distNm && a.bearingRad === b.bearingRad);
        ok('27: only dispY moves, and downward', b.dispY < a.dispY,
          `${Math.round(a.dispY)} → ${Math.round(b.dispY)}`);
        ok('27: the display elevation ANGLE falls with the scale',
          Math.atan2(b.dispY, Math.hypot(b.planX, b.planY))
            < Math.atan2(a.dispY, Math.hypot(a.planX, a.planY)));
        ok('27: flightDisplayPos with no scale argument equals scale 1',
          JSON.stringify(F.flightDisplayPos(fp, 40, -75, 0, 15, F.flightShellMm()))
            === JSON.stringify(a));
      }

      // Frustum reach: it must GROW with a scale above 1 (the band genuinely
      // reaches higher) and must NOT shrink below it (the radial term dominates).
      {
        const shell = F.flightShellMm();
        const base = F.flightShellReachMm(shell);
        ok('27: reach at scale 1 equals the shipped reach',
          F.flightShellReachMm(shell, 1) === base && F.flightShellReachMm(shell) === base);
        ok('27: reach is unchanged for scales at or below 1',
          F.flightShellReachMm(shell, 0.5) === base
          && F.flightShellReachMm(shell, 0.2) === base);
        ok('27: reach grows for a scale above 1',
          F.flightShellReachMm(shell, 2) > base * 1.2,
          `${Math.round(base)} → ${Math.round(F.flightShellReachMm(shell, 2))}`);
        const s = shell / F.FLIGHT_SHELL_BASE_MM;
        near('27: reach at scale 2 is hypot(rMax, 2·yMax) × the shell factor',
          F.flightShellReachMm(shell, 2),
          s * Math.hypot(F.FLIGHT_SHELL.rMaxMm, F.FLIGHT_SHELL.yMaxMm * 2), 1e-6);
        ok('27: reach still bounds the tallest drawable point at max scale',
          F.flightShellReachMm(F.flightShellMm(1000), 2)
            >= F.flightDisplayAltitudeMm(45000, 0.1,
                 F.compressRadiusMm(0.1, 15, F.flightShellMm(1000)),
                 F.flightShellMm(1000), 2));
      }
    }

    // ── §28 Military skins (vehicle library V3) ──────────────────────────────
    // `militarySkinFor` decides which named BG_CRAFTS silhouette a live aircraft
    // wears. Pure resolution only — the ENVELOPE (archetype metrics) is the
    // renderer's business and is pinned in flights-render-test §26.
    {
      const MFP = o => ({
        hex: 'mil001', callsign: null, lat: 40, lon: -75, altFt: 20000,
        gsKt: 400, trackDeg: 90, vertRateFpm: 0, category: null, seenPosS: 1,
        military: false, reg: null, typeCode: null, typeDesc: null, operator: null,
        emergency: null, squawk: null, interesting: false, pia: false, ladd: false,
        ...o,
      });

      // 1. Exact type-designator matches — the six already-built silhouettes.
      const EXACT = [['F16', 'f16'], ['F22', 'f22'], ['A10', 'a10'],
                     ['B2', 'b2'], ['B52', 'b52'], ['AH64', 'apache']];
      for (const [t, want] of EXACT) {
        ok(`28: typeCode ${t} → ${want}`,
          F.militarySkinFor(MFP({ typeCode: t })) === want,
          String(F.militarySkinFor(MFP({ typeCode: t }))));
      }
      ok('28: the six skins are exactly FLIGHT_MILITARY_SKINS',
        F.FLIGHT_MILITARY_SKINS.slice().sort().join(',')
          === EXACT.map(e => e[1]).sort().join(','),
        F.FLIGHT_MILITARY_SKINS.join(','));
      ok('28: exact match needs NO military dbFlag (a typed F-16 IS one)',
        F.militarySkinFor(MFP({ typeCode: 'F16', military: false })) === 'f16');
      ok('28: exact match is case/whitespace insensitive',
        F.militarySkinFor(MFP({ typeCode: '  f16 ' })) === 'f16');
      ok('28: exact match beats the A6 category fallback',
        F.militarySkinFor(MFP({ typeCode: 'A10', category: 'A6' })) === 'a10');
      ok('28: exact match beats the military-heli rule',
        F.militarySkinFor(MFP({ typeCode: 'B2', category: 'A7', military: true }),
                          'heli') === 'b2');

      // 2. Category A6 (high-performance / fighter) → f16.
      ok('28: category A6 → f16', F.militarySkinFor(MFP({ category: 'A6' })) === 'f16');
      ok('28: category A6 needs no military flag',
        F.militarySkinFor(MFP({ category: 'A6', military: false })) === 'f16');
      ok('28: category A6 lowercase/padded still resolves',
        F.militarySkinFor(MFP({ category: ' a6 ' })) === 'f16');

      // 3. Military rotorcraft → apache, from the RESOLVED archetype.
      ok('28: military heli (archetype) → apache',
        F.militarySkinFor(MFP({ typeCode: 'UH60', military: true }), 'heli') === 'apache');
      ok('28: CIVIL heli keeps the generic body',
        F.militarySkinFor(MFP({ typeCode: 'EC35', military: false }), 'heli') === null);
      ok('28: military NON-heli archetype gets no skin',
        F.militarySkinFor(MFP({ typeCode: 'C130', military: true }), 'turboprop') === null);
      ok('28: with no archetype passed, category A7 carries the heli rule',
        F.militarySkinFor(MFP({ category: 'A7', military: true })) === 'apache');
      ok('28: an archetype ARGUMENT wins over the category heli guess',
        F.militarySkinFor(MFP({ category: 'A7', military: true }), 'narrowbody') === null);

      // 4. Civil traffic — the overwhelming majority — is untouched.
      const CIVIL = [
        { typeCode: 'B738', category: 'A3' }, { typeCode: 'A320', category: 'A3' },
        { typeCode: 'C172', category: 'A1' }, { typeCode: 'SR22', category: 'A1' },
        { typeCode: 'GLF6', category: 'A2' }, { typeCode: 'B77W', category: 'A5' },
        { typeCode: null, category: null },
      ];
      ok('28: civil traffic resolves to no skin',
        CIVIL.every(o => F.militarySkinFor(MFP(o)) === null),
        CIVIL.map(o => String(F.militarySkinFor(MFP(o)))).join(','));
      ok('28: a military AIRLINER (tanker/transport) still has no skin of its own',
        F.militarySkinFor(MFP({ typeCode: 'KC35', category: 'A5', military: true }),
                          'widebody') === null);

      // 5. The `B2` axis collision, named in the resolver: emitter category B2
      //    is a BALLOON, type designator B2 is a Northrop bomber.
      ok('28: category B2 (lighter-than-air) is NOT painted as a B-2',
        F.militarySkinFor(MFP({ category: 'B2', typeCode: null })) === null);
      ok('28: category B2 with a real balloon-ish type stays generic',
        F.militarySkinFor(MFP({ category: 'B2', typeCode: 'BALL' })) === null);

      // 6. Never throws.
      ok('28: garbage input resolves to null, never throws', (() => {
        try {
          return F.militarySkinFor(null) === null
            && F.militarySkinFor(MFP({ typeCode: 42, category: {} })) === null
            && F.militarySkinFor(MFP({ typeCode: '' }), '') === null;
        } catch { return false; }
      })());

      // 7. Toggle semantics — ABSENT = ON (the beacons/privacyDim idiom).
      ok('28: militarySkinsEnabled(undefined) = ON', F.militarySkinsEnabled(undefined) === true);
      ok('28: militarySkinsEnabled(true) = ON', F.militarySkinsEnabled(true) === true);
      ok('28: militarySkinsEnabled(false) = OFF', F.militarySkinsEnabled(false) === false);
      ok('28: militarySkinsEnabled(null) = ON (stale config)',
        F.militarySkinsEnabled(null) === true);

      // 8. The skin table is a TYPE-designator table only — it never leaks into
      //    the archetype classification (aircraft-types.ts stays the authority).
      ok('28: MILITARY_SKIN_TYPE_CODES keys are uppercase designators',
        Object.keys(F.MILITARY_SKIN_TYPE_CODES).every(k => k === k.toUpperCase()),
        Object.keys(F.MILITARY_SKIN_TYPE_CODES).join(','));
      ok('28: every table value is a known skin',
        Object.values(F.MILITARY_SKIN_TYPE_CODES)
          .every(v => F.FLIGHT_MILITARY_SKINS.includes(v)));
    }

    // ── 29. Airline identification (docs/research/airline-reference.md) ──────
    // The callsign-prefix → carrier lookup (src/airlines.ts, the third pure
    // zero-import member of the shared-chunk family) plus flights.ts's own
    // additions: the `airline` label field and the side/banner text resolvers,
    // both of which take the airline strings as an INJECTED parameter so
    // flights.ts never imports airlines.ts.
    {
      const A = await import('./airlines.mod.js' + V);

      // 1. Ident parsing. A prefix is only an airline when what follows is
      //    flight-number shaped — `N123AB` must never read as an airline.
      const nm = cs => A.airlineForCallsign(cs)?.icao ?? null;
      ok('29: DAL1234 → DAL', nm('DAL1234') === 'DAL');
      ok('29: lowercase idents resolve', nm('dal1234') === 'DAL');
      ok('29: surrounding whitespace is trimmed', nm('  UAL200  ') === 'UAL');
      ok('29: a trailing letter suffix is allowed', nm('UAL200A') === 'UAL');
      ok('29: two trailing letters are allowed', nm('SWA55AB') === 'SWA');
      ok('29: a bare 3-letter ident is NOT an airline', nm('AAL') === null);
      ok('29: an N-number is NOT an airline', nm('N123AB') === null);
      ok('29: an unknown prefix resolves to null', nm('ZQX123') === null);
      ok('29: three trailing letters are rejected', nm('UAL200ABC') === null);
      ok('29: five digits are rejected', nm('DAL12345') === null);
      ok('29: garbage never throws', (() => {
        try {
          return nm(null) === null && nm(undefined) === null && nm('') === null
            && nm(42) === null && nm({}) === null;
        } catch { return false; }
      })());

      // 2. The data itself — spot-checks straight off the reference doc.
      const dal = A.airlineForCallsign('DAL1234');
      ok('29: DAL is Delta Air Lines', dal.name === 'Delta Air Lines', dal.name);
      ok('29: DAL short name + IATA', dal.shortName === 'Delta' && dal.iata === 'DL');
      ok('29: DAL telephony word', dal.callsign === 'DELTA');
      ok('29: DAL slogan', dal.slogan === 'Keep Climbing');
      ok('29: DAL colours are the doc hexes',
        dal.colorPrimary === '#c8102e' && dal.colorSecondary === '#00285f');
      ok('29: BAW telephony word is SPEEDBIRD',
        A.airlineForCallsign('BAW117').callsign === 'SPEEDBIRD');
      // LATAM's doc row splits the IATA code ("LA (Chile) / JJ (Brasil)") — the
      // surviving primary is the one stored.
      ok('29: LAN carries the split IATA as LA', A.AIRLINES.LAN.iata === 'LA');

      // 3. Table integrity.
      const entries = Object.entries(A.AIRLINES);
      // The reference doc carries 129 operator rows across its seven tables;
      // the floor guards against a table that silently loses a section.
      ok('29: every documented operator row is transcribed',
        entries.length >= 129, `n=${entries.length}`);
      ok('29: every key is a 3-letter uppercase ICAO prefix',
        entries.every(([k]) => /^[A-Z]{3}$/.test(k)));
      ok('29: every entry\'s icao field matches its key',
        entries.every(([k, v]) => v.icao === k));
      ok('29: every colour is a #rrggbb hex',
        entries.every(([, v]) =>
          (!v.colorPrimary || /^#[0-9a-f]{6}$/i.test(v.colorPrimary))
          && (!v.colorSecondary || /^#[0-9a-f]{6}$/i.test(v.colorSecondary))));
      ok('29: a secondary colour never appears without a primary',
        entries.every(([, v]) => !v.colorSecondary || !!v.colorPrimary));
      ok('29: every entry has a name + shortName + kind',
        entries.every(([, v]) => !!v.name && !!v.shortName && !!v.kind));
      // Regionals fly in their partner's paint — carrying a guessed livery
      // would be a fabrication, so they carry `operatesFor` and NO colours.
      const skw = A.AIRLINES.SKW;
      ok('29: SkyWest carries operatesFor and no colours',
        !!skw.operatesFor && !skw.colorPrimary, skw.operatesFor);

      // 4. PIA pseudo-operators are NOT airlines.
      ok('29: FFL is kind pia', A.AIRLINES.FFL.kind === 'pia');
      ok('29: DCM is kind pia', A.AIRLINES.DCM.kind === 'pia');
      ok('29: a PIA prefix carries no livery colours',
        !A.AIRLINES.FFL.colorPrimary && !A.AIRLINES.DCM.colorPrimary);
      ok('29: airlineTextFor refuses a PIA pseudo-operator',
        A.airlineTextFor('FFL123') === null);
      ok('29: airlineTextFor refuses a suppressed identity',
        A.airlineTextFor('DAL1234', true) === null);
      ok('29: airlineTextFor resolves a real carrier',
        A.airlineTextFor('DAL1234').shortName === 'Delta');

      // 5. Military / government callsign words.
      const mw = cs => A.militaryCallsignInfo(cs)?.word ?? null;
      ok('29: RCH1234 → REACH (the abbreviated broadcast form)', mw('RCH1234') === 'REACH');
      ok('29: REACH11 → REACH (the spoken form)', mw('REACH11') === 'REACH');
      ok('29: SAM123 → SAM', mw('SAM123') === 'SAM');
      ok('29: CNV42 → CONVOY (documented ICAO designator)', mw('CNV42') === 'CONVOY');
      ok('29: CONVOY42 → CONVOY', mw('CONVOY42') === 'CONVOY');
      ok('29: NOAA42 → NOAA', mw('NOAA42') === 'NOAA');
      ok('29: a bare INTERIOR matches (no mission number)', mw('INTERIOR') === 'INTERIOR');
      ok('29: TANKERMAN is NOT a military word', mw('TANKERMAN') === null);
      ok('29: an airline ident is not a military word', mw('DAL1234') === null);
      ok('29: the ceremonial "…ONE" rows are deliberately absent',
        !('AIR FORCE ONE' in A.MILITARY_CALLSIGN_WORDS)
        && !('MARINE ONE' in A.MILITARY_CALLSIGN_WORDS));
      ok('29: militaryCallsignInfo never throws', (() => {
        try { return mw(null) === null && mw(7) === null && mw('') === null; }
        catch { return false; }
      })());

      // 6. Spoken form.
      ok('29: spokenCallsign(DAL1234) = "DELTA 1234"',
        A.spokenCallsign('DAL1234') === 'DELTA 1234', A.spokenCallsign('DAL1234'));
      ok('29: spokenCallsign(BAW117) = "SPEEDBIRD 117"',
        A.spokenCallsign('BAW117') === 'SPEEDBIRD 117');
      ok('29: the trailing-letter suffix rides along',
        A.spokenCallsign('UAL200A') === 'UNITED 200A');
      ok('29: a non-airline ident has no spoken form',
        A.spokenCallsign('N12345') === null && A.spokenCallsign('RCH1234') === null);
      ok('29: an already-resolved lookup can be passed in',
        A.spokenCallsign('DAL1234', A.AIRLINES.DAL) === 'DELTA 1234');

      // 7. US military hex heuristic — a strong OBSERVED pattern, not an
      //    official allocation (the UI copy says so).
      ok('29: AE0000 is the low bound', A.usMilitaryHexHeuristic('ae0000') === true);
      ok('29: AFFFFF is the high bound', A.usMilitaryHexHeuristic('afffff') === true);
      ok('29: ADFFFF is below the range', A.usMilitaryHexHeuristic('adffff') === false);
      ok('29: B00000 is above the range', A.usMilitaryHexHeuristic('b00000') === false);
      ok('29: an ordinary US civil hex is outside it',
        A.usMilitaryHexHeuristic('a12345') === false);
      ok('29: case is irrelevant', A.usMilitaryHexHeuristic('AE1234') === true);
      ok('29: garbage is false, never a throw', (() => {
        try {
          return A.usMilitaryHexHeuristic(null) === false
            && A.usMilitaryHexHeuristic('zzzz') === false
            && A.usMilitaryHexHeuristic('') === false
            && A.usMilitaryHexHeuristic(42) === false;
        } catch { return false; }
      })());

      // 8. The LIVERY PRECEDENCE LADDER — the one ordering this whole feature
      //    rests on. Every refusal is asserted independently.
      const liv = (info, o) => A.resolveAirlineLivery(info, o);
      ok('29: a mainline carrier is painted',
        liv(A.AIRLINES.DAL, {})?.primary === '#c8102e');
      ok('29: …with its secondary as the accent',
        liv(A.AIRLINES.DAL, {})?.secondary === '#00285f');
      ok('29: the master gate refuses', liv(A.AIRLINES.DAL, { enabled: false }) === null);
      ok('29: a military SKIN refuses (the silhouette keeps its own paint)',
        liv(A.AIRLINES.DAL, { skin: true }) === null);
      ok('29: the military flag refuses (olive drab wins)',
        liv(A.AIRLINES.DAL, { military: true }) === null);
      ok('29: PIA identity suppression refuses',
        liv(A.AIRLINES.DAL, { suppress: true }) === null);
      ok('29: a kind:pia pseudo-operator refuses', liv(A.AIRLINES.FFL, {}) === null);
      ok('29: a colourless regional refuses', liv(A.AIRLINES.SKW, {}) === null);
      ok('29: an unresolved airline refuses',
        liv(null, {}) === null && liv(undefined, {}) === null);
      // The skin veto matters on its own: militarySkinFor fires for
      // `category: 'A6'` with NO military dbFlag, so a view that skipped it
      // would paint an aircraft the other view leaves generic.
      ok('29: an A6 fighter resolves a skin WITHOUT the military flag',
        F.militarySkinFor({ typeCode: null, category: 'A6', military: false }, 'bizjet') === 'f16');
      ok('29: …and the skin veto alone refuses its livery',
        liv(A.AIRLINES.DAL, { military: false, skin: true }) === null);
      ok('29: a primary-only carrier omits the accent', (() => {
        const r = liv(A.AIRLINES.KLM, {});
        return r && r.primary === '#00a1de' && r.secondary === undefined;
      })());
      ok('29: airlineColorsEnabled is absent-is-ON',
        A.airlineColorsEnabled(undefined) === true && A.airlineColorsEnabled(null) === true
        && A.airlineColorsEnabled(true) === true && A.airlineColorsEnabled(false) === false);

      // 9. The `airline` LABEL FIELD (flights.ts), whose text is injected.
      ok('29: FLIGHT_LABEL_FIELDS carries `airline`',
        F.FLIGHT_LABEL_FIELDS.includes('airline'));
      ok('29: it sits after `operator` in the canonical order',
        F.FLIGHT_LABEL_FIELDS.indexOf('airline') === F.FLIGHT_LABEL_FIELDS.indexOf('operator') + 1);
      ok('29: the DEFAULT plate is unchanged (callsign + alt)',
        JSON.stringify(F.FLIGHT_LABEL_FIELDS_DEFAULT) === JSON.stringify(['callsign', 'alt']));
      ok('29: sanitizeLabelFields keeps `airline`',
        JSON.stringify(F.sanitizeLabelFields(['airline', 'alt'])) === JSON.stringify(['airline', 'alt']));
      ok('29: sanitizeLabelFields still drops unknown keys beside it',
        JSON.stringify(F.sanitizeLabelFields(['airline', 'nope'])) === JSON.stringify(['airline']));
      const AFP = { hex: 'a1', callsign: 'DAL1234', altFt: 30000, reg: null,
        typeCode: null, typeDesc: null, operator: null, squawk: null,
        gsKt: null, vertRateFpm: null, distNm: null, pia: false, ladd: false };
      ok('29: flightFieldText renders the INJECTED airline name',
        F.flightFieldText('airline', AFP, 'DAL1234', false, 'Delta') === 'Delta');
      ok('29: an omitted injection renders empty (stale-caller safe)',
        F.flightFieldText('airline', AFP, 'DAL1234', false) === '');
      ok('29: PIA suppression withholds the airline field',
        F.flightFieldText('airline', AFP, 'A1', true, 'Delta') === '');
      ok('29: a long airline name is capped at 22 chars',
        F.flightFieldText('airline', AFP, 'X', false, 'A'.repeat(40)).length === 22);
      ok('29: flightLabelLines threads the injection through',
        F.flightLabelLines(AFP, ['callsign', 'airline'], true, 'Delta').sub === 'Delta',
        JSON.stringify(F.flightLabelLines(AFP, ['callsign', 'airline'], true, 'Delta')));
      ok('29: an empty injection drops the line entirely',
        F.flightLabelLines(AFP, ['callsign', 'airline'], true).sub === '');

      // 10. Fuselage (`sideText`) + banner (`bannerText`) modes.
      ok('29: the side-text vocabulary is the documented six',
        JSON.stringify([...F.FLIGHT_SIDE_TEXT_MODES])
          === JSON.stringify(['auto', 'operator', 'airline', 'slogan', 'callsign', 'none']));
      ok('29: the banner-text vocabulary is the documented four',
        JSON.stringify([...F.FLIGHT_BANNER_TEXT_MODES])
          === JSON.stringify(['auto', 'airline', 'slogan', 'callsign']));
      // The default + anything unusable collapses to undefined — "use the
      // shipped behavior" (the modelScale "exactly the default clears" idiom).
      ok('29: sanitizeSideText normalizes auto → undefined',
        F.sanitizeSideText('auto') === undefined);
      ok('29: sanitizeSideText keeps a real mode', F.sanitizeSideText('slogan') === 'slogan');
      ok('29: sanitizeSideText is case/space tolerant',
        F.sanitizeSideText('  SLOGAN ') === 'slogan');
      ok('29: sanitizeSideText drops unknowns',
        F.sanitizeSideText('nope') === undefined && F.sanitizeSideText(7) === undefined
        && F.sanitizeSideText(null) === undefined);
      ok('29: sanitizeBannerText normalizes auto → undefined',
        F.sanitizeBannerText('auto') === undefined);
      ok('29: sanitizeBannerText rejects `none` (a banner is never blank)',
        F.sanitizeBannerText('none') === undefined);
      ok('29: sanitizeBannerText keeps a real mode',
        F.sanitizeBannerText('airline') === 'airline');

      // The AUTO layout is byte-identical BY CONSTRUCTION: the resolver takes
      // the shipped pair as its base and returns it untouched.
      const BASE = { flank: 'AMERICAN AIRLINES INC', top: 'AAL266' };
      const AL = { shortName: 'Delta', slogan: 'Keep Climbing' };
      const OPFP = { operator: 'AMERICAN AIRLINES INC' };
      const side = (m, al = AL, fp = OPFP, sup = false) =>
        F.resolveFlightSideText(m, BASE, fp, 'AAL266', sup, al);
      ok('29: auto returns the base pair unchanged',
        JSON.stringify(side('auto')) === JSON.stringify(BASE));
      ok('29: an absent mode returns the base pair unchanged',
        JSON.stringify(side(undefined)) === JSON.stringify(BASE));
      ok('29: an unknown mode returns the base pair unchanged',
        JSON.stringify(side('bogus')) === JSON.stringify(BASE));
      ok('29: none blanks both surfaces',
        JSON.stringify(side('none')) === JSON.stringify({ flank: '', top: '' }));
      ok('29: callsign puts the identity on the flanks only',
        JSON.stringify(side('callsign')) === JSON.stringify({ flank: 'AAL266', top: '' }));
      ok('29: airline paints the short name and keeps the spine identity',
        JSON.stringify(side('airline'))
          === JSON.stringify({ flank: 'Delta', top: 'AAL266' }));
      ok('29: slogan paints the slogan',
        JSON.stringify(side('slogan'))
          === JSON.stringify({ flank: 'Keep Climbing', top: 'AAL266' }));
      ok('29: slogan falls back to the short name when there is none',
        JSON.stringify(side('slogan', { shortName: 'SkyWest' }))
          === JSON.stringify({ flank: 'SkyWest', top: 'AAL266' }));
      ok('29: an unresolvable airline falls back to the base pair',
        JSON.stringify(side('airline', null)) === JSON.stringify(BASE)
        && JSON.stringify(side('slogan', null)) === JSON.stringify(BASE));
      ok('29: operator forces the operator onto the flanks',
        JSON.stringify(side('operator'))
          === JSON.stringify({ flank: 'AMERICAN AIRLINES INC', top: 'AAL266' }));
      ok('29: operator with no operator falls back to the base pair',
        JSON.stringify(side('operator', AL, { operator: null })) === JSON.stringify(BASE));
      // PIA: only `none` (strictly LESS information) is honored.
      ok('29: PIA suppression falls back to the base pair for every mode',
        ['operator', 'airline', 'slogan', 'callsign']
          .every(m => JSON.stringify(side(m, AL, OPFP, true)) === JSON.stringify(BASE)));
      ok('29: …but `none` is still honored under suppression',
        JSON.stringify(side('none', AL, OPFP, true)) === JSON.stringify({ flank: '', top: '' }));

      const ban = (m, al = AL, sup = false) => F.resolveFlightBannerText(m, 'N737GA', sup, al);
      ok('29: banner auto is the identity', ban('auto') === 'N737GA');
      ok('29: banner absent is the identity', ban(undefined) === 'N737GA');
      ok('29: banner callsign is the identity', ban('callsign') === 'N737GA');
      ok('29: banner airline is the short name', ban('airline') === 'Delta');
      ok('29: banner slogan is the slogan', ban('slogan') === 'Keep Climbing');
      ok('29: banner slogan falls back through short name',
        ban('slogan', { shortName: 'SkyWest' }) === 'SkyWest');
      ok('29: a banner is never blank', ban('slogan', null) === 'N737GA'
        && ban('airline', null) === 'N737GA');
      ok('29: suppression pins the banner to the identity',
        ban('airline', AL, true) === 'N737GA');

      // 11. The LIVE fixture — the airline lookup against a real 94-aircraft
      //     airplanes.live capture, not a hand-built point.
      const liveList = F.normalizeAircraftList(LAX);
      const resolved = liveList.filter(fp => A.airlineForCallsign(fp.callsign));
      ok('29: the real LAX capture resolves airlines', resolved.length > 5,
        `${resolved.length}/${liveList.length}`);
      ok('29: every resolved carrier is a table entry',
        resolved.every(fp => A.AIRLINES[A.airlineForCallsign(fp.callsign).icao]));
      ok('29: no aircraft in the capture resolves to a PIA table entry as a livery',
        resolved.every(fp => A.resolveAirlineLivery(A.airlineForCallsign(fp.callsign), {})
          === null || A.airlineForCallsign(fp.callsign).kind !== 'pia'));
    }

    // ══ 30. Sources & server-side transport (2026-08 source wave) ══════════
    // airplanes.live went 403-for-everyone and there is no longer ANY keyless
    // CORS-open ADS-B API (measured: curl 200 + browser TypeError for both
    // opensky and adsb.lol from a foreign origin), so the two live cloud feeds
    // are fetched by Home Assistant through a user-defined rest_command.
    {
      // Local helpers — this page's shared vocabulary is ok()/near() only.
      const eq = (name, got, want, extra = '') =>
        ok(name, got === want, extra || `got ${JSON.stringify(got)} want ${JSON.stringify(want)}`);

      // ── (a) source resolution + the ORDER contract ──────────────────────
      eq('30a: absent source resolves to OpenSky', F.resolveFlightSource(undefined), 'opensky');
      eq('30a: null resolves to OpenSky', F.resolveFlightSource(null), 'opensky');
      eq('30a: unknown string resolves to OpenSky', F.resolveFlightSource('adsbfi'), 'opensky');
      eq('30a: FLIGHTS_DEFAULT_SOURCE is opensky', F.FLIGHTS_DEFAULT_SOURCE, 'opensky');
      eq('30a: opensky is FIRST in the source list', F.FLIGHT_SOURCES[0], 'opensky');
      eq('30a: adsblol is second', F.FLIGHT_SOURCES[1], 'adsblol');
      ok('30a: every listed source round-trips',
        F.FLIGHT_SOURCES.every(v => F.resolveFlightSource(v) === v), F.FLIGHT_SOURCES.join(','));
      // NEGATIVE CONTROL: an EXPLICIT stored source is never coerced to the
      // default — a migrating 'cloud' user keeps 'cloud'.
      ok('30a: NEG explicit cloud is NOT rewritten to the default',
        F.resolveFlightSource('cloud') !== F.FLIGHTS_DEFAULT_SOURCE);

      ok('30a: opensky + adsblol need the proxy',
        F.flightSourceNeedsProxy('opensky') && F.flightSourceNeedsProxy('adsblol'));
      ok('30a: NEG cloud/local/entity do NOT need the proxy',
        !F.flightSourceNeedsProxy('cloud') && !F.flightSourceNeedsProxy('local')
        && !F.flightSourceNeedsProxy('entity'));
      ok('30a: absent source needs the proxy (it resolves to opensky)',
        F.flightSourceNeedsProxy(undefined));
      // `local` MAY be routed through HA, but must never be REQUIRED to be:
      // a receiver reachable from the browser is a legitimate configuration,
      // and `needs-proxy` would falsely claim nothing is being fetched.
      ok('30a: NEG local has a suggested command yet still does NOT need the proxy',
        !!F.FLIGHT_PROXY_DEFAULT_COMMAND.local && !F.flightSourceNeedsProxy('local'),
        F.FLIGHT_PROXY_DEFAULT_COMMAND.local);
      eq('30a: local suggests diorama_local_adsb',
        F.FLIGHT_PROXY_DEFAULT_COMMAND.local, 'diorama_local_adsb');
      ok('30a: NEG the three suggested command names are distinct', new Set([
        F.FLIGHT_PROXY_DEFAULT_COMMAND.opensky, F.FLIGHT_PROXY_DEFAULT_COMMAND.adsblol,
        F.FLIGHT_PROXY_DEFAULT_COMMAND.local]).size === 3);
      eq('30a: NEG cloud/entity are still un-proxiable (no suggested name)',
        [F.FLIGHT_PROXY_DEFAULT_COMMAND.cloud, F.FLIGHT_PROXY_DEFAULT_COMMAND.entity]
          .filter(v => v !== undefined).length, 0);

      // ── (a2) which sources cannot work without Home Assistant at all ────
      // The gate for the offline `needs-ha` status. A SUPERSET of needsProxy:
      // `entity` calls no rest_command but reads HA states, which offline are
      // empty. `cloud` and `local` are plain browser fetches and must NOT be
      // suppressed — `local` is the one source that can genuinely serve a
      // Home-Assistant-less panel.
      ok('30a2: the proxied sources need Home Assistant',
        F.flightSourceNeedsHa('opensky') && F.flightSourceNeedsHa('adsblol'));
      ok('30a2: entity needs Home Assistant too (its states come from HA)',
        F.flightSourceNeedsHa('entity'));
      ok('30a2: NEG local does NOT need Home Assistant (direct receiver fetch)',
        !F.flightSourceNeedsHa('local'));
      ok('30a2: NEG cloud does NOT need Home Assistant (direct browser fetch)',
        !F.flightSourceNeedsHa('cloud'));
      ok('30a2: absent source needs Home Assistant (it resolves to opensky)',
        F.flightSourceNeedsHa(undefined));
      // It is a strict superset — never equal to, never narrower than, needsProxy.
      ok('30a2: needsHa is a strict SUPERSET of needsProxy',
        F.FLIGHT_SOURCES.every(s => !F.flightSourceNeedsProxy(s) || F.flightSourceNeedsHa(s))
        && F.FLIGHT_SOURCES.some(s => F.flightSourceNeedsHa(s) && !F.flightSourceNeedsProxy(s)),
        F.FLIGHT_SOURCES.map(s =>
          `${s}:${F.flightSourceNeedsProxy(s) ? 'P' : '-'}${F.flightSourceNeedsHa(s) ? 'H' : '-'}`).join(' '));
      // `demo` joined this set: it makes no request at all, so it is reachable
      // wherever a browser runs — see §31a for the rest of its gate contract.
      eq('30a2: exactly three sources are browser-reachable with no HA',
        F.FLIGHT_SOURCES.filter(s => !F.flightSourceNeedsHa(s)).sort().join(','),
        'cloud,demo,local');
      ok('30a2: NEG demo does NOT need Home Assistant (nothing is fetched)',
        !F.flightSourceNeedsHa('demo') && !F.flightSourceNeedsProxy('demo'));

      eq('30a: OpenSky default poll is 60 s (credit budget)',
        F.flightDefaultPollSeconds('opensky'), 60);
      eq('30a: adsblol keeps the 8 s default', F.flightDefaultPollSeconds('adsblol'), 8);
      eq('30a: cloud keeps the 8 s default', F.flightDefaultPollSeconds('cloud'), 8);
      eq('30a: absent source takes the OpenSky default', F.flightDefaultPollSeconds(undefined), 60);

      // ── (b) rest_command name sanitizer ─────────────────────────────────
      eq('30b: a plain name passes through',
        F.sanitizeFlightProxyCommand('diorama_opensky'), 'diorama_opensky');
      eq('30b: a pasted rest_command. prefix is stripped',
        F.sanitizeFlightProxyCommand('rest_command.diorama_opensky'), 'diorama_opensky');
      eq('30b: casing + spacing normalize',
        F.sanitizeFlightProxyCommand('  My Flights  '), 'myflights');
      eq('30b: blank clears to undefined', F.sanitizeFlightProxyCommand('   '), undefined);
      eq('30b: all-invalid clears to undefined', F.sanitizeFlightProxyCommand('!!!'), undefined);
      eq('30b: non-string clears to undefined', F.sanitizeFlightProxyCommand(42), undefined);
      // NEGATIVE CONTROL: the sanitizer must not silently invent the default.
      ok('30b: NEG an empty name does NOT become the suggested one',
        F.sanitizeFlightProxyCommand('') !== F.FLIGHT_PROXY_DEFAULT_COMMAND.opensky);

      // ── (c) OpenSky bounding box (point+radius → lat/lon BOX) ───────────
      const NMD = 1852 / (6371000 * Math.PI / 180);   // nm → degrees of LATITUDE
      const box = F.openSkyBoundingBox(40.7, -74.0, 15);
      near('30c: latitude half-span is the arc angle', box.lamax - 40.7, 15 * NMD, 1e-4);
      ok('30c: edges round OUTWARD, never inward',
        box.lamax - 40.7 >= 15 * NMD && 40.7 - box.lamin >= 15 * NMD);
      near('30c: box is latitude-symmetric', 40.7 - box.lamin, box.lamax - 40.7, 1e-4);
      // A point exactly `radius` due EAST must fall inside — this is what the
      // cos(lat) correction buys.
      const eastLon = -74.0 + (15 * NMD) / Math.cos(40.7 * Math.PI / 180);
      ok('30c: a point at the radius due east is inside the box',
        eastLon <= box.lomax + 1e-9, `${eastLon} <= ${box.lomax}`);
      ok('30c: a point at the radius due north is inside the box',
        40.7 + 15 * NMD <= box.lamax + 1e-9);
      // NEGATIVE CONTROL: the NAIVE box (no cos correction) would CLIP that
      // eastern point at this latitude — the correction is load-bearing.
      ok('30c: NEG a naive dLon===dLat box would clip the east point',
        eastLon > -74.0 + 15 * NMD + 1e-9);
      ok('30c: longitude span exceeds latitude span away from the equator',
        (box.lomax - box.lomin) > (box.lamax - box.lamin), `${box.lomax - box.lomin}`);

      const hi = F.openSkyBoundingBox(78, 15, 100);
      ok('30c: high latitude keeps a finite, widened box',
        isFinite(hi.lomin) && isFinite(hi.lomax)
        && (hi.lomax - hi.lomin) > (hi.lamax - hi.lamin) * 4, `${hi.lomax - hi.lomin}`);
      const eastHi = 15 + (100 * NMD) / Math.cos(78 * Math.PI / 180);
      ok('30c: the high-latitude east point is still contained', eastHi <= hi.lomax + 1e-9);

      const pole = F.openSkyBoundingBox(89.995, 10, 100);
      ok('30c: near the pole the box widens to the whole globe',
        pole.lomin === -180 && pole.lomax === 180, JSON.stringify(pole));
      ok('30c: latitude stays clamped to ±90', pole.lamax <= 90 && pole.lamin >= -90,
        JSON.stringify(pole));

      const anti = F.openSkyBoundingBox(0, 179.95, 50);
      ok('30c: an antimeridian-straddling box widens rather than clipping',
        anti.lomin === -180 && anti.lomax === 180, JSON.stringify(anti));
      const antiW = F.openSkyBoundingBox(0, -179.95, 50);
      ok('30c: the western antimeridian widens too',
        antiW.lomin === -180 && antiW.lomax === 180, JSON.stringify(antiW));

      const bad = F.openSkyBoundingBox(40.7, -74.0, NaN);
      near('30c: a garbage radius falls back to the default',
        bad.lamax - 40.7, F.FLIGHTS_DEFAULT_RADIUS_NM * NMD, 1e-4);
      ok('30c: garbage lat/lon never produces NaN',
        Object.values(F.openSkyBoundingBox(NaN, NaN, 15)).every(Number.isFinite));

      // ── (d) OpenSky /states/all normalizer, against the REAL capture ────
      const sky = F.normalizeOpenSkyStates(OPENSKY);
      const skyAirborne = OPENSKY.states.filter(r => r[8] !== true && (r[7] != null || r[13] != null));
      eq('30d: every airborne state becomes a point', sky.length, skyAirborne.length);
      eq('30d: the 30 on-ground states are dropped',
        OPENSKY.states.length - sky.length, 30);
      ok('30d: no point is on the ground by construction', sky.length > 0);

      const gjs = sky.find(fp => fp.hex === 'a6f28c');
      ok('30d: the sampled aircraft is present', !!gjs);
      eq('30d: callsign is TRIMMED of its padding', gjs.callsign, 'GJS4543');
      near('30d: latitude comes from index 6', gjs.lat, 40.6809, 1e-9);
      near('30d: longitude comes from index 5', gjs.lon, -74.1721, 1e-9);
      near('30d: baro altitude metres → feet', gjs.altFt, -45.72 / 0.3048, 1e-6);
      near('30d: velocity m/s → knots', gjs.gsKt, 66.04 * 3600 / 1852, 1e-6);
      near('30d: true_track passes through as degrees', gjs.trackDeg, 25.37, 1e-9);
      near('30d: vertical rate m/s → ft/min', gjs.vertRateFpm, -3.25 * 60 / 0.3048, 1e-6);
      eq('30d: squawk comes from index 14', gjs.squawk, '1327');
      near('30d: seen_pos derives from the payload clock',
        gjs.seenPosS, 1786809492 - 1786809356, 1e-9);
      // NEGATIVE CONTROL: an unconverted (metres) altitude would be a different
      // number entirely — the conversion is doing real work.
      ok('30d: NEG the altitude is NOT the raw metre value',
        Math.abs(gjs.altFt - (-45.72)) > 100, String(gjs.altFt));
      ok('30d: NEG the speed is NOT the raw m/s value',
        Math.abs(gjs.gsKt - 66.04) > 50, String(gjs.gsKt));
      ok('30d: hex is lowercased', sky.every(fp => fp.hex === fp.hex.toLowerCase()));
      ok('30d: /states/all carries no registry enrichment',
        sky.every(fp => fp.reg === null && fp.typeCode === null && fp.operator === null));
      ok('30d: and no dbFlags-derived flags',
        sky.every(fp => !fp.military && !fp.interesting && !fp.pia && !fp.ladd));

      // NEGATIVE CONTROL: the readsb normalizer cannot read this payload at all
      // — the dedicated positional-array path is genuinely required.
      eq('30d: NEG normalizeAircraftList cannot read OpenSky states',
        F.normalizeAircraftList(OPENSKY).length, 0);

      // Synthetic rows for the cases a single capture cannot contain.
      const skyRow = (over = {}) => {
        const r = ['abc123', 'TEST123 ', 'X', 1000, 1000, -74, 40.7,
                   3048, false, 100, 90, 5, null, 3100, '1200', false, 0];
        for (const [i, v] of Object.entries(over)) r[Number(i)] = v;
        return r;
      };
      const one = over => F.normalizeOpenSkyStates({ time: 1010, states: [skyRow(over)] });
      near('30d: a clean synthetic row converts 3048 m → 10000 ft',
        one()[0].altFt, 10000, 1e-6);
      eq('30d: a blank callsign becomes null', one({ 1: '   ' })[0].callsign, null);
      eq('30d: on_ground true drops the row', one({ 8: true }).length, 0);
      near('30d: a null baro altitude falls back to geometric',
        one({ 7: null })[0].altFt, 3100 / 0.3048, 1e-6);
      eq('30d: no altitude at all drops the row', one({ 7: null, 13: null }).length, 0);
      eq('30d: a null velocity stays null (never 0)', one({ 9: null })[0].gsKt, null);
      eq('30d: a null vertical rate stays null', one({ 11: null })[0].vertRateFpm, null);
      eq('30d: a null squawk stays null', one({ 14: null })[0].squawk, null);
      eq('30d: a null position drops the row', one({ 6: null }).length, 0);
      eq('30d: an out-of-range latitude drops the row', one({ 6: 120 }).length, 0);
      eq('30d: a blank icao24 drops the row', one({ 0: '  ' }).length, 0);
      // Category: OpenSky's numeric enum is the SAME table as DO-260B.
      eq('30d: category 8 maps to A7 (rotorcraft)',
        F.normalizeOpenSkyStates({ states: [[...skyRow(), 8]] })[0].category, 'A7');
      eq('30d: category 4 maps to A3', 
        F.normalizeOpenSkyStates({ states: [[...skyRow(), 4]] })[0].category, 'A3');
      eq('30d: category 0 (no information) stays null',
        F.normalizeOpenSkyStates({ states: [[...skyRow(), 0]] })[0].category, null);
      eq('30d: category 17 (surface service vehicle) is DROPPED as non-aircraft',
        F.normalizeOpenSkyStates({ states: [[...skyRow(), 17]] }).length, 0);
      eq('30d: category 11 (parachutist) is DROPPED as non-aircraft',
        F.normalizeOpenSkyStates({ states: [[...skyRow(), 11]] }).length, 0);
      // NEGATIVE CONTROL for the drop pair: the same row without a category is kept.
      eq('30d: NEG the same row with no category is kept', one().length, 1);

      // Never throws (the mqtt-ws discipline).
      const skyGarbage = [null, undefined, 0, '', 'nope', [], {}, { states: null },
        { states: 'x' }, { states: [null, 1, 'x', [], [1, 2, 3]] }, GARBAGE, LOCAL];
      let threw = null;
      for (const g of skyGarbage) {
        try {
          const r = F.normalizeOpenSkyStates(g);
          if (!Array.isArray(r) || r.length !== 0) threw = `non-empty for ${JSON.stringify(g)}`;
        } catch (e) { threw = String(e); }
      }
      ok('30d: garbage payloads return [] and never throw', threw === null, threw ?? '');

      // ── (e) adsb.lol reuses the EXISTING readsb normalizer ──────────────
      const lol = F.normalizeAircraftList(ADSBLOL);
      const lolKept = ADSBLOL.ac.filter(a => a.alt_baro !== 'ground'
        && !(a.category || '').startsWith('C') && a.category !== 'B3');
      eq('30e: the {ac:[...]} envelope normalizes unchanged', lol.length, lolKept.length);
      ok('30e: the ground sentinel is still dropped',
        !lol.some(fp => ADSBLOL.ac.find(a => a.hex === fp.hex)?.alt_baro === 'ground'));
      ok('30e: the C2 surface vehicles are still dropped',
        !lol.some(fp => fp.hex === '4846d4' || fp.hex === '4481c9'));
      ok('30e: dbFlags bit 1 still reads as military',
        lol.find(fp => fp.hex === '43c396')?.military === true);
      ok('30e: dbFlags bit 8 still reads as LADD',
        lol.find(fp => fp.hex === '40212d')?.ladd === true);
      ok('30e: an ultralight (B4) is NOT mistaken for a non-aircraft',
        lol.some(fp => fp.hex === '407be7'));
      ok('30e: the source dst is carried into distNm',
        lol.every(fp => Number.isFinite(fp.distNm)));
      ok('30e: registry enrichment survives (reg + type)',
        lol.filter(fp => fp.reg && fp.typeCode).length >= 6,
        String(lol.filter(fp => fp.reg && fp.typeCode).length));
      eq('30e: "none" emergency is still collapsed to null',
        lol.filter(fp => fp.emergency !== null).length, 0);

      // The dispatcher: one call site, right normalizer each time.
      eq('30e: normalizeFlightPayload routes adsblol to the readsb path',
        F.normalizeFlightPayload('adsblol', ADSBLOL).length, lol.length);
      eq('30e: … and cloud/local/entity too',
        F.normalizeFlightPayload('cloud', LAX).length, F.normalizeAircraftList(LAX).length);
      eq('30e: … and opensky to the states path',
        F.normalizeFlightPayload('opensky', OPENSKY).length, sky.length);
      // NEGATIVE CONTROL: the dispatch is real, not a no-op — crossing the
      // payloads over yields nothing.
      eq('30e: NEG opensky dispatch on an adsb.lol payload yields []',
        F.normalizeFlightPayload('opensky', ADSBLOL).length, 0);
      eq('30e: NEG adsblol dispatch on an OpenSky payload yields []',
        F.normalizeFlightPayload('adsblol', OPENSKY).length, 0);

      // ── (f) rest_command response unwrapping ────────────────────────────
      const U = F.unwrapRestCommandPayload;
      eq('30f: {context,response:{status,content}} peels to the body',
        JSON.stringify(U({ context: {}, response: { status: 200, content: { ac: [1] } } })),
        JSON.stringify({ ac: [1] }));
      eq('30f: a bare {status,content} peels',
        JSON.stringify(U({ status: 200, content: { ac: [] } })), JSON.stringify({ ac: [] }));
      eq('30f: a JSON STRING content is parsed',
        JSON.stringify(U({ status: 200, content: '{"ac":[{"hex":"a"}]}' })),
        JSON.stringify({ ac: [{ hex: 'a' }] }));
      eq('30f: an already-peeled payload passes through',
        JSON.stringify(U({ ac: [] })), JSON.stringify({ ac: [] }));
      eq('30f: an array payload passes through', JSON.stringify(U([1, 2])), JSON.stringify([1, 2]));
      eq('30f: unparseable text → null', U({ status: 200, content: '<html>502</html>' }), null);
      eq('30f: null → null', U(null), null);
      eq('30f: undefined → null', U(undefined), null);
      ok('30f: a deep envelope terminates rather than looping', (() => {
        const deep = { response: { response: { response: { response: { response: { ac: [] } } } } } };
        try { U(deep); return true; } catch { return false; }
      })());

      // ── (g) attribution follows the SOURCE ──────────────────────────────
      eq('30g: opensky credits the OpenSky Network',
        F.flightAttribution('opensky').name, '© The OpenSky Network');
      eq('30g: opensky links to opensky-network.org',
        F.flightAttribution('opensky').url, 'https://opensky-network.org');
      eq('30g: adsblol credits adsb.lol', F.flightAttribution('adsblol').name, '© adsb.lol');
      eq('30g: adsblol links to adsb.lol', F.flightAttribution('adsblol').url, 'https://adsb.lol');
      eq('30g: cloud still credits airplanes.live',
        F.flightAttribution('cloud').name, '© airplanes.live');
      eq('30g: a local receiver has nobody to credit', F.flightAttribution('local'), null);
      eq('30g: an HA entity has nobody to credit', F.flightAttribution('entity'), null);
      eq('30g: absent source credits the default provider',
        F.flightAttribution(undefined).name, '© The OpenSky Network');
      // NEGATIVE CONTROL: the three credited sources are genuinely distinct.
      ok('30g: NEG the three provider credits differ', new Set([
        F.flightAttribution('opensky').name, F.flightAttribution('adsblol').name,
        F.flightAttribution('cloud').name]).size === 3);

      // ── (h) generated rest_command YAML ─────────────────────────────────
      const ORIGIN = { lat: 40.7, lon: -74.0 };
      const yOpen = F.flightProxyYaml('opensky', undefined, ORIGIN, 15);
      ok('30h: opensky YAML declares rest_command:', yOpen.includes('rest_command:'));
      ok('30h: opensky YAML uses the suggested service name by default',
        yOpen.includes('  diorama_opensky:'), F.FLIGHT_PROXY_DEFAULT_COMMAND.opensky);
      ok('30h: opensky YAML templates the whole bounding box',
        ['{{ lamin }}', '{{ lomin }}', '{{ lamax }}', '{{ lomax }}'].every(t => yOpen.includes(t)));
      ok('30h: opensky YAML is a GET with a timeout',
        yOpen.includes('method: GET') && yOpen.includes('timeout:'));
      ok('30h: opensky YAML comments the optional credentials',
        yOpen.includes('# username: !secret') && yOpen.includes('# password: !secret')
        && yOpen.includes('Authorization'));
      ok('30h: opensky YAML previews the CURRENT request',
        yOpen.includes(F.flightProxyUrlPreview('opensky', 40.7, -74.0, 15)));
      ok('30h: the previewed URL carries the real box numbers',
        yOpen.includes(`lamin=${box.lamin}`) && yOpen.includes(`lomax=${box.lomax}`));
      // NEGATIVE CONTROL: the two providers' YAML never cross-contaminates.
      ok('30h: NEG opensky YAML never mentions adsb.lol', !yOpen.includes('adsb.lol'));

      const yLol = F.flightProxyYaml('adsblol', 'rest_command.My Feed', ORIGIN, 25);
      ok('30h: adsblol YAML templates lat/lon/dist',
        yLol.includes('{{ lat }}') && yLol.includes('{{ lon }}') && yLol.includes('{{ dist }}'));
      ok('30h: adsblol YAML targets the adsb.lol v2 endpoint',
        yLol.includes('https://api.adsb.lol/v2/lat/'));
      ok('30h: a pasted/odd service name is sanitized INTO the YAML',
        yLol.includes('  myfeed:'), yLol.split('\n').find(l => l.trim().endsWith(':')));
      ok('30h: NEG adsblol YAML never mentions opensky', !yLol.includes('opensky'));
      const yNoOrigin = F.flightProxyYaml('opensky', 'x', null, 15);
      ok('30h: with no origin the preview says so instead of faking coordinates',
        yNoOrigin.includes('calibrate a GPS landmark') && !yNoOrigin.includes('lamin=0'));

      // ── (h2) local receiver YAML (optional HA proxy) ────────────────────
      // No coordinates are involved: the URL is the user's own LAN address, so
      // the block is STATIC and must contain no Jinja at all.
      const LURL = 'http://192.168.1.50/tar1090/data/aircraft.json';
      const yLoc = F.flightProxyYaml('local', undefined, ORIGIN, 15, LURL);
      ok('30h2: local YAML declares rest_command:', yLoc.includes('rest_command:'));
      ok('30h2: local YAML uses the suggested service name by default',
        yLoc.includes('  diorama_local_adsb:'), yLoc.split('\n').find(l => l.trim().endsWith(':')));
      ok('30h2: local YAML carries the receiver URL verbatim',
        yLoc.includes(`url: ${LURL}`), yLoc.split('\n').find(l => l.includes('url:')));
      ok('30h2: local YAML is a GET with a timeout',
        yLoc.includes('method: GET') && yLoc.includes('timeout: 10'));
      // NEGATIVE CONTROLS: this block is static and self-contained.
      ok('30h2: NEG local YAML contains NO Jinja template at all',
        !yLoc.includes('{{'), yLoc);
      ok('30h2: NEG local YAML never mentions a third-party provider',
        !yLoc.includes('opensky') && !yLoc.includes('adsb.lol')
        && !yLoc.includes('airplanes.live'));
      ok('30h2: local YAML states HA must reach the receiver',
        /home assistant/i.test(yLoc) && /reach/i.test(yLoc));
      // A sanitized name reaches the local block too.
      ok('30h2: a pasted/odd service name is sanitized INTO the local YAML',
        F.flightProxyYaml('local', 'rest_command.My Pi ', null, 15, LURL).includes('  mypi:'));
      // With no receiver URL yet, emit a MARKED placeholder — never a line that
      // looks pasteable but would silently fetch nothing.
      const yLocNone = F.flightProxyYaml('local', undefined, ORIGIN, 15);
      ok('30h2: no receiver URL → a clearly-marked placeholder',
        yLocNone.includes('#') && /SET THE RECEIVER URL/i.test(yLocNone),
        yLocNone.split('\n').find(l => l.includes('url:')));
      ok('30h2: NEG the placeholder never invents a URL',
        !yLocNone.includes('http://') && !yLocNone.includes('https://'));
      ok('30h2: a whitespace-only URL is treated as absent',
