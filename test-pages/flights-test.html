        F.flightProxyYaml('local', undefined, ORIGIN, 15, '   ') === yLocNone);
      ok('30h2: a URL with surrounding whitespace is trimmed into the block',
        F.flightProxyYaml('local', undefined, ORIGIN, 15, `  ${LURL}  `) === yLoc);
      // STALE-CALLER IDIOM: the trailing localUrl argument must leave every
      // other source byte-identical, present or absent.
      ok('30h2: the trailing localUrl leaves opensky YAML byte-identical',
        F.flightProxyYaml('opensky', undefined, ORIGIN, 15, LURL) === yOpen);
      ok('30h2: … and adsblol YAML byte-identical',
        F.flightProxyYaml('adsblol', 'rest_command.My Feed', ORIGIN, 25, LURL) === yLol);
      // NEGATIVE CONTROL: the local block is genuinely different from the
      // others — this is not an accidental fall-through to the adsb.lol branch.
      ok('30h2: NEG local YAML differs from the adsblol block',
        yLoc !== F.flightProxyYaml('adsblol', 'diorama_local_adsb', ORIGIN, 15));

      // Attribution is a property of WHO OWNS THE DATA, not of the transport:
      // proxying your own receiver through HA still credits nobody.
      eq('30h2: proxying local changes nothing about attribution',
        F.flightAttribution('local'), null);

      // ── (i) the service data the poll actually sends ────────────────────
      const vOpen = F.flightProxyVars('opensky', 40.7, -74.0, 15);
      eq('30i: opensky vars are exactly the four box edges',
        Object.keys(vOpen).sort().join(','), 'lamax,lamin,lomax,lomin');
      ok('30i: opensky vars ARE the bounding box',
        JSON.stringify(vOpen) === JSON.stringify(box));
      const vLol = F.flightProxyVars('adsblol', 40.712345678, -74.098765, 15.6);
      eq('30i: adsblol vars are lat/lon/dist',
        Object.keys(vLol).sort().join(','), 'dist,lat,lon');
      eq('30i: adsblol rounds the point to 4 dp', vLol.lat, 40.7123);
      eq('30i: adsblol rounds the radius to whole nm', vLol.dist, 16);
      ok('30i: the previewed URL is built from those same vars',
        F.flightProxyUrlPreview('adsblol', 40.712345678, -74.098765, 15.6)
          === `https://api.adsb.lol/v2/lat/${vLol.lat}/lon/${vLol.lon}/dist/${vLol.dist}`);
      // A proxied local receiver takes NO variables — the address is baked into
      // the user's own YAML, so sending coordinates HA ignores would only let
      // the generated block and the actual call drift apart.
      const vLoc = F.flightProxyVars('local', 40.7, -74.0, 15);
      eq('30i: local vars are empty', Object.keys(vLoc).length, 0, JSON.stringify(vLoc));
      // NEGATIVE CONTROL: local must NOT fall through to the point+radius shape.
      ok('30i: NEG local does not emit lat/lon/dist',
        vLoc.lat === undefined && vLoc.lon === undefined && vLoc.dist === undefined);
      ok('30i: NEG local does not emit a bounding box', vLoc.lamin === undefined);
      ok('30i: local vars stay empty for any coordinates',
        Object.keys(F.flightProxyVars('local', NaN, NaN, NaN)).length === 0);
      // The other sources are untouched by that early return.
      ok('30i: NEG cloud/entity still take the point+radius shape',
        Object.keys(F.flightProxyVars('cloud', 40.7, -74, 15)).sort().join(',') === 'dist,lat,lon'
        && Object.keys(F.flightProxyVars('entity', 40.7, -74, 15)).sort().join(',') === 'dist,lat,lon');
    }

    // ── 31. The `demo` source — synthetic, deterministic, network-free ──────
    // Mirrors weather.ts's `demo` source: the caller supplies the epoch, the
    // module never reads the clock and never calls Math.random, so the same
    // `nowMs` always yields byte-identical output. The fleet doubles as a live
    // fixture for the whole flight subsystem, so most of this section is
    // COVERAGE: each aircraft is asserted to reach the render path it exists for.
    {
      // Local helper — this page's shared vocabulary is ok()/near() only.
      const eq = (name, got, want, extra = '') =>
        ok(name, got === want, extra || `got ${JSON.stringify(got)} want ${JSON.stringify(want)}`);
      const AL = await import('./airlines.mod.js' + V);
      const O = F.DEMO_FLIGHT_ORIGIN;
      const R = F.FLIGHTS_DEFAULT_RADIUS_NM;
      const T0 = 1755300000000;
      const gen = (t = T0, r = R, cfg) => F.demoFlightPoints(t, O, r, cfg);
      const fleet = gen();
      const distOf = (fp, o = O) => F.flightBearingDistance(o.lat, o.lon, fp.lat, fp.lon).distNm;
      const bearingOf = (fp, o = O) =>
        F.flightBearingDistance(o.lat, o.lon, fp.lat, fp.lon).bearingRad * 180 / Math.PI;

      // ── 31a. Source registration + the two "cannot work here" gates ───────
      ok('31a: demo is a real source', F.FLIGHT_SOURCES.includes('demo'));
      ok('31a: it resolves to itself', F.resolveFlightSource('demo') === 'demo');
      // THE load-bearing pair. `demo` needs no HA and no proxy — that is the
      // entire reason it can serve the hosted demo and an offline panel.
      ok('31a: demo needs NO rest_command proxy', F.flightSourceNeedsProxy('demo') === false);
      ok('31a: demo needs NO Home Assistant', F.flightSourceNeedsHa('demo') === false);
      // NEGATIVE CONTROLS: the gates are not simply broken for everything.
      ok('31a: NEG opensky still needs the proxy', F.flightSourceNeedsProxy('opensky') === true);
      ok('31a: NEG adsblol still needs the proxy', F.flightSourceNeedsProxy('adsblol') === true);
      ok('31a: NEG entity still needs Home Assistant', F.flightSourceNeedsHa('entity') === true);
      ok('31a: NEG local still needs neither', F.flightSourceNeedsHa('local') === false);
      // Nobody to credit for invented data — crediting anyone would be a lie.
      ok('31a: demo credits nobody', F.flightAttribution('demo') === null);
      ok('31a: NEG opensky still credits OpenSky',
        (F.flightAttribution('opensky')?.name ?? '').includes('OpenSky'));

      // ── 31b. Determinism (the house rule) ────────────────────────────────
      const j1 = JSON.stringify(gen(T0));
      const j2 = JSON.stringify(gen(T0));
      ok('31b: the same epoch yields byte-identical output', j1 === j2);
      ok('31b: NEG a different epoch really does differ', JSON.stringify(gen(T0 + 90000)) !== j1);
      // A second, INDEPENDENT determinism probe: a Math.random slipped anywhere
      // in the builder would survive the string compare above only if it were
      // cached, so re-derive across a spread of epochs.
      let detOk = true;
      for (const dt of [0, 1, 999, 60000, 3600000, 86400000]) {
        if (JSON.stringify(gen(T0 + dt)) !== JSON.stringify(gen(T0 + dt))) detOk = false;
      }
      ok('31b: … at every epoch sampled', detOk);
      ok('31b: no Math.random or Date in the generated values',
        gen().every(fp => Object.values(fp).every(
          v => v === null || typeof v === 'string' || typeof v === 'boolean' || isFinite(v))));

      // ── 31c. Fleet size + the clamp ──────────────────────────────────────
      eq('31c: the default fleet is the whole roster', fleet.length, F.DEMO_FLEET_MAX);
      eq('31c: default === max (every row exists to cover a path)',
        F.DEMO_FLEET_DEFAULT, F.DEMO_FLEET_MAX);
      eq('31c: an explicit fleet slices from the front', gen(T0, R, { fleet: 5 }).length, 5);
      eq('31c: … from the FRONT (same first hex)', gen(T0, R, { fleet: 5 })[0].hex, fleet[0].hex);
      eq('31c: zero clamps up to one', gen(T0, R, { fleet: 0 }).length, 1);
      eq('31c: negative clamps up to one', gen(T0, R, { fleet: -9 }).length, 1);
      eq('31c: over-large clamps to the roster', gen(T0, R, { fleet: 9999 }).length, F.DEMO_FLEET_MAX);
      eq('31c: a non-numeric fleet falls back to the default',
        gen(T0, R, { fleet: 'lots' }).length, F.DEMO_FLEET_DEFAULT);
      eq('31c: a fractional fleet rounds', gen(T0, R, { fleet: 4.6 }).length, 5);

      // ── 31d. Positions round-trip, and are RADIUS-RELATIVE ───────────────
      // Every position is placed as (bearing, distance) through the exact
      // inverse of `flightBearingDistance`, so `_applyFlights` recomputing the
      // distance must give back what was intended — the radius filter depends
      // on it. Distances are FRACTIONS of the configured radius, which is what
      // keeps both the shell-compression spread and the out-of-range pair
      // meaningful at ANY radius setting.
      const fracsAt = r => gen(T0, r).map(fp => +(distOf(fp) / r).toFixed(6));
      const f15 = fracsAt(15);
      ok('31d: distance fractions are identical at radius 5',
        JSON.stringify(fracsAt(5)) === JSON.stringify(f15));
      ok('31d: … and at radius 100',
        JSON.stringify(fracsAt(100)) === JSON.stringify(f15));
      ok('31d: … and at the 5..100 extremes they are a real spread, not one value',
        new Set(f15).size >= 10, `distinct=${new Set(f15).size}`);
      // NEGATIVE CONTROL: the ABSOLUTE distances are of course NOT equal — the
      // fractions being equal is a real invariant, not a vacuous one.
      ok('31d: NEG absolute distances do scale with the radius',
        Math.abs(distOf(gen(T0, 100)[0]) - distOf(gen(T0, 5)[0])) > 1);
      ok('31d: an origin far from the default round-trips too',
        gen(T0, R).every((fp, i) => {
          const alt = { lat: -33.87, lon: 151.21 };
          const p = F.demoFlightPoints(T0, alt, R)[i];
          return Math.abs(distOf(p, alt) - distOf(fp)) < 1e-6;
        }));

      // ── 31e. Out-of-range traffic is GENERATED (so the filter has work) ───
      const outside = fleet.filter(fp => distOf(fp) > R);
      eq('31e: exactly two aircraft are generated outside the radius', outside.length, 2);
      ok('31e: … and they are outside at every radius setting',
        [5, 15, 40, 100].every(r => gen(T0, r).filter(fp => distOf(fp) / r > 1).length === 2));
      ok('31e: … and are still generated for a modest fleet',
        gen(T0, R, { fleet: 8 }).some(fp => distOf(fp) > R));
      ok('31e: NEG most of the fleet IS inside the radius',
        fleet.length - outside.length >= 10);

      // ── 31f. gs / track / vertRate are DERIVED from the drawn path ────────
      // The renderer dead-reckons from `gs` + `track` between polls. If those
      // were declared independently of the position they would fight the next
      // fix; deriving them by central difference makes them the true tangent.
      let worstTangent = 0, worstReckon = 0;
      const NMM = 1852, DEGR = Math.PI / 180, ERM = 6371000;
      const later = gen(T0 + 8000);
      for (let i = 0; i < fleet.length; i++) {
        const fp = fleet[i];
        // Tangent: the track must be 90° from the position bearing (either
        // sense — the roster deliberately mixes orbit directions).
        const d = ((fp.trackDeg - bearingOf(fp)) % 360 + 360) % 360;
        worstTangent = Math.max(worstTangent, Math.min(Math.abs(d - 90), Math.abs(d - 270)));
        // Reckoning: advance along `track` at `gs` for 8 s and land on the
        // position the generator itself reports 8 s later.
        const dist = fp.gsKt * (8 / 3600) * NMM;
        const br = fp.trackDeg * DEGR;
        const plat = fp.lat + dist * Math.cos(br) / (ERM * DEGR);
        const plon = fp.lon + dist * Math.sin(br) / (ERM * DEGR * Math.cos(fp.lat * DEGR));
        worstReckon = Math.max(worstReckon,
          F.flightBearingDistance(plat, plon, later[i].lat, later[i].lon).distNm);
      }
      // 5° covers the ONE aircraft with a radial component (member 8); the rest
      // are exactly tangential.
      ok('31f: track is the true tangent of the flown path', worstTangent < 5,
        `worst=${worstTangent.toFixed(2)}°`);
      ok('31f: dead reckoning over a poll interval lands on the next fix',
        worstReckon < 0.1, `worst=${worstReckon.toFixed(4)} nm`);
      ok('31f: every ground speed is positive and finite',
        fleet.every(fp => isFinite(fp.gsKt) && fp.gsKt > 0));
      ok('31f: every track is in [0,360)',
        fleet.every(fp => fp.trackDeg >= 0 && fp.trackDeg < 360));
      ok('31f: a climbing/descending aircraft reports a real vertical rate',
        fleet.some(fp => Math.abs(fp.vertRateFpm) > 100));
      ok('31f: a level aircraft reports zero', fleet.some(fp => fp.vertRateFpm === 0));

      // ── 31g. The circuits never empty the sky ────────────────────────────
      // "Watchable indefinitely": over a long sweep every aircraft must keep
      // moving AND stay on its circuit rather than flying away.
      {
        const dmin = new Array(fleet.length).fill(Infinity);
        const dmax = new Array(fleet.length).fill(0);
        const quads = fleet.map(() => new Set());
        for (let s = 0; s <= 7200; s += 30) {
          const snap = gen(T0 + s * 1000);
          for (let i = 0; i < snap.length; i++) {
            const dd = distOf(snap[i]);
            dmin[i] = Math.min(dmin[i], dd); dmax[i] = Math.max(dmax[i], dd);
            quads[i].add(Math.floor(bearingOf(snap[i]) / 90));
          }
        }
        ok('31g: no aircraft ever leaves its circuit', dmax.every((d, i) => d / dmin[i] < 3),
          dmax.map((d, i) => (d / dmin[i]).toFixed(2)).join(','));
        ok('31g: every aircraft circulates through all four quadrants',
          quads.every(q => q.size === 4), quads.map(q => q.size).join(','));
        ok('31g: … and the fleet is intact two hours later',
          gen(T0 + 7200000).length === fleet.length);
      }

      // ── 31h. Coverage: archetypes, bands, liveries, beacons, privacy ──────
      const archOf = fp => AT.aircraftArchetype(fp.typeCode, fp.category);
      const arch = new Set(fleet.map(archOf));
      eq('31h: all EIGHT aircraft archetypes are represented', arch.size, 8,
        [...arch].sort().join(','));
      const bands = new Set(fleet.map(fp => F.flightPointSpeedBand(fp)));
      eq('31h: all FIVE speed bands are represented', bands.size, 5,
        [...bands].sort().join(','));
      // Real airline ICAO prefixes → real liveries.
      const carriers = fleet.map(fp => AL.airlineForCallsign(fp.callsign)).filter(Boolean);
      ok('31h: at least six aircraft resolve to a known airline', carriers.length >= 6,
        `n=${carriers.length}`);
      const livCount = fleet.filter(fp => {
        const a = archOf(fp);
        return !!AL.resolveAirlineLivery(AL.airlineForCallsign(fp.callsign), {
          enabled: true, military: fp.military, skin: !!F.militarySkinFor(fp, a),
          suppress: F.flightIdentitySuppressed(fp, true),
        });
      }).length;
      ok('31h: at least five carry painted livery colours', livCount >= 5, `n=${livCount}`);
      // …and the vetoes really bite: a regional's livery is its partner's, so
      // it deliberately carries none.
      ok('31h: a REGIONAL carrier is deliberately colourless',
        fleet.some(fp => {
          const info = AL.airlineForCallsign(fp.callsign);
          return info?.kind === 'regional' && !AL.resolveAirlineLivery(info, { enabled: true });
        }));
      // Military: one with a SKIN, one deliberately without — the negative
      // control for skin resolution, flying in the same fleet.
      const skinned = fleet.filter(fp => F.militarySkinFor(fp, archOf(fp)));
      const mil = fleet.filter(fp => fp.military);
      eq('31h: exactly one aircraft resolves a military skin', skinned.length, 1,
        skinned.map(fp => fp.callsign).join(','));
      eq('31h: … which is the f16', F.militarySkinFor(skinned[0], archOf(skinned[0])), 'f16');
      ok('31h: two aircraft carry the military flag', mil.length === 2, `n=${mil.length}`);
      ok('31h: NEG the other military aircraft resolves NO skin',
        mil.filter(fp => !F.militarySkinFor(fp, archOf(fp))).length === 1);
      ok('31h: … and carries a recognised military callsign word',
        mil.some(fp => AL.militaryCallsignInfo(fp.callsign)?.word === 'REACH'));
      ok('31h: both military hexes trip the US-military heuristic',
        mil.every(fp => AL.usMilitaryHexHeuristic(fp.hex)));
      ok('31h: NEG no civil aircraft trips it',
        fleet.filter(fp => !fp.military).every(fp => !AL.usMilitaryHexHeuristic(fp.hex)));
      // Privacy: PIA suppresses identity, LADD keeps it — the documented asymmetry.
      const pia = fleet.filter(fp => fp.pia), ladd = fleet.filter(fp => fp.ladd);
      eq('31h: exactly one PIA aircraft', pia.length, 1);
      eq('31h: exactly one LADD aircraft', ladd.length, 1);
      ok('31h: PIA identity is suppressed', F.flightIdentitySuppressed(pia[0], true) === true);
      ok('31h: LADD identity is KEPT', F.flightIdentitySuppressed(ladd[0], true) === false);
      ok('31h: both are privacy-dimmed',
        F.flightPrivacyDimmed(pia[0], true) && F.flightPrivacyDimmed(ladd[0], true));
      // Beacon ladder: all four default tiers are present in one fleet.
      const glow = fleet.map(fp => F.resolveFlightGlow(fp, undefined, true)).filter(Boolean);
      const glowColors = new Set(glow.map(g => g.colorA));
      eq('31h: all four default beacon tiers light up at once', glowColors.size, 4,
        [...glowColors].join(','));
      ok('31h: … including the emergency red',
        glowColors.has(F.FLIGHT_DEFAULT_BEACON.emergency));
      // The towed-banner path needs a PISTON archetype WITH a callsign.
      ok('31h: at least one piston tows a banner',
        fleet.some(fp => (archOf(fp) === 'ga-high' || archOf(fp) === 'ga-low') && !!fp.callsign));
      // One emergency, and it is the squawk path (not the `emergency` enum).
      const emerg = fleet.filter(fp => F.isEmergency(fp));
      eq('31h: exactly one emergency aircraft', emerg.length, 1);
      eq('31h: … squawking 7700', F.emergencySquawk(emerg[0]), '7700');

      // ── 31i. Field hygiene ───────────────────────────────────────────────
      ok('31i: hexes are unique', new Set(fleet.map(fp => fp.hex)).size === fleet.length);
      ok('31i: hexes are lowercase 6-digit ICAO addresses',
        fleet.every(fp => /^[0-9a-f]{6}$/.test(fp.hex)));
      ok('31i: every type designator is one the archetype table knows',
        fleet.every(fp => AT.TYPE_ARCHETYPE[fp.typeCode] !== undefined),
        fleet.filter(fp => AT.TYPE_ARCHETYPE[fp.typeCode] === undefined)
             .map(fp => fp.typeCode).join(','));
      ok('31i: no surface-vehicle categories (which the normalizer would drop)',
        fleet.every(fp => !/^C/.test(fp.category ?? '') && fp.category !== 'B3'));
      ok('31i: altitudes are airborne and finite',
        fleet.every(fp => isFinite(fp.altFt) && fp.altFt > 0));
      ok('31i: distNm is deliberately UNSET (the planner owns it)',
        fleet.every(fp => fp.distNm === undefined));
      ok('31i: the shape matches a normalized aircraft exactly',
        (() => {
          const want = Object.keys(F.normalizeAircraftList(
            [{ hex: 'abc123', lat: 1, lon: 2, alt_baro: 100 }])[0]).sort().join(',');
          return Object.keys(fleet[0]).sort().join(',') === want;
        })());

      // ── 31j. The emergency opt-out ───────────────────────────────────────
      const quiet = gen(T0, R, { emergency: false });
      eq('31j: opting out removes exactly one aircraft', quiet.length, fleet.length - 1);
      ok('31j: … the emergency one', !quiet.some(fp => F.isEmergency(fp)));
      ok('31j: … and changes nothing else',
        JSON.stringify(quiet)
          === JSON.stringify(fleet.filter(fp => !F.isEmergency(fp))));
      ok('31j: NEG an explicit true keeps it',
        gen(T0, R, { emergency: true }).some(fp => F.isEmergency(fp)));

      // ── 31k. The arrangement seed ────────────────────────────────────────
      const s0 = gen(T0), sA = gen(T0, R, { seed: 7 }), sB = gen(T0, R, { seed: 7 });
      ok('31k: a seed is reproducible', JSON.stringify(sA) === JSON.stringify(sB));
      ok('31k: … and really rearranges the sky', JSON.stringify(sA) !== JSON.stringify(s0));
      ok('31k: NEG a zero seed is the base arrangement',
        JSON.stringify(gen(T0, R, { seed: 0 })) === JSON.stringify(s0));
      ok('31k: the CAST is unchanged by a seed',
        sA.map(fp => fp.hex).join(',') === s0.map(fp => fp.hex).join(','));
      ok('31k: a different seed gives a different arrangement',
        JSON.stringify(gen(T0, R, { seed: 8 })) !== JSON.stringify(sA));

      // ── 31l. Origin resolution ───────────────────────────────────────────
      const dOrigin = F.demoFlightsOrigin;
      ok('31l: absent config → the synthetic default',
        dOrigin().lat === O.lat && dOrigin().lon === O.lon);
      ok('31l: a complete valid pair is used',
        dOrigin({ lat: -33.87, lon: 151.21 }).lat === -33.87);
      ok('31l: half a pair falls back', dOrigin({ lat: 10 }).lat === O.lat);
      ok('31l: an out-of-range latitude falls back',
        dOrigin({ lat: 120, lon: 5 }).lat === O.lat);
      ok('31l: a non-numeric pair falls back',
        dOrigin({ lat: 'x', lon: 'y' }).lat === O.lat);

      // ── 31m. `sanitizeDemoFlights` ───────────────────────────────────────
      const sd = F.sanitizeDemoFlights;
      ok('31m: a non-object is undefined', sd(null) === undefined && sd(7) === undefined
        && sd([1]) === undefined);
      ok('31m: an empty object is undefined', sd({}) === undefined);
      eq('31m: fleet clamps low', sd({ fleet: -3 }).fleet, 1);
      ok('31m: fleet at the default collapses the block',
        sd({ fleet: F.DEMO_FLEET_DEFAULT }) === undefined);
      ok('31m: a NaN fleet is dropped', sd({ fleet: NaN }) === undefined);
      eq('31m: a seed is truncated', sd({ seed: 4.9 }).seed, 4);
      ok('31m: a zero seed is dropped', sd({ seed: 0 }) === undefined);
      ok('31m: an incomplete coordinate is dropped', sd({ lon: 5 }) === undefined);
      eq('31m: a complete coordinate survives', sd({ lat: 1, lon: 2 }).lon, 2);
      ok('31m: an explicit emergency:true normalizes away', sd({ emergency: true }) === undefined);
      ok('31m: emergency:false is meaningful and stays', sd({ emergency: false }).emergency === false);

      // ── 31n. Never throws on garbage ─────────────────────────────────────
      for (const [name, call] of [
        ['NaN epoch', () => F.demoFlightPoints(NaN, O, R)],
        ['null origin', () => F.demoFlightPoints(T0, null, R)],
        ['garbage origin', () => F.demoFlightPoints(T0, { lat: 'x', lon: null }, R)],
        ['zero radius', () => F.demoFlightPoints(T0, O, 0)],
        ['negative radius', () => F.demoFlightPoints(T0, O, -40)],
        ['NaN radius', () => F.demoFlightPoints(T0, O, NaN)],
        ['garbage config', () => F.demoFlightPoints(T0, O, R, 'nope')],
        ['polar origin', () => F.demoFlightPoints(T0, { lat: 90, lon: 0 }, R)],
      ]) {
        let got = null, threw = false;
        try { got = call(); } catch { threw = true; }
        ok(`31n: ${name} does not throw`, !threw);
        ok(`31n: ${name} still yields finite aircraft`,
          Array.isArray(got) && got.length > 0
            && got.every(fp => isFinite(fp.lat) && isFinite(fp.lon) && isFinite(fp.altFt)));
      }

      // ── 31o. The hosted-demo envelope seeder ─────────────────────────────
      // src/demo-seed.ts pipes every committed floorplan envelope through this
      // on its way into the published demo. The committed plans are GENERATED
      // and carry no `flights` block, so without it the showcase sky is empty.
      {
        const we = F.withDemoFlightsEnvelope;
        const store = () => ({ v: 2, floors: [{ id: 'f1', name: 'A', w: 1, d: 1 }],
                               currentFloorId: 'f1' });
        // The real shape: a v2 export envelope.
        const env = JSON.parse(we(JSON.stringify({ diorama: 2, name: 'Home', store: store() })));
        eq('31o: flights are enabled in the seeded envelope', env.store.flights?.enabled, true);
        eq('31o: … on the synthetic source', env.store.flights?.source, 'demo');
        ok('31o: … with a reduced fleet for a visitor device',
          env.store.flights?.demo?.fleet > 0
            && env.store.flights?.demo?.fleet < F.DEMO_FLEET_MAX,
          JSON.stringify(env.store.flights?.demo));
        ok('31o: the seeded config survives the planner sanitizer',
          env.store.flights?.demo !== undefined
            && F.sanitizeDemoFlights(env.store.flights.demo)?.fleet
                 === env.store.flights.demo.fleet);
        ok('31o: nothing else in the envelope is disturbed',
          env.diorama === 2 && env.name === 'Home' && env.store.floors.length === 1);
        // The legacy bare-store envelope.
        eq('31o: a legacy bare store is handled too',
          JSON.parse(we(JSON.stringify(store()))).flights?.source, 'demo');
        // NEGATIVE CONTROLS — the three cases it must leave completely alone.
        const authored = JSON.stringify({ diorama: 2, store:
          { ...store(), flights: { enabled: false, source: 'opensky' } } });
        eq('31o: NEG an envelope that already authored flights is untouched',
          we(authored), authored);
        eq('31o: NEG unparseable text is returned verbatim', we('not json {'), 'not json {');
        eq('31o: NEG a non-store object is returned verbatim',
          we('{"hello":1}'), '{"hello":1}');
        eq('31o: NEG an empty string is returned verbatim', we(''), '');
        // …and the mutation really is what makes the difference.
        ok('31o: NEG the raw envelope has no flights block',
          JSON.parse(JSON.stringify({ diorama: 2, store: store() })).store.flights === undefined);
      }
    }

  } catch (err) {
    ok('HARNESS threw', false, String(err && err.stack || err));
  }

  // ── Report ────────────────────────────────────────────────────────────────
  const pass = results.filter(r => r.pass).length;
  const total = results.length;
  const bad = results.filter(r => !r.pass);
  document.title = `FLIGHTS ${bad.length ? 'FAIL' : 'PASS'} ${pass}/${total}`
    + (bad.length ? ' :: ' + bad.slice(0, 6).map(r => r.name).join(' | ') : '');
  const sum = document.getElementById('summary');
  sum.textContent = document.title;
  sum.className = bad.length ? 'badbg' : 'okbg';
  document.getElementById('rows').innerHTML = results.map(r =>
    `<div class="row"><span class="name">${r.name}</span>` +
    `<span class="${r.pass ? 'pass' : 'fail'}">${r.pass ? 'PASS' : 'FAIL'} ` +
    `<span class="extra">${r.extra}</span></span></div>`).join('');
</script>
