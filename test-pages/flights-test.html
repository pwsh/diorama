<!doctype html>
<meta charset="utf-8">
<title>FLIGHTS …</title>
<style>
  body { margin:0; background:#0d1116; color:#cfd8dc; font:13px/1.5 sans-serif; padding:14px; }
  h1 { font-size:15px; margin:0 0 10px; }
  h2 { font-size:12px; margin:14px 0 4px; color:#78909c; text-transform:uppercase; letter-spacing:.06em; }
  #summary { font-size:14px; font-weight:bold; margin:10px 0; padding:8px 10px; border-radius:5px; }
  .okbg { background:#12331f; color:#69f0ae; } .badbg { background:#3a1414; color:#ff8a80; }
  .row { display:flex; justify-content:space-between; gap:10px; padding:2px 0; border-bottom:1px solid #1c2530; }
  .pass { color:#69f0ae; } .fail { color:#ff5252; }
  .name { color:#90caf9; } .extra { color:#ffd54f; font-size:11px; }
</style>
<h1>Flights &amp; ISS (roadmap P4) — normalizer · compression curves · bearing/distance · satAltAz · Planner wiring</h1>
<div id="summary">Running…</div>
<div id="rows"></div>

<!-- Fixture provenance:
       fixtures/adsb/airplanes-live-lax.json — REAL capture (2026-07-24) of
         `curl -s 'https://api.airplanes.live/v2/point/33.9425/-118.408/25'`
         (94 aircraft, 50 of them on the ground). Not hand-edited.
       fixtures/adsb/local-aircraft.json — hand-authored readsb {aircraft:[...]}
         shape covering the edge cases a real capture won't reliably contain:
         a "ground" sentinel, a no-position entry, an mlat/alt_geom-only entry,
         a military dbFlags entry, a string-typed lat, a blank callsign.
       fixtures/adsb/garbage.json — hand-authored malformed corpus.

     Build (flights.ts AND aircraft-types.ts are genuinely zero-import → plain
     transpile; sky-astro.ts pulls in sky-catalog.ts → bundle; planner per the
     config-test recipe, with the in-memory avatar-store swap because IndexedDB
     does not complete under --virtual-time-budget):
       npx esbuild src/flights.ts --format=esm --outfile=<harness>/flights.mod.js
       npx esbuild src/aircraft-types.ts --format=esm --outfile=<harness>/aircraft-types.mod.js
       npx esbuild src/sky-astro.ts --bundle --format=esm --outfile=<harness>/sky-astro.mod.js
       T=$(mktemp -d); cp -r src/* "$T"/
       cp test-pages/fake-avatar-store.ts "$T"/avatar-store.ts
       npx esbuild "$T"/planner.ts --bundle --format=esm --outfile=<harness>/planner.mod.js
-->
<script type="module">
  const V = '?v=' + Date.now();
  const F = await import('./flights.mod.js' + V);
  const AT = await import('./aircraft-types.mod.js' + V);
  const SA = await import('./sky-astro.mod.js' + V);
  const { Planner } = await import('./planner.mod.js' + V);

  const results = [];
  const ok = (name, cond, extra = '') => results.push({ name, pass: !!cond, extra: String(extra) });
  const near = (name, got, want, tol, extra = '') =>
    ok(name, Math.abs(got - want) <= tol, extra || `got ${got}, want ${want}±${tol}`);
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  async function waitFor(cond, tries = 800) {
    for (let i = 0; i < tries; i++) { if (cond()) return true; await sleep(4); }
    return !!cond();
  }
  const clone = x => JSON.parse(JSON.stringify(x));
  const TWO_PI = Math.PI * 2;

  const LAX = await (await fetch('./fixtures/adsb/airplanes-live-lax.json' + V)).json();
  const LOCAL = await (await fetch('./fixtures/adsb/local-aircraft.json' + V)).json();
  const GARBAGE = await (await fetch('./fixtures/adsb/garbage.json' + V)).json();

  try {
    // ── 1. Normalizer ────────────────────────────────────────────────────────
    {
      const cloud = F.normalizeAircraftList(LAX);
      ok('1: real cloud fixture parses', cloud.length === 44, `n=${cloud.length} (94 raw, 50 on ground)`);
      ok('1: every entry has finite hex/lat/lon/altFt', cloud.every(a =>
        typeof a.hex === 'string' && a.hex.length > 0 &&
        Number.isFinite(a.lat) && Number.isFinite(a.lon) && Number.isFinite(a.altFt)));
      ok('1: hex lowercased', cloud.every(a => a.hex === a.hex.toLowerCase()));
      ok('1: no "ground" survivors', cloud.every(a => a.altFt !== 'ground'));
      ok('1: callsigns trimmed (no trailing pad)', cloud.every(a =>
        a.callsign === null || a.callsign === a.callsign.trim()));
      ok('1: blank callsigns became null', cloud.filter(a => a.callsign === null).length === 2,
        `nulls=${cloud.filter(a => a.callsign === null).length}`);
      ok('1: cloud dst carried into distNm', cloud.every(a => Number.isFinite(a.distNm)));

      const local = F.normalizeAircraftList(LOCAL);
      ok('2: local {aircraft:[…]} envelope parses', local.length === 5, `n=${local.length}`);
      const byHex = Object.fromEntries(local.map(a => [a.hex, a]));
      ok('2: "ground" sentinel filtered (no alt_geom fallback)', !byHex.bbbbbb);
      ok('2: no-position entry filtered', !byHex.cccccc);
      ok('2: string lat rejected (strict numbers)', !byHex['111111']);
      ok('2: normal entry fields', byHex.a1b2c3 && byHex.a1b2c3.callsign === 'UAL123' &&
        byHex.a1b2c3.altFt === 12000 && byHex.a1b2c3.gsKt === 320.4 &&
        byHex.a1b2c3.trackDeg === 180.2 && byHex.a1b2c3.vertRateFpm === -640 &&
        byHex.a1b2c3.seenPosS === 0.4 && byHex.a1b2c3.category === 'A3');
      ok('2: mlat entry kept via alt_geom fallback', byHex.dddddd && byHex.dddddd.altFt === 3400);
      ok('2: source hex uppercase → lowercased', !!byHex.eeeeee);
      ok('2: blank flight → null callsign', byHex.eeeeee && byHex.eeeeee.callsign === null);
      ok('2: dbFlags bit 1 → military', byHex.eeeeee && byHex.eeeeee.military === true);
      ok('2: dbFlags 8 (LADD) is NOT military', byHex.ffffff && byHex.ffffff.military === false);
      ok('2: absent dbFlags → military false', byHex.a1b2c3 && byHex.a1b2c3.military === false);
      ok('2: geom_rate vertRate fallback', byHex.ffffff && byHex.ffffff.vertRateFpm === 300);
      ok('2: true_heading track fallback', byHex['222222'] && byHex['222222'].trackDeg === 45);
      ok('2: absent optional fields → null not NaN', byHex.dddddd &&
        byHex.dddddd.vertRateFpm === null && byHex['222222'].vertRateFpm === null);
      ok('2: no distNm when source lacks dst', byHex.a1b2c3 && byHex.a1b2c3.distNm === undefined);

      // Envelope equivalence: {ac} vs {aircraft} vs a bare array.
      const bare = LOCAL.aircraft;
      const asAc = F.normalizeAircraftList({ ac: bare });
      const asFlights = F.normalizeAircraftList({ flights: bare });
      const asBare = F.normalizeAircraftList(bare);
      const sig = l => JSON.stringify(l.map(a => a.hex + ':' + a.altFt));
      ok('3: {ac} envelope == {aircraft}', sig(asAc) === sig(local));
      ok('3: {flights} envelope == {aircraft}', sig(asFlights) === sig(local));
      ok('3: bare array == {aircraft}', sig(asBare) === sig(local));

      // Never throws — every shape of garbage.
      let threw = false;
      const bad = [null, undefined, 42, 'string', true, {}, { aircraft: 'nope' }, { ac: 42 },
        [[]], [null], NaN, { aircraft: null }, () => {}];
      let allEmpty = true;
      for (const b of bad) {
        try { const r = F.normalizeAircraftList(b); if (r.length !== 0) allEmpty = false; }
        catch { threw = true; }
      }
      ok('4: garbage inputs never throw', !threw);
      ok('4: garbage inputs → []', allEmpty);
      let g = null, gThrew = false;
      try { g = F.normalizeAircraftList(GARBAGE); } catch { gThrew = true; }
      ok('4: malformed-entry corpus does not throw', !gThrew);
      ok('4: every malformed entry skipped', g && g.length === 0, `n=${g ? g.length : 'threw'}`);
      ok('4: out-of-range lat/lon rejected', g && g.length === 0);
    }

    // ── 2. aircraftModelKind ────────────────────────────────────────────────
    {
      const mk = c => F.aircraftModelKind({ category: c });
      ok('5: A7 → heli', mk('A7') === 'heli');
      ok('5: A1 → prop', mk('A1') === 'prop');
      ok('5: A2 → prop', mk('A2') === 'prop');
      ok('5: A3 → jet', mk('A3') === 'jet');
      ok('5: A5 → jet', mk('A5') === 'jet');
      ok('5: null category → jet', mk(null) === 'jet');
      ok('5: unknown category → jet', mk('D7') === 'jet');
    }

    // ── 3. compressRadiusMm ─────────────────────────────────────────────────
    {
      const R = F.FLIGHT_SHELL.rMaxMm;
      ok('6: 0 nm → 0 mm', F.compressRadiusMm(0, 30) === 0);
      let mono = true, bounded = true, prev = -1;
      for (let d = 0; d <= 250; d += 0.1) {
        const v = F.compressRadiusMm(d, 30);
        if (v <= prev - 1e-9) mono = false;
        if (!(v < R)) bounded = false;
        prev = v;
      }
      ok('6: monotonically increasing over 0..250 nm', mono);
      ok('6: strictly below rMaxMm everywhere', bounded, `rMax=${R}`);
      ok('6: negative distance clamps to 0', F.compressRadiusMm(-5, 30) === 0);
      ok('6: non-finite distance clamps to 0', F.compressRadiusMm(NaN, 30) === 0);
      // K floor: radiusNm 5 → K = max(4, 1.25) = 4, so it must NOT use r/4.
      near('6: K floor at radiusNm=5 (K=4)', F.compressRadiusMm(4, 5), R / 2, 1e-6);
      near('6: K = radiusNm/4 at radiusNm=100 (K=25)', F.compressRadiusMm(25, 100), R / 2, 1e-6);
      ok('6: bigger radius pushes the same aircraft inward',
        F.compressRadiusMm(20, 100) < F.compressRadiusMm(20, 20));
    }

    // ── 4. compressAltitudeMm ───────────────────────────────────────────────
    {
      const S = F.FLIGHT_SHELL;
      near('7: 0 ft → yMinMm', F.compressAltitudeMm(0), S.yMinMm, 1e-9);
      near('7: altMaxFt → yMaxMm', F.compressAltitudeMm(S.altMaxFt), S.yMaxMm, 1e-9);
      ok('7: clamps above altMaxFt', F.compressAltitudeMm(120000) === F.compressAltitudeMm(S.altMaxFt));
      ok('7: clamps below 0', F.compressAltitudeMm(-2000) === F.compressAltitudeMm(0));
      let mono = true, inBand = true, prev = -1;
      for (let a = 0; a <= 50000; a += 25) {
        const v = F.compressAltitudeMm(a);
        if (v < prev - 1e-9) mono = false;
        if (v < S.yMinMm - 1e-9 || v > S.yMaxMm + 1e-9) inBand = false;
        prev = v;
      }
      ok('7: monotonic over 0..50000 ft', mono);
      ok('7: stays inside [yMin, yMax]', inBand);
      ok('7: non-finite → yMinMm', F.compressAltitudeMm(NaN) === S.yMinMm);
      ok('7: log knee spends detail low (3000 ft past halfway of 45000 ft band)',
        F.compressAltitudeMm(3000) - S.yMinMm > (S.yMaxMm - S.yMinMm) * 0.24);
    }

    // ── 5. flightBearingDistance goldens ────────────────────────────────────
    {
      const OLAT = 47.6, OLON = -122.3;
      const b = (dlat, dlon) => F.flightBearingDistance(OLAT, OLON, OLAT + dlat, OLON + dlon);
      const n = b(0.1, 0), e = b(0, 0.1), s = b(-0.1, 0), w = b(0, -0.1);
      near('8: due north bearing = 0', n.bearingRad, 0, 1e-9);
      near('8: due north distance ≈ 6.004 nm', n.distNm, 6.00405, 0.001);
      near('8: due east bearing = π/2', e.bearingRad, Math.PI / 2, 1e-9);
      near('8: due east distance ≈ 4.049 nm (cos lat)', e.distNm, 4.04854, 0.001);
      near('8: due south bearing = π', s.bearingRad, Math.PI, 1e-9);
      near('8: due west bearing = 3π/2 (normalized, never negative)', w.bearingRad, 3 * Math.PI / 2, 1e-9);
      let inRange = true;
      for (let dl = -1; dl <= 1; dl += 0.05) for (let dn = -1; dn <= 1; dn += 0.05) {
        const r = b(dn, dl).bearingRad;
        if (!(r >= 0 && r < TWO_PI)) inRange = false;
      }
      ok('8: bearing always in [0, 2π)', inRange);
      ok('8: zero offset → distance 0', b(0, 0).distNm === 0);
      // City pair sanity vs the true great-circle distance (LAX → Long Beach).
      const city = F.flightBearingDistance(33.9425, -118.408, 33.8177, -118.1516);
      const TRUE_NM = 14.8151;   // haversine, R = 6371 km
      ok('8: LAX→LGB distance within 2% of great-circle',
        Math.abs(city.distNm - TRUE_NM) / TRUE_NM < 0.02, `got ${city.distNm.toFixed(3)} nm`);
      near('8: LAX→LGB bearing ≈ 120.4° (SE)', city.bearingRad * 180 / Math.PI, 120.4, 0.5);
    }

    // ── 6. flightDisplayPos ─────────────────────────────────────────────────
    {
      const OLAT = 47.6, OLON = -122.3;
      const fp = (dlat, dlon, alt) => ({ lat: OLAT + dlat, lon: OLON + dlon, altFt: alt });
      const north = F.flightDisplayPos(fp(0.1, 0, 10000), OLAT, OLON, 0, 30);
      ok('9: θ=0 north aircraft → planY > 0', north.planY > 0, `planY=${north.planY.toFixed(1)}`);
      near('9: θ=0 north aircraft → planX ≈ 0', north.planX, 0, 1e-6);
      near('9: radius matches compressRadiusMm', Math.hypot(north.planX, north.planY),
        F.compressRadiusMm(north.distNm, 30), 1e-6);
      // dispY is NO LONGER compressAltitudeMm alone — it is capped at the true
      // elevation angle (see section 6b). At 6 nm / 10,000 ft the cap bites.
      ok('9: dispY is the elevation cap, not the raw altitude curve',
        north.dispY < F.compressAltitudeMm(10000) - 1,
        `dispY=${north.dispY.toFixed(1)} rawCurve=${F.compressAltitudeMm(10000).toFixed(1)}`);
      near('9: dispY == flightDisplayAltitudeMm(alt, dist, r)', north.dispY,
        F.flightDisplayAltitudeMm(10000, north.distNm, F.compressRadiusMm(north.distNm, 30)), 1e-9);
      near('9: distNm echoed from flightBearingDistance', north.distNm, 6.00405, 0.001);
      near('9: bearingRad echoed', north.bearingRad, 0, 1e-9);

      const rot = F.flightDisplayPos(fp(0.1, 0, 10000), OLAT, OLON, Math.PI / 2, 30);
      near('9: θ=π/2 rotates north aircraft onto −X', rot.planX, -Math.hypot(north.planX, north.planY), 1e-6);
      near('9: θ=π/2 leaves planY ≈ 0', rot.planY, 0, 1e-6);
      near('9: rotation preserves radius', Math.hypot(rot.planX, rot.planY),
        Math.hypot(north.planX, north.planY), 1e-6);

      const east = F.flightDisplayPos(fp(0, 0.1, 10000), OLAT, OLON, 0, 30);
      ok('9: θ=0 east aircraft → planX > 0 and planY ≈ 0',
        east.planX > 0 && Math.abs(east.planY) < 1e-6);
      const far = F.flightDisplayPos(fp(0.4, 0, 10000), OLAT, OLON, 0, 30);
      ok('9: farther aircraft renders farther out', far.planY > north.planY);
      ok('9: nothing escapes the shell', Math.hypot(far.planX, far.planY) < F.FLIGHT_SHELL.rMaxMm);
      // The whole real fixture, projected: no NaN, everything inside the shell.
      const cloud = F.normalizeAircraftList(LAX);
      let clean = true;
      for (const a of cloud) {
        const p = F.flightDisplayPos(a, 33.9425, -118.408, 0.3, 25);
        if (!Number.isFinite(p.planX) || !Number.isFinite(p.planY) || !Number.isFinite(p.dispY)) clean = false;
        if (Math.hypot(p.planX, p.planY) >= F.FLIGHT_SHELL.rMaxMm) clean = false;
        if (p.dispY < F.FLIGHT_SHELL.clearMm || p.dispY > F.FLIGHT_SHELL.yMaxMm) clean = false;
      }
      ok('9: all 44 real aircraft project finite + inside the shell', clean);
    }

    // ── 6b. Elevation-true altitude cap ─────────────────────────────────────
    // The user-reported bug: EVERY aircraft read as "directly above the
    // property", because dispY came from compressAltitudeMm alone — a curve
    // that never looked at distance, over a 2,500–22,000 mm band comparable to
    // the 24,000 mm radial shell. The fix caps the display height at the TRUE
    // elevation angle:
    //   dispY = max(clearMm, min(compressAltitudeMm(alt), r · altM / distM))
    // clearMm (6500) is the property-clearance render floor — no aircraft may
    // ever draw low enough to hit the house (user-reported: approach traffic
    // at 1500–2000 ft skimmed the yard at the old 2500 mm yMinMm floor).
    {
      const OLAT = 47.6, OLON = -122.3;
      const FT_M = 0.3048, NM_M = 1852, EARTH_R_M = 6371000, DEGR = Math.PI / 180;
      // An aircraft due NORTH at exactly `distNm` (equirectangular with dlon=0
      // makes east 0, so hypot(east, north) is the north leg exactly).
      const atNm = (distNm, altFt) => ({
        lat: OLAT + (distNm * NM_M) / (EARTH_R_M * DEGR), lon: OLON, altFt,
      });
      const D = (distNm, altFt, radiusNm = 15) =>
        F.flightDisplayPos(atNm(distNm, altFt), OLAT, OLON, 0, radiusNm);
      const dispAngDeg = d => Math.atan2(d.dispY, Math.hypot(d.planX, d.planY)) * 180 / Math.PI;
      const trueAngDeg = (altFt, distNm) =>
        Math.atan2(altFt * FT_M, distNm * NM_M) * 180 / Math.PI;

      // Distance goldens (radius 15 nm → K = max(4, 15/4) = 4).
      const g1 = D(8.7, 35000);
      near('9b: 35,000 ft @ 8.7 nm → r', Math.hypot(g1.planX, g1.planY), 16440.9449, 0.01);
      near('9b: 35,000 ft @ 8.7 nm → dispY', g1.dispY, 10885.5292, 0.01);
      near('9b: 35,000 ft @ 8.7 nm → 33.5° up (== true)', dispAngDeg(g1), 33.508, 0.01);

      const g2 = D(15, 35000);
      near('9b: 35,000 ft @ 15 nm → r', Math.hypot(g2.planX, g2.planY), 18947.3684, 0.01);
      near('9b: 35,000 ft @ 15 nm → dispY', g2.dispY, 7276.1169, 0.01);
      near('9b: 35,000 ft @ 15 nm → 21.0° up (== true)', dispAngDeg(g2), 21.008, 0.01);

      // Overhead traffic must STAY overhead. The raw elevation term here is
      // 4388.77 mm — BELOW the 6500 property-clearance floor, so the floor
      // lifts it (and the read stays steeply overhead: ~67.7°).
      const g3 = D(0.5, 5000);
      near('9b: 5,000 ft @ 0.5 nm → r', Math.hypot(g3.planX, g3.planY), 2666.6667, 0.01);
      near('9b: 5,000 ft @ 0.5 nm → dispY rides the clearance floor', g3.dispY, F.FLIGHT_SHELL.clearMm, 1e-9);
      ok('9b: 5,000 ft @ 0.5 nm → still reads overhead (> 60° up)', dispAngDeg(g3) > 60,
        `${dispAngDeg(g3).toFixed(1)}°`);
      const g4 = D(0.5, 35000);
      near('9b: 35,000 ft @ 0.5 nm → the log curve wins (overhead stays steep)',
        g4.dispY, F.compressAltitudeMm(35000), 1e-9);
      ok('9b: …and reads > 80° up', dispAngDeg(g4) > 80, `${dispAngDeg(g4).toFixed(1)}°`);

      // THE regression: dispY used to be independent of distance.
      ok('9b: dispY is NOT independent of distance (the reported bug)',
        Math.abs(D(3, 35000).dispY - D(30, 35000).dispY) > 1000,
        `${D(3, 35000).dispY.toFixed(0)} vs ${D(30, 35000).dispY.toFixed(0)}`);

      // Strictly DECREASING in distance for a fixed altitude, once past the
      // crossover (35,000 ft crosses at ≈2.8 nm at radius 15) and before the
      // clearance floor (35,000 ft reaches 6500 mm at ≈17.3 nm).
      // dispY_elev ∝ alt / (d + K).
      let mono = true, prev = Infinity;
      for (let d = 3; d <= 17; d += 0.5) {
        const v = D(d, 35000).dispY;
        if (!(v < prev - 1e-9)) { mono = false; break; }
        prev = v;
      }
      ok('9b: fixed altitude → dispY strictly decreases with distance', mono);
      // …and the radius still strictly INCREASES over the same sweep, i.e. the
      // aircraft walks out toward the horizon rather than merely shrinking.
      let rMono = true, rPrev = -Infinity;
      for (let d = 3; d <= 40; d += 0.5) {
        const v = Math.hypot(...(x => [x.planX, x.planY])(D(d, 35000)));
        if (!(v > rPrev + 1e-9)) { rMono = false; break; }
        rPrev = v;
      }
      ok('9b: …while the display radius still grows', rMono);

      // Monotonic (non-decreasing) in altitude at a fixed distance — both terms
      // are non-decreasing in altitude, so min() and the floor are too.
      let altMono = true, aPrev = -Infinity;
      for (let a = 0; a <= 45000; a += 250) {
        const v = D(10, a).dispY;
        if (v < aPrev - 1e-9) { altMono = false; break; }
        aPrev = v;
      }
      ok('9b: fixed distance → dispY non-decreasing in altitude', altMono);

      // Angle parity: where the elevation branch is active the DISPLAYED angle
      // equals the TRUE one; nowhere (above the floor) may it exceed it.
      let parity = true, never = true, sawElev = 0, sawCurve = 0;
      for (const alt of [500, 1500, 4000, 9000, 18000, 27000, 35000, 43000]) {
        for (const d of [0.25, 0.75, 2, 5, 9, 15, 25, 40]) {
          const p = D(d, alt);
          const disp = dispAngDeg(p), tru = trueAngDeg(alt, d);
          const floored = p.dispY <= F.FLIGHT_SHELL.clearMm + 1e-9;
          const elevBranch = !floored && p.dispY < F.compressAltitudeMm(alt) - 1e-6;
          if (elevBranch) { sawElev++; if (Math.abs(disp - tru) > 1e-6) parity = false; }
          else if (!floored) sawCurve++;
          if (!floored && disp > tru + 1e-6) never = false;
        }
      }
      ok('9b: elevation branch reproduces the TRUE elevation angle exactly',
        // The 6500 clearance floor absorbs the low-altitude rows of the sample
        // grid (alt ≲ 6600 ft can never clear it: max elev term = rMax·altM/
        // (NM_M·K) = 3.24·altM), so the elevation branch keeps ~14 of 64 cells.
        parity && sawElev >= 12, `${sawElev} samples on the elevation branch`);
      ok('9b: display angle never EXCEEDS the true angle (above the floor)', never);
      ok('9b: the log curve still governs some near/high traffic', sawCurve > 0, `${sawCurve} samples`);

      // The clearMm property-clearance floor: NOTHING may render low enough to
      // hit the house — distant low approach traffic rides the floor.
      near('9b: 1,000 ft @ 15 nm floors at clearMm', D(15, 1000).dispY, F.FLIGHT_SHELL.clearMm, 1e-9);
      ok('9b: nothing ever sits below clearMm', D(90, 500).dispY === F.FLIGHT_SHELL.clearMm);
      ok('9b: clearance floor clears a 2-story house (≥ 6000 mm + margin)',
        F.FLIGHT_SHELL.clearMm >= 6500);
      // The user-reported regression: 1,500–2,000 ft approach traffic a few nm
      // out must never skim the yard.
      ok('9b: 1,800 ft @ 5 nm sits at/above the clearance floor',
        D(5, 1800).dispY >= F.FLIGHT_SHELL.clearMm);

      // Bounds + garbage tolerance on the shared helper itself.
      ok('9b: helper clamps to the shell band',
        F.flightDisplayAltitudeMm(99999, 1, 24000) <= F.FLIGHT_SHELL.yMaxMm
        && F.flightDisplayAltitudeMm(-5000, 10, 18000) === F.FLIGHT_SHELL.clearMm);
      ok('9b: helper survives non-finite input',
        F.flightDisplayAltitudeMm(NaN, NaN, NaN) === F.FLIGHT_SHELL.clearMm

      // both renderers and the settings input.

    }

    // ── 7. satAltAz goldens ─────────────────────────────────────────────────
    {
      const overhead = SA.satAltAz(47.6, -122.3, 47.6, -122.3, 420);
      near('10: satellite directly overhead → alt = π/2', overhead.altRad, Math.PI / 2, 1e-9);

      near('10: antipodal alt ≈ −π/2', anti.altRad, -Math.PI / 2, 0.01);
      const eastSat = SA.satAltAz(0, 0, 0, 5, 420);
      near('10: equator satellite due east → az = π/2', eastSat.azRad, Math.PI / 2, 1e-9);
      ok('10: equator satellite 5° east is above the horizon', eastSat.altRad > 0,
        `alt=${(eastSat.altRad * 180 / Math.PI).toFixed(1)}°`);
      const westSat = SA.satAltAz(0, 0, 0, -5, 420);
      near('10: equator satellite due west → az = 3π/2', westSat.azRad, 3 * Math.PI / 2, 1e-9);
      near('10: east/west symmetry in altitude', eastSat.altRad, westSat.altRad, 1e-12);
      const northSat = SA.satAltAz(0, 0, 5, 0, 420);
      near('10: satellite due north → az = 0', northSat.azRad, 0, 1e-9);
      const southSat = SA.satAltAz(0, 0, -5, 0, 420);
      near('10: satellite due south → az = π', southSat.azRad, Math.PI, 1e-9);
      const pole = SA.satAltAz(89.9, 0, 80, 0, 420);
      near('10: observer near the pole, satellite down lon 0 → az = π', pole.azRad, Math.PI, 1e-6);
      let ranged = true;
      for (let la = -80; la <= 80; la += 17) for (let lo = -180; lo < 180; lo += 23) {
        const r = SA.satAltAz(47.6, -122.3, la, lo, 420);
        if (!(r.azRad >= 0 && r.azRad < TWO_PI)) ranged = false;
        if (!(r.altRad >= -Math.PI / 2 - 1e-9 && r.altRad <= Math.PI / 2 + 1e-9)) ranged = false;

      ok('10: higher orbit raises a horizon-grazing satellite',
        SA.satAltAz(0, 0, 0, 20, 2000).altRad > SA.satAltAz(0, 0, 0, 20, 420).altRad);

        JSON.stringify(SA.satAltAz(12, 34, 56, 78, 420)) === JSON.stringify(SA.satAltAz(12, 34, 56, 78, 420)));

    // ── 8. Planner wiring (real Planner + fake HaApi + stubbed fetch) ────────
    {
      // Stubbed network. `handler(url)` returns a JSON value, or null → !ok.
      // `calls` records ONLY flight/ISS traffic — the Planner also polls
      // Open-Meteo for the weather config these scenarios use as the origin
      // fallback, and that noise must not count as a flight fetch.
      const isFlightUrl = u =>
        u.includes('airplanes.live') || u.includes('wheretheiss') || u.includes('aircraft.json');
      const calls = [];
      let handler = () => null;
      const realFetch = globalThis.fetch;
      globalThis.fetch = async (url, init) => {
        const u = String(url);
        if (u.includes('/fixtures/') || u.includes('.mod.js')) return realFetch(url, init);
        if (isFlightUrl(u)) calls.push(u);
        const body = handler(u);
        if (body == null) return { ok: false, status: 503, json: async () => { throw new Error('no body'); } };
        return { ok: true, status: 200, json: async () => body };
      };
      const aircraftCalls = () => calls.filter(u => !u.includes('wheretheiss'));
      const issCalls = () => calls.filter(u => u.includes('wheretheiss'));

      class FakeHa {
        constructor(seed, states) {
          this.map = new Map();
          for (const [k, v] of Object.entries(seed || {})) this.map.set(k, clone(v));
          this.states = states || {};
          this._stateCbs = []; this._connCbs = [];
        }
        connect() {
          for (const cb of this._connCbs) cb('connected');
          for (const cb of this._stateCbs) cb(this.states, undefined);
        }
        push(id, st) {
          this.states[id] = st;
          for (const cb of this._stateCbs) cb(this.states, id);
        }
        onState(fn) { this._stateCbs.push(fn); }
        onConn(fn) { this._connCbs.push(fn); }
        callService() { return Promise.resolve(); }
        async getHistory() { return {}; }
        async getWeatherForecasts() { return null; }
        async getDevices() { return []; }
        async getEntityRegistry() { return []; }
        async updateEntityRegistry() { return true; }
        async getCalendarEvents() { return []; }
        async subscribePersistentNotifications() { return () => {}; }
        async listRepairsIssues() { return []; }
        async subscribeMqtt() { return () => {}; }
        async publishMqtt() { return true; }
        async getUserData(key) { return this.map.has(key) ? clone(this.map.get(key)) : null; }
        async setUserData(key, value) { this.map.set(key, clone(value)); return true; }
        async refreshStates() {}
        peek(key) { return this.map.has(key) ? clone(this.map.get(key)) : null; }
      }

      const makeStore = extra => ({
        v: 2,
        floors: [{
          id: 'f1', name: 'Home', w: 8000, d: 6000,
          walls: [], furniture: [], lights: [], switches: [], sensors: [], motionSensors: [],
          roamers: [], envSensors: [], doors: [], windows: [], bg: null, rooms: [], bleProxies: [],
          alarmPanels: [], safetySensors: [], robots: [], presenceZones: [], cameras: [],
          groundAreas: [], voidAreas: [],
        }],
        currentFloorId: 'f1', activeSensorId: null,
        coverage: true, imperial: false, showDetails: false, useRawTargets: false,
        ...extra,
      });

      const HOME = { lat: 47.6, lon: -122.3 };
      const WEATHER = { source: 'openmeteo', lat: HOME.lat, lon: HOME.lon, chip: true };
      const seedFor = store => ({
        'diorama-configs': { version: 1, activeId: 'default', configs: [{ id: 'default', name: 'Default', updatedAt: 1 }] },
        'diorama-cfg-default': store,
      });

      async function boot(store, states) {
        localStorage.removeItem('diorama:store:v1');
        localStorage.removeItem('diorama:configs');
        const stub = new FakeHa(seedFor(store), states);
        const p = new Planner();
        p.connectWith(stub);
        await waitFor(() => p.configIndex !== null);
        return { p, stub };
      }
      // Stop a scenario's timers so virtual time can't spin them during later ones.
      const quiesce = p => { p.setFlights(f => { f.enabled = false; }); };

      // Build a synthetic cloud payload of n aircraft, ringed outward from home.
      function ring(n, { startNm = 1, stepNm = 0.4, alt = 10000 } = {}) {
        const ac = [];
        for (let i = 0; i < n; i++) {
          const nm = startNm + i * stepNm;
          const dlat = (nm * 1852) / (6371000 * Math.PI / 180);   // due north
          ac.push({
            hex: 'f' + String(i).padStart(5, '0'), flight: 'TST' + i + '   ',
            lat: HOME.lat + dlat, lon: HOME.lon,
            alt_baro: typeof alt === 'function' ? alt(i) : alt,
            gs: 300, track: 180, category: 'A3', seen_pos: 0.5,
          });
        }
        return { ac, now: 1, total: n };
      }

      // (a) enabled + cloud + origin → poll lands, rev bumps, status ok.
      {
        calls.length = 0;
        handler = u => u.includes('wheretheiss')
          ? { latitude: -16.7, longitude: 90.1, altitude: 418.9, velocity: 27586.1, timestamp: 1784953269 }
          : ring(3);
        const { p } = await boot(makeStore({
          weather: WEATHER, flights: { enabled: true, source: 'cloud', radiusNm: 30 },
        }));
        await waitFor(() => p.flightsStatus === 'ok' && (p.flightsNow?.length ?? 0) === 3);
        ok('11a: status ok after a successful poll', p.flightsStatus === 'ok', p.flightsStatus);
        ok('11a: aircraft stored', (p.flightsNow?.length ?? 0) === 3, `n=${p.flightsNow?.length}`);
        ok('11a: flightsAt stamped', p.flightsAt > 0);
        // A NEW aircraft list on a later poll must bump the revision (the
        // renderer's only "something changed" signal). The poll is driven
        // directly — the 8 s interval outlives the harness's virtual clock.
        const rev0 = p.flightsRev;
        handler = u => u.includes('wheretheiss')
          ? { latitude: -16.7, longitude: 90.1, altitude: 418.9, velocity: 27586.1, timestamp: 1784953269 }
          : ring(7);
        await p._pollFlights();
        ok('11a: a later poll replaces the list', (p.flightsNow?.length ?? 0) === 7, `n=${p.flightsNow?.length}`);
        ok('11a: flightsRev bumped on new data', p.flightsRev > rev0, `${rev0}→${p.flightsRev}`);
        ok('11a: distNm filled from the origin', p.flightsNow.every(a => Number.isFinite(a.distNm)));
        ok('11a: cloud endpoint hit with the configured point + radius',
          aircraftCalls().some(u => u.includes('/v2/point/47.6000/-122.3000/30')), aircraftCalls()[0] || '');
        ok('11a: flightsOrigin falls back to weather lat/lon',
          JSON.stringify(p.flightsOrigin()) === JSON.stringify(HOME), JSON.stringify(p.flightsOrigin()));
        await waitFor(() => p.issNow !== null);
        ok('11a: ISS polled alongside', p.issNow !== null);
        near('11a: ISS velocity normalized km/h → km/s', p.issNow?.velKmS ?? 0, 7.6628, 0.001);
        near('11a: ISS timestamp normalized s → ms', p.issNow?.tsMs ?? 0, 1784953269000, 0.5);
        near('11a: ISS altitude km passed through', p.issNow?.altKm ?? 0, 418.9, 1e-9);
        quiesce(p);
      }

      // (b) disabled → completely inert, no fetch at all.
      {
        calls.length = 0;
        handler = () => ring(3);
        const { p } = await boot(makeStore({ weather: WEATHER, flights: { enabled: false, source: 'cloud' } }));
        await sleep(120);
        ok('11b: disabled → status off', p.flightsStatus === 'off', p.flightsStatus);
        ok('11b: disabled → no aircraft data', p.flightsNow === null);
        ok('11b: disabled → no ISS data', p.issNow === null);
        ok('11b: disabled → ZERO network calls', calls.length === 0, `calls=${calls.length}`);
        quiesce(p);
      }

      // (c) absent flights config → equally inert.
      {
        calls.length = 0;
        handler = () => ring(3);
        const { p } = await boot(makeStore({ weather: WEATHER }));
        await sleep(120);
        ok('11c: absent config → status off + no calls', p.flightsStatus === 'off' && calls.length === 0,
          `${p.flightsStatus} calls=${calls.length}`);
        quiesce(p);
      }

      // (d) enabled but no resolvable origin → 'no-origin', still no fetch.
      {
        calls.length = 0;
        handler = () => ring(3);
        const { p } = await boot(makeStore({ flights: { enabled: true, source: 'cloud' } }));
        await waitFor(() => p.flightsStatus === 'no-origin');
        ok('11d: no origin → status no-origin', p.flightsStatus === 'no-origin', p.flightsStatus);
        ok('11d: no origin → no data', p.flightsNow === null && p.issNow === null);
        ok('11d: no origin → no network calls', calls.length === 0, `calls=${calls.length}`);
        ok('11d: flightsOrigin() === null', p.flightsOrigin() === null);
        quiesce(p);

      // (e) a calibrated geo landmark WINS over the weather lat/lon.
      {
        calls.length = 0;
        handler = () => ring(1);
        const { p } = await boot(makeStore({
          weather: WEATHER,
          geo: { landmarks: [{ id: 'l1', name: 'Mailbox', x: 1000, y: 2000, lat: 40.5, lon: -74.25 }] },
          flights: { enabled: true, source: 'cloud', iss: false },

        await waitFor(() => p.flightsStatus === 'ok');
        const o = p.flightsOrigin();
        ok('11e: geo fit origin beats weather lat/lon',
          o && Math.abs(o.lat - 40.5) < 1e-9 && Math.abs(o.lon + 74.25) < 1e-9, JSON.stringify(o));
        ok('11e: cloud query uses the landmark point',
          aircraftCalls().some(u => u.includes('/40.5000/-74.2500/')), aircraftCalls()[0] || '');
        ok('11e: iss:false → no ISS poll', issCalls().length === 0, `iss calls=${issCalls().length}`);

      // (f) radius + altitude filters, nearest-first ordering, MAX_AIRCRAFT cap.

        // the cap (not the radius) is what trims the list.
        handler = () => ring(80, { startNm: 1, stepNm: 0.2 });

          weather: WEATHER, flights: { enabled: true, source: 'cloud', radiusNm: 20, iss: false },

        await waitFor(() => (p.flightsNow?.length ?? 0) > 0);
        const list = p.flightsNow;
        ok('11f: radius filter applied (all ≤ 20 nm)', list.every(a => a.distNm <= 20 + 1e-6));
        ok('11f: capped at MAX_AIRCRAFT', list.length === F.MAX_AIRCRAFT, `n=${list.length}`);
        let sorted = true;
        for (let i = 1; i < list.length; i++) if (list[i].distNm < list[i - 1].distNm - 1e-9) sorted = false;
        ok('11f: sorted nearest-first', sorted);
        ok('11f: cap keeps the NEAREST 50, dropping the 30 farther ones',

      {
        calls.length = 0;
        handler = () => ring(9, { startNm: 1, stepNm: 0.5, alt: i => 500 + i * 2500 });
        const { p } = await boot(makeStore({
          weather: WEATHER,
          flights: { enabled: true, source: 'cloud', radiusNm: 50, minAltFt: 3000, maxAltFt: 15000, iss: false },
        }));
        await waitFor(() => p.flightsStatus === 'ok');

        ok('11f: minAltFt filter applied', alts.every(a => a >= 3000), JSON.stringify(alts));
        ok('11f: maxAltFt filter applied', alts.every(a => a <= 15000));
        ok('11f: altitude band keeps the in-band entries', alts.length === 5, `n=${alts.length}`);
        quiesce(p);
      }

      // (g) a failed fetch KEEPS the last data (stale-tolerant).
      {
        calls.length = 0;
        handler = () => ring(4);
        const { p } = await boot(makeStore({
          weather: WEATHER, flights: { enabled: true, source: 'cloud', radiusNm: 30, iss: false },
        }));
        await waitFor(() => (p.flightsNow?.length ?? 0) === 4);
        const keptRev = p.flightsRev;
        handler = () => null;                       // every fetch now fails
        const before = calls.length;
        await p._pollFlights();
        await p._pollFlights();
        ok('11g: the failing polls really ran', calls.length > before, `${before}→${calls.length}`);
        ok('11g: failed poll keeps the previous aircraft', (p.flightsNow?.length ?? 0) === 4,
          `n=${p.flightsNow?.length}`);
        ok('11g: failed poll keeps status ok (data still valid)', p.flightsStatus === 'ok', p.flightsStatus);
        ok('11g: failed poll does not bump the revision', p.flightsRev === keptRev);
        quiesce(p);
      }

      // (h) a failing FIRST poll with nothing cached → status 'error'.
      {
        calls.length = 0;
        handler = () => null;
        const { p } = await boot(makeStore({
          weather: WEATHER, flights: { enabled: true, source: 'cloud', radiusNm: 30, iss: false },
        }));
        await waitFor(() => p.flightsStatus === 'error');
        ok('11h: no data + failed fetch → status error', p.flightsStatus === 'error', p.flightsStatus);
        ok('11h: flightsNow stays null', p.flightsNow === null);
        quiesce(p);
      }

      // (i) local source fetches the configured URL verbatim; a bad scheme never fetches.
      {
        calls.length = 0;
        handler = () => LOCAL;
        const { p } = await boot(makeStore({
          weather: WEATHER,
          flights: { enabled: true, source: 'local', localUrl: 'http://pi.local:8080/data/aircraft.json',
                     radiusNm: 100, iss: false },
        }));
        await waitFor(() => p.flightsStatus === 'ok');
        ok('11i: local URL used verbatim',
          calls.some(u => u === 'http://pi.local:8080/data/aircraft.json'), calls[0] || '');
        ok('11i: local {aircraft:[…]} parsed + filtered', (p.flightsNow?.length ?? 0) > 0,
          `n=${p.flightsNow?.length}`);
        quiesce(p);
      }
      {
        calls.length = 0;
        handler = () => LOCAL;
        const { p } = await boot(makeStore({
          weather: WEATHER,
          flights: { enabled: true, source: 'local', localUrl: 'javascript:alert(1)', iss: false },
        }));
        await sleep(150);
        ok('11i: non-http(s) localUrl is never fetched', calls.length === 0, `calls=${calls.length}`);
        quiesce(p);
      }

      // (j) entity source: no polling timer, reads attributes on state change.
      {
        calls.length = 0;
        handler = () => ring(3);
        const states = { 'sensor.adsb_proxy': { state: '0', attributes: { aircraft: [] } } };
        const { p, stub } = await boot(makeStore({
          weather: WEATHER,
          flights: { enabled: true, source: 'entity', entityId: 'sensor.adsb_proxy', radiusNm: 100, iss: false },
        }), states);
        await sleep(120);
        ok('11j: entity source makes NO network calls', calls.length === 0, `calls=${calls.length}`);
        stub.push('sensor.adsb_proxy', { state: '5', attributes: { aircraft: LOCAL.aircraft } });
        await waitFor(() => (p.flightsNow?.length ?? 0) === 5);
        ok('11j: attributes.aircraft consumed on state change', (p.flightsNow?.length ?? 0) === 5,
          `n=${p.flightsNow?.length}`);
        ok('11j: status ok', p.flightsStatus === 'ok', p.flightsStatus);
        stub.push('sensor.adsb_proxy', { state: '2', attributes: { ac: LOCAL.aircraft.slice(0, 1) } });
        await waitFor(() => (p.flightsNow?.length ?? 0) === 1);
        ok('11j: `ac` attribute shape also consumed', (p.flightsNow?.length ?? 0) === 1);
        ok('11j: bound entity id is config-path', p._isSlowEntity('sensor.adsb_proxy') === true);
        ok('11j: an unrelated entity is NOT config-path via flights',
          p._isSlowEntity('sensor.something_else') === false);
        quiesce(p);
      }

      // (k) setFlights persists + reconfigures; store survives a reload.
      {
        calls.length = 0;
        handler = () => ring(2);
        const { p, stub } = await boot(makeStore({ weather: WEATHER }));
        ok('11k: starts off', p.flightsStatus === 'off');
        p.setFlights(f => { f.enabled = true; f.source = 'cloud'; f.radiusNm = 42; f.iss = false; });
        await waitFor(() => p.flightsStatus === 'ok');
        ok('11k: setFlights starts the feed', p.flightsStatus === 'ok', p.flightsStatus);
        ok('11k: setFlights created the config object',
          p.store.flights?.enabled === true && p.store.flights?.radiusNm === 42);
        await p.saveConfigNow();
        const saved = stub.peek('diorama-cfg-default');
        ok('11k: flights config written to HA storage',
          saved?.flights?.enabled === true && saved?.flights?.radiusNm === 42,
          JSON.stringify(saved?.flights));
        quiesce(p);

        // Reload from the same backing store — the _normalizeStore field list.
        const p2 = new Planner();
        p2.connectWith(stub);
        await waitFor(() => p2.configIndex !== null && p2.store.flights !== undefined);
        ok('11k: flights survives the load (in _normalizeStore field list)',
          p2.store.flights?.enabled === true && p2.store.flights?.radiusNm === 42,
          JSON.stringify(p2.store.flights));
        quiesce(p2);
      }

      // (l) toggling back off tears the feed down.
      {
        calls.length = 0;
        handler = u => u.includes('wheretheiss')
          ? { latitude: 1, longitude: 2, altitude: 420, velocity: 27000, timestamp: 1784953270 }
          : ring(2);
        const { p } = await boot(makeStore({
          weather: WEATHER, flights: { enabled: true, source: 'cloud', radiusNm: 30 },
        }));
        await waitFor(() => p.flightsStatus === 'ok' && p.issNow !== null);
        p.setFlights(f => { f.enabled = false; });
        ok('11l: disabling clears aircraft data', p.flightsNow === null);
        ok('11l: disabling clears the ISS fix', p.issNow === null);
        ok('11l: disabling sets status off', p.flightsStatus === 'off', p.flightsStatus);
        const after = calls.length;
        await sleep(150);
        ok('11l: no further network calls once disabled', calls.length === after,
          `${after}→${calls.length}`);
      }

      // (m) LIVE-path discipline (user-reported bug): a routine poll must NOT
      // bump configRev. Every three-view dirty key folds configRev, so a
      // per-poll emit rebuilt the weather group (precip re-seeded) and the
      // bg-text rigs (banner plane / chopper / train snapped back to their
      // build-time orbit angle) every few seconds. `flightsRev` is the renderer's
      // signal — _keyFlights is recomputed every tick, so it alone suffices.
      // Config emits are reserved for structural transitions.
      {
        calls.length = 0;
        // Boot with the feed FAILING so the first poll lands no data — that way
        // the first SUCCESSFUL poll below is driven explicitly and configRev can
        // be sampled immediately before it (booting straight into success races
        // the transition emit against the await).
        handler = () => null;
        const { p } = await boot(makeStore({
          weather: WEATHER,
          // No alert triggers configured: every poll below is routine by
          // construction, so nothing but the transition rules can emit.
          flights: { enabled: true, source: 'cloud', radiusNm: 30, iss: false },
        }));
        await waitFor(() => p.flightsStatus === 'error');

        // (b) the FIRST successful poll is a transition ('error' → 'ok', plus
        // null → data) and MUST repaint — the app.ts attribution chip only
        // appears on a config emit.
        const revBeforeFirst = p.configRev;
        handler = () => ring(3);
        await p._pollFlights();
        ok('11m: first successful poll lands data', p.flightsStatus === 'ok'
          && (p.flightsNow?.length ?? 0) === 3, `${p.flightsStatus} n=${p.flightsNow?.length}`);
        ok('11m: first successful poll emits config (status error→ok, chip appears)',
          p.configRev > revBeforeFirst, `${revBeforeFirst}→${p.configRev}`);

        // (a) two consecutive routine polls: flightsRev twice, configRev never.
        const cfgRev0 = p.configRev, fRev0 = p.flightsRev;
        handler = () => ring(4);
        await p._pollFlights();
        const cfgRev1 = p.configRev, fRev1 = p.flightsRev;
        handler = () => ring(5);
        await p._pollFlights();
        ok('11m: routine poll #1 bumps flightsRev', fRev1 === fRev0 + 1, `${fRev0}→${fRev1}`);
        ok('11m: routine poll #2 bumps flightsRev', p.flightsRev === fRev1 + 1,
          `${fRev1}→${p.flightsRev}`);
        ok('11m: two routine polls leave configRev UNCHANGED',
          p.configRev === cfgRev0 && cfgRev1 === cfgRev0,
          `${cfgRev0}→${cfgRev1}→${p.configRev}`);
        ok('11m: the routine polls really landed new data', (p.flightsNow?.length ?? 0) === 5,
          `n=${p.flightsNow?.length}`);

        // (c) a failed poll while data is cached: status stays 'ok', nothing
        // changes, so no repaint either.
        const cfgRev2 = p.configRev;
        handler = () => null;
        await p._pollFlights();
        ok('11m: failed poll with cached data keeps status ok', p.flightsStatus === 'ok',
          p.flightsStatus);
        ok('11m: failed poll with cached data emits NO config',
          p.configRev === cfgRev2, `${cfgRev2}→${p.configRev}`);
        quiesce(p);
      }

      // (n) ISS: the first fix repaints (chip), later advanced fixes do not.
      {
        calls.length = 0;
        let issTs = 1784953269;
        handler = u => u.includes('wheretheiss')
          // Far from home + iss:true, so the above-horizon edge never fires and
          // every update below is routine.
          ? { latitude: -16.7, longitude: 90.1, altitude: 418.9, velocity: 27586.1, timestamp: issTs }
          : ring(1);
        const { p } = await boot(makeStore({
          weather: WEATHER, flights: { enabled: true, source: 'cloud', radiusNm: 30, iss: true },
        }));
        await waitFor(() => p.issNow !== null);
        ok('11n: first ISS fix landed', p.issNow !== null);

        const cfgRev0 = p.configRev, fRev0 = p.flightsRev;
        issTs += 10;                                  // the feed's fix advanced
        await p._pollIss();
        ok('11n: an advanced ISS fix bumps flightsRev', p.flightsRev > fRev0,
          `${fRev0}→${p.flightsRev}`);
        ok('11n: ISS fix stored', p.issNow?.tsMs === issTs * 1000, String(p.issNow?.tsMs));
        ok('11n: routine ISS update emits NO config', p.configRev === cfgRev0,
          `${cfgRev0}→${p.configRev}`);

        // An unchanged timestamp is not even a data change.
        const fRev1 = p.flightsRev;
        await p._pollIss();
        ok('11n: an unchanged ISS timestamp bumps nothing',
          p.flightsRev === fRev1 && p.configRev === cfgRev0);
        quiesce(p);
      }

      // (e) a failing FIRST poll with nothing cached IS a status transition
      // (→ 'error') and must repaint so the UI can surface it.
      {
        calls.length = 0;
        handler = () => ring(2);
        const { p } = await boot(makeStore({
          weather: WEATHER, flights: { enabled: false, source: 'cloud', radiusNm: 30, iss: false },
        }));
        await sleep(60);
        handler = () => null;                          // every fetch fails
        const cfgRev0 = p.configRev;
        p.setFlights(f => { f.enabled = true; });      // setFlights itself emits…
        await waitFor(() => p.flightsStatus === 'error');
        const cfgRevErr = p.configRev;
        ok('11o: no data + failed fetch → status error', p.flightsStatus === 'error',
          p.flightsStatus);
        ok('11o: the error transition emitted config', cfgRevErr > cfgRev0,
          `${cfgRev0}→${cfgRevErr}`);
        // …but a SECOND failing poll is no longer a transition — silent.
        await p._pollFlights();
        ok('11o: a repeat error poll emits no further config',
          p.configRev === cfgRevErr, `${cfgRevErr}→${p.configRev}`);
        quiesce(p);

      // (p) EMERGENCY alerts (research §2 / §5.5). The loudest trigger in the
      // feature: severity 'error', no 3 nm overhead gate, and — unlike every
      // other flight alert — an ACTIVE emergency must not age out of the 15 min
      // retention window while the aircraft is still declaring one.
      {
        calls.length = 0;
        handler = () => ring(1);
        const { p } = await boot(makeStore({
          weather: WEATHER, flights: { enabled: false, source: 'cloud', iss: false },
        }));
        const savedNow = Date.now;
        let NOW = Date.parse('2026-07-25T12:00:00Z');
        Date.now = () => NOW;
        const advMin = m => { NOW += m * 60000; };
        // Config assigned DIRECTLY (not via setFlights) so no poll timer starts
        // — _computeFlightAlerts is driven explicitly, the flights-ui-test idiom.
        p.store.flights = { enabled: true, source: 'cloud', iss: false };
        const mk = (hex, over) => ({
          hex, callsign: null, lat: 47.6, lon: -122.3, altFt: 9000, gsKt: null,
          trackDeg: null, vertRateFpm: null, category: null, seenPosS: 0,
          military: false, reg: null, typeCode: null, typeDesc: null, operator: null,
          emergency: null, squawk: null, interesting: false, pia: false, ladd: false,
          distNm: 12, ...over,
        });
        const emergs = () => p.flightAlerts.filter(a => a.id.startsWith('flight:emerg:'));
        const reset = () => {
          p.flightAlerts = [];
          p._flightAlertDismissed = new Set();
          p._flightAlertAt = new Map();
          p.householdEvents = [];
          p.issNow = null;
        };

        // Squawk 7700, 12 nm out — far outside the 3 nm low-overflight gate.
        reset();
        p.flightsNow = [mk('a1b2c3', { callsign: 'SWA1234', squawk: '7700', distNm: 12 })];
        const chg0 = p._computeFlightAlerts();
        ok('11p: squawk 7700 raises one emergency alert', emergs().length === 1, `n=${emergs().length}`);
        ok('11p: emergency id is per-hex', emergs()[0]?.id === 'flight:emerg:a1b2c3', emergs()[0]?.id);
        ok('11p: emergency severity is error', emergs()[0]?.severity === 'error', emergs()[0]?.severity);
        ok('11p: emergency source is flight', emergs()[0]?.source === 'flight');
        ok('11p: emergency is dismissible', emergs()[0]?.dismissible === true);
        ok('11p: title names the callsign + the squawk',
          /^EMERGENCY: SWA1234 squawking 7700$/.test(emergs()[0]?.title ?? ''), emergs()[0]?.title);
        ok('11p: a new emergency reports changed', chg0 === true);
        ok('11p: emergency ignores the 3 nm overhead gate (12 nm still fires)',
          emergs().length === 1 && /12\.0 nm/.test(emergs()[0]?.message ?? ''), emergs()[0]?.message);

        // Still declaring 20 minutes later: past FLIGHT_ALERT_TTL_MS (15 min),
        // and it must NOT be pruned — nor churn the id list (LIVE-path).
        const created0 = emergs()[0]?.createdAt;
        advMin(20);
        const chg1 = p._computeFlightAlerts();
        ok('11p: an ACTIVE emergency survives the 15 min prune', emergs().length === 1,
          `n=${emergs().length}`);
        ok('11p: refreshed in place — createdAt preserved', emergs()[0]?.createdAt === created0,
          `${created0} → ${emergs()[0]?.createdAt}`);
        ok('11p: refreshing a persisting emergency reports NO change (no configRev bump)',
          chg1 === false);

        // The aircraft stops declaring → the notice ages out normally.
        p.flightsNow = [mk('a1b2c3', { callsign: 'SWA1234', squawk: '1200' })];
        p._computeFlightAlerts();
        ok('11p: cleared emergency past the TTL is pruned', emergs().length === 0,
          `n=${emergs().length}`);

        // The `emergency` enum fires on its own (it is a SUPERSET of the
        // squawks — lifeguard/minfuel/downed have no code of their own), and a
        // routine 1200 must never be announced as "squawking 1200".
        reset();
        p.flightsNow = [mk('bbb111', { callsign: 'LIFE1', emergency: 'lifeguard', squawk: '1200' })];
        p._computeFlightAlerts();
        ok('11p: `emergency` enum fires without an emergency squawk', emergs().length === 1);
        ok('11p: title reports the enum, not the routine squawk',
          emergs()[0]?.title === 'EMERGENCY: LIFE1 squawking lifeguard', emergs()[0]?.title);

        // 7600/7500 also fire; a normalized "none" never does.
        for (const [sq, label] of [['7600', 'nordo'], ['7500', 'unlawful']]) {
          reset();
          p.flightsNow = [mk('ccc222', { squawk: sq })];
          p._computeFlightAlerts();
          ok(`11p: squawk ${sq} (${label}) fires`, emergs().length === 1);
        }
        reset();
        p.flightsNow = [mk('ddd333', { squawk: '1200', emergency: null })];
        p._computeFlightAlerts();
        ok('11p: an ordinary aircraft raises nothing', emergs().length === 0);

        // No callsign → the uppercase hex, like the other triggers.
        reset();
        p.flightsNow = [mk('a7d588', { squawk: '7700' })];
        p._computeFlightAlerts();
        ok('11p: no callsign → uppercase hex in the title',
          /^EMERGENCY: A7D588 /.test(emergs()[0]?.title ?? ''), emergs()[0]?.title);

        // Two emergencies → two distinct per-hex alerts.
        reset();
        p.flightsNow = [mk('e1e1e1', { squawk: '7700' }), mk('e2e2e2', { emergency: 'downed' })];
        p._computeFlightAlerts();
        ok('11p: two emergencies → two distinct alerts', emergs().length === 2,
          `n=${emergs().length}`);

        // Dismissal: local mute, then a re-arm once the 10 min cooldown passes
        // (stable per-hex ids would otherwise mute that aircraft forever).
        reset();
        p.flightsNow = [mk('f0f0f0', { callsign: 'EMG1', squawk: '7700' })];
        p._computeFlightAlerts();
        const target = emergs()[0];
        p.dismissAlert(target);
        ok('11p: dismissal removes the emergency', emergs().length === 0);
        advMin(5);
        p._computeFlightAlerts();
        ok('11p: dismissed emergency stays muted inside the cooldown', emergs().length === 0,
          `n=${emergs().length}`);
        advMin(6);                                    // 11 min total > 10 min
        p._computeFlightAlerts();
        ok('11p: a still-live emergency re-arms past the cooldown', emergs().length === 1,
          `n=${emergs().length}`);
        ok('11p: the re-armed alert is freshly stamped',
          emergs()[0]?.createdAt === new Date(NOW).toISOString(), emergs()[0]?.createdAt);

        // The newest-wins cap must never be the thing that mutes an emergency.
        reset();
        p.store.flights = { enabled: true, source: 'cloud', iss: false, alerts: { watch: ['TST'] } };
        const many = [];
        for (let i = 0; i < 8; i++) many.push(mk('c' + String(i).padStart(5, '0'), { callsign: 'TST' + i }));
        many.push(mk('9f9f9f', { callsign: 'MAYDAY1', squawk: '7700' }));
        p.flightsNow = many;
        p._computeFlightAlerts();
        ok('11p: emergency survives the newest-wins cap alongside 8 watch alerts',
          emergs().length === 1, `alerts=${p.flightAlerts.length} emerg=${emergs().length}`);
        ok('11p: the cap dropped a WATCH alert instead',
          p.flightAlerts.filter(a => a.id.startsWith('flight:watch:')).length === 7,
          `watch=${p.flightAlerts.filter(a => a.id.startsWith('flight:watch:')).length}`);

        // Disabled feature → no emergency alerts at all.
        reset();
        p.store.flights = { enabled: false, source: 'cloud', iss: false };
        p.flightsNow = [mk('aaa999', { squawk: '7700' })];
        p._computeFlightAlerts();
        ok('11p: flights disabled → no emergency alert', emergs().length === 0);

        Date.now = savedNow;
        p.store.flights = { enabled: false, source: 'cloud', iss: false };
      }

      // (q) labelFields sanitization rides setFlights (the watch-list precedent:
      // normalize at the STORE boundary, not in the settings UI, so an import or

      {

        p.setFlights(f => { f.labelFields = ['callsign', 'ALT', ' reg ', 'callsign', 'bogus', 42, 'dist']; });
        ok('11q: setFlights filters/lowercases/dedupes labelFields',
          JSON.stringify(p.store.flights.labelFields) === JSON.stringify(['callsign', 'alt', 'reg', 'dist']),
          JSON.stringify(p.store.flights.labelFields));
        p.setFlights(f => { f.labelFields = ['nope', 'alsonope']; });
        ok('11q: an all-unknown list becomes undefined (= default plate)',
          p.store.flights.labelFields === undefined, String(p.store.flights.labelFields));
        p.setFlights(f => { f.labelFields = []; });
        ok('11q: an empty list becomes undefined', p.store.flights.labelFields === undefined);
        p.setFlights(f => { f.labelFields = 'callsign'; });
        ok('11q: a non-array becomes undefined', p.store.flights.labelFields === undefined);
        p.setFlights(f => { f.labelFields = ['type', 'operator', 'speed', 'trend', 'squawk']; });
        p.setFlights(f => { f.radiusNm = 33; });
        ok('11q: an unrelated setFlights leaves labelFields intact',
          JSON.stringify(p.store.flights.labelFields)
            === JSON.stringify(['type', 'operator', 'speed', 'trend', 'squawk']),
          JSON.stringify(p.store.flights.labelFields));
        p.setFlights(f => { f.beacons = false; f.privacyDim = false; });
        await p.saveConfigNow();
        const saved = stub.peek('diorama-cfg-default');
        ok('11q: labelFields + beacons + privacyDim persist through the store',
          JSON.stringify(saved?.flights?.labelFields) === JSON.stringify(['type', 'operator', 'speed', 'trend', 'squawk'])
          && saved?.flights?.beacons === false && saved?.flights?.privacyDim === false,
          JSON.stringify(saved?.flights));
        quiesce(p);
      }

      globalThis.fetch = realFetch;
    }

    // ── 9. Registry-enrichment field extraction (research §1.2 / §1.5) ──────
    // The identity fields the aggregator's OWN database adds on top of the raw
    // Mode-S broadcast — an aircraft never transmits its tail number or owner
    // over the air, so all of them are nullable by design.
    {
      const cloud = F.normalizeAircraftList(LAX);
      const raw = LAX.ac;
      const airborne = raw.filter(a => a.alt_baro !== 'ground');
      const count = k => cloud.filter(a => a[k] !== null).length;

      ok('12: reg (`r`) extracted for every DB-matched aircraft', count('reg') === 42,
        `n=${count('reg')} of ${cloud.length}`);
      ok('12: typeCode (`t`) extracted', count('typeCode') === 40, `n=${count('typeCode')}`);
      ok('12: typeDesc (`desc`) extracted', count('typeDesc') === 40, `n=${count('typeDesc')}`);
      ok('12: operator (`ownOp`) extracted', count('operator') === 37, `n=${count('operator')}`);
      ok('12: squawk extracted', count('squawk') === 42, `n=${count('squawk')}`);
      ok('12: ~15% of live traffic has NO type designator (§0.6 — the fallback ladder is not an edge case)',
        cloud.length - count('typeCode') === 4, `missing=${cloud.length - count('typeCode')}`);
      ok('12: typeCode is uppercased', cloud.every(a => a.typeCode === null || a.typeCode === a.typeCode.toUpperCase()));
      ok('12: every enrichment field is a trimmed string or null', cloud.every(a =>
        [a.reg, a.typeCode, a.typeDesc, a.operator, a.squawk].every(
          v => v === null || (typeof v === 'string' && v === v.trim() && v !== ''))));
      ok('12: fixture emergency is always "none" → normalized to null',
        cloud.every(a => a.emergency === null)
        && airborne.filter(a => a.emergency === 'none').length === 42,
        `nonNull=${cloud.filter(a => a.emergency !== null).length}`);
      const b752 = cloud.find(a => a.typeCode === 'B752');
      ok('12: a known entry carries the full identity set',
        !!b752 && b752.reg !== null && b752.typeDesc !== null, JSON.stringify(
          b752 && { r: b752.reg, t: b752.typeCode, d: b752.typeDesc, o: b752.operator }));

      // dbFlags bit 8 (LADD) — the only bit this real capture exercises.
      const laddRaw = raw.filter(a => a.dbFlags === 8);
      const ladd = cloud.filter(a => a.ladd);
      ok('12: the fixture carries 4 LADD-flagged aircraft', laddRaw.length === 4, `n=${laddRaw.length}`);
      ok('12: 2 of them are airborne → 2 survive the ground filter', ladd.length === 2,
        `n=${ladd.length} (${ladd.map(a => a.hex).join(',')})`);
      ok('12: LADD entries are the expected hexes',
        ladd.map(a => a.hex).sort().join(',') === 'a7d588,a8bb3b', ladd.map(a => a.hex).join(','));
      ok('12: LADD does NOT set military/pia/interesting',
        ladd.every(a => !a.military && !a.pia && !a.interesting));
      ok('12: §0.2 — the source keeps a LADD aircraft\'s registration anyway',
        ladd.every(a => a.reg !== null && a.typeCode !== null),
        ladd.map(a => `${a.reg}/${a.typeCode}`).join(' '));
      ok('12: no military/PIA/interesting anywhere in this capture',
        cloud.every(a => !a.military && !a.pia && !a.interesting));

          'B744', 'B748', 'B763', 'B764', 'B772', 'B77L', 'B77W', 'B788', 'B789', 'B78X',
          'C17', 'C5M', 'K35R'],
        'bizjet': ['CRJ1', 'CRJ2', 'CRJ7', 'CRJ9', 'E135', 'E145', 'E35L', 'C25A', 'C25B',
          'C525', 'C56X', 'C680', 'C68A', 'C700', 'CL30', 'CL35', 'CL60', 'GLF4', 'GLF5',
          'GLF6', 'G280', 'GA5C', 'GA6C', 'LJ35', 'LJ45', 'LJ60', 'F2TH', 'FA7X', 'FA8X',
          'H25B', 'E50P', 'E55P', 'GL5T', 'GL7T', 'F15', 'F16', 'F18', 'F35'],
        'heli': ['R22', 'R44', 'R66', 'B06', 'B407', 'B429', 'H500', 'EC30', 'EC35', 'EC45',
          'EC75', 'H145', 'H175', 'AS50', 'AS55', 'AS65', 'A139', 'S76', 'S92', 'UH60',
          'H60', 'MH60', 'CH47'],
      };
      let expectedCount = 0;
      for (const [want, list] of Object.entries(EXPECTED)) {
        expectedCount += list.length;
        // Resolved with a DELIBERATELY WRONG category so only the table can be
        // answering (A5 would otherwise say widebody for everything).
        const bad = list.filter(t => AT.aircraftArchetype(t, 'A5') !== want);
        ok(`16: every ${want} designator resolves (${list.length} rows)`, bad.length === 0,
          bad.length ? `mismatched: ${bad.join(',')}` : '');
        const badNoCat = list.filter(t => AT.aircraftArchetype(t, null) !== want);
        ok(`16: …and with no category at all (${want})`, badNoCat.length === 0,
          badNoCat.length ? `mismatched: ${badNoCat.join(',')}` : '');
      }
      const tableKeys = Object.keys(AT.TYPE_ARCHETYPE);
      const expectedKeys = Object.values(EXPECTED).flat();
      ok('16: TYPE_ARCHETYPE has no designator the doc does not list',
        tableKeys.filter(k => !expectedKeys.includes(k)).length === 0,
        tableKeys.filter(k => !expectedKeys.includes(k)).join(','));
      ok('16: the doc lists no designator the table is missing',
        expectedKeys.filter(k => !tableKeys.includes(k)).length === 0,
        expectedKeys.filter(k => !tableKeys.includes(k)).join(','));
      ok('16: table size matches the transcription', tableKeys.length === expectedCount,
        `table=${tableKeys.length} doc=${expectedCount}`);
      ok('16: no duplicate designators in the transcription',
        new Set(expectedKeys).size === expectedKeys.length);
      ok('16: every value is one of the 8 archetypes', tableKeys.every(k =>
        ['ga-high', 'ga-low', 'twin-prop', 'turboprop', 'narrowbody', 'widebody', 'bizjet', 'heli']
          .includes(AT.TYPE_ARCHETYPE[k])));

      // Spotlights — the calls the research pass singled out.
      ok('16: §3.3 CRJ family is BIZJET geometry, not narrowbody',
        ['CRJ1', 'CRJ2', 'CRJ7', 'CRJ9'].every(t => AT.aircraftArchetype(t, 'A3') === 'bizjet'));
      ok('16: §3.3 old ERJ135/145 are bizjet too',
        ['E135', 'E145', 'E35L'].every(t => AT.aircraftArchetype(t, 'A3') === 'bizjet'));
      ok('16: §3.3 the NEWER E-Jets are underwing narrowbodies',
        ['E170', 'E175', 'E190', 'E195', 'E75L'].every(t => AT.aircraftArchetype(t, 'A3') === 'narrowbody'));
      ok('16: §3.4 PC-12 is LOW wing (not a Caravan)', AT.aircraftArchetype('PC12', 'A1') === 'ga-low');
      ok('16: §3.4 C208 Caravan is high wing', AT.aircraftArchetype('C208', 'A1') === 'ga-high');
      ok('16: §3.4 King Air is a low-wing twin, not a regional turboprop',
        ['BE20', 'B350', 'BE9L'].every(t => AT.aircraftArchetype(t, 'A2') === 'twin-prop'));
      ok('16: §3.4 ATR/Dash-8 are the high-wing T-tail turboprops',
        ['AT72', 'DH8D'].every(t => AT.aircraftArchetype(t, 'A2') === 'turboprop'));
      ok('16: §0.7 the 757 stays NARROWBODY even self-reporting A4',
        AT.aircraftArchetype('B752', 'A4') === 'narrowbody'
        && AT.aircraftArchetype('B753', 'A4') === 'narrowbody');
      ok('16: §3.4 a big bizjet reporting A3 is still a bizjet',
        AT.aircraftArchetype('GL5T', 'A3') === 'bizjet');
      ok('16: §3.4 C-130 is turboprop, C-17 is widebody (the military split)',
        AT.aircraftArchetype('C130', null) === 'turboprop' && AT.aircraftArchetype('C17', null) === 'widebody');
      ok('16: type designator OUTRANKS the category ladder',
        AT.aircraftArchetype('R44', 'A3') === 'heli' && AT.aircraftArchetype('A388', 'A1') === 'widebody');
      ok('16: lookup is case/whitespace tolerant',
        AT.aircraftArchetype(' c172 ', null) === 'ga-high' && AT.aircraftArchetype('b78x', null) === 'widebody');
      ok('16: an open-ended RV designator resolves by prefix',
        AT.aircraftArchetype('RV7A', null) === 'ga-low' && AT.aircraftArchetype('RV6A', 'A1') === 'ga-low');

      // Every type designator the real fixture contains resolves off the table
      // (no fixture aircraft falls through to the category ladder).
      const cloud = F.normalizeAircraftList(LAX);
      const fixtureTypes = [...new Set(cloud.map(a => a.typeCode).filter(Boolean))];
      const unmapped = fixtureTypes.filter(t => !AT.TYPE_ARCHETYPE[t]);
      ok('16: every type designator in the real capture is in the table', unmapped.length === 0,
        `unmapped: ${unmapped.join(',')} of ${fixtureTypes.length}`);
    }

    // ── 14. Category fallback ladder (§3.6) + defensive behavior ────────────
    {
      const A = c => AT.aircraftArchetype(null, c);
      ok('17: A7 → heli', A('A7') === 'heli');
      ok('17: A5 → widebody', A('A5') === 'widebody');
      ok('17: A4 → narrowbody, NEVER widebody', A('A4') === 'narrowbody');
      ok('17: A3 → narrowbody (the statistical default)', A('A3') === 'narrowbody');
      ok('17: A2 → twin-prop', A('A2') === 'twin-prop');
      ok('17: A1 → ga-high (the Cessna plurality)', A('A1') === 'ga-high');
      ok('17: A6 → bizjet (nearest small-fast-jet shape)', A('A6') === 'bizjet');
      ok('17: A0 → narrowbody default', A('A0') === 'narrowbody');
      ok('17: no category (TIS-B ghost) → narrowbody', A(null) === 'narrowbody' && A('') === 'narrowbody');
      ok('17: an unknown type falls THROUGH to the ladder',
        AT.aircraftArchetype('ZZZZ', 'A7') === 'heli' && AT.aircraftArchetype('ZZZZ', 'A1') === 'ga-high');
      ok('17: C*/B3 defended (callers pre-filter, this never throws)',
        ['C1', 'C2', 'C5', 'B3'].every(c => A(c) === 'narrowbody'));
      ok('17: lowercase category resolves', A('a7') === 'heli' && A('a5') === 'widebody');
      let threw = false, allValid = true;
      const ARCH = ['ga-high', 'ga-low', 'twin-prop', 'turboprop', 'narrowbody', 'widebody', 'bizjet', 'heli'];
      for (const t of [undefined, null, 42, {}, [], '', '  ', 'A'.repeat(300), '💥']) {
        for (const c of [undefined, null, 7, {}, '', 'ZZ', '💥']) {
          try { if (!ARCH.includes(AT.aircraftArchetype(t, c))) allValid = false; }
          catch { threw = true; }
        }
      }
      ok('17: garbage inputs never throw', !threw);
      ok('17: garbage inputs always return a real archetype', allValid);
    }

    // ── 15. Legacy 3-way wrapper (stale-chunk safety) ───────────────────────
    {
      ok('18: legacyModelKind maps heli → heli', AT.legacyModelKind('heli') === 'heli');
      ok('18: all four prop-ish archetypes → prop',
        ['ga-high', 'ga-low', 'twin-prop', 'turboprop'].every(a => AT.legacyModelKind(a) === 'prop'));
      ok('18: all three jet archetypes → jet',
        ['narrowbody', 'widebody', 'bizjet'].every(a => AT.legacyModelKind(a) === 'jet'));
      // The shipped renderer still calls aircraftModelKind(fp) — it must keep
      // agreeing with the new ladder on the category-only path it can see.
      const cats = ['A0', 'A1', 'A2', 'A3', 'A4', 'A5', 'A6', 'A7', null, 'D7'];
      const agree = cats.every(c =>
        F.aircraftModelKind({ category: c }) === AT.legacyModelKind(AT.aircraftArchetype(null, c)));
      ok('18: the legacy wrapper agrees with the archetype ladder for every category', agree,
        cats.map(c => `${c}:${F.aircraftModelKind({ category: c })}`).join(' '));
      ok('18: legacy wrapper unchanged for the real fixture',
        F.normalizeAircraftList(LAX).every(a =>
          ['prop', 'jet', 'heli'].includes(F.aircraftModelKind(a))));
    }

    // ── 16. Label-field sanitizer (pure, §4.1) ──────────────────────────────
    {
      const S = F.sanitizeLabelFields;
      ok('19: FLIGHT_LABEL_FIELDS is the documented key set',
        F.FLIGHT_LABEL_FIELDS.join(',') === 'callsign,reg,type,operator,alt,speed,trend,squawk,dist',
        F.FLIGHT_LABEL_FIELDS.join(','));
      ok('19: the default plate is callsign + alt',
        F.FLIGHT_LABEL_FIELDS_DEFAULT.join(',') === 'callsign,alt');
      ok('19: known keys survive in the caller\'s order',
        JSON.stringify(S(['alt', 'callsign'])) === JSON.stringify(['alt', 'callsign']));
      ok('19: unknown keys dropped', JSON.stringify(S(['callsign', 'nope'])) === JSON.stringify(['callsign']));
      ok('19: case + whitespace normalized', JSON.stringify(S([' REG '])) === JSON.stringify(['reg']));
      ok('19: duplicates dropped', JSON.stringify(S(['alt', 'alt', 'ALT'])) === JSON.stringify(['alt']));
      ok('19: non-string entries ignored', JSON.stringify(S([42, null, {}, 'dist'])) === JSON.stringify(['dist']));
      ok('19: empty / all-unknown → undefined',
        S([]) === undefined && S(['zzz']) === undefined);
      ok('19: non-array → undefined',
        S(undefined) === undefined && S(null) === undefined && S('callsign') === undefined && S(7) === undefined);
      ok('19: every documented key round-trips',
        JSON.stringify(S([...F.FLIGHT_LABEL_FIELDS])) === JSON.stringify([...F.FLIGHT_LABEL_FIELDS]));
    }
  } catch (err) {
    ok('HARNESS threw', false, String(err && err.stack || err));
  }

  // ── Report ────────────────────────────────────────────────────────────────
  const pass = results.filter(r => r.pass).length;
  const total = results.length;
  const bad = results.filter(r => !r.pass);
  document.title = `FLIGHTS ${bad.length ? 'FAIL' : 'PASS'} ${pass}/${total}`
    + (bad.length ? ' :: ' + bad.slice(0, 6).map(r => r.name).join(' | ') : '');
  const sum = document.getElementById('summary');
  sum.textContent = document.title;
  sum.className = bad.length ? 'badbg' : 'okbg';
  document.getElementById('rows').innerHTML = results.map(r =>
    `<div class="row"><span class="name">${r.name}</span>` +
    `<span class="${r.pass ? 'pass' : 'fail'}">${r.pass ? 'PASS' : 'FAIL'} ` +
    `<span class="extra">${r.extra}</span></span></div>`).join('');
</script>
