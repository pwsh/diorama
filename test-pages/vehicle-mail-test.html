<!doctype html>
<meta charset="utf-8">
<title>vehicle-mail test</title>
<style>html,body{margin:0;background:#111}#c{width:1280px;height:880px}</style>
<div id="c"></div>
<script type="module">
  // Phase 1b — garage-bay vehicle presence, EV charging status, mail/packages.
  //   car    — solid when bound+on / unbound; GHOSTED (transparent 0.15, no blob)
  //            when bound but presence sensor ≠ 'on'
  //   ev     — ev_charger port LED color per resolved status (charging/full/error/
  //            idle); charging registers a per-frame pulse in _evPulses
  //   chg    — a charging charger within ~1500 mm of a car adds a green port glow
  //            to the car + pulses; far charger does not
  //   mail   — mailbox flagEntity 'on' raises the flag (vertical, paddle above
  //            the roof); count > 0 floats a badge sprite only; the door stays
  //            closed; unbound = flag-down/no badge
  //   dispose— the badge sprite's CanvasTexture is freed on rebuild
  const mod = await import('./assets/three-renderer.js?v=' + Date.now());
  const r = new mod.ThreeDRenderer(document.getElementById('c'));
  await r.load();

  const results = [];
  const assert = (name, cond, detail = '') => results.push(`${cond ? 'PASS' : 'FAIL'} ${name}${detail ? ' (' + detail + ')' : ''}`);
  const meshCount = (o) => { let n = 0; o.traverse(x => { if (x.isMesh) n++; }); return n; };
  const findByFixtureId = (grp, id) => {
    let found = null;
    grp.traverse(o => { if (!found && o.userData && o.userData.fixtureId === id) found = o; });
    return found;
  };
  const hasGhostMat = (grp) => {
    let f = false;
    grp.traverse(o => { if (o.isMesh && o.material && o.material.transparent && Math.abs((o.material.opacity ?? 1) - 0.15) < 0.03) f = true; });
    return f;
  };
  const emissiveMeshes = (grp) => {
    const out = [];
    grp.traverse(o => { if (o.isMesh && o.material && o.material.emissive && o.material.emissive.getHex && o.material.emissive.getHex() !== 0 && (o.material.emissiveIntensity ?? 0) > 0) out.push(o); });
    return out;
  };
  const chMax = (hex) => {
    const rr = (hex >> 16) & 255, gg = (hex >> 8) & 255, bb = hex & 255;
    if (rr >= gg && rr >= bb) return 'r';
    if (gg >= rr && gg >= bb) return 'g';
    return 'b';
  };

  const baseFloor = (furniture) => ({
    id: 'f1', name: 'F', w: 8000, d: 6000,
    walls: [], furniture: furniture || [], lights: [], switches: [],
    sensors: [], motionSensors: [], envSensors: [], doors: [], windows: [],
    bg: null, model3d: null, look3d: null, rooms: [],
  });
  const build = (furniture, states) => {
    r.updateFloor(baseFloor(furniture), { preset: 'day' }, undefined, undefined, id => states[id] || null);
  };

  // ── car: solid vs ghosted ───────────────────────────────────────────────
  function testCar() {
    const carOn  = { id: 'car_on',  x: 1000, y: 1000, w: 1850, h: 4800, kind: 'car', entity_id: 'binary_sensor.bay1' };
    const carOff = { id: 'car_off', x: 4000, y: 1000, w: 1850, h: 4800, kind: 'car', entity_id: 'binary_sensor.bay2' };
    const carUnb = { id: 'car_unb', x: 6500, y: 1000, w: 1850, h: 4800, kind: 'car', entity_id: null };
    const states = { 'binary_sensor.bay1': { state: 'on', attributes: {} }, 'binary_sensor.bay2': { state: 'off', attributes: {} } };
    build([carOn, carOff, carUnb], states);
    const gOn = findByFixtureId(r._floorGroup, 'car_on');
    const gOff = findByFixtureId(r._floorGroup, 'car_off');
    const gUnb = findByFixtureId(r._floorGroup, 'car_unb');
    assert('car group tagged with fixtureId', !!gOn && !!gOff && !!gUnb);
    assert('bound+on car is SOLID (no 0.15 ghost material)', gOn && !hasGhostMat(gOn));
    assert('bound+off car is GHOSTED (0.15 transparent material)', gOff && hasGhostMat(gOff), gOff ? `ghost=${hasGhostMat(gOff)}` : '');
    assert('unbound car is SOLID', gUnb && !hasGhostMat(gUnb));
    assert('solid car has emissive light hints; ghost car has none',
      gOn && emissiveMeshes(gOn).length >= 2 && gOff && emissiveMeshes(gOff).length === 0,
      `on=${gOn?emissiveMeshes(gOn).length:'-'} off=${gOff?emissiveMeshes(gOff).length:'-'}`);
    assert('solid car has more meshes than ghost car',
      gOn && gOff && meshCount(gOn) > meshCount(gOff), `on=${meshCount(gOn)} off=${meshCount(gOff)}`);
    assert('cars are NOT raycast-clickable (plain furniture)',
      !r._mediaClickables.includes(gOn) && (gOn && gOn.userData.kind === undefined));
  }

  // ── ev_charger: status matrix ───────────────────────────────────────────
  function testEv() {
    const mk = (id, x, ent) => ({ id, x, y: 3000, w: 350, h: 250, kind: 'ev_charger', evCharger: { statusEntity: ent } });
    const chargers = [ mk('ev_chg', 500, 'sensor.a'), mk('ev_full', 1500, 'sensor.b'), mk('ev_err', 2500, 'sensor.c'), mk('ev_idle', 3500, 'sensor.d') ];
    const states = {
      'sensor.a': { state: 'charging', attributes: {} },
      'sensor.b': { state: 'complete', attributes: {} },
      'sensor.c': { state: 'error', attributes: {} },
      'sensor.d': { state: 'idle', attributes: {} },
    };
    build(chargers, states);
    const led = (id) => { const g = findByFixtureId(r._floorGroup, id); const em = g ? emissiveMeshes(g) : []; return em.length ? em[0].material.emissive.getHex() : null; };
    const chg = led('ev_chg'), full = led('ev_full'), err = led('ev_err'), idle = led('ev_idle');
    assert('charging LED is green-dominant', chg != null && chMax(chg) === 'g', chg != null ? '#' + chg.toString(16) : '');
    assert('full LED is green-dominant (steady)', full != null && chMax(full) === 'g', full != null ? '#' + full.toString(16) : '');
    assert('error LED is red-dominant', err != null && chMax(err) === 'r', err != null ? '#' + err.toString(16) : '');
    assert('idle LED is NOT green-dominant (dim slate)', idle != null && chMax(idle) !== 'g', idle != null ? '#' + idle.toString(16) : '');
    assert('only the charging charger pulses (_evPulses == 1)', r._evPulses.length === 1, `pulses=${r._evPulses.length}`);
  }

  // ── charging car indicator via adjacency ────────────────────────────────
  function testChargingCar() {
    const greenPort = (grp) => emissiveMeshes(grp).some(m => { const h = m.material.emissive.getHex(); const rr = (h >> 16) & 255; return chMax(h) === 'g' && rr < 90; });
    const car = { id: 'ccar', x: 1000, y: 1000, w: 1850, h: 4800, kind: 'car', entity_id: null };
    const near = { id: 'nchg', x: 2000, y: 1000, w: 350, h: 250, kind: 'ev_charger', evCharger: { statusEntity: 'sensor.p' } };
    const states = { 'sensor.p': { state: 'charging', attributes: { battery_level: 62 } } };
    build([car, near], states);
    let g = findByFixtureId(r._floorGroup, 'ccar');
    assert('adjacent charging charger adds a green port glow to the car', g && greenPort(g));
    assert('car port + charger LED both pulse (_evPulses == 2)', r._evPulses.length === 2, `pulses=${r._evPulses.length}`);
    // Far charger: no indicator.
    const far = { id: 'fchg', x: 6000, y: 1000, w: 350, h: 250, kind: 'ev_charger', evCharger: { statusEntity: 'sensor.p' } };
    build([{ ...car }, far], states);
    g = findByFixtureId(r._floorGroup, 'ccar');
    assert('far charger (> 1500 mm) does NOT charge-indicate the car', g && !greenPort(g));
    assert('only the far charger pulses (_evPulses == 1)', r._evPulses.length === 1, `pulses=${r._evPulses.length}`);
  }

  // ── mailbox: traditional US curbside tunnel box ──────────────────────────
  // Reference-photo geometry (the model was rebuilt against it):
  //   • flag DOWN (default) = the AUTHORED pose — the arm lies HORIZONTAL along
  //     the +X side, stepped paddle toward the REAR, rotation.x ~ 0.
  //   • flag UP (flagEntity 'on') = rotation.x ~ −π/2 — the arm stands VERTICAL
  //     and the paddle rides ABOVE the roofline (crest = HT).
  //   • the paddle plane stays PARALLEL to the box side face in BOTH poses (the
  //     paddle is thin in X and X is the only rotation axis), and the pivot sits
  //     on that side near the FRONT (front = local −Z).
  //   • the body carries an arched front DOOR (proud panel + arch), a latch tab
  //     standing above the crest, a painted "U.S. MAIL" decal plane, and an
  //     arched REAR CAP. The flag is red in both poses.
  // count > 0 shows only the BADGE and never raises the flag. The door is built
  // CLOSED always. The blend is seeded to its target on first build so a fresh
  // scene renders the correct pose without advancing.
  function testMailbox() {
    const groups = (grp) => grp.children.filter(o => o.type === 'Group');
    const sprites = (grp) => { const out = []; grp.traverse(o => { if (o.isSprite) out.push(o); }); return out; };
    // Kind defaults (geometry.ts FURNITURE_KINDS.mailbox) — the fixtures use the
    // real footprint so every assertion below is dimension-relative to them.
    const MB_W = 220, MB_D = 520, MB_HT = 1150;
    const mk = (id, x, mailCount) => ({ id, x, y: 1000, w: MB_W, h: MB_D, kind: 'mailbox', ...(mailCount ? { mailCount } : {}) });
    // mUp:    flagEntity 'on' + count 3 → flag UP + badge.
    // mCount: count 3, NO flagEntity   → flag DOWN + badge (count alone ≠ flag up).
    // mEmpty: count 0                  → flag DOWN, no badge.
    // mUnb:   unbound                  → flag DOWN, no badge.
    const mUp    = mk('mb_up',    1000, { countEntity: 'sensor.mail', flagEntity: 'binary_sensor.flag' });
    const mCount = mk('mb_count', 3000, { countEntity: 'sensor.mail' });
    const mEmpty = mk('mb_empty', 5000, { countEntity: 'sensor.mail2' });
    const mUnb   = mk('mb_unb',   7000, null);
    const states = {
      'sensor.mail': { state: '3', attributes: {} }, 'binary_sensor.flag': { state: 'on', attributes: {} },
      'sensor.mail2': { state: '0', attributes: {} },
    };
    build([mUp, mCount, mEmpty, mUnb], states);
    const gUp = findByFixtureId(r._floorGroup, 'mb_up');
    const gCount = findByFixtureId(r._floorGroup, 'mb_count');
    const gEmpty = findByFixtureId(r._floorGroup, 'mb_empty');
    const gUnb = findByFixtureId(r._floorGroup, 'mb_unb');
    // Group children order: [doorGrp, flagArm].
    const doorUp = groups(gUp)[0], flagUp = groups(gUp)[1];
    const flagCount = groups(gCount)[1], flagE = groups(gEmpty)[1], flagU = groups(gUnb)[1];
    const HALF_PI = Math.PI / 2;
    assert('count > 0 floats a badge sprite', sprites(gUp).length >= 1 && sprites(gCount).length >= 1, `up=${sprites(gUp).length} count=${sprites(gCount).length}`);
    assert('count 0 shows NO badge sprite', sprites(gEmpty).length === 0, `sprites=${sprites(gEmpty).length}`);
    assert('unbound mailbox shows NO badge sprite', sprites(gUnb).length === 0);
    assert('flag sensor on stands the flag UP (rotation.x ~ -π/2)', flagUp && Math.abs(flagUp.rotation.x + HALF_PI) < 0.02, flagUp ? `rx=${flagUp.rotation.x.toFixed(2)}` : '');
    assert('count > 0 alone does NOT raise the flag (rests DOWN, rotation.x ~ 0)', flagCount && Math.abs(flagCount.rotation.x) < 0.02, flagCount ? `rx=${flagCount.rotation.x.toFixed(2)}` : '');
    assert('no flag signal rests the flag DOWN (rotation.x ~ 0)', flagE && Math.abs(flagE.rotation.x) < 0.02, flagE ? `rx=${flagE.rotation.x.toFixed(2)}` : '');
    assert('unbound rests the flag DOWN', flagU && Math.abs(flagU.rotation.x) < 0.02);
    assert('front door stays CLOSED (doorGrp.rotation.x ~ 0)', doorUp && Math.abs(doorUp.rotation.x) < 0.02, doorUp ? `rx=${doorUp.rotation.x.toFixed(2)}` : '');

    // ── Flag + body GEOMETRY (world-measured in the piece's own frame, so the
    //    scene's X mirror + piece yaw drop out) ─────────────────────────────
    r._scene.updateMatrixWorld(true);
    const findTag = (g, key) => { let f = null; g.traverse(o => { if (!f && o.userData && o.userData[key]) f = o; }); return f; };
    const allTagged = (g, key) => { const out = []; g.traverse(o => { if (o.userData && o.userData[key]) out.push(o); }); return out; };
    // A scratch Vector3 borrowed off a real object (avoids importing three).
    const vec = (src, x, y, z) => { const t = src.position.clone(); t.set(x, y, z); return t; };
    const inFrame = (g, obj, x, y, z) => g.worldToLocal(obj.localToWorld(vec(obj, x, y, z)));
    const axisIn = (g, obj, x, y, z) => {
      const o0 = inFrame(g, obj, 0, 0, 0), o1 = inFrame(g, obj, x, y, z);
      const dx = o1.x - o0.x, dy = o1.y - o0.y, dz = o1.z - o0.z;
      const n = Math.hypot(dx, dy, dz) || 1;
      return { x: dx / n, y: dy / n, z: dz / n };
    };
    for (const [name, g, wantUp] of [['UP', gUp, true], ['DOWN', gEmpty, false]]) {
      const arm = findTag(g, 'mailFlagArm'), pad = findTag(g, 'mailFlagPaddle');
      if (!arm || !pad) { assert(`mailbox ${name}: flag arm + paddle present`, false); continue; }
      assert(`mailbox ${name}: flag arm + paddle present`, true);
      // 1. Paddle plane ∥ the side face: its THIN axis (local X) is the side
      //    normal (piece-local ±X) — |n·X̂| ≈ 1, and it has no Y/Z component.
      const n = axisIn(g, pad, 1, 0, 0);
      assert(`mailbox ${name}: paddle plane is parallel to the side face (normal = side normal)`,
        Math.abs(Math.abs(n.x) - 1) < 1e-6, `n=(${n.x.toFixed(4)},${n.y.toFixed(4)},${n.z.toFixed(4)})`);
      // 2. Paddle centre lies OUTBOARD on that side plane — same x in both poses
      //    (rotation about X cannot move it off the side).
      const c = inFrame(g, pad, 0, 0, 0);
      assert(`mailbox ${name}: paddle centre sits on the +X side face (x > W/2)`,
        c.x > MB_W / 2, `x=${c.x.toFixed(1)} halfW=${MB_W / 2}`);
      // 3. Pivot on the side, near the FRONT (front = local −Z ⇒ pivot z < 0).
      const piv = inFrame(g, arm, 0, 0, 0);
      assert(`mailbox ${name}: pivot is on the side face near the FRONT (z < 0)`,
        piv.x > MB_W / 2 && piv.z < 0 && piv.z > -MB_D / 2,
        `pivot=(${piv.x.toFixed(1)},${piv.y.toFixed(1)},${piv.z.toFixed(1)})`);
      // 4. Arm direction + paddle height vs the roofline.
      const dir = axisIn(g, arm, 0, 0, 1);
      const tip = inFrame(g, arm, 0, 0, arm.userData.armLen);
      if (wantUp) {
        assert('mailbox UP: arm stands VERTICAL (+Y)',
          dir.y > 0.999 && Math.abs(dir.z) < 0.03 && Math.abs(dir.x) < 1e-6,
          `dir=(${dir.x.toFixed(3)},${dir.y.toFixed(3)},${dir.z.toFixed(3)})`);
        assert('mailbox UP: the arm tip stands ABOVE its pivot',
          tip.y > piv.y + 100, `tipY=${tip.y.toFixed(1)} pivotY=${piv.y.toFixed(1)}`);
        assert('mailbox UP: the paddle head rides ABOVE the roofline (y > HT)',
          c.y > MB_HT, `padY=${c.y.toFixed(1)} crest=${MB_HT}`);
      } else {
        assert('mailbox DOWN: arm lies HORIZONTAL pointing at the REAR (+Z)',
          dir.z > 0.999 && Math.abs(dir.y) < 0.03 && Math.abs(dir.x) < 1e-6,
          `dir=(${dir.x.toFixed(3)},${dir.y.toFixed(3)},${dir.z.toFixed(3)})`);
        assert('mailbox DOWN: the arm tip runs rearward at the pivot height',
          tip.z > piv.z + 100 && Math.abs(tip.y - piv.y) < 1,
          `tip=(${tip.y.toFixed(1)},${tip.z.toFixed(1)}) pivot=(${piv.y.toFixed(1)},${piv.z.toFixed(1)})`);
        assert('mailbox DOWN: the paddle head sits BELOW the roofline (y < HT)',
          c.y < MB_HT, `padY=${c.y.toFixed(1)} crest=${MB_HT}`);
      }
      // 5. Stepped paddle: a tall head + a lower step, both on the arm, both red.
      const step = findTag(g, 'mailFlagStep');
      assert(`mailbox ${name}: paddle is STEPPED (head + a lower step box)`,
        !!step && step.geometry.parameters.height < pad.geometry.parameters.height,
        step ? `head=${pad.geometry.parameters.height.toFixed(0)} step=${step.geometry.parameters.height.toFixed(0)}` : 'no step');
      // Red in BOTH poses (the old build dimmed the lowered flag). Compared
      // channel-wise, not against the literal: _mat() pushes saturation.
      const ph = pad.material.color.getHex();
      assert(`mailbox ${name}: flag is RED in this pose (head + step share it)`,
        chMax(ph) === 'r' && ((ph >> 16) & 255) > 200 && (ph & 255) < 80
        && !!step && step.material.color.getHex() === ph,
        `head=#${pad.material.color.getHexString()}`);
    }
    // 6. The paddle's side-offset is IDENTICAL up vs down (pivot on the plane).
    {
      const pu = findTag(gUp, 'mailFlagPaddle'), pd = findTag(gEmpty, 'mailFlagPaddle');
      const xu = inFrame(gUp, pu, 0, 0, 0).x, xd = inFrame(gEmpty, pd, 0, 0, 0).x;
      assert('mailbox: paddle stays on the same side plane in both poses',
        Math.abs(xu - xd) < 1e-6, `up=${xu.toFixed(3)} down=${xd.toFixed(3)}`);
    }
    // 7. Body detailing: arched door at the FRONT, latch above the crest, the
    //    painted U.S. MAIL decal plane, and the arched rear cap at the BACK.
    {
      const g = gEmpty;
      const dArch = findTag(g, 'mailDoorArch');
      assert('mailbox: arched DOOR panel is present at the front (z < -D/2)',
        !!dArch && inFrame(g, dArch, 0, 0, 0).z < -MB_D * 0.4,
        dArch ? `z=${inFrame(g, dArch, 0, 0, 0).z.toFixed(1)}` : 'missing');
      assert('mailbox: the door arch is inset just inside the box arch (0.94·W/2)',
        !!dArch && Math.abs(dArch.geometry.parameters.radiusTop - MB_W / 2 * 0.94) < 1,
        dArch ? `r=${dArch.geometry.parameters.radiusTop.toFixed(1)}` : '');
      const latch = findTag(g, 'mailLatch');
      const latchTop = latch ? inFrame(g, latch, 0, latch.geometry.parameters.height / 2, 0).y : 0;
      assert('mailbox: latch tab stands ABOVE the crest', !!latch && latchTop > MB_HT,
        latch ? `top=${latchTop.toFixed(1)} crest=${MB_HT}` : 'missing');
      assert('mailbox: latch tab is proud of the door face (z < -D/2)',
        !!latch && inFrame(g, latch, 0, 0, 0).z < -MB_D * 0.4);
      const plate = findTag(g, 'mailPlate');
      assert('mailbox: "U.S. MAIL" decal plane is tagged userData.textPlane',
        !!plate && plate.userData.textPlane === true && !!plate.material.map);
      assert('mailbox: the decal plane is a FLAT unlit material, outline-skipped',
        !!plate && plate.material.type === 'MeshBasicMaterial' && plate.userData.outlineSkip === true,
        plate ? plate.material.type : 'missing');
      const caps = allTagged(g, 'mailRearCap');
      const capArch = caps.find(o => o.geometry.type === 'CylinderGeometry');
      assert('mailbox: rear cap closes the +Z end (arch-profile mesh at z > 0)',
        caps.length === 2 && !!capArch && inFrame(g, capArch, 0, 0, 0).z > MB_D * 0.4,
        `caps=${caps.length}` + (capArch ? ` z=${inFrame(g, capArch, 0, 0, 0).z.toFixed(1)}` : ''));
    }
  }

  // ── dispose probe: badge CanvasTexture freed on rebuild ──────────────────
  function testDispose() {
    const mb = { id: 'mb_d', x: 1000, y: 1000, w: 250, h: 350, kind: 'mailbox', mailCount: { countEntity: 'sensor.mail' } };
    const states = { 'sensor.mail': { state: '5', attributes: {} } };
    build([mb], states);
    const g = findByFixtureId(r._floorGroup, 'mb_d');
    let tex = null;
    g.traverse(o => { if (o.isSprite && o.material && o.material.map) tex = o.material.map; });
    assert('badge sprite carries a CanvasTexture', !!tex);
    let disposed = 0;
    if (tex) { const orig = tex.dispose.bind(tex); tex.dispose = () => { disposed++; orig(); }; }
    build([{ ...mb }], states);   // rebuild → _disposeSpriteMaps frees the old badge map
    assert('badge CanvasTexture disposed on rebuild', disposed >= 1, `disposed=${disposed}`);
  }

  testCar();
  testEv();
  testChargingCar();
  testMailbox();
  testDispose();

  const pass = results.filter(x => x.startsWith('PASS')).length;
  const fail = results.filter(x => x.startsWith('FAIL')).length;
  document.title = `VEHICLEMAIL ${fail === 0 ? 'PASS' : 'FAIL'} ${pass}/${pass + fail} | ` + results.join(' · ');
</script>
